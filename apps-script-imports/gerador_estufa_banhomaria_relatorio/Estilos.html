<style>
  :root {
    --bg: #0d1117;
    --bg-2: #111827;
    --panel: #161b22;
    --panel-2: #0f172a;
    --panel-soft: #1f2937;
    --text: #e5e7eb;
    --text-strong: #f8fafc;
    --muted: #94a3b8;
    --muted-2: #64748b;
    --accent: #22c55e;
    --accent-2: #38bdf8;
    --accent-soft: rgba(34, 197, 94, 0.14);
    --accent-border: rgba(34, 197, 94, 0.35);
    --warning: #f59e0b;
    --danger: #ef4444;
    --success: #22c55e;
    --border: #30363d;
    --border-strong: #475569;
    --input: #0b1220;
    --input-hover: #111827;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    --shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.24);
    --radius: 8px;
    --radius-sm: 6px;
    --transition: 0.16s ease;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.10), transparent 26rem),
      radial-gradient(circle at 85% 10%, rgba(34, 197, 94, 0.08), transparent 24rem),
      linear-gradient(180deg, #0d1117 0%, #0b1020 100%);
    color: var(--text);
    padding-bottom: 44px;
  }

  img { max-width: 100%; }
  a { color: var(--accent-2); }
  .hidden { display: none !important; }

  /* Trava global de tamanho pra checkbox/radio — sem isso, zoom do
     navegador ou configurações de acessibilidade do Windows (Alto
     Contraste, "Texto em negrito") fazem a caixinha aparecer enorme e
     desproporcional ao texto (bug real encontrado no Portal, mesma família
     de módulos, 2026-08-21). */
  input[type="checkbox"],
  input[type="radio"] {
    width: 16px !important;
    height: 16px !important;
    min-width: 16px !important;
    min-height: 16px !important;
    max-width: 16px !important;
    max-height: 16px !important;
    margin: 0;
    accent-color: var(--accent);
    forced-color-adjust: none;
  }

  .wrap {
    max-width: 1560px;
    margin: 0 auto;
    padding: 18px;
  }

  .header-card {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(13, 17, 23, 0.92) !important;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    box-shadow: var(--shadow-soft);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    backdrop-filter: blur(14px);
  }

  .header-card::before {
    content: "";
    width: 4px;
    align-self: stretch;
    min-height: 58px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    order: -1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
    flex: 1;
  }

  .logo-img {
    height: 56px;
    max-width: 230px;
    object-fit: contain;
    display: block;
    background: #f8fafc;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 7px;
    padding: 7px 10px;
  }

  .title-area { min-width: 0; }
  .title-area h1 {
    margin: 0;
    font-size: 19px;
    color: var(--text-strong);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .title-area p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }

  .header-widgets { color: var(--muted) !important; }
  #clockWidget {
    color: var(--text) !important;
    font-family: Consolas, Monaco, monospace;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 9px;
  }
  #perfWidget {
    background: rgba(34, 197, 94, 0.12) !important;
    color: #86efac !important;
    border: 1px solid rgba(34, 197, 94, 0.28);
    border-radius: 6px !important;
  }

  .status-badge {
    background: rgba(34, 197, 94, 0.14);
    color: #86efac;
    padding: 7px 12px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 12px;
    white-space: nowrap;
    border: 1px solid rgba(34, 197, 94, 0.30);
    letter-spacing: 0;
  }
  .status-badge.is-danger { background: rgba(239,68,68,.14); color: #fca5a5; border-color: rgba(239,68,68,.32); }
  .status-badge.is-warning { background: rgba(245,158,11,.14); color: #fcd34d; border-color: rgba(245,158,11,.32); }
  .status-badge.is-neutral { background: rgba(148,163,184,.12); color: #cbd5e1; border-color: rgba(148,163,184,.28); }

  .action-bar {
    margin-bottom: 14px !important;
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)) !important;
    gap: 10px !important;
    padding: 12px !important;
    background: rgba(22, 27, 34, 0.86) !important;
    border: 1px solid var(--border) !important;
    border-radius: var(--radius) !important;
    box-shadow: var(--shadow-soft) !important;
  }

  .grid-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.75fr) minmax(340px, 0.75fr);
    gap: 14px;
    align-items: start;
  }

  .panel {
    background: linear-gradient(180deg, rgba(22, 27, 34, 0.98), rgba(15, 23, 42, 0.98));
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border);
  }

  .panel h2 {
    margin: 0 0 16px;
    font-size: 14px;
    color: var(--text-strong);
    border-bottom: 1px solid var(--border);
    padding-bottom: 11px;
    line-height: 1.35;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  .panel h2::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px rgba(34,197,94,.65);
    vertical-align: 1px;
  }

  .panel-subtitle { margin: -6px 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }

  .section-divider {
    margin: 22px 0 14px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-2);
    background: rgba(15, 23, 42, 0.72);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    color: #bfdbfe;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 205px; }
  .form-group.w-100 { flex: 1 1 100%; }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #cbd5e1;
    line-height: 1.35;
  }

  .field-help { display: block; margin-top: 6px; font-size: 11px; color: var(--muted-2); line-height: 1.45; }

  .form-control {
    width: 100%;
    min-height: 42px;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text);
    transition: all var(--transition);
    background: var(--input);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .form-control:hover { border-color: #475569; background: var(--input-hover); }
  .form-control:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .form-control[disabled], .form-control[readonly] { background: #111827; color: #64748b; cursor: not-allowed; }

  textarea.form-control {
    min-height: 172px;
    resize: vertical;
    font-family: Consolas, Monaco, monospace;
    font-size: 12px;
    white-space: pre;
    line-height: 1.5;
  }
  select.form-control { cursor: pointer; }

  .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 6px; }
  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 12px;
    color: #dbeafe;
  }
  .check-item input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

  .check-grid-multiarquivo { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .check-item-com-import { flex-wrap: wrap; align-items: flex-start; }
  .check-item-com-import .sensor-arquivo { flex: 1 1 100%; margin-top: 4px; }

  #sensoresGrid { grid-template-columns: repeat(auto-fill, minmax(52px, max-content)); justify-content: start; }
  #sensoresGrid .check-item { padding: 6px 8px; gap: 6px; }

  .btn-container { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    padding: 11px 16px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    text-align: center;
    min-height: 42px;
    letter-spacing: 0;
  }
  .btn:disabled { opacity: 0.62; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .btn-primary {
    background: linear-gradient(180deg, #22c55e, #16a34a) !important;
    color: #052e16 !important;
    border-color: rgba(134, 239, 172, 0.34) !important;
    box-shadow: 0 10px 24px rgba(34, 197, 94, 0.20);
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-secondary {
    background: #111827 !important;
    color: #dbeafe !important;
    border: 1px solid var(--border) !important;
  }
  .btn-secondary:hover:not(:disabled) { background: #1f2937 !important; border-color: #64748b !important; transform: translateY(-1px); }
  .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 10px 24px rgba(239,68,68,.20); }
  .btn-danger:hover:not(:disabled) { background: #dc2626; transform: translateY(-1px); }

  .btn-warning-simulado,
  #btnRelatorioInterno {
    background: linear-gradient(180deg, #f59e0b, #b45309) !important;
    border-color: rgba(252, 211, 77, 0.38) !important;
    color: #111827 !important;
  }

  .btn-download {
    display: block;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    color: #052e16;
    padding: 14px;
    text-align: center;
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    border: 1px solid rgba(134, 239, 172, 0.34);
    box-shadow: 0 10px 24px rgba(34,197,94,.20);
    transition: all var(--transition);
  }
  .btn-download:hover { filter: brightness(1.06); transform: translateY(-1px); }

  .alert-box {
    margin-top: 14px;
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    font-size: 13px;
    line-height: 1.55;
    border: 1px solid transparent;
  }
  .alert-box.success { background: rgba(34,197,94,.12); color: #bbf7d0; border-color: rgba(34,197,94,.30); }
  .alert-box.warning { background: rgba(245,158,11,.12); color: #fde68a; border-color: rgba(245,158,11,.30); }
  .alert-box.error { background: rgba(239,68,68,.12); color: #fecaca; border-color: rgba(239,68,68,.30); }

  .terminal-wrap { margin-top: 12px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); box-shadow: inset 0 1px 0 rgba(255,255,255,0.02); }
  .terminal-header { background: #010409; color: #94a3b8; padding: 10px 12px; font-size: 11px; font-weight: 800; border-bottom: 1px solid var(--border); letter-spacing: 0; }
  .terminal {
    background: #010409;
    color: #86efac;
    padding: 14px;
    font-family: Consolas, Monaco, monospace;
    font-size: 12px;
    height: 520px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.55;
  }
  .terminal .success { color: #4ade80; font-weight: 800; }
  .terminal .error { color: #fb7185; font-weight: 800; }
  .terminal .warn { color: #facc15; font-weight: 800; }

  .table-wrapper { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 460px; background: #0b1220; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 780px; }
  .data-table th { position: sticky; top: 0; background: #111827; color: #e0f2fe; text-align: left; padding: 11px; z-index: 2; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .data-table td { padding: 9px 11px; border-bottom: 1px solid rgba(48,54,61,.75); vertical-align: top; color: #cbd5e1; }
  .data-table tr:nth-child(even) { background: rgba(15,23,42,.70); }
  .data-table tr:hover { background: rgba(56,189,248,.08); }
  .table-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .metric-card { background: #0b1220; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; }
  .metric-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .metric-value { font-size: 19px; font-weight: 800; color: #86efac; line-height: 1.2; }
  .metric-value.danger { color: #fb7185; }
  .metric-value.secondary { color: #7dd3fc; }

  #linkResultado { margin-top: 18px; }
  .card-note { margin-top: 12px; padding: 12px 13px; border-left: 3px solid var(--accent-2); background: rgba(56,189,248,.10); border-radius: 6px; color: #bfdbfe; font-size: 13px; line-height: 1.55; }

  #idleAlert { display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(1, 4, 9, 0.78); z-index: 99999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  #idleAlert.show { display: flex !important; }
  .idle-alert-card { width: 100%; max-width: 520px; background: #161b22; border-radius: 10px; border: 1px solid rgba(239,68,68,.45); box-shadow: 0 24px 70px rgba(0,0,0,.45); overflow: hidden; animation: idlePulseIn .22s ease-out; }
  .idle-alert-top { background: linear-gradient(135deg, #991b1b, #7f1d1d); color: #fff; padding: 20px 22px; text-align: center; }
  .idle-alert-icon { font-size: 38px; line-height: 1; margin-bottom: 8px; }
  .idle-alert-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0; }
  .idle-alert-body { padding: 22px; text-align: center; color: var(--text); }
  .idle-alert-text { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: #cbd5e1; }
  .idle-alert-subtext { margin: 0 0 18px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .idle-alert-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .idle-alert-btn { appearance: none; border: none; border-radius: 6px; padding: 12px 18px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all var(--transition); min-width: 180px; }
  .idle-alert-btn.primary { background: var(--accent); color: #052e16; box-shadow: 0 10px 24px rgba(34,197,94,.20); }
  .idle-alert-btn.primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .idle-alert-btn.secondary { background: #111827; color: #dbeafe; border: 1px solid var(--border); }
  .idle-alert-btn.secondary:hover { background: #1f2937; }

  @keyframes idlePulseIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

  @media (max-width: 1100px) { .grid-layout { grid-template-columns: 1fr; } .terminal { height: 340px; } }
  @media (max-width: 768px) {
    .wrap { padding: 10px; }
    .panel { padding: 14px; }
    .header-card { position: static; padding: 14px; }
    .brand { width: 100%; align-items: flex-start; flex-direction: column; gap: 10px; }
    .logo-img { height: 52px; max-width: 210px; }
    .title-area h1 { font-size: 17px; }
    .title-area p { font-size: 12px; }
    .btn { width: 100%; }
    .btn-container { flex-direction: column; }
    .terminal { height: 280px; }
    .idle-alert-card { max-width: 100%; }
    .idle-alert-title { font-size: 20px; }
    .idle-alert-actions { flex-direction: column; }
    .idle-alert-btn { width: 100%; min-width: unset; }
  }

  /* METROLABS COMFORT DARK - paleta ergonomica para uso prolongado */
  :root {
    color-scheme: dark;
    --bg: #111827;
    --bg-2: #172033;
    --card: #1f2937;
    --card-soft: #273244;
    --panel: #1f2937;
    --panel-2: #172033;
    --panel-soft: #273244;
    --surface: #1f2937;
    --surface-2: #172033;
    --surface-3: #273244;
    --input: #172033;
    --input-hover: #1d293a;
    --text: #d9e2ec;
    --text-strong: #eef3f8;
    --muted: #9aa8b8;
    --muted-2: #7f8da0;
    --border: #3a4657;
    --border-strong: #4a5870;
    --accent: #6fbf8f;
    --accent-2: #7aa7c7;
    --metrolabs: #6fbf8f;
    --metrolabs-dark: #4f9f75;
    --metro-green: #6fbf8f;
    --metro-green-dark: #4f9f75;
    --metro-blue: #7aa7c7;
    --metro-blue-dark: #9bbad2;
    --metro-gold: #d6a94f;
    --success: #6fbf8f;
    --info: #7aa7c7;
    --warning: #d6a94f;
    --danger: #e08a8a;
    --success-bg: rgba(111,191,143,.14);
    --info-bg: rgba(122,167,199,.14);
    --warning-bg: rgba(214,169,79,.14);
    --danger-bg: rgba(224,138,138,.13);
    --pending-bg: rgba(214,169,79,.14);
    --pending: #d6a94f;
    --shadow: 0 10px 28px rgba(0,0,0,.22);
    --shadow-soft: 0 8px 22px rgba(0,0,0,.18);
    --shadow-hover: 0 12px 30px rgba(0,0,0,.24);
    --shadow-strong: 0 14px 36px rgba(0,0,0,.28);
  }

  html, body {
    background: #111827 !important;
    color: var(--text) !important;
    text-rendering: optimizeLegibility;
  }

  body,
  .app-shell,
  .main,
  .content,
  .content-area,
  .wrap,
  .container {
    background-image: none !important;
  }

  .header-card,
  .panel,
  .action-bar {
    background: #1f2937 !important;
    background-image: none !important;
    border-color: var(--border) !important;
    color: var(--text) !important;
    box-shadow: var(--shadow-soft) !important;
  }

  .card-body,
  .modal-header,
  .modal-footer,
  .ml-dialog-header,
  .terminal-header,
  .terminal,
  .section-divider,
  .card-note {
    background: #172033 !important;
    background-image: none !important;
    border-color: var(--border) !important;
    color: var(--text) !important;
  }

  h1, h2, h3, h4, h5, h6,
  .title-area h1,
  label,
  strong,
  .fw-bold {
    color: var(--text-strong) !important;
  }

  p,
  .help,
  .field-help,
  .text-muted,
  .panel-subtitle,
  .title-area p,
  small {
    color: var(--muted) !important;
    opacity: 1 !important;
  }

  input,
  select,
  textarea,
  .form-control,
  .form-select {
    background: var(--input) !important;
    color: var(--text-strong) !important;
    border-color: var(--border) !important;
    box-shadow: none !important;
  }

  input:hover,
  select:hover,
  textarea:hover,
  .form-control:hover,
  .form-select:hover {
    background: var(--input-hover) !important;
    border-color: var(--border-strong) !important;
  }

  input:focus,
  select:focus,
  textarea:focus,
  .form-control:focus,
  .form-select:focus {
    border-color: var(--accent-2) !important;
    box-shadow: 0 0 0 3px rgba(122,167,199,.16) !important;
    outline: none !important;
  }

  ::placeholder,
  .form-control::placeholder {
    color: var(--muted-2) !important;
  }

  .btn-primary,
  .btn-success,
  .btn-download {
    background: #6fbf8f !important;
    background-image: none !important;
    border-color: #5aa87b !important;
    color: #102016 !important;
    box-shadow: none !important;
  }

  .btn-secondary,
  .btn-dark,
  .btn-light,
  .btn-outline-secondary,
  .btn-outline-success,
  .btn-download.secondary {
    background: #273244 !important;
    background-image: none !important;
    border: 1px solid var(--border) !important;
    color: #d9e2ec !important;
    box-shadow: none !important;
  }

  button:hover,
  .btn:hover,
  .btn-download:hover {
    filter: none !important;
    transform: none !important;
    background-image: none !important;
  }

  .btn-secondary:hover,
  .btn-dark:hover,
  .btn-light:hover,
  .btn-outline-secondary:hover,
  .btn-outline-success:hover,
  .btn-download.secondary:hover {
    background: #303b4f !important;
    border-color: var(--border-strong) !important;
  }

  .btn-outline-danger,
  .btn-danger {
    background: rgba(224,138,138,.14) !important;
    border-color: rgba(224,138,138,.45) !important;
    color: #f2b8b8 !important;
    box-shadow: none !important;
  }

  .alert-warning,

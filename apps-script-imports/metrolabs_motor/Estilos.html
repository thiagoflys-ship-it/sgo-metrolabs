a<style>
  :root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --card-soft:#f9fafb;
    --text:#1f2937;
    --muted:#6b7280;

    --metro-primary:#007b3e;
    --metro-primary-hover:#005c2e;
    --metro-secondary:#0b4ea2;
    --metro-danger:#dc2626;
    --metro-warning:#d97706;

    --success-bg:#dcfce7;
    --success-border:#bbf7d0;
    --danger-bg:#fee2e2;
    --danger-border:#fecaca;
    --warning-bg:#fef3c7;
    --warning-border:#fde68a;
    --info-bg:#eff6ff;
    --info-border:#bfdbfe;

    --border:#e5e7eb;
    --border-strong:#d1d5db;

    --shadow:0 4px 20px rgba(0,123,62,.08);
    --shadow-soft:0 2px 10px rgba(15,23,42,.06);
    --shadow-strong:0 10px 30px rgba(0,0,0,.12);

    --radius:12px;
    --radius-sm:8px;
    --transition:.2s ease;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    font-family:'Segoe UI',Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }

  img{ max-width:100%; }
  a{ color:var(--metro-secondary); text-decoration:none; }
  a:hover{ text-decoration:underline; }

  button,input,select,textarea{ font:inherit; }

  .hidden{ display:none!important; }

  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:20px;
  }

  .header-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px 24px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
    border-left:6px solid var(--metro-primary);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:18px;
    min-width:0;
    flex:1 1 680px;
  }

  .logo-img{
    height:74px;
    max-width:300px;
    object-fit:contain;
    display:block;
    flex:0 0 auto;
  }

  .title-area{
    min-width:0;
    flex:1 1 auto;
  }

  .title-area h1{
    margin:0;
    font-size:22px;
    line-height:1.2;
    font-weight:800;
    color:var(--metro-primary);
    word-break:break-word;
  }

  .title-area p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }

  .header-widgets{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    text-align:right;
    flex:0 1 auto;
  }

  #clockWidget{
    font-size:14px;
    font-weight:800;
    color:#374151;
  }

  #perfWidget{
    font-size:12px;
    padding:4px 10px;
    border-radius:4px;
    font-weight:800;
    display:inline-block;
    background:var(--success-bg);
    color:#166534;
  }

  .status-badge{
    background:var(--success-bg);
    color:var(--metro-primary);
    padding:8px 16px;
    border-radius:999px;
    font-weight:800;
    font-size:13px;
    white-space:nowrap;
    border:1px solid var(--success-border);
  }

  .status-badge.is-danger{
    background:var(--danger-bg);
    color:#b91c1c;
    border-color:var(--danger-border);
  }

  .status-badge.is-warning{
    background:var(--warning-bg);
    color:#92400e;
    border-color:var(--warning-border);
  }

  .status-badge.is-neutral{
    background:#eef2f7;
    color:#475569;
    border-color:#dbe3ee;
  }

  .action-bar{
    margin-bottom:20px;
    display:flex;
    gap:10px;
    padding:12px;
    background:var(--card);
    border-radius:8px;
    box-shadow:var(--shadow-soft);
    flex-wrap:wrap;
    border:1px solid var(--border);
  }

  .grid-layout{
    display:grid;
    grid-template-columns:minmax(0,2fr) minmax(320px,1fr);
    gap:20px;
  }

  .panel{
    background:var(--card);
    border-radius:var(--radius);
    padding:24px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    min-width:0;
  }

  .panel h2{
    margin:0 0 18px;
    font-size:16px;
    line-height:1.35;
    color:var(--metro-primary);
    border-bottom:2px solid var(--border);
    padding-bottom:10px;
  }

  .panel-subtitle{
    margin:-8px 0 18px;
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
  }

  .section-divider{
    margin:22px 0 18px;
    padding-bottom:8px;
    border-bottom:1px dashed var(--border-strong);
    font-size:13px;
    font-weight:800;
    color:var(--metro-secondary);
    text-transform:uppercase;
    letter-spacing:.3px;
  }

  .form-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
    flex-wrap:wrap;
  }

  .form-group{
    flex:1 1 220px;
    min-width:200px;
  }

  .form-group.w-100{
    flex:1 1 100%;
    min-width:100%;
  }

  .form-group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    line-height:1.4;
    font-weight:700;
    color:var(--text);
  }

  .field-help{
    display:block;
    margin-top:6px;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
  }

  .form-control{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:14px;
    color:var(--text);
    background:#fff;
    transition:all var(--transition);
  }

  .form-control:hover{
    border-color:#cbd5e1;
  }

  .form-control:focus{
    outline:none;
    border-color:var(--metro-primary);
    box-shadow:0 0 0 3px rgba(0,123,62,.10);
  }

  .form-control[disabled],
  .form-control[readonly]{
    background:#f9fafb;
    color:#6b7280;
    cursor:not-allowed;
  }

  textarea.form-control{
    min-height:160px;
    resize:vertical;
    font-family:Consolas,Monaco,monospace;
    font-size:12px;
    line-height:1.5;
    white-space:pre-wrap;
  }

  select.form-control{
    cursor:pointer;
  }

  .btn-container{
    display:flex;
    gap:12px;
    margin-top:24px;
    flex-wrap:wrap;
  }

  .btn{
    padding:12px 24px;
    border:none;
    border-radius:var(--radius-sm);
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    transition:all var(--transition);
    text-align:center;
    min-height:46px;
  }

  .btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none!important;
    box-shadow:none!important;
  }

  .btn-primary{
    background:var(--metro-primary);
    color:#fff;
    box-shadow:0 4px 14px rgba(0,123,62,.20);
  }

  .btn-primary:hover:not(:disabled){
    background:var(--metro-primary-hover);
    transform:translateY(-1px);
  }

  .btn-secondary{
    background:#f3f4f6;
    color:var(--text);
    border:1px solid var(--border);
  }

  .btn-secondary:hover:not(:disabled){
    background:#e5e7eb;
    transform:translateY(-1px);
  }

  .btn-danger{
    background:var(--metro-danger);
    color:#fff;
    box-shadow:0 4px 14px rgba(220,38,38,.20);
  }

  .btn-danger:hover:not(:disabled){
    background:#b91c1c;
    transform:translateY(-1px);
  }

  .btn-download{
    display:block;
    background:var(--metro-primary);
    color:#fff;
    padding:15px;
    text-align:center;
    border-radius:var(--radius-sm);
    text-decoration:none;
    font-weight:800;
    font-size:15px;
    box-shadow:0 4px 14px rgba(0,123,62,.20);
    transition:all var(--transition);
  }

  .btn-download:hover{
    background:var(--metro-primary-hover);
    transform:translateY(-1px);
    text-decoration:none;
  }

  .alert-box{
    margin-top:16px;
    border-radius:10px;
    padding:14px 16px;
    font-size:13px;
    line-height:1.6;
    border:1px solid transparent;
  }

  .alert-box.success{
    background:var(--success-bg);
    color:#166534;
    border-color:var(--success-border);
  }

  .alert-box.warning{
    background:var(--warning-bg);
    color:#92400e;
    border-color:var(--warning-border);
  }

  .alert-box.error{
    background:var(--danger-bg);
    color:#991b1b;
    border-color:var(--danger-border);
  }

  .terminal-wrap{
    margin-top:15px;
    border-radius:var(--radius-sm);
    overflow:hidden;
    border:1px solid #374151;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
  }

  .terminal-header{
    background:#1f2937;
    color:#e5e7eb;
    padding:10px 14px;
    font-size:12px;
    font-weight:800;
    border-bottom:1px solid #374151;
  }

  .terminal{
    background:#111827;
    color:#a7f3d0;
    padding:15px;
    font-family:Consolas,Monaco,monospace;
    font-size:12px;
    line-height:1.5;
    height:350px;
    overflow-y:auto;
    white-space:pre-wrap;
  }

  .terminal .success{ color:#34d399; font-weight:800; }
  .terminal .error{ color:#f87171; font-weight:800; }
  .terminal .warn{ color:#fbbf24; font-weight:800; }

  .table-wrapper,
  .table-responsive{
    overflow:auto;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:#fff;
  }

  .table-wrapper{ max-height:420px; }

  .data-table,
  .preview-table{
    width:100%;
    min-width:780px;
    border-collapse:collapse;
    font-size:12px;
  }

  .data-table th,
  .preview-table th{
    position:sticky;
    top:0;
    z-index:2;
    background:var(--metro-primary);
    color:#fff;
    text-align:left;
    padding:12px;
    white-space:nowrap;
  }

  .data-table td,
  .preview-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:top;
  }

  .data-table tr:nth-child(even),
  .preview-table tr:nth-child(even){
    background:#f9fafb;
  }

  .data-table tr:hover,
  .preview-table tr:hover{
    background:#eefbf3;
  }

  .table-empty{
    padding:18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  .preview-card,
  .resultado-grid{
    display:grid;
    gap:12px;
  }

  .preview-kpis,
  .resultado-grid{
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  }

  .mini-kpi,
  .metric-card{
    background:var(--card-soft);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
  }

  .mini-kpi strong,
  .metric-label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    color:var(--muted);
  }

  .mini-kpi span,
  .metric-value{
    display:block;
    font-size:20px;
    line-height:1.2;
    font-weight:800;
    color:var(--metro-primary);
  }

  .metric-value.danger{ color:var(--metro-danger); }
  .metric-value.secondary{ color:var(--metro-secondary); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:800;
    background:#eefbf3;
    color:var(--metro-primary);
    border:1px solid #bbf7d0;
  }

  .terminal-like{
    margin-top:12px;
    background:#111827;
    color:#c7f9dc;
    padding:15px;
    border-radius:10px;
    font-family:Consolas,Monaco,monospace;
    font-size:12px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow:auto;
    border:1px solid #1f2937;
  }

  #linkResultado{
    margin-top:20px;
  }

  .card-note{
    margin-top:14px;
    padding:12px 14px;
    border-left:4px solid var(--metro-secondary);
    background:var(--info-bg);
    border-radius:8px;
    color:#1e3a8a;
    font-size:13px;
    line-height:1.6;
  }

  .mode-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
  }

  .inline-note{
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }

  #idleAlert{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(17,24,39,.72);
    z-index:99999;
    align-items:center;
    justify-content:center;
    padding:20px;
    backdrop-filter:blur(2px);
  }

  #idleAlert.show{
    display:flex!important;
  }

  .idle-alert-card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:18px;
    border:2px solid #fecaca;
    box-shadow:0 20px 50px rgba(0,0,0,.28);
    overflow:hidden;
    animation:idlePulseIn .22s ease-out;
  }

  .idle-alert-top{
    background:linear-gradient(135deg,#dc2626,#b91c1c);
    color:#fff;
    padding:22px 24px;
    text-align:center;
  }

  .idle-alert-icon{
    font-size:46px;
    line-height:1;
    margin-bottom:10px;
  }

  .idle-alert-title{
    margin:0;
    font-size:24px;
    font-weight:800;
    letter-spacing:.3px;
  }

  .idle-alert-body{
    padding:24px;
    text-align:center;
    color:var(--text);
  }

  .idle-alert-text{
    margin:0 0 10px;
    font-size:15px;
    line-height:1.6;
    color:#374151;
  }

  .idle-alert-subtext{
    margin:0 0 20px;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }

  .idle-alert-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .idle-alert-btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:all var(--transition);
    min-width:180px;
  }

  .idle-alert-btn.primary{
    background:var(--metro-primary);
    color:#fff;
    box-shadow:0 6px 18px rgba(0,123,62,.24);
  }

  .idle-alert-btn.primary:hover{
    background:var(--metro-primary-hover);
    transform:translateY(-1px);
  }

  .idle-alert-btn.secondary{
    background:#f3f4f6;
    color:var(--text);
    border:1px solid var(--border-strong);
  }

  .idle-alert-btn.secondary:hover{
    background:#e5e7eb;
  }

  @keyframes idlePulseIn{
    from{ opacity:0; transform:scale(.96); }
    to{ opacity:1; transform:scale(1); }
  }

  @media (max-width:1000px){
    .grid-layout{ grid-template-columns:1fr; }
  }

  @media (max-width:768px){
    .wrap{ padding:12px; }

    .panel,
    .header-card{ padding:16px; }

    .brand{
      width:100%;
      flex-direction:column;
      align-items:flex-start;
      gap:12px;
    }

    .header-widgets{
      width:100%;
      align-items:flex-start;
      text-align:left;
    }

    .logo-img{
      height:58px;
      max-width:220px;
    }

    .title-area h1{ font-size:18px; }
    .title-area p{ font-size:12px; }

    .btn{
      width:100%;
    }

    .btn-container{
      flex-direction:column;
    }

    .terminal{
      height:280px;
    }

    .idle-alert-card{
      max-width:100%;
    }

    .idle-alert-title{
      font-size:20px;
    }

    .idle-alert-actions{
      flex-direction:column;
    }

    .idle-alert-btn{
      width:100%;
      min-width:unset;
    }
  }
</style>

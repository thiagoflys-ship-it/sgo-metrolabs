  function Comercial_renderPropostas_(div) {

    div.innerHTML = '<div class="module-shell">' + Comercial_cabecalho_("Propostas", "Proposta numerada (PROP-ano-número) com revisão, folha A4 salva na pasta do cliente e envio pelo \"Enviar documento\". Desconto acima do limite passa pela aprovação do gestor comercial.",

  function Comercial_carregarProps_() {
    var alvoIni = Com_$_("cmProps");
    if (alvoIni && CM.filtroProp.busca) alvoIni.innerHTML = '<div class="cm-vazio">Buscando…</div>';
    Com_chamar_("propostas", CM.filtroProp, function (r) {
      var alvo = Com_$_("cmProps"); if (!alvo) return;
      var verTodas = function () { CM.filtroProp.situacao = "TODAS"; if (Com_$_("cmPSit")) Com_$_("cmPSit").value = "TODAS"; Comercial_carregarProps_(); };
      var fora = Com_avisoForaFiltro_(alvo, r.foraDoFiltro, r.foraDoFiltro === 1 ? "proposta" : "propostas", verTodas);
      if (!r.propostas.length) { alvo.innerHTML = fora + '<div class="cm-vazio">' + (CM.filtroProp.busca ? 'Nenhuma proposta ' + (fora ? 'nesta situação ' : '') + 'com "' + Com_esc_(CM.filtroProp.busca) + '". A busca ignora acentos e maiúsculas, aceita parte do texto e procura também nos itens da proposta; confira a grafia ou apague a busca.' : 'Nenhuma proposta com estes filtros.') + '</div>'; return; }
      alvo.innerHTML = fora + '<div class="cm-lista">' + r.propostas.map(function (p) {
        return '<div class="cm-mini" data-prop="' + Com_esc_(p.id) + '"><b>' + Com_esc_(p.rotulo) + ' · ' + Com_esc_(p.cliente) + '</b>' + Com_esc_(p.titulo) + '<div class="cm-meta" style="margin:4px 0 2px">' + (p.totalTxt ? Com_esc_(p.totalTxt) + ' · ' : '') + 'válida até ' + Com_esc_(p.validaAte) + (CM.ini.gestao ? ' · ' + Com_esc_(p.responsavel) : '') + '</div>' + Com_seloProp_(p) + '</div>';
      }).join("") + '</div>';
      alvo.querySelectorAll("[data-prop]").forEach(function (c) { c.onclick = function () { Comercial_abrirProposta_(c.getAttribute("data-prop")); }; });
    }, function (m) { Com_msg_("cmProps", m); }, { chave: "props" });
  }

  function Comercial_abrirProposta_(id, aviso) {
    // a volta à oportunidade vale só para a abertura feita de dentro dela; aberta pela lista ou pelo Hoje, o voltar só fecha a proposta
    var nova = CM.voltaOpoNova; CM.voltaOpoNova = null;
    CM.voltaOpo = nova && nova.prop === id ? nova : null;
    var g = Com_gaveta_("Proposta", '<div class="cm-vazio">Carregando…</div>');
    Comercial_ligarVoltaOpo_(g, id);
    Com_chamar_("proposta", { id: id }, function (r) { Comercial_desenharProposta_(g, r.proposta, aviso); }, function (m) { Com_$_("cmGavetaCorpo").innerHTML = '<div class="cm-faixa erro">' + Com_esc_(m) + '</div>'; });
    return g;
  }

  /** Etapa 2: proposta aberta de dentro da oportunidade. Fecha pelo voltar e a oportunidade reabre (com os dados de agora). */
  function Comercial_abrirPropostaDaOportunidade_(propId, opoId, aviso) {
    CM.voltaOpoNova = { prop: propId, opo: opoId };

  /** Número da tela para a política: em branco = null (sem padrão); texto que não é número segue como veio (o servidor recusa e diz o quê). */
  function Comercial_numOuNulo_(t) {
    var s = String(t == null ? "" : t).trim().replace(/R\$|%|\s/g, "");
    if (!s) return null;
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(",", ".");
    var n = Number(s);
    return isFinite(n) ? n : String(t);
  }

   * a gestão desmarca o que for de verdade, escreve o motivo e confirma. Nada é apagado: ficam no banco, fora das contas.
   */
  function Comercial_foraDaCurva_(depois) {
    var ov = Com_modal_("Preços fora da curva", '<div id="cmFcCorpo"><div class="cm-vazio">Procurando valores muito longe da referência…</div></div>', '', 760);
    if (window.SGO_NAV && SGO_NAV.empilhar) SGO_NAV.empilhar("Preços fora da curva", function () { ov.remove(); }, { chave: "cm-bp-curva" });
    Com_chamar_("bancoForaDaCurva", {}, function (r) {
      var c = Com_$_("cmFcCorpo"); if (!c) return;
      if (!r.total) { c.innerHTML = '<div class="cm-faixa ok">' + Com_esc_(r.message) + '</div>'; return; }
      c.innerHTML = '<p class="cm-txt">' + Com_esc_(r.message) + '</p>' + (r.limitado ? '<p class="cm-meta">Mostrando os ' + r.linhas.length + ' mais distantes de ' + r.total + '. Depois de confirmar, abra de novo para ver os próximos.</p>' : '') +
        '<label class="cm-check cm-check-grande"><input type="checkbox" id="cmFcTodos" checked> Marcar todos</label>' +
        '<table class="cm-tabela"><thead><tr><th></th><th>Item</th><th class="n">Valor</th><th class="n">Referência</th><th>Leitura</th><th>Origem</th></tr></thead><tbody>' + r.linhas.map(function (x, k) {
          return '<tr><td data-r="Tirar"><label class="cm-check cm-check-grande"><input type="checkbox" data-fc="' + k + '" checked aria-label="Tirar das contas"></label></td><td data-r="Item">' + Com_esc_(x.item) + '<br><span class="cm-meta">' + Com_esc_(x.descricao) + '</span></td>' +
            '<td class="n" data-r="Valor"><b>' + Com_esc_(x.valorTxt) + '</b></td><td class="n" data-r="Referência">' + Com_esc_(x.referenciaTxt) + '</td><td data-r="Leitura">' + Com_esc_(x.leitura) + '</td><td data-r="Origem">' + Com_esc_(x.origemNome + (x.data ? " · " + x.data : "") + (x.confianca === "BAIXA" ? " · confiança baixa" : "")) + '</td></tr>'; }).join("") + '</tbody></table>' +
        Com_campo_("Motivo (vale para todos os marcados; mínimo 10 letras)", '<textarea id="cmFcMot" maxlength="300" placeholder="Ex.: valor lido errado nas propostas antigas do Drive (preço de peça, não do serviço)"></textarea>') +
        '<div id="cmFcMsg"></div><div class="cm-acoes"><button type="button" class="btn-secondary" id="cmFcCanc">Cancelar</button><button type="button" class="btn-primary" id="cmFcOk">Tirar os marcados das contas</button></div>' +
        '<p class="cm-meta">Nada é apagado: os preços ficam no banco, marcados "fora das contas", com o motivo e o seu nome. Para devolver um, abra o item e toque em "Voltar às contas".</p>';
      var caixas = function () { return [].slice.call(c.querySelectorAll("[data-fc]")); };
      Com_$_("cmFcTodos").onchange = function () { var v = this.checked; caixas().forEach(function (x) { x.checked = v; }); };
      Com_$_("cmFcCanc").onclick = function () { ov.remove(); };
      Com_$_("cmFcOk").onclick = function () {
        var ids = caixas().filter(function (x) { return x.checked; }).map(function (x) { return r.linhas[+x.getAttribute("data-fc")].id; });
        if (!ids.length) { Com_msg_("cmFcMsg", "Marque pelo menos um preço, ou toque em Cancelar."); return; }
        Com_chamar_("bancoDesconsiderarLote", { ids: ids, motivo: Com_$_("cmFcMot").value, marca: r.marca }, function (x) { ov.remove(); alert(x.message); if (depois) depois(); }, function (m) { Com_msg_("cmFcMsg", m); }, { carregando: "Tirando os preços das contas…" });
      };
    }, function (m) { Com_msg_("cmFcCorpo", m); });
  }

  /** Painel (gestão): indicadores do banco de preços. */
  function Comercial_painelBanco_(alvo) {
    Com_chamar_("bancoIndicadores", {}, function (r) {
      if (!alvo) return;
      var tab = function (l) { return '<table class="cm-tabela"><thead><tr><th>Item</th><th class="n">Decididas</th><th class="n">Taxa de ganho</th><th class="n">Preço médio ganho</th><th class="n">Preço médio perdido</th></tr></thead><tbody>' + l.map(function (x) { return '<tr><td data-r="Item">' + Com_esc_(x.item) + (x.leitura ? '<br><span class="cm-meta">' + Com_esc_(x.leitura) + '</span>' : '') + '</td><td class="n" data-r="Decididas">' + x.decididas + '</td><td class="n" data-r="Taxa de ganho"><b>' + Com_esc_(x.taxaTxt) + '</b></td><td class="n" data-r="Ganho">' + Com_esc_(x.mediaGanhoTxt) + '</td><td class="n" data-r="Perdido">' + Com_esc_(x.mediaPerdidoTxt) + '</td></tr>'; }).join("") + '</tbody></table>'; };
      var h = '<div class="cm-caixa"><h3>Banco de preços</h3><p class="cm-meta">' + Com_esc_(r.totalPrecos.toLocaleString("pt-BR") + " preços nas contas: " + r.porOrigem.filter(function (o) { return o.n; }).map(function (o) { return o.nome.toLowerCase() + " " + o.n.toLocaleString("pt-BR"); }).join(", ")) + '.</p>';
      if (!r.totalPrecos) h += '<p class="cm-txt">O banco está vazio: faça a carga inicial em Comercial > Banco de preços.</p>';
      // C4: a taxa de ganho por serviço, com a tabela, o mercado e quem ganhou, está no relatório "Preço proposto × ganho ou perdido" (acima)
      h += '<p class="cm-sec">Taxa de ganho por serviço</p><p class="cm-meta">Está no quadro "Preço proposto × ganho ou perdido, por serviço", mais acima, com o preço de tabela, a faixa de mercado e quanto cobrou quem ganhou de nós.</p>';
      if (r.produtos.length) h += '<p class="cm-sec">Produtos</p>' + tab(r.produtos);
      h += '<p class="cm-sec">Principais concorrentes (perdemos para)</p>' + (r.concorrentes.length ? '<ul class="cm-orc-refs">' + r.concorrentes.map(function (c) { return '<li>' + Com_esc_(c.nome + ": " + c.perdas + (c.perdas === 1 ? " perda" : " perdas") + (c.comValor ? " (" + c.comValor + " com o valor do vencedor)" : "")) + '</li>'; }).join("") + '</ul>' : '<p class="cm-meta">Nenhuma perda com o concorrente informado.</p>') +
        (r.perdasSemVencedor ? '<p class="cm-txt">' + r.perdasSemVencedor + ' proposta(s) perdida(s) sem dizer quem ganhou: peça ao vendedor, o Orçamentista usa isso.</p>' : '');
      if (r.vencedoresLicitacoes.length) h += '<p class="cm-sec">Quem mais vence as licitações do banco</p><ul class="cm-orc-refs">' + r.vencedoresLicitacoes.slice(0, 6).map(function (c) { return '<li>' + Com_esc_(c.nome + ": " + c.vezes + (c.ufs ? " (" + c.ufs + ")" : "")) + '</li>'; }).join("") + '</ul>';
      h += '<p class="cm-sec">Itens do catálogo sem preço de referência (' + r.semReferenciaTotal + ')</p>' + (r.semReferencia.length ? '<p class="cm-txt">' + Com_esc_(r.semReferencia.map(function (x) { return x.nome; }).join("; ")) + (r.semReferenciaTotal > r.semReferencia.length ? "; e mais " + (r.semReferenciaTotal - r.semReferencia.length) : "") + '.</p><p class="cm-meta">Nesses itens o preço é só a conta da ficha: vale buscar na internet ou registrar o preço de um concorrente.</p>' : '<p class="cm-meta">Todos os itens ativos têm alguma referência.</p>');
      alvo.innerHTML = h + '</div>';
    }, function (m) { if (alvo) Com_msg_(alvo, m); });
  }

  // =========================================================
  // QUADRO DO FUNIL (KANBAN) E GANTT COMERCIAL (21/10/2026)
  // Servidor: SGO_Comercial_Quadro.js (quadro, gantt), SGO_Comercial_Oportunidades.js (criteriosEtapa, moverEtapa)
  // e SGO_Comercial_Gestora.js (especialista, leituraFunil). Soltar um cartão nunca grava direto: primeiro a tela
  // pergunta o que a metodologia exige e mostra a janela de confirmação; o servidor confere tudo de novo ao gravar.
  // A tela não se redesenha sozinha: recarrega depois de cada ação ou em "Atualizar".
  // =========================================================
  function Comercial_filtroQ_() {
    if (!CM.filtroQ) CM.filtroQ = { funil: "", responsavelId: "", busca: "", area: "", de: Com_hojeIso_(-90), ate: Com_hojeIso_(90), agrupar: "oportunidade" };
    return CM.filtroQ;
  }

  /** Barra de filtros comum ao quadro e ao Gantt. tela: 'kanban' | 'gantt'. */
  function Comercial_filtrosQHtml_(tela) {
    var ini = CM.ini, f = Comercial_filtroQ_();
    var funis = ini.funis.map(function (x) { return { v: x.codigo, t: x.nome }; });
    return '<div class="cm-filtros">' +
      '<div><label for="cmQFunil">Funil</label><select id="cmQFunil">' + Com_opcoes_(funis, tela === "kanban" ? (f.funil || ini.funis[0].codigo) : f.funil, tela === "kanban" ? undefined : "Todos") + '</select></div>' +
      (ini.gestao ? '<div><label for="cmQResp">Vendedor</label><select id="cmQResp">' + Com_opcoes_(ini.equipe.map(function (e) { return { v: e.id, t: e.nome }; }), f.responsavelId, "Toda a equipe") + '</select></div>' : '') +
      '<div style="flex:1 1 180px"><label for="cmQBusca">Buscar</label><input id="cmQBusca" type="search" placeholder="Cliente, unidade, título, código ou contato" value="' + Com_esc_(f.busca || "") + '"></div>' +
      '<div><label for="cmQArea">Área</label><select id="cmQArea">' + Com_opcoes_((CM.areasQ || []).map(function (a) { return { v: a, t: a }; }), f.area, "Todas") + '</select></div>' +
      '<div><label for="cmQDe">De</label><input type="date" id="cmQDe" value="' + Com_esc_(f.de) + '"></div>' +
      '<div><label for="cmQAte">Até</label><input type="date" id="cmQAte" value="' + Com_esc_(f.ate) + '"></div>' +
      (tela === "gantt" ? '<div><label for="cmQAgr">Linhas</label><select id="cmQAgr">' + Com_opcoes_([{ v: "oportunidade", t: "Uma por oportunidade" }, { v: "vendedor", t: "Agrupadas por vendedor" }], f.agrupar) + '</select></div>' : '') +
      '</div>';
  }

  function Comercial_ligarFiltrosQ_(carregar) {
    var f = Comercial_filtroQ_();
    var ler = function () {
      f.funil = Com_$_("cmQFunil").value; f.busca = Com_$_("cmQBusca").value; f.area = Com_$_("cmQArea").value; f.de = Com_$_("cmQDe").value; f.ate = Com_$_("cmQAte").value;
      if (Com_$_("cmQResp")) f.responsavelId = Com_$_("cmQResp").value;
      if (Com_$_("cmQAgr")) f.agrupar = Com_$_("cmQAgr").value;
      carregar();
    };
    ["cmQFunil", "cmQResp", "cmQArea", "cmQDe", "cmQAte", "cmQAgr"].forEach(function (id) { var el = Com_$_(id); if (el) el.onchange = ler; });
    var t = null; Com_$_("cmQBusca").oninput = function () { clearTimeout(t); t = setTimeout(ler, 450); };
  }

  /** As áreas chegam do servidor: atualiza só as opções do filtro (sem mexer no que está sendo digitado). */
  function Comercial_atualizarAreasQ_(areas) {
    CM.areasQ = areas || [];
    var sel = Com_$_("cmQArea");
    if (!sel || document.activeElement === sel) return;
    var atual = Comercial_filtroQ_().area;
    sel.innerHTML = Com_opcoes_(CM.areasQ.map(function (a) { return { v: a, t: a }; }), atual, "Todas");
  }

  // ---------------- quadro ----------------
  function Comercial_renderKanban_(div) {
    Comercial_filtroQ_();
    CM.visao = "kanban";
    div.innerHTML = '<div class="module-shell cmk-area">' + Comercial_cabecalho_("Oportunidades", CM_SUB_OPO,
      '<button type="button" class="btn-secondary" id="cmkAtual"><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Atualizar</button>' +
      '<button type="button" class="btn-primary" id="cmkNova"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Nova oportunidade</button>') + Comercial_modosHtml_("kanban") +
      Comercial_filtrosQHtml_("kanban") + '<div id="cmkLeitura"></div><div id="cmkMsg"></div><div id="cmkCorpo"><div class="cm-vazio">Montando o quadro…</div></div></div>';
    Comercial_ligarModos_(div);
    Com_$_("cmkAtual").onclick = Comercial_carregarKanban_;
    Com_$_("cmkNova").onclick = function () { Comercial_formOportunidade_(null); };
    Comercial_ligarFiltrosQ_(Comercial_carregarKanban_);
    Comercial_carregarKanban_();
  }

  function Comercial_carregarKanban_() {
    Com_chamar_("quadro", Comercial_filtroQ_(), function (r) {
      if (!Com_$_("cmkCorpo")) return;
      CM.quadro = r;
      Comercial_filtroQ_().funil = r.funil.codigo;
      Comercial_atualizarAreasQ_(r.areas);
      Com_msg_("cmkMsg", "");
      Comercial_desenharLeitura_(r.leitura, r, null);
      Comercial_desenharQuadro_(r);
    }, function (m) { Com_msg_("cmkMsg", m); }, { chave: "quadro" });
  }

  function Comercial_desenharLeitura_(leitura, q, ia) {
    var alvo = Com_$_("cmkLeitura"); if (!alvo) return;
    var tempos = (ia && ia.tempos) || q.tempos || [];
    var risco = (ia && ia.emRisco) || q.emRisco || [];
    var movel = ehMobileModo_();
    var h = '<div class="cm-gestora cmk-leitura"><div class="ic"><i class="fas fa-user-tie" aria-hidden="true"></i></div><div style="flex:1;min-width:0">' +
      '<p class="t">Leitura do funil · ' + Com_esc_(q.funil.nome) + '</p><p class="s">' + Com_esc_(q.periodoTxt) + ' · ' + (leitura.origem === "IA" ? "texto da especialista, conferido contra os números do sistema" : "pelas regras da metodologia, com os números do sistema") + '</p>' +
      (movel ? '<details><summary class="cm-meta" style="cursor:pointer">Ver a leitura' + (risco.length ? ' (' + risco.length + ' em risco)' : '') + '</summary>' : '') +
      '<p>' + Com_esc_(leitura.texto) + '</p>' +
      (leitura.origem === "IA" && leitura.gargalos && leitura.gargalos.length ? '<p class="cm-txt" style="margin-top:6px"><b>Gargalos</b></p><ul>' + leitura.gargalos.map(function (g) { return '<li>' + Com_esc_(g) + '</li>'; }).join("") + '</ul>' : '') +
      (risco.length ? '<p class="cm-txt" style="margin-top:6px"><b>Em risco</b></p><ul>' + risco.map(function (x) { return '<li><button type="button" class="atv-titulo-link" data-opo-risco="' + Com_esc_(x.id) + '" style="font-size:12.5px">' + Com_esc_(x.codigo) + ' · ' + Com_esc_(x.cliente) + '</button>' + (x.valorTxt ? ' · ' + Com_esc_(x.valorTxt) : '') + ': ' + Com_esc_(x.motivos.join(", ")) + '</li>'; }).join("") + '</ul>' : '') +
      (movel ? '</details>' : '') +
      (ia && ia.aviso ? '<div class="cm-faixa aviso">' + Com_esc_(ia.aviso) + '</div>' : '') +
      '<details style="margin-top:6px"><summary class="cm-meta" style="cursor:pointer">Tempo médio por etapa contra a meta da metodologia</summary><table class="cm-tabela" style="margin-top:6px"><thead><tr><th>Etapa</th><th class="n">Meta</th><th class="n">Média para sair</th><th class="n">Passagens</th><th class="n">Na etapa agora</th><th class="n">Acima do prazo</th></tr></thead><tbody>' +
      tempos.map(function (t) { return '<tr><td data-r="Etapa"><b>' + Com_esc_(t.nome) + '</b></td><td class="n" data-r="Meta">até ' + t.maxDias + ' dias</td><td class="n" data-r="Média para sair"' + (t.acimaDaMeta ? ' style="color:var(--danger);font-weight:700"' : '') + '>' + Com_esc_(t.mediaTxt) + '</td><td class="n" data-r="Passagens">' + t.passagens + '</td><td class="n" data-r="Na etapa agora">' + t.atuais + (t.atuais ? ' (média ' + Com_esc_(t.mediaAtuaisTxt) + ')' : '') + '</td><td class="n" data-r="Acima do prazo"' + (t.acimaDoPrazo ? ' style="color:var(--danger);font-weight:700"' : '') + '>' + t.acimaDoPrazo + '</td></tr>'; }).join("") +
      '</tbody></table><p class="cm-meta">A média conta o tempo de cada passagem já concluída (do registro de entrada na etapa até a saída). "Na etapa agora" são as abertas hoje.</p></details>' +
      '<div class="cm-acoes">' + (q.iaDisponivel && !ia ? '<button type="button" class="btn-secondary" id="cmkPedirLeitura"><i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>&nbsp;Pedir a leitura da especialista</button>' : '') +
      (ia && ia.sugestaoId && leitura.origem === "IA" ? '<button type="button" class="btn-secondary" id="cmkLUsei">Usei</button><button type="button" class="btn-secondary" id="cmkLDesc">Não serviu</button>' : '') + '</div>' +
      (!q.iaDisponivel ? '<p class="s" style="margin-top:6px">Sem a chave da IA, a leitura sai pelas regras (os números são os mesmos).</p>' : '') +
      '<p class="s" style="margin-top:4px">A leitura só aponta: nenhuma oportunidade muda de etapa e nada é enviado ao cliente por ela.</p></div></div>';
    alvo.innerHTML = h;
    alvo.querySelectorAll("[data-opo-risco]").forEach(function (b) { b.onclick = function () { Comercial_abrirOportunidade_(b.getAttribute("data-opo-risco")); }; });
    var bL = Com_$_("cmkPedirLeitura");
    if (bL) bL.onclick = function () {
      Com_chamar_("leituraFunil", Object.assign({}, Comercial_filtroQ_(), { comIA: true }), function (x) { Comercial_desenharLeitura_(x.leitura, q, x); }, function (m) { Com_msg_("cmkMsg", m); }, { carregando: "A especialista está lendo o funil com os números do sistema…" });
    };
    var dec = function (decisao, motivo, b) { Com_chamar_("decidirSugestao", { sugestaoId: ia.sugestaoId, decisao: decisao, motivo: motivo || "" }, function () { b.textContent = "Anotado"; b.disabled = true; }, function (m) { alert(m); }); };
    if (Com_$_("cmkLUsei")) Com_$_("cmkLUsei").onclick = function () { dec("USEI", "", this); };
    if (Com_$_("cmkLDesc")) Com_$_("cmkLDesc").onclick = function () { var b = this, m = window.prompt("Por que a leitura não serviu? (a gestão usa isso para ajustar a metodologia)"); if (m && m.trim().length >= 5) dec("DESCARTEI", m.trim(), b); else if (m !== null) alert("Escreva pelo menos 5 letras."); };
  }

  function Comercial_cartaoQHtml_(c, fechada) {
    var ini = CM.ini;
    var cls = fechada ? (c.situacao === "GANHA" ? "ganha" : "perdida") : (c.selos.some(function (s) { return s.cor === "vermelho"; }) ? "risco" : c.selos.some(function (s) { return s.cor === "laranja"; }) ? "atencao" : "");
    return '<div class="cmk-card ' + cls + '" draggable="' + (c.podeMover ? "true" : "false") + '" data-cmk="' + Com_esc_(c.id) + '" tabindex="0" aria-label="' + Com_esc_(c.codigo + " " + c.cliente) + '">' +

      '<p class="cmk-l">' + Com_esc_(c.codigo) + (c.valorTxt ? ' · ' + Com_esc_(c.valorTxt) : '') + (ini.gestao ? ' · ' + Com_esc_(c.responsavel) : '') + '</p>' +
      (fechada ? '<p class="cmk-l">' + (c.situacao === "GANHA" ? "Ganha em " : "Perdida em ") + Com_esc_(c.fechadaEm) + (c.motivoPerda ? ' · ' + Com_esc_(c.motivoPerda) : '') + '</p>'
        : '<p class="cmk-l"><b>Próxima:</b> ' + Com_esc_(c.proximaAcao || "nenhuma") + (c.proximaEm ? ' (' + Com_esc_(c.proximaEm) + ')' : '') + '</p>' +
          '<p class="cmk-l">Sem contato há ' + c.diasSemContato + (c.diasSemContato === 1 ? ' dia' : ' dias') + ' · ' + c.diasNaEtapa + (c.diasNaEtapa === 1 ? ' dia' : ' dias') + ' na etapa' + (c.previsao ? ' · fechamento previsto ' + Com_esc_(c.previsao) : '') + '</p>') +
      '<div style="margin-top:4px">' + c.selos.map(function (s) { return '<span class="cm-selo ' + Com_esc_(s.cor) + '">' + Com_esc_(s.texto) + '</span>'; }).join("") + '</div>' +
      (fechada ? '' : '<div class="cmk-bts">' + (c.podeMover ? '<button type="button" class="btn-secondary" data-cmk-mover="' + Com_esc_(c.id) + '">Mover para</button>' : '') +
        '<button type="button" class="btn-secondary" data-cmk-esp="' + Com_esc_(c.id) + '"><i class="fas fa-user-tie" aria-hidden="true"></i>&nbsp;Pedir à especialista</button></div>') + '</div>';
  }

  function Comercial_desenharQuadro_(r) {
    var alvo = Com_$_("cmkCorpo"); if (!alvo) return;
    var porId = {};
    var col = function (c, fechadas) {
      c.cartoes.forEach(function (k) { porId[k.id] = k; });
      var info = fechadas ? (c.valorTxt ? c.valorTxt : '') : (c.probabilidade + '%' + (c.maxDias ? ' · meta até ' + c.maxDias + ' dias' : ''));
      return '<div class="cmk-col' + (fechadas ? ' fechadas' : '') + '" data-cmk-col="' + Com_esc_(c.codigo) + '"><div class="cmk-col-cab"><b>' + Com_esc_(c.nome) + '</b><span>' + c.qtd + (c.qtd === 1 ? ' oportunidade' : ' oportunidades') + (!fechadas && c.valorTxt ? ' · ' + Com_esc_(c.valorTxt) : '') + '</span><br><span>' + Com_esc_(info) + '</span></div>' +
        '<div class="cmk-col-corpo">' + (c.cartoes.length ? c.cartoes.map(function (k) { return Comercial_cartaoQHtml_(k, fechadas); }).join("") : '<div class="cm-meta" style="text-align:center;padding:14px 0">' + (fechadas ? "Nenhuma no período" : "Arraste uma oportunidade para cá") + '</div>') +
        (fechadas && c.qtd > c.cartoes.length ? '<p class="cm-meta">Mostrando as ' + c.cartoes.length + ' mais recentes.</p>' : '') + '</div></div>';
    };
    var total = r.colunas.reduce(function (s, c) { return s + c.qtd; }, 0);
    alvo.innerHTML = '<p class="cm-meta">' + total + (total === 1 ? ' oportunidade aberta' : ' oportunidades abertas') + ' no funil ' + Com_esc_(r.funil.nome) + '. ' +
      (ehMobileModo_() ? 'Deslize para os lados dentro do quadro para ver as outras etapas. Toque em "Mover para" para mudar de etapa.' : 'Role o quadro para os lados para ver as outras etapas. Arraste o cartão ou use "Mover para".') + '</p>' +
      '<div class="cmk-quadro" id="cmkQuadro">' + r.colunas.map(function (c) { return col(c, false); }).join("") + col(r.ganhas, true) + col(r.perdidas, true) + '</div>';
    CM.quadroCartoes = porId;
    var arrastando = "";
    alvo.querySelectorAll(".cmk-card").forEach(function (el) {
      el.addEventListener("dragstart", function (ev) { arrastando = el.getAttribute("data-cmk"); el.classList.add("arrastando"); try { ev.dataTransfer.setData("text/plain", arrastando); ev.dataTransfer.effectAllowed = "move"; } catch (e) {} });
      el.addEventListener("dragend", function () { el.classList.remove("arrastando"); alvo.querySelectorAll(".cmk-col").forEach(function (k) { k.classList.remove("alvo"); }); });
      el.addEventListener("click", function (ev) { if (ev.target.closest("button")) return; Comercial_abrirOportunidade_(el.getAttribute("data-cmk")); });
      el.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target === el) Comercial_abrirOportunidade_(el.getAttribute("data-cmk")); });
    });
    alvo.querySelectorAll(".cmk-col").forEach(function (k) {
      k.addEventListener("dragover", function (ev) { ev.preventDefault(); k.classList.add("alvo"); });
      k.addEventListener("dragleave", function () { k.classList.remove("alvo"); });
      k.addEventListener("drop", function (ev) {
        ev.preventDefault(); k.classList.remove("alvo");
        var id = arrastando; try { id = ev.dataTransfer.getData("text/plain") || id; } catch (e) {}
        arrastando = "";
        if (porId[id]) Comercial_kanbanSoltar_(porId[id], k.getAttribute("data-cmk-col"));
      });
    });
    alvo.querySelectorAll("[data-cmk-mover]").forEach(function (b) { b.onclick = function () { Comercial_kanbanMoverPara_(porId[b.getAttribute("data-cmk-mover")]); }; });
    alvo.querySelectorAll("[data-cmk-esp]").forEach(function (b) { b.onclick = function () { Comercial_especialista_(b.getAttribute("data-cmk-esp")); }; });
  }

  /** Alternativa ao arrastar (celular, teclado): lista das etapas, Ganha e Perdida. */
  function Comercial_kanbanMoverPara_(c) {
    var q = CM.quadro; if (!q || !c) return;
    var ov = Com_modal_("Mover " + c.codigo + " · " + c.cliente, '<p class="cm-meta">Escolha para onde mover. O sistema confere os critérios de saída antes; nada muda sem você confirmar.</p><div class="cmk-lista-mover">' +
      q.colunas.map(function (k) { return '<button type="button" class="btn-secondary" data-dest="' + Com_esc_(k.codigo) + '"' + (k.codigo === c.etapa ? ' disabled' : '') + '>' + Com_esc_(k.nome) + ' (' + k.probabilidade + '%)' + (k.codigo === c.etapa ? ' · etapa atual' : '') + '</button>'; }).join("") +
      '<button type="button" class="btn-secondary" data-dest="GANHA">Ganha (registrar o aceite do cliente)</button><button type="button" class="btn-secondary" data-dest="PERDIDA">Perdida (motivo e aprendizado)</button></div>', '<button type="button" class="btn-secondary" data-x="c">Cancelar</button>', 480);
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    ov.querySelectorAll("[data-dest]").forEach(function (b) { b.onclick = function () { ov.remove(); Comercial_kanbanSoltar_(c, b.getAttribute("data-dest")); }; });
  }

  function Comercial_kanbanSoltar_(c, destino) {
    if (!c || !destino || destino === c.etapa && c.situacao === "ABERTA") return;
    if (c.situacao !== "ABERTA") { alert("A oportunidade " + c.codigo + " está encerrada e não muda de coluna pelo quadro. Para voltar a trabalhá-la, abra a oportunidade: o vendedor pede a reabertura e a gestão comercial decide (com a próxima ação)."); return; }
    if (!c.podeMover) { alert("Não foi possível mover: a oportunidade " + c.codigo + " é de " + (c.responsavel || "outra pessoa") + ". Quem move é o responsável ou a gestão comercial."); return; }
    var depois = function () { Comercial_carregarKanban_(); };
    if (destino === "GANHA") Comercial_kanbanGanhar_(c, depois);
    else if (destino === "PERDIDA") Comercial_kanbanPerder_(c, depois);
    else Comercial_mudarEtapaJanela_(c.id, destino, depois);
  }

  /**
   * Janela de mudança de etapa (quadro e ficha da oportunidade): pergunta ao servidor o que a metodologia exige, mostra o que
   * falta (com o caminho na tela), a lista da etapa para confirmar, a próxima ação (se faltar) e o motivo (ao voltar).
   */
  function Comercial_mudarEtapaJanela_(id, etapa, depois) {
    Com_chamar_("criteriosEtapa", { id: id, etapa: etapa }, function (c) {
      var o = c.oportunidade, ini = CM.ini;
      if (c.sentido === "IGUAL") { alert("A oportunidade " + o.codigo + " já está nesta etapa."); return; }
      var grupos = {}, ordem = [];
      c.confirmar.forEach(function (x, i) { if (!grupos[x.etapa]) { grupos[x.etapa] = { nome: x.etapaNome, itens: [] }; ordem.push(x.etapa); } grupos[x.etapa].itens.push({ x: x, i: i }); });
      var corpo = '<p class="cm-txt"><b>' + Com_esc_(o.cliente) + '</b> · ' + Com_esc_(o.titulo) + '</p><p class="cm-txt">De <b>' + Com_esc_(c.origem.nome) + '</b> para <b>' + Com_esc_(c.destino.nome) + '</b> (' + c.destino.probabilidade + '%)' + (c.sentido === "RECUO" ? ', voltando de etapa.' : '.') + '</p>';
      if (c.faltas.length) corpo += '<div class="cm-faixa erro">Ainda não dá para mover. A oportunidade continua em ' + Com_esc_(c.origem.nome) + ' até resolver:</div>' + c.faltas.map(function (f) { return '<div class="cmk-falta"><b>' + Com_esc_(f.texto) + '</b><br>O que fazer: ' + Com_esc_(f.oQueFazer) + '</div>'; }).join("");
      if (ordem.length) corpo += '<p class="cm-sec">Critérios de saída (confirme só o que foi feito de verdade)</p>' + ordem.map(function (k) {
        return '<p class="cm-meta" style="margin:6px 0 2px">Etapa ' + Com_esc_(grupos[k].nome) + '</p>' + grupos[k].itens.map(function (it) { return '<label class="cm-check"><input type="checkbox" data-crit="' + it.i + '"' + (it.x.confirmado ? " checked" : "") + (it.x.jaGravado ? " disabled" : "") + '> ' + Com_esc_(it.x.texto) + (it.x.jaGravado ? ' <span class="cm-meta">(já confirmado antes)</span>' : '') + '</label>'; }).join("");
      }).join("");
      if (c.precisaProxima) corpo += '<p class="cm-sec">Próxima ação (a oportunidade está sem nenhuma)</p><div class="cm-grade3">' + Com_campo_("O que fazer", '<input id="cmJAcao" maxlength="300">') + Com_campo_("Data", '<input id="cmJData" type="date" value="' + Com_hojeIso_(1) + '">') + Com_campo_("Hora", '<input id="cmJHora" type="time" value="10:00">') + '</div>' +
        Com_campo_("Como", '<select id="cmJTipo">' + Com_opcoes_(Object.keys(ini.tiposContato).map(function (k) { return { v: k, t: ini.tiposContato[k] }; }), "LIGACAO") + '</select>');
      if (c.precisaMotivo) corpo += Com_campo_("Por que voltar de etapa? (fica no histórico, mínimo 10 letras)", '<textarea id="cmJMotivo" maxlength="1000"></textarea>');
      corpo += '<div id="cmJMsg"></div>';
      var pode = !c.faltas.length;
      var ov = Com_modal_("Mudar a etapa de " + o.codigo, corpo, '<button type="button" class="btn-secondary" data-x="c">' + (pode ? "Cancelar" : "Fechar") + '</button>' + (!pode ? '<button type="button" class="btn-secondary" data-x="abrir">Abrir a oportunidade</button>' : '') +
        (pode ? '<button type="button" class="btn-primary" data-x="ok">Mover para ' + Com_esc_(c.destino.nome) + '</button>' : ''), 600);
      ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
      var ab = ov.querySelector('[data-x="abrir"]'); if (ab) ab.onclick = function () { ov.remove(); Comercial_abrirOportunidade_(o.id); };
      var okb = ov.querySelector('[data-x="ok"]');
      if (okb) okb.onclick = function () {
        var conf = {}, faltando = [];
        ov.querySelectorAll("[data-crit]").forEach(function (cb) { var x = c.confirmar[+cb.getAttribute("data-crit")]; if (cb.checked) (conf[x.etapa] = conf[x.etapa] || []).push(x.texto); else faltando.push(x.texto); });
        if (faltando.length) { Com_msg_("cmJMsg", "Faltam " + faltando.length + (faltando.length === 1 ? " item" : " itens") + " da lista para sair da etapa: " + faltando.join("; ") + ". Se ainda não foram feitos, a oportunidade fica onde está; faça e volte aqui."); return; }
        var d = { id: o.id, etapa: c.destino.codigo, confirmados: conf };
        if (c.precisaProxima) d.proxima = { acao: Com_$_("cmJAcao").value, data: Com_$_("cmJData").value, hora: Com_$_("cmJHora").value, tipo: Com_$_("cmJTipo").value };
        if (c.precisaMotivo) d.motivo = Com_$_("cmJMotivo").value;
        Com_chamar_("moverEtapa", d, function (x) { ov.remove(); Comercial_aposAlterar_(); if (depois) depois(x); }, function (m) { Com_msg_("cmJMsg", m); }, { carregando: "Conferindo e movendo…" });
      };
    }, function (m) { alert(m); });
  }

  /** Soltar em Ganha: o fluxo exige o aceite do cliente registrado na proposta enviada. */
  function Comercial_kanbanGanhar_(c, depois) {
    var l = c.propostasEnviadas || [];
    if (!l.length) {
      var ov0 = Com_modal_("Marcar " + c.codigo + " como ganha", '<div class="cm-faixa aviso">Para marcar como ganha pelo quadro, registre a aprovação do cliente na proposta enviada, com o arquivo do aceite. Esta oportunidade ainda não tem proposta enviada aguardando resposta' + (c.proposta ? ' (a proposta atual está "' + Com_esc_(c.proposta.situacaoNome) + '")' : '') + '.</div>' +
        '<p class="cm-txt">O que fazer: abra a oportunidade, toque em "Nova proposta" (ou abra a proposta em andamento), conclua, gere o documento e envie ao cliente. Quando o cliente aprovar, volte aqui e arraste de novo, ou registre a resposta na proposta.</p><p class="cm-meta">A oportunidade continua na etapa em que estava.</p>',
        '<button type="button" class="btn-secondary" data-x="c">Fechar</button><button type="button" class="btn-primary" data-x="abrir">Abrir a oportunidade</button>', 520);
      ov0.querySelector('[data-x="c"]').onclick = function () { ov0.remove(); };
      ov0.querySelector('[data-x="abrir"]').onclick = function () { ov0.remove(); Comercial_abrirOportunidade_(c.id); };
      return;
    }
    var ov = Com_modal_("Cliente aprovou: " + c.codigo, '<p class="cm-txt"><b>' + Com_esc_(c.cliente) + '</b> · ' + Com_esc_(c.titulo) + '</p>' +
      Com_campo_("Proposta aprovada", '<select id="cmGProp">' + Com_opcoes_(l.map(function (p) { return { v: p.id, t: p.rotulo + " · " + p.situacaoNome + " · válida até " + p.validaAte }; }), l[0].id) + '</select>') +
      Com_campo_("Arquivo do aceite (obrigatório)", '<input type="file" id="cmGArq" accept=".pdf,.png,.jpg,.jpeg,.eml,.msg,.txt,.doc,.docx">', "E-mail de aprovação salvo em PDF, pedido de compra ou proposta assinada. Fica na pasta do cliente.") +
      Com_campo_("Data da resposta", '<input type="date" id="cmGData" value="' + Com_hojeIso_(0) + '">') + Com_campo_("O que o cliente disse", '<textarea id="cmGTexto" maxlength="2000"></textarea>') +
      '<p class="cm-meta">Ao registrar, a proposta fica aprovada, a oportunidade vai para Ganhas e o próximo passo é passar o pedido aos setores (na proposta).</p><div id="cmGMsg"></div>',
      '<button type="button" class="btn-secondary" data-x="c">Cancelar</button><button type="button" class="btn-primary" data-x="ok">Registrar a aprovação</button>', 560);
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    ov.querySelector('[data-x="ok"]').onclick = function () {
      var f = Com_$_("cmGArq").files[0];
      if (!f) { Com_msg_("cmGMsg", "Anexe o arquivo do aceite do cliente (e-mail em PDF, pedido de compra ou proposta assinada). Sem ele a aprovação não é registrada e a oportunidade continua onde está."); return; }
      if (f.size > 10 * 1024 * 1024) { Com_msg_("cmGMsg", "O arquivo passa de 10 MB. Salve em PDF menor e anexe de novo."); return; }
      var rd = new FileReader();
      rd.onload = function () {
        Com_chamar_("respostaCliente", { id: Com_$_("cmGProp").value, resposta: "APROVADA", texto: Com_$_("cmGTexto").value, data: Com_$_("cmGData").value, marcarGanha: true,
          arquivo: { nome: f.name, tipo: f.type || "application/octet-stream", base64: String(rd.result).replace(/^data:[^,]+,/, "") } },
          function (x) { ov.remove(); Comercial_aposAlterar_(); alert(x.message); if (depois) depois(x); }, function (m) { Com_msg_("cmGMsg", m); }, { carregando: "Registrando a aprovação…" });
      };
      rd.readAsDataURL(f);
    };
  }

  /** Soltar em Perdida: motivo da lista e aprendizado (o mesmo da ficha). */
  function Comercial_kanbanPerder_(c, depois) {
    var ini = CM.ini;
    var ov = Com_modal_("Registrar a perda de " + c.codigo, '<p class="cm-txt"><b>' + Com_esc_(c.cliente) + '</b> · ' + Com_esc_(c.titulo) + '</p><p class="cm-meta">' + Com_esc_(ini.regraPerda) + '</p>' +
      Com_campo_("Motivo", '<select id="cmKLMot">' + Com_opcoes_(ini.motivosPerda, "", "Escolha o motivo real") + '</select>') + Com_campo_("O que aconteceu e o que aprender (mínimo 15 letras)", '<textarea id="cmKLApr" maxlength="2000"></textarea>') + Comercial_vencedorHtml_("cmKLV") +
      '<p class="cm-meta">As atividades abertas e as propostas sem resposta desta oportunidade são canceladas (ficam no histórico).</p><div id="cmKLMsg"></div>',
      '<button type="button" class="btn-secondary" data-x="c">Cancelar</button><button type="button" class="btn-primary" data-x="ok">Registrar a perda</button>', 540);
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    ov.querySelector('[data-x="ok"]').onclick = function () {
      Com_chamar_("perder", Object.assign({ id: c.id, motivo: Com_$_("cmKLMot").value, aprendizado: Com_$_("cmKLApr").value }, Comercial_vencedorLer_("cmKLV")), function () { ov.remove(); Comercial_aposAlterar_(); if (depois) depois(); }, function (m) { Com_msg_("cmKLMsg", m); }, { carregando: "Registrando…" });
    };
  }

  // ---------------- especialista ----------------
  // 01/11/2026 (pedido do dono: "especialista mesmo, que defina estratégias, não genérica, e que se uma não der ela bola outra"):
  // diagnóstico, planos A, B e C com o gatilho de troca, a próxima ação com um toque (Minhas atividades) e a memória dos planos
  // tentados (usar, trocar, deu certo, não deu certo). A janela é da pilha do voltar (data-sgo-janela). Depois de cada ação só os
  // blocos da memória e da próxima ação se redesenham; um formulário aberto (motivo, próxima ação) nunca é apagado sozinho.
  function Comercial_especialista_(id) {
    var ov = Com_modal_("Pedir à especialista", '<div class="cm-vazio">A especialista está montando a estratégia desta oportunidade com os fatos do sistema…</div>', '', 780);
    ov.setAttribute("data-sgo-janela", "1");
    ov.classList.add("cm-esp");
    var corpo = ov.querySelector(".atv-modal-corpo");
    Com_chamar_("especialista", { id: id }, function (x) { Comercial_espDesenhar_(ov, x); },
      function (m) { corpo.innerHTML = '<div class="cm-faixa erro">' + Com_esc_(m) + '</div><p class="cm-meta">Nada foi gravado. Feche e tente de novo; se continuar, abra a oportunidade e use "Próximo passo da gestora".</p>'; },
      { carregando: "A especialista está analisando…" });
    return ov;
  }

  function Comercial_espDesenhar_(ov, x) {
    var s = x.sugestao, o = x.oportunidade, corpo = ov.querySelector(".atv-modal-corpo"), st = { mem: x.memoria || {} };
    ov.querySelector("h3").textContent = "Especialista · " + o.codigo + " · " + o.cliente;
    var lista = function (l) { return '<ul class="cm-esp-lista">' + l.map(function (q) { return '<li>' + Com_esc_(q) + '</li>'; }).join("") + '</ul>'; };
    var pa = s.proximaAcao || {};
    corpo.innerHTML = '<p class="cm-meta">' + Com_esc_(o.titulo) + ' · etapa ' + Com_esc_(o.etapaNome) + ' · cenário: ' + Com_esc_(s.cenarioNome || "") + ' · ' +
        (x.origem === "IA" ? "planos da especialista, conferidos contra os dados do sistema" : "planos pelas regras da metodologia, com os fatos do sistema") + '</p>' +
      (x.aviso ? '<div class="cm-faixa aviso">' + Com_esc_(x.aviso) + '</div>' : '') +
      '<div class="cm-esp-diag"><p class="cm-sec">Diagnóstico</p><p class="cm-txt">' + Com_esc_(s.diagnostico) + '</p></div>' +
      '<div id="cmEspMem"></div>' +
      '<div class="cm-esp-prox"><p class="cm-sec">Próxima ação</p><p class="cm-txt"><b>' + Com_esc_(pa.acao) + '</b><br>' + Com_esc_(pa.data) + ' às ' + Com_esc_(pa.hora) + ' · ' + Com_esc_(pa.canalNome) + ' · plano ' + Com_esc_(pa.plano || "A") + '</p>' +
        '<div class="cm-acoes"><button type="button" class="btn-primary" data-esp="criar"><i class="fas fa-calendar-plus" aria-hidden="true"></i>&nbsp;Criar a próxima ação</button></div><div id="cmEspProxForm"></div></div>' +
      '<div class="cm-esp-planos">' + (s.planos || []).map(function (p) { return Comercial_espPlanoHtml_(p); }).join("") + '</div>' +
      (s.perguntas && s.perguntas.length ? '<p class="cm-sec">Perguntas para o cliente</p>' + lista(s.perguntas) : '') +
      '<div id="cmEspHist"></div><p class="cm-meta">' + Com_esc_(x.lembrete) + '</p><div id="cmEspMsg"></div>';
    var rod = document.createElement("div"); rod.className = "atv-modal-rod";
    rod.innerHTML = '<button type="button" class="btn-secondary" data-e="fechar">Fechar</button><button type="button" class="btn-primary" data-e="abrir">Abrir a oportunidade</button>';
    ov.querySelector(".atv-modal").appendChild(rod);
    rod.querySelector('[data-e="fechar"]').onclick = function () { ov.remove(); };
    rod.querySelector('[data-e="abrir"]').onclick = function () { ov.remove(); Comercial_abrirOportunidade_(o.id); };
    var msg = function (m, tipo) { var el = Com_$_("cmEspMsg"); if (el) { el.innerHTML = '<div class="cm-faixa ' + (tipo || "ok") + '">' + Com_esc_(m) + '</div>'; if (el.scrollIntoView) el.scrollIntoView({ block: "nearest" }); } };
    var porLetra = {}; (s.planos || []).forEach(function (p) { porLetra[p.letra] = p; });
    // memória: plano em uso (com o gatilho e o aviso de troca) e o histórico; redesenha só estes blocos
    var desenharMem = function () {
      var m = st.mem || {}, u = m.emUso, el = Com_$_("cmEspMem"), h = '';
      if (u) {
        h = '<div class="cm-faixa ' + (m.gatilhoVencido ? 'aviso' : 'ok') + ' cm-esp-uso"><b>Plano em uso: ' + Com_esc_(u.letra) + ' · ' + Com_esc_(u.titulo) + '</b> <span class="cm-selo verde">Em uso</span>' +
          '<div class="cm-meta">' + Com_esc_(u.abordagemNome) + ' · desde ' + Com_esc_(u.desde) + (u.gatilho ? ' · trocar se: ' + Com_esc_(u.gatilho) : '') + '</div>' +
          (m.gatilhoVencido ? '<p class="cm-txt"><b>' + Com_esc_(m.sugestaoTroca) + '</b> Os planos abaixo já não repetem este.</p>' : '') +
          '<div class="cm-acoes"><button type="button" class="btn-secondary" data-esp="certo">Deu certo</button><button type="button" class="btn-secondary" data-esp="naodeu">Não deu certo</button></div><div id="cmEspDecForm"></div></div>';
      }
      if (el) el.innerHTML = h;
      var hist = Com_$_("cmEspHist"), l = m.historico || [];
      if (hist) hist.innerHTML = l.length ? '<p class="cm-sec">Planos tentados nesta oportunidade</p><div class="cm-hist">' + l.map(function (p) {
        var cor = p.situacao === "DEU_CERTO" ? "verde" : p.situacao === "EM_USO" ? "azul" : p.situacao === "ATUALIZADO" ? "cinza" : "laranja";
        return '<div><b>Plano ' + Com_esc_(p.letra) + ' · ' + Com_esc_(p.titulo) + '</b> <span class="cm-selo ' + cor + '">' + Com_esc_(p.situacaoNome) + '</span>' + (p.motivo ? '<br>' + Com_esc_(p.motivo) : '') +
          '<div class="q">' + Com_esc_(p.abordagemNome) + ' · desde ' + Com_esc_(p.desde) + (p.decididoEm ? ' · decidido em ' + Com_esc_(p.decididoEm) : '') + ' · ' + Com_esc_(p.por) + '</div></div>';
      }).join("") + '</div>' : '';
      // selo e botões dos cartões conforme o plano em uso
      ov.querySelectorAll(".cm-esp-plano").forEach(function (c) {
        var L = c.getAttribute("data-letra"), esteEmUso = !!(u && u.sugestaoId === x.sugestaoId && u.letra === L);
        c.classList.toggle("em-uso", esteEmUso);
        var b = c.querySelector('[data-esp="usar"]');
        if (b) { b.style.display = esteEmUso ? "none" : ""; b.textContent = u ? "Troquei para o plano " + L : "Usar este plano"; }
        var selo = c.querySelector(".cm-esp-selo"); if (selo) selo.style.display = esteEmUso ? "" : "none";
      });
      var bc = el && el.querySelector('[data-esp="certo"]'), bn = el && el.querySelector('[data-esp="naodeu"]');
      if (bc) bc.onclick = function () { Com_chamar_("especialistaDecidirPlano", { planoId: u.id, resultado: "DEU_CERTO" }, function (r) { st.mem = r.memoria; desenharMem(); msg(r.message); }, function (e) { msg(e, "erro"); }); };
      if (bn) bn.onclick = function () {
        var f = Com_$_("cmEspDecForm"); if (!f || f.innerHTML) return;
        f.innerHTML = Com_campo_("Por que não deu certo?", '<textarea id="cmEspDecMot" maxlength="500" placeholder="Ex.: a coordenadora respondeu que a decisão ficou para o ano que vem"></textarea>', "A próxima consulta recebe este motivo e não repete o plano.") +
          '<div class="cm-acoes"><button type="button" class="btn-secondary" data-f="c">Cancelar</button><button type="button" class="btn-primary" data-f="ok">Registrar</button></div>';
        f.querySelector('[data-f="c"]').onclick = function () { f.innerHTML = ""; };
        f.querySelector('[data-f="ok"]').onclick = function () { Com_chamar_("especialistaDecidirPlano", { planoId: u.id, resultado: "NAO_DEU_CERTO", motivo: Com_$_("cmEspDecMot").value }, function (r) { st.mem = r.memoria; desenharMem(); msg(r.message); }, function (e) { msg(e, "erro"); }); };
      };
    };
    // cartões: copiar mensagem, usar ou trocar
    ov.querySelectorAll(".cm-esp-plano").forEach(function (c) {
      var L = c.getAttribute("data-letra"), p = porLetra[L];
      var cp = c.querySelector('[data-esp="copiar"]');
      if (cp) cp.onclick = function () { Com_copiar_((p.mensagem.assunto ? p.mensagem.assunto + "\n\n" : "") + p.mensagem.texto, this); };
      var us = c.querySelector('[data-esp="usar"]');
      if (us) us.onclick = function () {
        var u = st.mem && st.mem.emUso, form = c.querySelector(".cm-esp-form");
        var enviar = function (motivo) { Com_chamar_("especialistaUsarPlano", { sugestaoId: x.sugestaoId, letra: L, motivo: motivo || "" }, function (r) { st.mem = r.memoria; form.innerHTML = ""; desenharMem(); msg(r.message); }, function (e) { msg(e, "erro"); }); };
        if (!u || u.abordagem === p.abordagem) { enviar(""); return; }
        if (form.innerHTML) return;
        form.innerHTML = Com_campo_("Por que o plano " + u.letra + " não andou?", '<textarea maxlength="500" placeholder="Ex.: três mensagens sem resposta; a coordenadora saiu de férias"></textarea>', "O plano " + u.letra + " fica como \"não andou\" e não volta nas próximas consultas.") +
          '<div class="cm-acoes"><button type="button" class="btn-secondary" data-f="c">Cancelar</button><button type="button" class="btn-primary" data-f="ok">Trocar para o plano ' + Com_esc_(L) + '</button></div>';
        form.querySelector('[data-f="c"]').onclick = function () { form.innerHTML = ""; };
        form.querySelector('[data-f="ok"]').onclick = function () { enviar(form.querySelector("textarea").value); };
      };
    });
    // próxima ação com um toque: o formulário vem preenchido; confirmar cria em Minhas atividades
    ov.querySelector('[data-esp="criar"]').onclick = function () {
      var f = Com_$_("cmEspProxForm"); if (!f || f.innerHTML) return;
      var tipos = x.tiposContato || CM.ini.tiposContato || {};
      var atual = x.proximaAtual || {};
      f.innerHTML = '<div class="cm-caixa">' + Com_campo_("Ação", '<input id="cmEspPAcao" maxlength="300" value="' + Com_esc_(pa.acao) + '">') +
        '<div class="cm-grade3">' + Com_campo_("Data", '<input id="cmEspPData" type="date" value="' + Com_esc_(pa.dataIso) + '">') + Com_campo_("Hora", '<input id="cmEspPHora" type="time" value="' + Com_esc_(pa.hora) + '">') +
        Com_campo_("Como", '<select id="cmEspPTipo">' + Com_opcoes_(Object.keys(tipos).map(function (k) { return { v: k, t: tipos[k] }; }), pa.canal) + '</select>') + '</div>' +
        (atual.temAtividade && atual.acao ? '<p class="cm-meta">A próxima ação de agora ("' + Com_esc_(atual.acao) + '", ' + Com_esc_(atual.em) + ') será cancelada e trocada por esta.</p>' : '') +
        '<div class="cm-acoes"><button type="button" class="btn-secondary" data-f="c">Cancelar</button><button type="button" class="btn-primary" data-f="ok">Criar em Minhas atividades</button></div></div>';
      f.querySelector('[data-f="c"]').onclick = function () { f.innerHTML = ""; };
      f.querySelector('[data-f="ok"]').onclick = function () {
        var b = this;
        b.disabled = true;
        Com_chamar_("especialistaCriarAcao", { id: o.id, sugestaoId: x.sugestaoId, letra: pa.plano || "A", acao: Com_$_("cmEspPAcao").value, data: Com_$_("cmEspPData").value, hora: Com_$_("cmEspPHora").value, tipo: Com_$_("cmEspPTipo").value },
          function (r) { f.innerHTML = '<div class="cm-faixa ok">' + Com_esc_(r.message) + '</div>'; var bt = ov.querySelector('[data-esp="criar"]'); if (bt) { bt.disabled = true; bt.textContent = "Próxima ação criada"; } st.mem = r.memoria || st.mem; desenharMem(); Comercial_aposAlterar_(); },
          function (e) { msg(e, "erro"); b.disabled = false; }, { carregando: "Criando a próxima ação…" });
      };
    };
    desenharMem();
  }

  function Comercial_espPlanoHtml_(p) {
    var passos = (p.passos || []).map(function (z) { return '<li><span class="q">' + Com_esc_(z.quando) + ' · ' + Com_esc_(z.canalNome) + '</span>' + Com_esc_(z.acao) + '</li>'; }).join("");
    return '<div class="cm-esp-plano" data-letra="' + Com_esc_(p.letra) + '">' +
      '<div class="cm-esp-cab"><span class="cm-esp-letra">' + Com_esc_(p.letra) + '</span><div class="cm-esp-tit"><b>' + Com_esc_(p.titulo) + '</b><div class="cm-meta">' + Com_esc_(p.abordagemNome) + '</div></div><span class="cm-selo verde cm-esp-selo" style="display:none">Em uso</span></div>' +
      (p.gatilho ? '<div class="cm-esp-gatilho"><b>Quando trocar para este plano:</b> ' + Com_esc_(p.gatilho.texto) + (p.gatilho.ate ? ' <span class="cm-selo laranja">até ' + Com_esc_(p.gatilho.ate) + '</span>' : '') + '</div>' : '') +
      '<p class="cm-txt"><b>Objetivo:</b> ' + Com_esc_(p.objetivo) + '</p><ol class="cm-esp-passos">' + passos + '</ol>' +
      '<p class="cm-sec">Mensagem pronta (' + Com_esc_(p.mensagem.canalNome) + ')</p>' + (p.mensagem.assunto ? '<p class="cm-meta">Assunto: ' + Com_esc_(p.mensagem.assunto) + '</p>' : '') + '<div class="cm-msg">' + Com_esc_(p.mensagem.texto) + '</div>' +
      ((p.objecoes || []).length ? '<p class="cm-sec">Se o cliente disser</p>' + p.objecoes.map(function (b) { return '<p class="cm-txt"><b>"' + Com_esc_(b.objecao) + '"</b><br>' + Com_esc_(b.resposta) + '</p>'; }).join("") : '') +
      (p.sucesso ? '<p class="cm-txt"><b>Deu certo se:</b> ' + Com_esc_(p.sucesso) + '</p>' : '') +
      (p.saida ? '<p class="cm-meta">Prazo deste plano: ' + Com_esc_(p.saida.texto) + '</p>' : '') +
      '<div class="cm-acoes"><button type="button" class="btn-secondary" data-esp="copiar"><i class="fas fa-copy" aria-hidden="true"></i>&nbsp;Copiar mensagem</button><button type="button" class="btn-secondary" data-esp="usar">Usar este plano</button></div><div class="cm-esp-form"></div></div>';
  }

  // ---------------- Gantt ----------------
  function Comercial_renderGantt_(div) {
    Comercial_filtroQ_();
    CM.visao = "gantt";
    div.innerHTML = '<div class="module-shell cmk-area">' + Comercial_cabecalho_("Oportunidades", CM_SUB_OPO,
      '<button type="button" class="btn-secondary" id="cmgAtual"><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Atualizar</button>' +
      '<button type="button" class="btn-primary" id="cmgNova"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Nova oportunidade</button>') + Comercial_modosHtml_("gantt") +
      Comercial_filtrosQHtml_("gantt") + '<div id="cmgMsg"></div><div id="cmgCorpo"><div class="cm-vazio">Montando o Gantt…</div></div></div>';
    Comercial_ligarModos_(div);
    Com_$_("cmgAtual").onclick = Comercial_carregarGantt_;
    Com_$_("cmgNova").onclick = function () { Comercial_formOportunidade_(null); };
    Comercial_ligarFiltrosQ_(Comercial_carregarGantt_);
    Comercial_carregarGantt_();
  }

  function Comercial_carregarGantt_() {
    Com_chamar_("gantt", Comercial_filtroQ_(), function (r) {
      var alvo = Com_$_("cmgCorpo"); if (!alvo) return;
      CM.gantt = r; Comercial_atualizarAreasQ_(r.areas); Com_msg_("cmgMsg", "");
      alvo.innerHTML = Comercial_ganttHtml_(r, alvo.clientWidth || 1000);
      alvo.querySelectorAll("[data-cmg]").forEach(function (g) { g.addEventListener("click", function () { Comercial_ganttDetalhe_(g.getAttribute("data-cmg")); }); });
      alvo.querySelectorAll("[data-cmg-lista]").forEach(function (b) { b.onclick = function () { Comercial_ganttDetalhe_(b.getAttribute("data-cmg-lista")); }; });
    }, function (m) { Com_msg_("cmgMsg", m); }, { chave: "gantt" });
  }

  var CMG_CORES = { ABERTA: "#5b8fb9", GANHA: "#4f9f75", PERDIDA: "#8a96a8" };
  function Comercial_ganttHtml_(r, largura) {
    if (!r.linhas.length) return '<div class="cm-vazio">Nenhuma oportunidade no período e nos filtros escolhidos.</div>';
    var p = function (iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
    var ini = p(r.de), fim = p(r.ate), dias = Math.round((fim - ini) / 864e5) + 1;
    var movel = ehMobileModo_();
    var rotW = movel ? 128 : 250, W = Math.max(largura - 2, rotW + dias * (movel ? 7 : 6)), area = W - rotW - 10, px = area / dias, lh = 30, cab = 40;
    var x = function (iso) { var d = p(iso); if (d === null) return rotW; return Math.max(rotW, Math.min(rotW + area, rotW + (d - ini) / 864e5 * px + px / 2)); };
    var linhas = [];
    var ultimo = null;
    r.linhas.forEach(function (l) {
      if (r.filtros.agrupar === "vendedor" && l.responsavel !== ultimo) { linhas.push({ grupo: l.responsavel }); ultimo = l.responsavel; }
      linhas.push(l);
    });
    var H = cab + linhas.length * lh + 10, s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" role="img" aria-label="Gantt comercial" style="display:block">');
    var meses = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
    var passo = px >= 14 ? 1 : px >= 7 ? 2 : px >= 3 ? 7 : 14;
    for (var i = 0; i < dias; i++) {
      var d = new Date(ini + i * 864e5), xx = rotW + i * px;
      if (d.getUTCDay() === 0 || d.getUTCDay() === 6) s.push('<rect x="' + xx.toFixed(1) + '" y="' + cab + '" width="' + px.toFixed(1) + '" height="' + (H - cab) + '" fill="rgba(127,127,127,.07)"/>');
      if (d.getUTCDate() === 1 || i === 0) s.push('<text x="' + (xx + 2).toFixed(1) + '" y="14" font-size="11" font-weight="700" fill="var(--text)">' + meses[d.getUTCMonth()] + "/" + d.getUTCFullYear() + '</text>');
      if (i % passo === 0) { s.push('<line x1="' + xx.toFixed(1) + '" y1="' + (cab - 6) + '" x2="' + xx.toFixed(1) + '" y2="' + H + '" stroke="rgba(127,127,127,.16)"/>'); s.push('<text x="' + (xx + 2).toFixed(1) + '" y="' + (cab - 10) + '" font-size="10" fill="var(--muted)">' + ("0" + d.getUTCDate()).slice(-2) + '</text>'); }
    }
    var marcador = function (m, cx, cy) {
      var cor = m.atrasado ? "#d64545" : { ENVIO: "#1E4F7A", VALIDADE: "#c2953f", RETORNO: m.concluido ? "#4f9f75" : "#5b6270", APROVADO: "#2e8b57", PASSAGEM: "#6a4fa3" }[m.tipo] || "#555";
      var t = '<title>' + Com_esc_(m.diaTxt + " · " + m.rotulo + (m.atrasado ? " (atrasado)" : "")) + '</title>';
      if (m.tipo === "VALIDADE") return '<g>' + t + '<path d="M' + cx + ' ' + (cy - 6) + ' L' + (cx + 6) + ' ' + cy + ' L' + cx + ' ' + (cy + 6) + ' L' + (cx - 6) + ' ' + cy + ' Z" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';
      if (m.tipo === "RETORNO") return '<g>' + t + '<path d="M' + (cx - 5) + ' ' + (cy + 5) + ' L' + cx + ' ' + (cy - 5) + ' L' + (cx + 5) + ' ' + (cy + 5) + ' Z" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';
      if (m.tipo === "APROVADO" || m.tipo === "PASSAGEM") return '<g>' + t + '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';
      return '<g>' + t + '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';
    };
    linhas.forEach(function (l, idx) {
      var y = cab + idx * lh;
      if (l.grupo !== undefined) { s.push('<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="rgba(127,127,127,.35)"/><text x="8" y="' + (y + 19) + '" font-size="12" font-weight="800" fill="var(--text)">' + Com_esc_(l.grupo) + '</text>'); return; }
      var rot = l.codigo + " · " + l.cliente, max = movel ? 18 : 34; if (rot.length > max) rot = rot.slice(0, max - 1) + "…";
      var hojeIso = r.hoje, fimBarra = l.situacao === "ABERTA" ? (l.previsao || hojeIso) : (l.fim || l.previsao || l.inicio);
      if (fimBarra < l.inicio) fimBarra = l.inicio;
      var x0 = x(l.inicio) - px / 2, x1 = x(fimBarra) + px / 2, by = y + 8, bh = lh - 16;
      var tip = l.codigo + " · " + l.cliente + "\n" + l.titulo + "\nVendedor: " + l.responsavel + "\nEtapa: " + l.etapaNome + " (" + l.funilNome + ")\nCriada em " + l.inicioTxt + (l.previsaoTxt ? "\nPrevisão de fechamento: " + l.previsaoTxt : "\nSem previsão de fechamento") + (l.fimTxt ? "\n" + (l.situacao === "GANHA" ? "Ganha" : "Perdida") + " em " + l.fimTxt : "") + (l.valorTxt ? "\nValor: " + l.valorTxt : "") + (l.atrasada ? "\nATRASADA: a previsão passou e a oportunidade segue aberta" : "");
      s.push('<g data-cmg="' + Com_esc_(l.id) + '" style="cursor:pointer"><title>' + Com_esc_(tip) + '</title><rect x="0" y="' + y + '" width="' + W + '" height="' + lh + '" fill="transparent"/>');
      s.push('<text x="8" y="' + (y + 13) + '" font-size="11.5" font-weight="700" fill="' + (l.atrasada ? "#d64545" : "var(--text)") + '">' + Com_esc_(rot) + '</text><text x="8" y="' + (y + 25) + '" font-size="9.5" fill="var(--muted)">' + Com_esc_((movel ? "" : l.responsavel + " · ") + l.etapaNome).slice(0, movel ? 22 : 44) + '</text>');
      s.push('<rect x="' + x0.toFixed(1) + '" y="' + by + '" width="' + Math.max(4, x1 - x0).toFixed(1) + '" height="' + bh + '" rx="3" fill="' + (CMG_CORES[l.situacao] || "#888") + '"' + (l.semPrevisao && l.situacao === "ABERTA" ? ' fill-opacity=".45" stroke="' + CMG_CORES.ABERTA + '" stroke-dasharray="4 3"' : '') + '/>');
      if (l.atrasada) { var xa = x(l.previsao) + px / 2, xh = x(hojeIso) + px / 2; if (xh > xa) s.push('<rect x="' + xa.toFixed(1) + '" y="' + by + '" width="' + (xh - xa).toFixed(1) + '" height="' + bh + '" fill="rgba(214,69,69,.6)" stroke="#d64545"/>'); }
      l.marcos.forEach(function (m) { if (m.dia < r.de || m.dia > r.ate) return; s.push(marcador(m, x(m.dia).toFixed(1), y + lh / 2)); });
      s.push('</g>');
    });
    if (r.hoje >= r.de && r.hoje <= r.ate) { var xh2 = x(r.hoje); s.push('<line x1="' + xh2.toFixed(1) + '" y1="' + (cab - 4) + '" x2="' + xh2.toFixed(1) + '" y2="' + H + '" stroke="#1E4F7A" stroke-width="2"/><text x="' + (xh2 + 3).toFixed(1) + '" y="' + (cab - 24) + '" font-size="10" font-weight="700" fill="#1E4F7A">hoje</text>'); }
    s.push('</svg>');
    var leg = '<div class="cmg-legenda"><span><i style="background:' + CMG_CORES.ABERTA + '"></i>Aberta (criação até a previsão)</span><span><i style="background:' + CMG_CORES.ABERTA + ';opacity:.45;outline:1px dashed ' + CMG_CORES.ABERTA + '"></i>Aberta sem previsão (até hoje)</span><span><i style="background:' + CMG_CORES.GANHA + '"></i>Ganha</span><span><i style="background:' + CMG_CORES.PERDIDA + '"></i>Perdida</span>' +
      '<span><i style="background:rgba(214,69,69,.6);outline:1px solid #d64545"></i>Atraso (previsão vencida, ou marco atrasado em vermelho)</span><span><i style="background:#1E4F7A;border-radius:50%"></i>Proposta enviada</span><span><i style="background:#c2953f;transform:rotate(45deg)"></i>Validade da proposta</span>' +
      '<span><i style="background:#5b6270;clip-path:polygon(50% 0,100% 100%,0 100%)"></i>Retorno combinado (verde: feito)</span><span><i style="background:#2e8b57"></i>Pedido aprovado</span><span><i style="background:#6a4fa3"></i>Passagem aos setores</span><span><i style="background:#1E4F7A;width:3px"></i>Hoje</span></div>';
    var aviso = r.cortadas ? '<div class="cm-faixa aviso">Mostrando as primeiras ' + r.linhas.length + ' oportunidades; ' + r.cortadas + ' ficaram de fora. Use os filtros (vendedor, cliente, área ou um período menor).</div>' : '';
    var lista = movel ? '<p class="cm-sec">Lista</p><div class="cm-lista">' + r.linhas.map(function (l) { return '<button type="button" class="cm-mini" style="text-align:left;width:100%" data-cmg-lista="' + Com_esc_(l.id) + '"><b>' + Com_esc_(l.codigo + " · " + l.cliente) + '</b>' + Com_esc_(l.etapaNome) + ' · criada ' + Com_esc_(l.inicioTxt) + (l.previsaoTxt ? ' · previsão ' + Com_esc_(l.previsaoTxt) : '') + (l.atrasada ? ' <span class="cm-selo vermelho">Atrasada</span>' : '') + '</button>'; }).join("") + '</div>' : '';
    return '<p class="cm-meta">' + r.linhas.length + (r.linhas.length === 1 ? ' oportunidade' : ' oportunidades') + ' · ' + Com_esc_(r.periodoTxt) + (movel ? ' · deslize o gráfico para os lados.' : '') + '</p>' + aviso + leg + '<div class="cmg-wrap">' + s.join("") + '</div>' + lista;
  }

  function Comercial_ganttDetalhe_(id) {
    var l = ((CM.gantt && CM.gantt.linhas) || []).filter(function (x) { return x.id === id; })[0];
    if (!l) return;
    var corpo = '<p class="cm-txt"><b>' + Com_esc_(l.cliente) + '</b> · ' + Com_esc_(l.titulo) + '</p><dl class="cm-det"><dt>Situação</dt><dd>' + Com_esc_({ ABERTA: "Aberta", GANHA: "Ganha", PERDIDA: "Perdida" }[l.situacao]) + (l.atrasada ? ' <span class="cm-selo vermelho">Previsão vencida</span>' : '') + '</dd>' +
      '<dt>Etapa</dt><dd>' + Com_esc_(l.funilNome + " · " + l.etapaNome) + '</dd><dt>Vendedor</dt><dd>' + Com_esc_(l.responsavel) + '</dd>' + (l.valorTxt ? '<dt>Valor estimado</dt><dd>' + Com_esc_(l.valorTxt) + '</dd>' : '') +
      '<dt>Criada</dt><dd>' + Com_esc_(l.inicioTxt) + '</dd><dt>Previsão de fechamento</dt><dd>' + Com_esc_(l.previsaoTxt || "não informada") + '</dd>' + (l.fimTxt ? '<dt>' + (l.situacao === "GANHA" ? "Ganha em" : "Perdida em") + '</dt><dd>' + Com_esc_(l.fimTxt) + '</dd>' : '') + '</dl>' +
      '<p class="cm-sec">Marcos</p>' + (l.marcos.length ? '<div class="cm-hist">' + l.marcos.map(function (m) { return '<div' + (m.atrasado ? ' style="color:var(--danger)"' : '') + '><b>' + Com_esc_(m.diaTxt) + '</b> · ' + Com_esc_(m.rotulo) + (m.atrasado ? ' (atrasado)' : '') + '</div>'; }).join("") + '</div>' : '<p class="cm-meta">Nenhum marco ainda.</p>');
    var ov = Com_modal_(l.codigo + " · " + l.cliente, corpo, '<button type="button" class="btn-secondary" data-x="c">Fechar</button>' + (l.situacao === "ABERTA" ? '<button type="button" class="btn-secondary" data-x="esp"><i class="fas fa-user-tie" aria-hidden="true"></i>&nbsp;Pedir à especialista</button>' : '') + '<button type="button" class="btn-primary" data-x="abrir">Abrir a oportunidade</button>', 560);
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    // Etapa 2: a oportunidade abre no lugar do detalhe do Gantt; o voltar reabre o detalhe
    ov.querySelector('[data-x="abrir"]').onclick = function () { ov.remove(); var g2 = Comercial_abrirOportunidade_(l.id); if (g2 && window.SGO_NAV && SGO_NAV.janelaVolta) SGO_NAV.janelaVolta(g2, function () { Comercial_ganttDetalhe_(id); }); };
    var e = ov.querySelector('[data-x="esp"]'); if (e) e.onclick = function () { ov.remove(); Comercial_especialista_(l.id); };
  }
</script>

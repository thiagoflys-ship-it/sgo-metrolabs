<style>
  /* COMERCIAL NATIVO (21/10/2026) — servidor: SGO_Comercial_*.js (uma porta: Comercial_api). Celular sem rolagem lateral. */
  .cm-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .cm-tab { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; min-height: 40px; }
  .cm-tab.active { background: var(--text-strong, #1f2a24); color: var(--card, #fff); border-color: transparent; }
  .cm-faixa { margin: 8px 0 12px; padding: 10px 14px; border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; background: var(--card); font-size: 13px; line-height: 1.5; }
  .cm-faixa.aviso { border-left-color: var(--warning); } .cm-faixa.erro { border-left-color: var(--danger); background: var(--danger-bg); } .cm-faixa.ok { border-left-color: var(--success); }
  .cm-gestora { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); margin-bottom: 12px; }
  .cm-gestora .ic { flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--info-bg, #e8f0fb); color: var(--info, #1f5fa8); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .cm-gestora .t { font-weight: 800; font-size: 14px; margin: 0 0 2px; } .cm-gestora .s { font-size: 12px; color: var(--muted); margin: 0; }
  .cm-gestora p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; }
  .cm-lista { display: flex; flex-direction: column; gap: 10px; }
  .cm-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
  .cm-card.p1 { border-left-color: var(--danger); } .cm-card.p2 { border-left-color: var(--warning); } .cm-card.p3 { border-left-color: var(--info, #1f5fa8); } .cm-card.p4, .cm-card.p5 { border-left-color: var(--muted); }
  .cm-card.feito { opacity: .6; }
  .cm-card-tit { font-weight: 700; font-size: 14px; margin: 0 0 4px; color: var(--text-strong, var(--text)); }
  .cm-meta { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .cm-txt { font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
  .cm-txt b { color: var(--text-strong, var(--text)); }
  .cm-msg { font-size: 12.5px; line-height: 1.5; background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; margin: 6px 0; }
  .cm-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cm-acoes button { min-height: 40px; }
  .cm-selo { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; border: 1px solid currentColor; margin: 0 4px 2px 0; white-space: nowrap; }
  .cm-selo.vermelho { color: var(--danger); background: var(--danger-bg); } .cm-selo.laranja { color: var(--warning); background: var(--warning-bg); }
  .cm-selo.verde { color: var(--success); background: var(--success-bg); } .cm-selo.azul { color: var(--info, #1f5fa8); } .cm-selo.cinza { color: var(--muted); }
  .cm-filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 6px 0 12px; }
  /* 28/10/2026: no celular o menu lateral fica escondido; a barra de seções leva a todas as telas do Comercial */
  .cm-nav-mob { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 2px 2px 10px; margin: 0 0 4px; }
  .cm-nav-mob::-webkit-scrollbar { display: none; }
  .cm-nav-mob-btn { flex: 0 0 auto; min-height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--text); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .cm-nav-mob-btn.ativo { background: var(--info, #1f5fa8); border-color: var(--info, #1f5fa8); color: #fff; }
  .cm-nav-mob-btn:focus-visible { outline: 3px solid var(--info, #1f5fa8); outline-offset: 2px; }
  .cm-filtros label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .cm-filtros select, .cm-filtros input { min-height: 40px; max-width: 100%; }
  .cm-quadro { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .cm-coluna { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 120px; }
  .cm-coluna h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
  .cm-coluna h4 span { color: var(--muted); font-weight: 600; }
  .cm-mini { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; font-size: 12.5px; overflow-wrap: anywhere; }
  .cm-mini:hover { border-color: var(--info, #1f5fa8); }
  .cm-mini b { display: block; font-size: 13px; }
  .cm-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .cm-kpi { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--info, #1f5fa8); border-radius: 8px; padding: 10px 12px; }
  .cm-kpi .v { display: block; font-size: 20px; font-weight: 800; color: var(--text-strong, var(--text)); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .cm-kpi .r { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .cm-kpi.ok { border-top-color: var(--success); } .cm-kpi.aviso { border-top-color: var(--warning); } .cm-kpi.critico { border-top-color: var(--danger); }
  .cm-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cm-tabela th, .cm-tabela td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; vertical-align: top; }
  .cm-tabela td.n, .cm-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cm-caixa { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .cm-caixa h3 { margin: 0 0 8px; font-size: 14px; }
  .cm-grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .cm-grade3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  .cm-campo { margin-bottom: 10px; min-width: 0; }
  .cm-campo label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .cm-campo input, .cm-campo select, .cm-campo textarea { width: 100%; box-sizing: border-box; min-height: 40px; font: inherit; }
  .cm-campo textarea { min-height: 70px; resize: vertical; }
  .cm-ajuda-campo { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .cm-det { display: grid; grid-template-columns: 150px 1fr; gap: 5px 10px; font-size: 12.5px; margin: 0 0 12px; }
  .cm-det dt { color: var(--muted); font-weight: 700; } .cm-det dd { margin: 0; overflow-wrap: anywhere; }
  .cm-hist { border-left: 2px solid var(--border); margin-left: 6px; padding-left: 12px; }
  .cm-hist div { margin-bottom: 9px; font-size: 12.5px; } .cm-hist .q { color: var(--muted); font-size: 11.5px; }
  .cm-itens .cm-item { display: grid; grid-template-columns: 2.2fr .6fr .6fr 1fr 1.4fr auto; gap: 6px; align-items: end; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .cm-itens .cm-item .cm-campo { margin: 0; }
  /* 28/10/2026: escolha do produto do catálogo no próprio item (busca enquanto digita) */
  .cm-itens .cm-prod { position: relative; }
  .cm-sug { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; max-height: 300px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.15); margin-top: 2px; }
  .cm-sug-op { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); padding: 8px 10px; min-height: 44px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .cm-sug-op b { display: block; font-size: 13px; }
  .cm-sug-op:hover, .cm-sug-op.ativo { background: var(--bg); }
  .cm-sug-nota { padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .cm-item-orig { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .cm-item-orig button { min-height: 28px; padding: 2px 8px; font-size: 11.5px; }
  .cm-item-dif { display: block; font-size: 11.5px; margin-top: 3px; min-height: 1em; }
  .cm-politica { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin: 6px 0 2px; }
  .cm-politica i { display: block; height: 100%; }
  /* 29/10/2026: custos da viagem e do frete (checklist da precificação) */
  .cm-cv-linha { display: grid; grid-template-columns: 1.5fr 1.5fr .9fr 1.6fr .8fr; gap: 6px 10px; align-items: end; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .cm-cv-linha .cm-campo { margin: 0; }
  .cm-cv-linha .nome { font-size: 12.5px; font-weight: 700; } .cm-cv-linha .nome span { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .cm-cv-linha .tot { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
  .cm-cv-linha.auto { opacity: .8; }
  .cm-cv-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cm-cv-res { border-left: 4px solid var(--info, #1f5fa8); }
  .cm-cv-res.erro { border-left-color: var(--danger); } .cm-cv-res.ok { border-left-color: var(--success); }
  .cm-vazio { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; }
  .cm-sec { margin: 14px 0 6px; font-size: 13px; font-weight: 800; color: var(--text-strong, var(--text)); }
  .cm-check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; margin: 4px 0; }
  .cm-check input { min-height: 0; width: auto; margin-top: 3px; }
  /* QUADRO DO FUNIL (Kanban) e GANTT COMERCIAL (21/10/2026). As colunas e o Gantt rolam DENTRO do quadro; a página não rola para o lado. */
  .cmk-area { max-width: 100%; min-width: 0; }
  .cmk-quadro { display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; padding: 2px 2px 10px; scroll-snap-type: x proximity; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .cmk-col { flex: 0 0 262px; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; scroll-snap-align: start; max-height: 72vh; }
  .cmk-col.alvo { outline: 2px dashed var(--info, #1f5fa8); outline-offset: -4px; }
  .cmk-col.fechadas { background: transparent; }
  .cmk-col-cab { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .cmk-col-cab b { display: block; font-size: 13px; color: var(--text-strong, var(--text)); }
  .cmk-col-cab span { color: var(--muted); }
  .cmk-col-corpo { padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 90px; }
  .cmk-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; cursor: pointer; overflow-wrap: anywhere; }
  .cmk-card[draggable="true"] { cursor: grab; }
  .cmk-card.risco { border-left-color: var(--danger); }
  .cmk-card.atencao { border-left-color: var(--warning); }
  .cmk-card.ganha { border-left-color: var(--success); } .cmk-card.perdida { border-left-color: var(--muted); }
  .cmk-card.arrastando { opacity: .45; }
  .cmk-card b.cli { display: block; font-size: 13px; color: var(--text-strong, var(--text)); }
  .cmk-card .cmk-l { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  .cmk-card .cmk-bts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cmk-card .cmk-bts button { min-height: 34px; padding: 4px 10px; font-size: 12px; }
  .cmk-leitura p { white-space: pre-wrap; }
  .cmk-leitura ul { margin: 4px 0 8px 18px; padding: 0; font-size: 12.5px; }
  .cmk-leitura li { margin-bottom: 3px; }
  .cmk-lista-mover { display: flex; flex-direction: column; gap: 6px; }
  .cmk-lista-mover button { text-align: left; min-height: 44px; }
  .cmk-falta { border-left: 3px solid var(--danger); background: var(--danger-bg); padding: 8px 10px; border-radius: 4px; margin: 6px 0; font-size: 12.5px; }
  .cmg-wrap { overflow-x: auto; overscroll-behavior-x: contain; background: var(--card); border: 1px solid var(--border); border-radius: 8px; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .cmg-wrap svg text { font-family: inherit; }
  .cmg-legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .cmg-legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
  @media (max-width: 900px) {
    .cmk-col { flex-basis: 82vw; max-height: none; }
    .cmk-col-corpo { max-height: 62vh; }
  }
  @media (max-width: 900px) {
    .cm-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cm-grade2, .cm-grade3 { grid-template-columns: 1fr; }
    .cm-quadro { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; }
    .cm-coluna { min-height: 0; }
    .cm-coluna:not(:has(.cm-mini)) { padding: 6px 8px; opacity: .75; }
    .cm-det { grid-template-columns: 1fr; }
    .cm-det dt { margin-top: 6px; }
    .cm-itens .cm-item { grid-template-columns: 1fr 1fr; }
    .cm-itens .cm-item .cm-desc { grid-column: 1 / -1; }
    .cm-cv-linha { grid-template-columns: 1fr 1fr; }
    .cm-cv-linha .nome, .cm-cv-linha .mot { grid-column: 1 / -1; }
    .cm-cv-linha .tot { text-align: left; }
    .cm-tabela thead { display: none; }
    .cm-tabela, .cm-tabela tbody, .cm-tabela tr, .cm-tabela td { display: block; width: 100%; box-sizing: border-box; }
    .cm-tabela tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 6px 8px; background: var(--card); }
    .cm-tabela td { border: 0; padding: 3px 0; text-align: left !important; }
    .cm-tabela td[data-r]::before { content: attr(data-r) ": "; color: var(--muted); font-weight: 700; }
    .cm-filtros > div { flex: 1 1 140px; }
  }
</style>

<script>
  // ==========================================================
  // COMERCIAL NATIVO DO SGO+ (21/10/2026)
  // Telas (abrir(mod)): comercial (Hoje), comercial_oportunidades, comercial_propostas, comercial_pedidos,
  // comercial_catalogo, comercial_painel, comercial_metodologia -> Comercial_render_(mod).
  // Uma chamada só no servidor: Comercial_api(sessionId, acao, dados). O servidor confere o perfil em toda chamada.
  // A tela não se redesenha sozinha (formulário aberto nunca é apagado): recarrega depois de cada ação ou em "Atualizar".
  // ==========================================================
  var CM = { ini: null, mod: "", hojePapel: "", visao: "quadro", filtro: { situacao: "ABERTA" }, filtroProp: { situacao: "ABERTAS" }, cache: {} };
  var CM_MODS = { comercial: "Hoje no Comercial", comercial_oportunidades: "Oportunidades", comercial_propostas: "Propostas", comercial_pedidos: "Pedidos aprovados",
    comercial_catalogo: "Produtos e serviços", comercial_painel: "Painel comercial", comercial_metodologia: "Metodologia comercial", comercial_kanban: "Quadro do funil", comercial_gantt: "Gantt comercial" };

  function Com_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function Com_$_(id) { return document.getElementById(id); }
  function Com_chamar_(acao, dados, ok, erro, opcoes) {
    var o = opcoes || {};
    if (o.carregando) SGO_iniciarCarregamento_(o.carregando);
    // 27/10/2026: buscas com "chave" — só vale a resposta do último pedido. Antes, uma resposta atrasada de um texto
    // antigo podia chegar depois e apagar o resultado do texto novo (parecia que a busca "não achava").
    var vez = 0;
    if (o.chave) { CM.vez = CM.vez || {}; vez = CM.vez[o.chave] = (CM.vez[o.chave] || 0) + 1; }
    var velha = function () { return o.chave && CM.vez && CM.vez[o.chave] !== vez; };
    var fim = function () { if (o.carregando) SGO_finalizarCarregamento_(); };
    var falhou = function (m) { fim(); if (velha()) return; if (erro) erro(m); else alert(m); };
    google.script.run.withSuccessHandler(function (r) {
      if (velha()) { fim(); return; }
      if (!r || !r.ok) { falhou((r && r.message) || "Não foi possível concluir: o servidor não respondeu como esperado. Tente de novo."); return; }
      fim();
      try { if (ok) ok(r); } catch (e) { console.error("Comercial " + acao + ":", e); alert("Não foi possível mostrar o resultado na tela: " + (e && e.message ? e.message : e) + ". Atualize a página (F5) e tente de novo."); }
    }).withFailureHandler(function (e) { falhou("Não foi possível falar com o servidor (" + ((e && e.message) || e) + "). Verifique a conexão e tente de novo; nada foi alterado."); })
      .Comercial_api(SGO_getSessionId(), acao, dados || {});
  }
  function Com_msg_(onde, texto, tipo) { var el = typeof onde === "string" ? Com_$_(onde) : onde; if (el) el.innerHTML = texto ? '<div class="cm-faixa ' + (tipo || "erro") + '">' + Com_esc_(texto) + "</div>" : ""; }

  // ---------------- casca: menu ----------------
  function Comercial_iniciar_() {
    var p = USER_CONTEXT ? String(USER_CONTEXT.perfil || "").toUpperCase() : "";
    if (!p || p === "CLIENTE" || p === "RH") { Comercial_mostrarMenu_(null); return; }
    Com_chamar_("acesso", {}, function (r) { Comercial_mostrarMenu_(r); }, function () { Comercial_mostrarMenu_(null); });
  }
  function Comercial_parar_() { CM.ini = null; CM.cache = {}; Comercial_mostrarMenu_(null); }
  function Comercial_mostrarMenu_(r) {
    var nivel = r ? r.nivel : "NENHUM";
    var grupo = Com_$_("menu-secao-comercial");
    if (grupo) grupo.style.display = nivel === "NENHUM" ? "none" : "";
    document.querySelectorAll("#menu-grupo-itens-comercial .menu-btn").forEach(function (b) {
      b.style.display = Com_modVisivel_(b.getAttribute("data-mod"), nivel) ? "" : "none";
    });
    if (typeof Menu_iniciar_ === "function") { try { Menu_iniciar_(); } catch (e) {} }
    // o acesso chega depois do login: a tela inicial do celular ganha o atalho do Comercial quando ele chega
    if (nivel !== "NENHUM" && window.SGO_MODULO_ATUAL === "mobile_home" && typeof renderMobileHome_ === "function") { try { renderMobileHome_(); } catch (e) {} }
  }

  // Quem vê cada tela do Comercial (a mesma regra no menu do computador e na barra do celular).
  // 21/10/2026: o Financeiro vê os pedidos aprovados e mantém o catálogo (preços e custos); o resto do Comercial é da equipe.
  function Com_modVisivel_(m, nivel) {
    if (!nivel || nivel === "NENHUM") return false;
    if (nivel === "FINANCEIRO") return m === "comercial_pedidos" || m === "comercial_catalogo";
    return true;
  }

  // 28/10/2026 (dono: "no celular as mesmas ferramentas do comercial aparecem?"; equipe: "não consegue ver nada sobre produto").
  // Causa: no celular o menu lateral fica escondido e o atalho "Comercial" da tela inicial só abria a tela Hoje; Produtos e
  // serviços, Pedidos, Quadro, Gantt, Painel e Metodologia não tinham caminho (só pela lupa). Agora toda tela do Comercial no
  // celular abre com a barra de seções, com as mesmas regras do menu do computador.
  var CM_NAV = [["comercial", "Hoje"], ["comercial_oportunidades", "Oportunidades"], ["comercial_propostas", "Propostas"], ["comercial_pedidos", "Pedidos"],
    ["comercial_catalogo", "Produtos"], ["comercial_kanban", "Quadro"], ["comercial_gantt", "Gantt"], ["comercial_painel", "Painel"], ["comercial_metodologia", "Metodologia"]];
  function Com_navMobileHtml_(mod, nivel) {
    var itens = CM_NAV.filter(function (x) { return Com_modVisivel_(x[0], nivel); });
    if (itens.length < 2) return "";
    return '<nav class="cm-nav-mob" aria-label="Seções do Comercial">' + itens.map(function (x) {
      var at = x[0] === mod;
      return '<button type="button" class="cm-nav-mob-btn' + (at ? " ativo" : "") + '"' + (at ? ' aria-current="page"' : "") + ' data-cm-nav="' + x[0] + '">' + Com_esc_(x[1]) + "</button>";
    }).join("") + "</nav>";
  }
  /** Onde as telas do Comercial desenham: no celular, abaixo da barra de seções; no computador, a área de conteúdo. */
  function Com_corpo_() { return Com_$_("cmCorpoMob") || Com_$_("conteudo"); }

  function Comercial_garantirInicio_(cb) {
    if (CM.ini) { cb(CM.ini); return; }
    Com_chamar_("iniciar", {}, function (r) { CM.ini = r; cb(r); });
  }

  function Comercial_cabecalho_(titulo, sub, botoes) {

      Com_chamar_("cliente", { clienteId: cid }, function (r) {
        st.unidades = r.unidades; st.equipamentos = r.equipamentos; st.contatos = r.contatos.filter(function (c) { return c.ativo; });

        var desenharCt = function (sel) {
          Com_$_("cmCliCt").innerHTML = Com_campo_("Contato principal", '<select id="cmCt">' + Com_opcoes_(st.contatos.map(function (c) { return { v: c.id, t: c.nome + (c.cargo ? " — " + c.cargo : "") + (c.unidadeNome ? " (" + c.unidadeNome + ")" : "") }; }), sel, "Escolha o contato") + '</select><button type="button" class="btn-secondary" id="cmNovoCt" style="margin-top:6px">Novo contato</button>');
          Com_$_("cmNovoCt").onclick = function () { Comercial_formContato_({ clienteId: st.clienteId, unidadeId: Com_$_("cmUn") ? Com_$_("cmUn").value : "" }, function (c) { st.contatos.push(c); desenharCt(c.id); }); };

        };

          Com_$_("cmCliRes").querySelectorAll("[data-cli]").forEach(function (el) { el.onclick = function () { st.clienteId = el.getAttribute("data-cli"); st.clienteNome = el.getAttribute("data-nome"); Com_$_("cmCliBusca").value = st.clienteNome; Com_$_("cmCliRes").innerHTML = ""; atual = {}; carregar(st.clienteId); }; });

        '<button type="button" class="btn-secondary" data-cmk-esp="' + Com_esc_(c.id) + '"><i class="fas fa-user-tie" aria-hidden="true"></i>&nbsp;Pedir à especialista</button></div>') + '</div>';

  function Comercial_desenharQuadro_(r) {
    var alvo = Com_$_("cmkCorpo"); if (!alvo) return;
    var porId = {};
    var col = function (c, fechadas) {
      c.cartoes.forEach(function (k) { porId[k.id] = k; });
      var info = fechadas ? (c.valorTxt ? c.valorTxt : '') : (c.probabilidade + '%' + (c.maxDias ? ' · meta até ' + c.maxDias + ' dias' : ''));
      return '<div class="cmk-col' + (fechadas ? ' fechadas' : '') + '" data-cmk-col="' + Com_esc_(c.codigo) + '"><div class="cmk-col-cab"><b>' + Com_esc_(c.nome) + '</b><span>' + c.qtd + (c.qtd === 1 ? ' oportunidade' : ' oportunidades') + (!fechadas && c.valorTxt ? ' · ' + Com_esc_(c.valorTxt) : '') + '</span><br><span>' + Com_esc_(info) + '</span></div>' +
        '<div class="cmk-col-corpo">' + (c.cartoes.length ? c.cartoes.map(function (k) { return Comercial_cartaoQHtml_(k, fechadas); }).join("") : '<div class="cm-meta" style="text-align:center;padding:14px 0">' + (fechadas ? "Nenhuma no período" : "Arraste uma oportunidade para cá") + '</div>') +
        (fechadas && c.qtd > c.cartoes.length ? '<p class="cm-meta">Mostrando as ' + c.cartoes.length + ' mais recentes.</p>' : '') + '</div></div>';
    };
    var total = r.colunas.reduce(function (s, c) { return s + c.qtd; }, 0);
    alvo.innerHTML = '<p class="cm-meta">' + total + (total === 1 ? ' oportunidade aberta' : ' oportunidades abertas') + ' no funil ' + Com_esc_(r.funil.nome) + '. ' +
      (ehMobileModo_() ? 'Deslize para os lados dentro do quadro para ver as outras etapas. Toque em "Mover para" para mudar de etapa.' : 'Role o quadro para os lados para ver as outras etapas. Arraste o cartão ou use "Mover para".') + '</p>' +
      '<div class="cmk-quadro" id="cmkQuadro">' + r.colunas.map(function (c) { return col(c, false); }).join("") + col(r.ganhas, true) + col(r.perdidas, true) + '</div>';
    CM.quadroCartoes = porId;
    var arrastando = "";
    alvo.querySelectorAll(".cmk-card").forEach(function (el) {
      el.addEventListener("dragstart", function (ev) { arrastando = el.getAttribute("data-cmk"); el.classList.add("arrastando"); try { ev.dataTransfer.setData("text/plain", arrastando); ev.dataTransfer.effectAllowed = "move"; } catch (e) {} });
      el.addEventListener("dragend", function () { el.classList.remove("arrastando"); alvo.querySelectorAll(".cmk-col").forEach(function (k) { k.classList.remove("alvo"); }); });
      el.addEventListener("click", function (ev) { if (ev.target.closest("button")) return; Comercial_abrirOportunidade_(el.getAttribute("data-cmk")); });
      el.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target === el) Comercial_abrirOportunidade_(el.getAttribute("data-cmk")); });
    });
    alvo.querySelectorAll(".cmk-col").forEach(function (k) {
      k.addEventListener("dragover", function (ev) { ev.preventDefault(); k.classList.add("alvo"); });
      k.addEventListener("dragleave", function () { k.classList.remove("alvo"); });
      k.addEventListener("drop", function (ev) {
        ev.preventDefault(); k.classList.remove("alvo");
        var id = arrastando; try { id = ev.dataTransfer.getData("text/plain") || id; } catch (e) {}
        arrastando = "";

      });
    });

    alvo.querySelectorAll("[data-cmk-esp]").forEach(function (b) { b.onclick = function () { Comercial_especialista_(b.getAttribute("data-cmk-esp")); }; });
  }

  /** Alternativa ao arrastar (celular, teclado): lista das etapas, Ganha e Perdida. */
  function Comercial_kanbanMoverPara_(c) {
    var q = CM.quadro; if (!q || !c) return;
    var ov = Com_modal_("Mover " + c.codigo + " · " + c.cliente, '<p class="cm-meta">Escolha para onde mover. O sistema confere os critérios de saída antes; nada muda sem você confirmar.</p><div class="cmk-lista-mover">' +
      q.colunas.map(function (k) { return '<button type="button" class="btn-secondary" data-dest="' + Com_esc_(k.codigo) + '"' + (k.codigo === c.etapa ? ' disabled' : '') + '>' + Com_esc_(k.nome) + ' (' + k.probabilidade + '%)' + (k.codigo === c.etapa ? ' · etapa atual' : '') + '</button>'; }).join("") +
      '<button type="button" class="btn-secondary" data-dest="GANHA">Ganha (registrar o aceite do cliente)</button><button type="button" class="btn-secondary" data-dest="PERDIDA">Perdida (motivo e aprendizado)</button></div>', '<button type="button" class="btn-secondary" data-x="c">Cancelar</button>', 480);
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    ov.querySelectorAll("[data-dest]").forEach(function (b) { b.onclick = function () { ov.remove(); Comercial_kanbanSoltar_(c, b.getAttribute("data-dest")); }; });
  }

  function Comercial_kanbanSoltar_(c, destino) {
    if (!c || !destino || destino === c.etapa && c.situacao === "ABERTA") return;
    if (c.situacao !== "ABERTA") { alert("A oportunidade " + c.codigo + " está encerrada e não muda de coluna pelo quadro. Para voltar a trabalhá-la, abra a oportunidade: o vendedor pede a reabertura e a gestão comercial decide (com a próxima ação)."); return; }
    if (!c.podeMover) { alert("Não foi possível mover: a oportunidade " + c.codigo + " é de " + (c.responsavel || "outra pessoa") + ". Quem move é o responsável ou a gestão comercial."); return; }
    var depois = function () { Comercial_carregarKanban_(); };
    if (destino === "GANHA") Comercial_kanbanGanhar_(c, depois);
    else if (destino === "PERDIDA") Comercial_kanbanPerder_(c, depois);
    else Comercial_mudarEtapaJanela_(c.id, destino, depois);
  }

  /**
   * Janela de mudança de etapa (quadro e ficha da oportunidade): pergunta ao servidor o que a metodologia exige, mostra o que
   * falta (com o caminho na tela), a lista da etapa para confirmar, a próxima ação (se faltar) e o motivo (ao voltar).
   */
  function Comercial_mudarEtapaJanela_(id, etapa, depois) {
    Com_chamar_("criteriosEtapa", { id: id, etapa: etapa }, function (c) {
      var o = c.oportunidade, ini = CM.ini;
      if (c.sentido === "IGUAL") { alert("A oportunidade " + o.codigo + " já está nesta etapa."); return; }
      var grupos = {}, ordem = [];
      c.confirmar.forEach(function (x, i) { if (!grupos[x.etapa]) { grupos[x.etapa] = { nome: x.etapaNome, itens: [] }; ordem.push(x.etapa); } grupos[x.etapa].itens.push({ x: x, i: i }); });
      var corpo = '<p class="cm-txt"><b>' + Com_esc_(o.cliente) + '</b> · ' + Com_esc_(o.titulo) + '</p><p class="cm-txt">De <b>' + Com_esc_(c.origem.nome) + '</b> para <b>' + Com_esc_(c.destino.nome) + '</b> (' + c.destino.probabilidade + '%)' + (c.sentido === "RECUO" ? ', voltando de etapa.' : '.') + '</p>';
      if (c.faltas.length) corpo += '<div class="cm-faixa erro">Ainda não dá para mover. A oportunidade continua em ' + Com_esc_(c.origem.nome) + ' até resolver:</div>' + c.faltas.map(function (f) { return '<div class="cmk-falta"><b>' + Com_esc_(f.texto) + '</b><br>O que fazer: ' + Com_esc_(f.oQueFazer) + '</div>'; }).join("");
      if (ordem.length) corpo += '<p class="cm-sec">Critérios de saída (confirme só o que foi feito de verdade)</p>' + ordem.map(function (k) {
        return '<p class="cm-meta" style="margin:6px 0 2px">Etapa ' + Com_esc_(grupos[k].nome) + '</p>' + grupos[k].itens.map(function (it) { return '<label class="cm-check"><input type="checkbox" data-crit="' + it.i + '"' + (it.x.confirmado ? " checked" : "") + (it.x.jaGravado ? " disabled" : "") + '> ' + Com_esc_(it.x.texto) + (it.x.jaGravado ? ' <span class="cm-meta">(já confirmado antes)</span>' : '') + '</label>'; }).join("");
      }).join("");
      if (c.precisaProxima) corpo += '<p class="cm-sec">Próxima ação (a oportunidade está sem nenhuma)</p><div class="cm-grade3">' + Com_campo_("O que fazer", '<input id="cmJAcao" maxlength="300">') + Com_campo_("Data", '<input id="cmJData" type="date" value="' + Com_hojeIso_(1) + '">') + Com_campo_("Hora", '<input id="cmJHora" type="time" value="10:00">') + '</div>' +
        Com_campo_("Como", '<select id="cmJTipo">' + Com_opcoes_(Object.keys(ini.tiposContato).map(function (k) { return { v: k, t: ini.tiposContato[k] }; }), "LIGACAO") + '</select>');
      if (c.precisaMotivo) corpo += Com_campo_("Por que voltar de etapa? (fica no histórico, mínimo 10 letras)", '<textarea id="cmJMotivo" maxlength="1000"></textarea>');
      corpo += '<div id="cmJMsg"></div>';
      var pode = !c.faltas.length;
      var ov = Com_modal_("Mudar a etapa de " + o.codigo, corpo, '<button type="button" class="btn-secondary" data-x="c">' + (pode ? "Cancelar" : "Fechar") + '</button>' + (!pode ? '<button type="button" class="btn-secondary" data-x="abrir">Abrir a oportunidade</button>' : '') +
        (pode ? '<button type="button" class="btn-primary" data-x="ok">Mover para ' + Com_esc_(c.destino.nome) + '</button>' : ''), 600);
      ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
      var ab = ov.querySelector('[data-x="abrir"]'); if (ab) ab.onclick = function () { ov.remove(); Comercial_abrirOportunidade_(o.id); };
      var okb = ov.querySelector('[data-x="ok"]');
      if (okb) okb.onclick = function () {
        var conf = {}, faltando = [];
        ov.querySelectorAll("[data-crit]").forEach(function (cb) { var x = c.confirmar[+cb.getAttribute("data-crit")]; if (cb.checked) (conf[x.etapa] = conf[x.etapa] || []).push(x.texto); else faltando.push(x.texto); });
        if (faltando.length) { Com_msg_("cmJMsg", "Faltam " + faltando.length + (faltando.length === 1 ? " item" : " itens") + " da lista para sair da etapa: " + faltando.join("; ") + ". Se ainda não foram feitos, a oportunidade fica onde está; faça e volte aqui."); return; }
        var d = { id: o.id, etapa: c.destino.codigo, confirmados: conf };

  var CMG_CORES = { ABERTA: "#5b8fb9", GANHA: "#4f9f75", PERDIDA: "#8a96a8" };
  function Comercial_ganttHtml_(r, largura) {

    var ini = p(r.de), fim = p(r.ate), dias = Math.round((fim - ini) / 864e5) + 1;
    var movel = ehMobileModo_();
    var rotW = movel ? 128 : 250, W = Math.max(largura - 2, rotW + dias * (movel ? 7 : 6)), area = W - rotW - 10, px = area / dias, lh = 30, cab = 40;
    var x = function (iso) { var d = p(iso); if (d === null) return rotW; return Math.max(rotW, Math.min(rotW + area, rotW + (d - ini) / 864e5 * px + px / 2)); };

      if (i % passo === 0) { s.push('<line x1="' + xx.toFixed(1) + '" y1="' + (cab - 6) + '" x2="' + xx.toFixed(1) + '" y2="' + H + '" stroke="rgba(127,127,127,.16)"/>'); s.push('<text x="' + (xx + 2).toFixed(1) + '" y="' + (cab - 10) + '" font-size="10" fill="var(--muted)">' + ("0" + d.getUTCDate()).slice(-2) + '</text>'); }
    }

      if (m.tipo === "RETORNO") return '<g>' + t + '<path d="M' + (cx - 5) + ' ' + (cy + 5) + ' L' + cx + ' ' + (cy - 5) + ' L' + (cx + 5) + ' ' + (cy + 5) + ' Z" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';
      if (m.tipo === "APROVADO" || m.tipo === "PASSAGEM") return '<g>' + t + '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';
      return '<g>' + t + '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="' + cor + '" stroke="#fff" stroke-width="1"/></g>';

      var rot = l.codigo + " · " + l.cliente, max = movel ? 18 : 34; if (rot.length > max) rot = rot.slice(0, max - 1) + "…";
      var hojeIso = r.hoje, fimBarra = l.situacao === "ABERTA" ? (l.previsao || hojeIso) : (l.fim || l.previsao || l.inicio);

      s.push('<text x="8" y="' + (y + 13) + '" font-size="11.5" font-weight="700" fill="' + (l.atrasada ? "#d64545" : "var(--text)") + '">' + Com_esc_(rot) + '</text><text x="8" y="' + (y + 25) + '" font-size="9.5" fill="var(--muted)">' + Com_esc_((movel ? "" : l.responsavel + " · ") + l.etapaNome).slice(0, movel ? 22 : 44) + '</text>');
      s.push('<rect x="' + x0.toFixed(1) + '" y="' + by + '" width="' + Math.max(4, x1 - x0).toFixed(1) + '" height="' + bh + '" rx="3" fill="' + (CMG_CORES[l.situacao] || "#888") + '"' + (l.semPrevisao && l.situacao === "ABERTA" ? ' fill-opacity=".45" stroke="' + CMG_CORES.ABERTA + '" stroke-dasharray="4 3"' : '') + '/>');

    if (!l) return;
    var corpo = '<p class="cm-txt"><b>' + Com_esc_(l.cliente) + '</b> · ' + Com_esc_(l.titulo) + '</p><dl class="cm-det"><dt>Situação</dt><dd>' + Com_esc_({ ABERTA: "Aberta", GANHA: "Ganha", PERDIDA: "Perdida" }[l.situacao]) + (l.atrasada ? ' <span class="cm-selo vermelho">Previsão vencida</span>' : '') + '</dd>' +
      '<dt>Etapa</dt><dd>' + Com_esc_(l.funilNome + " · " + l.etapaNome) + '</dd><dt>Vendedor</dt><dd>' + Com_esc_(l.responsavel) + '</dd>' + (l.valorTxt ? '<dt>Valor estimado</dt><dd>' + Com_esc_(l.valorTxt) + '</dd>' : '') +
      '<dt>Criada</dt><dd>' + Com_esc_(l.inicioTxt) + '</dd><dt>Previsão de fechamento</dt><dd>' + Com_esc_(l.previsaoTxt || "não informada") + '</dd>' + (l.fimTxt ? '<dt>' + (l.situacao === "GANHA" ? "Ganha em" : "Perdida em") + '</dt><dd>' + Com_esc_(l.fimTxt) + '</dd>' : '') + '</dl>' +
      '<p class="cm-sec">Marcos</p>' + (l.marcos.length ? '<div class="cm-hist">' + l.marcos.map(function (m) { return '<div' + (m.atrasado ? ' style="color:var(--danger)"' : '') + '><b>' + Com_esc_(m.diaTxt) + '</b> · ' + Com_esc_(m.rotulo) + (m.atrasado ? ' (atrasado)' : '') + '</div>'; }).join("") + '</div>' : '<p class="cm-meta">Nenhum marco ainda.</p>');
    var ov = Com_modal_(l.codigo + " · " + l.cliente, corpo, '<button type="button" class="btn-secondary" data-x="c">Fechar</button>' + (l.situacao === "ABERTA" ? '<button type="button" class="btn-secondary" data-x="esp"><i class="fas fa-user-tie" aria-hidden="true"></i>&nbsp;Pedir à especialista</button>' : '') + '<button type="button" class="btn-primary" data-x="abrir">Abrir a oportunidade</button>', 560);
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    ov.querySelector('[data-x="abrir"]').onclick = function () { ov.remove(); Comercial_abrirOportunidade_(l.id); };
    var e = ov.querySelector('[data-x="esp"]'); if (e) e.onclick = function () { ov.remove(); Comercial_especialista_(l.id); };
  }
</script>

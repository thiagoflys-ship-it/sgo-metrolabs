<style>
  /* COMERCIAL NATIVO (21/10/2026) — servidor: SGO_Comercial_*.js (uma porta: Comercial_api). Celular sem rolagem lateral. */
  .cm-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .cm-tab { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; min-height: 40px; }
  .cm-tab.active { background: var(--text-strong, #1f2a24); color: var(--card, #fff); border-color: transparent; }
  .cm-faixa { margin: 8px 0 12px; padding: 10px 14px; border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; background: var(--card); font-size: 13px; line-height: 1.5; }
  .cm-faixa.aviso { border-left-color: var(--warning); } .cm-faixa.erro { border-left-color: var(--danger); background: var(--danger-bg); } .cm-faixa.ok { border-left-color: var(--success); }
  .cm-gestora { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); margin-bottom: 12px; }
  .cm-gestora .ic { flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--info-bg, #e8f0fb); color: var(--info, #1f5fa8); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .cm-gestora .t { font-weight: 800; font-size: 14px; margin: 0 0 2px; } .cm-gestora .s { font-size: 12px; color: var(--muted); margin: 0; }
  .cm-gestora p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; }
  .cm-lista { display: flex; flex-direction: column; gap: 10px; }
  .cm-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
  .cm-card.p1 { border-left-color: var(--danger); } .cm-card.p2 { border-left-color: var(--warning); } .cm-card.p3 { border-left-color: var(--info, #1f5fa8); } .cm-card.p4, .cm-card.p5 { border-left-color: var(--muted); }
  .cm-card.feito { opacity: .6; }
  .cm-card-tit { font-weight: 700; font-size: 14px; margin: 0 0 4px; color: var(--text-strong, var(--text)); }
  .cm-meta { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .cm-txt { font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
  .cm-txt b { color: var(--text-strong, var(--text)); }
  .cm-msg { font-size: 12.5px; line-height: 1.5; background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; margin: 6px 0; }
  .cm-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cm-acoes button { min-height: 40px; }
  .cm-selo { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; border: 1px solid currentColor; margin: 0 4px 2px 0; white-space: nowrap; }
  .cm-selo.vermelho { color: var(--danger); background: var(--danger-bg); } .cm-selo.laranja { color: var(--warning); background: var(--warning-bg); }
  .cm-selo.verde { color: var(--success); background: var(--success-bg); } .cm-selo.azul { color: var(--info, #1f5fa8); } .cm-selo.cinza { color: var(--muted); }
  .cm-filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 6px 0 12px; }
  .cm-filtros label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .cm-filtros select, .cm-filtros input { min-height: 40px; max-width: 100%; }
  .cm-quadro { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .cm-coluna { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 120px; }
  .cm-coluna h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
  .cm-coluna h4 span { color: var(--muted); font-weight: 600; }
  .cm-mini { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; font-size: 12.5px; overflow-wrap: anywhere; }
  .cm-mini:hover { border-color: var(--info, #1f5fa8); }
  .cm-mini b { display: block; font-size: 13px; }
  .cm-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .cm-kpi { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--info, #1f5fa8); border-radius: 8px; padding: 10px 12px; }
  .cm-kpi .v { display: block; font-size: 20px; font-weight: 800; color: var(--text-strong, var(--text)); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .cm-kpi .r { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .cm-kpi.ok { border-top-color: var(--success); } .cm-kpi.aviso { border-top-color: var(--warning); } .cm-kpi.critico { border-top-color: var(--danger); }
  .cm-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cm-tabela th, .cm-tabela td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; vertical-align: top; }
  .cm-tabela td.n, .cm-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cm-caixa { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .cm-caixa h3 { margin: 0 0 8px; font-size: 14px; }
  .cm-grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .cm-grade3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  .cm-campo { margin-bottom: 10px; min-width: 0; }
  .cm-campo label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .cm-campo input, .cm-campo select, .cm-campo textarea { width: 100%; box-sizing: border-box; min-height: 40px; font: inherit; }
  .cm-campo textarea { min-height: 70px; resize: vertical; }
  .cm-ajuda-campo { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .cm-det { display: grid; grid-template-columns: 150px 1fr; gap: 5px 10px; font-size: 12.5px; margin: 0 0 12px; }
  .cm-det dt { color: var(--muted); font-weight: 700; } .cm-det dd { margin: 0; overflow-wrap: anywhere; }
  .cm-hist { border-left: 2px solid var(--border); margin-left: 6px; padding-left: 12px; }
  .cm-hist div { margin-bottom: 9px; font-size: 12.5px; } .cm-hist .q { color: var(--muted); font-size: 11.5px; }
  .cm-itens .cm-item { display: grid; grid-template-columns: 2.2fr .6fr .6fr 1fr 1.4fr auto; gap: 6px; align-items: end; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .cm-itens .cm-item .cm-campo { margin: 0; }
  .cm-politica { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin: 6px 0 2px; }
  .cm-politica i { display: block; height: 100%; }
  .cm-vazio { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; }
  .cm-sec { margin: 14px 0 6px; font-size: 13px; font-weight: 800; color: var(--text-strong, var(--text)); }
  .cm-check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; margin: 4px 0; }
  .cm-check input { min-height: 0; width: auto; margin-top: 3px; }
  @media (max-width: 900px) {
    .cm-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cm-grade2, .cm-grade3 { grid-template-columns: 1fr; }
    .cm-quadro { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; }
    .cm-coluna { min-height: 0; }
    .cm-coluna:not(:has(.cm-mini)) { padding: 6px 8px; opacity: .75; }
    .cm-det { grid-template-columns: 1fr; }
    .cm-det dt { margin-top: 6px; }
    .cm-itens .cm-item { grid-template-columns: 1fr 1fr; }
    .cm-itens .cm-item .cm-desc { grid-column: 1 / -1; }
    .cm-tabela thead { display: none; }
    .cm-tabela, .cm-tabela tbody, .cm-tabela tr, .cm-tabela td { display: block; width: 100%; box-sizing: border-box; }
    .cm-tabela tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 6px 8px; background: var(--card); }
    .cm-tabela td { border: 0; padding: 3px 0; text-align: left !important; }
    .cm-tabela td[data-r]::before { content: attr(data-r) ": "; color: var(--muted); font-weight: 700; }
    .cm-filtros > div { flex: 1 1 140px; }
  }
</style>

<script>
  // ==========================================================
  // COMERCIAL NATIVO DO SGO+ (21/10/2026)
  // Telas (abrir(mod)): comercial (Hoje), comercial_oportunidades, comercial_propostas, comercial_pedidos,
  // comercial_catalogo, comercial_painel, comercial_metodologia -> Comercial_render_(mod).
  // Uma chamada só no servidor: Comercial_api(sessionId, acao, dados). O servidor confere o perfil em toda chamada.
  // A tela não se redesenha sozinha (formulário aberto nunca é apagado): recarrega depois de cada ação ou em "Atualizar".
  // ==========================================================
  var CM = { ini: null, mod: "", hojePapel: "", visao: "quadro", filtro: { situacao: "ABERTA" }, filtroProp: { situacao: "ABERTAS" }, cache: {} };
  var CM_MODS = { comercial: "Hoje no Comercial", comercial_oportunidades: "Oportunidades", comercial_propostas: "Propostas", comercial_pedidos: "Pedidos aprovados",
    comercial_catalogo: "Produtos e serviços", comercial_painel: "Painel comercial", comercial_metodologia: "Metodologia comercial" };

  function Com_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function Com_$_(id) { return document.getElementById(id); }
  function Com_chamar_(acao, dados, ok, erro, opcoes) {
    var o = opcoes || {};
    if (o.carregando) SGO_iniciarCarregamento_(o.carregando);
    var fim = function () { if (o.carregando) SGO_finalizarCarregamento_(); };
    var falhou = function (m) { fim(); if (erro) erro(m); else alert(m); };
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { falhou((r && r.message) || "Não foi possível concluir: o servidor não respondeu como esperado. Tente de novo."); return; }
      fim();
      try { if (ok) ok(r); } catch (e) { console.error("Comercial " + acao + ":", e); alert("Não foi possível mostrar o resultado na tela: " + (e && e.message ? e.message : e) + ". Atualize a página (F5) e tente de novo."); }
    }).withFailureHandler(function (e) { falhou("Não foi possível falar com o servidor (" + ((e && e.message) || e) + "). Verifique a conexão e tente de novo; nada foi alterado."); })
      .Comercial_api(SGO_getSessionId(), acao, dados || {});
  }
  function Com_msg_(onde, texto, tipo) { var el = typeof onde === "string" ? Com_$_(onde) : onde; if (el) el.innerHTML = texto ? '<div class="cm-faixa ' + (tipo || "erro") + '">' + Com_esc_(texto) + "</div>" : ""; }

  // ---------------- casca: menu ----------------
  function Comercial_iniciar_() {
    var p = USER_CONTEXT ? String(USER_CONTEXT.perfil || "").toUpperCase() : "";
    if (!p || p === "CLIENTE" || p === "RH") { Comercial_mostrarMenu_(null); return; }
    Com_chamar_("acesso", {}, function (r) { Comercial_mostrarMenu_(r); }, function () { Comercial_mostrarMenu_(null); });
  }
  function Comercial_parar_() { CM.ini = null; CM.cache = {}; Comercial_mostrarMenu_(null); }
  function Comercial_mostrarMenu_(r) {
    var nivel = r ? r.nivel : "NENHUM";
    var grupo = Com_$_("menu-secao-comercial");
    if (grupo) grupo.style.display = nivel === "NENHUM" ? "none" : "";
    document.querySelectorAll("#menu-grupo-itens-comercial .menu-btn").forEach(function (b) {
      var m = b.getAttribute("data-mod"), ver = nivel !== "NENHUM";
      if (nivel === "FINANCEIRO") ver = m === "comercial_pedidos";
      if (m === "comercial_metodologia" || m === "comercial_catalogo") ver = ver && nivel !== "FINANCEIRO";
      b.style.display = ver ? "" : "none";
    });
    if (typeof Menu_iniciar_ === "function") { try { Menu_iniciar_(); } catch (e) {} }
    // o acesso chega depois do login: a tela inicial do celular ganha o atalho do Comercial quando ele chega
    if (nivel !== "NENHUM" && window.SGO_MODULO_ATUAL === "mobile_home" && typeof renderMobileHome_ === "function") { try { renderMobileHome_(); } catch (e) {} }
  }

  function Comercial_garantirInicio_(cb) {
    if (CM.ini) { cb(CM.ini); return; }
    Com_chamar_("iniciar", {}, function (r) { CM.ini = r; cb(r); });
  }

  function Comercial_cabecalho_(titulo, sub, botoes) {
    return '<div class="module-header"><div class="module-header-left"><h2 class="content-title">' + Com_esc_(titulo) + '</h2><p class="content-subtitle">' + Com_esc_(sub) + "</p></div>" +
      '<div class="module-header-right" style="display:flex;gap:8px;flex-wrap:wrap">' + (botoes || "") + "</div></div>";
  }

  /** Ponto de entrada de abrir(mod). */
  function Comercial_render_(mod, alvo) {
    var div = Com_$_("conteudo");
    if (!div) return;
    CM.mod = mod;
    if (ehMobileModo_()) atualizarTituloMobile_(CM_MODS[mod] || "Comercial");
    div.innerHTML = '<div class="module-shell"><div class="cm-vazio">Carregando o Comercial…</div></div>';
    Comercial_garantirInicio_(function (ini) {
      if (ini.nivel === "NENHUM") {
        div.innerHTML = '<div class="module-shell">' + Comercial_cabecalho_("Comercial", "") + '<div class="cm-faixa aviso">O Comercial é da equipe comercial (perfil Comercial ou área Comercial), da gestão comercial, da Diretoria e do Administrador. O Financeiro vê só os pedidos aprovados. Se você precisa trabalhar no Comercial, peça ao Administrador para ajustar o seu perfil ou a sua área em Administração > Usuários.</div></div>';
        return;
      }
      if (ini.nivel === "FINANCEIRO" && mod !== "comercial_pedidos") mod = "comercial_pedidos";
      var mapa = { comercial: Comercial_renderHoje_, comercial_oportunidades: Comercial_renderOportunidades_, comercial_propostas: Comercial_renderPropostas_, comercial_pedidos: Comercial_renderPedidos_,
        comercial_catalogo: Comercial_renderCatalogo_, comercial_painel: Comercial_renderPainel_, comercial_metodologia: Comercial_renderMetodologia_ };
      (mapa[mod] || Comercial_renderHoje_)(div, alvo || {});
      if (ini.avisos && ini.avisos.some(function (a) { return a.novo; })) Com_chamar_("avisosLidos", {}, function () { ini.avisos.forEach(function (a) { a.novo = false; }); }, function () {});
    });
  }

  /** Atalho vindo do Início, da Caixa de decisões ou de um aviso: { tipo:'comercial', aba, id }. */
  function Comercial_irPara_(acao) {
    var aba = (acao && acao.aba) || "hoje";
    var mod = aba === "oportunidades" ? "comercial_oportunidades" : aba === "propostas" ? "comercial_propostas" : aba === "pedidos" ? "comercial_pedidos" : "comercial";
    abrir(mod);
    if (acao && acao.id) setTimeout(function () { if (aba === "propostas") Comercial_abrirProposta_(acao.id); else if (aba === "oportunidades") Comercial_abrirOportunidade_(acao.id); }, 500);
  }

  // ---------------- janelas ----------------
  function Com_modal_(titulo, corpo, rodape, largura) {
    var ov = document.createElement("div");
    ov.className = "atv-overlay";
    ov.innerHTML = '<div class="atv-modal" style="max-width:' + (largura || 640) + 'px"><div class="atv-modal-cab"><h3>' + Com_esc_(titulo) + '</h3><button type="button" class="atv-fechar" aria-label="Fechar">&times;</button></div>' +
      '<div class="atv-modal-corpo">' + corpo + '</div>' + (rodape ? '<div class="atv-modal-rod">' + rodape + '</div>' : '') + '</div>';
    ov.querySelector(".atv-fechar").onclick = function () { ov.remove(); };
    document.body.appendChild(ov);
    return ov;
  }
  function Com_gaveta_(titulo, corpo) {
    var antiga = Com_$_("cmGaveta"); if (antiga) antiga.remove();
    var g = document.createElement("div");
    g.id = "cmGaveta"; g.className = "atv-overlay"; g.style.justifyContent = "flex-end"; g.style.padding = "0";
    g.innerHTML = '<div class="atv-drawer" role="dialog" aria-label="' + Com_esc_(titulo) + '"><div class="atv-drawer-cab"><h3>' + Com_esc_(titulo) + '</h3><button type="button" class="btn-secondary" data-cm-fechar>Fechar</button></div><div class="atv-drawer-corpo" id="cmGavetaCorpo">' + corpo + '</div></div>';
    g.querySelector("[data-cm-fechar]").onclick = function () { g.remove(); };
    g.addEventListener("click", function (e) { if (e.target === g) g.remove(); });
    document.body.appendChild(g);
    return g;
  }
  function Com_campo_(rotulo, html, ajuda) { return '<div class="cm-campo"><label>' + Com_esc_(rotulo) + "</label>" + html + (ajuda ? '<div class="cm-ajuda-campo">' + Com_esc_(ajuda) + "</div>" : "") + "</div>"; }
  function Com_opcoes_(lista, atual, vazio) {
    return (vazio !== undefined ? '<option value="">' + Com_esc_(vazio) + "</option>" : "") + lista.map(function (o) { var v = typeof o === "object" ? o.v : o, t = typeof o === "object" ? o.t : o; return '<option value="' + Com_esc_(v) + '"' + (String(v) === String(atual || "") ? " selected" : "") + ">" + Com_esc_(t) + "</option>"; }).join("");
  }
  function Com_hojeIso_(dias) { var d = new Date(Date.now() + (dias || 0) * 864e5); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function Com_copiar_(texto, botao) {
    var ok = function () { if (botao) { var t = botao.textContent; botao.textContent = "Copiado"; setTimeout(function () { botao.textContent = t; }, 1500); } };
    try { navigator.clipboard.writeText(texto).then(ok, function () { window.prompt("Copie o texto:", texto); }); } catch (e) { window.prompt("Copie o texto:", texto); }
  }
  function Com_selosOpo_(o) {
    var s = [];
    if (o.situacao === "GANHA") s.push('<span class="cm-selo verde">Ganha</span>');
    if (o.situacao === "PERDIDA") s.push('<span class="cm-selo cinza">Perdida</span>');
    if (o.reaberturaPedida) s.push('<span class="cm-selo laranja">Reabertura pedida</span>');
    if (o.semProxima) s.push('<span class="cm-selo vermelho">Sem próxima ação</span>');
    if (o.atrasada) s.push('<span class="cm-selo vermelho">Retorno atrasado</span>');
    if (o.parada) s.push('<span class="cm-selo vermelho">Parada há ' + o.diasSemContato + ' dias</span>');
    else if (o.esfriando) s.push('<span class="cm-selo laranja">Esfriando</span>');
    if (o.venceHoje) s.push('<span class="cm-selo azul">Retorno hoje</span>');
    if (o.mudarEstrategia) s.push('<span class="cm-selo laranja">Mudar a estratégia</span>');
    return s.join("");
  }
  function Com_seloProp_(p) {
    var cor = { RASCUNHO: "cinza", AGUARDANDO_APROVACAO: "laranja", PRONTA: "azul", ENVIADA: "azul", APROVADA: "verde", RECUSADA: "vermelho", VENCIDA: "vermelho", CANCELADA: "cinza", SUBSTITUIDA: "cinza" }[p.situacao] || "cinza";
    return '<span class="cm-selo ' + cor + '">' + Com_esc_(p.situacaoNome) + "</span>";
  }

  // =========================================================
  // HOJE (a gestora comercial)
  // =========================================================
  function Comercial_renderHoje_(div) {
    var ini = CM.ini;
    var papel = CM.hojePapel || (ini.gestao ? "GESTAO" : "VENDEDOR");
    div.innerHTML = '<div class="module-shell">' + Comercial_cabecalho_("Hoje no Comercial", "O que fazer hoje, em ordem de prioridade, segundo a metodologia comercial da empresa. A gestora comercial sugere; quem decide e envia é você.",
      '<button type="button" class="btn-secondary" id="cmHojeAtualizar"><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Atualizar</button>' +
      '<button type="button" class="btn-primary" id="cmNovaOpo"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Nova oportunidade</button>') +
      (ini.gestao ? '<div class="cm-tabs"><button type="button" class="cm-tab' + (papel === "GESTAO" ? " active" : "") + '" data-papel="GESTAO">Panorama da gestão</button><button type="button" class="cm-tab' + (papel === "VENDEDOR" ? " active" : "") + '" data-papel="VENDEDOR">Minha lista</button></div>' : "") +
      '<div id="cmHoje"><div class="cm-vazio">A gestora está montando a lista…</div></div></div>';
    Com_$_("cmHojeAtualizar").onclick = function () { Comercial_renderHoje_(div); };
    Com_$_("cmNovaOpo").onclick = function () { Comercial_formOportunidade_(null); };
    div.querySelectorAll("[data-papel]").forEach(function (b) { b.onclick = function () { CM.hojePapel = b.getAttribute("data-papel"); Comercial_renderHoje_(div); }; });
    Com_chamar_("hoje", { papel: papel }, function (r) { Comercial_desenharHoje_(r); }, function (m) { Com_msg_("cmHoje", m); });
  }

  function Comercial_desenharHoje_(r) {
    var ini = CM.ini, alvo = Com_$_("cmHoje");
    if (!alvo) return;
    var h = '<div class="cm-gestora"><div class="ic"><i class="fas fa-user-tie" aria-hidden="true"></i></div><div style="flex:1;min-width:0"><p class="t">Gestora comercial · ' + Com_esc_(r.hoje) + '</p>' +
      '<p class="s">' + (r.origem === "IA" ? "Lista conferida pela gestora (IA) contra os dados do sistema" + (r.geradoEm ? " em " + Com_esc_(r.geradoEm) : "") : "Lista pelas regras da metodologia") + '</p><p>' + Com_esc_(r.resumo) + '</p>' +

  function Comercial_renderOportunidades_(div) {
    var ini = CM.ini, f = CM.filtro;
    var funis = ini.funis.map(function (x) { return { v: x.codigo, t: x.nome }; });
    div.innerHTML = '<div class="module-shell">' + Comercial_cabecalho_("Oportunidades", "Cada venda, do primeiro contato ao pedido, ligada ao cliente, à unidade e aos equipamentos do cadastro. Toda oportunidade aberta tem próxima ação em Minhas atividades.",
      '<button type="button" class="btn-secondary" id="cmVisao">' + (CM.visao === "quadro" ? '<i class="fas fa-list" aria-hidden="true"></i>&nbsp;Ver em lista' : '<i class="fas fa-table-columns" aria-hidden="true"></i>&nbsp;Ver em quadro') + '</button>' +
      '<button type="button" class="btn-primary" id="cmNovaOpo2"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Nova oportunidade</button>') +
      '<div class="cm-filtros"><div><label>Situação</label><select id="cmFSit">' + Com_opcoes_([{ v: "ABERTA", t: "Abertas" }, { v: "GANHA", t: "Ganhas" }, { v: "PERDIDA", t: "Perdidas" }, { v: "TODAS", t: "Todas" }], f.situacao) + '</select></div>' +
      '<div><label>Funil</label><select id="cmFFunil">' + Com_opcoes_(funis, f.funil, "Todos") + '</select></div>' +
      (ini.gestao ? '<div><label>Responsável</label><select id="cmFResp">' + Com_opcoes_(ini.equipe.map(function (e) { return { v: e.id, t: e.nome }; }), f.responsavelId, "Toda a equipe") + '</select></div>' : '') +
      '<div style="flex:1 1 200px"><label>Buscar</label><input id="cmFBusca" placeholder="Cliente, título ou código" value="' + Com_esc_(f.busca || "") + '"></div></div><div id="cmOpos"><div class="cm-vazio">Carregando…</div></div></div>';
    Com_$_("cmVisao").onclick = function () { CM.visao = CM.visao === "quadro" ? "lista" : "quadro"; Comercial_renderOportunidades_(div); };
    Com_$_("cmNovaOpo2").onclick = function () { Comercial_formOportunidade_(null); };
    var ler = function () { f.situacao = Com_$_("cmFSit").value; f.funil = Com_$_("cmFFunil").value; f.busca = Com_$_("cmFBusca").value; if (Com_$_("cmFResp")) f.responsavelId = Com_$_("cmFResp").value; Comercial_carregarOpos_(); };
    ["cmFSit", "cmFFunil", "cmFResp"].forEach(function (id) { var el = Com_$_(id); if (el) el.onchange = ler; });
    var t = null; Com_$_("cmFBusca").oninput = function () { clearTimeout(t); t = setTimeout(ler, 400); };
    Comercial_carregarOpos_();
  }

  function Comercial_carregarOpos_() {
    Com_chamar_("oportunidades", CM.filtro, function (r) {
      var alvo = Com_$_("cmOpos"); if (!alvo) return;
      var l = r.oportunidades;
      if (!l.length) { alvo.innerHTML = '<div class="cm-vazio">Nenhuma oportunidade com estes filtros. Toque em "Nova oportunidade" para começar.</div>'; return; }
      var mini = function (o) {
        return '<div class="cm-mini" data-opo="' + Com_esc_(o.id) + '"><b>' + Com_esc_(o.cliente) + '</b>' + Com_esc_(o.titulo) + '<div class="cm-meta" style="margin:4px 0 2px">' + Com_esc_(o.codigo) + (o.valorTxt ? ' · ' + Com_esc_(o.valorTxt) : '') + (CM.ini.gestao ? ' · ' + Com_esc_(o.responsavel) : '') + '</div>' +
          (o.situacao === "ABERTA" ? '<div class="cm-meta">Próxima: ' + Com_esc_(o.proximaAcao || "—") + (o.proximaEm ? ' (' + Com_esc_(o.proximaEm) + ')' : '') + '</div>' : '') + Com_selosOpo_(o) + '</div>';
      };
      if (CM.visao === "quadro" && CM.filtro.situacao === "ABERTA") {
        var funis = CM.ini.funis.filter(function (f) { return !CM.filtro.funil || f.codigo === CM.filtro.funil; });
        alvo.innerHTML = funis.map(function (f) {
          var deste = l.filter(function (o) { return o.funil === f.codigo; });
          if (!deste.length && funis.length > 1) return '';
          return '<p class="cm-sec">' + Com_esc_(f.nome) + '</p><div class="cm-quadro">' + f.etapas.map(function (e) {
            var c = deste.filter(function (o) { return o.etapa === e.codigo; });
            return '<div class="cm-coluna"><h4>' + Com_esc_(e.nome) + '<span>' + e.probabilidade + '% · ' + c.length + '</span></h4>' + c.map(mini).join("") + '</div>';
          }).join("") + '</div>';
        }).join("") || '<div class="cm-vazio">Nenhuma oportunidade aberta.</div>';
      } else alvo.innerHTML = '<div class="cm-lista">' + l.map(mini).join("") + '</div>';
      alvo.querySelectorAll("[data-opo]").forEach(function (c) { c.onclick = function () { Comercial_abrirOportunidade_(c.getAttribute("data-opo")); }; });
    }, function (m) { Com_msg_("cmOpos", m); });
  }

  /** Escolha de cliente, unidade, contato e equipamentos (cadastro único). */
  function Comercial_seletorCliente_(raiz, atual, aoMudar) {
    var st = { clienteId: atual.clienteId || "", clienteNome: atual.cliente || "", unidades: [], equipamentos: [], contatos: [] };
    raiz.innerHTML = Com_campo_("Cliente (cadastro único)", '<input id="cmCliBusca" placeholder="Digite o nome ou o CNPJ" value="' + Com_esc_(st.clienteNome) + '" autocomplete="off"><div id="cmCliRes"></div>', "Cliente que não existe: cadastre em Cadastros > Clientes e volte aqui.") +
      '<div class="cm-grade2"><div id="cmCliUn"></div><div id="cmCliCt"></div></div><div id="cmCliEq"></div>';
    var carregar = function (cid) {
      Com_chamar_("cliente", { clienteId: cid }, function (r) {
        st.unidades = r.unidades; st.equipamentos = r.equipamentos; st.contatos = r.contatos.filter(function (c) { return c.ativo; });
        Com_$_("cmCliUn").innerHTML = Com_campo_("Unidade", '<select id="cmUn">' + Com_opcoes_(st.unidades.map(function (u) { return { v: u.id, t: u.nome + (u.cidade ? " (" + u.cidade + ")" : "") }; }), atual.unidadeId, st.unidades.length ? "Escolha a unidade" : "O cliente não tem unidades") + '</select>');
        var desenharCt = function (sel) {
          Com_$_("cmCliCt").innerHTML = Com_campo_("Contato principal", '<select id="cmCt">' + Com_opcoes_(st.contatos.map(function (c) { return { v: c.id, t: c.nome + (c.cargo ? " — " + c.cargo : "") + (c.unidadeNome ? " (" + c.unidadeNome + ")" : "") }; }), sel, "Escolha o contato") + '</select><button type="button" class="btn-secondary" id="cmNovoCt" style="margin-top:6px">Novo contato</button>');
          Com_$_("cmNovoCt").onclick = function () { Comercial_formContato_({ clienteId: st.clienteId, unidadeId: Com_$_("cmUn") ? Com_$_("cmUn").value : "" }, function (c) { st.contatos.push(c); desenharCt(c.id); }); };
        };
        desenharCt(atual.contatoId);
        var desenharEq = function () {
          var un = Com_$_("cmUn") ? Com_$_("cmUn").value : "";
          var eqs = st.equipamentos.filter(function (e) { return !un || !e.unidadeId || e.unidadeId === un; });
          Com_$_("cmCliEq").innerHTML = eqs.length ? '<div class="cm-campo"><label>Equipamentos envolvidos (opcional)</label>' + eqs.map(function (e) { return '<label class="cm-check"><input type="checkbox" value="' + Com_esc_(e.id) + '"' + ((atual.equipamentos || []).indexOf(e.id) >= 0 ? " checked" : "") + '> ' + Com_esc_(e.texto) + '</label>'; }).join("") + '</div>' : '';
        };
        desenharEq();
        Com_$_("cmUn").onchange = desenharEq;
        if (aoMudar) aoMudar(st);
      });
    };
    var t = null;
    Com_$_("cmCliBusca").oninput = function () {
      clearTimeout(t); var q = this.value;
      t = setTimeout(function () {
        if (q.length < 2) { Com_$_("cmCliRes").innerHTML = ""; return; }
        Com_chamar_("clientes", { busca: q }, function (r) {
          Com_$_("cmCliRes").innerHTML = r.clientes.length ? '<div class="cm-lista" style="gap:4px;margin-top:6px">' + r.clientes.map(function (c) { return '<div class="cm-mini" data-cli="' + Com_esc_(c.id) + '" data-nome="' + Com_esc_(c.nome) + '"><b>' + Com_esc_(c.nome) + '</b>' + Com_esc_(c.cnpj || "sem CNPJ") + '</div>'; }).join("") + '</div>' : '<div class="cm-meta" style="margin-top:6px">Nenhum cliente encontrado. Cadastre em Cadastros > Clientes.</div>';
          Com_$_("cmCliRes").querySelectorAll("[data-cli]").forEach(function (el) { el.onclick = function () { st.clienteId = el.getAttribute("data-cli"); st.clienteNome = el.getAttribute("data-nome"); Com_$_("cmCliBusca").value = st.clienteNome; Com_$_("cmCliRes").innerHTML = ""; atual = {}; carregar(st.clienteId); }; });
        });
      }, 350);
    };
    if (st.clienteId) carregar(st.clienteId);
    return {
      valor: function () {
        return { clienteId: st.clienteId, unidadeId: Com_$_("cmUn") ? Com_$_("cmUn").value : "", contatoId: Com_$_("cmCt") ? Com_$_("cmCt").value : "",
          equipamentos: Array.prototype.map.call(raiz.querySelectorAll("#cmCliEq input:checked"), function (x) { return x.value; }) };
      }
    };
  }

    var ov = Com_modal_(base.id ? "Editar contato" : "Novo contato do cliente",

    var qual = ini.qualificacao.map(function (q) { return Com_campo_(q.nome, '<input data-qual="' + Com_esc_(q.codigo) + '" maxlength="300" value="' + Com_esc_((o.qualificacao || {})[q.codigo] || "") + '">', q.pergunta); }).join("");
    var g = Com_gaveta_(novo ? "Nova oportunidade" : "Editar " + o.codigo,
      '<div id="cmFormCli"></div>' + Com_campo_("Título (o que o cliente precisa)", '<input id="cmOTit" maxlength="200" value="' + Com_esc_(o.titulo || "") + '">') +

      Com_campo_("Valor estimado (R$)", '<input id="cmOValor" inputmode="decimal" placeholder="4.500,00" value="' + Com_esc_(o.valor !== undefined ? String(o.valor).replace(".", ",") : "") + '">') +
      Com_campo_("Chance", '<select id="cmOChance">' + Com_opcoes_([{ v: "BAIXA", t: "Baixa (dor fraca, sem decisor, prazo ou verba)" }, { v: "MEDIA", t: "Média (dor clara, sem decisão)" }, { v: "ALTA", t: "Alta (decisor envolvido e prazo definido)" }], o.chance) + '</select>') +
      Com_campo_("Previsão de fechamento", '<input id="cmOPrev" type="date" value="' + Com_esc_(o.previsao || "") + '">') +
      (ini.gestao ? Com_campo_("Responsável", '<select id="cmOResp">' + Com_opcoes_(ini.equipe.map(function (e) { return { v: e.id, t: e.nome }; }), o.responsavelId || ini.eu.id) + '</select>') : '') + '</div>' +
      '<p class="cm-sec">Qualificação (dor, decisor, verba e prazo)</p>' + qual +
      (novo ? '<p class="cm-sec">Próxima ação (obrigatória)</p><div class="cm-grade3">' + Com_campo_("O que fazer", '<input id="cmPAcao" maxlength="300" placeholder="Ligar para entender o escopo">') +
        Com_campo_("Data", '<input id="cmPData" type="date" value="' + Com_hojeIso_(1) + '">') + Com_campo_("Como", '<select id="cmPTipo">' + Com_opcoes_(Object.keys(ini.tiposContato).map(function (k) { return { v: k, t: ini.tiposContato[k] }; }), "LIGACAO") + '</select>') + '</div>' +
        '<p class="cm-meta">A próxima ação vira uma atividade em Minhas atividades, com prazo, e é cobrada como as outras.</p>' : '') +
      Com_campo_("Observações", '<textarea id="cmOObs" maxlength="3000">' + Com_esc_(o.observacoes || "") + '</textarea>') +
      '<div id="cmOMsg"></div><div class="cm-acoes"><button type="button" class="btn-primary" id="cmOSalvar">' + (novo ? "Criar oportunidade" : "Salvar") + '</button></div>');

    Com_chamar_("propostas", CM.filtroProp, function (r) {
      var alvo = Com_$_("cmProps"); if (!alvo) return;

      }).join("") + '</div>';
      alvo.querySelectorAll("[data-prop]").forEach(function (c) { c.onclick = function () { Comercial_abrirProposta_(c.getAttribute("data-prop")); }; });

  function Comercial_num_(v) { var s = String(v == null ? "" : v).replace(/R\$|\s/g, ""); if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(",", "."); var n = Number(s); return isFinite(n) ? n : 0; }

  }

  // =========================================================
  // METODOLOGIA (a "cartilha" da gestora comercial)
  // =========================================================
  function Comercial_renderMetodologia_(div) {
    div.innerHTML = '<div class="module-shell">' + Comercial_cabecalho_("Metodologia comercial", "As regras que a gestora comercial segue: funis e etapas, qualificação, cadência, estratégias, objeções, política de desconto, modelo da proposta e pós-venda. Quem escreve é a gestão; cada versão fica no histórico.") + '<div id="cmMet"><div class="cm-vazio">Carregando…</div></div></div>';
    Com_chamar_("metodologia", {}, function (r) { Comercial_desenharMetodologia_(r); }, function (m) { Com_msg_("cmMet", m); });
  }
  function Comercial_desenharMetodologia_(r) {
    var m = r.metodologia, ed = r.podeEditar, alvo = Com_$_("cmMet"), dis = ed ? "" : " disabled";
    var linhas = function (l) { return (l || []).join("\n"); };
    var ta = function (id, v, alt) { return '<textarea id="' + id + '"' + dis + ' style="min-height:' + (alt || 90) + 'px">' + Com_esc_(v) + '</textarea>'; };
    var h = '<p class="cm-meta">Versão ' + Com_esc_(m.versao) + (m.atualizadaEm ? ' · ' + Com_esc_(m.atualizadaEm) + ' por ' + Com_esc_(m.atualizadaPor) : ' · padrão trazido do Comercial do COMMAND') + '</p>';
    h += '<div class="cm-caixa"><h3>Tese e regras de ouro</h3>' + Com_campo_("Tese", ta("cmMTese", m.tese, 60)) + Com_campo_("Regras de ouro (uma por linha)", ta("cmMOuro", linhas(m.regrasDeOuro), 110)) + '</div>';
    h += '<div class="cm-caixa"><h3>Funis e etapas</h3><p class="cm-meta">Uma etapa por linha: nome | probabilidade % | máximo de dias na etapa | critério para sair | itens da lista separados por ;</p>' + m.funis.map(function (f, k) {
      return Com_campo_("Funil " + f.nome + " — " + f.descricao, ta("cmMFunil" + k, f.etapas.map(function (e) { return [e.nome, e.probabilidade, e.maxDias, e.criterio, (e.checklist || []).join("; ")].join(" | "); }).join("\n"), 130));
    }).join("") + '</div>';
    h += '<div class="cm-caixa"><h3>Listas</h3><div class="cm-grade2">' + Com_campo_("Origens (uma por linha)", ta("cmMOrig", linhas(m.origens), 150)) + Com_campo_("Motivos de perda (um por linha)", ta("cmMPerda", linhas(m.motivosPerda), 150)) + '</div>' + Com_campo_("Regra da perda", ta("cmMRegraPerda", m.regraPerda, 50)) + '</div>';
    h += '<div class="cm-caixa"><h3>Qualificação</h3>' + Com_campo_("Critério", ta("cmMQCrit", m.qualificacao.criterio, 50)) + Com_campo_("Itens (nome | pergunta, um por linha)", ta("cmMQItens", m.qualificacao.itens.map(function (i) { return i.nome + " | " + i.pergunta; }).join("\n"), 100)) +
      Com_campo_("Perguntas de qualificação rápida (uma por linha)", ta("cmMQPerg", linhas(m.qualificacao.perguntas), 120)) + Com_campo_("Perfil de cliente atendido", ta("cmMQPerfil", m.qualificacao.perfilCliente, 60)) + '</div>';
    var c = m.cadencia;
    var num = function (id, v, rot, aj) { return Com_campo_(rot, '<input id="' + id + '" inputmode="numeric" value="' + Com_esc_(v) + '"' + dis + '>', aj); };
    h += '<div class="cm-caixa"><h3>Cadência de retorno</h3><div class="cm-grade3">' + num("cmMCEsf", c.esfriandoDias, "Esfriando após (dias sem contato)") + num("cmMCPar", c.paradaDias, "Parada após (dias sem contato)") + num("cmMCTent", c.tentativasMudarEstrategia, "Mudar a estratégia após (tentativas sem resposta)") +
      num("cmMCLemb", c.propostaLembreteDiaUtil, "Retorno da proposta no (dia útil)") + num("cmMCEsc", c.propostaEscalaDiaUtil, "Proposta sem resposta: gestão no (dia útil)") + num("cmMCVenc", c.propostaVencendoDias, "Avisar proposta vencendo (dias antes)") + '</div>' +
      Com_campo_("Passos da cadência (dia | canal | título, um por linha; canais: LIGACAO, WHATSAPP, EMAIL, REUNIAO, VISITA)", ta("cmMCPassos", c.passos.map(function (p) { return p.dia + " | " + p.canal + " | " + p.titulo; }).join("\n"), 120)) +
      '<p class="cm-meta">Não há cobrança a cada hora: o retorno vira atividade em Minhas atividades e é cobrado pela regra das atividades (sistema até resolver, e-mail no expediente, WhatsApp só no resumo diário).</p></div>';
    h += '<div class="cm-caixa"><h3>Estratégias, objeções e mensagens</h3>' + Com_campo_("Estratégias quando o cliente não responde (código | título | texto)", ta("cmMEstr", m.estrategias.map(function (e) { return e.codigo + " | " + e.titulo + " | " + e.texto; }).join("\n"), 120)) +
      Com_campo_("Objeções (objeção | resposta)", ta("cmMObj", m.objecoes.map(function (o) { return o.objecao + " | " + o.resposta; }).join("\n"), 120)) +
      Object.keys(m.modelosMensagem).map(function (k) { return Com_campo_("Modelo de mensagem: " + k + " (use {nome}, {assunto}, {eu}, {proposta})", ta("cmMMsg_" + k, m.modelosMensagem[k], 70)); }).join("") + '</div>';
    h += '<div class="cm-caixa"><h3>Política de desconto</h3><div class="cm-grade2">' + num("cmMDesc", m.politica.descontoMaxPct, "Desconto máximo sem aprovação (%)") + num("cmMMarg", m.politica.margemMinPct, "Margem mínima quando o item tem custo (%)", "0 = não confere margem") + '</div>' + Com_campo_("Texto da política", ta("cmMPolTxt", m.politica.texto, 70)) + '</div>';
    var pr = m.proposta;
    h += '<div class="cm-caixa"><h3>Modelo da proposta</h3><p class="cm-meta">Quando o modelo oficial da empresa chegar, os textos entram aqui. Valem para as propostas novas.</p>' + num("cmMVal", pr.validadeDias, "Validade padrão (dias)") + Com_campo_("Apresentação", ta("cmMPApr", pr.apresentacao, 120)) +
      '<div class="cm-grade2">' + Object.keys(pr.condicoes).map(function (k) { return Com_campo_("Condição padrão: " + k, ta("cmMPC_" + k, pr.condicoes[k], 60)); }).join("") + '</div>' + Com_campo_("Responsabilidades", ta("cmMPResp", pr.responsabilidades, 160)) + Com_campo_("Texto do aceite", ta("cmMPAceite", pr.textoAceite, 60)) + '</div>';
    var pv = m.posVenda;
    var pessoas = (r.equipeSgo || []).map(function (u) { return { v: u.id, t: u.nome }; });
    h += '<div class="cm-caixa"><h3>Pós-venda (passagem aos setores)</h3>' + Object.keys(CM.ini.setores).map(function (s) {
      return '<div class="cm-grade3">' + num("cmMPV_" + s, pv[s].prazoDiasUteis, CM.ini.setores[s] + ": prazo (dias úteis)") + Com_campo_("Quem recebe", '<select id="cmMPVR_' + s + '"' + dis + '>' + Com_opcoes_(pessoas, (pv.destinatarios[s] || [])[0], "Padrão: gestor da área na Caixa de decisões") + '</select>') + Com_campo_("Lista de conferência (uma por linha)", ta("cmMPVC_" + s, linhas(pv[s].checklist), 90)) + '</div>';
    }).join("") + num("cmMPVParado", pv.pedidoParadoDiasUteis, "Pedido sem passagem vai para a Caixa após (dias úteis)") + '</div>';
    h += '<div class="cm-caixa"><h3>Gestão comercial</h3><p class="cm-meta">Gestor com área Comercial no cadastro já é gestão comercial. Aqui entram outras pessoas (por exemplo um Gestor de outra área que também responde pelo Comercial).</p>' +
      (pessoas.length ? '<div style="max-height:180px;overflow:auto">' + pessoas.map(function (p) { return '<label class="cm-check"><input type="checkbox" data-gestor="' + Com_esc_(p.v) + '"' + ((m.gestores || []).indexOf(p.v) >= 0 ? ' checked' : '') + dis + '> ' + Com_esc_(p.t) + '</label>'; }).join("") + '</div>' : '') + '</div>';
    if (r.aprendizado && r.aprendizado.length) h += '<div class="cm-caixa"><h3>O que a equipe fez com as sugestões da gestora</h3><table class="cm-tabela"><thead><tr><th>Tipo</th><th>Regra</th><th class="n">Sugestões</th><th class="n">Usadas</th><th class="n">Não serviram</th><th>Por que não serviram</th></tr></thead><tbody>' +
      r.aprendizado.map(function (a) { return '<tr><td data-r="Tipo">' + Com_esc_(a.tipo) + '</td><td data-r="Regra">' + Com_esc_(a.regra) + '</td><td class="n" data-r="Sugestões">' + a.total + '</td><td class="n" data-r="Usadas">' + a.usadas + '</td><td class="n" data-r="Não serviram">' + a.descartadas + '</td><td data-r="Motivos">' + Com_esc_(a.motivos.join("; ")) + '</td></tr>'; }).join("") + '</tbody></table></div>';
    if (r.versoes && r.versoes.length) h += '<div class="cm-caixa"><h3>Versões</h3>' + r.versoes.map(function (v) { return '<p class="cm-txt">Versão ' + v.versao + ' · ' + Com_esc_(v.em) + ' · ' + Com_esc_(v.por) + ': ' + Com_esc_(v.motivo) + '</p>'; }).join("") + '</div>';
    if (ed) h += '<div class="cm-caixa">' + Com_campo_("O que mudou e por quê (obrigatório)", '<textarea id="cmMMotivo" maxlength="500"></textarea>') + '<div id="cmMMsg"></div><div class="cm-acoes"><button type="button" class="btn-primary" id="cmMSalvar">Salvar nova versão</button></div></div>';
    alvo.innerHTML = h;
    if (!ed) return;
    Com_$_("cmMSalvar").onclick = function () {
      try {
        var v = function (id) { var el = Com_$_(id); return el ? el.value : ""; };
        var ls = function (id) { return v(id).split("\n").map(function (x) { return x.trim(); }).filter(Boolean); };
        var partes = function (l) { return l.split("|").map(function (x) { return x.trim(); }); };
        var n = JSON.parse(JSON.stringify(m));
        n.tese = v("cmMTese"); n.regrasDeOuro = ls("cmMOuro");
        n.funis.forEach(function (f, k) { var antigas = f.etapas; f.etapas = ls("cmMFunil" + k).map(function (l, j) { var p = partes(l); return { codigo: (antigas[j] && antigas[j].codigo) || (f.codigo.slice(0, 3) + "_" + (j + 1)), nome: p[0], probabilidade: Number(p[1]), maxDias: Number(p[2]) || 0, criterio: p[3] || "", checklist: (p[4] || "").split(";").map(function (x) { return x.trim(); }).filter(Boolean) }; }); });
        n.origens = ls("cmMOrig"); n.motivosPerda = ls("cmMPerda"); n.regraPerda = v("cmMRegraPerda");
        n.qualificacao = { criterio: v("cmMQCrit"), perguntas: ls("cmMQPerg"), perfilCliente: v("cmMQPerfil"), itens: ls("cmMQItens").map(function (l, j) { var p = partes(l); var ant = m.qualificacao.itens[j]; return { codigo: ant ? ant.codigo : "Q" + (j + 1), nome: p[0], pergunta: p[1] || "" }; }) };
        n.cadencia = { esfriandoDias: Number(v("cmMCEsf")), paradaDias: Number(v("cmMCPar")), tentativasMudarEstrategia: Number(v("cmMCTent")), propostaLembreteDiaUtil: Number(v("cmMCLemb")), propostaEscalaDiaUtil: Number(v("cmMCEsc")), propostaVencendoDias: Number(v("cmMCVenc")), carteiraEsquecidaDias: m.cadencia.carteiraEsquecidaDias,
          passos: ls("cmMCPassos").map(function (l) { var p = partes(l); return { dia: Number(p[0]), canal: (p[1] || "LIGACAO").toUpperCase(), titulo: p[2] || "" }; }) };
        n.estrategias = ls("cmMEstr").map(function (l) { var p = partes(l); return { codigo: (p[0] || "").toUpperCase(), titulo: p[1] || "", texto: p[2] || "" }; });
        n.objecoes = ls("cmMObj").map(function (l) { var p = partes(l); return { objecao: p[0], resposta: p[1] || "" }; });
        Object.keys(m.modelosMensagem).forEach(function (k) { n.modelosMensagem[k] = v("cmMMsg_" + k); });
        n.politica.descontoMaxPct = Number(String(v("cmMDesc")).replace(",", ".")); n.politica.margemMinPct = Number(String(v("cmMMarg")).replace(",", ".")); n.politica.texto = v("cmMPolTxt");
        n.proposta.validadeDias = Number(v("cmMVal")); n.proposta.apresentacao = v("cmMPApr"); Object.keys(m.proposta.condicoes).forEach(function (k) { n.proposta.condicoes[k] = v("cmMPC_" + k); }); n.proposta.responsabilidades = v("cmMPResp"); n.proposta.textoAceite = v("cmMPAceite");
        Object.keys(CM.ini.setores).forEach(function (s) { n.posVenda[s].prazoDiasUteis = Number(v("cmMPV_" + s)) || 1; n.posVenda[s].checklist = ls("cmMPVC_" + s); n.posVenda.destinatarios[s] = v("cmMPVR_" + s) ? [v("cmMPVR_" + s)] : []; });
        n.posVenda.pedidoParadoDiasUteis = Number(v("cmMPVParado")) || 1;
        n.gestores = Array.prototype.map.call(document.querySelectorAll("[data-gestor]:checked"), function (x) { return x.getAttribute("data-gestor"); });
        delete n.versao; delete n.atualizadaEm; delete n.atualizadaPor;
        Com_chamar_("metodologia", { salvar: n, motivo: v("cmMMotivo") }, function (x) { CM.ini = null; Comercial_garantirInicio_(function () {}); Comercial_desenharMetodologia_(Object.assign(r, { metodologia: x.metodologia })); Com_msg_("cmMMsg", x.message, "ok"); }, function (e) { Com_msg_("cmMMsg", e); });
      } catch (e) { Com_msg_("cmMMsg", "Não foi possível ler a metodologia da tela: " + (e && e.message ? e.message : e) + ". Confira o formato das linhas (campos separados por |)."); }
    };
  }
</script>

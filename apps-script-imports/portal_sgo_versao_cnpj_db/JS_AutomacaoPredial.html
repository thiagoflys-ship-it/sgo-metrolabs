<script>
  // ==========================================================
  // SEGURANÇA E AUTOMAÇÃO PREDIAL (22/10/2026)
  // Servidor: SGO_Automacao_Predial.js (AutPred_api(sessionId, acao, dados)); nuvem: SGO_Automacao_Tuya.js.
  // Ganchos na casca (JS_Core): AutPred_iniciar_ no login (menu para quem o servidor liberar), AutPred_parar_ no
  // logout, abrir('automacao_predial') -> AutPred_render_. A tela não se redesenha sozinha: só depois de uma ação
  // ou no botão "Atualizar" (formulário aberto nunca é apagado). Só os selos de posição dos portões e o pedido da
  // campainha são trocados no lugar, enquanto a tela está aberta. Toda regra é conferida de novo no servidor.
  // ==========================================================
  // 27/10/2026 (cota da Tuya): as consultas da tela seguem o ritmo que o servidor devolve (proximaS) e param com a aba em
  // segundo plano (document.visibilityState); voltam na hora quando a aba aparece. infra = situação da nuvem para a equipe.
  var AUTP = { pedidos: {}, pedTimer: null, pedRelogio: null, pedLidoEm: 0, pedAtivo: false, pedTick: null, portTimer: null, portAtivo: false, portTick: null, posicoes: {}, menu: false, acionar: false, adm: false, diretoria: false, dados: null, rapido: [], aba: "dispositivos", aberto: "", perms: null, aud: null, unidades: null, mensagem: "", infra: null, saude: null };

  function AutPred_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function AutPred_temMenu_() { return !!AUTP.menu; }
  /** Atalhos "Portões" (celular e Início): só para quem pode acionar algum dispositivo agora (o servidor decide). */
  function AutPred_temAcionar_() { return !!AUTP.acionar; }
  function AutPred_uuid_() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "op-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
  }

  function AutPred_chamar_(acao, dados, ok, falha) {
    google.script.run
      .withSuccessHandler(function (r) { if (r && r.ok) { try { ok(r); } catch (e) { console.error("Automação " + acao + ":", e); falha("A resposta chegou, mas a tela não conseguiu mostrar. Atualize a página (F5)."); } } else falha((r && r.message) || "Não foi possível concluir. Tente de novo."); })
      .withFailureHandler(function (e) { falha((e && e.message) || "Sem comunicação com o SGO+. Confira a internet e tente de novo; nada foi alterado."); })
      .AutPred_api(SGO_getSessionId(), acao, dados || {});
  }

  // ---------- ciclo de vida ----------
  function AutPred_mostrarMenu_() {
    var g = document.getElementById("menu-secao-automacao"), b = document.getElementById("menu-btn-automacao_predial");
    if (g) g.style.display = AUTP.menu ? "" : "none";
    if (b) b.style.display = AUTP.menu ? "" : "none";
  }
  function AutPred_iniciar_() {
    AUTP.menu = false; AUTP.dados = null;
    AutPred_mostrarMenu_();
    if (!SESSION) return;
    AutPred_chamar_("iniciar", {}, function (r) {
      AUTP.menu = !!r.mostrarMenu; AUTP.acionar = !!r.podeAcionar; AUTP.adm = !!r.podeAdministrar; AUTP.diretoria = !!r.ehDiretoria; AutPred_mostrarMenu_();
      // a resposta chega depois de a tela inicial montar: acrescenta o atalho "Portões" a ela (celular) ou os botões (computador)
      if (!AUTP.acionar) return;
      try {
        if (window.SGO_MODULO_ATUAL === "mobile_home" || (window.SGO_MODULO_ATUAL === "dashboard" && typeof ehMobileModo_ === "function" && ehMobileModo_())) { if (typeof renderMobileHome_ === "function" && !document.querySelector('.mobile-home-tile[onclick*="automacao_predial"]')) renderMobileHome_(); }
        else if (window.SGO_MODULO_ATUAL === "dashboard" || !window.SGO_MODULO_ATUAL) AutPred_atalhoInicio_();
      } catch (e) { console.error("Automação predial, atalho:", e); }
    }, function () { AUTP.menu = false; AutPred_mostrarMenu_(); });
  }
  function AutPred_parar_() { AutPred_pararPedidos_(); AutPred_pararPortoes_(); AUTP.menu = false; AUTP.acionar = false; AUTP.rapido = []; AUTP.dados = null; AUTP.perms = null; AUTP.aud = null; AutPred_mostrarMenu_(); }

  // ---------- tela ----------
  function AutPred_render_() {
    var div = document.getElementById("conteudo");
    if (!div) return;
    if (typeof CadUI_movel_ === "function" && CadUI_movel_()) { try { MOBILE_NAV = { modulo: "mobile_home", tela: "lista" }; atualizarTituloMobile_("Portões"); window.scrollTo(0, 0); } catch (e) {} }
    AUTP.aberto = ""; AUTP.mensagem = "";
    div.innerHTML =
      '<div class="module-shell cadx" id="autTela">' +
        '<div id="autRapido" class="aut-rapido"></div>' +
        '<section id="intelbrasPainel" class="intelbras-operacao cadx-card" aria-live="polite"></section>' +
        '<div class="module-header"><div class="module-header-left"><h2 class="content-title">Segurança e automação predial</h2>' +
          '<p class="content-subtitle">Portões e porta da Diretoria pela nuvem do Smart Life. Cada comando passa por: solicitado, aceito pela nuvem e execução confirmada pelo dispositivo.</p></div>' +
          '<div class="module-header-right"><button type="button" class="cadx-btn cadx-btn-grande" id="autAtualizar" onclick="AutPred_carregar_()">Atualizar</button></div></div>' +
        CadUI_ajuda_(
          "<ul><li><b>Portões</b>: toda a equipe vê e aciona. Na garagem, use <b>Abrir / fechar portão</b>: o mesmo botão abre o fechado e fecha o aberto, como no Smart Life. A posição é consultada antes da janela; confira a ação e o nome e toque em \"Sim\". Aguarde o fim do percurso antes de tocar novamente.</li>" +
          "<li>O selo grande mostra a posição do portão (<b>Aberto</b>, <b>Fechado</b>, <b>Abrindo…</b>, <b>Fechando…</b>). Com a tela aberta e visível, ela é atualizada a cada poucos segundos durante o percurso de um comando e com menos frequência com o portão parado (economia da nuvem da Tuya). Para ler agora, use \"Ler estado\". Quando a posição muda, aparece um aviso no topo.</li>" +
          "<li>Se aparecer <b>\"Portões pelo SGO+ fora do ar no momento\"</b>, use o controle ou o aplicativo Smart Life: a gestão é avisada sozinha. O alarme não depende dessa nuvem.</li>" +
          "<li><b>Aceito</b> quer dizer que a nuvem recebeu; <b>Execução confirmada</b> quer dizer que o dispositivo informou a mudança. Até a confirmação, não considere a porta aberta.</li>" +
          "<li>A <b>porta da Diretoria</b> só aparece para os diretores. O responsável pelo sistema destrava por padrão; outro diretor só com a permissão \"Acionar\" concedida por ele. Ela abre quando tocam a campainha: toque em \"Abrir agora\" ou marque <b>\"Abrir automaticamente quando tocarem a campainha\"</b> (desmarcado, volta ao \"Abrir agora\").</li>" +
          "<li><b>Simulação</b>: enquanto a automação está desligada em Chaves e senhas ou o dispositivo não foi homologado pela Diretoria, o SGO+ registra o que teria feito e nada é enviado.</li>" +

  // ---------- registro de rastreabilidade legível (22/10/2026) ----------

  function AutPred_diaLocal_(desloc) { var d = new Date(Date.now() - (desloc || 0) * 86400000); var p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }

  function AutPred_conferir_(comandoId) {

    AutPred_chamar_("conferir", { comandoId: comandoId }, function (r) { AutPred_carregar_(r.mensagem, r.comando && r.comando.situacao === "CONFIRMADO" ? "tom-ok" : "tom-alerta"); }, function (m) { AutPred_msg_(AutPred_faixa_(m, "tom-perigo")); });
  }

  // ---------- comando ----------
  // ---------- botões rápidos (topo do módulo e Início) ----------
  function AutPred_tomSit_(c) { return c === "CONFIRMADO" ? "tom-ok" : (c === "ACEITO" || c === "INCERTO") ? "tom-alerta" : c === "SIMULADO" ? "tom-info" : c ? "tom-perigo" : ""; }
  function AutPred_tituloRapido_(d) {
    var nome = d.nome || 'Acesso';
    if (/diretoria|smart lock/i.test(nome)) nome = 'Porta da Diretoria';
    else if (nome === nome.toUpperCase()) nome = nome.toLowerCase().replace(/(^|\s)([a-zà-ú])/g, function(_,a,b){return a+b.toUpperCase();});
    return '<div class="aut-rapido-titulo"><span class="aut-rapido-icone"><i class="fas ' + (d.tipo === 'FECHADURA' ? 'fa-lock' : 'fa-door-open') + '" aria-hidden="true"></i></span><div><div class="aut-rapido-nome">' + AutPred_esc_(nome) + '</div><div class="aut-rapido-tipo">' + (d.tipo === 'FECHADURA' ? 'Acesso da Diretoria' : d.pulsoAlternado ? 'Garagem' : 'Acesso de pedestres') + '</div></div></div>';
  }
  function AutPred_desenharRapido_(el, lista, contexto) {
    if (!el) return;
    lista = lista || [];
    if (!lista.length) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="aut-rapido-cab"><div><h3>Acessos e segurança</h3><p>Controle os acessos e acompanhe o estado dos equipamentos.</p></div></div><div class="aut-infra" role="status"></div><div class="aut-rapido-grade">' + lista.map(function (d) {
      var porta = d.tipo === "FECHADURA";
      if (d.remotoFechadura === "PEDIDO") {
        return '<div class="aut-rapido-item' + (d.restrito ? " is-restrito" : "") + '" data-aut-pedido="' + AutPred_esc_(d.id) + '">' + AutPred_tituloRapido_(d) +
          '<div class="aut-rapido-estado">' + (d.online ? '<span class="cadx-selo bc-selo tom-ok">Online</span>' : '<span class="cadx-selo bc-selo tom-perigo">Offline</span>') +
            (d.modo === "SIMULACAO" ? '<span class="cadx-selo bc-selo tom-info">Simulação</span>' : "") + "</div>" +
          '<div class="aut-pedido-area" id="autPedArea_' + contexto + "_" + d.id + '">' + AutPred_htmlPedido_(d.id, contexto) + "</div>" +
          (d.autoAbrir ? '<div class="cadx-sub">Abertura automática ligada</div>' : "") + "</div>";
      }
      return '<div class="aut-rapido-item' + (d.restrito ? " is-restrito" : "") + '">' + AutPred_tituloRapido_(d) +
        AutPred_htmlPosicao_(d.id, d.estadoPortao) +
        '<div class="aut-rapido-estado">' + (d.online ? '<span class="cadx-selo bc-selo tom-ok">Online</span>' : '<span class="cadx-selo bc-selo tom-perigo">Offline</span>') +
          (d.modo === "SIMULACAO" ? '<span class="cadx-selo bc-selo tom-info">Simulação</span>' : "") +
          // 23/10/2026: a situação do último comando só aparece enquanto vale "Conferir agora" (15 min); depois, só a hora
          '<span data-aut-sit="' + AutPred_esc_(d.id) + '">' + AutPred_htmlSit_(d) + "</span>" +
          (d.ultComandoEm ? '<span class="cadx-sub">último: ' + AutPred_esc_(d.ultComandoEm) + "</span>" : "") + "</div>" +
        AutPred_htmlBotoesRapidos_(d, contexto) + "</div>";
    }).join("") + "</div>";
    lista.forEach(function (d) { if (d.estadoPortao && AUTP.posicoes[d.id] === undefined) AUTP.posicoes[d.id] = d.estadoPortao.codigo || ""; if (d.tipo !== "FECHADURA") AutPred_marcarLibera_(d.id, d.liberaEmS || 0); });
    AutPred_iniciarLibera_();
    AutPred_mostrarInfra_(AUTP.infra);
    AutPred_iniciarPedidos_();
    AutPred_iniciarPortoes_();
    // depois de um comando a tela é redesenhada: a próxima leitura da posição sai logo (o servidor acelera no percurso)
    if (AUTP.portAgendar) AUTP.portAgendar(2);
  }

  // ---------- situação da nuvem para a equipe (27/10/2026) ----------
  // Falha da nuvem da Tuya (cota, plano, credencial) não aparece como erro técnico: a faixa diz o que fazer, e o alarme,
  // que não depende dessa nuvem, segue no bloco dele.
  function AutPred_mostrarInfra_(infra) {
    if (infra) AUTP.infra = infra;
    var i = AUTP.infra || {}, h = "";
    if (i.portoesForaDoAr) h = '<div class="cadx-faixa bc-faixa tom-perigo" role="alert"><strong>' + AutPred_esc_(i.texto) + "</strong>" + (i.alarmeTexto ? " " + AutPred_esc_(i.alarmeTexto) : "") + "</div>";
    else if (i.economico) h = '<div class="cadx-faixa bc-faixa tom-alerta">Economia da nuvem ligada: a posição dos portões e a campainha não são relidas sozinhas. Toque em "Ler estado" ou em "Verificar campainha agora" e confira no local antes de fechar.</div>';
    document.querySelectorAll(".aut-infra").forEach(function (el) { if (el.innerHTML !== h) el.innerHTML = h; });
  }
  /** Aba de volta à frente: as consultas paradas voltam na hora. */
  function AutPred_aoVoltarVisivel_() {
    if (document.visibilityState === "hidden") return;
    if (AUTP.portAtivo && !AUTP.portTimer && AUTP.portTick) AUTP.portTick();
    if (AUTP.pedAtivo && !AUTP.pedTimer && AUTP.pedTick) AUTP.pedTick();
  }
  if (!window.AUTP_VISIVEL_LIGADO) { window.AUTP_VISIVEL_LIGADO = true; document.addEventListener("visibilitychange", AutPred_aoVoltarVisivel_); }

  // ---------- posição do portão (23/10/2026, dono: "no Smart Life mostra abrindo e fechando e avisa que o portão abriu") ----------
  // Com a tela aberta, o SGO+ relê a cada 5 s (leitura compartilhada no servidor) e troca só os selos no lugar; quando a
  // posição muda, mostra o aviso no topo. Para quando a tela fecha ou fica em segundo plano.
  function AutPred_htmlPosicao_(id, e) {
    e = e || {};
    var cls = { ABERTO: "is-aberto", FECHADO: "is-fechado", ABRINDO: "is-movendo", FECHANDO: "is-movendo" }[e.codigo] || "";
    var ic = { ABERTO: "fa-door-open", FECHADO: "fa-door-closed", ABRINDO: "fa-arrows-left-right", FECHANDO: "fa-arrows-left-right" }[e.codigo] || "fa-circle-question";
    var texto = e.codigo ? e.texto : "Posição: sem sensor";
    return '<div><span class="aut-posicao ' + cls + '" data-aut-posicao="' + AutPred_esc_(id) + '" role="status"><i class="fas ' + ic + '" aria-hidden="true"></i>' + AutPred_esc_(texto) + "</span></div>";
  }
  /** Selo da situação do último comando: só enquanto vale o "Conferir agora" (15 min); a releitura da tela troca no lugar. */
  function AutPred_htmlSit_(d) { return d.ultComandoCodigo && d.ultComandoRecente ? '<span class="cadx-selo bc-selo ' + AutPred_tomSit_(d.ultComandoCodigo) + '">' + AutPred_esc_(d.ultComandoSituacao) + "</span>" : ""; }
  function AutPred_pararPortoes_() { if (AUTP.portTimer) clearTimeout(AUTP.portTimer); AUTP.portTimer = null; AUTP.portAtivo = false; AUTP.portAgendar = null; }
  function AutPred_iniciarPortoes_() {
    if (!document.querySelector("[data-aut-posicao]")) { AutPred_pararPortoes_(); return; }
    if (AUTP.portAtivo) return;
    AUTP.portAtivo = true;
    var consultando = false, primeira = true;
    // 27/10/2026: ritmo dado pelo servidor (proximaS: 3 s no percurso, 10 s parado); a
    // consulta à tela não gasta cota da Tuya (quem decide reler na nuvem é o servidor, com leitura compartilhada)
    var agendar = function (s) { if (!AUTP.portAtivo) return; if (AUTP.portTimer) clearTimeout(AUTP.portTimer); AUTP.portTimer = setTimeout(tickPortoes, Math.max(2, Number(s) || 30) * 1000); };
    AUTP.portAgendar = agendar;
    // 23/10/2026: a primeira leitura sai na hora (antes, a tela mostrava a última posição guardada por até 5 s)
    var tickPortoes = function () {
      AUTP.portTimer = null;
      if (!document.querySelector("[data-aut-posicao]")) { AutPred_pararPortoes_(); return; } // a tela fechou
      if (document.visibilityState === "hidden") return; // aba em segundo plano: para; volta em AutPred_aoVoltarVisivel_
      if (consultando) return;
      consultando = true;
      AutPred_chamar_("portoes", {}, function (r) {
        consultando = false;
        AutPred_mostrarInfra_(r.infra);
        agendar(r.proximaS);
        (r.itens || []).forEach(function (x) {
          var e = x.estadoPortao || {}, antes = AUTP.posicoes[x.id], agora = e.codigo || "";
          document.querySelectorAll('[data-aut-posicao="' + x.id + '"]').forEach(function (el) { el.parentNode.outerHTML = AutPred_htmlPosicao_(x.id, e); });
          document.querySelectorAll('[data-aut-sit="' + x.id + '"]').forEach(function (el) { el.innerHTML = AutPred_htmlSit_(x); });
          AutPred_marcarLibera_(x.id, x.liberaEmS || 0);
          AUTP.posicoes[x.id] = agora;
          if (!primeira && antes !== undefined && antes !== agora && (agora === "ABERTO" || agora === "FECHADO")) {
            var d = AutPred_dispositivo_(x.id);
            AutPred_avisoPosicao_((d ? d.nome : "Portão") + (agora === "ABERTO" ? " abriu" : " fechou") + " às " + (r.hora || ""), agora === "ABERTO" ? "tom-alerta" : "tom-ok");
          }
        });
        primeira = false; // a primeira leitura só acerta a posição guardada, sem aviso de mudança
      }, function () { consultando = false; agendar(30); });
    };
    AUTP.portTick = tickPortoes;
    tickPortoes();
  }
  function AutPred_avisoPosicao_(texto, tom) {
    var ini = document.getElementById("autInicio");
    if (ini && !document.getElementById("autTela")) {
      var m = ini.querySelector(".aut-inicio-msg");
      if (!m) { m = document.createElement("div"); m.className = "aut-inicio-msg"; ini.insertBefore(m, ini.firstChild); }
      m.innerHTML = AutPred_faixa_(texto, tom);
      return;
    }
    AutPred_msg_(AutPred_faixa_(texto, tom));
  }

  // ---------- abertura automática pela campainha (23/10/2026, decisão do dono) ----------
  /** Painel devolvido por uma ação: redesenha o módulo (ou só os botões do Início). */
  function AutPred_aplicarPainel_(r) {
    AUTP.rapido = r.rapido || AUTP.rapido;
    AUTP.acionar = AUTP.rapido.length > 0;
    if (document.getElementById("autTela")) { AUTP.dados = r; AutPred_desenhar_(); AutPred_desenharRapido_(document.getElementById("autRapido"), AUTP.rapido, "modulo"); }
    else AutPred_desenharRapido_(document.getElementById("autInicio"), AUTP.rapido, "inicio");
    if (r.mensagem) AutPred_avisoPosicao_(r.mensagem, "tom-ok");
  }

  // ---------- abrir e fechar (22/10/2026: garagem com abrir e fechar; pedestre só pulso, fecha manualmente) ----------
  function AutPred_btnAcao_(id, contexto, acao, rotulo, classe, icone) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = classe;
    if (acao === "ABRIR" || acao === "ALTERNAR") b.id = (contexto === "modulo" ? "autBtnC_" : "autBtnR_" + contexto + "_") + id;
    b.setAttribute("onclick", "AutPred_pedir_(" + JSON.stringify(String(id)).replace(/"/g, "'") + ", '" + contexto + "', this, '" + acao + "')");
    b.innerHTML = (icone ? '<i class="fas ' + icone + '" aria-hidden="true"></i>' : "") + AutPred_esc_(rotulo);
    // 23/10/2026: portão de pulso no percurso: o botão mostra "Aguarde N s" e volta sozinho (AutPred_contarLibera_)
    b.setAttribute("data-aut-gate", String(id));
    b.setAttribute("data-rotulo", b.innerHTML);
    return b.outerHTML;
  }
  /** id -> hora (ms) em que o próximo pulso fica liberado; vem do servidor em segundos (liberaEmS). */
  function AutPred_marcarLibera_(id, s) { AUTP.libera = AUTP.libera || {}; AUTP.libera[id] = s > 0 ? Date.now() + s * 1000 : 0; }
  function AutPred_contarLibera_() {
    var botoes = document.querySelectorAll("[data-aut-gate]");
    if (!botoes.length) { if (AUTP.liberaTimer) clearInterval(AUTP.liberaTimer); AUTP.liberaTimer = null; return; }
    botoes.forEach(function (b) {
      if (b.textContent === "Aguarde…") return; // preparando um comando
      var falta = Math.ceil((((AUTP.libera || {})[b.getAttribute("data-aut-gate")] || 0) - Date.now()) / 1000);
      if (falta > 0) { b.disabled = true; b.textContent = "Aguarde " + falta + " s"; }
      else if (b.disabled && /^Aguarde \d+ s$/.test(b.textContent)) { b.disabled = false; b.innerHTML = b.getAttribute("data-rotulo"); }
    });
  }
  function AutPred_iniciarLibera_() { AutPred_contarLibera_(); if (!AUTP.liberaTimer) AUTP.liberaTimer = setInterval(AutPred_contarLibera_, 1000); }
  function AutPred_htmlBotoesRapidos_(d, contexto) {
    var porta = d.tipo === "FECHADURA";
    if (porta) return AutPred_btnAcao_(d.id, contexto, "ABRIR", "Destravar a porta", "aut-rapido-btn is-porta", "fa-lock-open");
    if (d.pulsoAlternado) return AutPred_btnAcao_(d.id, contexto, "ALTERNAR", "Abrir / fechar portão", "aut-rapido-btn", "fa-door-open") + '<div class="cadx-sub">Mesmo botão para abrir e fechar, como no Smart Life. Aguarde o fim do percurso.</div>';
    var abrirB = AutPred_btnAcao_(d.id, contexto, "ABRIR", "Abrir portão", "aut-rapido-btn", "fa-door-open");
    if (!d.podeFechar) return abrirB + '<div class="cadx-sub">Pulso: fecha manualmente.</div>';
    return '<div class="aut-botoes-portao">' + abrirB + AutPred_btnAcao_(d.id, contexto, "FECHAR", "Fechar portão", "aut-rapido-btn is-fechar", "fa-door-closed") +
      (d.podeParar ? AutPred_btnAcao_(d.id, contexto, "PARAR", "Parar", "aut-rapido-btn is-recusar", "") : "") + "</div>";
  }
  // ---------- pedido de abertura pela campainha (fechadura da Porta da Diretoria) ----------
  // A fechadura só aceita abertura remota enquanto a campainha está chamando (até 90 s). Com a tela aberta, o SGO+ consulta
  // a cada 3 s só esse dispositivo (a leitura é compartilhada no servidor) e para quando a tela fecha.
  function AutPred_restante_(p) { return p && p.ativo ? Math.max(0, p.restanteS - Math.floor((Date.now() - AUTP.pedLidoEm) / 1000)) : 0; }
  function AutPred_btnPedido_(id, contexto, resposta) {
    var abrirBtn = resposta === "ABRIR";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "aut-rapido-btn " + (abrirBtn ? "is-porta" : "is-recusar");
    if (abrirBtn) b.id = "autBtnR_" + contexto + "_" + id;
    b.setAttribute("onclick", "AutPred_pedir_(" + JSON.stringify(String(id)).replace(/"/g, "'") + ", '" + contexto + "', this, '" + resposta + "')");
    b.innerHTML = abrirBtn ? '<i class="fas fa-lock-open" aria-hidden="true"></i>Abrir agora' : "Recusar";
    return b.outerHTML;
  }
  function AutPred_htmlPedido_(id, contexto) {
    var p = AUTP.pedidos[id];
    var n = AutPred_restante_(p);
    if (p && p.ativo && n > 0) {
      return '<div class="aut-pedido is-ativo" role="alert">Campainha tocou' + (p.campainhaTexto ? " às " + AutPred_esc_(p.campainhaTexto) : "") + " — pedido válido por " + n + " s</div>" +
        (p.autoAbrir ? '<div class="aut-pedido">Abertura automática ligada: o SGO+ está abrindo a porta. Se não abrir em alguns segundos, use "Abrir agora".</div>' : "") +
        '<div class="aut-pedido-botoes">' + AutPred_btnPedido_(id, contexto, "ABRIR") + AutPred_btnPedido_(id, contexto, "RECUSAR") + "</div>";
    }
    // 27/10/2026: sem eventos da Tuya, a campainha chega com atraso (consulta econômica) ou fica pausada (modo econômico)
    var verificar = p && p.fonte !== "eventos" ? '<button type="button" class="aut-rapido-btn is-recusar" onclick="AutPred_verificarCampainha_(this)">Verificar campainha agora</button>' : "";
    if (p && p.respondido) return '<div class="aut-pedido">Último pedido ' + AutPred_esc_(p.respondido) + ".</div>" + (p.aviso ? '<div class="aut-pedido">' + AutPred_esc_(p.aviso) + "</div>" : "") + verificar;
    if (p && p.erro) return '<div class="aut-pedido">' + AutPred_esc_(p.erro) + "</div>" + verificar;
    if (p && p.aviso) return '<div class="aut-pedido">' + AutPred_esc_(p.aviso) + "</div>" + verificar;
    return '<div class="aut-pedido">Aguardando campainha. O botão de abertura aparece quando alguém toca.</div>' + verificar;
  }
  /** "Verificar campainha agora": uma leitura pedida pela pessoa (vale até no modo econômico). */
  function AutPred_verificarCampainha_(btn) {
    if (btn) { btn.disabled = true; btn.textContent = "Verificando…"; }
    AutPred_chamar_("pedidoAgora", {}, function (r) {
      AUTP.pedLidoEm = Date.now(); AUTP.pedidos = {}; (r.itens || []).forEach(function (x) { AUTP.pedidos[x.id] = x; });
      AutPred_mostrarInfra_(r.infra);
      AutPred_redesenharPedidos_();
    }, function (m) { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = "Verificar campainha agora"; } AutPred_avisoPosicao_(m, "tom-perigo"); });
  }
  function AutPred_redesenharPedidos_() {
    document.querySelectorAll('[id^="autPedArea_"]').forEach(function (el) {
      var partes = el.id.replace("autPedArea_", "").split("_"), contexto = partes.shift(), id = partes.join("_");
      if (document.getElementById("autJanela") && el.querySelector("button[disabled]")) return;
      el.innerHTML = AutPred_htmlPedido_(id, contexto);
    });
  }
  function AutPred_pararPedidos_() { if (AUTP.pedTimer) clearTimeout(AUTP.pedTimer); if (AUTP.pedRelogio) clearInterval(AUTP.pedRelogio); AUTP.pedTimer = null; AUTP.pedRelogio = null; AUTP.pedAtivo = false; }
  function AutPred_iniciarPedidos_() {
    var tem = (AUTP.rapido || []).some(function (d) { return d.remotoFechadura === "PEDIDO"; });
    if (!tem) { AutPred_pararPedidos_(); return; }
    if (AUTP.pedAtivo) return;
    AUTP.pedAtivo = true;
    var consultando = false;
    // 27/10/2026: ritmo do servidor (proximaS: 3 s com eventos, que não gastam cota; 10 s sem eventos, em que a
    // leitura na nuvem é compartilhada e vale por consultaIntervaloS); para com a aba em segundo plano
    var agendar = function (s) { if (!AUTP.pedAtivo) return; if (AUTP.pedTimer) clearTimeout(AUTP.pedTimer); AUTP.pedTimer = setTimeout(tick, Math.max(3, Number(s) || 15) * 1000); };
    var tick = function () {
      AUTP.pedTimer = null;
      if (!document.querySelector('[id^="autPedArea_"]')) { AutPred_pararPedidos_(); return; } // a tela fechou
      if (document.visibilityState === "hidden") return; // volta em AutPred_aoVoltarVisivel_
      if (consultando) return;
      consultando = true;
      AutPred_chamar_("pedido", {}, function (r) {
        consultando = false; AUTP.pedLidoEm = Date.now();
        AUTP.pedidos = {}; (r.itens || []).forEach(function (x) { AUTP.pedidos[x.id] = x; });
        AutPred_mostrarInfra_(r.infra);
        AutPred_redesenharPedidos_();
        agendar(r.proximaS);
      }, function () { consultando = false; agendar(15); });
    };
    AUTP.pedTick = tick;
    AUTP.pedRelogio = setInterval(function () { if (Object.keys(AUTP.pedidos).some(function (k) { return AUTP.pedidos[k].ativo; })) AutPred_redesenharPedidos_(); }, 1000);
    tick();
  }

  /** Atalho no Início do computador (JS_Core chama ao montar o painel): os mesmos botões grandes, só para quem pode acionar. */
  function AutPred_atalhoInicio_() {
    if (!AUTP.acionar) return;
    var faixa = document.getElementById("inicioFaixa");
    if (!faixa || document.getElementById("autInicio")) return;
    var sec = document.createElement("section");
    sec.id = "autInicio"; sec.className = "aut-inicio aut-rapido";
    faixa.parentNode.insertBefore(sec, faixa.nextSibling);
    AutPred_chamar_("rapido", {}, function (r) { AUTP.rapido = r.itens || []; AUTP.infra = r.infra || AUTP.infra; AutPred_desenharRapido_(document.getElementById("autInicio"), AUTP.rapido, "inicio"); },
      function () { var e = document.getElementById("autInicio"); if (e) e.remove(); });
  }

  // ---------- janela de confirmação grande (sem digitar) ----------
  function AutPred_fecharJanela_() { var j = document.getElementById("autJanela"); if (j) j.remove(); document.removeEventListener("keydown", AutPred_teclaJanela_); }
  function AutPred_teclaJanela_(e) { if (e.key === "Escape") AutPred_fecharJanela_(); }
  function AutPred_janela_(o) {
    AutPred_fecharJanela_();
    var fundo = document.createElement("div");
    fundo.id = "autJanela"; fundo.className = "aut-janela-fundo";
    fundo.innerHTML = '<div class="aut-janela" role="dialog" aria-modal="true" aria-labelledby="autJanelaTit">' +
      '<div class="aut-janela-sub">' + AutPred_esc_(o.pergunta) + '</div><h3 id="autJanelaTit">' + AutPred_esc_(o.nome) + "</h3>" +
      (o.local ? '<div class="aut-janela-sub">' + AutPred_esc_(o.local) + "</div>" : "") +
      (o.real ? '<div class="aut-perigo">Comando real: o dispositivo vai receber o comando pela nuvem.</div>' : '<div class="cadx-faixa bc-faixa tom-info">' + AutPred_esc_(o.simulacao || "Simulação: nada é enviado ao dispositivo.") + "</div>") +
      '<div class="aut-janela-botoes"><button type="button" class="aut-sim' + (o.porta ? " is-porta" : "") + '" id="autJanelaSim">' + AutPred_esc_(o.rotuloSim || "Sim, abrir agora") + "</button>" + '<button type="button" class="aut-cancelar" id="autJanelaCancelar">Cancelar</button></div>' +
      '<div class="cadx-msg is-erro" id="autJanelaErro" role="alert"></div></div>';
    document.body.appendChild(fundo);
    document.addEventListener("keydown", AutPred_teclaJanela_);
    fundo.addEventListener("click", function (e) { if (e.target === fundo) AutPred_fecharJanela_(); });
    document.getElementById("autJanelaCancelar").onclick = AutPred_fecharJanela_;
    var sim = document.getElementById("autJanelaSim");

        (i.incidente ? '<div class="cadx-sub">Incidente ' + esc(i.incidente) + (i.avisado ? " · gestão avisada" : "") + "</div>" : "") + "</div>";
    }).join("") + "</div>";
    // 27/10/2026: nuvem (bloqueio com a próxima conferência, recuperação gradual), fechaduras (caminho e validação informativa) e orçamento
    var nv = r.nuvem || {};
    if (nv.bloqueio) h += AutPred_faixa_("Nuvem bloqueada desde " + nv.bloqueio.desde + ": nada é enviado. Próxima conferência automática às " + nv.bloqueio.proximaSonda + " (recuo de " + nv.bloqueio.recuoMin + " min" + (nv.bloqueio.rebloqueio ? "; voltou a bloquear depois de uma volta" : "") + "). Um pedido de pessoa a cada 10 min também confere.", "tom-perigo");
    else if (nv.recuperacaoAte) h += AutPred_faixa_("A nuvem voltou: recuperação gradual até " + nv.recuperacaoAte + " (primeiros 30 min só comandos de pessoas e eventos; depois, leituras automáticas com teto de 20 por minuto).", "tom-alerta");
    if ((r.fechaduras || []).length) {
      h += '<h3 class="aut-unidade">Abertura automática da porta</h3><div class="aut-saude-uso">' + r.fechaduras.map(function (f) {
        return '<div class="aut-saude-caixa"><b>' + esc(f.nome) + "</b><div>Abertura automática: " + (f.autoAbrir ? "ligada" + (f.autoAbrirPor ? " por " + esc(f.autoAbrirPor) : "") : "desligada") + "</div>" +
          "<div>Campainha acompanhada: " + esc(f.caminhoTexto) + "</div>" +
          (f.responsavel && !f.responsavel.ok ? '<div class="cadx-sub">Atenção: ' + esc(f.responsavel.motivo) + ". Um diretor que destrava a porta decide se desliga ou liga de novo.</div>" : "") +
          '<div class="cadx-sub">Validação por eventos (informativa, não bloqueia nada): ' + (f.validado ? "validada em " + esc(f.validadoEm) + " por " + esc(f.validadoPor) + ". " + esc(f.validadoDetalhe)
            : "ainda não. " + (f.eventoRecebido ? "Último pedido recebido por evento: " + esc(f.pedidoEventoEm || "nenhum") + ". " : "Nenhum evento desta fechadura chegou. ") +
              "Como validar: 1) confira acima que os eventos da Tuya estão chegando; 2) peça para tocarem a campainha; 3) com o pedido na tela, toque em \"Abrir agora\" e confirme; 4) quando a fechadura confirmar a abertura, a validação fica gravada aqui.") + "</div></div>";
      }).join("") + "</div>";
    }
    var o = r.orcamento || {};
    h += '<h3 class="aut-unidade">Orçamento da cota</h3><div class="aut-saude-caixa">' + (o.confirmado
      ? "<b>Confirmado" + (o.por ? " por " + esc(o.por) : "") + (o.em ? " em " + esc(o.em) : "") + ":</b> " + esc(AutPred_milhar_(o.valor)) + " chamadas " + (o.periodo === "UNICO" ? "no pacote único de " + esc(o.inicio) + " a " + esc(o.fim) : "por mês") + " (limite do pacote: " + esc(AutPred_milhar_(o.limitePacote)) + ")."
      : "<b>" + esc(o.avisoProvisorio) + ".</b> Referência provisória: pacote de " + esc(AutPred_milhar_(o.limitePacote)) + " chamadas por mês e orçamento de " + esc(AutPred_milhar_(o.valor)) + " (50%). Nada fica mais lento por isso.") +
      '<div class="cadx-sub">Teto do dia: ' + esc(AutPred_milhar_(o.tetoDia)) + " chamadas (hoje: " + esc(AutPred_milhar_(o.diaUsado)) + "). Sem eventos, a posição dos portões parados é relida a cada 20 s; acima da média do dia, a cada 60 s; acima do teto, a cada 120 s. Comandos, eventos e abertura automática não mudam.</div>" +
      (o.podeConfirmar ? '<div class="cadx-sub">' + esc(o.passos) + "</div>" + '<div class="aut-form" id="autOrcForm">' +
        '<label for="autOLim">Limite de chamadas do pacote (painel da Tuya)</label><input id="autOLim" inputmode="numeric" value="' + esc(AutPred_milhar_(o.limitePacote)) + '" oninput="AutPred_sugerirOrcamento_()">' +
        '<label for="autOPer">Período do pacote</label><select id="autOPer"><option value="MENSAL"' + (o.periodo !== "UNICO" ? " selected" : "") + '>Renova todo mês</option><option value="UNICO"' + (o.periodo === "UNICO" ? " selected" : "") + ">Pacote único (com início e fim)</option></select>" +
        '<label for="autOIni">Início (pacote único)</label><input id="autOIni" type="date"><label for="autOFim">Fim (pacote único)</label><input id="autOFim" type="date">' +
        '<label for="autOVal">Orçamento (sugestão: metade do limite)</label><input id="autOVal" inputmode="numeric" oninput="this.setAttribute(\'data-mexeu\', \'1\')" value="' + esc(AutPred_milhar_(o.confirmado ? o.valor : o.sugestao)) + '">' +
        '<label for="autOJa">Já usado no período, como mostra o painel (opcional)</label><input id="autOJa" inputmode="numeric">' +
        '<label for="autOMot">Motivo</label><input id="autOMot" maxlength="300" placeholder="Ex.: limite conferido no painel em 27/10">' +
        '<div class="aut-acoes"><button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" onclick="AutPred_confirmarOrcamento_()">Confirmar orçamento</button></div><div class="cadx-msg" id="autOMsg"></div></div>' : "") + "</div>";
    var pct = Number(u.pct) || 0, cor = pct >= u.economicoPct ? "is-vermelho" : pct >= u.avisoPct ? "is-amarelo" : "";
    var lista = function (l) { return l && l.length ? "<ul>" + l.map(function (x) { return "<li>" + esc(x.origem) + ": " + esc(AutPred_milhar_(x.total)) + "</li>"; }).join("") + "</ul>" : '<div class="cadx-sub">Nenhuma chamada.</div>'; };
    h += '<h3 class="aut-unidade">Consumo da cota da Tuya</h3><div class="aut-saude-uso">' +
      '<div class="aut-saude-caixa"><b>No mês: ' + esc(AutPred_milhar_(u.mes)) + " de " + esc(AutPred_milhar_(u.orcamento)) + " chamadas (" + esc(String(pct).replace(".", ",")) + "%)</b>" +
        '<div class="aut-saude-barra ' + cor + '" role="img" aria-label="' + esc(String(pct).replace(".", ",")) + '% do orçamento"><span style="width:' + Math.min(100, pct) + '%"></span><i class="aut-saude-marca" style="left:' + esc(u.avisoPct) + '%"></i><i class="aut-saude-marca" style="left:' + esc(u.economicoPct) + '%"></i></div>' +
        '<div class="cadx-sub">' + (u.provisorio ? "Orçamento provisório. " : "") + "Aviso em " + esc(u.avisoPct) + "%; modo econômico de emergência em " + esc(u.economicoPct) + "%" + (u.provisorio ? " do limite do pacote" : "") + ". No ritmo atual, o mês fecha em cerca de " + esc(AutPred_milhar_(u.projecaoMes)) + " chamadas.</div></div>" +
      '<div class="aut-saude-caixa"><b>Hoje: ' + esc(AutPred_milhar_(u.dia)) + " chamadas</b> (ontem: " + esc(AutPred_milhar_(u.ontem)) + ")" + lista(u.porOrigemDia) + "</div>" +
      '<div class="aut-saude-caixa"><b>No mês, por origem</b>' + lista(u.porOrigemMes) + "</div>" +
      '<div class="aut-saude-caixa"><b>Eventos da Tuya</b><div>' + esc((r.eventos || {}).texto) + '</div><div class="cadx-sub">Mensagens recebidas: ' + esc(AutPred_milhar_(u.mensagensDia)) + " hoje, " + esc(AutPred_milhar_(u.mensagensMes)) + " no mês (cota de mensagens à parte da cota de chamadas).</div></div>" +
      "</div>";
    if (u.dias && u.dias.length) h += '<div class="aut-saude-dias">Chamadas por dia: ' + u.dias.map(function (d) { return "<span>" + esc(d.dia) + ": " + esc(AutPred_milhar_(d.total)) + "</span>"; }).join("") + "</div>";
    if (u.bloqueio) h += AutPred_faixa_("Bloqueio da nuvem: " + u.bloqueio, "tom-perigo");
    if (u.ultimoErro) h += '<div class="cadx-sub" style="margin-top:6px">Último erro da Tuya: ' + esc(u.ultimoErro) + "</div>";
    var e = r.economico || {};
    h += '<h3 class="aut-unidade">Modo econômico</h3><div class="aut-saude-caixa">' + (e.ligado
      ? "<b>Ligado desde " + esc(e.desde) + "</b> (" + esc(e.motivo) + "). Continuam: comandos de pessoas, eventos da Tuya e a abertura automática por evento. Ficam mais lentos, sem eventos: a posição dos portões (use \"Ler estado\") e a campainha e a abertura automática (use \"Verificar campainha agora\" ou o aplicativo Smart Life). Volta ao normal no período novo." +
        (r.podeSairEconomico ? '<div class="aut-acoes"><button type="button" class="cadx-btn cadx-btn-grande cadx-btn-risco" onclick="AutPred_sairEconomico_()">Sair do modo econômico</button></div>' : '<div class="cadx-sub">Só um diretor pode sair do modo econômico antes da virada do mês.</div>')
      : "Desligado. É só para emergência: o SGO+ liga sozinho quando o consumo chega a " + esc(u.economicoPct) + "% do orçamento confirmado (ou do limite do pacote, enquanto o orçamento é provisório).") + "</div>";
    var c = r.cfg || {};
    if (r.podeConfigurar) {
      var dias = [["1", "Seg"], ["2", "Ter"], ["3", "Qua"], ["4", "Qui"], ["5", "Sex"], ["6", "Sáb"], ["0", "Dom"]];
      h += '<h3 class="aut-unidade">Consulta sem eventos (diretores)</h3><div class="aut-form" id="autSaudeCfg">' +
        '<label for="autSIni">Consulta da fechadura sem eventos (abertura automática, aviso e telas): início</label><input id="autSIni" type="time" value="' + esc(c.consultaInicio) + '">' +
        '<label for="autSFim">Fim (24 horas: 00:00 às 23:59)</label><input id="autSFim" type="time" value="' + esc(c.consultaFim) + '">' +
        '<label for="autSInt">Intervalo da consulta da fechadura (segundos, 30 a 85; menor que os ~90 s do pedido)</label><input id="autSInt" type="number" min="30" max="85" step="5" value="' + esc(c.consultaIntervaloS) + '">' +
        '<label>Dias da consulta</label><div class="aut-acoes">' + dias.map(function (d) { return '<label class="aut-check"><input type="checkbox" data-aut-sdia="' + d[0] + '"' + ((c.consultaDias || []).indexOf(Number(d[0])) >= 0 ? " checked" : "") + "> " + d[1] + "</label>"; }).join("") + "</div>" +
        '<label for="autSPar">Posição do portão parado sem eventos, com tela aberta (segundos, 10 a 600)</label><input id="autSPar" type="number" min="10" max="600" step="5" value="' + esc(c.portaoParadoS) + '">' +
        '<div class="cadx-sub">Cada leitura da fechadura gasta 1 chamada: a cada 60 s, 10 horas em 22 dias úteis são cerca de 13.200 por mês; 24 horas todos os dias, cerca de 43.200 (acima do orçamento provisório de 26.950). Com o serviço de mensagens da Tuya ligado, a campainha e os portões chegam por evento e não gastam chamada.</div>' +
        '<label for="autSMot">Motivo da mudança</label><input id="autSMot" maxlength="300" placeholder="Ex.: plano pago assinado em 27/10">' +
        '<div class="aut-acoes"><button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" onclick="AutPred_salvarSaudeCfg_()">Gravar</button></div><div class="cadx-msg" id="autSMsg"></div></div>';
    }
    var inc = r.incidentes || [];
    h += '<h3 class="aut-unidade">Histórico de incidentes</h3>' + (inc.length ? '<table class="aut-tabela"><thead><tr><th>Quando</th><th>Item</th><th>O que aconteceu</th><th>Detalhe</th></tr></thead><tbody>' + inc.map(function (x) {
      return "<tr><td>" + esc(x.quando) + "</td><td>" + esc(x.item) + "</td><td>" + esc(x.evento) + (x.por && x.por !== "Sentinela" ? '<div class="cadx-sub">' + esc(x.por) + "</div>" : "") + "</td><td>" + esc(x.texto) +
        (x.oQueFazer ? '<div class="cadx-sub">O que fazer: ' + esc(x.oQueFazer) + "</div>" : "") + "</td></tr>";
    }).join("") + "</tbody></table>" : '<div class="cadx-sub">Nenhum incidente registrado.</div>');
    el.innerHTML = h;
  }
  function AutPred_sairEconomico_() {
    CadUI_confirmar_({ titulo: "Sair do modo econômico", risco: true, botao: "Sair do modo econômico",
      texto: "<p>As leituras automáticas (posição dos portões e campainha) voltam agora e podem esgotar a cota da Tuya antes da virada do mês. Neste mês o SGO+ não religa o modo sozinho; o aviso de consumo continua.</p>",
      motivo: { rotulo: "Motivo", min: 5 },
      aoConfirmar: function (valores, fechar, reabilitar) {
        var motivo = valores && valores.motivo !== undefined ? valores.motivo : String((document.getElementById("cadxDlgMotivo") || {}).value || "");
        AutPred_chamar_("saudeSairEconomico", { motivo: motivo }, function (r) { fechar(); AUTP.saude = r; var el = document.getElementById("autAba"); if (el) AutPred_htmlSaude_(el, r, r.mensagem); }, reabilitar);
      } });
  }
  /** 27/10/2026: sugestão do orçamento = metade do limite do pacote (só enquanto a pessoa não mexeu no orçamento). */
  function AutPred_sugerirOrcamento_() {
    var l = document.getElementById("autOLim"), v = document.getElementById("autOVal");
    if (!l || !v || v.getAttribute("data-mexeu") === "1") return;
    var n = Number(String(l.value || "").replace(/\./g, "").replace(",", "."));
    if (n > 0) v.value = AutPred_milhar_(Math.floor(n / 2));
  }
  function AutPred_confirmarOrcamento_() {
    var g = function (id) { var e = document.getElementById(id); return e ? String(e.value || "").trim() : ""; };
    var m = document.getElementById("autOMsg");
    var dados = { limitePacote: g("autOLim"), periodo: g("autOPer"), inicio: g("autOIni"), fim: g("autOFim"), orcamento: g("autOVal"), jaUsado: g("autOJa"), motivo: g("autOMot") };
    if (!dados.motivo || dados.motivo.length < 5) { if (m) { m.textContent = "Escreva o motivo (mínimo de 5 caracteres)."; m.className = "cadx-msg is-erro"; } return; }
    if (m) { m.textContent = "Gravando…"; m.className = "cadx-msg"; }
    AutPred_chamar_("saudeOrcamento", dados, function (r) { AUTP.saude = r; var el = document.getElementById("autAba"); if (el) AutPred_htmlSaude_(el, r, r.mensagem); }, function (msg) { if (m) { m.textContent = msg; m.className = "cadx-msg is-erro"; } });
  }
  function AutPred_salvarSaudeCfg_() {
    var g = function (id) { var e = document.getElementById(id); return e ? String(e.value || "").trim() : ""; };
    var m = document.getElementById("autSMsg");
    var dias = []; document.querySelectorAll("[data-aut-sdia]").forEach(function (c) { if (c.checked) dias.push(Number(c.getAttribute("data-aut-sdia"))); });
    var dados = { consultaInicio: g("autSIni"), consultaFim: g("autSFim"), consultaIntervaloS: g("autSInt"), portaoParadoS: g("autSPar"), consultaDias: dias, motivo: g("autSMot") };
    if (!dados.motivo || dados.motivo.length < 5) { if (m) { m.textContent = "Escreva o motivo (mínimo de 5 caracteres)."; m.className = "cadx-msg is-erro"; } return; }
    if (m) { m.textContent = "Gravando…"; m.className = "cadx-msg"; }
    AutPred_chamar_("saudeCfg", dados, function (r) { AUTP.saude = r; var el = document.getElementById("autAba"); if (el) AutPred_htmlSaude_(el, r, r.mensagem); }, function (msg) { if (m) { m.textContent = msg; m.className = "cadx-msg is-erro"; } });
  }

// ANM 24 Net: comunicação no servidor próprio. A senha nunca é devolvida pela API.
  var ALARME_UI = { ocupado: false, painel: null, liberaAte: 0, timer: null };
  function Alarme_contar_() {
    var el=document.getElementById('intelbrasPainel');
    if(!el){if(ALARME_UI.timer)clearInterval(ALARME_UI.timer);ALARME_UI.timer=null;return;}
    var s=Math.max(0,Math.ceil((ALARME_UI.liberaAte-Date.now())/1000));
    el.querySelectorAll('[data-alarme-comando]').forEach(function(b){
      b.disabled=ALARME_UI.ocupado||s>0;
      b.textContent=b.getAttribute('data-rotulo')+(s>0?' · Aguarde '+s+' s':ALARME_UI.ocupado?' · Aguarde…':'');
    });
    if(!s&&ALARME_UI.timer){clearInterval(ALARME_UI.timer);ALARME_UI.timer=null;}
  }
  function Alarme_iniciarContagem_() {
    Alarme_contar_();
    if(ALARME_UI.liberaAte>Date.now()&&!ALARME_UI.timer)ALARME_UI.timer=setInterval(Alarme_contar_,250);
  }
  function Alarme_chamar_(acao, dados, ok) {
    if (ALARME_UI.ocupado) return;
    ALARME_UI.ocupado = true;
    var el = document.getElementById('intelbrasPainel');
    if (el) el.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    function fim() { ALARME_UI.ocupado=false; if(el)el.querySelectorAll('button').forEach(function(b){b.disabled=false;}); Alarme_iniciarContagem_(); }
    function erro(m) {
      fim();
      var msg=document.getElementById('intelbrasMsg'), estado=document.getElementById('intelbrasEstado');
      if(estado)estado.textContent='Sem leitura atual';
      if(msg)msg.textContent=m;
    }
    google.script.run.withSuccessHandler(function(r){
      fim(); if(!r || !r.ok){erro((r&&r.message)||'Não foi possível concluir.');return;} ok(r);
    }).withFailureHandler(function(){erro('Sem resposta do SGO+. Se enviou um comando, consulte o estado antes de tentar novamente.');})
      .Alarme_api(SGO_getSessionId(),acao,dados||{});
  }
  function Alarme_carregar_() {
    var e=document.getElementById('intelbrasPainel'); if(!e)return;
    e.innerHTML='<h3>Alarme Intelbras</h3><p id="intelbrasEstado">Consultando configuração…</p><p id="intelbrasMsg" role="status"></p>';
    Alarme_chamar_('painel',{},Alarme_desenhar_);
  }
  function Alarme_desenhar_(r) {
    var el=document.getElementById('intelbrasPainel');if(!el)return;
    ALARME_UI.painel=r;
    if(typeof r.liberaEmS==='number')ALARME_UI.liberaAte=Date.now()+Math.max(0,r.liberaEmS)*1000;
    var esc=AutPred_esc_, estado=r.estado||(r.resultado&&r.resultado.estado);
    var texto=estado ? (estado.disparado?'Disparado':estado.armado?'Armado':'Desarmado') : r.configurado?'Estado ainda não consultado':'Aguardando configuração';
    var h='<h3>'+esc(r.nome||'Alarme Intelbras')+'</h3><p>Intelbras ANM 24 Net · '+(r.ligado?'Comandos habilitados':'Comandos desligados')+'</p>'+
      '<strong id="intelbrasEstado">'+esc(texto)+'</strong>'+
      (estado?'<p>Última leitura: '+esc(new Date(estado.lidoEm).toLocaleString('pt-BR'))+'</p>':'')+
      '<p id="intelbrasMsg" role="status">'+esc((r.resultado&&r.resultado.detalhe)||r.mensagem||'')+'</p><div class="aut-acoes">';
    if(r.configurado&&(r.ligado||r.podeConfigurar))h+='<button type="button" class="cadx-btn cadx-btn-grande" onclick="Alarme_estado_()">Consultar estado</button>';
    if(r.ligado)h+='<button type="button" class="aut-rapido-btn" data-alarme-comando="ARMAR" data-rotulo="Ativar alarme" onclick="Alarme_preparar_(\'ARMAR\')">Ativar alarme</button><button type="button" class="aut-rapido-btn" data-alarme-comando="DESARMAR" data-rotulo="Desativar alarme" onclick="Alarme_preparar_(\'DESARMAR\')">Desativar alarme</button>';
    h+='</div>';
    if(r.ligado)h+='<p class="cadx-sub">Intervalo mínimo de '+esc(r.intervaloS||10)+' segundos entre ativar e desativar. A contagem aparece nos botões após o comando.</p>';
    if(r.historico&&r.historico.length){h+='<details><summary>Histórico do alarme</summary><ul>'+r.historico.map(function(x){return '<li>'+esc(new Date(x.quando).toLocaleString('pt-BR'))+' · '+esc(x.usuario_nome)+' · '+esc(x.acao)+' · '+esc(x.situacao)+' — '+esc(x.detalhe)+'</li>';}).join('')+'</ul></details>';}
    el.innerHTML=h;
    Alarme_iniciarContagem_();
  }
  function Alarme_estado_(){Alarme_chamar_('estado',{},Alarme_desenhar_);}
  function Alarme_preparar_(comando){
    if(ALARME_UI.ocupado||ALARME_UI.liberaAte>Date.now())return;
    var operacao=AutPred_uuid_();
    Alarme_chamar_('preparar',{comando:comando,operacao:operacao},function(r){
      if(!window.confirm((comando==='ARMAR'?'Armar':'Desarmar')+' o alarme '+r.nome+' agora?'))return;
      ALARME_UI.liberaAte=Date.now()+10000;Alarme_iniciarContagem_();
      Alarme_chamar_('comandar',{comando:comando,operacao:operacao,token:r.token},Alarme_desenhar_);
    });
  }

</script>

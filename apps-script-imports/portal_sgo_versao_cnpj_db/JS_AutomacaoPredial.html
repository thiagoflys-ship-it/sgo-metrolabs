<style>
  /* SEGURANÇA E AUTOMAÇÃO PREDIAL (22/10/2026) — ver SGO_Automacao_Predial.js. */
  .aut-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .aut-cartao { background: var(--card, #fff); border: 1px solid var(--border, #d9e0e7); border-radius: var(--radius, 10px); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .aut-cartao h4 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .aut-cartao.is-restrito { border-color: var(--bc-danger-line, #e5b4ae); }
  .aut-linha { display: flex; gap: 8px; justify-content: space-between; font-size: 12.5px; border-bottom: 1px dashed var(--border, #eef1f4); padding: 3px 0; }
  .aut-linha span:first-child { color: var(--muted, #52606d); flex: 0 0 38%; }
  .aut-linha span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .aut-acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .aut-acoes .cadx-btn { min-height: 36px; }
  .aut-unidade { margin: 18px 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .aut-form { background: var(--bc-surface-2, #f4f6f8); border-radius: 8px; padding: 10px; margin-top: 8px; display: grid; gap: 6px; }
  .aut-form label { font-size: 12px; font-weight: 700; }
  .aut-form input, .aut-form select, .aut-form textarea { width: 100%; box-sizing: border-box; min-height: 36px; padding: 6px 8px; border: 1px solid var(--border, #d9e0e7); border-radius: 6px; font-size: 14px; background: var(--card, #fff); }
  .aut-form .aut-check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .aut-form .aut-check input { width: auto; min-height: 0; }
  .aut-abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .aut-abas button.is-ativa { background: var(--bc-text, #1f2933) !important; color: #fff !important; border-color: var(--bc-text, #1f2933) !important; }
  .aut-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .aut-tabela th, .aut-tabela td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border, #eef1f4); vertical-align: top; }
  .aut-tabela th { font-size: 11.5px; color: var(--muted, #52606d); text-transform: uppercase; letter-spacing: .02em; }
  .aut-mono { font-family: var(--bc-mono, monospace); font-size: 11.5px; }
  .aut-perigo { border: 1px solid var(--bc-danger-line, #d64545); background: var(--bc-danger-bg, #fff5f5); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin: 6px 0; }
  /* Botões rápidos (22/10/2026, dono): grandes, com o estado ao lado; no celular, 56 px ou mais e sem rolar. */
  .aut-rapido { margin: 0 0 14px; }
  .aut-rapido h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .aut-rapido-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .aut-rapido-item { background: var(--card, #fff); border: 1px solid var(--border, #d9e0e7); border-radius: var(--radius, 10px); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .aut-rapido-item.is-restrito { border-color: var(--bc-danger-line, #e5b4ae); }
  .aut-rapido-nome { font-size: 16px; font-weight: 700; line-height: 1.25; }
  .aut-rapido-estado { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .aut-rapido-btn { min-height: 56px; width: 100%; font-size: 17px; font-weight: 700; border-radius: 10px; border: 1px solid var(--bc-action, #1f6b2a); background: var(--bc-action, #1f6b2a); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .aut-rapido-btn:hover { background: var(--bc-action-hover, #185521); }
  .aut-rapido-btn.is-porta { background: var(--bc-danger, #a32a1f); border-color: var(--bc-danger, #a32a1f); }
  .aut-rapido-btn:disabled { opacity: .6; cursor: wait; }
  .aut-inicio { margin: 10px 0 14px; }
  .aut-reg-dia { margin: 14px 0 6px; font-size: 14px; }
  .aut-reg-tr { cursor: pointer; }
  .aut-reg-tr:hover td { background: var(--bc-surface-2, #f4f6f8); }
  .aut-tec td, .aut-tec { background: var(--bc-surface-2, #f4f6f8); }
  .aut-tec-lista { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0 0; }
  .aut-tec-lista dt { font-size: 11.5px; color: var(--muted, #52606d); }
  .aut-tec-lista dd { margin: 0; overflow-wrap: anywhere; }
  .aut-reg-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 4px 0 8px; }
  .aut-reg-filtros label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted, #52606d); gap: 3px; }
  .aut-reg-filtros select, .aut-reg-filtros input { min-height: 36px; padding: 4px 8px; border: 1px solid var(--border, #d9e0e7); border-radius: 6px; font-size: 14px; }
  .aut-reg-cartao { border: 1px solid var(--border, #d9e0e7); border-radius: 8px; padding: 8px 10px; margin: 0 0 6px; background: var(--card, #fff); }
  .aut-reg-linha1 { font-size: 13px; margin-bottom: 4px; }
  .aut-pedido { font-size: 13.5px; line-height: 1.4; color: var(--muted, #52606d); }
  .aut-pedido.is-ativo { color: var(--bc-danger, #a32a1f); font-weight: 700; font-size: 15px; }
  .aut-pedido-botoes { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .aut-botoes-portao { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .aut-rapido-btn.is-fechar { background: #1f3a5f; border-color: #1f3a5f; }
  /* 23/10/2026: posição do portão (Aberto/Fechado/Abrindo/Fechando) grande, relida a cada 5 s com a tela aberta */
  .aut-posicao { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border, #d9e0e7); background: var(--bc-surface-2, #f4f6f8); }
  .aut-posicao.is-aberto { background: #fff4e5; border-color: #e3a24a; color: #8a4b00; }
  .aut-posicao.is-fechado { background: #eaf6ec; border-color: #7cbf86; color: #1f6b2a; }
  .aut-posicao.is-movendo { background: #e8f0fb; border-color: #8fb0dd; color: #1f3a5f; }
  .aut-auto { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; padding: 8px 10px; border: 1px solid var(--border, #d9e0e7); border-radius: 8px; cursor: pointer; }
  .aut-auto input { width: 22px; height: 22px; min-height: 0 !important; margin: 0; flex: 0 0 auto; }
  .aut-auto.is-ligada { border-color: var(--bc-danger-line, #e5b4ae); background: var(--bc-danger-bg, #fff5f5); }
  .aut-auto-sub { font-size: 12.5px; font-weight: 400; color: var(--muted, #52606d); margin-top: 2px; }
  .aut-rapido-btn.is-recusar { background: #fff; color: var(--text, #1f2933); border-color: var(--border, #c7d0d9); }
  .aut-janela-fundo { position: fixed; inset: 0; background: rgba(15, 23, 32, .55); z-index: 10050; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .aut-janela { background: #fff; border-radius: 14px; max-width: 460px; width: 100%; padding: 20px; box-shadow: 0 18px 48px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 12px; }
  .aut-janela h3 { margin: 0; font-size: 21px; line-height: 1.25; }
  .aut-janela .aut-janela-sub { font-size: 14px; color: var(--muted, #52606d); }
  .aut-janela .aut-janela-botoes { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .aut-janela .aut-janela-botoes button { min-height: 56px; font-size: 17px; font-weight: 700; border-radius: 10px; cursor: pointer; }
  .aut-janela .aut-sim { background: var(--bc-action, #1f6b2a); border: 1px solid var(--bc-action, #1f6b2a); color: #fff; }
  .aut-janela .aut-sim.is-porta { background: var(--bc-danger, #a32a1f); border-color: var(--bc-danger, #a32a1f); }
  .aut-janela .aut-cancelar { background: #fff; border: 1px solid var(--border, #c7d0d9); color: var(--text, #1f2933); }
  .aut-janela .aut-sim:disabled { opacity: .6; cursor: wait; }
  /* a regra de toque do SGO+ (UI_Estilos: button { min-height: 44px !important }) não pode encolher os botões grandes */
  /* (o seletor de UI_Estilos tem especificidade maior: a altura fixa resolve, porque min-height 44 não reduz 56) */
  #app #conteudo .aut-rapido-btn, #autJanela .aut-janela-botoes button { min-height: 56px !important; height: 56px; white-space: nowrap; }
  @media (max-width: 760px) { .aut-rapido-grade { grid-template-columns: 1fr; } #autTela .module-header .content-subtitle { display: none; } }
  @media (max-width: 760px) { .aut-cartoes { grid-template-columns: 1fr; } .aut-linha span:first-child { flex-basis: 45%; } .aut-tabela thead { display: none; } .aut-tabela tr { display: block; border-bottom: 1px solid var(--border); padding: 6px 0; } .aut-tabela td { display: block; border: none; padding: 2px 4px; } }
</style>

<script>
  // ==========================================================
  // SEGURANÇA E AUTOMAÇÃO PREDIAL (22/10/2026)
  // Servidor: SGO_Automacao_Predial.js (AutPred_api(sessionId, acao, dados)); nuvem: SGO_Automacao_Tuya.js.
  // Ganchos na casca (JS_Core): AutPred_iniciar_ no login (menu para quem o servidor liberar), AutPred_parar_ no
  // logout, abrir('automacao_predial') -> AutPred_render_. A tela não se redesenha sozinha: só depois de uma ação
  // ou no botão "Atualizar" (formulário aberto nunca é apagado). Só os selos de posição dos portões e o pedido da
  // campainha são trocados no lugar, enquanto a tela está aberta. Toda regra é conferida de novo no servidor.
  // ==========================================================
  var AUTP = { pedidos: {}, pedTimer: null, pedRelogio: null, pedLidoEm: 0, portTimer: null, posicoes: {}, menu: false, acionar: false, adm: false, diretoria: false, dados: null, rapido: [], aba: "dispositivos", aberto: "", perms: null, aud: null, unidades: null, mensagem: "" };

  function AutPred_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function AutPred_temMenu_() { return !!AUTP.menu; }
  /** Atalhos "Portões" (celular e Início): só para quem pode acionar algum dispositivo agora (o servidor decide). */
  function AutPred_temAcionar_() { return !!AUTP.acionar; }
  function AutPred_uuid_() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "op-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
  }

  function AutPred_chamar_(acao, dados, ok, falha) {
    google.script.run
      .withSuccessHandler(function (r) { if (r && r.ok) { try { ok(r); } catch (e) { console.error("Automação " + acao + ":", e); falha("A resposta chegou, mas a tela não conseguiu mostrar. Atualize a página (F5)."); } } else falha((r && r.message) || "Não foi possível concluir. Tente de novo."); })
      .withFailureHandler(function (e) { falha((e && e.message) || "Sem comunicação com o SGO+. Confira a internet e tente de novo; nada foi alterado."); })
      .AutPred_api(SGO_getSessionId(), acao, dados || {});
  }

  // ---------- ciclo de vida ----------
  function AutPred_mostrarMenu_() {
    var g = document.getElementById("menu-secao-automacao"), b = document.getElementById("menu-btn-automacao_predial");
    if (g) g.style.display = AUTP.menu ? "" : "none";
    if (b) b.style.display = AUTP.menu ? "" : "none";
  }
  function AutPred_iniciar_() {
    AUTP.menu = false; AUTP.dados = null;
    AutPred_mostrarMenu_();
    if (!SESSION) return;
    AutPred_chamar_("iniciar", {}, function (r) {
      AUTP.menu = !!r.mostrarMenu; AUTP.acionar = !!r.podeAcionar; AUTP.adm = !!r.podeAdministrar; AUTP.diretoria = !!r.ehDiretoria; AutPred_mostrarMenu_();
      // a resposta chega depois de a tela inicial montar: acrescenta o atalho "Portões" a ela (celular) ou os botões (computador)
      if (!AUTP.acionar) return;
      try {
        if (window.SGO_MODULO_ATUAL === "mobile_home" || (window.SGO_MODULO_ATUAL === "dashboard" && typeof ehMobileModo_ === "function" && ehMobileModo_())) { if (typeof renderMobileHome_ === "function" && !document.querySelector('.mobile-home-tile[onclick*="automacao_predial"]')) renderMobileHome_(); }
        else if (window.SGO_MODULO_ATUAL === "dashboard" || !window.SGO_MODULO_ATUAL) AutPred_atalhoInicio_();
      } catch (e) { console.error("Automação predial, atalho:", e); }
    }, function () { AUTP.menu = false; AutPred_mostrarMenu_(); });
  }
  function AutPred_parar_() { AutPred_pararPedidos_(); AutPred_pararPortoes_(); AUTP.menu = false; AUTP.acionar = false; AUTP.rapido = []; AUTP.dados = null; AUTP.perms = null; AUTP.aud = null; AutPred_mostrarMenu_(); }

  // ---------- tela ----------
  function AutPred_render_() {
    var div = document.getElementById("conteudo");
    if (!div) return;
    if (typeof CadUI_movel_ === "function" && CadUI_movel_()) { try { MOBILE_NAV = { modulo: "mobile_home", tela: "lista" }; atualizarTituloMobile_("Portões"); window.scrollTo(0, 0); } catch (e) {} }
    AUTP.aberto = ""; AUTP.mensagem = "";
    div.innerHTML =
      '<div class="module-shell cadx" id="autTela">' +
        '<div id="autRapido" class="aut-rapido"></div>' +
        '<div class="module-header"><div class="module-header-left"><h2 class="content-title">Segurança e automação predial</h2>' +
          '<p class="content-subtitle">Portões e porta da Diretoria pela nuvem do Smart Life. Cada comando passa por: solicitado, aceito pela nuvem e execução confirmada pelo dispositivo.</p></div>' +
          '<div class="module-header-right"><button type="button" class="cadx-btn cadx-btn-grande" id="autAtualizar" onclick="AutPred_carregar_()">Atualizar</button></div></div>' +
        CadUI_ajuda_(
          "<ul><li><b>Portões</b>: toda a equipe vê, abre e fecha. Toque em \"Abrir portão\" ou \"Fechar portão\", confira o nome na janela e toque em \"Sim\". Nada para digitar.</li>" +
          "<li>O selo grande mostra a posição do portão (<b>Aberto</b>, <b>Fechado</b>, <b>Abrindo…</b>, <b>Fechando…</b>), relida a cada 5 segundos enquanto a tela está aberta. Quando a posição muda, aparece um aviso no topo.</li>" +
          "<li><b>Aceito</b> quer dizer que a nuvem recebeu; <b>Execução confirmada</b> quer dizer que o dispositivo informou a mudança. Até a confirmação, não considere a porta aberta.</li>" +
          "<li>A <b>porta da Diretoria</b> só aparece para os diretores. O responsável pelo sistema destrava por padrão; outro diretor só com a permissão \"Acionar\" concedida por ele. Ela abre quando tocam a campainha: toque em \"Abrir agora\" ou marque <b>\"Abrir automaticamente quando tocarem a campainha\"</b> (desmarcado, volta ao \"Abrir agora\").</li>" +
          "<li><b>Simulação</b>: enquanto a automação está desligada em Chaves e senhas ou o dispositivo não foi homologado pela Diretoria, o SGO+ registra o que teria feito e nada é enviado.</li>" +
          "<li>Limites: 1 comando por dispositivo a cada 10 s, 5 por pessoa por minuto e nunca o mesmo comando enquanto o anterior está sem resultado. Tudo fica no registro inviolável; cada colaborador vê no registro os próprios comandos.</li>" +
          "<li>Os cartões e o registro não se atualizam sozinhos: use \"Atualizar\".</li></ul>") +
        '<div id="autMsg" aria-live="polite"></div>' +
        '<div id="autCorpo">' + CadUI_esqueleto_(6) + "</div>" +
      "</div>";
    AutPred_carregar_();
  }

  function AutPred_msg_(html) { var m = document.getElementById("autMsg"); if (m) m.innerHTML = html || ""; }
  function AutPred_faixa_(texto, tom) { return '<div class="cadx-faixa bc-faixa ' + (tom || "tom-info") + '" role="status">' + AutPred_esc_(texto) + "</div>"; }

  function AutPred_carregar_(mensagem, tom) {
    var btn = document.getElementById("autAtualizar");
    if (btn) btn.disabled = true;
    AutPred_chamar_("painel", {}, function (r) {
      if (btn) btn.disabled = false;
      AUTP.dados = r; AUTP.adm = !!r.podeAdministrar; AUTP.diretoria = !!r.ehDiretoria; AUTP.rapido = r.rapido || [];
      AUTP.acionar = AUTP.rapido.length > 0;
      AutPred_desenhar_();
      AutPred_desenharRapido_(document.getElementById("autRapido"), AUTP.rapido, "modulo");
      if (!mensagem && typeof CadUI_movel_ === "function" && CadUI_movel_()) try { window.scrollTo(0, 0); } catch (e) {}
      if (mensagem) AutPred_msg_(AutPred_faixa_(mensagem, tom || "tom-ok"));
    }, function (m) {
      if (btn) btn.disabled = false;
      var c = document.getElementById("autCorpo");
      if (c) c.innerHTML = '<div class="cadx-vazio bc-vazio" role="alert"><strong>A tela não carregou.</strong>' + AutPred_esc_(m) + '<div style="margin-top:10px"><button type="button" class="cadx-btn cadx-btn-grande" onclick="AutPred_carregar_()">Tentar de novo</button><button type="button" class="cadx-btn cadx-btn-grande" onclick="irTelaInicial_()">Voltar ao Início</button></div></div>';
    });
  }

  function AutPred_desenhar_() {
    var c = document.getElementById("autCorpo"), d = AUTP.dados;
    if (!c || !d) return;
    var h = "";
    var cfg = d.config || {};
    if (!cfg.podeLer) h += '<div class="cadx-faixa bc-faixa tom-alerta"><strong>Nenhum comando real sai agora</strong> (tudo trabalha em simulação): ' + AutPred_esc_((cfg.faltas || []).join("; ")) + ". O responsável pelo sistema liga em Chaves e senhas > Automação predial (Tuya).</div>";
    else h += '<div class="cadx-faixa bc-faixa tom-info">Automação ligada (região ' + AutPred_esc_(cfg.regiao) + "). Comandos reais só nos dispositivos homologados pela Diretoria; os demais ficam em simulação.</div>";
    if (AUTP.adm) {
      h += '<div class="aut-abas">' + [["dispositivos", "Dispositivos"], ["permissoes", "Permissões"], ["auditoria", "Auditoria"]].map(function (a) {
        return '<button type="button" class="cadx-btn cadx-btn-grande' + (AUTP.aba === a[0] ? " is-ativa" : "") + '" onclick="AutPred_aba_(\'' + a[0] + '\')">' + a[1] + "</button>";
      }).join("") + "</div>";
    }
    h += '<div id="autAba"></div>';
    c.innerHTML = h;
    AutPred_desenharAba_();
  }

  function AutPred_aba_(aba) { AUTP.aba = aba; AUTP.aberto = ""; AutPred_desenhar_(); }

  function AutPred_desenharAba_() {
    var el = document.getElementById("autAba");
    if (!el) return;
    if (AUTP.aba === "permissoes" && AUTP.adm) { AutPred_desenharPermissoes_(el); return; }
    if (AUTP.aba === "auditoria" && AUTP.adm) { AutPred_desenharAuditoria_(el); return; }
    AutPred_desenharDispositivos_(el);
  }

  // ---------- dispositivos ----------
  function AutPred_chipSituacao_(d) {
    if (!d.ativo) return '<span class="cadx-selo bc-selo">Desativado</span>';
    return (d.online ? '<span class="cadx-selo bc-selo tom-ok">Online</span>' : '<span class="cadx-selo bc-selo tom-perigo">Offline</span>') +
      (d.restrito ? '<span class="cadx-selo bc-selo tom-perigo">Restrito à Diretoria</span>' : "") +
      (d.modo === "REAL" ? '<span class="cadx-selo bc-selo tom-alerta">Comando real</span>' : '<span class="cadx-selo bc-selo tom-info">Simulação</span>');
  }
  function AutPred_linha_(a, b) { return b ? '<div class="aut-linha"><span>' + AutPred_esc_(a) + "</span><span>" + AutPred_esc_(b) + "</span></div>" : ""; }

  function AutPred_desenharDispositivos_(el) {
    var d = AUTP.dados, h = "";
    if (AUTP.adm) {
      h += '<div class="aut-acoes" style="margin:0 0 10px"><button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" id="autSinc" onclick="AutPred_sincronizar_()">Sincronizar com o Smart Life</button>' +
        '<span class="cadx-sub">Lê os dispositivos da conta do Smart Life ligada ao projeto (só leitura; nenhum comando). Fechaduras entram restritas à Diretoria.</span></div>';
      if (d.restritosOcultos) h += '<div class="cadx-faixa bc-faixa tom-info">' + d.restritosOcultos + ' dispositivo(s) restrito(s) à Diretoria não aparecem para o Administrador (nem nome, nem estado). A Diretoria administra e libera.</div>';
    }
    if (!d.unidades.length) {
      h += '<div class="cadx-vazio bc-vazio"><strong>Nenhum dispositivo liberado para você.</strong>' +
        (AUTP.adm ? "Clique em \"Sincronizar com o Smart Life\" para ler os portões e a fechadura da conta ligada ao projeto. Se a lista vier vazia, confira Chaves e senhas > Automação predial (Tuya) e o vínculo da conta do aplicativo no portal da Tuya." :
          "Ainda não há portão ativo no SGO+. Se você precisa abrir um portão por aqui, avise o Administrador ou a Diretoria.") + "</div>";
      el.innerHTML = h; return;
    }
    d.unidades.forEach(function (u) {
      h += '<h3 class="aut-unidade"><i class="fas fa-location-dot" aria-hidden="true"></i> ' + AutPred_esc_(u.nome) + ' <span class="cadx-sub">' + u.dispositivos.length + " dispositivo(s)</span></h3><div class=\"aut-cartoes\">" + u.dispositivos.map(AutPred_cartao_).join("") + "</div>";
    });
    h += '<h3 class="aut-unidade">Registro de rastreabilidade</h3><div id="autRegistro"><div class="cadx-sub">Carregando…</div></div>';
    el.innerHTML = h;
    AutPred_carregarRegistro_(!!AUTP.registroFiltro);
  }

  function AutPred_cartao_(d) {
    var verbo = d.tipo === "FECHADURA" ? "Destravar a porta" : "Abrir portão";
    var aviso0 = "";

  function AutPred_pararPortoes_() { if (AUTP.portTimer) clearInterval(AUTP.portTimer); AUTP.portTimer = null; }

    if (!document.querySelector("[data-aut-posicao]")) { AutPred_pararPortoes_(); return; }
    if (AUTP.portTimer) return;
    var consultando = false;
    AUTP.portTimer = setInterval(function () {
      if (!document.querySelector("[data-aut-posicao]")) { AutPred_pararPortoes_(); return; } // a tela fechou
      if (document.hidden || consultando) return;
      consultando = true;

          AUTP.posicoes[x.id] = agora;

        '<label for="autPP">Permissão</label><select id="autPP"><option value="VER">Ver estado e histórico</option><option value="ACIONAR">Acionar (abrir) e ver</option></select>' +
        '<label for="autPF">Vigência até (opcional)</label><input type="date" id="autPF">' +
        '<label for="autPM">Motivo</label><input id="autPM" maxlength="300" placeholder="Ex.: diretor de operações">' +
        '<div class="aut-acoes"><button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" onclick="AutPred_conceder_()">Conceder</button></div><div class="cadx-msg" id="autPMsg"></div>' +
        '<div class="cadx-faixa bc-faixa tom-info" style="margin-top:6px"><b>Porta da Diretoria:</b> só os diretores a veem. O responsável pelo sistema destrava por padrão (não precisa de permissão). Outro diretor só destrava se o responsável pelo sistema conceder aqui a permissão "Acionar", com vigência se quiser; a concessão e a revogação ficam na auditoria.</div>' +
        '<div class="cadx-sub">Uma permissão nova substitui a anterior do mesmo usuário.</div></div>';
      h += '<h3 class="aut-unidade">Permissões concedidas</h3>' + (r.permissoes.length ? '<table class="aut-tabela"><thead><tr><th>Usuário</th><th>Dispositivo</th><th>Permissão</th><th>Vigência</th><th>Concedida</th><th>Situação</th><th></th></tr></thead><tbody>' + r.permissoes.map(function (p) {
        var sit = p.status === "ATIVA" ? (p.vencida ? '<span class="cadx-selo bc-selo tom-alerta">Vencida</span>' : '<span class="cadx-selo bc-selo tom-ok">Ativa</span>') : '<span class="cadx-selo bc-selo">Revogada' + (p.revogadaEm ? " em " + AutPred_esc_(p.revogadaEm) : "") + "</span>";
        return "<tr><td>" + AutPred_esc_(p.usuario) + '<div class="cadx-sub">' + AutPred_esc_(p.login + " · " + p.perfil) + "</div></td><td>" + AutPred_esc_(p.dispositivo) + "</td><td>" + AutPred_esc_(p.permissaoTexto) + "</td><td>" + AutPred_esc_(p.vigenciaFim || "sem data de fim") + "</td><td>" + AutPred_esc_(p.concedidaPor + " em " + p.concedidaEm) + '<div class="cadx-sub">' + AutPred_esc_(p.motivo) + "</div></td><td>" + sit + "</td><td>" +
          (p.status === "ATIVA" ? '<button type="button" class="cadx-btn cadx-btn-risco" onclick="AutPred_revogar_(\'' + p.id + '\')">Revogar</button>' : "") + "</td></tr>";
      }).join("") + "</tbody></table>" : '<div class="cadx-sub">Nenhuma permissão concedida.</div>');
      el.innerHTML = h;
    }, function (m) { el.innerHTML = AutPred_faixa_(m, "tom-perigo"); });
  }

  function AutPred_conceder_() {
    var g = function (id) { var e = document.getElementById(id); return e ? String(e.value || "").trim() : ""; };
    var m = document.getElementById("autPMsg");
    var dados = { usuarioId: g("autPU"), dispositivoId: g("autPD"), permissao: g("autPP"), vigenciaFim: g("autPF"), motivo: g("autPM") };
    if (!dados.motivo || dados.motivo.length < 5) { if (m) { m.textContent = "Escreva o motivo (mínimo de 5 caracteres)."; m.className = "cadx-msg is-erro"; } return; }
    if (m) { m.textContent = "Gravando…"; m.className = "cadx-msg"; }
    AutPred_chamar_("permissaoConceder", dados, function (r) { AutPred_msg_(AutPred_faixa_(r.mensagem, "tom-ok")); AutPred_desenharAba_(); }, function (msg) { if (m) { m.textContent = msg; m.className = "cadx-msg is-erro"; } });
  }

  function AutPred_revogar_(id) {
    CadUI_confirmar_({ titulo: "Revogar a permissão", risco: true, botao: "Revogar", texto: "<p>A pessoa deixa de ver (e de acionar) o dispositivo na hora.</p>", motivo: { rotulo: "Motivo", min: 5 },
      aoConfirmar: function (valores, fechar, reabilitar) {
        var motivo = valores && valores.motivo !== undefined ? valores.motivo : String((document.getElementById("cadxDlgMotivo") || {}).value || "");
        AutPred_chamar_("permissaoRevogar", { id: id, motivo: motivo }, function (r) { fechar(); AutPred_msg_(AutPred_faixa_(r.mensagem, "tom-ok")); AutPred_desenharAba_(); }, reabilitar);
      } });
  }

  // ---------- auditoria ----------
  function AutPred_desenharAuditoria_(el) {
    el.innerHTML = '<div class="aut-acoes" style="margin-bottom:10px"><button type="button" class="cadx-btn cadx-btn-grande" id="autInteg" onclick="AutPred_integridade_()">Conferir a integridade do registro</button><span class="cadx-sub">Cada linha leva o resumo (SHA-256) da anterior: linha alterada ou apagada aparece aqui. Toque numa linha para ver os detalhes técnicos.</span></div><div id="autIntegRes"></div><div id="autAudLista">' + CadUI_esqueleto_(5) + "</div>";
    AutPred_chamar_("auditoria", { limite: 300 }, function (r) {
      var l = document.getElementById("autAudLista");
      if (!l) return;
      if (!r.itens.length) { l.innerHTML = '<div class="cadx-sub">Nenhum registro ainda.</div>'; return; }
      var grupos = [], porDia = {};
      r.itens.forEach(function (a) { var k = a.dia || ""; if (!porDia[k]) { porDia[k] = []; grupos.push(k); } porDia[k].push(a); });
      l.innerHTML = grupos.map(function (dia, gi) {
        return '<h4 class="aut-reg-dia">' + AutPred_esc_(AutPred_rotuloDia_(dia)) + "</h4>" + '<table class="aut-tabela aut-reg"><thead><tr><th>Quando</th><th>Dispositivo</th><th>Quem</th><th>O que aconteceu</th></tr></thead><tbody>' +
          porDia[dia].map(function (a, i) {
            var tid = "autAudTec_" + gi + "_" + i;
            return '<tr class="aut-reg-tr" onclick="AutPred_alternarTec_(\'' + tid + '\')"><td>' + AutPred_esc_(a.quandoCompleto || a.quando) + "</td><td>" + AutPred_esc_(a.dispositivo || "—") + "</td><td>" + AutPred_esc_(a.usuario) + "</td><td>" + AutPred_esc_(a.frase) + "</td></tr>" +
              '<tr id="' + tid + '" class="aut-tec" hidden><td colspan="4"><div class="cadx-sub">Detalhes técnicos</div>' + AutPred_tecnicoHtml_({ evento: a.evento, resultado: a.resultado, detalhe: a.detalhe, operacao: a.operacaoId, hash: a.hash }) + "</td></tr>";
          }).join("") + "</tbody></table>";
      }).join("");
    }, function (m) { var l = document.getElementById("autAudLista"); if (l) l.innerHTML = AutPred_faixa_(m, "tom-perigo"); });
  }

  function AutPred_integridade_() {
    var b = document.getElementById("autInteg"), r = document.getElementById("autIntegRes");
    if (b) b.disabled = true;
    AutPred_chamar_("integridade", {}, function (x) { if (b) b.disabled = false; if (r) r.innerHTML = AutPred_faixa_(x.texto, x.ok ? "tom-ok" : "tom-perigo"); }, function (m) { if (b) b.disabled = false; if (r) r.innerHTML = AutPred_faixa_(m, "tom-perigo"); });
  }
</script>

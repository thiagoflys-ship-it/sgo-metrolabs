<script>
  // ==========================================================================================
  // NAVEGAÇÃO E "VOLTAR" ÚNICOS DA CASCA (Programa de melhoria do SGO+, Etapa 1, 01/11/2026)
  // Diagnóstico: docs/PROGRAMA_MELHORIA_SGO_ETAPA0_DIAGNOSTICO.md (seção 3). Manual: docs/NAVEGACAO_VOLTAR_SGO.md.
  //
  // O SGO+ é uma página só. Antes, o navegador não sabia que a pessoa tinha andado: o voltar do celular saía do sistema,
  // o Voltar da barra do topo ia para o Início e os documentos abriam numa aba em branco sem volta. Agora:
  //   1. Cada tela é um passo no histórico do navegador (pushState com { sgo, pos, tipo, mod, id, u } e endereço #/modulo).
  //      O voltar do Android, o gesto, o botão do navegador e o Voltar da barra do topo fazem a mesma coisa: um passo atrás.
  //      Recarregar a página reabre a mesma tela (se ela ainda está no menu da pessoa); senão, o Início.
  //      Há uma entrada-base antes do Início: voltar no Início avisa "toque de novo para sair" em vez de cair em página em branco.
  //   2. Janelas (fichas, detalhes, formulários) entram na pilha sozinhas: voltar fecha a janela de cima pelo botão de fechar
  //      dela (a regra do módulo roda). Com texto digitado, pergunta "Descartar o que foi digitado?". Travas obrigatórias
  //      (atividade atrasada, troca de senha obrigatória) não fecham. Trocar de módulo fecha as janelas que ficaram abertas.
  //   3. Sub-níveis que trocam o conteúdo por dentro usam SGO_NAV.empilhar(rotulo, aoVoltar, opcoes) (ver o manual).
  //      Sem o gancho, um toque que troca os títulos da tela vira um passo automático que volta ao começo do módulo.
  //   4. Só no celular (modo celular da casca: #app.modo-mobile, decidido por SGO_modoMovelDesejado_: tela até 900 px de
  //      largura, ou toque com altura até 500 px), documentos abertos por window.open("") + document.write aparecem num
  //      visualizador de tela cheia dentro do SGO+, com Voltar e Imprimir (e Baixar PDF quando o fluxo já tem o arquivo).
  //      No computador continuam abrindo em aba nova, como antes (decisão do dono, 01/11/2026). Endereços reais (PDF do
  //      Drive, wa.me, mailto, downloads) nunca são interceptados.
  // Chave para desligar tudo: window.SGO_NAV_LIGADO = false (antes de carregar) ou localStorage "SGO_NAV_DESLIGADO" = "1".
  // Os widgets AssistenteWidget.html e ComunicacaoWidget.html não mudam (idênticos aos do COMMAND).
  // ==========================================================================================

  var SGO_NAV_TEXTOS = {
    sair: "Você está no Início. Para sair do SGO+, toque em voltar de novo.",
    descartar: "Descartar o que foi digitado?\n\nO que você escreveu nesta tela ainda não foi salvo. Toque em OK para descartar e voltar, ou em Cancelar para continuar aqui.",
    trava: "Esta janela precisa ser resolvida antes de sair: use os botões dela. Ela não fecha pelo voltar.",
    semBotao: "Use os botões da própria janela para sair dela.",
    noInicio: "Você já está no Início."
  };

  /** Endereço vazio (window.open() / window.open("") / "about:blank") em aba nova: é um documento escrito por document.write. */
  function SGO_NAV_ehDocumentoVazio_(url, alvo) {
    var u = url === undefined || url === null ? "" : String(url).trim();
    if (u !== "" && u.toLowerCase() !== "about:blank") return false;
    var a = alvo === undefined || alvo === null ? "" : String(alvo).toLowerCase();
    return a !== "_self" && a !== "_parent" && a !== "_top";
  }

  /** Mesmo endereço do SGO+ (relativo ou mesmo host), que pode ser mostrado no visualizador. Externos, blob: e data: não. */
  function SGO_NAV_mesmaOrigem_(url, origem) {
    var u = String(url || "").trim();
    if (!u) return false;
    if (/^(blob:|data:|mailto:|tel:|javascript:|intent:|whatsapp:)/i.test(u)) return false;
    if (/^[a-z][a-z0-9+.-]*:/i.test(u) || /^\/\//.test(u)) {
      var m = /^(https?:)?\/\/([^/?#]+)/i.exec(u);
      var o = String(origem || "").replace(/^https?:\/\//i, "").replace(/\/.*$/, "");
      return !!(m && o && m[2].toLowerCase() === o.toLowerCase());
    }
    return true;
  }

  /**
   * Núcleo testável da pilha (sem DOM). amb: { history, urlBase(), abrirTela(mod), telaAtual(), telaInicial(), usuario(),
   * aviso(texto), confirmar(texto), janelaAberta(el), janelaTrava(el), janelaSuja(el), fecharJanela(el, jaConfirmou),
   * rotuloJanela(el), textoTrava(el), conteudoSujo(), telaPermitida(mod), hashTela(), agora(), agendar(fn, ms) }.
   */
  function SGO_NAV_criarNucleo_(amb) {
    var N = { ativo: false, seq: 0, atual: null, pilha: [], entradas: {}, janelas: [], esperando: 0, fila: [], restaurando: 0,
      avisoSairEm: -1e15, saindo: false, ultimaOp: 0, restaurar: null, guarda: null };

    function agora() { return amb.agora ? amb.agora() : Date.now(); }
    function url(est) { return est && est.tipo !== "base" && est.mod ? amb.urlBase() + "#/" + est.mod : amb.urlBase(); }
    function novoId() { N.seq += 1; return "n" + N.seq + "_" + Math.floor(Math.random() * 1e6).toString(36); }
    function estado(tipo, mod, extra) {
      var e = { sgo: 1, pos: 0, tipo: tipo, mod: mod || "", id: novoId(), u: String(amb.usuario() || "") };
      if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) e[k] = extra[k];
      return e;
    }
    function copia(e) { var c = {}; for (var k in e) if (Object.prototype.hasOwnProperty.call(e, k)) c[k] = e[k]; return c; }
    function executar(fn) { if (N.esperando > 0) N.fila.push(fn); else fn(); }
    function esvaziarFila() { while (N.esperando === 0 && N.fila.length) N.fila.shift()(); }

    function push(est) {
      executar(function () {
        est.pos = (N.atual ? N.atual.pos : 0) + 1;
        est.telaPos = est.tipo === "tela" ? est.pos : (N.atual ? (N.atual.telaPos !== undefined ? N.atual.telaPos : N.atual.pos) : 0);
        amb.history.pushState(est, "", url(est));
        N.atual = est; N.pilha.length = est.pos; N.pilha[est.pos] = est; N.ultimaOp = agora();
      });
    }
    function replace(est) {
      executar(function () {
        est.pos = N.atual ? N.atual.pos : 0;
        est.telaPos = est.tipo === "tela" ? est.pos : (N.atual && N.atual.telaPos !== undefined ? N.atual.telaPos : est.pos);
        amb.history.replaceState(est, "", url(est));
        N.atual = est; N.pilha[est.pos] = est; N.ultimaOp = agora();
      });
    }
    /** Volta k passos sem tratar o popstate (tira da pilha entradas que já não valem). */
    function voltarSilencioso(k) {
      if (!(k > 0)) return;
      executar(function () {
        if (!N.atual || N.atual.pos - k < 0) return;
        N.esperando += 1;
        amb.history.go(-k);
        if (N.guarda) N.guarda.cancelado = true;
        var g = { cancelado: false }; N.guarda = g;
        amb.agendar(function () { if (!g.cancelado && N.esperando > 0) { N.esperando = 0; esvaziarFila(); } }, 1200);
      });
    }
    function entradaMorta(e) {
      if (!e || e.tipo === "tela" || e.tipo === "base") return false;
      var r = N.entradas[e.id];
      if (!r || r.morta) return true;
      if (e.tipo === "janela") return !amb.janelaAberta(r.el);
      return false;
    }
    function telaAbaixo(pos) { for (var p = pos; p >= 0; p--) { var e = N.pilha[p]; if (e && (e.tipo === "tela" || e.tipo === "base")) return e; } return null; }
    /** Quantas entradas mortas há no topo (para tirar com um voltar silencioso). */
    function mortasNoTopo() {
      if (!N.atual) return 0;
      var k = 0;
      for (var p = N.atual.pos; p > 0; p--) { var e = N.pilha[p]; if (e && entradaMorta(e)) k++; else break; }
      return k;
    }
    function comRestauracao(fn) { N.restaurando++; try { return fn(); } finally { N.restaurando--; } }
    function inicial() { return amb.telaInicial(); }

    function reempurrar(lista) { for (var i = lista.length - 1; i >= 0; i--) push(copia(lista[i])); }

    function aoChegarNaBase() {
      var home = inicial();
      if (agora() - N.avisoSairEm < 3000 && !N.saindo) {
        N.saindo = true;
        amb.history.back(); // sai do SGO+ (se houver página antes); se não houver, nada acontece e o Início volta abaixo
        amb.agendar(function () {
          if (N.saindo && N.ativo && N.atual && N.atual.tipo === "base") { N.saindo = false; push(estado("tela", home)); }
        }, 1500);
        return;
      }
      N.saindo = false;
      N.avisoSairEm = agora();
      amb.aviso(SGO_NAV_TEXTOS.sair);
      if (amb.telaAtual() !== home) comRestauracao(function () { amb.abrirTela(home); });
      push(estado("tela", home));
    }

    function aoVoltarUsuario(novo, antes) {
      var popped = [];
      for (var p = antes.pos; p > novo.pos; p--) { var s = N.pilha[p] || (p === antes.pos ? antes : null); if (s) popped.push(s); }
      N.atual = novo; N.pilha.length = novo.pos + 1; N.pilha[novo.pos] = novo; // o navegador já está na entrada de chegada
      // 1) janelas, de cima para baixo
      var fechadas = [];
      for (var i = 0; i < popped.length; i++) {
        var s1 = popped[i];
        if (s1.tipo !== "janela") continue;
        var r = N.entradas[s1.id];
        if (!r || r.morta || !amb.janelaAberta(r.el)) continue;
        if (amb.janelaTrava(r.el)) { reempurrar(popped.slice(0, i + 1)); amb.aviso(amb.textoTrava(r.el) || SGO_NAV_TEXTOS.trava); return; }
        var confirmou = false;
        if (amb.janelaSuja(r.el)) {
          if (!amb.confirmar(SGO_NAV_TEXTOS.descartar)) { reempurrar(popped.slice(0, i + 1)); return; }
          confirmou = true;
        }
        if (!amb.fecharJanela(r.el, confirmou)) { reempurrar(popped.slice(0, i + 1)); amb.aviso(SGO_NAV_TEXTOS.semBotao); return; }
        r.morta = true; fechadas.push(s1);
        N.janelas = N.janelas.filter(function (j) { return j.id !== s1.id; });
      }
      var restantes = popped.filter(function (s) { return s.tipo !== "janela"; });
      var saiDeTela = restantes.some(function (s) { return s.tipo === "tela"; });
      var subs = restantes.filter(function (s) { return s.tipo === "sub" && !entradaMorta(s); });
      // 2) sair de uma tela ou sub-nível com texto digitado. Revisão 01/11/2026 (Comercial C3): sub-nível empilhado com
      // { mantemTexto: true } só desfaz o que está acima do formulário (ex.: o resultado do Orçamentista); o texto digitado fica,
      // então não pergunta "Descartar o que foi digitado?"
      var subsQueDescartam = subs.filter(function (s) { var e = N.entradas[s.id]; return !(e && e.mantemTexto); });
      if ((saiDeTela || subsQueDescartam.length) && amb.conteudoSujo() && !amb.confirmar(SGO_NAV_TEXTOS.descartar)) { reempurrar(restantes); return; }
      N.atual = novo; N.pilha.length = novo.pos + 1; N.pilha[novo.pos] = novo;
      if (novo.tipo === "base") { aoChegarNaBase(); return; }
      // 3) chegou numa entrada que não vale mais (janela fechada, passo antigo): continua voltando
      if (entradaMorta(novo)) { amb.history.back(); return; }
      var depois = [];
      comRestauracao(function () {
        var semDesfazer = subs.some(function (s) { var e = N.entradas[s.id]; return !e || !e.aoVoltar; });
        if (saiDeTela || novo.mod !== amb.telaAtual() || semDesfazer) {
          amb.abrirTela(novo.mod);
          var en = N.entradas[novo.id];
          if (novo.tipo === "sub" && en && en.reabrir) en.reabrir();
        } else {
          subs.forEach(function (s) { var e = N.entradas[s.id]; if (e && e.aoVoltar) { e.morta = true; e.aoVoltar(); if (e.reinicia) depois.push(true); } });
        }
      });
      if (depois.length) limparSubniveis();
    }

    function aoPop(novo) {
      if (!N.ativo) return;
      if (N.esperando > 0) {
        N.esperando -= 1;
        if (novo && novo.sgo) { N.atual = novo; N.pilha.length = novo.pos + 1; N.pilha[novo.pos] = novo; }
        if (N.esperando === 0) { if (N.guarda) N.guarda.cancelado = true; esvaziarFila(); }
        return;
      }
      var antes = N.atual;
      if (!novo || !novo.sgo || (novo.u && novo.u !== String(amb.usuario() || ""))) novo = { sgo: 1, pos: 0, tipo: "base", mod: "" };
      if (!antes) { N.atual = novo; N.pilha[novo.pos] = novo; if (novo.tipo !== "base" && novo.mod && novo.mod !== amb.telaAtual()) comRestauracao(function () { amb.abrirTela(novo.mod); }); return; }
      if (novo.pos < antes.pos) { aoVoltarUsuario(novo, antes); return; }
      // para a frente (ou mesma posição): reabre a tela daquele passo; janela e sub-nível não podem ser refeitos
      N.atual = novo; N.pilha.length = novo.pos + 1; N.pilha[novo.pos] = novo;
      if (novo.tipo === "base") { aoChegarNaBase(); return; }
      if (novo.mod && novo.mod !== amb.telaAtual()) comRestauracao(function () { amb.abrirTela(novo.mod); });
      if (novo.tipo !== "tela") replace(estado("tela", novo.mod));
    }

    /** Chamado no começo de abrir(mod), antes de desenhar. false = a pessoa preferiu continuar (não abre). */
    function antesDeAbrir(mod) {
      if (!N.ativo || N.restaurando) return true;
      if (mod === amb.telaAtual()) return true;
      var abertas = N.janelas.slice().reverse();
      for (var i = 0; i < abertas.length; i++) {
        var r = N.entradas[abertas[i].id];
        if (!r || r.morta || !amb.janelaAberta(r.el) || amb.janelaTrava(r.el)) continue;
        var confirmou = false;
        if (amb.janelaSuja(r.el)) { if (!amb.confirmar(SGO_NAV_TEXTOS.descartar)) return false; confirmou = true; }
        if (amb.fecharJanela(r.el, confirmou)) r.morta = true;
      }
      N.janelas = N.janelas.filter(function (j) { var r2 = N.entradas[j.id]; return r2 && !r2.morta; });
      return true;
    }

    /** Chamado no fim de abrir(mod): grava o passo (ou só ajusta o atual, se é a mesma tela ou uma restauração). */
    function aoAbrir(mod) {
      if (!N.ativo || !mod) return;
      if (N.restaurando) {
        if (N.atual && N.atual.tipo !== "base" && N.atual.mod !== mod) { var c = copia(N.atual); c.mod = mod; replace(c); }
        return;
      }
      if (!N.atual || N.atual.tipo === "base") { push(estado("tela", mod)); return; }
      var tela = telaAbaixo(N.atual.pos);
      if (tela && tela.tipo === "tela" && tela.mod === mod) {
        if (N.atual.tipo === "tela") return; // mesma tela redesenhada: não grava passo
        // a tela voltou ao começo vinda de um sub-nível: os sub-níveis acima deixam de valer
        for (var p = N.atual.pos; p > tela.pos; p--) { var e = N.pilha[p]; if (e && e.tipo === "sub" && N.entradas[e.id]) N.entradas[e.id].morta = true; }
        voltarSilencioso(mortasNoTopo());
        return;
      }
      if (N.atual.tipo === "tela" && N.atual.mod === mod) return;
      push(estado("tela", mod));
    }

    function empilhar(rotulo, aoVoltar, op) {
      op = op || {};
      if (!N.ativo || N.restaurando || !N.atual) return null;
      var topo = N.atual, rt = N.entradas[topo.id];
      if (topo.tipo === "sub" && rt && !rt.morta && (op.substituir || (op.chave && rt.chave === op.chave))) {
        rt.aoVoltar = aoVoltar; rt.reabrir = op.reabrir || null; rt.reinicia = !!op.reinicia; rt.mantemTexto = !!op.mantemTexto; N.ultimaOp = agora();
        return topo.id;
      }
      var est = estado("sub", amb.telaAtual() || topo.mod, { rotulo: String(rotulo || "") });
      N.entradas[est.id] = { aoVoltar: aoVoltar, reabrir: op.reabrir || null, chave: op.chave || "", reinicia: !!op.reinicia, auto: !!op.auto, mantemTexto: !!op.mantemTexto };
      push(est);
      return est.id;
    }

    function limparSubniveis() {
      if (!N.ativo || N.restaurando || !N.atual) return;
      var tela = telaAbaixo(N.atual.pos);
      if (!tela) return;
      var temJanela = false;
      for (var p = N.atual.pos; p > tela.pos; p--) {
        var e = N.pilha[p]; if (!e) continue;
        var r = N.entradas[e.id];
        if (e.tipo === "sub" && r) r.morta = true;
        if (e.tipo === "janela" && r && !r.morta && amb.janelaAberta(r.el)) temJanela = true;
      }
      if (!temJanela) voltarSilencioso(mortasNoTopo());
    }

    /** Voltar da barra do topo (e de botões "Voltar" dos módulos). true = tratado. */
    function voltar() {
      if (!N.ativo) return false;
      if (N.atual && N.atual.pos > 1) { amb.history.back(); return true; }
      var home = inicial();
      if (amb.telaAtual() !== home) { comRestauracao(function () { amb.abrirTela(home); }); if (N.atual && N.atual.tipo !== "base") replace(estado("tela", home)); else push(estado("tela", home)); return true; }
      amb.aviso(SGO_NAV_TEXTOS.noInicio);
      return true;
    }
    function topoEhSubVivo() { var r = N.atual && N.entradas[N.atual.id]; return !!(N.ativo && N.atual && N.atual.tipo === "sub" && r && !r.morta && r.aoVoltar); }
    function voltarOu(fn) { if (topoEhSubVivo()) amb.history.back(); else if (typeof fn === "function") fn(); }

    /** Janelas abertas agora (na ordem em que estão por cima). Grava as novas e tira as que fecharam. */
    function janelasMudaram(abertas) {
      if (!N.ativo) return;
      abertas = abertas || [];
      var fechouTopo = false;
      N.janelas = N.janelas.filter(function (j) {
        if (abertas.indexOf(j.el) >= 0) return true;
        var r = N.entradas[j.id]; if (r) r.morta = true;
        if (N.atual && N.atual.id === j.id) fechouTopo = true;
        return false;
      });
      var conhecidas = N.janelas.map(function (j) { return j.el; });
      var novas = abertas.filter(function (el) { return conhecidas.indexOf(el) < 0; });
      novas.forEach(function (el, i) {
        var est = estado("janela", amb.telaAtual() || (N.atual && N.atual.mod) || "", { rotulo: amb.rotuloJanela(el) || "" });
        N.entradas[est.id] = { el: el };
        N.janelas.push({ el: el, id: est.id });
        if (i === 0 && fechouTopo && N.atual && N.atual.tipo === "janela") { replace(est); fechouTopo = false; } else push(est);
      });
      if (fechouTopo && !N.restaurando) voltarSilencioso(mortasNoTopo());
    }

    function iniciarSessao() {
      N.ativo = true; N.restaurar = null;
      var st = amb.history.state, u = String(amb.usuario() || "");
      if (st && st.sgo && st.tipo !== "base" && st.mod && st.u === u) {
        N.pilha = []; N.atual = copia(st); N.pilha[st.pos] = N.atual;
        var mod = amb.telaPermitida(st.mod) ? st.mod : inicial();
        // estava numa janela ou sub-nível: volta, sem tratar, até o passo da tela (a janela não é refeita)
        if (st.tipo !== "tela" && mod === st.mod && st.telaPos >= 1 && st.telaPos < st.pos) {
          voltarSilencioso(st.pos - st.telaPos);
          N.restaurar = { mod: mod, mesmaEntrada: true };
          return N.restaurar;
        }
        if (st.tipo !== "tela" || mod !== st.mod) { var t = estado("tela", mod); t.pos = st.pos; amb.history.replaceState(t, "", url(t)); N.atual = t; N.pilha[t.pos] = t; }
        N.restaurar = { mod: mod, mesmaEntrada: true };
        return N.restaurar;
      }
      var base = { sgo: 1, pos: 0, tipo: "base", mod: "", id: "base", u: u };
      amb.history.replaceState(base, "", amb.urlBase());
      N.pilha = [base]; N.atual = base; N.entradas = {}; N.janelas = [];
      var home = inicial();
      var est = estado("tela", home); est.pos = 1; est.telaPos = 1;
      amb.history.pushState(est, "", url(est)); N.atual = est; N.pilha[1] = est;
      var h = amb.hashTela ? amb.hashTela() : "";
      if (h && h !== home && amb.telaPermitida(h)) N.restaurar = { mod: h, mesmaEntrada: false };
      return N.restaurar;
    }
    function encerrarSessao() {
      N.ativo = false; N.atual = null; N.pilha = []; N.entradas = {}; N.janelas = []; N.fila = []; N.esperando = 0; N.restaurar = null;
      try { amb.history.replaceState({ sgo: 1, pos: 0, tipo: "base", mod: "", id: "base" }, "", amb.urlBase()); } catch (e) {}
    }

    return {
      N: N, aoPop: aoPop, antesDeAbrir: antesDeAbrir, aoAbrir: aoAbrir, empilhar: empilhar, limparSubniveis: limparSubniveis,
      voltar: voltar, voltarOu: voltarOu, janelasMudaram: janelasMudaram, iniciarSessao: iniciarSessao, encerrarSessao: encerrarSessao,
      comRestauracao: comRestauracao, restaurando: function () { return N.restaurando > 0; }, ativo: function () { return N.ativo; },
      ultimaOp: function () { return N.ultimaOp; }
    };
  }

  /**
   * "Janela" devolvida por window.open("") no celular: a casca escreve o documento num iframe do visualizador.
   * cw = contentWindow do iframe (mesma origem, about:blank). ctl = { fechar(), fechado(), imprimir(), navegar(url) }.

      if (op.baixarUrl) { v.btBaixar.href = op.baixarUrl; v.btBaixar.hidden = false; }
      el.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.stopPropagation(); fecharVisor(); } });
      v.iframe.addEventListener("load", function () { v.medido = true; ajustarLargura(v); tiqueVisor(v); });
      v.aoGirar = function () { if (!v.fechado) ajustarLargura(v); };
      window.addEventListener("resize", v.aoGirar);
      v.timer = setInterval(function () { tiqueVisor(v); }, 700);
      if (op.url) navegarVisor(v, String(op.url));
      var cw = v.iframe.contentWindow;
      return SGO_NAV_criarJanelaFalsa_(cw, { fechar: function () { if (VISOR === v) fecharVisor(); }, fechado: function () { return v.fechado; },
        imprimir: function () { v.btImprimir.onclick(); }, navegar: function (u) { navegarVisor(v, u); } });
    }

    // window.open("") seguido de document.write: no celular vira o visualizador. Todo o resto segue como antes.
    var abrirOriginal = window.open;
    window.open = function (u, alvo, recursos) {
      try {
        if (nucleo.ativo() && ehCelular() && SGO_NAV_ehDocumentoVazio_(u, alvo)) return abrirVisor({ titulo: "Documento" });
      } catch (e) { console.error("Visualizador:", e); }
      return abrirOriginal.apply(window, arguments);
    };

    window.SGO_NAV = {
      ligado: true,
      nucleo: nucleo,
      ehCelular: ehCelular,
      /** Sub-nível dentro do módulo: grava um passo; voltar chama aoVoltar. opcoes: { chave, substituir, reabrir, reinicia }. */
      empilhar: function (rotulo, aoVoltar, opcoes) { return nucleo.empilhar(rotulo, aoVoltar, opcoes); },
      /** Botão "Voltar" de um módulo: se há sub-nível gravado, volta um passo pelo histórico; senão, roda fn. */
      voltarOu: function (fn) { nucleo.voltarOu(fn); },
      /** O módulo voltou ao começo por conta própria (ex.: "Voltar ao painel"): tira os sub-níveis da pilha. */
      limparSubniveis: function () { nucleo.limparSubniveis(); },
      voltar: function () { return nucleo.voltar(); },
      antesDeAbrir: function (mod) { return nucleo.antesDeAbrir(mod); },
      aoAbrir: function (mod) { nucleo.aoAbrir(mod); agendar(); },
      iniciarSessao: function () { var r = nucleo.iniciarSessao(); document.documentElement.classList.toggle("sgo-movel", ehCelular()); return r; },
      encerrarSessao: function () { fecharVisor(); nucleo.encerrarSessao(); },
      telaParaRestaurar: function () {
        var r = nucleo.N.restaurar;
        if (r && r.mod && !telaPermitida(r.mod)) r = { mod: telaInicial(), mesmaEntrada: !!r.mesmaEntrada };
        return r;
      },
      restaurarCom: function (fn) { return nucleo.comRestauracao(fn); },
      /** Documento por endereço (ex.: relatório do ciclo). No computador abre aba nova; no celular, o visualizador. */
      abrirDocumento: function (op) {
        op = op || {};
        if (!nucleo.ativo() || !ehCelular()) return false;
        abrirVisor({ titulo: op.titulo || "Documento", tituloFixo: !!op.titulo, url: op.url, baixarUrl: op.baixarUrl });
        return true;
      }
    };
  }

  if (typeof window !== "undefined" && window.document && !window.__SGO_NAV_TESTE__) {
    try { SGO_NAV_instalar_(); } catch (e) { console.error("Navegação do SGO+ não ligou:", e); }
  }
</script>

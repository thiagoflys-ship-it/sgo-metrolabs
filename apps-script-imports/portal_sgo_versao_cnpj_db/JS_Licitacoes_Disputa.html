<!--
  SGO+ LICITAÇÕES — CENTRAL DE DISPUTAS, MODO ASSISTIDO (02/11/2026): a tela "Central de disputas" (menu) e a aba "Disputa" da ficha.
  Modo assistido: o SGO+ NUNCA envia lance nem acessa o portal. A Diretoria dá o lance no portal e digita aqui o nosso lance e o
  melhor lance do concorrente; o SGO+ mostra a sobra a cada valor (a mesma conta da simulação), a distância ao piso e a sugestão do
  próximo lance (regra fixa: melhor lance − intervalo, nunca abaixo do piso; a IA não sugere valor). Lance abaixo do piso é recusado
  pelo servidor com o porquê. Servidor: SGO_Licitacoes_Disputa.js (Licitacoes_api ação "disputa" com { op }).
  Usa os utilitários de JS_Licitacoes.html (Lic_esc_, Lic_chamar_, Lic_janela_, Lic_faixa_, Lic_tabelaHtml_, Lic_brl_, Lic_toast_,
  Lic_dataHora_, Lic_carregando_, Lic_erroTela_, Lic_ligarRefazer_, Lic_irFicha_) e a janela segura do A4 de JS_Licitacoes_Proposta.html.
  Todo texto passa por Lic_esc_. Sem atualização automática: só redesenha depois de uma ação de quem está na tela.
-->
<style>
  .ldp-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
  .ldp-grade label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .ldp-grade input, .ldp-grade select, .ldp-grade textarea { width: 100%; min-height: 44px; box-sizing: border-box; max-width: 100%; }
  .ldp-grade .ldp-largo { grid-column: 1 / -1; }
  .ldp-cab { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
  .ldp-cab h3 { margin: 0; min-width: 0; flex: 1 1 220px; overflow-wrap: anywhere; }
  .ldp-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; margin: 8px 0; font-size: 12.5px; }
  .ldp-dl div { min-width: 0; }
  .ldp-dl span { display: block; color: var(--muted); font-weight: 700; font-size: 11.5px; }
  .ldp-dl b { font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .ldp-item { border: 1px solid var(--border); border-left: 4px solid var(--bc-line-2); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; background: var(--card); overflow-wrap: anywhere; }
  .ldp-item.frente { border-left-color: var(--success); }
  .ldp-item.atras { border-left-color: var(--warning, #b26a00); }
  .ldp-item.fora { border-left-color: var(--muted); opacity: .85; }
  .ldp-sug { border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; background: var(--info-bg, #eef4fb); border: 1px solid var(--info, #1f5fa8); }
  .ldp-sug.piso { background: var(--danger-bg, #fdecea); border-color: var(--danger, #b3261e); }
  .ldp-sug b { font-variant-numeric: tabular-nums; }
  .ldp-lance { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; align-items: end; margin-top: 8px; }
  .ldp-lance label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .ldp-lance input { width: 100%; min-height: 44px; box-sizing: border-box; font-variant-numeric: tabular-nums; }
  .ldp-lance button { min-height: 44px; }
  .ldp-previa { font-size: 12px; margin-top: 3px; min-height: 16px; }
  .ldp-vermelho { color: var(--danger, #b3261e); font-weight: 700; }
  .ldp-prejuizo { border: 2px solid var(--danger, #b3261e); background: var(--danger-bg, #fdecea); color: var(--danger, #b3261e); border-radius: 8px; padding: 8px 10px; font-weight: 700; margin: 8px 0; }
  .ldp-aceite { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; cursor: pointer; }
  .ldp-aceite input { width: 20px; height: 20px; }
  .ldp-det summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
  .ldp-lista { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
  .ldp-lista li { padding: 5px 0; border-top: 1px dashed var(--border); overflow-wrap: anywhere; }
  @media (max-width: 900px) { .ldp-acoes .btn-primary, .ldp-acoes .btn-secondary { flex: 1 1 140px; } }
</style>
<script>
  var LICDP = { aba: {}, central: null };
  var LICDP_RES = [["GANHO", "Ganho"], ["PERDIDO", "Perdido"], ["FRACASSADO", "Fracassado"], ["DESERTO", "Deserto"], ["DESCLASSIFICADO", "Desclassificado (com motivo)"], ["HABILITACAO_PENDENTE", "Habilitação pendente"], ["RECURSO", "Em recurso"]];
  var LICDP_COR_RES = { GANHO: "verde", PERDIDO: "vermelho", FRACASSADO: "cinza", DESERTO: "cinza", DESCLASSIFICADO: "vermelho", HABILITACAO_PENDENTE: "laranja", RECURSO: "laranja" };
  var LICDP_POSICAO = { NA_FRENTE: ["verde", "Nosso lance é o melhor"], EMPATE: ["laranja", "Empate com o melhor lance"], ATRAS: ["laranja", "Concorrente na frente"], SEM_CONCORRENTE: ["cinza", "Sem lance do concorrente informado"] };

  function LicDp_chamar_(op, dados, ok, erro, o) { Lic_chamar_("disputa", Object.assign({ op: op }, dados || {}), ok, erro, Object.assign({ ignorarVelha: true }, o || {})); }
  function LicDp_selo_(cor, texto) { return '<span class="cm-selo ' + Lic_esc_(cor || "cinza") + '">' + Lic_esc_(texto) + "</span>"; }
  function LicDp_valor_(id) { var e = Lic_$_(id); return e ? e.value : ""; }
  function LicDp_curto_(h) { return '<span class="lic-hash" title="' + Lic_esc_(h) + '">' + Lic_esc_(String(h || "").slice(0, 12)) + (h ? "…" : "—") + "</span>"; }
  /**
   * Leitura ESTRITA do valor em reais, a mesma do servidor (LicD_lerReais_, SGO_Licitacoes_Disputa.js; revisão de bddf933): vírgula para
   * os centavos, ponto só como milhar junto da vírgula, no máximo 2 casas, sem "%". { valor } ou { erro }.
   */
  function LicDp_lerReais_(v) {
    if (typeof v === "number") return !isFinite(v) ? { erro: "valor inválido" } : Math.abs(Math.round(v * 100) - v * 100) > 1e-6 ? { erro: "use no máximo 2 casas decimais (centavos)" } : { valor: v };
    var s = String(v === null || v === undefined ? "" : v).replace(/^R\$\s*/i, "").replace(/\s+/g, "");
    if (!s) return { erro: "vazio" };
    if (/%/.test(s)) return { erro: 'sem o sinal "%" (o campo é em reais)' };
    if (/\./.test(s) && !/^\d{1,3}(\.\d{3})+,\d+$/.test(s)) return { erro: "use vírgula para os centavos (por exemplo 185,40); ponto só para o milhar junto da vírgula (1.234,56)" };
    if (!/^\d{1,3}(\.\d{3})+(,\d+)?$|^\d+(,\d+)?$/.test(s)) return { erro: "escreva só números (por exemplo 185,40)" };
    if ((s.split(",")[1] || "").length > 2) return { erro: "use no máximo 2 casas decimais (centavos)" };
    var n = Number(s.replace(/\./g, "").replace(",", ".")); return isFinite(n) ? { valor: n } : { erro: "valor inválido" };
  }
  function LicDp_num_(v) { var r = LicDp_lerReais_(v); return r.erro ? null : r.valor; }
  function LicDp_pct_(v) { return v === null || v === undefined || !isFinite(Number(v)) ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%"; }
  /** Sobra de um valor unitário: a mesma conta do servidor (LicP_sobra_), com os impostos gravados na simulação. */
  function LicDp_sobra_(it, preco) {
    var P = Number(preco) || 0, C = Number(it.custoUnit) || 0, pc = it.pc || {};
    if (!(P > 0)) return null;
    var imp = it.tipo === "PRODUTO" ? P * (pc.impP || 0) / 100 - C * (pc.cred || 0) / 100 : P * (pc.imp || 0) / 100, s = P - imp - P * (pc.comissao || 0) / 100 - C;
    return { sobra: Math.round(s * 100) / 100, pct: Math.round(s / P * 10000) / 100 };
  }

  // ================= Central de disputas (menu) =================
  function LicDp_renderCentral_() {
    var c = Lic_corpo_(); if (!c) return;
    c.innerHTML = Lic_carregando_(2);
    LicDp_chamar_("central", {}, function (r) { LICDP.central = r; c.innerHTML = LicDp_htmlCentral_(r); LicDp_ligarCentral_(c); },
      function (m) { c.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(c, LicDp_renderCentral_); });
  }
  function LicDp_htmlCentral_(r) {
    var k = r.contagens || {};
    var h = Lic_faixa_(r.aviso || "", "aviso") + '<div class="cm-kpis"><div class="cm-kpi"><b>' + Lic_esc_(k.abertas || 0) + '</b><span>Disputas abertas</span></div><div class="cm-kpi"><b>' + Lic_esc_(k.prontas || 0) +
      '</b><span>Prontas para abrir (proposta emitida)</span></div><div class="cm-kpi"><b>' + Lic_esc_(k.resultado || 0) + '</b><span>Com resultado registrado</span></div></div>' +
      '<div class="lic-acoes-linha ldp-acoes" style="margin:8px 0"><button type="button" class="btn-secondary" data-ldp-central-atualizar>Atualizar</button></div>';
    h += '<div class="cm-caixa"><h3>Disputas</h3>' + ((r.disputas || []).length ? Lic_tabelaHtml_(["Licitação", "Órgão", "Sessão", "Situação", "Itens", "Lances", ""], r.disputas.map(function (x) {
      return ['<span class="lic-mono">' + Lic_esc_(x.codigo) + "</span>", Lic_esc_(x.orgao) + " · " + Lic_esc_(x.uf), Lic_esc_(x.sessaoTexto || "a informar") + (x.sessaoIso && x.sessaoPassou && x.situacao === "ABERTA" ? " " + LicDp_selo_("laranja", "já começou") : ""),
        LicDp_selo_(x.situacao === "ABERTA" ? "azul" : "verde", x.situacaoNome) + (x.integra ? "" : " " + LicDp_selo_("vermelho", "alterada fora do SGO+")),
        Lic_esc_(x.itens + " · " + x.comResultado + " com resultado" + (x.ganhos ? " · " + x.ganhos + " ganho(s)" : "") + (x.desistidos ? " · " + x.desistidos + " desistido(s)" : "")), Lic_esc_(x.lances),
        '<button type="button" class="btn-secondary" data-ldp-ficha="' + Lic_esc_(x.opId) + '">Abrir o painel</button>'];
    })) : '<p class="cm-vazio">Nenhuma disputa aberta ainda. A disputa abre na ficha da licitação, aba Disputa, depois da proposta emitida.</p>') + "</div>";
    h += '<div class="cm-caixa"><h3>Sessões: prontas para abrir</h3><p class="cm-meta">Licitações com a proposta emitida e sem disputa. A data da sessão vem da agenda (confirme no edital).</p>' + ((r.prontas || []).length ? Lic_tabelaHtml_(["Licitação", "Órgão", "Sessão (agenda)", "Proposta", "Total", ""], r.prontas.map(function (x) {
      return ['<span class="lic-mono">' + Lic_esc_(x.codigo) + "</span>", Lic_esc_(x.orgao) + " · " + Lic_esc_(x.uf), Lic_esc_(x.sessaoTexto || "sem data na agenda") + (x.sessaoFonte ? '<br><span class="cm-meta">' + Lic_esc_(x.sessaoFonte) + "</span>" : ""), Lic_esc_(x.proposta), Lic_esc_(Lic_brl_(x.total)),
        '<button type="button" class="btn-secondary" data-ldp-ficha="' + Lic_esc_(x.opId) + '">Abrir a disputa</button>'];
    })) : '<p class="cm-vazio">Nenhuma licitação com proposta emitida esperando disputa.</p>') + "</div>";
    return h;
  }
  function LicDp_ligarCentral_(c) {
    c.querySelectorAll("[data-ldp-ficha]").forEach(function (b) { b.onclick = function () { Lic_irFicha_(b.getAttribute("data-ldp-ficha"), "disputa"); }; });
    var a = c.querySelector("[data-ldp-central-atualizar]"); if (a) a.onclick = LicDp_renderCentral_;
  }

  // ================= aba "Disputa" da ficha =================
  function LicDp_htmlAba_(d) { return '<div id="licDisputa">' + Lic_carregando_(2) + "</div>"; }
  function LicDp_ligarAba_(c, d, id) {
    LicDp_chamar_("tela", { id: id }, function (r) { LICDP.aba[id] = r.disputa; LicDp_desenhar_(id); },
      function (m) { var el = Lic_$_("licDisputa"); if (el) { el.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(el, function () { LicDp_ligarAba_(c, d, id); }); } });
  }
  function LicDp_previaHtml_(t) {
    var p = t.previa || {}, h = Lic_faixa_(t.aviso || "", "aviso");
    h += '<div class="cm-caixa"><h3>Abrir a disputa</h3><p class="cm-txt">A disputa usa a proposta emitida (valor inicial de cada item) e a simulação de preço que ela usou (piso de cada item: sobra mínima da política). A Diretoria muda o piso de um item depois de abrir, sempre com o motivo.</p>';
    if ((p.bloqueios || []).length) h += Lic_faixa_("<b>Antes de abrir:</b><ul class=\"ldp-lista\">" + p.bloqueios.map(function (b) { return "<li>" + Lic_esc_(b) + "</li>"; }).join("") + "</ul>", "erro", true) +
      '<div class="lic-acoes-linha ldp-acoes"><button type="button" class="btn-secondary" data-ldp-ir="proposta">Ir para a aba Proposta</button><button type="button" class="btn-secondary" data-ldp-ir="preco">Ir para a aba Preço</button></div>';
    if ((p.avisos || []).length) h += Lic_faixa_("<ul class=\"ldp-lista\">" + p.avisos.map(function (b) { return "<li>" + Lic_esc_(b) + "</li>"; }).join("") + "</ul>", "aviso", true);
    if (p.proposta) h += '<div class="ldp-dl"><div><span>Proposta emitida</span><b>' + Lic_esc_(p.proposta.numero) + " · " + Lic_esc_(Lic_brl_(p.proposta.total)) + "</b></div><div><span>SHA-256 da proposta</span><b>" + LicDp_curto_(p.proposta.sha256) + "</b></div>" +
      (p.simulacao ? "<div><span>Simulação de preço</span><b>versão " + Lic_esc_(p.simulacao.versao) + " · " + LicDp_curto_(p.simulacao.hash) + "</b></div>" : "") + "</div>";
    if ((p.itens || []).length) h += Lic_tabelaHtml_(["Item", "Serviço", "Qtd.", "Valor inicial", "Sobra no valor inicial", "Piso (simulação)", "Custo + impostos"], p.itens.map(function (i) {
      return [Lic_esc_(i.item), Lic_esc_(i.codigo + (i.nome ? " · " + i.nome : "")), Lic_esc_(String(i.quantidade).replace(".", ",")), Lic_esc_(Lic_brl_(i.valorInicial)), Lic_esc_(i.sobraInicial ? LicDp_pct_(i.sobraInicial.pct) : "—"),
        Lic_esc_(Lic_brl_(i.pisoSimulacao)) + '<br><span class="cm-meta">sobra mínima ' + Lic_esc_(LicDp_pct_(i.margemMinPct)) + "</span>", Lic_esc_(i.pisoCusto === null ? "—" : Lic_brl_(i.pisoCusto))];
    }));
    if (p.podeAbrir) {
      var s = p.sessao, dia = s && s.iso ? new Date(Date.parse(s.iso) - 3 * 3600e3).toISOString() : "", ie = p.intervaloEdital;
      h += '<div class="ldp-grade" style="margin-top:10px"><div><label for="ldpSesDia">Data da sessão</label><input id="ldpSesDia" type="date" value="' + Lic_esc_(dia.slice(0, 10)) + '"></div>' +
        '<div><label for="ldpSesHora">Hora (Brasília)</label><input id="ldpSesHora" type="time" value="' + Lic_esc_(dia.slice(11, 16)) + '"></div>' +
        '<div class="ldp-largo"><label for="ldpSesFonte">De onde veio a data da sessão</label><input id="ldpSesFonte" maxlength="300" value="' + Lic_esc_(s ? s.fonte : "") + '" placeholder="Ex.: edital, preâmbulo"></div>' +
        '<div><label for="ldpPortal">Portal da sessão</label><input id="ldpPortal" maxlength="120" placeholder="Ex.: Compras.gov.br"></div>' +
        '<div><label for="ldpIvTipo">Intervalo mínimo entre lances</label><select id="ldpIvTipo"><option value="VALOR"' + (ie && ie.sugestao && ie.sugestao.tipo === "PERCENTUAL" ? "" : " selected") + '>Em reais</option><option value="PERCENTUAL"' + (ie && ie.sugestao && ie.sugestao.tipo === "PERCENTUAL" ? " selected" : "") + ">Em % do melhor lance</option></select></div>" +
        '<div><label for="ldpIvValor">Valor do intervalo</label><input id="ldpIvValor" inputmode="decimal" value="' + Lic_esc_(ie && ie.sugestao ? String(ie.sugestao.valor).replace(".", ",") : "") + '" placeholder="vazio = R$ 0,01"></div>' +
        '<div class="ldp-largo"><label for="ldpIvFonte">De onde veio o intervalo</label><input id="ldpIvFonte" maxlength="300" value="' + Lic_esc_(ie ? "Edital (leitura " + (ie.item || "") + (ie.fonte ? ", " + ie.fonte : "") + ")" : "") + '" placeholder="Ex.: edital, item 7.3"></div>' +
        (ie ? '<div class="ldp-largo">' + Lic_faixa_("Frase do edital sobre o intervalo: «" + ie.trecho + "»" + (ie.sugestao ? "" : " (o SGO+ não achou o número: digite).") , "aviso") + "</div>" : '<div class="ldp-largo"><p class="cm-ajuda-campo">A leitura do edital não trouxe o intervalo mínimo. Confira no edital; sem intervalo, o SGO+ usa R$ 0,01.</p></div>') +
        '<div class="ldp-largo"><label for="ldpMotivo">Motivo (obrigatório, fica no histórico)</label><textarea id="ldpMotivo" rows="2" maxlength="1000" placeholder="Ex.: proposta emitida e piso conferido; sessão confirmada no edital"></textarea></div></div><div id="ldpMsg" aria-live="assertive"></div>' +
        '<div class="lic-acoes-linha ldp-acoes"><button type="button" class="btn-primary" data-ldp-abrir>Abrir a disputa</button></div>';
    } else h += '<div class="lic-acoes-linha ldp-acoes"><button type="button" class="btn-primary" disabled aria-disabled="true">Abrir a disputa</button></div><p class="cm-ajuda-campo">O botão libera quando os pontos acima forem resolvidos.</p>';
    return h + "</div>";
  }
  function LicDp_itemHtml_(it, disp) {
    var aberta = disp.situacao === "ABERTA", pos = LICDP_POSICAO[it.posicao] || ["cinza", ""], sug = it.sugestao || {}, r = it.resultado, k = Lic_esc_(it.item);
    var cls = it.desistiu || r ? " fora" : it.posicao === "NA_FRENTE" ? " frente" : it.posicao === "ATRAS" || it.posicao === "EMPATE" ? " atras" : "";
    var h = '<article class="ldp-item' + cls + '" data-ldp-item="' + k + '"><div class="ldp-cab"><h3>Item ' + k + " · " + Lic_esc_(it.codigo) + (it.nome ? " · " + Lic_esc_(it.nome) : "") + "</h3>" +
      (it.desistiu ? LicDp_selo_("cinza", "Desistência") : LicDp_selo_(pos[0], pos[1])) + (r ? " " + LicDp_selo_(LICDP_COR_RES[r.situacao], r.situacaoNome) : "") + "</div>" +
      (it.descricao ? '<p class="cm-meta" style="margin:4px 0">' + Lic_esc_(it.descricao) + "</p>" : "") +
      '<div class="ldp-dl"><div><span>Quantidade</span><b>' + Lic_esc_(String(it.quantidade).replace(".", ",")) + "</b></div><div><span>Valor inicial (proposta)</span><b>" + Lic_esc_(Lic_brl_(it.valorInicial)) + "</b></div>" +
      "<div><span>Nosso lance atual</span><b>" + Lic_esc_(Lic_brl_(it.nossoAtual)) + (it.nossoInformado ? "" : " (proposta)") + "</b></div>" +
      "<div><span>Melhor lance do concorrente</span><b>" + (it.melhorConcorrente === null ? "não informado" : Lic_esc_(Lic_brl_(it.melhorConcorrente)) + (it.concorrente ? " · " + Lic_esc_(it.concorrente) : "")) + "</b></div>" +
      "<div><span>Sobra no nosso lance</span><b" + (it.sobra && it.sobra.pct < it.margemMinPct ? ' class="ldp-vermelho"' : "") + ">" + (it.sobra ? Lic_esc_(LicDp_pct_(it.sobra.pct) + " · " + Lic_brl_(it.sobra.sobra) + " por unidade") : "—") + "</b></div>" +
      "<div><span>Piso autorizado</span><b" + (it.pisoAssumido ? ' class="ldp-vermelho"' : "") + ">" + Lic_esc_(Lic_brl_(it.piso)) + (it.sobraPiso ? " · sobra " + Lic_esc_(LicDp_pct_(it.sobraPiso.pct)) : "") + "</b></div>" +
      "<div><span>Distância ao piso</span><b" + (it.distanciaPiso < 0 ? ' class="ldp-vermelho"' : "") + ">" + Lic_esc_(Lic_brl_(it.distanciaPiso)) + (it.distanciaPisoPct !== null ? " (" + Lic_esc_(LicDp_pct_(it.distanciaPisoPct)) + ")" : "") + "</b></div>" +
      "<div><span>Custo + impostos (sobra zero)</span><b>" + Lic_esc_(it.pisoCusto === null ? "—" : Lic_brl_(it.pisoCusto)) + "</b></div>" +
      "<div><span>Intervalo mínimo</span><b>" + Lic_esc_(it.intervaloTxt) + "</b></div></div>" +
      '<p class="cm-meta" style="margin:0">Piso: ' + Lic_esc_(it.pisoOrigem) + "</p>";
    (it.alertas || []).forEach(function (a) { h += Lic_faixa_(a.texto, a.tipo === "PREJUIZO" || a.tipo === "PROPOSTA_ABAIXO" ? "erro" : "aviso"); });
    if (it.desistiu) h += Lic_faixa_("A Diretoria desistiu deste item: " + it.desistenciaMotivo, "aviso");
    if (aberta && !it.desistiu) {
      h += '<div class="ldp-sug' + (sug.tipo === "NO_PISO" ? " piso" : "") + '" role="status"><b>Sugestão do SGO+:</b> ' + Lic_esc_(sug.texto || "") + (sug.tipo === "LANCE" ? ' <button type="button" class="btn-secondary" data-ldp-usar="' + k + '" data-valor="' + Lic_esc_(String(sug.valor).replace(".", ",")) + '">Usar a sugestão</button>' : "") + "</div>" +
        '<div class="ldp-lance"><div><label for="ldpNos_' + k + '">Nosso lance (o que você deu no portal)</label><input id="ldpNos_' + k + '" inputmode="decimal" autocomplete="off" data-ldp-nos="' + k + '" placeholder="Ex.: 185,40"><div class="ldp-previa" id="ldpPrev_' + k + '" aria-live="polite"></div></div>' +

      '<div><label for="ldpResVenc">Vencedor (quando não fomos nós)</label><input id="ldpResVenc" maxlength="200" value="' + Lic_esc_(r.situacao === "GANHO" ? "" : r.vencedor || "") + '"></div><div><label for="ldpResCnpj">CNPJ do vencedor</label><input id="ldpResCnpj" inputmode="numeric" maxlength="18" value="' + Lic_esc_(r.vencedorCnpj || "") + '"></div>' +
      '<div><label for="ldpResAdj">Adjudicação</label><input id="ldpResAdj" type="date" value="' + Lic_esc_(r.adjudicacao || "") + '"></div><div><label for="ldpResHom">Homologação</label><input id="ldpResHom" type="date" value="' + Lic_esc_(r.homologacao || "") + '"></div>' +
      '<div><label for="ldpResAta">Data da ata ou da intimação (recurso)</label><input id="ldpResAta" type="date" value="' + Lic_esc_(r.ata || "") + '"></div><div><label for="ldpResParte">Quem recorre (recurso)</label><select id="ldpResParte"><option value="">—</option><option value="NOS">Nós (razões de recurso)</option><option value="CONCORRENTE">O concorrente (nós: contrarrazões)</option><option value="AMBOS">Os dois</option></select></div>' +
      '<div class="ldp-largo"><label for="ldpResMot">Motivo (obrigatório na desclassificação)</label><textarea id="ldpResMot" rows="2" maxlength="1000">' + Lic_esc_(r.motivo || "") + '</textarea></div>' +
      '<div class="ldp-largo"><label for="ldpResFonte">Fonte (obrigatória)</label><input id="ldpResFonte" maxlength="300" value="' + Lic_esc_(r.fonte || "") + '" placeholder="Ex.: ata da sessão no Compras.gov.br"></div>' +
      '<div class="ldp-largo"><label for="ldpResObs">Observações</label><input id="ldpResObs" maxlength="500"></div></div>' +
      '<p class="cm-ajuda-campo">Recurso cria na agenda os prazos de razões e de contrarrazões como "pendente de confirmação": sem alerta até alguém conferir a data no portal ("Confirmar data", aba Prazos).</p><div id="ldpResMsg" aria-live="assertive"></div>';
    var ov = Lic_janela_("Resultado do item " + k, corpo, '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-ldp-ok>Gravar o resultado</button>', origem);
    ov.querySelector("[data-ldp-ok]").onclick = function () {
      var bt = this; bt.disabled = true;
      LicDp_chamar_("resultado", { id: id, item: k, situacao: LicDp_valor_("ldpResSit"), colocacao: LicDp_valor_("ldpResCol"), valorFinal: LicDp_valor_("ldpResValor"), vencedor: LicDp_valor_("ldpResVenc"), vencedorCnpj: LicDp_valor_("ldpResCnpj"),
        adjudicacao: LicDp_valor_("ldpResAdj"), homologacao: LicDp_valor_("ldpResHom"), ata: LicDp_valor_("ldpResAta"), recursoParte: LicDp_valor_("ldpResParte"), motivo: LicDp_valor_("ldpResMot"), fonte: LicDp_valor_("ldpResFonte"), obs: LicDp_valor_("ldpResObs") },
        function (x) { ov.fechar(); Lic_toast_(x.texto || "Resultado gravado."); LicDp_ligarAba_(null, null, id); }, function (m) { bt.disabled = false; Lic_$_("ldpResMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };
  }
  function LicDp_relatorio_(id, bt) {
    var abrir = typeof LicPp_abrirJanela_ === "function" ? LicPp_abrirJanela_ : function () { return null; };
    var j = abrir("Gerando o relatório da disputa…");
    bt.disabled = true;
    LicDp_chamar_("relatorio", { id: id }, function (r) { bt.disabled = false; if (typeof LicPp_escreverJanela_ === "function") LicPp_escreverJanela_(j, r.html); Lic_toast_(r.texto || "Relatório gerado."); },
      function (m) { bt.disabled = false; if (typeof LicPp_fecharJanela_ === "function") LicPp_fecharJanela_(j); Lic_toast_(m, "erro"); }, { carregando: "Gerando e guardando o relatório…" });
  }
</script>

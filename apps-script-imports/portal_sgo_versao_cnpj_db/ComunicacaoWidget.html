  function voltarDeTela() { var t = ST.voltarPara || "lista"; ST.voltarPara = "lista"; if (t === "conversa" && !ST.aberta) t = "lista"; ir(t); }
  function telaAjuda() {
    corpo.innerHTML = "<div class='comw-linha' style='margin-bottom:8px'><button type='button' class='comw-ico' data-acao='voltarPref' aria-label='Voltar'>←</button><b>Como usar esta tela</b></div><div class='comw-ajuda'>" +
      "<p>O balão de conversas é o bate-papo da equipe. Ele é o mesmo no SGO+ e no COMMAND: quem está num sistema conversa com quem está no outro.</p>" +
      "<h3>Conversar com uma pessoa</h3><ol><li>Toque em «+ Conversa».</li><li>Busque pelo nome ou pela área.</li><li>Toque na pessoa e escreva. Enter envia; Shift+Enter quebra a linha.</li></ol>" +
      "<h3>Criar um grupo</h3><ol><li>Toque em «+ Grupo» e dê um nome.</li><li>Busque pelo nome ou pela área, ou escolha a área no filtro e toque em «Marcar a área inteira».</li><li>Toque em «Revisar e criar», confira a lista «Você vai criar o grupo … com:» e toque em «Confirmar e criar».</li></ol>" +
      "<h3>Ver quem está na conversa</h3><p>Dentro do grupo, toque em «Participantes». Aparecem o nome, a área do cadastro e o sistema que cada pessoa usa (SGO+, COMMAND ou os dois). Só quem está na conversa vê essa lista.</p>" +
      "<h3>Adicionar, remover e mudar o nome</h3><p>Só quem criou o grupo e a gestão. Em «Participantes»: «+ Adicionar pessoas», «Remover» ao lado do nome, ou escreva o nome novo e toque em «Salvar nome». Cada mudança fica registrada na conversa (por exemplo, «Ana adicionou Bruno»).</p>" +
      "<h3>Sair do grupo</h3><p>Em «Participantes», toque em «Sair do grupo» e confirme. Você deixa de ver o grupo; as mensagens não são apagadas. Para voltar, peça a quem criou o grupo ou à gestão.</p>" +
      "<h3>Minha área</h3><p>Abre a conversa de todas as pessoas da sua área no cadastro do SGO+ (Administração › Usuários › Área). Quem muda de área entra e sai sozinho. Se o botão não aparece, sua área ainda não foi preenchida: peça à gestão.</p>" +
      "<h3>Chamar alguém num grupo (@)</h3><p>Escreva @ e o começo do nome e escolha a pessoa na lista. Só quem foi chamado assim pode receber aviso fora do sistema.</p>" +
      "<h3>Aviso no WhatsApp quando você está fora</h3><p>Mensagem direta para você, ou @ com o seu nome, vira aviso no WhatsApp do número da empresa quando você está fora do sistema há alguns minutos. Mensagem comum de grupo nunca vai. " +
      "Sai só em dia útil e no horário de trabalho; o que chegar à noite ou no fim de semana vai junto, num aviso só, no começo do expediente seguinte. Quem é PJ (ou sem vínculo no cadastro) recebe por e-mail. " +
      "Para não receber, abra «Preferências» (ícone de engrenagem) e desmarque o aviso.</p>" +
      "<h3>Responder pelo WhatsApp</h3><p>Responda o próprio aviso (segure a mensagem e toque em Responder): a resposta entra na mesma conversa, marcada «pelo WhatsApp». Mensagem nova, sem responder a um aviso, vai para a última conversa direta avisada nas últimas 24 horas; se não houver, vai para «Recebidas pelo WhatsApp», que a gestão lê e encaminha. Fotos e áudios chegam como aviso («Fulano enviou uma foto pelo WhatsApp»); o arquivo fica no celular de quem enviou.</p>" +
      "<h3>Cores e selos</h3><ul><li>Faixa verde à esquerda: conversa com mensagem que você não leu.</li><li>Selo SGO+, COMMAND ou WhatsApp: de onde a mensagem veio.</li><li>Linha tracejada no meio da conversa: mudança de participantes ou de nome.</li></ul>" +
      "<h3>Erros comuns</h3><ul><li>«Só quem criou o grupo e a gestão mudam os participantes»: peça a quem criou (aparece com o selo «criou o grupo» em Participantes).</li>" +
      "<li>«Sua área ainda não está no cadastro»: a gestão preenche em SGO+ › Administração › Usuários › Área.</li><li>Mensagem não enviou: o texto fica guardado na caixa; confira a internet e toque em Enviar de novo.</li></ul>" +
      "<h3>Quem pode o quê</h3><ul><li>Todos: conversar, criar grupo, ver participantes das próprias conversas, sair de grupo, ligar ou desligar o próprio aviso fora do sistema.</li>" +
      "<li>Quem criou o grupo e a gestão: adicionar, remover e mudar o nome do grupo.</li><li>Gestão: publicar comunicados e ler «Recebidas pelo WhatsApp».</li><li>Administração: ligar os avisos fora do sistema, ajustar minutos e limites e ver os últimos envios e respostas.</li></ul></div>";
  }

  /* ---- avisos e comunicados ---- */
  function marcarAba(a) {
    var lista = a === "avisos" ? ST.avisos : ST.comunicados, chave = a === "avisos" ? "AVISOS" : "COMUNICADOS";
    var novos = lista.filter(function (x) { return x.novo; });
    if (!novos.length) return;
    var ult = lista.reduce(function (m, x) { return x.criado_em > m ? x.criado_em : m; }, "");
    lista.forEach(function (x) { x.novo = false; });   // comunicado que exige ciência continua contando até o "Li e estou ciente"
    api("marcarLido", { conversa_id: chave, ate: ult }, function () { }, function () { });
    desenhar();
  }
  function telaAvisos() {
    var html = "<p class='comw-mut' style='margin:0 0 8px'>Avisos automáticos vindos do " + h(OUTRO) + " (os deste sistema continuam no sino).</p>";
    if (!ST.avisos.length) html += "<div class='comw-vazio'>Nenhum aviso do " + h(OUTRO) + ".</div>";
    html += ST.avisos.map(function (a) {
      return "<div class='comw-item comw-" + h(a.prioridade) + (a.novo ? " comw-novo" : "") + "' style='cursor:default'><div class='comw-linha'><div class='comw-cresce comw-tit'>" + h(a.titulo) + "</div>" + tagSis(a.origem_sistema) + "</div>" +
        "<div class='comw-txt'>" + h(a.texto) + "</div><div class='comw-mut'>" + h(quando(a.criado_em)) + "</div>" + linkRef(a) + "</div>";
    }).join("");
    corpo.innerHTML = html;
  }
  function telaComunicados() {
    var html = ST.d.eu.gestao ? "<div class='comw-acoes'><button type='button' class='comw-btn' data-acao='publicar'>+ Publicar comunicado</button></div>" : "";
    if (!ST.comunicados.length) html += "<div class='comw-vazio'>Nenhum comunicado.</div>";
    html += ST.comunicados.map(function (a) {
      var pend = a.exige_ciencia && !a.ciente;
      return "<div class='comw-item comw-" + h(a.prioridade) + (pend || a.novo ? " comw-novo" : "") + "' style='cursor:default'><div class='comw-linha'><div class='comw-cresce comw-tit'>" + h(a.titulo) + "</div>" + tagSis(a.origem_sistema) + "</div>" +
        "<div class='comw-txt'>" + h(a.texto) + "</div><div class='comw-mut'>" + h(a.criado_por) + " · " + h(quando(a.criado_em)) + (a.para && a.para !== "TODOS" ? " · " + h(paraTexto(a.para)) : "") + "</div>" +
        (a.exige_ciencia ? (a.ciente ? "<div class='comw-mut'><i class='fas fa-check' aria-hidden='true'></i> Você deu ciência.</div>" : "<div style='margin-top:6px'><button type='button' class='comw-btn comw-verde' data-ciente='" + h(a.aviso_id) + "'>Li e estou ciente</button></div>") : "") +
        linkRef(a) + "</div>";
    }).join("");
    corpo.innerHTML = html;
  }
  function paraTexto(p) {
    p = String(p || "");
    if (p.indexOf("AREA:") === 0) { var cod = p.slice(5), a = (ST.areas || []).filter(function (x) { return x.codigo === cod; })[0]; return "área " + (a ? a.nome : cod); }
    return p.replace("SETOR:", "setor ");
  }
  function telaPublicar() {
    var setores = (ST.areas || []).map(function (a) { return "<option value='AREA:" + h(a.codigo) + "'>Área " + h(a.nome) + "</option>"; }).join("");
    if (!ST.pessoas) carregarPessoas(function () { if (ST.tela === "publicar") desenhar(); });
    corpo.innerHTML = "<div class='comw-linha' style='margin-bottom:8px'><button type='button' class='comw-ico' data-acao='voltar' aria-label='Voltar'>←</button><b>Publicar comunicado</b></div>" +
      "<div class='comw-form'><label for='comw-ptit'>Título</label><input id='comw-ptit' maxlength='140'>" +
      "<label for='comw-ptxt'>Texto</label><textarea id='comw-ptxt' rows='6' maxlength='4000'></textarea>" +
      "<label for='comw-ppara'>Para</label><select id='comw-ppara'><option value='TODOS'>Todos (COMMAND e SGO+)</option>" + setores + "</select>" +
      "<label for='comw-ppri'>Prioridade</label><select id='comw-ppri'><option value='INFO'>Normal</option><option value='ALTA'>Alta</option><option value='CRITICA'>Crítica</option></select>" +
      "<label class='comw-chk'><input type='checkbox' id='comw-pcien'> Exigir \"Li e estou ciente\"</label>" +
      "<div style='margin-top:10px'><button type='button' class='comw-btn' data-acao='enviarComunicado'>Publicar</button></div></div>";
    var ta = document.getElementById("comw-ptxt"), k = "comw_rasc_" + (CFG.sistema || "") + "_comunicado";
    ta.value = lsGet(k) || "";
    ta.addEventListener("input", function () { if (ta.value.trim()) lsSet(k, ta.value); else lsDel(k); });
  }
  function publicar() {
    var d = { titulo: document.getElementById("comw-ptit").value, texto: document.getElementById("comw-ptxt").value, para: document.getElementById("comw-ppara").value,
      prioridade: document.getElementById("comw-ppri").value, exige_ciencia: document.getElementById("comw-pcien").checked };
    api("publicarComunicado", d, function (r) {
      lsDel("comw_rasc_" + (CFG.sistema || "") + "_comunicado");
      var a = r.aviso; a.novo = false;
      if (!ST.comunicados.some(function (x) { return x.aviso_id === a.aviso_id; })) ST.comunicados.unshift(a);
      ST.tela = "lista"; desenhar(); anunciar("Comunicado publicado.");
    }, toastErro);
  }
  function ciente(id) {
    api("ciente", { aviso_id: id }, function () { ST.comunicados.forEach(function (a) { if (a.aviso_id === id) { a.ciente = true; a.novo = false; } }); desenhar(); }, toastErro);
  }

  /* ---------------- montagem ---------------- */
  function montar() {
    raiz = el("div", "comw-raiz"); raiz.hidden = true;
    botao = el("button", "comw-botao", "<i class='fas fa-comments' aria-hidden='true'></i>"); botao.type = "button"; botao.setAttribute("aria-label", "Comunicação"); botao.setAttribute("aria-haspopup", "dialog"); botao.setAttribute("aria-expanded", "false");
    qt = el("span", "comw-qt"); qt.hidden = true; botao.appendChild(qt);
    painel = el("div", "comw-painel"); painel.hidden = true; painel.setAttribute("role", "dialog"); painel.setAttribute("aria-label", "Comunicação " + (NOME_SIS[CFG.sistema] || "") + " e " + OUTRO);
    painel.innerHTML = "<div class='comw-cab'><h2>Comunicação <small>" + h(NOME_SIS[CFG.sistema] || "") + " ↔ " + h(OUTRO) + "</small></h2>" +
      "<button type='button' class='comw-ico' data-acao='ajuda' aria-label='Como usar esta tela' title='Como usar esta tela'><i class='fas fa-circle-question' aria-hidden='true'></i></button>" +
      "<button type='button' class='comw-ico' data-acao='preferencias' aria-label='Preferências: som e aviso pelo WhatsApp' title='Preferências'><i class='fas fa-gear' aria-hidden='true'></i></button>" +
      "<button type='button' class='comw-ico comw-som' aria-label='Som'><i class='fas fa-bell' aria-hidden='true'></i></button><button type='button' class='comw-ico' data-acao='fechar' aria-label='Fechar a Comunicação (Esc)'>✕</button></div>" +
      "<div class='comw-abas' role='tablist'></div><div class='comw-corpo' tabindex='-1'></div><div class='comw-pe' hidden></div>";
    toasts = el("div", "comw-toasts");
    viva = el("div", "comw-sr"); viva.setAttribute("aria-live", "polite");
    raiz.appendChild(botao); raiz.appendChild(painel); raiz.appendChild(toasts); raiz.appendChild(viva);
    document.body.appendChild(raiz);
    corpo = painel.querySelector(".comw-corpo"); pe = painel.querySelector(".comw-pe"); abas = painel.querySelector(".comw-abas");
    botao.addEventListener("click", alternar);
    painel.querySelector(".comw-som").addEventListener("click", trocarSom);
    painel.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("[data-acao],[data-conv],[data-aba],[data-pessoa],[data-ciente],[data-local],[data-remover],[data-mencao]") : null;
      if (!t || !painel.contains(t)) return;
      if (t.getAttribute("data-mencao")) return escolherMencao(t.getAttribute("data-mencao"), t.getAttribute("data-nome"));
      if (t.getAttribute("data-remover")) {
        var nm = t.getAttribute("data-nome");
        if (!window.confirm("Remover " + nm + " do grupo? A pessoa deixa de ver o grupo; as mensagens não são apagadas.")) return;
        return editarGrupo({ remover: [t.getAttribute("data-remover")] }, nm + " foi removido do grupo.");
      }
      if (t.getAttribute("data-aba")) return irAba(t.getAttribute("data-aba"));
      if (t.getAttribute("data-conv")) return abrirConversa(t.getAttribute("data-conv"));
      if (t.getAttribute("data-pessoa")) return api("abrirDireta", { pessoa_id: t.getAttribute("data-pessoa") }, function (r) { comRascunho(r.conversa); entrouConversa(r.conversa); }, toastErro);
      if (t.getAttribute("data-ciente")) return ciente(t.getAttribute("data-ciente"));
      if (t.getAttribute("data-local")) { try { CFG.abrirLocal(t.getAttribute("data-local"), t.getAttribute("data-id")); } catch (x) { } return; }
      var a = t.getAttribute("data-acao");
      if (a === "fechar") { fechar(); botao.focus(); }
      else if (a === "voltar") { ST.aberta = null; ST.rascNova = ""; ST.filtroNova = null; ir("lista"); }
      else if (a === "todosNova") { ST.filtroNova = null; ir("nova"); }
      else if (a === "nova") ir("nova");
      else if (a === "grupo") { ST.sel = {}; ST.grupoTit = ""; carregarPessoas(function () { ir("grupo"); }, true); }
      else if (a === "setor") api("criarGrupo", { tipo: "SETOR", area: ST.d.eu.area }, function (r) { entrouConversa(r.conversa); }, toastErro);
      else if (a === "revisarGrupo") revisarGrupo();
      else if (a === "voltarGrupo") ir("grupo");
      else if (a === "criarGrupo") criarGrupo();
      else if (a === "enviar") enviar();
      else if (a === "anteriores") anteriores();
      else if (a === "participantes") abrirParticipantes();
      else if (a === "voltarConversa") { ST.part = null; ir("conversa"); if (ST.aberta) lerConversa(ST.aberta); }
      else if (a === "renomear") { var nt = document.getElementById("comw-ptitulo"); if (nt) editarGrupo({ titulo: nt.value }, "Nome do grupo salvo."); }
      else if (a === "adicionar") { ST.sel = {}; carregarPessoas(function () { ir("adicionar"); }, true); }
      else if (a === "voltarPart") { ST.sel = {}; ir("participantes"); }
      else if (a === "conferirAdicionar") conferirAdicionar();
      else if (a === "confirmarAdicionar") editarGrupo({ adicionar: Object.keys(ST.sel) }, "Pessoas adicionadas ao grupo.");
      else if (a === "sair") {
        if (!window.confirm("Sair do grupo? Você deixa de ver este grupo. As mensagens não são apagadas; para voltar, peça a quem criou o grupo ou à gestão.")) return;
        var cid = ST.aberta;
        api("sairGrupo", { conversa_id: cid }, function () {
          delete ST.conv[cid]; delete ST.msgs[cid]; ST.ordem = ST.ordem.filter(function (x) { return x !== cid; });
          ST.aberta = null; ST.part = null; ir("lista"); toast({ titulo: "Você saiu do grupo", texto: "As mensagens continuam guardadas. Para voltar, peça a quem criou o grupo ou à gestão.", prioridade: "INFO" });
        }, toastErro);
      }
      else if (a === "preferencias") abrirPreferencias();
      else if (a === "ajuda") abrirAjuda();
      else if (a === "voltarPref") voltarDeTela();
      else if (a === "som") { trocarSom(); if (ST.tela === "preferencias") desenhar(); }
      else if (a === "salvarPref") salvarPref();
      else if (a === "salvarCfgWa") salvarCfgWa();
      else if (a === "trilha") api("trilhaWhatsapp", { limite: 60 }, function (r) { ST.trilha = r.trilha; desenhar(); }, toastErro);
      else if (a === "publicar") { carregarPessoas(function () { ir("publicar"); }); }
      else if (a === "enviarComunicado") publicar();
    });
    document.addEventListener("keydown", function (e) { if ((e.key === "Escape" || e.key === "Esc") && ST.aberto) { fechar(); botao.focus(); } });
    document.addEventListener("visibilitychange", function () {
      atualizarTitulo(contagens().total);
      if (!document.hidden && ST.d && !ST.parado) { agendar(800); if (ST.aberto && ST.aberta && ST.tela === "conversa") lerConversa(ST.aberta); }
    });
    vigiarToken();
    setInterval(vigiarToken, 3000);
  }
  if (document.body) montar(); else document.addEventListener("DOMContentLoaded", montar);
  window.ComunicacaoWidget = { abrir: function () { abrir(); }, atualizar: function () { if (ST.d) novidades(); else iniciar(); },
    conversarCom: function (nomes, texto) { conversarCom(nomes, texto); } };
})();
</script>

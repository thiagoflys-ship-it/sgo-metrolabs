<script>
/* Extensão adicional do CertCal, carregada junto ao script existente. */
/* PADRÕES DE REFERÊNCIA 17/10 — página redesenhada: resumo em números que filtra, faixa curta de
   vencidos, barra de busca/filtros, lista agrupada por TAG base (canais e grandezas do mesmo
   equipamento), ações "Editar" + menu "Mais", painel lateral de detalhe e cartões no celular.
   Regras de negócio e dados gravados não mudaram: as chamadas e os campos enviados são os mesmos.
   Componentes reaproveitáveis (classes): bc-resumo/bc-resumo-item, bc-faixa, bc-ferramentas,
   bc-mais-menu, bc-painel, bc-selo, bc-lote, bc-cartao, bc-tabela, bc-vazio. */
var PD = {items:[],selected:{},current:null,token:'',documento:null,busy:false,fotos:{}};
var PDR = {filtro:'ATIVOS',busca:'',local:'',grandeza:'',ordem:'SITUACAO',agrupar:true,abertos:{},lista:[],painel:null,menu:null,historico:{}};
var PD_FIELDS = [['LOCALIZACAO','Localização (texto livre)'],['MARCA','Marca'],['MODELO','Modelo'],['SERIE','Número de série'],['FAIXA','Faixa de medição'],['GRANDEZA','Grandeza'],['UNIDADE','Unidade de medida'],['RESOLUCAO','Resolução'],['LABORATORIO','Laboratório que calibrou'],['DATA_CALIBRACAO','Data da calibração (dd/mm/aaaa)'],['CERTIFICADO_NUMERO','Número do certificado'],['VALIDADE','Vencimento cadastrado (dd/mm/aaaa)'],['PONTOS','Todos os pontos e canais calibrados'],['RESULTADOS_CERTIFICADO','Resultados, incertezas e fatores por ponto (conforme certificado)'],['METODO','Método / procedimento'],['RASTREABILIDADE','Rastreabilidade declarada'],['OBSERVACOES_TECNICAS','Observações técnicas, acessórios e condições']];
function pdEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pdEl(id){return document.getElementById('pd-'+id);}
function pdSituacao(v){return {OK:'Vigente',VENCENDO:'Vence em até 30 dias',VENCIDO:'Vencido',SEM_VALIDADE:'Sem validade informada',VALIDADE_INVALIDA:'Data inválida'}[v]||v||'Não informado';}
function pdRotuloDoc(v){return {INVENTARIO:'Inventário',ORCAMENTO:'Orçamento',EMITIDO:'Emitido',RASCUNHO:'Rascunho'}[String(v||'').toUpperCase()]||v||'';}
function pdMsg(text,error){['status','status-docs'].forEach(function(k){var el=pdEl(k);if(el){el.textContent=text||'';el.className='bc-status'+(error?' bc-status-erro':'');}});}
function pdApi(fn,data){return tplCertCal_chamarApi(fn,data).then(function(r){if(!r||r.ok===false)throw new Error(r&&r.message||'Não foi possível concluir.');return r;});}
async function pdRun(text,fn){
  if(PD.busy){pdMsg('Aguarde a operação em andamento terminar.');return;}PD.busy=true;pdMsg(text);
  var panel=pdEl('panel');if(panel)panel.setAttribute('aria-busy','true');
  try{return await fn();}catch(e){pdMsg(e&&e.message||String(e),true);pdrPainelMsg_(e&&e.message||String(e),true);}finally{PD.busy=false;if(panel)panel.setAttribute('aria-busy','false');}
}

/* ---------- perfil ---------- */
function pdrPerfil_(){try{return String((typeof USER_CONTEXT!=='undefined'&&USER_CONTEXT&&USER_CONTEXT.perfil)||'').toUpperCase();}catch(e){return '';}}
function pdrPodeEditar_(){var p=pdrPerfil_();return p!=='COMERCIAL'&&p!=='FINANCEIRO'&&p!=='CLIENTE';}

/* ---------- dados da lista ---------- */
var PDR_SEVERIDADE={VENCIDO:0,VALIDADE_INVALIDA:0,SEM_VALIDADE:1,VENCENDO:2,OK:3};
var PDR_SELO={OK:['ok','Vigente'],VENCENDO:['aviso','Vence em 30 dias'],VENCIDO:['erro','Vencido'],VALIDADE_INVALIDA:['erro','Data inválida'],SEM_VALIDADE:['aviso','Sem validade'],INATIVO:['neutro','Inativo']};
function pdrNum_(v){if(v===null||v===undefined||String(v).trim()==='')return '—';var n=Number(String(v).replace(',','.'));if(!isFinite(n))return pdEsc(v);return n.toLocaleString('pt-BR',{maximumFractionDigits:6});}
function pdrVeff_(v){var n=Number(String(v==null?'':v).replace(',','.'));if(String(v==null?'':v).trim()===''||!isFinite(n))return '—';return n===0?'∞':n.toLocaleString('pt-BR',{maximumFractionDigits:2});}
function pdrDataNum_(br){var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(br||''));return m?Number(m[3]+m[2]+m[1]):99999999;}
function pdrBase_(tag){var t=String(tag||'').trim();var b=t.replace(/\s*\([^()]*\)\s*$/,'');return b||t;}
function pdrSufixo_(tag){var m=/\(([^()]*)\)\s*$/.exec(String(tag||''));return m?m[1]:'';}
function pdrMontarLista_(){
  var cad={};(certcalState.padroesTodos||[]).forEach(function(c){cad[c.ID]=c;});
  PDR.lista=PD.items.map(function(p){var c=cad[p.ID]||{};var ativo=(c.STATUS||p.STATUS)==='ATIVO';
    var st=c.statusValidade||p.situacao||'SEM_VALIDADE';
    return {ID:p.ID,TAG:p.TAG||c.TAG||'',DESCRICAO:p.DESCRICAO||c.DESCRICAO||'',ativo:ativo,st:st,sev:ativo?(PDR_SEVERIDADE[st]!=null?PDR_SEVERIDADE[st]:1):4,
      rotulo:c.statusValidadeLabel||pdSituacao(st),dias:c.diasRestantesValidade,VALIDADE:c.VALIDADE||p.VALIDADE||'',
      link:c.LINK_CERTIFICADO_PDF||p.LINK_CERTIFICADO_PDF||'',CERT:c.CERTIFICADO_NUMERO||p.CERTIFICADO_NUMERO||'',
      U95:c.INCERTEZA_U95,K:c.FATOR_K,VEFF:c.VEFF,MARCA:p.MARCA||'',MODELO:p.MODELO||'',SERIE:p.SERIE||'',LOCAL:String(p.LOCALIZACAO||'').trim(),
      GRANDEZA:String(p.GRANDEZA||'').trim(),UNIDADE:p.UNIDADE||'',FOTO_ID:p.FOTO_ID||'',conferido:!!p.conferido,extraido:!!p.extraido,base:pdrBase_(p.TAG||c.TAG),suf:pdrSufixo_(p.TAG||c.TAG),item:p,cad:c};});
  var cont={};PDR.lista.forEach(function(x){cont[x.base]=(cont[x.base]||0)+1;});
  PDR.lista.forEach(function(x){x.emGrupo=cont[x.base]>1;});
}
function pdrContagens_(){
  var r={ATIVOS:0,VENCIDO:0,VENCENDO:0,OK:0,SEM_VALIDADE:0,SEM_PDF:0,INATIVO:0,TODOS:PDR.lista.length};
  PDR.lista.forEach(function(x){if(!x.ativo){r.INATIVO++;return;}r.ATIVOS++;if(x.st==='VENCIDO'||x.st==='VALIDADE_INVALIDA')r.VENCIDO++;else if(r[x.st]!=null)r[x.st]++;if(!x.link)r.SEM_PDF++;});
  return r;
}
function pdrPassaFiltro_(x){
  var f=PDR.filtro;
  if(f==='INATIVO'){if(x.ativo)return false;}
  else if(f!=='TODOS'){if(!x.ativo)return false;
    if(f==='VENCIDO'&&!(x.st==='VENCIDO'||x.st==='VALIDADE_INVALIDA'))return false;
    if((f==='VENCENDO'||f==='OK'||f==='SEM_VALIDADE')&&x.st!==f)return false;
    if(f==='SEM_PDF'&&x.link)return false;}
  if(PDR.local){if(PDR.local==='__SEM__'?x.LOCAL:x.LOCAL!==PDR.local)return false;}
  if(PDR.grandeza){if(PDR.grandeza==='__SEM__'?x.GRANDEZA:x.GRANDEZA!==PDR.grandeza)return false;}
  var q=PDR.busca.trim().toLocaleLowerCase('pt-BR');
  if(q&&[x.TAG,x.DESCRICAO,x.SERIE,x.MARCA,x.MODELO,x.CERT].join(' ').toLocaleLowerCase('pt-BR').indexOf(q)<0)return false;
  return true;
}
function pdFiltered(){return PDR.lista.filter(pdrPassaFiltro_).map(function(x){return x.item;});}
function pdrComparar_(a,b){
  if(PDR.ordem==='TAG')return a.chave.localeCompare(b.chave,'pt-BR',{numeric:true});
  if(PDR.ordem==='VALIDADE')return (a.dataMin-b.dataMin)||a.chave.localeCompare(b.chave,'pt-BR',{numeric:true});
  if(PDR.ordem==='LOCAL')return String(a.local||'~').localeCompare(String(b.local||'~'),'pt-BR')||a.chave.localeCompare(b.chave,'pt-BR',{numeric:true});
  return (a.sev-b.sev)||(a.dataMin-b.dataMin)||a.chave.localeCompare(b.chave,'pt-BR',{numeric:true});
}
function pdrPrefixoComum_(arr){if(!arr.length)return '';var p=arr[0];arr.forEach(function(s){while(p&&String(s).indexOf(p)!==0)p=p.slice(0,-1);});p=p.replace(/[\s\-–—(:,;.]+$/,'').replace(/\s*[-–—]\s*(canal|ch|grandeza)?\s*$/i,'').trim();return p.length>=4?p:arr[0];}
function pdrLinhas_(){
  var vis=PDR.lista.filter(pdrPassaFiltro_),ordem=[],grupos={};
  vis.forEach(function(x){var k=PDR.agrupar&&x.emGrupo?'G:'+x.base:'P:'+x.ID;if(!grupos[k]){grupos[k]={k:k,grupo:k.charAt(0)==='G',chave:PDR.agrupar&&x.emGrupo?x.base:x.TAG,itens:[]};ordem.push(grupos[k]);}grupos[k].itens.push(x);});
  ordem.forEach(function(g){g.itens.sort(function(a,b){return a.TAG.localeCompare(b.TAG,'pt-BR',{numeric:true});});
    g.sev=Math.min.apply(null,g.itens.map(function(x){return x.sev;}));g.dataMin=Math.min.apply(null,g.itens.map(function(x){return pdrDataNum_(x.VALIDADE);}));
    var locs=g.itens.map(function(x){return x.LOCAL;}).filter(function(v,i,a){return a.indexOf(v)===i;});g.local=locs.length===1?locs[0]:(locs.length?'Vários locais':'');
    if(g.grupo){var total=PDR.lista.filter(function(x){return x.base===g.chave;}).length;g.total=total;}});
  ordem.sort(pdrComparar_);return {grupos:ordem,total:vis.length};
}

/* ---------- peças visuais ---------- */
function pdrSelo_(x){var k=x.ativo?x.st:'INATIVO';var s=PDR_SELO[k]||PDR_SELO.SEM_VALIDADE;var texto=s[1];if(x.ativo&&x.st==='VENCENDO'&&x.dias!=null)texto='Vence em '+x.dias+(x.dias===1?' dia':' dias');return '<span class="bc-selo bc-selo-'+s[0]+'" title="'+pdEsc(x.ativo?x.rotulo:'Inativo: fora da escolha dos ensaios')+'">'+pdEsc(texto)+'</span>';}
function pdrEquip_(x){var mm=[x.MARCA,x.MODELO].filter(Boolean).join(' ');if(!mm&&!x.SERIE)return '<span class="pdr-mudo">Não informado</span>';return '<span class="pdr-eq1">'+pdEsc(mm||'—')+'</span>'+(x.SERIE?'<span class="pdr-eq2">Série '+pdEsc(x.SERIE)+'</span>':'');}
function pdrPdf_(x){return x.link?'<a class="pdr-pdf" href="'+pdEsc(x.link)+'" target="_blank" rel="noopener" title="Abrir o certificado '+pdEsc(x.CERT||'')+' em outra aba"><i class="fas fa-file-pdf" aria-hidden="true"></i> PDF</a>':'<span class="pdr-mudo">Sem PDF</span>';}
function pdrAcoes_(x){var pode=pdrPodeEditar_();return '<div class="pdr-acoes">'+(pode?'<button type="button" class="pdr-btn" data-pdr="editar" data-id="'+pdEsc(x.ID)+'">Editar</button>':'<button type="button" class="pdr-btn" data-pdr="detalhe" data-id="'+pdEsc(x.ID)+'">Detalhes</button>')+'<button type="button" class="pdr-btn pdr-btn-icone" data-pdr="mais" data-id="'+pdEsc(x.ID)+'" aria-haspopup="menu" aria-label="Mais ações de '+pdEsc(x.TAG)+'" title="Mais ações"><i class="fas fa-ellipsis" aria-hidden="true"></i></button></div>';}
function pdrCheck_(ids,rotulo){var n=ids.filter(function(id){return PD.selected[id];}).length;return '<label class="pdr-check"><input type="checkbox" data-pdr-sel="'+pdEsc(ids.join(','))+'"'+(n&&n===ids.length?' checked':'')+(n&&n<ids.length?' data-indet="1"':'')+' aria-label="Selecionar '+pdEsc(rotulo)+'"></label>';}
function pdrValidadeGrupo_(g){
  var datas=g.itens.map(function(x){return x.VALIDADE||'';}).filter(function(v,i,a){return a.indexOf(v)===i;});
  var pior=g.itens.slice().sort(function(a,b){return a.sev-b.sev;})[0];
  if(datas.length===1)return '<span class="pdr-data">'+pdEsc(datas[0]||'—')+'</span>'+pdrSelo_(pior);
  var ord=datas.slice().sort(function(a,b){return pdrDataNum_(a)-pdrDataNum_(b);});
  return '<span class="pdr-data">'+pdEsc(ord[0]||'—')+' a '+pdEsc(ord[ord.length-1]||'—')+'</span><span class="bc-selo bc-selo-aviso" title="Os canais têm validades diferentes. Confira cada canal.">Validade divergente</span>'+(pior.sev<3?pdrSelo_(pior):'');
}
function pdrValidadeDivergente_(g,x){var cont={};g.itens.forEach(function(i){cont[i.VALIDADE]=(cont[i.VALIDADE]||0)+1;});var maior=Object.keys(cont).sort(function(a,b){return cont[b]-cont[a];})[0];return Object.keys(cont).length>1&&x.VALIDADE!==maior;}
function pdrRotuloGrupo_(g){var canais=g.itens.every(function(x){return /^(canal|ch|c)\s*\d+/i.test(x.suf);});var n=g.total||g.itens.length;var vis=g.itens.length;var nome=canais?(n===1?'canal':'canais'):(n===1?'grandeza':'grandezas');return (vis<n?vis+' de '+n:n)+' '+nome;}

function pdrLinhaTabela_(x,filho,g){
  var div=filho&&g&&pdrValidadeDivergente_(g,x);
  return '<tr class="'+(filho?'pdr-filho':'pdr-linha')+(x.ativo?'':' pdr-inativo')+'" data-id="'+pdEsc(x.ID)+'">'+
    '<td class="pdr-c-sel">'+pdrCheck_([x.ID],x.TAG)+'</td>'+
    '<td class="pdr-c-tag"><button type="button" class="pdr-tag" data-pdr="detalhe" data-id="'+pdEsc(x.ID)+'">'+(filho?'<span class="pdr-suf">'+pdEsc(x.suf||x.TAG)+'</span>':pdEsc(x.TAG))+'</button><div class="pdr-desc">'+pdEsc(x.DESCRICAO)+'</div></td>'+
    '<td class="pdr-c-eq">'+(filho?'<span class="pdr-u">U95 '+pdrNum_(x.U95)+(x.UNIDADE?' '+pdEsc(x.UNIDADE):'')+'</span><span class="pdr-u pdr-eq2">k '+pdrNum_(x.K)+' · νeff '+pdrVeff_(x.VEFF)+'</span>':pdrEquip_(x))+'</td>'+
    '<td class="pdr-c-local">'+(x.LOCAL?pdEsc(x.LOCAL):'<span class="pdr-mudo">Sem localização</span>')+'</td>'+
    '<td class="pdr-c-val'+(div?' pdr-divergente':'')+'"><span class="pdr-data">'+pdEsc(x.VALIDADE||'—')+'</span>'+pdrSelo_(x)+(div?'<span class="pdr-div-nota">diferente dos outros canais</span>':'')+'</td>'+
    '<td class="pdr-c-pdf">'+pdrPdf_(x)+'</td>'+
    '<td class="pdr-c-acoes">'+pdrAcoes_(x)+'</td></tr>';
}
function pdrLinhaGrupo_(g){
  var x0=g.itens[0],aberto=!!PDR.abertos[g.chave]||PDR.busca.trim().length>1,ids=g.itens.map(function(x){return x.ID;});
  var comPdf=g.itens.filter(function(x){return x.link;}).length,certs=g.itens.map(function(x){return x.CERT;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;});
  var pdf=comPdf===g.itens.length?'<span class="pdr-pdf-n"><i class="fas fa-file-pdf" aria-hidden="true"></i> '+(certs.length===1?pdEsc(certs[0]):comPdf+' PDFs')+'</span>':(comPdf?'<span class="bc-selo bc-selo-aviso">'+(g.itens.length-comPdf)+' sem PDF</span>':'<span class="pdr-mudo">Sem PDF</span>');
  var desc=pdrPrefixoComum_(g.itens.map(function(x){return x.DESCRICAO;}));
  var h='<tr class="pdr-grupo'+(aberto?' pdr-aberto':'')+'" data-grupo="'+pdEsc(g.chave)+'">'+
    '<td class="pdr-c-sel">'+pdrCheck_(ids,g.chave)+'</td>'+
    '<td class="pdr-c-tag"><div class="pdr-tag-linha"><button type="button" class="pdr-expandir" data-pdr="expandir" data-grupo="'+pdEsc(g.chave)+'" aria-expanded="'+aberto+'" aria-label="'+(aberto?'Recolher':'Mostrar')+' os canais de '+pdEsc(g.chave)+'"><i class="fas fa-chevron-right" aria-hidden="true"></i></button><div class="pdr-tag-bloco"><button type="button" class="pdr-tag" data-pdr="grupo" data-grupo="'+pdEsc(g.chave)+'">'+pdEsc(g.chave)+'</button><span class="pdr-chip">'+pdEsc(pdrRotuloGrupo_(g))+'</span><div class="pdr-desc">'+pdEsc(desc)+'</div></div></div></td>'+
    '<td class="pdr-c-eq">'+pdrEquip_(x0)+'</td>'+
    '<td class="pdr-c-local">'+(g.local?pdEsc(g.local):'<span class="pdr-mudo">Sem localização</span>')+'</td>'+
    '<td class="pdr-c-val">'+pdrValidadeGrupo_(g)+'</td>'+
    '<td class="pdr-c-pdf">'+pdf+'</td>'+
    '<td class="pdr-c-acoes"><div class="pdr-acoes"><button type="button" class="pdr-btn" data-pdr="grupo" data-grupo="'+pdEsc(g.chave)+'">Detalhes</button><button type="button" class="pdr-btn pdr-btn-icone" data-pdr="expandir" data-grupo="'+pdEsc(g.chave)+'" aria-label="'+(aberto?'Recolher':'Mostrar')+' canais" title="'+(aberto?'Recolher':'Mostrar')+' canais"><i class="fas fa-'+(aberto?'chevron-up':'chevron-down')+'" aria-hidden="true"></i></button></div></td></tr>';
  if(aberto)h+=g.itens.map(function(x){return pdrLinhaTabela_(x,true,g);}).join('');
  return h;
}
function pdrCartao_(x,filho,g){
  var div=filho&&g&&pdrValidadeDivergente_(g,x);
  return '<div class="pdr-cartao'+(filho?' pdr-cartao-filho':'')+(x.ativo?'':' pdr-inativo')+'">'+
    '<div class="pdr-cartao-topo">'+pdrCheck_([x.ID],x.TAG)+'<button type="button" class="pdr-tag" data-pdr="detalhe" data-id="'+pdEsc(x.ID)+'">'+pdEsc(x.TAG)+'</button>'+pdrSelo_(x)+'</div>'+
    '<div class="pdr-desc">'+pdEsc(x.DESCRICAO)+'</div>'+
    '<div class="pdr-cartao-meta"><span'+(div?' class="pdr-divergente"':'')+'>Validade '+pdEsc(x.VALIDADE||'—')+(div?' (diferente dos outros canais)':'')+'</span>'+(filho?'<span>U95 '+pdrNum_(x.U95)+' · k '+pdrNum_(x.K)+'</span>':'<span>'+(x.LOCAL?pdEsc(x.LOCAL):'Sem localização')+'</span>')+'<span>'+pdrPdf_(x)+'</span></div>'+
    pdrAcoes_(x)+'</div>';
}
function pdrCartaoGrupo_(g){
  var aberto=!!PDR.abertos[g.chave]||PDR.busca.trim().length>1,ids=g.itens.map(function(x){return x.ID;});
  var x0=g.itens[0],pior=g.itens.slice().sort(function(a,b){return a.sev-b.sev;})[0];
  var datas=g.itens.map(function(x){return x.VALIDADE;}).filter(function(v,i,a){return a.indexOf(v)===i;});
  return '<div class="pdr-cartao pdr-cartao-grupo">'+
    '<div class="pdr-cartao-topo">'+pdrCheck_(ids,g.chave)+'<button type="button" class="pdr-tag" data-pdr="grupo" data-grupo="'+pdEsc(g.chave)+'">'+pdEsc(g.chave)+'</button>'+pdrSelo_(pior)+'</div>'+
    '<div class="pdr-desc">'+pdEsc(pdrPrefixoComum_(g.itens.map(function(x){return x.DESCRICAO;})))+'</div>'+
    '<div class="pdr-cartao-meta"><span class="pdr-chip">'+pdEsc(pdrRotuloGrupo_(g))+'</span>'+(datas.length>1?'<span class="bc-selo bc-selo-aviso">Validade divergente</span>':'<span>Validade '+pdEsc(datas[0]||'—')+'</span>')+'<span>'+(g.local?pdEsc(g.local):'Sem localização')+'</span></div>'+
    '<div class="pdr-acoes"><button type="button" class="pdr-btn" data-pdr="expandir" data-grupo="'+pdEsc(g.chave)+'" aria-expanded="'+aberto+'">'+(aberto?'Recolher canais':'Ver canais')+'</button><button type="button" class="pdr-btn" data-pdr="grupo" data-grupo="'+pdEsc(g.chave)+'">Detalhes</button></div>'+
    (aberto?'<div class="pdr-cartao-filhos">'+g.itens.map(function(x){return pdrCartao_(x,true,g);}).join('')+'</div>':'')+'</div>';
}
function pdrCelular_(){var r=document.getElementById('pdr');return !!(r&&r.clientWidth&&r.clientWidth<760);}

/* ---------- montagem ---------- */
function pdMount(){
  if(pdEl('panel'))return;
  var base=document.getElementById('certcal-panel-padroes');if(!base)return;
  pdrEstilos_();
  var pode=pdrPodeEditar_();
  var panel=document.createElement('section');panel.id='pd-panel';
  panel.innerHTML='<div id="pdr" class="pdr">'+
    '<div class="bc-resumo" id="pdr-resumo" role="group" aria-label="Resumo dos padrões: clique para filtrar"></div>'+
    '<div id="pdr-faixa"></div>'+
    '<div class="bc-ferramentas">'+
      '<div class="bc-busca"><i class="fas fa-magnifying-glass" aria-hidden="true"></i><input id="pdr-busca" type="search" placeholder="Buscar TAG, descrição, série ou marca" aria-label="Buscar TAG, descrição, série ou marca" autocomplete="off"></div>'+
      '<button type="button" class="pdr-btn bc-ferr-filtros" data-pdr="filtros" aria-expanded="false" aria-controls="pdr-filtros"><i class="fas fa-sliders" aria-hidden="true"></i> Filtros</button>'+
      '<div class="bc-ferr-campos" id="pdr-filtros">'+
        '<label class="bc-campo"><span>Situação</span><select id="pdr-situacao"><option value="ATIVOS">Ativos</option><option value="VENCIDO">Vencidos</option><option value="VENCENDO">Vencem em 30 dias</option><option value="OK">Vigentes</option><option value="SEM_VALIDADE">Sem validade</option><option value="SEM_PDF">Sem PDF</option><option value="INATIVO">Inativos</option><option value="TODOS">Todos</option></select></label>'+
        '<label class="bc-campo"><span>Local</span><select id="pdr-local"></select></label>'+
        '<label class="bc-campo"><span>Grandeza</span><select id="pdr-grandeza"></select></label>'+

function pdReadPhoto(file){return new Promise(function(resolve,reject){
  if(!file)return resolve(null);if(!/^image\/(jpeg|png)$/.test(file.type)||file.size>12*1024*1024)return reject(new Error('Escolha JPG ou PNG de até 12 MB.'));
  var reader=new FileReader();reader.onerror=function(){reject(new Error('Não foi possível ler a foto.'));};reader.onload=function(){var image=new Image();image.onerror=function(){reject(new Error('Imagem inválida.'));};image.onload=function(){var scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve({base64:canvas.toDataURL('image/jpeg',0.82).split(',')[1],mimeType:'image/jpeg'});};image.src=reader.result;};reader.readAsDataURL(file);
});}

function pdGenerate(tipo){

    var payload={tipo:tipo,ids:ids,destinatario:pdEl('destinatario').value,orientacoes:pdEl('orientacoes').value,localizacao:'Conforme localização de cada padrão'};
    if(tipo==='ORCAMENTO')payload.servicos=pdEl('servicos').value;

      if (PT_AVISOS.recarregar) { var alvo = PT_AVISOS.recarregar; delete PT_AVISOS.recarregar; Ponto_abaPessoas_(alvo); Pto_msg_("ptMsg", m + " Suas alterações continuam no editor.", "erro"); return; }
      if (!Pto_$_("ptAvisoEditor")) return; Pto_$_("ptAvisoCampos").disabled = false;
      ["ptAvisoVoltar","ptAvisoJornada"].forEach(function (id) { Pto_$_(id).disabled = false; });
      Ponto_avisosAtualizarEstado_(); Pto_msg_("ptAvisosMsg", m + " Suas alterações continuam aqui.", "erro");
    });
  }
  function Ponto_dispensasHtml_(r) {
    var h = "";
    h += '<div class="pt-caixa"><p class="pt-mini">Férias e afastamentos lançados no Programa de conduta já valem sozinhos. Aqui o RH lança folga, atestado, consulta ou viagem sem marcação de ponto. Nada é apagado: "Retirar" só marca a dispensa como retirada.</p>' +
        '<div class="pt-grade3"><div class="pt-campo"><label for="ptDsPessoa">Colaborador</label><select id="ptDsPessoa">' + Pto_opcoes_(r.pessoas.map(function (p) { return [p.id, p.nome]; }), "", "Escolha") + "</select></div>" +
        '<div class="pt-campo"><label for="ptDsDe">De</label><input type="date" id="ptDsDe"></div><div class="pt-campo"><label for="ptDsAte">Até</label><input type="date" id="ptDsAte"></div></div>' +
        '<div class="pt-grade2"><div class="pt-campo"><label for="ptDsMot">Motivo</label><select id="ptDsMot">' + Pto_opcoes_(Object.keys(r.motivosDispensa).map(function (k) { return [k, r.motivosDispensa[k]]; }), "FOLGA") + '</select></div><div class="pt-campo"><label for="ptDsObs">Observação (opcional)</label><input id="ptDsObs" maxlength="200"></div></div>' +
        '<div id="ptDsMsg"></div><div class="pt-acoes"><button type="button" class="btn-primary" id="ptDsSalvar">Lançar dispensa</button></div>' +
        (r.dispensas.length ? '<table class="pt-tabela" style="margin-top:10px"><thead><tr><th>Colaborador</th><th>Período</th><th>Motivo</th><th></th></tr></thead><tbody>' + r.dispensas.map(function (x) {
          return '<tr><td data-r="Colaborador">' + Pto_esc_(x.pessoa) + '</td><td data-r="Período">' + Pto_esc_(x.deBr + (x.ateBr !== x.deBr ? " a " + x.ateBr : "")) + '</td><td data-r="Motivo">' + Pto_esc_(x.motivo) + (x.observacao ? '<div class="pt-mini">' + Pto_esc_(x.observacao) + "</div>" : "") + '</td><td><button type="button" class="btn-secondary" onclick="Ponto_removerDispensa_(\'' + Pto_esc_(x.id) + '\')">Retirar</button></td></tr>';
        }).join("") + "</tbody></table>" : "") + "</div>";
    return h;
  }
  function Ponto_removerDispensa_(id) { if (PT_AVISOS.enviando) return; if (!confirm("Retirar esta dispensa? Os lembretes voltam para esses dias.")) return; Pto_chamar_("removerDispensa", { id: id }, function (r) { Pto_msg_("ptMsg", r.message, "ok"); Ponto_desenharAba_(); }); }
  function Ponto_editarPessoa_(k) {
    if (PT_AVISOS.enviando) return;
    var p = PT.cache.pessoas.pessoas[k];
    var ov = document.createElement("div");
    ov.className = "atv-overlay";
    var campo = function (id, rot, val, tipo, ajuda) { return '<div class="pt-campo"><label for="' + id + '">' + rot + '</label><input id="' + id + '" type="' + (tipo || "time") + '" value="' + Pto_esc_(val) + '">' + (ajuda ? '<div class="pt-ajuda-campo">' + ajuda + "</div>" : "") + "</div>"; };
    ov.innerHTML = '<div class="atv-modal" style="max-width:600px"><div class="atv-modal-cab"><h3>' + Pto_esc_(p.nome) + '</h3><button type="button" class="atv-fechar" aria-label="Fechar">&times;</button></div><div class="atv-modal-corpo">' +
      '<label class="pt-check"><input type="checkbox" id="ptPsPart"' + (p.participa ? " checked" : "") + "> Participa dos avisos do ponto</label>" +
      (p.apto || p.fora === "NAO_PARTICIPA" ? "" : '<div class="pt-faixa aviso">Esta pessoa não está habilitada: ' + Pto_esc_(p.foraTexto) + ".</div>") +
      '<p class="pt-mini">Deixe vazio para seguir a jornada geral (' + Pto_esc_(PT.cache.pessoas.jornadaGeral) + ").</p>" +
      '<div class="pt-grade2">' + campo("ptPsEnt", "Entrada", p.entrada) + campo("ptPsSai", "Saída (segunda a quinta)", p.saida) + campo("ptPsAlm", "Saída para o almoço", p.almoco) +
      campo("ptPsRet", "Pausa do almoço (minutos)", p.retorno_min, "number", "De 15 a 240. A volta é lembrada na saída + a pausa.") + campo("ptPsSex", "Saída na sexta", p.saida_sexta) + "</div>" +
      '<label class="pt-check"><input type="checkbox" id="ptPsSem"' + (p.sem_almoco ? " checked" : "") + "> Sem intervalo registrado no ponto (não lembra almoço nem volta)</label>" +
      '<div class="pt-campo"><label for="ptPsObs">Observação (opcional)</label><input id="ptPsObs" maxlength="200" value="' + Pto_esc_(p.observacao) + '"></div><div id="ptPsMsg"></div></div>' +
      '<div class="atv-modal-rod"><button type="button" class="btn-secondary" data-f>Cancelar</button> <button type="button" class="btn-primary" data-ok>Salvar</button></div></div>';
    var fechar = function () { ov.remove(); };
    ov.querySelector(".atv-fechar").onclick = fechar; ov.querySelector("[data-f]").onclick = fechar;
    ov.querySelector("[data-ok]").onclick = function () {
      var b = this; b.disabled = true;
      Pto_chamar_("salvarPessoa", { usuarioId: p.id, participa: Pto_$_("ptPsPart").checked, entrada: Pto_$_("ptPsEnt").value, saida: Pto_$_("ptPsSai").value, almoco: Pto_$_("ptPsAlm").value,
        retorno_min: Pto_$_("ptPsRet").value, saida_sexta: Pto_$_("ptPsSex").value, sem_almoco: Pto_$_("ptPsSem").checked, observacao: Pto_$_("ptPsObs").value },
        function (r) { fechar(); Pto_msg_("ptMsg", r.message, "ok"); Ponto_desenharAba_(); }, function (m) { b.disabled = false; Pto_msg_("ptPsMsg", m); });
    };
    document.body.appendChild(ov);
  }

  // ---------------- Configuração (Administrador e Diretoria) ----------------
  function Ponto_abaConfig_(alvo) {
    Pto_chamar_("config", {}, function (r) {
      var c = r.config, j = c.jornada, pr = r.prontidao;
      var h = '<div class="pt-caixa"><h3>Ligar e desligar</h3><label class="pt-check"><input type="checkbox" id="ptCfgLig"' + (c.ligado ? " checked" : "") + "> <b>Assistente ligado</b> (com ele desligado nada sai)</label>" +
        '<p class="pt-mini">Ao ligar, a rotina de 5 minutos é instalada. Com o assistente do SGO+ ligado, o do COMMAND não manda nada (sem mensagem em dobro).' + (pr.piloto.ligado ? " O piloto do WhatsApp está ligado: só quem está na lista do piloto participa." : "") + "</p>" +
        '<div class="pt-campo"><label for="ptCfgConj">Marcações padrão (pessoas sem escolha individual)</label><select id="ptCfgConj">' + Pto_opcoes_(r.conjuntos.map(function (x) { return [x.codigo, x.nome]; }), c.conjunto) + "</select></div></div>";
      h += '<div class="pt-caixa"><h3>Jornada geral</h3><p class="pt-mini">Os dias úteis e os feriados vêm do expediente comum do SGO+ (' + Pto_esc_(r.expediente.ini + "–" + r.expediente.fim) + "). Entrada vazia = início do expediente comum. Cada pessoa pode ter outro horário em Pessoas e jornadas.</p>" +
        '<div class="pt-grade3"><div class="pt-campo"><label for="ptCfgEnt">Entrada</label><input type="time" id="ptCfgEnt" value="' + Pto_esc_(j.entrada) + '"><div class="pt-ajuda-campo">Lembrete 5 minutos antes.</div></div>' +
        '<div class="pt-campo"><label for="ptCfgAlm">Saída para o almoço</label><input type="time" id="ptCfgAlm" value="' + Pto_esc_(j.almoco) + '"><div class="pt-ajuda-campo">Lembrete na hora.</div></div>' +
        '<div class="pt-campo"><label for="ptCfgRet">Pausa do almoço (minutos)</label><input type="number" id="ptCfgRet" min="15" max="240" value="' + Pto_esc_(j.retorno_min) + '"><div class="pt-ajuda-campo">A volta é lembrada na saída confirmada + a pausa.</div></div>' +
        '<div class="pt-campo"><label for="ptCfgSai">Saída (segunda a quinta)</label><input type="time" id="ptCfgSai" value="' + Pto_esc_(j.saida) + '"><div class="pt-ajuda-campo">Lembrete 5 minutos antes.</div></div>' +
        '<div class="pt-campo"><label for="ptCfgSex">Saída na sexta</label><input type="time" id="ptCfgSex" value="' + Pto_esc_(j.saida_sexta) + '"></div></div>' +
        '<p class="pt-mini">Hoje: ' + Pto_esc_(r.jornadaEfetiva) + "; na sexta: " + Pto_esc_(r.jornadaSexta) + ".</p></div>";
      h += '<div class="pt-caixa"><h3>RH e avisos</h3><p class="pt-mini">Quem tem o perfil RH ou a área RH no cadastro já é RH do assistente. Marque aqui outras pessoas que tratam os pedidos.</p><div style="max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:6px 10px">' +
        r.candidatosRh.map(function (u) { return '<label class="pt-check"><input type="checkbox" class="ptCfgRh" value="' + Pto_esc_(u.id) + '"' + (u.marcado || u.rhAutomatico ? " checked" : "") + (u.rhAutomatico ? " disabled" : "") + "> " + Pto_esc_(u.nome) + (u.rhAutomatico ? ' <span class="pt-mini">(RH pelo cadastro)</span>' : "") + "</label>"; }).join("") + "</div>" +
        '<label class="pt-check"><input type="checkbox" id="ptCfgEmail"' + (c.emailReserva ? " checked" : "") + "> Sem WhatsApp (modelo não aprovado ou sem celular), mandar o lembrete por e-mail</label>" +
        '<label class="pt-check"><input type="checkbox" id="ptCfgAtv"' + (c.atividadeRh ? " checked" : "") + "> Pedido de ajuste vira atividade do RH em Minhas atividades</label>" +
        '<div class="pt-campo" style="max-width:260px"><label for="ptCfgRes">Resumo ao RH e à gestão a partir do</label><select id="ptCfgRes">' + Pto_opcoes_([2, 3, 4, 5, 6].map(function (n) { return [n, n + "º esquecimento declarado no mês"]; }), c.resumoAPartir) + "</select></div></div>";
      h += '<div id="ptCfgMsg"></div><div class="pt-acoes" style="margin-bottom:14px"><button type="button" class="btn-primary" id="ptCfgSalvar">Salvar configuração</button><button type="button" class="btn-secondary" id="ptCfgPrevia">Pré-visualizar a página do link</button></div>';
      h += '<div class="pt-caixa"><h3>Feriados (expediente comum)</h3><p class="pt-mini">Feriados nacionais, Carnaval, Sexta-feira Santa e Corpus Christi já estão no sistema. Escreva os estaduais, municipais e recessos (dd/mm ou dd/mm/aaaa, separados por vírgula). Valem para todos os avisos automáticos do SGO+.</p>' +
        '<div class="pt-campo"><label for="ptCfgFer">Feriados extras</label><input id="ptCfgFer" value="' + Pto_esc_(r.expediente.feriados) + '" placeholder="24/10, 08/12"></div><div id="ptFerMsg"></div><div class="pt-acoes"><button type="button" class="btn-secondary" id="ptFerSalvar">Salvar feriados</button></div></div>';
      h += '<div class="pt-caixa"><h3>Modelos do WhatsApp (Meta) — ' + pr.aprovados + " de 4 aprovados</h3>" +
        '<p class="pt-mini">O WhatsApp oficial só entrega mensagem por modelo aprovado. Cadastre em Administração > Chaves e senhas > Cadastrar modelos na Meta e confira em Situação dos modelos. Até aprovar, o lembrete vai por e-mail (se a opção acima estiver marcada).</p>' +
        pr.modelos.map(function (m) { return "<div style='margin-top:8px'><b>" + Pto_esc_(m.nome) + "</b> " + Pto_selo_(m.situacao, m.status === "APPROVED" ? "verde" : "laranja") + (m.usado ? "" : Pto_selo_("não usado no conjunto atual", "cinza")) + '<div class="pt-modelo">' + Pto_esc_(m.texto) + "</div><div class='pt-mini'>Botão: " + Pto_esc_(m.botao) + "</div></div>"; }).join("") + "</div>";
      h += '<div class="pt-caixa"><h3>Situação</h3><p class="pt-mini">Rotina de 5 minutos: ' + (pr.rotina ? "instalada" : "não instalada (instala ao ligar)") + ". Última rodada: " + (pr.ultima ? Pto_esc_(String(pr.ultima.em).replace("T", " ").slice(0, 16) + " — " + (pr.ultima.res.motivo || (pr.ultima.res.lembretes + " lembrete(s)"))) : "nenhuma") + ".</p></div>";
      alvo.innerHTML = h;
      Pto_$_("ptCfgSalvar").onclick = function () {
        var b = this;
        var lig = Pto_$_("ptCfgLig").checked;
        if (lig && !(r.config.ligado) && !confirm("Ligar o assistente do ponto? Os lembretes começam na próxima marcação de dia útil, para quem participa.")) return;
        b.disabled = true;
        var rh = Array.prototype.map.call(document.querySelectorAll(".ptCfgRh:checked:not(:disabled)"), function (x) { return x.value; });
        Pto_chamar_("salvarConfig", { ligado: lig, conjunto: Pto_$_("ptCfgConj").value, rhIds: rh, emailReserva: Pto_$_("ptCfgEmail").checked, atividadeRh: Pto_$_("ptCfgAtv").checked, resumoAPartir: Pto_$_("ptCfgRes").value,
          jornada: { entrada: Pto_$_("ptCfgEnt").value, almoco: Pto_$_("ptCfgAlm").value, retorno_min: Pto_$_("ptCfgRet").value, saida: Pto_$_("ptCfgSai").value, saida_sexta: Pto_$_("ptCfgSex").value } },
          function (x) { b.disabled = false; PT.ini = null; Pto_msg_("ptMsg", x.message + (x.aviso ? " " + x.aviso : ""), x.aviso ? "aviso" : "ok"); Ponto_iniciar_(); Ponto_render_(); }, function (m) { b.disabled = false; Pto_msg_("ptCfgMsg", m); }, "Salvando…");
      };
      Pto_$_("ptCfgPrevia").onclick = function () { Pto_chamar_("previa", { marcacao: "ENTRADA" }, function (x) { window.open(x.link, "_blank"); }); };
      Pto_$_("ptFerSalvar").onclick = function () { Pto_chamar_("salvarFeriados", { feriados: Pto_$_("ptCfgFer").value }, function (x) { Pto_msg_("ptFerMsg", x.message, "ok"); }, function (m) { Pto_msg_("ptFerMsg", m); }); };
    }, function (m) { alvo.innerHTML = '<div class="pt-faixa erro">' + Pto_esc_(m) + "</div>"; });
  }
</script>

<script>
  // Carregador leve do modulo: o conteudo pesado (CSS + HTML + JS do
  // formulario) fica guardado como string JS comum em SGO_AutoRel_ConteudoModulo.js
  // (nao num arquivo .html -- o HtmlService distorce/trunca conteudo
  // grande lido de arquivos .html) e NAO eh incluido no bundle inicial
  // da pagina -- so eh buscado do servidor na primeira vez que o
  // usuario abre este modulo. Mesmo padrao ja usado em Cadeia de
  // Frio/Estufa/Declaracao/RelCal/PlanCME.
  let tplAutoRel_carregado_ = false;

  function renderTplAutoRel_() {
    const container = document.getElementById('tplAutoRelContainer');
    if (!container) return;

    if (tplAutoRel_carregado_) {
      if (typeof tplAutoRel_renderReal_ === 'function') tplAutoRel_renderReal_();
      return;
    }

    container.innerHTML = '<p style="padding:20px;color:#94a3b8;">Carregando módulo Autoclave (Relatório de Auditoria)...</p>';

    google.script.run
      .withSuccessHandler(function(conteudoBruto) {
        try {
          const styleMatch = conteudoBruto.match(/<style>([\s\S]*?)<\/style>/);
          const scriptMatch = conteudoBruto.match(/<script>([\s\S]*?)<\/script>/);

          if (styleMatch) {
            const styleEl = document.createElement('style');
            styleEl.textContent = styleMatch[1];
            document.head.appendChild(styleEl);
          }

          if (scriptMatch) {
            window.eval(scriptMatch[1]);
          }

          tplAutoRel_carregado_ = true;

          if (typeof tplAutoRel_renderReal_ === 'function') {
            tplAutoRel_renderReal_();
          } else {
            console.error('renderTplAutoRel_: tplAutoRel_renderReal_ nao foi definida apos o eval.');
            container.innerHTML = '<p style="padding:20px;color:#f87171;">Falha ao inicializar o modulo (funcao de renderizacao nao encontrada). Veja o Console (F12) para detalhes.</p>';
          }
        } catch (e) {
          console.error('renderTplAutoRel_: erro ao montar o modulo:', e);
          container.innerHTML = '<p style="padding:20px;color:#f87171;">Erro ao montar o modulo: ' + (e && e.message ? e.message : e) + '</p>';
        }
      })
      .withFailureHandler(function(err) {
        console.error('renderTplAutoRel_: falha ao buscar o modulo:', err);
        container.innerHTML = '<p style="padding:20px;color:#f87171;">Falha ao carregar o modulo: ' + ((err && err.message) ? err.message : err) + '</p>';
      })
      .AutoRel_obterConteudoModulo();
  }
</script>

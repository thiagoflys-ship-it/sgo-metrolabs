<script>
  // ==========================================
  // MÓDULO: EQUIPAMENTOS E QR CODE
  // ==========================================
  function renderEquipamentosModulo_() {
    const div = document.getElementById("conteudo");
    if (!div) return;

    const isCliente = USER_CONTEXT && USER_CONTEXT.perfil === "CLIENTE";
    const styleForm = isCliente ? "display:none;" : "";
    const styleGrid = isCliente ? "grid-template-columns: 1fr;" : "";

    div.innerHTML = `
      <div class="module-shell">
        <div class="module-header">
          <div class="module-header-left">
            <h2 class="content-title">Equipamentos</h2>
            <p class="content-subtitle">Cadastro de equipamentos com rastreabilidade de TAG.</p>
          </div>
          <div class="module-header-right" style="${styleForm}; display: flex; gap: 15px; align-items: center;">
            <div style="display: flex; gap: 5px;">
              <input id="equipamentosPesquisa" class="toolbar-search" type="text" placeholder="Pesquisar TAG, série..." onkeydown="if(event.key === 'Enter') equipamentosPesquisar_()">
              <button class="btn-secondary" type="button" onclick="equipamentosPesquisar_()">Pesquisar</button>
            </div>
            <button class="btn-primary" type="button" onclick="equipamentosNovo_()">+ Novo equipamento</button>
          </div>
        </div>

        <div class="module-grid" style="${styleGrid}">
          <div class="form-card" style="${styleForm}">
            <h3 class="section-card-title" id="equipamentosFormTitulo">Novo equipamento</h3>
            <div class="form-grid">
              <div class="full">
                <label for="eqp_cliente_id_busca">Cliente</label>
                ${SGO_htmlBuscaClienteLike_("eqp_cliente_id", "Nome ou CNPJ do cliente...")}
              </div>
              <div class="full">
                <label for="eqp_unidade_id">Unidade</label>
                <select id="eqp_unidade_id">
                  <option value="">Selecione um cliente primeiro</option>
                </select>
              </div>
              <div class="full">
                <label for="eqp_tipo">Tipo do equipamento</label>
                <input id="eqp_tipo" type="text" placeholder="Ex: Autoclave, Lavadora">
              </div>
              <div>
                <label for="eqp_tag">TAG (Identificador)</label>
                <input id="eqp_tag" type="text" placeholder="Ex: AUT-01">
              </div>
              <div>
                <label for="eqp_status">Situação</label>
                <input id="eqp_status" type="text" value="ATIVO" disabled>
              </div>
              <div class="full">
                <label for="eqp_fabricante">Fabricante</label>
                <input id="eqp_fabricante" type="text" placeholder="Fabricante do equipamento">
              </div>
              <div>
                <label for="eqp_modelo">Modelo</label>
                <input id="eqp_modelo" type="text" placeholder="Modelo">
              </div>
              <div>
                <label for="eqp_serie">Número de Série</label>
                <input id="eqp_serie" type="text" placeholder="Número de Série">
              </div>
              <div class="full">
                <label for="eqp_setor">Setor / Localização</label>
                <input id="eqp_setor" type="text" placeholder="Ex: CME, Centro Cirúrgico">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="button" onclick="equipamentosSalvar_()">Salvar</button>
              <button class="btn-secondary" type="button" onclick="equipamentosNovo_()">Limpar</button>
            </div>
            <div class="helper-text" id="equipamentosHelper">Selecione cliente e unidade, preencha os dados e clique em salvar.</div>
            <div id="equipamentosAuvoBox" style="display:none; margin-top:16px; border-top:1px solid var(--border-color, #e2e2e2); padding-top:12px;">
              <h4 style="margin:0 0 8px; font-size:14px;">Atendimentos registrados via Auvo</h4>
              <div id="equipamentosAuvoLista" style="max-height:220px; overflow-y:auto; font-size:13px;"></div>
            </div>
          </div>

          <div class="list-card">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Cliente</th>
                    <th>Unidade</th>
                    <th>Tipo</th>
                    <th>TAG</th>
                    <th>Fabricante</th>
                    <th>Modelo</th>
                    <th>Série</th>
                    <th>Setor</th>
                    <th>Situação</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="equipamentosTabelaBody">
                  <tr><td colspan="10" class="empty-state">Utilize a barra de pesquisa para buscar equipamentos.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;

    equipamentosLimparFormulario_();

    if (!isCliente) {
      carregarClientesParaEquipamentos_();
    }
  }

  function carregarClientesParaEquipamentos_() {
    if (!SESSION) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return;
        EQUIPAMENTOS_STATE.clientes = Array.isArray(res.items) ? res.items : [];
        preencherComboClientesEquipamentos_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao carregar clientes para equipamentos:", err);
      })
      .equipamentosListarClientesAtivos(SESSION);
  }

  function preencherComboClientesEquipamentos_() {
    SGO_montarBuscaClienteLike_("eqp_cliente_id", EQUIPAMENTOS_STATE.clientes || [], aoMudarClienteEquipamentos_);
  }

  function aoMudarClienteEquipamentos_() {
    const clienteId = getValue_("eqp_cliente_id");
    if (!clienteId) {
      EQUIPAMENTOS_STATE.unidades = [];
      preencherComboUnidadesEquipamentos_();
      return;
    }
    carregarUnidadesParaEquipamentos_(clienteId);
  }

  function carregarUnidadesParaEquipamentos_(clienteId, unidadeSelecionadaId) {
    const request = EQUIPAMENTOS_STATE.unidadesRequest = (EQUIPAMENTOS_STATE.unidadesRequest || 0) + 1;
    if (!SESSION || !clienteId) return;

    const selectUnidade = document.getElementById("eqp_unidade_id");
    if (selectUnidade) selectUnidade.innerHTML = '<option value="">Carregando unidades...</option>';

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (request !== EQUIPAMENTOS_STATE.unidadesRequest || !selectUnidade || !selectUnidade.isConnected || getValue_("eqp_cliente_id") !== clienteId) return;
        if (!res || !res.success) {selectUnidade.innerHTML='<option value="">Falha ao consultar unidades</option>';return;}
        EQUIPAMENTOS_STATE.unidades = Array.isArray(res.items) ? res.items : [];
        preencherComboUnidadesEquipamentos_();
        if (unidadeSelecionadaId) setSelectValueSafe_("eqp_unidade_id", unidadeSelecionadaId);
        else if (EQUIPAMENTOS_STATE.unidades.length === 1) setSelectValueSafe_("eqp_unidade_id", EQUIPAMENTOS_STATE.unidades[0].ID);
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao carregar unidades para equipamentos:", err);
      })
      .equipamentosListarUnidadesAtivasPorCliente(SESSION, clienteId);
  }

  function preencherComboUnidadesEquipamentos_() {
    const select = document.getElementById("eqp_unidade_id");
    if (!select) return;

    if (!EQUIPAMENTOS_STATE.unidades || EQUIPAMENTOS_STATE.unidades.length === 0) {
      select.innerHTML = '<option value="">Nenhuma unidade ativa encontrada</option>';
      return;
    }

    const options = ['<option value="">Selecione a unidade</option>'];
    (EQUIPAMENTOS_STATE.unidades || []).forEach(function (item) {
      options.push('<option value="' + escapeHtml_(item.ID) + '">' + escapeHtml_(item.NOME_UNIDADE) + '</option>');
    });
    select.innerHTML = options.join("");
  }

  function equipamentosPesquisar_() {
    const el = document.getElementById("equipamentosPesquisa");
    EQUIPAMENTOS_STATE.filtro = el ? String(el.value || "").trim() : "";
    if (!SESSION) return;

    const tbody = document.getElementById("equipamentosTabelaBody");
    if (!tbody) return;

    if (!EQUIPAMENTOS_STATE.filtro) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Utilize a barra de pesquisa para buscar equipamentos.</td></tr>';
      return;
    }

    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Buscando na base...</td></tr>';

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) {
          tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Falha ao buscar equipamentos.</td></tr>';
          return;
        }
        renderTabelaEquipamentos_(Array.isArray(res.items) ? res.items : []);
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao pesquisar equipamentos:", err);
        tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Não foi possível buscar os equipamentos. Verifique a conexão e tente de novo. Nada foi alterado.</td></tr>';
      })
      .equipamentosPesquisar(SESSION, EQUIPAMENTOS_STATE.filtro);
  }

  function renderTabelaEquipamentos_(itemsOverride) {
    const tbody = document.getElementById("equipamentosTabelaBody");
    if (!tbody) return;

    const items = Array.isArray(itemsOverride) ? itemsOverride : EQUIPAMENTOS_STATE.items;
    const isCliente = USER_CONTEXT && USER_CONTEXT.perfil === "CLIENTE";

    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="10" class="empty-state">Nenhum equipamento encontrado.</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(function (item) {
      const id = escapeHtml_(item.ID);
      const status = String(item.STATUS || "").toUpperCase();

      const acoesHtml = isCliente ? `
        <td>
          <div class="table-actions">
            <button class="btn-secondary" type="button" onclick="equipamentosGerarQR_('${id}')">Ver QR Code</button>
          </div>
        </td>
      ` : `
        <td>
          <div class="table-actions">
            <button class="btn-info" type="button" onclick="equipamentosEditar_('${id}')">Editar</button>
            <button class="btn-secondary" type="button" onclick="equipamentosGerarQR_('${id}')">QR Code</button>
            ${
              status === "ATIVO"
                ? `<button class="btn-warning" type="button" onclick="equipamentosInativar_('${id}')">Inativar</button>`
                : `<button class="btn-success" type="button" onclick="equipamentosReativar_('${id}')">Reativar</button>`
            }
            <button class="btn-danger" type="button" onclick="equipamentosExcluir_('${id}')">Excluir</button>
          </div>
        </td>
      `;

      return `
        <tr>
          <td>${escapeHtml_(item.CLIENTE_NOME)}</td>
          <td>${escapeHtml_(item.UNIDADE_NOME)}</td>
          <td>${escapeHtml_(item.TIPO)}</td>
          <td style="font-weight:700;">${escapeHtml_(item.TAG)}</td>
          <td>${escapeHtml_(item.FABRICANTE)}</td>
          <td>${escapeHtml_(item.MODELO)}</td>
          <td>${escapeHtml_(item.SERIE)}</td>
          <td>${escapeHtml_(item.SETOR)}</td>
          <td>${obterBadgeStatusHtml_(status)}</td>
          ${acoesHtml}
        </tr>
      `;
    }).join("");
  }

  function equipamentosNovo_() {
    EQUIPAMENTOS_STATE.editingId = "";
    equipamentosLimparFormulario_();

    const titulo = document.getElementById("equipamentosFormTitulo");
    const helper = document.getElementById("equipamentosHelper");

    if (titulo) titulo.innerText = "Novo equipamento";
    if (helper) helper.innerText = "Selecione cliente e unidade, preencha os dados e clique em salvar.";

    const auvoBox = document.getElementById("equipamentosAuvoBox");
    if (auvoBox) auvoBox.style.display = "none";

    if (USER_CONTEXT && USER_CONTEXT.perfil !== "CLIENTE") {
      carregarClientesParaEquipamentos_();
    }
  }

  function renderEquipamentosAuvoLista_(atendimentos) {
    const box = document.getElementById("equipamentosAuvoBox");
    const lista = document.getElementById("equipamentosAuvoLista");
    if (!box || !lista) return;

    if (!atendimentos || !atendimentos.length) {
      box.style.display = "none";
      return;
    }

    box.style.display = "";
    lista.innerHTML = atendimentos.map(function (a) {
      const dataFmt = a.data ? new Date(a.data).toLocaleDateString("pt-BR") : "";
      const situacao = a.finalizada ? "Concluído" : "Em andamento";
      const clickable = a.auvoTaskId ? ' style="padding:6px 0; border-bottom:1px solid var(--border-color, #eee); cursor:pointer" onclick="Auvo_abrirModalOS_(\'' + String(a.auvoTaskId).replace(/'/g, "") + '\')" title="Ver O.S. completa"' : ' style="padding:6px 0; border-bottom:1px solid var(--border-color, #eee);"';
      return '<div' + clickable + '>' +
        '<strong>' + escapeHtml_(dataFmt) + '</strong> · ' + escapeHtml_(a.tipo || "") + ' · ' + escapeHtml_(situacao) +
        '<div style="color:var(--bc-text-3);">Técnico: ' + escapeHtml_(a.tecnico || "-") + '</div>' +
        (a.relato ? '<div style="margin-top:2px;">' + escapeHtml_(a.relato) + '</div>' : '') +
        '</div>';
    }).join("");
  }

  function equipamentosLimparFormulario_() {
    SGO_limparBuscaClienteLike_("eqp_cliente_id");
    setSelectValueSafe_("eqp_unidade_id", "");
    setValue_("eqp_tipo", "");
    setValue_("eqp_fabricante", "");
    setValue_("eqp_modelo", "");
    setValue_("eqp_serie", "");
    setValue_("eqp_tag", "");
    setValue_("eqp_setor", "");
    setValue_("eqp_status", "ATIVO");

    EQUIPAMENTOS_STATE.unidades = [];

    const selectUnidade = document.getElementById("eqp_unidade_id");
    if (selectUnidade) selectUnidade.innerHTML = '<option value="">Selecione um cliente primeiro</option>';
  }

  function equipamentosLerFormulario_() {
    return {
      CLIENTE_ID: getValue_("eqp_cliente_id"),
      UNIDADE_ID: getValue_("eqp_unidade_id"),
      TIPO: getValue_("eqp_tipo"),
      FABRICANTE: getValue_("eqp_fabricante"),
      MODELO: getValue_("eqp_modelo"),
      SERIE: getValue_("eqp_serie"),
      TAG: getValue_("eqp_tag"),
      SETOR: getValue_("eqp_setor")
    };
  }

  function equipamentosSalvar_() {
    if (!SESSION) return;

    const payload = equipamentosLerFormulario_();

    if (!payload.CLIENTE_ID) return alert("Selecione o cliente.");
    if (!payload.UNIDADE_ID) return alert("Selecione a unidade.");
    if (!payload.TIPO) return alert("Informe o tipo do equipamento.");

    if (EQUIPAMENTOS_STATE.editingId) {
      SGO_iniciarCarregamento_();
      google.script.run
        .withSuccessHandler(function (res) {
          SGO_finalizarCarregamento_();
          if (!res || !res.success) return alert((res && res.message) ? res.message : "Não foi possível atualizar o registro. Tente de novo.");
          alert(res.message || "Atualizado com sucesso.");
          equipamentosNovo_();
          if (EQUIPAMENTOS_STATE.filtro) equipamentosPesquisar_();
        })
        .withFailureHandler(function (err) {
          SGO_finalizarCarregamento_();
          console.error("Falha ao atualizar equipamento:", err);
          alert("Não foi possível atualizar o equipamento. Verifique a conexão e confira na lista se a alteração foi feita antes de tentar de novo.");
        })
        .equipamentosAtualizar(SESSION, EQUIPAMENTOS_STATE.editingId, payload);
      return;
    }

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Não foi possível concluir o cadastro. Tente de novo.");
        alert(res.message || "Criado com sucesso.");
        equipamentosNovo_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao criar equipamento:", err);
        alert("Não foi possível cadastrar o equipamento. Verifique a conexão e confira na lista se a alteração foi feita antes de tentar de novo.");
      })
      .equipamentosCriar(SESSION, payload);
  }

  function equipamentosEditar_(id) {
    if (!SESSION) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success || !res.item) return alert("Equipamento não encontrado.");

        const item = res.item;
        EQUIPAMENTOS_STATE.editingId = String(item.ID || "");

        if (USER_CONTEXT && USER_CONTEXT.perfil !== "CLIENTE") {
          carregarClientesParaEquipamentos_();
        }

        SGO_prefillBuscaClienteLike_("eqp_cliente_id", item.CLIENTE_ID || "", item.CLIENTE_NOME || "");
        carregarUnidadesParaEquipamentos_(item.CLIENTE_ID, item.UNIDADE_ID);

        setValue_("eqp_tipo", item.TIPO || "");
        setValue_("eqp_fabricante", item.FABRICANTE || "");
        setValue_("eqp_modelo", item.MODELO || "");
        setValue_("eqp_serie", item.SERIE || "");
        setValue_("eqp_tag", item.TAG || "");
        setValue_("eqp_setor", item.SETOR || "");
        setValue_("eqp_status", item.STATUS || "ATIVO");

        const titulo = document.getElementById("equipamentosFormTitulo");
        const helper = document.getElementById("equipamentosHelper");

        if (titulo) titulo.innerText = "Editar equipamento";
        if (helper) helper.innerText = "Editando equipamento selecionado.";

        renderEquipamentosAuvoLista_(res.atendimentosAuvo);

        focusIfExists_("eqp_tipo");
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao buscar equipamento:", err);
        alert("Não foi possível buscar o equipamento. Verifique a conexão e tente de novo. Nada foi alterado.");
      })
      .equipamentosObter(SESSION, id);
  }

  function equipamentosInativar_(id) {
    if (!SESSION || !confirm("Inativar este equipamento?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Não foi possível inativar o registro. Tente de novo.");
        if (EQUIPAMENTOS_STATE.filtro) equipamentosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao inativar equipamento:", err);
        alert("Não foi possível inativar o equipamento. Verifique a conexão e confira na lista se a alteração foi feita antes de tentar de novo.");
      })
      .equipamentosInativar(SESSION, id);
  }

  function equipamentosReativar_(id) {
    if (!SESSION || !confirm("Reativar este equipamento?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Não foi possível reativar o registro. Tente de novo.");
        if (EQUIPAMENTOS_STATE.filtro) equipamentosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao reativar equipamento:", err);
        alert("Não foi possível reativar o equipamento. Verifique a conexão e confira na lista se a alteração foi feita antes de tentar de novo.");
      })
      .equipamentosReativar(SESSION, id);
  }

  function equipamentosExcluir_(id) {
    if (!SESSION || !confirm("Excluir definitivamente este equipamento?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Não foi possível excluir o registro. Tente de novo.");
        if (EQUIPAMENTOS_STATE.editingId === id) equipamentosNovo_();
        if (EQUIPAMENTOS_STATE.filtro) equipamentosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao excluir equipamento:", err);
        alert("Não foi possível excluir o equipamento. Verifique a conexão e confira na lista se a alteração foi feita antes de tentar de novo.");
      })
      .equipamentosExcluir(SESSION, id);
  }

  function equipamentosGerarQR_(id) {
    if (!SESSION) return;

    const modalId = "modal-qr-code";
    let modal = document.getElementById(modalId);
    if (!modal) {
      modal = document.createElement("div");
      modal.id = modalId;
      modal.className = "modal-overlay";
      document.body.appendChild(modal);
    }

    modal.innerHTML = `
      <div class="modal-card qr-print-area">
        <div class="modal-header">
          <h3 class="modal-title">QR Code do Equipamento</h3>
        </div>
        <div class="modal-body qr-wrapper" id="qr-body-content">
          <p>Gerando QR Code...</p>
        </div>
        <div class="modal-footer">
          <button class="btn-primary" type="button" onclick="imprimirQRCode_()">Imprimir Etiqueta</button>
          <button class="btn-secondary" type="button" onclick="fecharModalQR_()">Fechar</button>
        </div>
      </div>
    `;
    modal.style.display = "flex";

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        const bodyContent = document.getElementById("qr-body-content");
        if (!bodyContent) return;

        if (!res || !res.success) {
          bodyContent.innerHTML = `<p class="text-danger">${res ? escapeHtml_(res.message) : "Não foi possível gerar o QR Code. Tente de novo."}</p>`;
          return;
        }

        const eqp = res.equipamento || {};
        const nomeCliente = String(eqp.CLIENTE_NOME || "").trim();
        const nomeUnidade = String(eqp.UNIDADE_NOME || "").trim();
        const linhaClienteUnidade = (nomeUnidade && nomeUnidade.toUpperCase() !== nomeCliente.toUpperCase())
          ? `${nomeCliente} - ${nomeUnidade}`
          : nomeCliente;
        bodyContent.innerHTML = `
          <img src="${escapeHtml_(res.qrUrl)}" alt="QR Code" class="qr-image">
          <div class="qr-info">
            <div><strong>TAG:</strong> ${escapeHtml_(eqp.TAG)}</div>
            <div><strong>Tipo:</strong> ${escapeHtml_(eqp.TIPO)}</div>
            <div><strong>Modelo:</strong> ${escapeHtml_(eqp.MODELO)}</div>
            <div><strong>Série:</strong> ${escapeHtml_(eqp.SERIE)}</div>
            <div style="margin-top:10px; font-size:12px; color:#475569;">${escapeHtml_(linhaClienteUnidade)}</div>
          </div>
        `;
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao gerar QR Code:", err);
        const bodyContent = document.getElementById("qr-body-content");
        if (bodyContent) {
          bodyContent.innerHTML = `<p class="text-danger">Não foi possível gerar o QR Code. Verifique a conexão e tente de novo. Nada foi alterado.</p>`;
        }
      })
      .qrcodeGerarParaEquipamento(SESSION, id);
  }

  function fecharModalQR_() {
    const modal = document.getElementById("modal-qr-code");
    if (modal) modal.style.display = "none";
  }

  function imprimirQRCode_() {
    document.body.classList.add("printing-qr");
    window.print();
    setTimeout(function () {
      document.body.classList.remove("printing-qr");

  }

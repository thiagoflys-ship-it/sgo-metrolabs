<!--
  SGO+ LICITAÇÕES — TABELA DE PREÇOS PRÓPRIA E SIMULADOR (02/11/2026): tela "Preços de licitação" (tabela da Diretoria com
  versão e histórico, política de preços de licitação, importação do catálogo com prévia) e a aba "Preço" da ficha (simulação
  por item: custo, impostos, deslocamento diluído, piso e alvo, margem a um preço, versões imutáveis).
  Servidor: SGO_Licitacoes_Precos.js (Licitacoes_api ação "precos" com { op }). A conta é sempre do servidor: a tela só mostra.
  Usa os utilitários de JS_Licitacoes.html (Lic_esc_, Lic_chamar_, Lic_janela_, Lic_faixa_, Lic_tabelaHtml_, Lic_brl_).
  Todo texto que vem do edital ou da tabela passa por Lic_esc_. Sem atualização automática: nada redesenha formulário aberto.
-->
<style>
  .lpr-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
  .lpr-grade label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .lpr-grade input, .lpr-grade select, .lpr-grade textarea { width: 100%; min-height: 40px; box-sizing: border-box; max-width: 100%; }
  .lpr-grade .lpr-largo { grid-column: 1 / -1; }
  .lpr-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; background: var(--card); }
  .lpr-item-cab { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .lpr-tot { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
  .lpr-tot > div { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--card); }
  .lpr-tot span { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .lpr-tot b { font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .lpr-tot .ruim { border-color: var(--bc-danger-line); background: var(--danger-bg); }
  .lpr-tot .ruim b { color: var(--danger); }
  .lpr-abaixo { color: var(--danger); font-weight: 800; }
  tr.lpr-linha-abaixo td { background: var(--danger-bg); }
  .lpr-conta { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .lpr-conta li { padding: 3px 0; border-bottom: 1px dashed var(--border); overflow-wrap: anywhere; }
  .lpr-conta li:last-child { border-bottom: 0; }
  .lpr-det summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
</style>
<script>
  var LICPR = { tabela: null, busca: "", sims: {} };

  function LicPr_pct_(v) { if (v === null || v === undefined || !isFinite(Number(v))) return "—"; return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%"; }
  function LicPr_pct2_(v) { if (v === null || v === undefined || !isFinite(Number(v))) return "—"; return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%"; }
  function LicPr_moeda_(v) { return v === null || v === undefined || v === "" ? "—" : Lic_brl_(v); }
  /** Valor de um campo: número vira texto com vírgula (pt-BR, sem separador de milhar); texto fica como foi digitado. */
  function LicPr_campo_(v) { if (v === null || v === undefined) return ""; if (typeof v === "number") return isFinite(v) ? String(v).replace(".", ",") : ""; return String(v); }
  function LicPr_dia_(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? m[3] + "/" + m[2] + "/" + m[1] : "—"; }
  function LicPr_chamar_(op, dados, ok, erro) { Lic_chamar_("precos", Object.assign({ op: op }, dados || {}), ok, erro, { ignorarVelha: true }); }

  // ================= tela "Preços de licitação" =================
  function LicPr_renderTabela_() {
    var c = Lic_corpo_(); if (!c) return;
    c.innerHTML = Lic_carregando_(3);
    LicPr_chamar_("tabela", {}, function (d) { LICPR.tabela = d; LicPr_desenharTabela_(); }, function (m) { c.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(c, LicPr_renderTabela_); });
  }
  function LicPr_htmlPolitica_(d) {
    var p = d.politica || {};
    return '<div class="cm-caixa"><h3>Política de preços de licitação · versão ' + Lic_esc_(p.versao || 0) + (p.versao ? "" : " (padrões de 02/11/2026)") + '</h3>' +
      '<ul class="lpr-conta">' + (d.politicaTexto || []).map(function (t) { return "<li>" + Lic_esc_(t) + "</li>"; }).join("") + "</ul>" +
      '<p class="cm-meta">' + Lic_esc_(p.origem || "") + (p.motivo ? " · Motivo: " + Lic_esc_(p.motivo) : "") + (p.por ? " · " + Lic_esc_(p.por) + " em " + Lic_esc_(Lic_dataHora_(p.em)) : "") + "</p>" +
      (d.comercial ? '<p class="cm-ajuda-campo">Custos, impostos (' + Lic_esc_(LicPr_pct_(d.comercial.impostosPct)) + ', ' + Lic_esc_(d.comercial.unidade) + '), km e Incentivo de Missão vêm da política do Comercial versão ' + Lic_esc_(d.comercial.versao) + ".</p>" : "") +
      '<div class="lic-acoes-linha"><button type="button" class="btn-secondary" data-lpr-politica>Mudar a política</button></div></div>';
  }
  function LicPr_htmlTabela_(d) {
    var b = (LICPR.busca || "").toLowerCase(), r = d.resumo || {};
    var itens = (d.itens || []).filter(function (i) { return !b || (i.codigo + " " + i.nome + " " + i.categoria).toLowerCase().indexOf(b) >= 0; });
    var h = (d.aviso ? Lic_faixa_(d.aviso, "aviso") : "") +
      Lic_faixa_("Tabela própria de preços de licitação, cadastrada pela Diretoria (os preços não são os do Comercial). Cada mudança pede o motivo e vira uma versão nova; as simulações salvas guardam a versão que usaram.", "ok") +
      LicPr_htmlPolitica_(d) +
      '<div class="cm-filtros"><div><label for="lprBusca">Buscar</label><input id="lprBusca" type="search" placeholder="código ou serviço" value="' + Lic_esc_(LICPR.busca) + '"></div>' +
      '<div class="lic-acoes-linha"><button type="button" class="btn-primary" data-lpr-importar>Importar do catálogo</button></div></div>' +
      '<p class="cm-meta">' + Lic_esc_(r.total || 0) + " itens · " + Lic_esc_(r.aConfirmar || 0) + " com preço a confirmar · " + Lic_esc_(r.semCusto || 0) + " sem custo · " + Lic_esc_(r.abaixo || 0) + " com o preço de referência abaixo do piso</p>";
    if (!(d.itens || []).length) return h + '<div class="cm-vazio">A tabela está vazia. Toque em "Importar do catálogo" para começar com os serviços do catálogo do Comercial (você vê a prévia antes de gravar).</div>';
    return h + Lic_tabelaHtml_(["Código", "Serviço", "Execução", "Preço de referência", "Custo por equipamento", "Piso (sem deslocamento)", "Sobra no preço de referência", "Vigência", "Versão", "Ações"], itens.map(function (i) {
      return ['<span class="lic-mono">' + Lic_esc_(i.codigo) + "</span>", Lic_esc_(i.nome) + (i.ativo ? "" : ' <span class="cm-selo cinza">inativo</span>'),
        Lic_esc_(i.execucaoNome), Lic_esc_(LicPr_moeda_(i.precoReferencia)) + (i.precoSituacao === "A_CONFIRMAR" ? ' <span class="cm-selo laranja">Preço a confirmar</span>' : ""),
        Lic_esc_(LicPr_moeda_(i.custo)) + '<br><span class="cm-meta">' + Lic_esc_(i.custoFonte) + "</span>", Lic_esc_(LicPr_moeda_(i.pisoSemDeslocamento)),
        i.sobraNaReferenciaPct === null ? "—" : '<span class="' + (i.abaixoDoPiso ? "lpr-abaixo" : "") + '">' + Lic_esc_(LicPr_pct_(i.sobraNaReferenciaPct)) + (i.abaixoDoPiso ? " (abaixo do piso)" : "") + "</span>",
        Lic_esc_(LicPr_dia_(i.vigenciaDesde)) + (i.vigenciaAte ? " a " + Lic_esc_(LicPr_dia_(i.vigenciaAte)) : "") + (i.foraVigencia ? '<br><span class="lpr-abaixo">' + Lic_esc_(i.foraVigencia) + "</span>" : ""),
        Lic_esc_(i.versao), '<div class="lic-acoes-linha"><button type="button" class="btn-secondary" data-lpr-editar="' + Lic_esc_(i.id) + '">Editar</button><button type="button" class="btn-secondary" data-lpr-versoes="' + Lic_esc_(i.id) + '">Histórico</button></div>'];
    }));
  }
  function LicPr_desenharTabela_() {
    var c = Lic_corpo_(); if (!c || !LICPR.tabela) return;
    c.innerHTML = LicPr_htmlTabela_(LICPR.tabela);
    var bu = Lic_$_("lprBusca"); if (bu) bu.addEventListener("change", function () { LICPR.busca = bu.value; LicPr_desenharTabela_(); });
    var im = c.querySelector("[data-lpr-importar]"); if (im) im.onclick = function () { LicPr_janelaImportar_(im); };
    var po = c.querySelector("[data-lpr-politica]"); if (po) po.onclick = function () { LicPr_janelaPolitica_(po); };
    c.querySelectorAll("[data-lpr-editar]").forEach(function (b) { b.onclick = function () { LicPr_janelaEditar_(b.getAttribute("data-lpr-editar"), b); }; });
    c.querySelectorAll("[data-lpr-versoes]").forEach(function (b) { b.onclick = function () { LicPr_janelaVersoes_(b.getAttribute("data-lpr-versoes"), b); }; });
  }
  function LicPr_item_(id) { return ((LICPR.tabela && LICPR.tabela.itens) || []).filter(function (i) { return i.id === id; })[0] || null; }
  function LicPr_motivoHtml_() { return '<div class="lpr-largo"><label for="lprMotivo">Motivo (obrigatório, fica no histórico)</label><textarea id="lprMotivo" rows="2" maxlength="500"></textarea></div>'; }
  function LicPr_janelaEditar_(id, origem) {
    var i = LicPr_item_(id); if (!i) return;
    var opc = function (obj, atual) { return Object.keys(obj).map(function (k) { return '<option value="' + Lic_esc_(k) + '"' + (k === atual ? " selected" : "") + ">" + Lic_esc_(obj[k]) + "</option>"; }).join(""); };
    var corpo = '<p class="cm-txt"><span class="lic-mono">' + Lic_esc_(i.codigo) + "</span> " + Lic_esc_(i.nome) + " · versão " + Lic_esc_(i.versao) + '</p><div class="lpr-grade">' +
      '<div><label for="lprPreco">Preço de referência (R$)</label><input id="lprPreco" inputmode="decimal" value="' + Lic_esc_(LicPr_campo_(i.precoReferencia)) + '"></div>' +
      '<div><label for="lprSit">Situação do preço</label><select id="lprSit">' + opc(LICPR.tabela.situacoesPreco || {}, i.precoSituacao) + "</select></div>" +
      '<div><label for="lprExec">Execução</label><select id="lprExec">' + opc(LICPR.tabela.execucoes || {}, i.execucao) + "</select></div>" +
      '<div><label for="lprCustoOrig">Custo de referência</label><select id="lprCustoOrig"><option value="CATALOGO"' + (i.custoOrigem !== "DIRETORIA" ? " selected" : "") + '>Do catálogo (' + Lic_esc_(LicPr_moeda_(i.custoOrigem === "CATALOGO" ? i.custo : null)) + ')</option><option value="DIRETORIA"' + (i.custoOrigem === "DIRETORIA" ? " selected" : "") + ">Informado pela Diretoria</option></select></div>" +
      '<div><label for="lprCusto">Custo informado (R$ por equipamento)</label><input id="lprCusto" inputmode="decimal" value="' + Lic_esc_(i.custoOrigem === "DIRETORIA" ? LicPr_campo_(i.custoGravado) : "") + '"></div>' +
      '<div><label for="lprParc">Custo do parceiro (R$ por equipamento)</label><input id="lprParc" inputmode="decimal" value="' + Lic_esc_(LicPr_campo_(i.custoParceiro)) + '"></div>' +
      '<div><label for="lprDe">Vigência desde</label><input id="lprDe" type="date" value="' + Lic_esc_(i.vigenciaDesde) + '"></div>' +
      '<div><label for="lprAte">Vigência até (opcional)</label><input id="lprAte" type="date" value="' + Lic_esc_(i.vigenciaAte) + '"></div>' +
      '<div><label for="lprAtivo">Ativo</label><select id="lprAtivo"><option value="SIM"' + (i.ativo ? " selected" : "") + '>Sim</option><option value="NAO"' + (i.ativo ? "" : " selected") + ">Não</option></select></div>" +
      '<div class="lpr-largo"><label for="lprObs">Observações</label><textarea id="lprObs" rows="2" maxlength="2000">' + Lic_esc_(i.obs) + "</textarea></div>" + LicPr_motivoHtml_() + '</div><div id="lprMsg"></div>';
    var ov = Lic_janela_("Editar preço de licitação", corpo, '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lpr-gravar>Gravar versão nova</button>', origem);
    ov.querySelector("[data-lpr-gravar]").onclick = function () {
      var v = function (x) { var e = Lic_$_(x); return e ? e.value : ""; };
      var campos = { precoReferencia: v("lprPreco"), precoSituacao: v("lprSit"), execucao: v("lprExec"), custoParceiro: v("lprParc"), vigenciaDesde: v("lprDe"), vigenciaAte: v("lprAte"), ativo: v("lprAtivo"), obs: v("lprObs"),
        custo: v("lprCustoOrig") === "DIRETORIA" ? v("lprCusto") : "CATALOGO" };
      var bt = this; bt.disabled = true;
      LicPr_chamar_("itemSalvar", { id: id, campos: campos, motivo: v("lprMotivo") }, function (r) { ov.fechar(); Lic_toast_(r.texto || "Gravado."); LicPr_renderTabela_(); },
        function (m) { bt.disabled = false; Lic_$_("lprMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };
  }
  function LicPr_janelaVersoes_(id, origem) {
    var ov = Lic_janela_("Histórico do preço", '<div id="lprVers">' + Lic_carregando_(2) + "</div>", '<button type="button" class="btn-secondary" data-lic-cancelar>Fechar</button>', origem);
    LicPr_chamar_("itemVersoes", { id: id }, function (r) {
      var el = Lic_$_("lprVers"); if (!el) return;
      el.innerHTML = (r.versoes || []).length ? '<ul class="cm-hist" style="list-style:none;padding:0;margin:0">' + r.versoes.map(function (v) {
        return '<li style="padding:8px 0;border-bottom:1px solid var(--border)"><p class="cm-meta" style="margin:0"><b>Versão ' + Lic_esc_(v.versao) + "</b> · " + Lic_esc_(Lic_dataHora_(v.em)) + " · " + Lic_esc_(v.por) + (v.integra ? "" : ' · <span class="lpr-abaixo">registro alterado fora do sistema</span>') + '</p><p class="cm-txt" style="margin:4px 0">' + Lic_esc_(v.mudou) + '</p><p class="cm-meta" style="margin:0">Motivo: ' + Lic_esc_(v.motivo) + "</p></li>";
      }).join("") + "</ul>" : '<p class="cm-vazio">Sem versões.</p>';
    }, function (m) { var el = Lic_$_("lprVers"); if (el) el.innerHTML = Lic_faixa_(m, "erro"); });
    return ov;
  }
  function LicPr_janelaPolitica_(origem) {
    var p = (LICPR.tabela && LICPR.tabela.politica) || {};
    var corpo = '<p class="cm-txt">A sobra mínima de 35% é decisão do dono (não fica abaixo). Os demais são padrões adotados em 02/11/2026 e podem mudar aqui, com motivo e versão.</p><div class="lpr-grade">' +
      '<div><label for="lprMin">Sobra mínima, o piso (%)</label><input id="lprMin" inputmode="decimal" value="' + Lic_esc_(LicPr_campo_(p.margemMinPct)) + '"></div>' +
      '<div><label for="lprAlvo">Margem alvo (%)</label><input id="lprAlvo" inputmode="decimal" value="' + Lic_esc_(LicPr_campo_(p.margemAlvoPct)) + '"></div>' +
      '<div><label for="lprCom">Comissão (%)</label><input id="lprCom" inputmode="decimal" value="' + Lic_esc_(LicPr_campo_(p.comissaoPct)) + '"></div>' +
      '<div><label for="lprRio">UFs da equipe do Rio</label><input id="lprRio" value="' + Lic_esc_((p.ufsEquipeRio || []).join(", ")) + '"></div>' +
      '<div><label for="lprPorItem">Piso</label><select id="lprPorItem"><option value="SIM"' + (p.pisoPorItem ? " selected" : "") + '>Por item (nenhum item abaixo)</option><option value="NAO"' + (p.pisoPorItem ? "" : " selected") + ">Só no lote</option></select></div>" +
      '<div><label for="lprDiluir">Deslocamento e seguro</label><select id="lprDiluir"><option value="SIM"' + (p.diluir ? " selected" : "") + '>Diluídos no preço unitário</option><option value="NAO"' + (p.diluir ? "" : " selected") + ">Numa linha própria</option></select></div>" +
      LicPr_motivoHtml_() + '</div><div id="lprMsg"></div>';
    var ov = Lic_janela_("Política de preços de licitação", corpo, '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lpr-gravar>Gravar versão nova</button>', origem);
    ov.querySelector("[data-lpr-gravar]").onclick = function () {
      var v = function (x) { var e = Lic_$_(x); return e ? e.value : ""; }, bt = this; bt.disabled = true;
      LicPr_chamar_("politicaSalvar", { campos: { margemMinPct: v("lprMin"), margemAlvoPct: v("lprAlvo"), comissaoPct: v("lprCom"), ufsEquipeRio: v("lprRio"), pisoPorItem: v("lprPorItem"), diluir: v("lprDiluir") }, motivo: v("lprMotivo") },
        function (r) { ov.fechar(); Lic_toast_(r.texto || "Gravado."); LicPr_renderTabela_(); }, function (m) { bt.disabled = false; Lic_$_("lprMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };
  }
  function LicPr_janelaImportar_(origem) {
    var ov = Lic_janela_("Importar do catálogo (prévia)", '<div id="lprImp">' + Lic_carregando_(3) + '</div><div id="lprMsg"></div>', '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lpr-gravar disabled>Importar os marcados</button>', origem);
    var marca = "";
    LicPr_chamar_("importarPrevia", {}, function (r) {
      var el = Lic_$_("lprImp"); if (!el) return; marca = r.marca;
      var novos = (r.linhas || []).filter(function (l) { return l.acao === "NOVO"; });
      el.innerHTML = '<p class="cm-txt">' + Lic_esc_(novos.length) + " serviço(s) novo(s); " + Lic_esc_(r.jaNaTabela) + " já estão na tabela e ficam como estão (nada é sobrescrito)" + (r.foraNaoServico ? "; " + Lic_esc_(r.foraNaoServico) + " produto(s) e peça(s) ficam fora" : "") + ".</p>" +
        (novos.length ? novos.map(function (l) {
          return '<label class="lic-pessoa" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" data-lpr-cod="' + Lic_esc_(l.codigo) + '" checked style="min-width:22px;min-height:22px"><span><span class="lic-mono">' + Lic_esc_(l.codigo) + "</span> " + Lic_esc_(l.nome) +
            '<br><span class="cm-meta">Preço ' + Lic_esc_(LicPr_moeda_(l.preco)) + (l.aConfirmar ? " (" + Lic_esc_(l.aConfirmar) + ")" : "") + " · custo " + Lic_esc_(LicPr_moeda_(l.custo)) + " · " + Lic_esc_(l.execucao === "PARCEIRO" ? "parceiro" : "equipe própria") + "</span></span></label>";
        }).join("") : '<p class="cm-vazio">Nada novo para importar.</p>') + '<div class="lpr-grade">' + LicPr_motivoHtml_() + "</div>";
      var bt = ov.querySelector("[data-lpr-gravar]"); bt.disabled = !novos.length;
    }, function (m) { var el = Lic_$_("lprImp"); if (el) el.innerHTML = Lic_faixa_(m, "erro"); });
    ov.querySelector("[data-lpr-gravar]").onclick = function () {
      var cods = []; ov.querySelectorAll("[data-lpr-cod]").forEach(function (x) { if (x.checked) cods.push(x.getAttribute("data-lpr-cod")); });
      var bt = this; bt.disabled = true;
      LicPr_chamar_("importar", { marca: marca, codigos: cods, motivo: (Lic_$_("lprMotivo") || {}).value || "" }, function (r) { ov.fechar(); Lic_toast_(r.texto || "Importado."); LicPr_renderTabela_(); },
        function (m) { bt.disabled = false; Lic_$_("lprMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };
  }

  // ================= aba "Preço" da ficha =================
  function LicPr_htmlAbaPreco_(d) { return '<div id="licPreco" aria-live="polite">' + Lic_carregando_(3) + "</div>"; }
  function LicPr_ligarAbaPreco_(c, d, id) {
    var el = Lic_$_("licPreco"); if (!el) return;
    var st = LICPR.sims[id];
    if (st) { LicPr_desenharAba_(id); return; }
    LicPr_chamar_("simulacao", { id: id }, function (r) {
      LICPR.sims[id] = { dados: r, rascunho: JSON.parse(JSON.stringify(r.rascunho || { itens: [], execucao: {}, seguro: {} })), resultado: null, ver: 0, verSim: null, msg: "" };
      LicPr_desenharAba_(id);
    }, function (m) { el.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(el, function () { delete LICPR.sims[id]; LicPr_ligarAbaPreco_(c, d, id); }); });
  }
  function LicPr_opcoesTabela_(tab, atual) {
    var achou = false;
    var h = '<option value="">Escolha o serviço</option>' + (tab || []).map(function (t) { if (t.codigo === atual) achou = true; return '<option value="' + Lic_esc_(t.codigo) + '"' + (t.codigo === atual ? " selected" : "") + ">" + Lic_esc_(t.codigo + " · " + t.nome + (t.aConfirmar ? " (preço a confirmar)" : "")) + "</option>"; }).join("");
    if (atual && !achou) h += '<option value="' + Lic_esc_(atual) + '" selected>' + Lic_esc_(atual + " (fora da tabela)") + "</option>";
    return h;
  }
  function LicPr_htmlForm_(st) {
    var r = st.rascunho, x = r.execucao || {}, s = r.seguro || {}, tab = st.dados.tabela || [], porCod = {};
    tab.forEach(function (t) { porCod[t.codigo] = t; });

        st.resultado = r.simulacao.resultado; st.msg = r.texto; st.msgTipo = "ok"; LicPr_desenharAba_(id);
      }, function (m) { bt.disabled = false; Lic_$_("lprMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };

<style>
  /* =========================
     VISUAL "BANCADA" — paleta clara, menu grafite
     Tokens --bc-* são a fonte; os nomes antigos (--bg, --card, --text...)
     apontam para eles porque casca e módulos ainda os usam.
  ========================= */
  :root {
    color-scheme: light;

    /* Superfícies e linhas */
    --bc-bg: #F6F5F1;
    --bc-surface: #FFFFFF;
    --bc-surface-2: #FAF9F6;
    --bc-surface-3: #F1EFE9;
    --bc-line: #E2E0D8;
    --bc-line-2: #CFCCC1;
    --bc-line-soft: #ECEAE3;
    /* Texto */
    --bc-text: #1C1F1D;
    --bc-text-2: #4A4F4B;
    --bc-text-3: #5F645F;
    /* Marca e situações */
    --bc-brand: #3FAE49;
    --bc-action: #1F6B2A;
    --bc-action-hover: #185622;
    --bc-action-bg: #E8F2E5;
    --bc-action-line: #B9D3B3;
    --bc-danger: #A3261B;
    --bc-danger-bg: #FBEBE8;
    --bc-danger-line: #EBC2BC;
    --bc-warn: #7A5200;
    --bc-warn-bg: #FAF0D7;
    --bc-warn-line: #E6D3A2;
    --bc-info: #1E4F7A;
    --bc-info-bg: #E7EFF6;
    --bc-info-line: #BFD2E4;
    /* Menu lateral */
    --bc-side: #1C1F1D;
    --bc-side-2: #262A27;
    --bc-side-3: #303531;
    --bc-side-text: #DCDED9;
    --bc-side-muted: #9DA29C;
    /* Tipografia */
    --bc-sans: "Instrument Sans", "Segoe UI", Roboto, Arial, sans-serif;
    --bc-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

    /* Nomes usados pela casca e pelos módulos */
    --bg: var(--bc-bg);
    --bg-2: var(--bc-surface-3);
    --card: var(--bc-surface);
    --card-soft: var(--bc-surface-2);
    --panel: var(--bc-surface);
    --panel-2: var(--bc-surface-2);
    --panel-soft: var(--bc-surface-2);
    --surface: var(--bc-surface);
    --surface-2: var(--bc-surface-2);
    --surface-3: var(--bc-surface-3);
    --input: #FFFFFF;
    --input-hover: var(--bc-surface-2);
    --text: var(--bc-text);
    --text-strong: var(--bc-text);
    --muted: var(--bc-text-3);
    --muted-2: var(--bc-text-3);
    --border: var(--bc-line);
    --border-strong: var(--bc-line-2);
    --border-color: var(--bc-line);
    --accent: var(--bc-action);
    --accent-2: var(--bc-action);
    --accent-soft: var(--bc-action-bg);
    --accent-border: var(--bc-action-line);
    --azul-topo: var(--bc-side);
    --metrolabs: var(--bc-action);
    --metrolabs-dark: var(--bc-action-hover);
    --metrolabs-blue: var(--bc-info);
    --metro-green: var(--bc-action);
    --metro-green-dark: var(--bc-action-hover);
    --metro-blue: var(--bc-info);
    --metro-blue-dark: var(--bc-info);
    --metro-gold: var(--bc-warn);
    --success: var(--bc-action);
    --info: var(--bc-info);
    --warning: var(--bc-warn);
    --danger: var(--bc-danger);
    --success-bg: var(--bc-action-bg);
    --info-bg: var(--bc-info-bg);
    --warning-bg: var(--bc-warn-bg);
    --danger-bg: var(--bc-danger-bg);
    --pending: var(--bc-warn);
    --pending-bg: var(--bc-warn-bg);
    --salmao: var(--bc-warn-bg);
    --shadow: none;
    --shadow-soft: none;
    --shadow-hover: 0 1px 3px rgba(28,31,29,.08);
    --shadow-strong: 0 2px 8px rgba(28,31,29,.10);
    /* Bootstrap (telas que usam classes dele) */
    --bs-body-bg: var(--bc-bg);
    --bs-body-color: var(--bc-text);
    --bs-border-color: var(--bc-line);
    --bs-secondary-color: var(--bc-text-3);
    --bs-tertiary-bg: var(--bc-surface-2);
    --bs-secondary-bg: var(--bc-surface-3);
    --bs-emphasis-color: var(--bc-text);
    --bs-heading-color: var(--bc-text);
    --bs-link-color: var(--bc-action);
    --bs-link-color-rgb: 31,107,42;
    --bs-link-hover-color: var(--bc-action-hover);

    /* Geometria */
    --radius: 6px;
    --radius-sm: 4px;
    --input-h: 32px;
    --sidebar-w: 256px;
    --topbar-h: 56px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--bc-sans);
    background: var(--bc-bg);
    color: var(--bc-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    min-height: 100vh;
    font-size: 13px;
  }

  h1, h2, h3, h4, h5, h6,
  .title-area h1,
  .form-label,
  label,
  strong,
  .fw-bold {
    color: var(--text-strong) !important;
  }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  h3 { font-size: 14px; }

  p,
  .help,
  .field-help,
  .text-muted,
  .doc-meta,
  .panel-subtitle,
  .topo-subtitle,
  .title-area p,
  .loading-soft,
  small {
    color: var(--muted) !important;
    opacity: 1 !important;
  }

  a { color: var(--bc-action); }
  ::selection { background: var(--bc-action-bg); color: var(--bc-text); }
  code, kbd, samp, pre, time { font-family: var(--bc-mono); }
  :focus-visible { outline: 2px solid var(--bc-action); outline-offset: 1px; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--bc-line-2); border-radius: 6px; border: 2px solid var(--bc-bg); }

  img {
    max-width: 100%;
    display: block;
  }

  /* Trava global de tamanho pra checkbox/radio — sem isso, zoom do
     navegador ou configurações de acessibilidade do Windows (Alto
     Contraste, "Texto em negrito") fazem a caixinha aparecer enorme e
     desproporcional ao texto em qualquer módulo que não define seu
     próprio tamanho explícito (bug real encontrado no Frota/PGT e POP,
     2026-08-21). Vale pra TODOS os módulos nativos, atuais e futuros. */
  input[type="checkbox"],
  input[type="radio"] {
    width: 16px !important;
    height: 16px !important;
    min-width: 16px !important;
    min-height: 16px !important;
    max-width: 16px !important;
    max-height: 16px !important;
    margin: 0;
    accent-color: var(--metro-green);
    forced-color-adjust: none;
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
  }

  button {
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-height: var(--input-h);
    padding: 8px 12px;
    border: 1px solid var(--bc-line-2);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  /* campos: valem também dentro dos módulos */
  input,
  select,
  textarea,
  .form-control,
  .form-select {
    background-color: #FFFFFF !important;
    color: var(--bc-text) !important;
    -webkit-text-fill-color: var(--bc-text);
    border-color: var(--bc-line-2) !important;
    border-radius: 4px !important;
    box-shadow: none !important;
  }

  textarea {
    min-height: 80px;
    resize: vertical;
  }

  input:focus,
  select:focus,
  textarea:focus,
  .form-control:focus,
  .form-select:focus {
    border-color: var(--bc-action) !important;
    box-shadow: 0 0 0 3px rgba(31,107,42,.14) !important;
    outline: none !important;
  }

  input::placeholder,
  textarea::placeholder { color: #7A7F79 !important; -webkit-text-fill-color: #7A7F79; opacity: 1; }

  input:disabled,
  select:disabled,
  textarea:disabled {
    background-color: var(--bc-surface-3) !important;
    color: var(--bc-text-2) !important;
    -webkit-text-fill-color: var(--bc-text-2);
  }

  select option { background: #FFFFFF; color: var(--bc-text); }
  /* Fase 2 (16/10): sem caixa alta forçada nos títulos de seção, rótulos e listas de verificação
     dos módulos de calibração e documentos técnicos (o texto aparece como foi escrito). */
  :is(#tplCertCalContainer, #tplRelCalContainer, #tplDeclExecContainer, #tplDeclExecQIQOContainer, #tplNR13Container,
      #tplPlanCMEContainer, #tplCronExecContainer, #tplPgtPopContainer, #tplRegOpContainer, #tplInvContainer)
    :is(.panel h2, .section-divider, label, .form-label, .check-grid, .check-grid *, .checkbox-row label, h4, .doc-tipo, .ia-label, .resumo-label, .rotulo-mini, .inv-kpi-label) {
    text-transform: none !important;
    letter-spacing: 0 !important;
  }
  /* Casco dos módulos técnicos (JS_Core › SGO_cascoAjustar_) */
  details.sgo-detalhes-tecnicos { margin: 14px 0; border: 1px solid var(--bc-line-2); border-radius: 8px; padding: 8px 12px; background: #FFFFFF; }
  details.sgo-detalhes-tecnicos > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--bc-text-3); }
  details.sgo-detalhes-tecnicos .terminal, details.sgo-detalhes-tecnicos [id$="_terminalLog"] { max-height: 220px; overflow: auto; }
  .sgo-faixa-operacao { position: sticky; bottom: 12px; z-index: 50; display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 12px 0; padding: 12px 16px; border-radius: 8px; border: 2px solid var(--bc-warn); background: var(--bc-warn-bg, #FFF6E0); color: var(--bc-text); font-size: 13.5px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .sgo-faixa-operacao.is-erro { border-color: var(--bc-danger); background: var(--bc-danger-bg, #FDECEA); }
  .sgo-faixa-operacao button { flex: 0 0 auto; width: auto !important; }
  /* Seletor de arquivo em português (JS_Core › SGO_melhorarSeletorArquivo_) */
  .sgo-arquivo { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 100%; position: relative; }
  .sgo-arquivo .sgo-arquivo-nativo { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; overflow: hidden; pointer-events: none; padding: 0 !important; border: 0 !important; margin: 0 !important; }
  .sgo-arquivo .sgo-arquivo-btn { width: auto !important; padding: 6px 14px; font-size: 13px; }
  .sgo-arquivo .sgo-arquivo-nome { font-size: 12.5px; color: var(--bc-text-3); overflow-wrap: anywhere; }
  input[type="file"]::file-selector-button { background: #FFFFFF; color: var(--bc-text); border: 1px solid var(--bc-line-2); border-radius: 4px; padding: 3px 10px; margin-right: 8px; font-family: inherit; }
  input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #FFFFFF inset !important; -webkit-text-fill-color: var(--bc-text) !important; }

  label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 700;
    /* Fase 2 (16/10): sem caixa alta forçada; o texto aparece como foi escrito. */
    text-transform: none;
    letter-spacing: 0;
    color: var(--bc-text-2);
    text-align: left;
  }
  /* Opções de marcar/escolher (checkbox e rádio) são frases: peso normal. */
  label:has(> input[type="checkbox"]), label:has(> input[type="radio"]) { font-weight: 500; font-size: 13px; color: var(--bc-text); }

  /* =========================
     LOGIN
  ========================= */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 0;
    background: var(--bc-bg);
  }

  .login-split {
    width: 100%;
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  .login-welcome {
    position: relative;
    flex: 0 0 45%;
    min-height: 100vh;
    padding: 56px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: var(--bc-side);
  }

  /* régua discreta na base do bloco grafite */
  .login-welcome-shapes {
    position: absolute;
    inset: auto 56px 56px 56px;
    height: 10px;
    pointer-events: none;
    background: repeating-linear-gradient(90deg, #6B706B 0 1px, transparent 1px 8px);
    opacity: .8;
  }

  .login-welcome-text {
    position: relative;
    z-index: 1;
  }

  .login-welcome-text h2 {
    margin: 0 0 12px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: #F6F5F1 !important;
  }

  .login-welcome-text p {
    margin: 0;
    max-width: 420px;
    font-size: 16px;
    line-height: 1.6;
    color: #C9CCC6 !important;
  }

  .login-card {
    flex: 1 1 54%;
    width: 100%;
    position: relative;
    background: var(--bc-bg);
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .login-card > * { width: 100%; max-width: 400px; }

  @media (max-width: 760px) {
    .login-welcome { display: none; }
    .login-card { padding: 40px 16px; }
  }

  .login-title-wrap {
    text-align: left;
    margin-bottom: 28px;
  }

  .login-title {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--bc-text);
  }

  .login-title span {
    color: var(--bc-text);
  }

  .login-subtitle {
    margin: 10px 0 0;
    font-size: 14px;
    color: var(--bc-text-3) !important;
  }

  .login-form {
    width: 100%;
  }

  .login-form label {
    color: var(--bc-text) !important;
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px !important;
    font-weight: 600;
  }

  .login-form input {
    height: 46px;
    font-size: 14px !important;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .login-actions {
    margin-top: 28px;
  }

  .login-actions button {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 4px;
    background: var(--bc-action);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    box-shadow: none;
  }

  .login-actions button:hover {
    background: var(--bc-action-hover);
  }

  /* =========================
     APP BASE & LAYOUT
  ========================= */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bc-bg);
  }

  .main-layout {
    flex: 1;
    display: flex;
    min-height: calc(100vh - var(--topbar-h));
    background: var(--bc-bg);
  }

  /* =========================
     BARRA SUPERIOR (branca, filete na base)
  ========================= */
  .topbar {
    min-height: var(--topbar-h);
    background: #FFFFFF;
    color: var(--bc-text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--bc-line);
    position: relative;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .topbar-logo-block {
    background: transparent;
    border-radius: 10px;
    padding: 4px 8px 4px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 60px;
    transition: transform 0.18s ease;
  }

  .topbar-logo-block:hover {
    transform: translateY(-1px);
  }

  .topbar-logo-block:active {
    transform: scale(0.97);
  }

  .topbar-logo,
  #logoTopo {
    display: block;
    height: 48px;
    width: auto;
    object-fit: contain;
    background: transparent;
    padding: 0;
    margin: 0;
  }

  .topbar-brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .topbar-title {
    font-size: 21px;
    font-weight: 700;
    color: var(--bc-text);
    letter-spacing: -.01em;
    line-height: 1.1;
  }

  .topbar-title-plus { color: var(--bc-brand); }

  .topbar-subtitle {
    font-size: 10.5px;
    color: var(--bc-text-3);
    line-height: 1;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .topbar-center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mensagem-motivacional {
    padding: 5px 14px;
    color: var(--bc-text-3);
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    font-style: italic;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
  }

  .topbar-info-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 8px;
    text-align: right;
  }

  .relogio-texto {
    font-family: var(--bc-mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--bc-text-2);
  }

  .status-produtivo {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .4px;
    color: var(--bc-action);
    padding: 0;
    text-transform: uppercase;
  }

  .user-action-block {
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 1px solid var(--bc-line);
    padding-left: 16px;
  }

  .user-info {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--bc-text);
  }

  .btn-logout {
    height: 32px;
    padding: 0 16px;
    border-radius: 4px;
    background: #FFFFFF;
    color: var(--bc-text);
    font-weight: 600;
    font-size: 12px;
    border: 1px solid var(--bc-line-2);
  }

  .btn-logout:hover {
    background: var(--bc-surface-2);
    border-color: var(--bc-text-3);
  }

  /* =========================
     MENU LATERAL (bloco grafite)
  ========================= */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bc-side);
    color: var(--bc-side-text);
    padding: 20px 12px;
    overflow-y: auto;
  }

  .sidebar-section + .sidebar-section {
    margin-top: 24px;
  }

  .sidebar-section-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    font-weight: 600;
    color: var(--bc-side-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
    padding: 10px 10px 5px;
  }

  .sidebar-section-title::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--bc-brand);
  }

  .menu-btn {
    width: 100%;
    min-height: 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 7px 10px;
    margin: 1px 0;
    border-radius: 4px;
    background: transparent;
    border-left: 3px solid transparent;
    color: var(--bc-side-text);
    font-size: 12.5px;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .menu-btn-icon {
    flex: 0 0 auto;
    font-size: 13px;
    line-height: 1;
    opacity: 0.9;
  }
  .menu-btn .menu-btn-icon,
  .menu-btn i { color: var(--bc-side-muted); }

  /* Balão de alerta em botões do menu lateral (ex.: padrões de
     referência vencendo/vencidos no Certificado de Calibração) —
     contador, só aparece quando há algo pra avisar. */
  .menu-badge {
    flex: 0 0 auto;
    margin-left: auto;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: transparent;
    color: #F2B8B0;
    border: 1px solid #8A3A31;
    font-family: var(--bc-mono);
    font-size: 11px;
    font-weight: 500;
    line-height: 18px;
    text-align: center;
    display: none;
  }
  .menu-badge.is-visible { display: inline-block; }

  .menu-btn:hover {
    background: var(--bc-side-2);
    color: #FFFFFF;
  }

  .menu-btn.active {
    font-weight: 600;
    border-left-color: var(--bc-brand);
    background: var(--bc-side-3);
    color: #FFFFFF;
  }
  .menu-btn.active .menu-btn-icon,
  .menu-btn.active i { color: #FFFFFF; }

  /* =========================
     ÁREA DE CONTEÚDO
  ========================= */
  .content-area {
    flex: 1;
    min-width: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bc-bg);
    color: var(--bc-text);
  }

  .content-panel {
    flex: 1;
    background: var(--bc-bg);
    min-height: 480px;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  /* =========================
     ALERTAS / AVISOS E BALÕES
  ========================= */
  .alert-bar {
    background: var(--bc-warn-bg);
    border: 1px solid var(--bc-warn-line);
    color: var(--bc-warn);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    border-left: 4px solid var(--bc-warn);
  }

  /* faixa antiga "Módulo atual: X" (#areaAvisos, preenchida por atualizarBadgeModulo_): continua escondida.
     A classe .avisos-wrap é usada também em mensagens de módulo (ex.: "links ainda não configurados"
     em renderMotorModulo_); até 16/10/2026 ela era escondida junto e a mensagem sumia. Agora só o id some. */
  #areaAvisos { display: none !important; }
  .avisos-wrap {
    background: var(--bc-warn-bg);
    border: 1px solid var(--bc-warn-line);
    border-left: 4px solid var(--bc-warn);
    color: var(--bc-warn);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0;
  }

  /* =========================
     DASHBOARD (KPIs)
  ========================= */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }

  .card-kpi {
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 20px;
    transition: transform 0.2s ease;
  }

  .card-kpi:hover {
    transform: translateY(-2px);
  }

  .card-kpi-title {
    font-size: 12px;
    color: var(--bc-text-3);
    margin-bottom: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .card-kpi-value {
    font-family: var(--bc-mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--bc-text);
  }

  .content-title {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.015em;
    color: var(--bc-text);
  }

  .content-title::before,
  .section-card-title::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 999px;
    background: var(--bc-brand);
    vertical-align: middle;
  }

  .content-subtitle {
    margin: 0 0 16px;
    font-size: 13.5px;
    color: var(--bc-text-3);
  }

  .dashboard-alertas-container {
    margin-top: 20px;
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 20px;
  }

  /* cartões: branco, linha fina, sem sombra (valem também dentro dos módulos) */
  .topo,
  .header-card,
  .card,
  .dashboard-card,
  .panel,
  .action-bar,
  .modal-content,
  .item-card,
  .insumo-card,
  .ensaio-card,
  .nr13-card,
  .doc-item,
  .radio-status-card,
  .step-summary,
  .ml-dialog,
  .ml-box,
  .kpi,
  .receita-item {
    background: #FFFFFF !important;
    background-image: none !important;
    border-color: var(--bc-line) !important;
    color: var(--bc-text) !important;
    box-shadow: none !important;
  }
  .panel h2::before,
  h4::before,
  .step h4::before,
  .topo::before,
  .header-card::before {
    background: var(--bc-brand) !important;
    background-image: none !important;
    box-shadow: none !important;
  }
  .terminal {
    background: var(--bc-surface-2) !important;
    color: var(--bc-text) !important;
    border: 1px solid var(--bc-line) !important;
    font-family: var(--bc-mono);
  }
  .terminal-header {
    background: var(--bc-surface-3) !important;
    color: var(--bc-text-2) !important;
    border-color: var(--bc-line) !important;
  }
  #placeholderStatus,
  .ph-chip {
    background: var(--bc-surface-2) !important;
    color: var(--bc-text-2) !important;
    border-color: var(--bc-line) !important;
    font-family: var(--bc-mono);
  }

  /* =========================
     BOTÕES PRINCIPAIS E FORMULÁRIOS
  ========================= */
  .module-shell {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1; 
    padding: 4px 0 18px;
    border-radius: var(--radius);
  }

  .module-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--bc-text);
  }

  .module-header-left {
    min-width: 240px;
  }

  .module-header-right {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar-search {
    max-width: 300px;
    min-width: 220px;
    height: 36px;
    min-height: 36px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
  }

  .btn-primary,
  .btn-secondary,
  .btn-danger,
  .btn-warning,
  .btn-success,
  .btn-info {
    min-height: 36px;
    height: 36px;
    padding: 0 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* ação principal: verde escuro sólido */
  .btn-primary,
  .btn-success,
  .btn-download,
  .mobile-btn-salvar,
  .mobile-fab {
    background: var(--bc-action) !important;
    border: 1px solid var(--bc-action) !important;
    color: #FFFFFF !important;
    border-radius: 4px;
    font-weight: 600;
    box-shadow: none !important;
  }
  .btn-primary:hover,
  .btn-success:hover,
  .btn-download:hover,
  .mobile-btn-salvar:hover { background: var(--bc-action-hover) !important; border-color: var(--bc-action-hover) !important; }

  /* ação secundária: branco com contorno */
  .btn-secondary,
  .btn-light,
  .btn-outline-secondary,
  .btn-outline-success,
  .tab-btn,
  .topo-action,
  .mobile-btn-cancelar,
  .mobile-topbar-btn {
    background: #FFFFFF !important;
    border: 1px solid var(--bc-line-2) !important;
    color: var(--bc-text) !important;
    border-radius: 4px;
    font-weight: 600;
    box-shadow: none !important;
  }
  .btn-secondary:hover,
  .btn-light:hover,
  .btn-outline-secondary:hover,
  .tab-btn:hover:not(.active),
  .topo-action:hover { background: var(--bc-surface-2) !important; border-color: var(--bc-text-3) !important; }
  .tab-btn.active { background: var(--bc-text) !important; border-color: var(--bc-text) !important; color: #FFFFFF !important; }
  .btn-outline-success { color: var(--bc-action) !important; border-color: var(--bc-action-line) !important; }

  .btn-danger { background: var(--bc-danger) !important; border: 1px solid var(--bc-danger) !important; color: #FFFFFF !important; border-radius: 4px; box-shadow: none !important; }
  .btn-outline-danger { background: #FFFFFF !important; border: 1px solid var(--bc-danger-line) !important; color: var(--bc-danger) !important; box-shadow: none !important; }
  .btn-warning { background: var(--bc-warn-bg) !important; border: 1px solid var(--bc-warn-line) !important; color: var(--bc-warn) !important; }
  .btn-info { background: var(--bc-info-bg) !important; border: 1px solid var(--bc-info-line) !important; color: var(--bc-info) !important; }
  .btn-dark { background: var(--bc-text); border: 1px solid var(--bc-text); color: #FFFFFF; }

  button:hover,
  .btn:hover,
  .menu-btn:hover,
  .topo-action:hover,
  .tab-btn:hover,
  .btn-download:hover {
    filter: none !important;
    transform: none !important;
    background-image: none !important;
  }

  .module-grid {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .form-card {
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 20px;
  }

  .list-card {
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 0;
    overflow: hidden;
  }

  .section-card-title {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
    color: var(--bc-text);
    border-bottom: 1px solid var(--bc-line);
    padding-bottom: 10px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .form-grid .full {
    grid-column: 1 / -1;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--bc-line);
  }

  /* =========================
     TABELAS (Mais Densas)
  ========================= */
  /* tabelas: valem também dentro dos módulos */
  table { border-color: var(--bc-line) !important; }
  th,
  thead {
    background: #FFFFFF !important;
    color: var(--bc-text-2) !important;
    font-weight: 600;
    border-color: var(--bc-line) !important;
    border-bottom: 1px solid var(--bc-line-2) !important;
    text-shadow: none;
  }
  td { border-color: var(--bc-line-soft) !important; }
  tr:hover,
  tbody tr:hover { background: var(--bc-surface-2) !important; }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    background: #FFFFFF !important;
    border-color: var(--bc-line);
  }

  .table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
    font-size: 13px;
    background: #FFFFFF !important;
  }

  .table thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    text-align: left;
    padding: 12px 14px;
    white-space: nowrap;
    font-size: 12px;
    text-transform: uppercase;
  }

  .table tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--bc-line-soft);
    vertical-align: middle;
    color: var(--bc-text) !important;
    background: transparent;
  }

  .table tbody tr:hover td {
    background: var(--bc-surface-2) !important;
  }

  .table-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* Fase 2 (16/10): na lista ao lado do formulário a coluna Ações ficava cortada ("Inativ", "QR C").
     Os botões ficam um embaixo do outro e as colunas de texto quebram linha. */
  .list-card .table td .table-actions { display: grid; grid-template-columns: 1fr; gap: 4px; min-width: 88px; }
  .list-card .table td .table-actions button { width: 100%; }
  .list-card .table td { overflow-wrap: anywhere; }

  .table-actions button {
    min-height: 28px;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 700;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .badge-ativo { background: var(--bc-action-bg) !important; color: var(--bc-action) !important; border-color: var(--bc-action-line); }
  .badge-pendente { background: var(--bc-warn-bg) !important; color: var(--bc-warn) !important; border-color: var(--bc-warn-line); }
  .badge-bloqueado { background: var(--bc-danger-bg) !important; color: var(--bc-danger) !important; border-color: var(--bc-danger-line); }
  .badge-inativo { background: var(--bc-surface-3) !important; color: var(--bc-text-2) !important; border-color: var(--bc-line); }
  .status-badge,
  .badge-soft,
  .profile-badge,
  .ph-chip { border-radius: 4px; }

  /* mensagens e selos: valem também dentro dos módulos */
  .alert-box,
  .alert-bar { border-radius: 6px; }
  .alert-warning,
  .alert-box.warning {
    background: var(--bc-warn-bg) !important;
    color: var(--bc-warn) !important;
    border-color: var(--bc-warn-line) !important;
  }
  .alert-info,
  .alert-box.info {
    background: var(--bc-info-bg) !important;
    color: var(--bc-info) !important;
    border-color: var(--bc-info-line) !important;
  }
  .alert-danger,
  .alert-box.error {
    background: var(--bc-danger-bg) !important;
    color: var(--bc-danger) !important;
    border-color: var(--bc-danger-line) !important;
  }
  .alert-success,
  .alert-box.success,
  .status-badge,
  .badge-soft,
  .profile-badge {
    background: var(--bc-action-bg) !important;
    color: var(--bc-action) !important;
    border-color: var(--bc-action-line) !important;
  }
  .status-badge.is-danger { background: var(--bc-danger-bg) !important; color: var(--bc-danger) !important; border-color: var(--bc-danger-line) !important; }
  .status-badge.is-warning { background: var(--bc-warn-bg) !important; color: var(--bc-warn) !important; border-color: var(--bc-warn-line) !important; }
  .status-badge.is-neutral { background: var(--bc-surface-3) !important; color: var(--bc-text-2) !important; border-color: var(--bc-line) !important; }
  #perfWidget { color: var(--bc-action) !important; background: transparent !important; }

  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: var(--bc-text-3);
    font-size: 14px;
    font-weight: 500;
  }

  .helper-text {
    margin-top: 10px;
    font-size: 12px;
    color: var(--bc-text-3);
  }

  /* =========================
     MODAL BASE E QR CODE
  ========================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,31,29,.42) !important;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 9999;
  }

  .modal-card {
    width: 100%;
    max-width: 480px;
    background: #FFFFFF;
    color: var(--bc-text);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(28,31,29,.14);
    border: 1px solid var(--bc-line);
    overflow: hidden;
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--bc-line);
    background: transparent !important;
  }

  .modal-title {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--bc-text);
  }

  .modal-body {
    padding: 20px;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--bc-line);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: transparent !important;
  }
  .card-body,
  .section-divider,
  .card-note { background: transparent !important; border-color: var(--bc-line) !important; }

  /* Otimizado para melhorar a leitura do QR na impressão */
  .qr-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
    background: #fff;
  }

  .qr-image {
    width: 220px;
    height: 220px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px;
    background: #fff;
    margin-bottom: 16px;
    image-rendering: pixelated; 
  }

  .qr-info {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .qr-info strong {
    color: var(--metro-blue);
  }

  /* =========================
     MOTORES DE ENGENHARIA (ABAS E IFRAMES)
  ========================= */
  .motores-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: transparent;
  }

  .motores-tab-btn {
    flex: 1;
    min-height: 42px;
    border-radius: 4px;
    background: #FFFFFF;
    color: var(--bc-text);
    font-weight: 600;
    font-size: 14px;
    border: 1px solid var(--bc-line-2);
  }

  .motores-tab-btn:hover:not(.active) {
    background: var(--bc-surface-2);
    border-color: var(--bc-text-3);
  }

  .motores-tab-btn.active {
    background: var(--bc-text);
    color: #FFFFFF;
    border-color: var(--bc-text);
  }

  /* casca do módulo: sem cartão em volta do cartão, o conteúdo assenta no fundo */
  .iframe-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 640px;
    border-radius: var(--radius);
  }

  /* Autoclave/Lavadora nativos (sem iframe) — NAO reaproveitar
     .iframe-container aqui: aquela classe forca min-height:640px e fundo
     escuro mesmo vazia, o que faz o container parecer uma "caixa preta"
     antes do JS terminar de desenhar o formulario (ou se o JS falhar por
     algum motivo). Esta classe deixa o container com altura natural e um
     texto de "Carregando..." visivel por padrao, ate o JS substituir o
     conteudo de verdade — assim da pra saber so de olhar se o JS rodou. */
  .native-module-container {
    min-height: 80px;
    padding: 24px 0;
    color: var(--bc-text);
    font-size: 14px;
    border-radius: var(--radius);
  }

  iframe {
    width: 100%;
    flex: 1;
    border: none;
    border-radius: var(--radius);
  }

  /* =========================
     RESPONSIVO (MOBILE E TABLET)
  ========================= */
  
  /* Tablete e Telas Médias */
  @media (max-width: 1200px) {
    .dashboard-grid {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }
    .module-grid {
      /* Em telas médias, a proporção do formulário e tabela se ajusta */
      grid-template-columns: minmax(320px, 35%) minmax(0, 1fr);
    }
  }

  /* Dispositivos Móveis e Tablets Verticais */
  @media (max-width: 900px) {
    
    /* Layout principal empilha */
    .main-layout {
      flex-direction: column;
    }

    /* Menu lateral vira um carrossel na parte superior */
    .sidebar {
      width: 100%;
      border-bottom: 1px solid var(--bc-side-3);
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      justify-content: center;
    }

    .sidebar-section {
      display: contents; /* Ignora o contêiner e alinha os itens */
    }

    .sidebar-section-title {
      display: none; /* Esconde os títulos "Módulos", "Config" no mobile */
    }

    .menu-btn {
      width: auto;
      border-radius: var(--radius-sm);
      margin: 0;
      padding: 8px 16px;
      min-height: 36px;
      text-align: center;
    }

    .content-area {
      padding: 16px;
    }

    /* O grid Módulo desfaz a coluna dupla: Formulário em cima, Tabela embaixo */
    .module-grid {
      grid-template-columns: 1fr;
    }
  }

  /* =========================
     MODO MOBILE — tela inicial dedicada (grade de ícones)
     Ver JS_Core.html: exibirAppLogado_() / renderMobileHome_().
     Mais específico que o responsivo acima, então some com o
     carrossel de botões da sidebar quando .modo-mobile está ativo.
  ========================= */
  .app-shell.modo-mobile .sidebar {
    display: none !important;
  }

  /* Some com o cabeçalho desktop (logo/data/status) — a barra própria
     do mobile (.mobile-topbar, ver abaixo) substitui isso. */
  .app-shell.modo-mobile #topo {
    display: none !important;
  }

  /* Reset defensivo de largura: garante que nada herdado do layout
     desktop (min-width, larguras fixas de grid, etc.) force scroll
     horizontal / necessidade de dar zoom out no celular. */
  .app-shell.modo-mobile,
  .app-shell.modo-mobile .main-layout,
  .app-shell.modo-mobile .content-area,
  .app-shell.modo-mobile .content-panel {
    width: 100%;
    min-width: 0;
    max-width: 100vw;
    box-sizing: border-box;
  }
  .app-shell.modo-mobile .content-area {
    /* !important necessário: a regra global de "densidade compacta"
       (".content-area { padding: 18px 22px !important }", mais abaixo
       no arquivo) também usa !important e sobrescrevia esse espaçamento —
       era por isso que o conteúdo aparecia cortado atrás da barra fixa
       do topo no mobile, mesmo depois de reservar o espaço aqui. */
    padding: 64px 12px 12px !important;
    overflow-x: hidden;
  }

  /* position:fixed (não sticky) — a barra fica no HTML depois do conteúdo
     principal, então "sticky" só gruda no topo depois de um scroll que,
     em telas curtas (lista vazia, formulário pequeno), nunca acontece; a
     barra ficava "solta" no fim da página, atrás do botão flutuante de
     retirar veículo. Fixed trava no topo sempre, sem depender de altura
     de conteúdo nem de scroll — mesma técnica já usada em .mobile-fab. */
  .mobile-topbar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 400;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: #FFFFFF;
    border-top: 1px solid var(--bc-line);
    border-bottom: 1px solid var(--bc-line);
  }
  .app-shell.modo-mobile .mobile-topbar {
    display: flex;
  }
  .mobile-topbar-titulo {
    flex: 1;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    color: var(--text-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mobile-topbar-btn {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mobile-topbar-sair {
    border-color: var(--bc-danger);
    color: var(--bc-danger);
  }

  /* Listas mobile (Clientes/Unidades/Equipamentos/Documentos) */
  .mobile-search {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-strong);
    font-size: 15px;
    box-sizing: border-box;
  }
  .mobile-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 80px; /* espaço pro FAB não cobrir o último item */
  }
  .mobile-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    background: #FFFFFF;
    color: var(--bc-text);
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    text-align: left;
  }
  .mobile-card:active {
    transform: scale(.98);
  }
  .mobile-card-titulo {
    font-weight: 800;
    font-size: 15px;
    color: var(--text-strong);
  }
  .mobile-card-subtitulo {
    font-size: 13px;
    color: var(--muted);
  }
  .mobile-card-status {
    align-self: flex-start;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bc-action-bg);
    color: var(--bc-action);
  }
  .mobile-card-status.inativo {
    background: var(--bc-danger-bg);
    color: var(--bc-danger);
  }

  /* Faixa do farol do Programa de Conduta — home mobile + tela do
     módulo Conduta (2026-09-02). Cor da borda é setada inline via JS
     (verde/amarelo/vermelho, mesma paleta do farol). */
  .mobile-farol-strip {
    background: var(--card-soft);
    border: 1px solid var(--border);
    border-left: 6px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-strong);
  }
  .mobile-farol-strip .farol-gauge-mini { width: 46px; flex: 0 0 auto; }
  .mobile-farol-strip .farol-mini-linha { display: flex; align-items: center; gap: 10px; }

  /* Gauge/sinaleiro do Programa de Conduta (2026-09-02) — card com
     velocímetro de ICO, usado no dashboard principal, no card do
     módulo e nas telas mobile. Cor do "eyebrow"/glow é setada via
     --farol-cor inline (var(--success)/var(--warning)/var(--danger)). */
  .farol-card {
    --farol-cor: var(--success);
    background: #FFFFFF;
    color: var(--bc-text);
    border: 1px solid var(--bc-line);
    border-radius: 6px;
    padding: 16px 20px 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .farol-gauge-wrap { flex: 0 0 auto; width: 128px; position: relative; z-index: 1; }
  .farol-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .farol-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--farol-cor);
    margin-bottom: 6px;
  }
  .farol-eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--farol-cor); }
  .farol-titulo { font-size: 16.5px; font-weight: 800; margin: 0 0 4px; color: var(--text-strong); letter-spacing: -.01em; }
  .farol-linha { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; }
  .farol-legenda { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .farol-legenda span { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); font-weight: 600; }
  .farol-legenda i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  @media (max-width: 900px) {
    .farol-card { flex-direction: column; align-items: flex-start; gap: 10px; }
    .farol-gauge-wrap { width: 108px; align-self: center; }
  }

  .mobile-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 450;
    height: 48px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Formulário mobile — campos sempre empilhados, nunca lado a lado */
  .mobile-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 24px;
  }
  .mobile-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .mobile-field label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: none;
  }
  .mobile-field input,
  .mobile-field select,
  .mobile-field textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-strong);
    font-size: 15px;
    box-sizing: border-box;
  }
  .mobile-form-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mobile-form-actions button {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  /* Frota mobile — operação enxuta (retirar/devolver veículo) */
  .mobile-frota-alerta {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .mobile-frota-alerta.critico {
    background: var(--bc-danger-bg);
    color: var(--bc-danger);
    border: 1px solid var(--bc-danger);
  }
  .mobile-frota-alerta.aviso {
    background: var(--bc-warn-bg);
    color: var(--bc-warn);
    border: 1px solid var(--bc-warn-line);
  }
  .mobile-frota-secao-titulo {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 8px;
  }
  .mobile-frota-check-grupo {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--bc-action);
    text-transform: uppercase;
    margin: 14px 0 6px;
  }
  .mobile-frota-check-item {
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .mobile-frota-check-item .linha {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mobile-frota-check-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .mobile-frota-check-item label {
    flex: 1;
    font-size: 14px;
    color: var(--text-strong);
  }
  .mobile-frota-check-obs {
    display: none;
    margin-top: 6px;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--bc-danger);
    border-radius: var(--radius-sm);
    background: var(--card-soft);
    color: var(--text-strong);
    font-size: 13px;
    box-sizing: border-box;
  }
  .mobile-frota-check-item.nao-conforme {
    background: var(--bc-danger-bg);
  }
  .mobile-frota-check-item.nao-conforme .mobile-frota-check-obs {
    display: block;
  }
  .mobile-frota-fotos {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }
  .mobile-frota-foto-thumb {
    width: 100px;
  }
  .mobile-frota-foto-thumb img {
    width: 100%;
    height: 80px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .mobile-frota-foto-thumb input {
    width: 100%;
    margin-top: 4px;
    padding: 6px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-soft);
    color: var(--text-strong);
    box-sizing: border-box;
  }
  .mobile-frota-foto-thumb button {
    width: 100%;
    margin-top: 4px;
    padding: 4px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid var(--bc-danger);
    background: transparent;
    color: var(--bc-danger);
  }

  /* Pontos de medição do wizard mobile de Certificado de Calibração
     (nominal + 3 leituras por ponto, dentro de um bloco de ensaio). */
  .mobile-ponto-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    margin-bottom: 8px;
    background: var(--card-soft);
  }
  .mobile-ponto-linha {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .mobile-ponto-linha input {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    color: var(--text-strong);
    font-size: 13px;
  }
  .mobile-ponto-remover {
    flex-shrink: 0;
    padding: 8px 10px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid var(--bc-danger);
    background: transparent;
    color: var(--bc-danger);
  }
  .mobile-ponto-leituras {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .mobile-ponto-leituras input {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    color: var(--text-strong);
    font-size: 13px;
    text-align: center;
  }

  .mobile-home-titulo {
    text-align: center;
    margin: 20px 0 12px;
    color: var(--text-strong);
    font-size: 18px;
    font-weight: 800;
  }

  .mobile-home-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 480px;
    margin: 0 auto 20px;
    padding: 4px;
  }

  .mobile-home-tile {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #FFFFFF;
    color: var(--bc-text);
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    cursor: pointer;
    padding: 12px;
    text-align: center;
    transition: transform .15s ease, border-color .15s ease;
  }
  .mobile-home-tile:active {
    transform: scale(.96);
    border-color: var(--accent);
  }
  .mobile-home-tile .icone {
    font-size: 40px;
    line-height: 1;
  }
  .mobile-home-tile .legenda {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-strong);
    line-height: 1.25;
  }

  /* Celulares (Telas Pequenas) */
  @media (max-width: 640px) {
    
    /* O cabeçalho se ajusta e empilha a pílula de logo e usuário */
    .topbar {
      flex-wrap: wrap;
      min-height: auto;
      padding: 16px;
      gap: 12px;
      justify-content: center;
    }

    .topbar-left, .topbar-right {
      min-width: 100%;
      justify-content: center;
    }

    .topbar-center {
      display: none; /* Esconde frase motivacional na barra superior */
    }
    
    /* A linha divisória do usuário no cabeçalho some */
    .user-action-block {
      border-left: none;
      padding-left: 0;
      justify-content: space-between;
      width: 100%;
    }

    .dashboard-grid {
      grid-template-columns: 1fr; /* Dashboard com 1 coluna só */
    }

    /* O cabeçalho dos módulos empilha */
    .module-header {
      flex-direction: column;
      align-items: stretch;
    }

    .module-header-right {
      flex-direction: column;
      align-items: stretch;
    }

    .module-header-right > div {
      flex-direction: column;
    }

    .toolbar-search {
      max-width: 100%;
      width: 100%;
    }

    /* Botões tomam 100% da largura na versão mobile */
    .btn-primary, .btn-secondary, .btn-danger, .btn-warning, .btn-success, .btn-info {
      width: 100%;
    }

    /* Corrige a exibição da Grid no form (ex: cliente, unidade) */
    .form-grid {
      grid-template-columns: 1fr; /* Tudo 1 em cima do outro */
    }
    
    .form-actions {
      flex-direction: column;
    }

    /* Abas de motores na vertical */
    .motores-tabs {
      flex-direction: column;
    }

    .modal-card {
      width: 95%;
      margin: 10px;
    }
  }

  /* =========================================================================
     DASHBOARD "CONSULTÓRIO" — grid de widgets
     ========================================================================= */
  .dashc-grid-top {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) minmax(260px, 1.2fr) minmax(180px, .8fr);
    gap: 16px;

  .dashc-stats { display: flex; flex-direction: column; gap: 12px; }

  .dashc-stat {
    display: flex; align-items: center; gap: 14px;
    background: #FFFFFF; border: 1px solid var(--bc-line); color: var(--bc-text);
    border-radius: 6px; padding: 16px 18px;
  }
  .dashc-stat-icon {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: var(--bc-surface-3); color: var(--bc-text-2);
  }
  .dashc-stat-icon.azul { background: var(--bc-info-bg); color: var(--bc-info); }
  .dashc-stat-icon.verde { background: var(--bc-action-bg); color: var(--bc-action); }
  .dashc-stat-icon.roxo { background: var(--bc-surface-3); color: var(--bc-text-2); }
  .dashc-stat-icon.amarelo { background: var(--bc-warn-bg); color: var(--bc-warn); }

  /* ---- Toast de notificação de atendimento (Auvo) ---- */
  .auvo-toast-container {
    position: fixed; right: 18px; bottom: 18px; z-index: 99999;
    display: flex; flex-direction: column; gap: 10px; max-width: 340px;
    pointer-events: none;
  }
  .auvo-toast {
    display: flex; align-items: flex-start; gap: 10px;
    background: #FFFFFF; border: 1px solid var(--bc-line); border-left: 3px solid var(--bc-action); border-radius: 6px;
    box-shadow: 0 6px 20px rgba(28,31,29,.12);
    padding: 12px 14px; cursor: pointer; pointer-events: auto;
    animation: auvoToastEntrar .3s ease-out;
  }
  .auvo-toast.auvo-toast-saindo { animation: auvoToastSair .35s ease-in forwards; }
  .auvo-toast-erro { border-left-color: var(--bc-danger); }
  .auvo-toast-icone { font-size: 20px; line-height: 1; }
  .auvo-toast-titulo { font-weight: 700; font-size: 13px; color: var(--bc-text); }
  .auvo-toast-detalhe { font-size: 12px; color: var(--bc-text-3); margin-top: 2px; }
  @keyframes auvoToastEntrar {
    from { transform: translateY(16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes auvoToastSair {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(10px); opacity: 0; }
  }
  .auvo-os-overlay {
    display: none; position: fixed; inset: 0; z-index: 99998;
    background: rgba(28,31,29,.42); align-items: center; justify-content: center; padding: 20px;
  }
  .auvo-os-modal {
    background: #FFFFFF; color: var(--bc-text); border: 1px solid var(--bc-line);
    border-radius: 6px; max-width: 640px; width: 100%; max-height: 88vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 8px 28px rgba(28,31,29,.14);

  .auvo-os-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--bc-line);
  }
  .auvo-os-modal-header h3 { margin: 0; font-size: 16px; }
  .auvo-os-fechar {
    background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer;
    color: var(--bc-text-3);
  }
  .auvo-os-modal-body { padding: 16px 18px; overflow-y: auto; font-size: 13.5px; }

  .auvo-os-subtitulo { margin: 16px 0 8px; font-size: 14px; }
  .auvo-os-item { padding: 8px 0; border-bottom: 1px solid var(--bc-line-soft); }
  .auvo-os-pergunta { font-weight: 600; font-size: 12.5px; color: var(--bc-text-3); }
  .auvo-os-resposta { margin-top: 2px; white-space: pre-wrap; }
  .auvo-os-foto, .auvo-os-assinatura {

    display: flex; justify-content: flex-end;

  .dashc-stat-label { font-size: 12.5px; color: var(--bc-text-3); font-weight: 600; }

  .dashc-card {

    border-radius: 6px; padding: 16px 18px;
  }
  .dashc-card-title {
    margin: 0 0 12px; font-size: 13.5px; font-weight: 700; color: var(--text-strong);

<style>
  /* =========================
     VISUAL "BANCADA" — paleta clara, menu grafite
     Tokens --bc-* são a fonte; os nomes antigos (--bg, --card, --text...)
     apontam para eles porque casca e módulos ainda os usam.
  ========================= */
  :root {
    color-scheme: light;

    /* Superfícies e linhas */
    --bc-bg: #F6F5F1;
    --bc-surface: #FFFFFF;
    --bc-surface-2: #FAF9F6;
    --bc-surface-3: #F1EFE9;
    --bc-line: #E2E0D8;
    --bc-line-2: #CFCCC1;
    --bc-line-soft: #ECEAE3;
    /* Texto */
    --bc-text: #1C1F1D;
    --bc-text-2: #4A4F4B;
    --bc-text-3: #5F645F;
    /* Marca e situações */
    --bc-brand: #3FAE49;
    --bc-action: #1F6B2A;
    --bc-action-hover: #185622;
    --bc-action-bg: #E8F2E5;
    --bc-action-line: #B9D3B3;
    --bc-danger: #A3261B;
    --bc-danger-bg: #FBEBE8;
    --bc-danger-line: #EBC2BC;
    --bc-warn: #7A5200;
    --bc-warn-bg: #FAF0D7;
    --bc-warn-line: #E6D3A2;
    --bc-info: #1E4F7A;
    --bc-info-bg: #E7EFF6;
    --bc-info-line: #BFD2E4;
    /* Menu lateral */
    --bc-side: #1C1F1D;
    --bc-side-2: #262A27;
    --bc-side-3: #303531;
    --bc-side-text: #DCDED9;
    --bc-side-muted: #9DA29C;
    /* Tipografia */
    --bc-sans: "Instrument Sans", "Segoe UI", Roboto, Arial, sans-serif;
    --bc-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

    /* Nomes usados pela casca e pelos módulos */
    --bg: var(--bc-bg);
    --bg-2: var(--bc-surface-3);
    --card: var(--bc-surface);
    --card-soft: var(--bc-surface-2);
    --panel: var(--bc-surface);
    --panel-2: var(--bc-surface-2);
    --panel-soft: var(--bc-surface-2);
    --surface: var(--bc-surface);
    --surface-2: var(--bc-surface-2);
    --surface-3: var(--bc-surface-3);
    --input: #FFFFFF;
    --input-hover: var(--bc-surface-2);
    --text: var(--bc-text);
    --text-strong: var(--bc-text);
    --muted: var(--bc-text-3);
    --muted-2: var(--bc-text-3);
    --border: var(--bc-line);
    --border-strong: var(--bc-line-2);
    --border-color: var(--bc-line);
    --accent: var(--bc-action);
    --accent-2: var(--bc-action);
    --accent-soft: var(--bc-action-bg);
    --accent-border: var(--bc-action-line);
    --azul-topo: var(--bc-side);
    --metrolabs: var(--bc-action);
    --metrolabs-dark: var(--bc-action-hover);
    --metrolabs-blue: var(--bc-info);
    --metro-green: var(--bc-action);
    --metro-green-dark: var(--bc-action-hover);
    --metro-blue: var(--bc-info);
    --metro-blue-dark: var(--bc-info);
    --metro-gold: var(--bc-warn);
    --success: var(--bc-action);
    --info: var(--bc-info);
    --warning: var(--bc-warn);
    --danger: var(--bc-danger);
    --success-bg: var(--bc-action-bg);
    --info-bg: var(--bc-info-bg);
    --warning-bg: var(--bc-warn-bg);
    --danger-bg: var(--bc-danger-bg);
    --pending: var(--bc-warn);
    --pending-bg: var(--bc-warn-bg);
    --salmao: var(--bc-warn-bg);
    --shadow: none;
    --shadow-soft: none;
    --shadow-hover: 0 1px 3px rgba(28,31,29,.08);
    --shadow-strong: 0 2px 8px rgba(28,31,29,.10);
    /* Bootstrap (telas que usam classes dele) */
    --bs-body-bg: var(--bc-bg);
    --bs-body-color: var(--bc-text);
    --bs-border-color: var(--bc-line);
    --bs-secondary-color: var(--bc-text-3);
    --bs-tertiary-bg: var(--bc-surface-2);
    --bs-secondary-bg: var(--bc-surface-3);
    --bs-emphasis-color: var(--bc-text);
    --bs-heading-color: var(--bc-text);
    --bs-link-color: var(--bc-action);
    --bs-link-color-rgb: 31,107,42;
    --bs-link-hover-color: var(--bc-action-hover);

    /* Geometria */
    --radius: 6px;
    --radius-sm: 4px;
    --input-h: 32px;
    --sidebar-w: 256px;
    --topbar-h: 56px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--bc-sans);
    background: var(--bc-bg);
    color: var(--bc-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    min-height: 100vh;
    font-size: 13px;
  }

  h1, h2, h3, h4, h5, h6,
  .title-area h1,
  .form-label,
  label,
  strong,
  .fw-bold {
    color: var(--text-strong) !important;
  }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  h3 { font-size: 14px; }

  p,
  .help,
  .field-help,
  .text-muted,
  .doc-meta,
  .panel-subtitle,
  .topo-subtitle,
  .title-area p,
  .loading-soft,
  small {
    color: var(--muted) !important;
    opacity: 1 !important;
  }

  a { color: var(--bc-action); }
  ::selection { background: var(--bc-action-bg); color: var(--bc-text); }
  code, kbd, samp, pre, time { font-family: var(--bc-mono); }
  :focus-visible { outline: 2px solid var(--bc-action); outline-offset: 1px; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--bc-line-2); border-radius: 6px; border: 2px solid var(--bc-bg); }

  img {
    max-width: 100%;
    display: block;
  }

  /* Trava global de tamanho pra checkbox/radio — sem isso, zoom do
     navegador ou configurações de acessibilidade do Windows (Alto
     Contraste, "Texto em negrito") fazem a caixinha aparecer enorme e
     desproporcional ao texto em qualquer módulo que não define seu
     próprio tamanho explícito (bug real encontrado no Frota/PGT e POP,
     2026-08-21). Vale pra TODOS os módulos nativos, atuais e futuros. */
  input[type="checkbox"],
  input[type="radio"] {
    width: 16px !important;
    height: 16px !important;
    min-width: 16px !important;
    min-height: 16px !important;
    max-width: 16px !important;
    max-height: 16px !important;
    margin: 0;
    accent-color: var(--metro-green);
    forced-color-adjust: none;
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
  }

  button {
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-height: var(--input-h);
    padding: 8px 12px;
    border: 1px solid var(--bc-line-2);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  /* campos: valem também dentro dos módulos */
  input,
  select,
  textarea,
  .form-control,
  .form-select {
    background-color: #FFFFFF !important;
    color: var(--bc-text) !important;
    -webkit-text-fill-color: var(--bc-text);
    border-color: var(--bc-line-2) !important;
    border-radius: 4px !important;
    box-shadow: none !important;
  }

  textarea {
    min-height: 80px;
    resize: vertical;
  }

  input:focus,
  select:focus,
  textarea:focus,
  .form-control:focus,
  .form-select:focus {
    border-color: var(--bc-action) !important;
    box-shadow: 0 0 0 3px rgba(31,107,42,.14) !important;
    outline: none !important;
  }

  input::placeholder,
  textarea::placeholder { color: #7A7F79 !important; -webkit-text-fill-color: #7A7F79; opacity: 1; }

  input:disabled,
  select:disabled,
  textarea:disabled {
    background-color: var(--bc-surface-3) !important;
    color: var(--bc-text-2) !important;
    -webkit-text-fill-color: var(--bc-text-2);
  }

  select option { background: #FFFFFF; color: var(--bc-text); }
  /* Fase 2 (16/10): sem caixa alta forçada nos títulos de seção, rótulos e listas de verificação
     dos módulos de calibração e documentos técnicos (o texto aparece como foi escrito). */
  :is(#tplCertCalContainer, #tplRelCalContainer, #tplDeclExecContainer, #tplDeclExecQIQOContainer, #tplNR13Container,
      #tplPlanCMEContainer, #tplCronExecContainer, #tplPgtPopContainer, #tplRegOpContainer, #tplInvContainer)
    :is(.panel h2, .section-divider, label, .form-label, .check-grid, .check-grid *, .checkbox-row label, h4, .doc-tipo, .ia-label, .resumo-label, .rotulo-mini, .inv-kpi-label) {
    text-transform: none !important;
    letter-spacing: 0 !important;
  }
  /* Casco dos módulos técnicos (JS_Core › SGO_cascoAjustar_) */
  details.sgo-detalhes-tecnicos { margin: 14px 0; border: 1px solid var(--bc-line-2); border-radius: 8px; padding: 8px 12px; background: #FFFFFF; }
  details.sgo-detalhes-tecnicos > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--bc-text-3); }
  details.sgo-detalhes-tecnicos .terminal, details.sgo-detalhes-tecnicos [id$="_terminalLog"] { max-height: 220px; overflow: auto; }
  .sgo-faixa-operacao { position: sticky; bottom: 12px; z-index: 50; display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 12px 0; padding: 12px 16px; border-radius: 8px; border: 2px solid var(--bc-warn); background: var(--bc-warn-bg, #FFF6E0); color: var(--bc-text); font-size: 13.5px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .sgo-faixa-operacao.is-erro { border-color: var(--bc-danger); background: var(--bc-danger-bg, #FDECEA); }
  .sgo-faixa-operacao button { flex: 0 0 auto; width: auto !important; }
  /* Seletor de arquivo em português (JS_Core › SGO_melhorarSeletorArquivo_) */
  .sgo-arquivo { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 100%; position: relative; }
  .sgo-arquivo .sgo-arquivo-nativo { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; overflow: hidden; pointer-events: none; padding: 0 !important; border: 0 !important; margin: 0 !important; }
  .sgo-arquivo .sgo-arquivo-btn { width: auto !important; padding: 6px 14px; font-size: 13px; }
  .sgo-arquivo .sgo-arquivo-nome { font-size: 12.5px; color: var(--bc-text-3); overflow-wrap: anywhere; }
  input[type="file"]::file-selector-button { background: #FFFFFF; color: var(--bc-text); border: 1px solid var(--bc-line-2); border-radius: 4px; padding: 3px 10px; margin-right: 8px; font-family: inherit; }
  input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #FFFFFF inset !important; -webkit-text-fill-color: var(--bc-text) !important; }

  label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 700;
    /* Fase 2 (16/10): sem caixa alta forçada; o texto aparece como foi escrito. */
    text-transform: none;
    letter-spacing: 0;
    color: var(--bc-text-2);
    text-align: left;
  }
  /* Opções de marcar/escolher (checkbox e rádio) são frases: peso normal. */
  label:has(> input[type="checkbox"]), label:has(> input[type="radio"]) { font-weight: 500; font-size: 13px; color: var(--bc-text); }

  /* =========================
     LOGIN
  ========================= */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 0;
    background: var(--bc-bg);
  }

  .login-split {
    width: 100%;
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  .login-welcome {
    position: relative;
    flex: 0 0 45%;
    min-height: 100vh;
    padding: 56px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: var(--bc-side);
  }

  /* régua discreta na base do bloco grafite */
  .login-welcome-shapes {
    position: absolute;
    inset: auto 56px 56px 56px;
    height: 10px;
    pointer-events: none;
    background: repeating-linear-gradient(90deg, #6B706B 0 1px, transparent 1px 8px);
    opacity: .8;
  }

  .login-welcome-text {
    position: relative;
    z-index: 1;
  }

  .login-welcome-text h2 {
    margin: 0 0 12px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: #F6F5F1 !important;
  }

  .login-welcome-text p {
    margin: 0;
    max-width: 420px;
    font-size: 16px;
    line-height: 1.6;
    color: #C9CCC6 !important;
  }

  .login-card {
    flex: 1 1 54%;
    width: 100%;
    position: relative;
    background: var(--bc-bg);
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .login-card > * { width: 100%; max-width: 400px; }

  @media (max-width: 760px) {
    .login-welcome { display: none; }
    .login-card { padding: 40px 16px; }
  }

  .login-title-wrap {
    text-align: left;
    margin-bottom: 28px;
  }

  .login-title {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--bc-text);
  }

  .login-title span {
    color: var(--bc-text);
  }

  .login-subtitle {
    margin: 10px 0 0;
    font-size: 14px;
    color: var(--bc-text-3) !important;
  }

  .login-form {
    width: 100%;
  }

  .login-form label {
    color: var(--bc-text) !important;
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px !important;
    font-weight: 600;
  }

  .login-form input {
    height: 46px;
    font-size: 14px !important;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .login-actions {
    margin-top: 28px;
  }

  .login-actions button {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 4px;
    background: var(--bc-action);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    box-shadow: none;
  }

  .login-actions button:hover {
    background: var(--bc-action-hover);
  }

  /* =========================
     APP BASE & LAYOUT
  ========================= */
  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bc-bg);
  }

  .main-layout {
    flex: 1;
    display: flex;
    min-height: calc(100vh - var(--topbar-h));
    background: var(--bc-bg);
  }

  /* =========================
     BARRA SUPERIOR (branca, filete na base)
  ========================= */
  .topbar {
    min-height: var(--topbar-h);
    background: #FFFFFF;
    color: var(--bc-text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--bc-line);
    position: relative;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .topbar-logo-block {
    background: transparent;
    border-radius: 10px;
    padding: 4px 8px 4px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 60px;
    transition: transform 0.18s ease;
  }

  .topbar-logo-block:hover {
    transform: translateY(-1px);
  }

  .topbar-logo-block:active {
    transform: scale(0.97);
  }

  .topbar-logo,
  #logoTopo {
    display: block;
    height: 48px;
    width: auto;
    object-fit: contain;
    background: transparent;
    padding: 0;
    margin: 0;
  }

  .topbar-brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .topbar-title {
    font-size: 21px;
    font-weight: 700;
    color: var(--bc-text);
    letter-spacing: -.01em;
    line-height: 1.1;
  }

  .topbar-title-plus { color: var(--bc-brand); }

  .topbar-subtitle {
    font-size: 10.5px;
    color: var(--bc-text-3);
    line-height: 1;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .topbar-center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mensagem-motivacional {
    padding: 5px 14px;
    color: var(--bc-text-3);
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    font-style: italic;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
  }

  .topbar-info-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 8px;
    text-align: right;
  }

  .relogio-texto {
    font-family: var(--bc-mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--bc-text-2);
  }

  .status-produtivo {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .4px;
    color: var(--bc-action);
    padding: 0;
    text-transform: uppercase;
  }

  .user-action-block {
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 1px solid var(--bc-line);
    padding-left: 16px;
  }

  .user-info {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--bc-text);
  }

  .btn-logout {
    height: 32px;
    padding: 0 16px;
    border-radius: 4px;
    background: #FFFFFF;
    color: var(--bc-text);
    font-weight: 600;
    font-size: 12px;
    border: 1px solid var(--bc-line-2);
  }

  .btn-logout:hover {
    background: var(--bc-surface-2);
    border-color: var(--bc-text-3);
  }

  /* =========================
     MENU LATERAL (bloco grafite)
  ========================= */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bc-side);
    color: var(--bc-side-text);
    padding: 20px 12px;
    overflow-y: auto;
  }

  .sidebar-section + .sidebar-section {
    margin-top: 24px;
  }

  .sidebar-section-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    font-weight: 600;
    color: var(--bc-side-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
    padding: 10px 10px 5px;
  }

  .sidebar-section-title::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--bc-brand);
  }

  .menu-btn {
    width: 100%;
    min-height: 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 7px 10px;
    margin: 1px 0;
    border-radius: 4px;
    background: transparent;
    border-left: 3px solid transparent;
    color: var(--bc-side-text);
    font-size: 12.5px;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .menu-btn-icon {
    flex: 0 0 auto;
    font-size: 13px;
    line-height: 1;
    opacity: 0.9;
  }
  .menu-btn .menu-btn-icon,
  .menu-btn i { color: var(--bc-side-muted); }

  /* Balão de alerta em botões do menu lateral (ex.: padrões de
     referência vencendo/vencidos no Certificado de Calibração) —
     contador, só aparece quando há algo pra avisar. */
  .menu-badge {
    flex: 0 0 auto;
    margin-left: auto;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: transparent;
    color: #F2B8B0;
    border: 1px solid #8A3A31;
    font-family: var(--bc-mono);
    font-size: 11px;
    font-weight: 500;
    line-height: 18px;
    text-align: center;
    display: none;
  }
  .menu-badge.is-visible { display: inline-block; }

  .menu-btn:hover {
    background: var(--bc-side-2);
    color: #FFFFFF;
  }

  .menu-btn.active {
    font-weight: 600;
    border-left-color: var(--bc-brand);
    background: var(--bc-side-3);
    color: #FFFFFF;
  }
  .menu-btn.active .menu-btn-icon,
  .menu-btn.active i { color: #FFFFFF; }

  /* =========================
     ÁREA DE CONTEÚDO
  ========================= */
  .content-area {
    flex: 1;
    min-width: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bc-bg);
    color: var(--bc-text);
  }

  .content-panel {
    flex: 1;
    background: var(--bc-bg);
    min-height: 480px;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  /* =========================
     ALERTAS / AVISOS E BALÕES
  ========================= */
  .alert-bar {
    background: var(--bc-warn-bg);
    border: 1px solid var(--bc-warn-line);
    color: var(--bc-warn);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    border-left: 4px solid var(--bc-warn);
  }

  /* faixa antiga "Módulo atual: X" (#areaAvisos, preenchida por atualizarBadgeModulo_): continua escondida.
     A classe .avisos-wrap é usada também em mensagens de módulo (ex.: "links ainda não configurados"
     em renderMotorModulo_); até 16/10/2026 ela era escondida junto e a mensagem sumia. Agora só o id some. */
  #areaAvisos { display: none !important; }
  .avisos-wrap {
    background: var(--bc-warn-bg);
    border: 1px solid var(--bc-warn-line);
    border-left: 4px solid var(--bc-warn);
    color: var(--bc-warn);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0;
  }

  /* =========================
     DASHBOARD (KPIs)
  ========================= */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }

  .card-kpi {
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 20px;
    transition: transform 0.2s ease;
  }

  .card-kpi:hover {
    transform: translateY(-2px);
  }

  .card-kpi-title {
    font-size: 12px;
    color: var(--bc-text-3);
    margin-bottom: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .card-kpi-value {
    font-family: var(--bc-mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--bc-text);
  }

  .content-title {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.015em;
    color: var(--bc-text);
  }

  .content-title::before,
  .section-card-title::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 999px;
    background: var(--bc-brand);
    vertical-align: middle;
  }

  .content-subtitle {
    margin: 0 0 16px;
    font-size: 13.5px;
    color: var(--bc-text-3);
  }

  .dashboard-alertas-container {
    margin-top: 20px;
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 20px;
  }

  /* cartões: branco, linha fina, sem sombra (valem também dentro dos módulos) */
  .topo,
  .header-card,
  .card,
  .dashboard-card,
  .panel,
  .action-bar,
  .modal-content,
  .item-card,
  .insumo-card,
  .ensaio-card,
  .nr13-card,
  .doc-item,
  .radio-status-card,
  .step-summary,
  .ml-dialog,
  .ml-box,
  .kpi,
  .receita-item {
    background: #FFFFFF !important;
    background-image: none !important;
    border-color: var(--bc-line) !important;
    color: var(--bc-text) !important;
    box-shadow: none !important;
  }
  .panel h2::before,
  h4::before,
  .step h4::before,
  .topo::before,
  .header-card::before {
    background: var(--bc-brand) !important;
    background-image: none !important;
    box-shadow: none !important;
  }
  .terminal {
    background: var(--bc-surface-2) !important;
    color: var(--bc-text) !important;
    border: 1px solid var(--bc-line) !important;
    font-family: var(--bc-mono);
  }
  .terminal-header {
    background: var(--bc-surface-3) !important;
    color: var(--bc-text-2) !important;
    border-color: var(--bc-line) !important;
  }
  #placeholderStatus,
  .ph-chip {
    background: var(--bc-surface-2) !important;
    color: var(--bc-text-2) !important;
    border-color: var(--bc-line) !important;
    font-family: var(--bc-mono);
  }

  /* =========================
     BOTÕES PRINCIPAIS E FORMULÁRIOS
  ========================= */
  .module-shell {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1; 
    padding: 4px 0 18px;
    border-radius: var(--radius);
  }

  .module-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--bc-text);
  }

  .module-header-left {
    min-width: 240px;
  }

  .module-header-right {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar-search {
    max-width: 300px;
    min-width: 220px;
    height: 36px;
    min-height: 36px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
  }

  .btn-primary,
  .btn-secondary,
  .btn-danger,
  .btn-warning,
  .btn-success,
  .btn-info {
    min-height: 36px;
    height: 36px;
    padding: 0 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* ação principal: verde escuro sólido */
  .btn-primary,
  .btn-success,
  .btn-download,
  .mobile-btn-salvar,
  .mobile-fab {
    background: var(--bc-action) !important;
    border: 1px solid var(--bc-action) !important;
    color: #FFFFFF !important;
    border-radius: 4px;
    font-weight: 600;
    box-shadow: none !important;
  }
  .btn-primary:hover,
  .btn-success:hover,
  .btn-download:hover,
  .mobile-btn-salvar:hover { background: var(--bc-action-hover) !important; border-color: var(--bc-action-hover) !important; }

  /* ação secundária: branco com contorno */
  .btn-secondary,
  .btn-light,
  .btn-outline-secondary,
  .btn-outline-success,
  .tab-btn,
  .topo-action,
  .mobile-btn-cancelar,
  .mobile-topbar-btn {
    background: #FFFFFF !important;
    border: 1px solid var(--bc-line-2) !important;
    color: var(--bc-text) !important;
    border-radius: 4px;
    font-weight: 600;
    box-shadow: none !important;
  }
  .btn-secondary:hover,
  .btn-light:hover,
  .btn-outline-secondary:hover,
  .tab-btn:hover:not(.active),
  .topo-action:hover { background: var(--bc-surface-2) !important; border-color: var(--bc-text-3) !important; }
  .tab-btn.active { background: var(--bc-text) !important; border-color: var(--bc-text) !important; color: #FFFFFF !important; }
  .btn-outline-success { color: var(--bc-action) !important; border-color: var(--bc-action-line) !important; }

  .btn-danger { background: var(--bc-danger) !important; border: 1px solid var(--bc-danger) !important; color: #FFFFFF !important; border-radius: 4px; box-shadow: none !important; }
  .btn-outline-danger { background: #FFFFFF !important; border: 1px solid var(--bc-danger-line) !important; color: var(--bc-danger) !important; box-shadow: none !important; }
  .btn-warning { background: var(--bc-warn-bg) !important; border: 1px solid var(--bc-warn-line) !important; color: var(--bc-warn) !important; }
  .btn-info { background: var(--bc-info-bg) !important; border: 1px solid var(--bc-info-line) !important; color: var(--bc-info) !important; }
  .btn-dark { background: var(--bc-text); border: 1px solid var(--bc-text); color: #FFFFFF; }

  button:hover,
  .btn:hover,
  .menu-btn:hover,
  .topo-action:hover,
  .tab-btn:hover,
  .btn-download:hover {
    filter: none !important;
    transform: none !important;
    background-image: none !important;
  }

  .module-grid {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .form-card {
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 20px;
  }

  .list-card {
    background: #FFFFFF;
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 0;
    overflow: hidden;
  }

  .section-card-title {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
    color: var(--bc-text);
    border-bottom: 1px solid var(--bc-line);
    padding-bottom: 10px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .form-grid .full {
    grid-column: 1 / -1;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--bc-line);
  }

  /* =========================
     TABELAS (Mais Densas)
  ========================= */
  /* tabelas: valem também dentro dos módulos */
  table { border-color: var(--bc-line) !important; }
  th,
  thead {
    background: #FFFFFF !important;
    color: var(--bc-text-2) !important;
    font-weight: 600;
    border-color: var(--bc-line) !important;
    border-bottom: 1px solid var(--bc-line-2) !important;
    text-shadow: none;
  }
  td { border-color: var(--bc-line-soft) !important; }
  tr:hover,
  tbody tr:hover { background: var(--bc-surface-2) !important; }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    background: #FFFFFF !important;
    border-color: var(--bc-line);
  }

  .table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
    font-size: 13px;
    background: #FFFFFF !important;
  }

  .table thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    text-align: left;
    padding: 12px 14px;
    white-space: nowrap;
    font-size: 12px;
    text-transform: uppercase;
  }

  .table tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--bc-line-soft);
    vertical-align: middle;
    color: var(--bc-text) !important;
    background: transparent;
  }

  .table tbody tr:hover td {
    background: var(--bc-surface-2) !important;
  }

  .table-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* Fase 2 (16/10): na lista ao lado do formulário a coluna Ações ficava cortada ("Inativ", "QR C").
     Os botões ficam um embaixo do outro e as colunas de texto quebram linha. */
  .list-card .table td .table-actions { display: grid; grid-template-columns: 1fr; gap: 4px; min-width: 88px; }
  .list-card .table td .table-actions button { width: 100%; }
  .list-card .table td { overflow-wrap: anywhere; }

  .table-actions button {
    min-height: 28px;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 700;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .badge-ativo { background: var(--bc-action-bg) !important; color: var(--bc-action) !important; border-color: var(--bc-action-line); }
  .badge-pendente { background: var(--bc-warn-bg) !important; color: var(--bc-warn) !important; border-color: var(--bc-warn-line); }
  .badge-bloqueado { background: var(--bc-danger-bg) !important; color: var(--bc-danger) !important; border-color: var(--bc-danger-line); }
  .badge-inativo { background: var(--bc-surface-3) !important; color: var(--bc-text-2) !important; border-color: var(--bc-line); }
  .status-badge,
  .badge-soft,
  .profile-badge,
  .ph-chip { border-radius: 4px; }

  /* mensagens e selos: valem também dentro dos módulos */
  .alert-box,
  .alert-bar { border-radius: 6px; }
  .alert-warning,
  .alert-box.warning {
    background: var(--bc-warn-bg) !important;
    color: var(--bc-warn) !important;
    border-color: var(--bc-warn-line) !important;
  }
  .alert-info,
  .alert-box.info {
    background: var(--bc-info-bg) !important;
    color: var(--bc-info) !important;
    border-color: var(--bc-info-line) !important;
  }
  .alert-danger,
  .alert-box.error {
    background: var(--bc-danger-bg) !important;
    color: var(--bc-danger) !important;
    border-color: var(--bc-danger-line) !important;
  }
  .alert-success,
  .alert-box.success,
  .status-badge,
  .badge-soft,
  .profile-badge {
    background: var(--bc-action-bg) !important;
    color: var(--bc-action) !important;
    border-color: var(--bc-action-line) !important;
  }
  .status-badge.is-danger { background: var(--bc-danger-bg) !important; color: var(--bc-danger) !important; border-color: var(--bc-danger-line) !important; }
  .status-badge.is-warning { background: var(--bc-warn-bg) !important; color: var(--bc-warn) !important; border-color: var(--bc-warn-line) !important; }
  .status-badge.is-neutral { background: var(--bc-surface-3) !important; color: var(--bc-text-2) !important; border-color: var(--bc-line) !important; }
  #perfWidget { color: var(--bc-action) !important; background: transparent !important; }

  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: var(--bc-text-3);
    font-size: 14px;
    font-weight: 500;
  }

  .helper-text {
    margin-top: 10px;
    font-size: 12px;
    color: var(--bc-text-3);
  }

  /* =========================
     MODAL BASE E QR CODE
  ========================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,31,29,.42) !important;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 9999;
  }

  .modal-card {
    width: 100%;
    max-width: 480px;
    background: #FFFFFF;
    color: var(--bc-text);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(28,31,29,.14);
    border: 1px solid var(--bc-line);
    overflow: hidden;
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--bc-line);
    background: transparent !important;
  }

  .modal-title {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--bc-text);
  }

  .modal-body {
    padding: 20px;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--bc-line);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: transparent !important;
  }
  .card-body,
  .section-divider,
  .card-note { background: transparent !important; border-color: var(--bc-line) !important; }

  /* Otimizado para melhorar a leitura do QR na impressão */
  .qr-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
    background: #fff;
  }

  .qr-image {
    width: 220px;
    height: 220px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px;
    background: #fff;
    margin-bottom: 16px;
    image-rendering: pixelated; 
  }

  .qr-info {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .qr-info strong {
    color: var(--metro-blue);
  }

  /* =========================
     MOTORES DE ENGENHARIA (ABAS E IFRAMES)
  ========================= */
  .motores-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: transparent;
  }

  .motores-tab-btn {
    flex: 1;
    min-height: 42px;
    border-radius: 4px;
    background: #FFFFFF;
    color: var(--bc-text);
    font-weight: 600;
    font-size: 14px;
    border: 1px solid var(--bc-line-2);
  }

  .motores-tab-btn:hover:not(.active) {
    background: var(--bc-surface-2);
    border-color: var(--bc-text-3);
  }

  .motores-tab-btn.active {
    background: var(--bc-text);
    color: #FFFFFF;
    border-color: var(--bc-text);
  }

  /* casca do módulo: sem cartão em volta do cartão, o conteúdo assenta no fundo */
  .iframe-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 640px;
    border-radius: var(--radius);
  }

  /* Autoclave/Lavadora nativos (sem iframe) — NAO reaproveitar
     .iframe-container aqui: aquela classe forca min-height:640px e fundo
     escuro mesmo vazia, o que faz o container parecer uma "caixa preta"
     antes do JS terminar de desenhar o formulario (ou se o JS falhar por
     algum motivo). Esta classe deixa o container com altura natural e um
     texto de "Carregando..." visivel por padrao, ate o JS substituir o
     conteudo de verdade — assim da pra saber so de olhar se o JS rodou. */
  .native-module-container {
    min-height: 80px;
    padding: 24px 0;
    color: var(--bc-text);
    font-size: 14px;
    border-radius: var(--radius);
  }

  iframe {
    width: 100%;
    flex: 1;
    border: none;
    border-radius: var(--radius);
  }

  /* =========================
     RESPONSIVO (MOBILE E TABLET)
  ========================= */
  
  /* Tablete e Telas Médias */
  @media (max-width: 1200px) {
    .dashboard-grid {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }
    .module-grid {
      /* Em telas médias, a proporção do formulário e tabela se ajusta */
      grid-template-columns: minmax(320px, 35%) minmax(0, 1fr);
    }
  }

  /* Dispositivos Móveis e Tablets Verticais */
  @media (max-width: 900px) {
    
    /* Layout principal empilha */
    .main-layout {
      flex-direction: column;
    }

    /* Menu lateral vira um carrossel na parte superior */
    .sidebar {
      width: 100%;
      border-bottom: 1px solid var(--bc-side-3);
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      justify-content: center;
    }

    .sidebar-section {
      display: contents; /* Ignora o contêiner e alinha os itens */
    }

    .sidebar-section-title {
      display: none; /* Esconde os títulos "Módulos", "Config" no mobile */
    }

    .menu-btn {
      width: auto;
      border-radius: var(--radius-sm);
      margin: 0;
      padding: 8px 16px;
      min-height: 36px;
      text-align: center;
    }

    .content-area {
      padding: 16px;
    }

    /* O grid Módulo desfaz a coluna dupla: Formulário em cima, Tabela embaixo */
    .module-grid {
      grid-template-columns: 1fr;
    }
  }

  /* =========================
     MODO MOBILE — tela inicial dedicada (grade de ícones)
     Ver JS_Core.html: exibirAppLogado_() / renderMobileHome_().
     Mais específico que o responsivo acima, então some com o
     carrossel de botões da sidebar quando .modo-mobile está ativo.
  ========================= */
  .app-shell.modo-mobile .sidebar {
    display: none !important;
  }

  /* Some com o cabeçalho desktop (logo/data/status) — a barra própria
     do mobile (.mobile-topbar, ver abaixo) substitui isso. */
  .app-shell.modo-mobile #topo {
    display: none !important;
  }

  /* Reset defensivo de largura: garante que nada herdado do layout
     desktop (min-width, larguras fixas de grid, etc.) force scroll
     horizontal / necessidade de dar zoom out no celular. */
  .app-shell.modo-mobile,
  .app-shell.modo-mobile .main-layout,
  .app-shell.modo-mobile .content-area,
  .app-shell.modo-mobile .content-panel {
    width: 100%;
    min-width: 0;
    max-width: 100vw;
    box-sizing: border-box;
  }
  .app-shell.modo-mobile .content-area {
    /* !important necessário: a regra global de "densidade compacta"
       (".content-area { padding: 18px 22px !important }", mais abaixo
       no arquivo) também usa !important e sobrescrevia esse espaçamento —
       era por isso que o conteúdo aparecia cortado atrás da barra fixa
       do topo no mobile, mesmo depois de reservar o espaço aqui. */
    padding: 64px 12px 12px !important;
    overflow-x: hidden;
  }

  /* position:fixed (não sticky) — a barra fica no HTML depois do conteúdo
     principal, então "sticky" só gruda no topo depois de um scroll que,
     em telas curtas (lista vazia, formulário pequeno), nunca acontece; a
     barra ficava "solta" no fim da página, atrás do botão flutuante de
     retirar veículo. Fixed trava no topo sempre, sem depender de altura
     de conteúdo nem de scroll — mesma técnica já usada em .mobile-fab. */
  .mobile-topbar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 400;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: #FFFFFF;
    border-top: 1px solid var(--bc-line);
    border-bottom: 1px solid var(--bc-line);
  }
  .app-shell.modo-mobile .mobile-topbar {
    display: flex;
  }
  .mobile-topbar-titulo {
    flex: 1;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    color: var(--text-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mobile-topbar-btn {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mobile-topbar-sair {
    border-color: var(--bc-danger);
    color: var(--bc-danger);
  }

  /* Listas mobile (Clientes/Unidades/Equipamentos/Documentos) */
  .mobile-search {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-strong);
    font-size: 15px;
    box-sizing: border-box;
  }
  .mobile-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 80px; /* espaço pro FAB não cobrir o último item */
  }
  .mobile-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    background: #FFFFFF;
    color: var(--bc-text);
    border: 1px solid var(--bc-line);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    text-align: left;
  }
  .mobile-card:active {
    transform: scale(.98);
  }
  .mobile-card-titulo {
    font-weight: 800;
    font-size: 15px;
    color: var(--text-strong);
  }
  .mobile-card-subtitulo {
    font-size: 13px;
    color: var(--muted);
  }
  .mobile-card-status {
    align-self: flex-start;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bc-action-bg);
    color: var(--bc-action);
  }
  .mobile-card-status.inativo {
    background: var(--bc-danger-bg);
    color: var(--bc-danger);
  }

  /* Faixa do farol do Programa de Conduta — home mobile + tela do
     módulo Conduta (2026-09-02). Cor da borda é setada inline via JS
     (verde/amarelo/vermelho, mesma paleta do farol). */
  .mobile-farol-strip {
    background: var(--card-soft);
    border: 1px solid var(--border);
    border-left: 6px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-strong);
  }
  .mobile-farol-strip .farol-gauge-mini { width: 84px; flex: 0 0 auto; }
  .mobile-farol-strip .farol-mini-linha { display: flex; align-items: center; gap: 10px; }

  /* Farol do Programa de Conduta (19/10/2026; revisão de 20/10/2026 com o dono) — cartão usado
     no Início, na aba "Farol do mês" e no celular (.farol-compacto). Duas colunas: velocímetro
     com a legenda logo abaixo dele; texto em coluna única, alinhado à esquerda, com espaçamento
     vertical regular. Tipografia e cores do visual Bancada (--bc-*), sem espaçamento de letras. */
  .farol-card {
    --farol-cor: var(--success);
    --farol-tinta: var(--bc-action);
    --fg-vermelho: #C8402F;
    --fg-amarelo: #E3A21A;
    --fg-verde: #2E8B3E;
    background: #FFFFFF;
    color: var(--bc-text);
    border: 1px solid var(--bc-line);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 248px minmax(0, 640px);
    column-gap: 28px;
    row-gap: 12px;
    align-items: start;
    position: relative;
    overflow: hidden;
  }
  .farol-card.farol-amarelo { --farol-tinta: var(--bc-warn); }
  .farol-card.farol-vermelho { --farol-tinta: var(--bc-danger); }
  .farol-card.farol-vivo:focus-visible { outline: 2px solid var(--farol-cor); outline-offset: 2px; }
  .farol-gauge-wrap { width: 248px; max-width: 100%; position: relative; z-index: 1; }
  .farol-body { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; position: relative; z-index: 1; text-align: left; }
  .farol-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .farol-situacao { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--farol-tinta); }
  .farol-situacao .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--farol-cor); }
  .farol-ao-vivo { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--bc-text-3); }
  .farol-ao-vivo-ponto { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: var(--fg-verde); animation: farolVivoPonto 2.4s ease-in-out infinite; }
  @keyframes farolVivoPonto { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .farol-titulo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 700; color: var(--text-strong); }
  .farol-selo { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1px solid; line-height: 1.25; }
  .farol-selo-verde { color: var(--bc-action); background: var(--bc-action-bg); border-color: var(--bc-action-line); }
  .farol-selo-amarelo { color: var(--bc-warn); background: var(--bc-warn-bg); border-color: var(--bc-warn-line); }
  .farol-selo-vermelho { color: var(--bc-danger); background: var(--bc-danger-bg); border-color: var(--bc-danger-line); }
  .farol-selo-teste { font-size: 12.5px; min-height: 24px; color: var(--bc-text-2); background: #F2F2EF; border-color: var(--bc-line-2); }
  .farol-frase { margin: 0; font-size: 13px; line-height: 1.5; color: var(--bc-text-2); }
  .farol-frase-defesa { display: flex; align-items: baseline; gap: 8px; }
  .farol-frase-anterior { color: var(--bc-text-3); }
  .farol-amostra-defesa, .farol-amostra-projecao { flex: 0 0 auto; display: inline-block; width: 16px; height: 8px; border-radius: 3px; }
  .farol-amostra-defesa { background: repeating-linear-gradient(135deg, var(--fg-amarelo) 0 3px, #FFFFFF 3px 6px); border: 1px solid var(--fg-amarelo); box-sizing: border-box; }
  .farol-amostra-projecao { height: 0; border-top: 3px dashed var(--bc-text-3); border-radius: 0; transform: translateY(-3px); }
  .farol-legenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-top: 2px; }
  .farol-legenda span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--bc-text-3); font-weight: 600; }
  .farol-legenda i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .farol-legenda .fg-cor-vermelho { background: var(--fg-vermelho); }
  .farol-legenda .fg-cor-amarelo { background: var(--fg-amarelo); }
  .farol-legenda .fg-cor-verde { background: var(--fg-verde); }
  .farol-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 2px; }
  .farol-acao { padding: 7px 12px; font-size: 12.5px; }
  .farol-link { font-size: 13px; }

  /* Velocímetro (SVG) */
  .farol-gauge { display: block; width: 100%; height: auto; overflow: visible; }
  .farol-gauge .fg-trilho { stroke: #EEEEEA; }
  .farol-gauge .fg-faixa { opacity: .3; transition: opacity .4s ease; }
  .farol-gauge .fg-faixa.fg-ativa { opacity: 1; }
  .farol-gauge .fg-vermelho { stroke: var(--fg-vermelho); }
  .farol-gauge .fg-amarelo { stroke: var(--fg-amarelo); }
  .farol-gauge .fg-verde { stroke: var(--fg-verde); }
  .farol-gauge .fg-brilho { opacity: .35; animation: farolBrilho 3.2s ease-in-out infinite; }
  @keyframes farolBrilho { 0%, 100% { opacity: .22; } 50% { opacity: .5; } }
  .farol-gauge .fg-marca { stroke: #B8B5AC; stroke-width: 1; }
  .farol-gauge .fg-marca-maior { stroke: #7C796F; stroke-width: 1.3; }
  .farol-gauge .fg-marca-limite { stroke: #7C796F; stroke-width: 1.3; }
  .farol-gauge .fg-numero { font-size: 11px; font-weight: 600; fill: var(--bc-text-3); font-variant-numeric: tabular-nums; }
  .farol-gauge .fg-agulha { fill: var(--bc-text); }
  .farol-gauge .fg-pivo { fill: var(--bc-text); }
  .farol-gauge .fg-pivo-centro { fill: #FFFFFF; }
  .farol-gauge .fg-valor { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .farol-gauge.fg-verde .fg-valor { fill: var(--bc-action); }
  .farol-gauge.fg-amarelo .fg-valor { fill: var(--bc-warn); }
  .farol-gauge.fg-vermelho .fg-valor { fill: var(--bc-danger); }
  .farol-gauge .fg-legenda { font-size: 11.5px; font-weight: 600; fill: var(--bc-text-3); }
  .farol-gauge .fg-projecao { opacity: 0; transition: opacity .5s ease .1s; }
  .farol-assentado .farol-gauge .fg-projecao { opacity: 1; }
  .farol-gauge .fg-projecao-arco { stroke-width: 3; stroke-dasharray: 3 3; stroke-linecap: butt; }
  .farol-gauge .fg-projecao.fg-verde .fg-projecao-arco, .farol-gauge .fg-projecao.fg-verde .fg-fantasma { stroke: var(--fg-verde); }
  .farol-gauge .fg-projecao.fg-amarelo .fg-projecao-arco, .farol-gauge .fg-projecao.fg-amarelo .fg-fantasma { stroke: var(--fg-amarelo); }
  .farol-gauge .fg-projecao.fg-vermelho .fg-projecao-arco, .farol-gauge .fg-projecao.fg-vermelho .fg-fantasma { stroke: var(--fg-vermelho); }
  .farol-gauge .fg-fantasma { stroke-width: 2.5; stroke-dasharray: 4 3; stroke-linecap: round; }

  /* Margem em pontos (parte listrada = em prazo de defesa) */
  .farol-margem { width: 100%; max-width: 420px; }
  .farol-margem-rotulo { font-size: 13px; color: var(--bc-text-2); margin-bottom: 5px; }
  .farol-margem-rotulo strong { color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .farol-margem-barra { display: flex; gap: 2px; height: 10px; border-radius: 5px; background: #EEEEEA; overflow: hidden; }
  .farol-margem-cheia { display: block; height: 100%; border-radius: 5px; background: var(--fg-verde); transition: width .8s cubic-bezier(.22, 1, .36, 1); }
  .farol-margem-amarelo .farol-margem-cheia { background: var(--fg-amarelo); }
  .farol-margem-defesa { display: block; height: 100%; border-radius: 5px; background: repeating-linear-gradient(135deg, var(--fg-amarelo) 0 3px, #FFFFFF 3px 6px); border: 1px solid var(--fg-amarelo); box-sizing: border-box; transition: width .8s cubic-bezier(.22, 1, .36, 1); }

  /* Mini gráficos da evolução (só quando dizem alguma coisa) */
  .farol-tendencias { display: flex; flex-wrap: wrap; gap: 12px 24px; width: 100%; }
  .farol-tendencia { flex: 0 1 240px; min-width: 0; }
  .farol-tendencia-titulo { font-size: 12.5px; font-weight: 700; color: var(--text-strong); margin-bottom: 4px; }
  .farol-tendencia-nota { font-size: 11.5px; line-height: 1.4; color: var(--bc-text-3); margin-top: 4px; }
  .farol-spark { display: block; width: 100%; height: 40px; overflow: visible; }
  .farol-spark .fs-linha { stroke: var(--text-strong); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .farol-spark .fs-limite { stroke: #A8A59B; stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .farol-spark .fs-ponto { stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; fill: none; }
  .farol-spark .fs-ultimo { stroke-width: 9; }
  .farol-spark .fs-verde { stroke: var(--fg-verde); }
  .farol-spark .fs-amarelo { stroke: var(--fg-amarelo); }
  .farol-spark .fs-vermelho { stroke: var(--fg-vermelho); }
  .farol-spark .fs-alvo { stroke: transparent; stroke-width: 16; stroke-linecap: round; vector-effect: non-scaling-stroke; fill: none; pointer-events: stroke; }

  /* Pulso discreto quando o índice muda e aviso "Índice atualizado" */
  .farol-card.farol-pulso { animation: farolPulso 1.6s ease-out 1; }
  @keyframes farolPulso { 0% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); } 20% { box-shadow: 0 0 0 4px var(--bc-line-2); } 100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); } }
  .farol-aviso-vivo { position: fixed; right: 16px; bottom: 16px; z-index: 9000; max-width: min(420px, calc(100vw - 32px)); display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; background: #FFFFFF; color: var(--bc-text); border: 1px solid var(--bc-line); border-left: 4px solid var(--farol-cor, var(--success)); border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); font-size: 13px; line-height: 1.4; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
  .farol-aviso-vivo.visivel { opacity: 1; transform: none; }
  .farol-aviso-vivo .dot { flex: 0 0 auto; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--farol-cor, var(--success)); }

  /* Uma coluna: celular (compacto) e telas estreitas */
  .farol-card.farol-compacto { padding: 14px 16px 16px; margin-bottom: 0; border: 0; border-radius: 0; background: transparent; }
  .farol-card.farol-compacto, .farol-card.farol-compacto .farol-gauge-wrap { grid-template-columns: minmax(0, 1fr); }
  .farol-compacto .farol-gauge-wrap { width: 100%; max-width: 280px; justify-self: center; }
  .farol-compacto .farol-margem { max-width: none; }
  .farol-compacto .farol-tendencia { flex: 1 1 100%; }
  .mobile-farol-strip.mobile-farol-vivo { padding: 0; background: #FFFFFF; }
  @media (max-width: 900px) {
    .farol-card { grid-template-columns: minmax(0, 1fr); }
    .farol-gauge-wrap { width: 100%; max-width: 280px; justify-self: center; }
    .farol-margem { max-width: none; }
  }
  @media (max-width: 640px) {
    .farol-aviso-vivo { left: 16px; right: 16px; bottom: 16px; max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .farol-gauge .fg-brilho, .farol-ao-vivo-ponto, .farol-card.farol-pulso { animation: none; }
    .farol-gauge .fg-faixa, .farol-gauge .fg-projecao, .farol-margem-cheia, .farol-margem-defesa, .farol-aviso-vivo { transition: none; }
  }

  .mobile-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 450;
    height: 48px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Formulário mobile — campos sempre empilhados, nunca lado a lado */
  .mobile-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 24px;
  }
  .mobile-field {
    display: flex;
    flex-direction: column;
    gap: 6px;

  .mobile-field label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: none;

  .mobile-field input,
  .mobile-field select,
  .mobile-field textarea {

  /* Frota mobile — operação enxuta (retirar/devolver veículo) */

  /* Pontos de medição do wizard mobile de Certificado de Calibração
     (nominal + 3 leituras por ponto, dentro de um bloco de ensaio). */

  #avisosLoginOverlay .avisos-login-modal { max-width: 560px; }

    flex: 0 0 auto; width: 36px; height: 36px; min-height: 36px; padding: 0; margin: -4px -6px 0 0;

    background: transparent !important; border: 1px solid transparent !important; border-radius: 4px;

  }
  #avisosLoginOverlay .avisos-cab-fechar:hover { background: var(--bc-surface-3) !important; color: var(--bc-text) !important; }
  #avisosLoginOverlay .avisos-login-body { padding: 16px 20px; background: var(--bc-surface-2); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #avisosLoginOverlay .avisos-secao { margin-bottom: 20px; }

  .avisos-cartoes { display: flex; flex-direction: column; gap: 10px; }
  .avisos-card {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 6px;
    padding: 14px 16px; background: #FFFFFF; border: 1px solid var(--bc-line); border-left: 4px solid var(--bc-line-2);
    border-radius: 6px; color: var(--bc-text); min-width: 0;

  .avisos-card-exemplos li.avisos-card-mais { background: transparent; border-color: transparent; font-family: var(--bc-sans); color: var(--bc-text-3); padding-left: 2px; }

    body:has(#avisosLoginOverlay[style*="flex"]) :is(.asw-botao, .comw-botao) { display: none !important; }

  .dashc-stat-label { font-size: 12.5px; color: var(--bc-text-3); font-weight: 600; }

  .inicio-faixa-aviso { padding: 12px 14px; border: 1px solid var(--bc-line); border-radius: var(--radius); background: #FFFFFF; color: var(--bc-text-2); }

  .inicio-hero-mobile .inicio-saudacao { font-size: 21px !important; }
  @media (max-width: 900px) {

    .inicio-pend { border-left: 0 !important; border-top: 1px solid var(--bc-line) !important; }
    .inicio-pend:first-child { border-top: 0 !important; }
    .busca-overlay { padding-top: 12px; }

<script>
  // ============================================================
  // MARKUP (modais de ajuda + wizard de 6 etapas + consulta de
  // documentos + impressora termica), injetado via innerHTML em
  // #tplCartaConfContainer por renderTplCartaConf_().
  // ============================================================
  const TPL_CARTACONF_HTML_ = `
<div id="tplCartaConf_modalManual" class="ml-modal" onclick="tplCartaConf_fecharModalAjuda(event)">
    <div class="ml-dialog">
      <div class="ml-dialog-header">
        <h2>Manual do Operador - Carta de Conformidade Técnica</h2>
        <button class="ml-close" type="button" onclick="tplCartaConf_fecharAjuda('modalManual')">Fechar</button>
      </div>
      <div class="ml-dialog-body">
        <p>Este manual orienta o operador em linguagem simples. A Carta de Conformidade Técnica é um documento de evidência: ela registra quem foi avaliado, qual equipamento foi avaliado, qual escopo foi executado, quais critérios foram considerados e qual foi o parecer final. Antes de emitir, o operador deve conferir os dados com calma, porque o PDF gerado passa a compor o histórico documental do cliente.</p>
        <h3>1. Dados da instituição</h3>
        <ol>
          <li>Digite o CNPJ com ou sem pontuação e clique em <strong>Buscar</strong>. O sistema consulta bases públicas e tenta preencher razão social, endereço, bairro, cidade e UF.</li>
          <li>Se a busca não retornar dados, preencha manualmente. Isso pode ocorrer por instabilidade da base pública, bloqueio temporário da API ou CNPJ não localizado.</li>
          <li>Confira a razão social. Esse é um dos campos mais importantes, pois aparece no documento, no histórico e na validação.</li>
        </ol>
        <h3>2. Dados do equipamento</h3>
        <ol>
          <li>Selecione o tipo de equipamento. Essa escolha muda a lógica técnica, os campos aplicáveis, as normas, os ensaios e os textos do relatório.</li>
          <li>Preencha marca, modelo, número de série e TAG/patrimônio. Esses campos identificam o equipamento e evitam confusão entre ativos parecidos.</li>
          <li>Quando houver campos específicos, como faixa térmica, PMTA, gás, classe de filtro ou rotação, preencha somente quando fizer sentido para o equipamento.</li>
        </ol>
        <h3>3. Escopo técnico</h3>
        <p>Marque apenas as etapas realmente executadas. QI significa qualificação de instalação, QO significa qualificação de operação, QD significa qualificação de desempenho e inspeção técnica se aplica a perfis como NR-13. O sistema bloqueia combinações incompatíveis com o equipamento selecionado.</p>
        <h3>4. Processo, ensaios e insumos</h3>
        <p>Quando o equipamento usa ciclos ou tplCartaConf_receitas, informe os programas avaliados. Quando usa ensaios, registre resultados, temperaturas, observações e evidências. Quando usa insumos rastreáveis, registre lote, validade e fabricante. Esses dados sustentam a conclusão técnica.</p>
        <h3>5. Conclusão e emissão</h3>
        <ol>
          <li>Escolha o status final: aprovado, aprovado com ressalvas, reprovado ou pendente.</li>
          <li>Leia o texto conclusivo antes de gerar. O texto deve explicar o resultado com coerência técnica e sem prometer algo que não foi avaliado.</li>
          <li>Clique em <strong>Gerar Carta de Conformidade</strong>. O sistema valida os campos, executa auditoria técnica, gera PDF, salva histórico e abre o documento.</li>
          <li>Abra o PDF e revise visualmente: cliente, CNPJ, equipamento, escopo, conclusão, QR Code e link de validação.</li>
        </ol>

              tplCartaConf_bootstrapApp = res || {};
              if (tplCartaConf_bootstrapApp.appNome) {
                document.getElementById("tplCartaConf_appTitulo").innerText = tplCartaConf_bootstrapApp.appNome;
              }
              tplCartaConf_popularTiposEquipamento();
              tplCartaConf_atualizarTelaPorPerfil();
            })
            .withFailureHandler(function(err) {
              SGO_finalizarCarregamento_();
              console.error("Falha bootstrap:", err);
              tplCartaConf_mostrarAlertaSistema("Falha ao carregar configurações completas. O formulário seguirá em modo básico.");
              tplCartaConf_atualizarTelaPorPerfil();
            })
            .tplCartaConfBootstrap(SGO_getSessionId());
        }
      } catch (e) {
        tplCartaConf_mostrarAlertaSistema("Erro na inicialização: " + tplCartaConf_msgErro(e));
      }
    }

          if (e.key === "Enter") {
            e.preventDefault();
            tplCartaConf_addReceita();
          }
        });
      }

      const inputCnpj = document.getElementById("tplCartaConf_cnpj");
      if (inputCnpj) {
        inputCnpj.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            tplCartaConf_buscarCNPJ();
          }
        });
      }

      document.querySelectorAll('input[name="tplCartaConf_statusFinal"]').forEach(function(radio) {
        radio.addEventListener("change", tplCartaConf_atualizarCardsStatus);
      });

      const sel = document.getElementById("tplCartaConf_tipoEquipamentoCodigo");
      if (sel) sel.addEventListener("change", tplCartaConf_atualizarTelaPorPerfil);

      ["tplCartaConf_marca","tplCartaConf_modelo","tplCartaConf_serie","tplCartaConf_patrimonio","tplCartaConf_volume","tplCartaConf_setor","tplCartaConf_localInstalacao","tplCartaConf_faixaMin","tplCartaConf_faixaMax","tplCartaConf_pmta","tplCartaConf_categoriaNR13","tplCartaConf_classeFiltro","tplCartaConf_rotacaoMaxima","tplCartaConf_temperaturaTrabalho","tplCartaConf_tipoGas","tplCartaConf_sistemaExaustao"].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.addEventListener("input", tplCartaConf_atualizarResumoEquipamentoPreview);
      });

    function tplCartaConf_atualizarTelaPorPerfil() {
      tplCartaConf_perfilAtual = tplCartaConf_getPerfilAtual();

      tplCartaConf_receitas = [];
      tplCartaConf_renderReceitas();

      tplCartaConf_aplicarCamposPorPerfil();
      tplCartaConf_aplicarEscopoPorPerfil();
      tplCartaConf_renderEnsaiosPadrao();
      tplCartaConf_renderNR13Padrao();
      tplCartaConf_atualizarResumoEquipamentoPreview();
      tplCartaConf_atualizarResumoFinalDocumento();
    }

    function tplCartaConf_aplicarCamposPorPerfil() {
      const p = tplCartaConf_perfilAtual || {};

      tplCartaConf_toggleGrupo("campo-termico", !!p.usaEnsaiosTermicos);
      tplCartaConf_toggleGrupo("campo-nr13", !!p.usaInspecaoNR13);
      tplCartaConf_toggleGrupo("campo-capela", p.codigo === "CAPELA_FLUXO_LAMINAR");
      tplCartaConf_toggleGrupo("campo-centrifuga", p.codigo === "CENTRIFUGA");
      tplCartaConf_toggleGrupo("campo-secadora", p.codigo === "SECADORA_TRAQUEIA");
      tplCartaConf_toggleGrupo("campo-eto", p.codigo === "AUTOCLAVE_ETO");
    }

    function tplCartaConf_aplicarEscopoPorPerfil() {
      const p = tplCartaConf_perfilAtual || {};

      tplCartaConf_configurarCheckEtapa("tplCartaConf_boxQi", "tplCartaConf_qi", !!p.usaQI);
      tplCartaConf_configurarCheckEtapa("tplCartaConf_boxQo", "tplCartaConf_qo", !!p.usaQO);
      tplCartaConf_configurarCheckEtapa("tplCartaConf_boxQd", "tplCartaConf_qd", !!p.usaQD);
      tplCartaConf_configurarCheckEtapa("tplCartaConf_boxInspecao", "tplCartaConf_inspecao", !!p.usaInspecaoNR13);

      const txt = document.getElementById("tplCartaConf_textoEscopoPerfil");
      if (txt) {
        txt.innerHTML = '<span class="profile-badge">' + tplCartaConf_esc(p.nome || "-") + '</span>' +
          '<span class="profile-badge">' + tplCartaConf_esc(p.familia || "-") + '</span>' +
          '<div class="mt-2">' + tplCartaConf_esc((p.textos && p.textos.escopo) || "") + '</div>';
      }
    }

    function tplCartaConf_configurarCheckEtapa(boxId, inputId, aplicavel) {
      const box = document.getElementById(boxId);
      const input = document.getElementById(inputId);

      if (!box || !input) return;

      box.classList.toggle("hidden", !aplicavel);
      input.checked = !!aplicavel;
      input.disabled = !aplicavel;
    }

    function tplCartaConf_prepararEtapaProcesso() {
      const p = tplCartaConf_perfilAtual || {};

      const temReceitas = !!p.usaReceitas && (tplCartaConf_isChecked("tplCartaConf_qo") || tplCartaConf_isChecked("tplCartaConf_qd"));
      const temEnsaios = !!p.usaEnsaiosTermicos || !!p.usaEnsaiosGerais;
      const temNR13 = !!p.usaInspecaoNR13;

      tplCartaConf_toggleHidden("tplCartaConf_blocoReceitas", !temReceitas);
      tplCartaConf_toggleHidden("tplCartaConf_blocoEnsaios", !(temEnsaios && !temNR13));
      tplCartaConf_toggleHidden("tplCartaConf_blocoNR13", !temNR13);
      tplCartaConf_toggleHidden("tplCartaConf_alertaProcessoNaoAplicavel", temReceitas || temEnsaios || temNR13);

      const titulo = document.getElementById("tplCartaConf_tituloStep4");
      const help = document.getElementById("tplCartaConf_helpStep4");

      if (temReceitas) {
        titulo.innerText = "4. Receitas / Programas / Ciclos";
        help.innerText = "Informe os programas avaliados. As sugestões abaixo são exclusivas do equipamento selecionado.";
        tplCartaConf_renderReceitasSugeridas();
      } else if (temNR13) {
        titulo.innerText = "4. Inspeção NR-13 / Vaso de Pressão";
        help.innerText = "Informe os ensaios e inspeções realizados para o vaso de pressão.";
      } else if (temEnsaios) {
        titulo.innerText = "4. Ensaios Aplicáveis";
        help.innerText = "Informe os ensaios térmicos ou funcionais aplicáveis ao equipamento selecionado.";
      } else {
        titulo.innerText = "4. Dados do Processo";
        help.innerText = "Não há etapa adicional obrigatória para o escopo selecionado.";
      }

      tplCartaConf_irParaEtapa(4);
    }

    function tplCartaConf_renderReceitasSugeridas() {

      const sugestoes = Array.isArray(tplCartaConf_perfilAtual.receitasPadrao) ? tplCartaConf_perfilAtual.receitasPadrao : [];
      if (!sugestoes.length) {
        area.innerHTML = "";
        return;

      area.innerHTML = '<div class="small text-muted mb-1">Sugestões do perfil:</div>' +
        sugestoes.map(function(nome) {
          return '<button type="button" class="btn btn-sm btn-outline-success me-1 mb-1" onclick="tplCartaConf_addReceitaDireta(\'' + tplCartaConf_escAttr(nome) + '\')">' + tplCartaConf_esc(nome) + '</button>';
        }).join("");

    function tplCartaConf_addReceita() {
      const nome = tplCartaConf_valorCampo("tplCartaConf_cicloNome");
      if (!nome) return;
      tplCartaConf_addReceitaDireta(nome);
      tplCartaConf_setValorCampo("tplCartaConf_cicloNome", "");

    function tplCartaConf_addReceitaDireta(nome) {
      const n = tplCartaConf_formatarTextoPtBr(nome);
      if (!n) return;

      tplCartaConf_receitas.push(n);
      tplCartaConf_receitas = tplCartaConf_deduplicarListaFront(tplCartaConf_receitas);
      tplCartaConf_renderReceitas();
      tplCartaConf_atualizarResumoFinalDocumento();
    }

    function tplCartaConf_removerReceita(idx) {
      tplCartaConf_receitas.splice(idx, 1);
      tplCartaConf_renderReceitas();
      tplCartaConf_atualizarResumoFinalDocumento();
    }

    function tplCartaConf_renderReceitas() {
      const div = document.getElementById("tplCartaConf_listaReceitas");
      if (!div) return;

      if (!tplCartaConf_receitas.length) {
        div.innerHTML = "<div class='text-muted'>Nenhuma receita/programa informado.</div>";
        return;
      }

      div.innerHTML = tplCartaConf_receitas.map(function(c, i) {
        return '' +
          '<div class="item-card d-flex justify-content-between align-items-center">' +
            '<div>' + tplCartaConf_esc(c) + '</div>' +
            '<button class="btn btn-sm btn-outline-danger" type="button" onclick="tplCartaConf_removerReceita(' + i + ')">Remover</button>' +
          '</div>';
      }).join("");

    function tplCartaConf_prepararEtapaInsumos() {
      const container = document.getElementById("tplCartaConf_containerInsumos");
      if (!container) return;

      const p = tplCartaConf_perfilAtual || {};
      container.innerHTML = "";

      if (!p.usaInsumos) {
        container.innerHTML = '<div class="alert alert-secondary">' +
          'Este equipamento não utiliza BI, IQ, Bowie-Dick, Príons, integradores ou insumos rastreáveis neste relatório. A rastreabilidade será baseada em dados técnicos, medições, ensaios e documentação aplicável.' +
          '</div>';
        tplCartaConf_irParaEtapa(5);
        return;
      }

      const lista = Array.isArray(p.insumos) ? p.insumos : [];

        container.innerHTML = '<div class="alert alert-secondary">Nenhum insumo configurado para este equipamento.</div>';

    function tplCartaConf_prepararEtapaConclusao() {
      const textArea = document.getElementById("tplCartaConf_textoConclusao");
      if (!textArea) return;

      const status = tplCartaConf_getStatusSelecionado();
      const textos = (tplCartaConf_perfilAtual && tplCartaConf_perfilAtual.textos) ? tplCartaConf_perfilAtual.textos : {};

      // Conclusão automática forte por status.
      // Se o usuário já digitou ou a IA já refinou, preserva o texto manual.
      if (!textArea.value.trim()) {
        if (status === "Aprovado") {
          textArea.value = textos.conclusaoAprovado || "O equipamento apresentou conformidade preliminar com o escopo avaliado.";
        } else if (status === "Aprovado com Ressalvas") {
          textArea.value = textos.conclusaoRessalvas || "O equipamento apresentou conformidade preliminar com ressalvas técnicas ou documentais.";
        } else if (status === "Reprovado") {
          textArea.value = textos.conclusaoReprovado || "O equipamento não apresentou evidências suficientes de conformidade para o escopo avaliado.";
        } else {
          textArea.value = "A conclusão técnica permanece pendente até a consolidação das evidências aplicáveis.";
        }
      }

      tplCartaConf_atualizarResumoFinalDocumento();
      tplCartaConf_irParaEtapa(6);
    }

        qd: tplCartaConf_isChecked("tplCartaConf_qd"),
        inspecao: tplCartaConf_isChecked("tplCartaConf_inspecao"),
        statusFinal: tplCartaConf_getStatusSelecionado(),
        statusManual: tplCartaConf_getStatusSelecionado(),
        tipoCodigo: perfil.codigo,
        tipoEquipamentoCodigo: perfil.codigo,
        tipoEquipamento: perfil.nome,
        tplCartaConf_receitas: tplCartaConf_coletarReceitasPayload(),
        ensaios: tplCartaConf_coletarEnsaiosPayload(),
        insumos: tplCartaConf_coletarInsumosPayload(),
        nr13: tplCartaConf_coletarNR13Payload(),
        textoConclusao: tplCartaConf_valorCampo("tplCartaConf_textoConclusao"),
        texto_conclusao: tplCartaConf_valorCampo("tplCartaConf_textoConclusao")
      };
    }

    function tplCartaConf_coletarReceitasPayload() {
      if (!tplCartaConf_perfilAtual || !tplCartaConf_perfilAtual.usaReceitas) return [];
      return tplCartaConf_receitas.map(function(nome) { return { nome: nome }; });
    }

    function tplCartaConf_coletarEnsaiosPayload() {
      const cards = document.querySelectorAll(".ensaio-card");
      const out = [];
      cards.forEach(function(card) {
        out.push({
          nome: card.getAttribute("data-ensaio") || "",
          resultado: tplCartaConf_getCardValue(card, ".ensaio-resultado"),
          tempMin: tplCartaConf_getCardValue(card, ".ensaio-temp-min"),
          tempMax: tplCartaConf_getCardValue(card, ".ensaio-temp-max"),
          excursao: tplCartaConf_getCardValue(card, ".ensaio-excursao"),
          obs: tplCartaConf_getCardValue(card, ".ensaio-obs")
        });
      });
      return out;
    }

    function tplCartaConf_coletarNR13Payload() {
      const cards = document.querySelectorAll(".nr13-card");
      const ensaios = [];
      cards.forEach(function(card) {
        ensaios.push({
          nome: card.getAttribute("data-nr13") || "",
          resultado: tplCartaConf_getCardValue(card, ".nr13-resultado"),
          pressaoTeste: tplCartaConf_getCardValue(card, ".nr13-pressao"),
          tempoTeste: tplCartaConf_getCardValue(card, ".nr13-tempo"),
          obs: tplCartaConf_getCardValue(card, ".nr13-obs")
        });
      });

      return {
        pmta: tplCartaConf_valorCampo("tplCartaConf_pmta"),
        volume: tplCartaConf_valorCampo("tplCartaConf_volume"),
        categoriaNR13: tplCartaConf_valorCampo("tplCartaConf_categoriaNR13"),
        ensaios: ensaios
      };
    }

    function tplCartaConf_coletarInsumosPayload() {
      if (!tplCartaConf_perfilAtual || !tplCartaConf_perfilAtual.usaInsumos) return [];

      const cards = document.querySelectorAll(".insumo-card");
      const out = [];

      cards.forEach(function(card) {
        const item = {
          codigo: card.getAttribute("data-insumo-codigo") || "",
          nome: card.getAttribute("data-insumo-nome") || "",
          lote: tplCartaConf_getCardValue(card, ".lote-input"),
          validade: tplCartaConf_getCardValue(card, ".validade-input"),
          fabricante: tplCartaConf_getCardValue(card, ".fabricante-input")
        };

        if (item.lote || item.validade || item.fabricante) out.push(item);
      });

      return out;
    }

    function tplCartaConf_getCardValue(card, selector) {
      const el = card.querySelector(selector);
      return el ? String(el.value || "").trim() : "";
    }

    function tplCartaConf_gerarDocumentoFinal() {
      if (!tplCartaConf_temGoogleScriptRun()) {
        alert("Ambiente sem acesso ao Apps Script. Não é possível gerar o documento.");
        return;
      }

      const btn = document.getElementById("tplCartaConf_btnGerarCarta");
      btn.disabled = true;
      btn.innerText = "Validando...";

      const payload = tplCartaConf_montarPayloadFinal();

      SGO_iniciarCarregamento_();
      google.script.run
        .withSuccessHandler(function(validRes) {
          if (!validRes || !validRes.ok) {
            SGO_finalizarCarregamento_();
            btn.disabled = false;
            btn.innerText = "Gerar Carta de Conformidade";
            alert("Corrija antes de gerar:\n\n" + ((validRes && validRes.mensagem) || "Falha na validação."));
            return;
          }

          btn.innerText = "Auditando...";
          google.script.run
            .withSuccessHandler(function(auditRes) {
              if (auditRes && auditRes.ok) payload.auditoria = auditRes.resultado || auditRes.auditoria || auditRes;

              btn.innerText = "Gerando PDF...";
              google.script.run
                .withSuccessHandler(function(pdfRes) {
                  if (!pdfRes || !pdfRes.ok) {
                    SGO_finalizarCarregamento_();
                    btn.disabled = false;
                    btn.innerText = "Gerar Carta de Conformidade";
                    alert("Erro ao gerar PDF: " + ((pdfRes && pdfRes.mensagem) || "Erro desconhecido."));
                    return;
                  }

                  tplCartaConf_urlPdfGerado = pdfRes.url || "";
                  payload.urlPdf = tplCartaConf_urlPdfGerado;
                  payload.url_pdf = tplCartaConf_urlPdfGerado;
                  payload.codigoValidacao = pdfRes.codigoValidacao || "";
                  payload.codigo_validacao = pdfRes.codigoValidacao || "";
                  payload.urlValidacao = pdfRes.urlValidacao || "";
                  payload.url_validacao = pdfRes.urlValidacao || "";
                  payload.osNumero = pdfRes.osNumero || "";
                  payload.os_numero = pdfRes.osNumero || "";
                  payload.resumo_impressao = pdfRes.resumoImpressao || null;

                  tplCartaConf_ultimoPayloadGerado = payload;
                  tplCartaConf_ultimaValidacaoGerada = {
                    codigo: payload.codigoValidacao || "",
                    url: payload.urlValidacao || "",
                    os: payload.osNumero || ""
                  };

                  btn.innerText = "Salvando...";
                  google.script.run
                    .withSuccessHandler(function(saveRes) {
                      SGO_finalizarCarregamento_();
                      btn.disabled = false;
                      btn.innerText = "Concluído";
                      tplCartaConf_atualizarResumoFinalDocumento();

                      if (!saveRes || !saveRes.ok) {
                        alert("PDF gerado, mas falhou ao salvar histórico: " + ((saveRes && saveRes.mensagem) || "Erro desconhecido."));
                      }

                      try {
                        if (window.tplCartaConf_imprimir) window.tplCartaConf_imprimir(payload.resumo_impressao || payload);
                      } catch (printErr) {
                        console.error(printErr);
                      }

                      if (tplCartaConf_urlPdfGerado) window.open(tplCartaConf_urlPdfGerado, "_blank");
                    })
                    .withFailureHandler(function(err) {
                      SGO_finalizarCarregamento_();
                      btn.disabled = false;
                      btn.innerText = "Concluído (erro DB)";
                      console.error(err);
                      if (tplCartaConf_urlPdfGerado) window.open(tplCartaConf_urlPdfGerado, "_blank");
                    })
                    .tplCartaConfSalvarRelatorio(payload);
                })
                .withFailureHandler(function(err) {
                  SGO_finalizarCarregamento_();
                  btn.disabled = false;
                  btn.innerText = "Gerar Carta de Conformidade";
                  console.error(err);
                  alert("Erro ao gerar PDF.");
                })
                .tplCartaConfGerarDocumento(SGO_getSessionId(), payload);
            })
            .withFailureHandler(function(err) {
              console.warn("Falha auditoria, seguindo para PDF:", err);
              payload.auditoria = {};
              google.script.run
                .withSuccessHandler(function(pdfRes) {
                  SGO_finalizarCarregamento_();
                  btn.disabled = false;
                  btn.innerText = "Gerar Carta de Conformidade";
                  alert("Motor de documento ainda será conectado na próxima etapa.");
                })
                .tplCartaConfGerarDocumento(SGO_getSessionId(), payload);
            })
            .tplCartaConfAuditar(payload);
        })
        .withFailureHandler(function(err) {
          SGO_finalizarCarregamento_();
          btn.disabled = false;
          btn.innerText = "Gerar Carta de Conformidade";
          console.error(err);
          alert("Erro na validação do servidor.");
        })
        .tplCartaConfValidarPayload(SGO_getSessionId(), payload);
    }

    function tplCartaConf_refinarConclusaoIA() {
      if (!tplCartaConf_temGoogleScriptRun()) {
        alert("Ambiente sem acesso ao Apps Script. Não é possível usar a IA.");
        return;
      }

      const btn = document.getElementById("tplCartaConf_btnRefinarIA");
      const textoAtual = tplCartaConf_valorCampo("tplCartaConf_textoConclusao");
      const payload = tplCartaConf_montarPayloadFinal();

      // Garante que a IA receba o texto manual atual, caso o usuário tenha digitado algo.
      payload.textoConclusao = textoAtual || payload.textoConclusao || "";
      payload.texto_conclusao = payload.textoConclusao;

      btn.innerText = "Refinando...";
      btn.disabled = true;

      SGO_iniciarCarregamento_();
      google.script.run
        .withSuccessHandler(function(res) {
          SGO_finalizarCarregamento_();
          btn.innerText = "Refinar com IA";
          btn.disabled = false;

          if (res && res.ok && res.texto) {
            tplCartaConf_setValorCampo("tplCartaConf_textoConclusao", res.texto);
            tplCartaConf_atualizarResumoFinalDocumento();
            return;
          }

          alert("Falha na IA: " + ((res && res.mensagem) || "Não foi possível refinar o texto."));
        })
        .withFailureHandler(function(err) {
          SGO_finalizarCarregamento_();
          btn.innerText = "Refinar com IA";
          btn.disabled = false;
          console.error(err);
          alert("Erro ao conectar com a IA.");
        })
        .tplCartaConfRefinarIA(payload);
    }

    function tplCartaConf_pesquisarDocumentosGerados() {
      if (!tplCartaConf_temGoogleScriptRun()) {
        alert("Ambiente sem acesso ao Apps Script.");
        return;
      }

      const area = document.getElementById("tplCartaConf_resultadoConsultaDocs");
      area.innerHTML = '<div class="loading-soft">Pesquisando documentos...</div>';

      SGO_iniciarCarregamento_();
      google.script.run
        .withSuccessHandler(function(res) {
          SGO_finalizarCarregamento_();
          if (!res || !res.ok) {
            tplCartaConf_renderResultadosPesquisa([]);
            alert((res && res.mensagem) || "Falha na pesquisa.");
            return;
          }
          tplCartaConf_renderResultadosPesquisa(res.itens || []);
        })
        .withFailureHandler(function(err) {
          SGO_finalizarCarregamento_();
          console.error(err);
          tplCartaConf_renderResultadosPesquisa([]);
          alert("Erro ao pesquisar documentos.");
        })
        .tplCartaConfPesquisarDocumentos(tplCartaConf_valorCampo("tplCartaConf_filtroConsultaDocs"));
    }

    function tplCartaConf_renderResultadosPesquisa(itens) {
      const area = document.getElementById("tplCartaConf_resultadoConsultaDocs");
      if (!area) return;

      if (!itens || !itens.length) {
        area.innerHTML = '<div class="alert alert-secondary mb-0">Nenhum documento localizado.</div>';
        window.__resultadoDocsCache = [];
        return;
      }

      area.innerHTML = itens.map(function(item, idx) {
        return '' +
          '<div class="doc-item">' +
            '<div class="d-flex flex-column flex-lg-row justify-content-between gap-3">' +
              '<div>' +
                '<div class="fw-bold">' + tplCartaConf_esc(item.cliente || "Cliente não informado") + '</div>' +
                '<div class="doc-meta">OS: ' + tplCartaConf_esc(item.osNumero || "-") + ' | Código: ' + tplCartaConf_esc(item.codigoValidacao || "-") + '</div>' +
                '<div class="doc-meta">Equipamento: ' + tplCartaConf_esc(item.equipamento || "-") + ' | Série: ' + tplCartaConf_esc(item.serie || "-") + '</div>' +
                '<div class="doc-meta">CNPJ: ' + tplCartaConf_esc(item.cnpj || "-") + ' | Status: <span class="badge-soft">' + tplCartaConf_esc(item.status || "-") + '</span></div>' +
                '<div class="doc-meta">Emitido em: ' + tplCartaConf_esc(item.dataEmissao || "-") + '</div>' +
              '</div>' +
              '<div class="d-flex flex-wrap gap-2 align-items-start">' +
                (item.urlPdf ? '<a class="btn btn-sm btn-primary" target="_blank" rel="noopener noreferrer" href="' + tplCartaConf_esc(item.urlPdf) + '">Abrir PDF</a>' : '') +
                (item.urlValidacao ? '<a class="btn btn-sm btn-outline-success" target="_blank" rel="noopener noreferrer" href="' + tplCartaConf_esc(item.urlValidacao) + '">Validar</a>' : '') +
                '<button class="btn btn-sm btn-dark" type="button" onclick="tplCartaConf_reimprimirDocumentoGerado(' + idx + ')">Reimprimir ticket</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }).join("");

      window.__resultadoDocsCache = itens;
    }

    function tplCartaConf_reimprimirDocumentoGerado(idx) {
      const cache = Array.isArray(window.__resultadoDocsCache) ? window.__resultadoDocsCache : [];
      const item = cache[idx];
      if (!item) return alert("Documento não encontrado.");
      tplCartaConf_imprimirTermica(item);
    }

    function tplCartaConf_imprimirTermica(itemPesquisa) {
      try {
        if (!window.tplCartaConf_imprimir || !window.tplCartaConf_PrinterModule) {
          alert("Módulo de impressora não carregado.");
          return;
        }

        const payload = itemPesquisa && typeof itemPesquisa === "object"
          ? itemPesquisa
          : (tplCartaConf_ultimoPayloadGerado || tplCartaConf_montarPayloadFinal());

        window.tplCartaConf_imprimir(payload.resumo_impressao || payload);
      } catch (e) {
        console.error(e);
        alert("Erro ao imprimir ticket térmico.");
      }
    }

    function tplCartaConf_abrirWhatsapp() {
      if (!tplCartaConf_urlPdfGerado) {
        alert("Gere o documento oficial primeiro.");
        return;
      }

      const msgBase = tplCartaConf_bootstrapApp.whatsappMsg || "Olá! Segue a Carta de Conformidade Técnica.";
      const msg =
        msgBase + "\n\n" +
        "*Cliente:* " + tplCartaConf_valorCampo("tplCartaConf_cliente") + "\n" +
        "*Equipamento:* " + ((tplCartaConf_perfilAtual && tplCartaConf_perfilAtual.nome) || "-") + "\n" +
        "*Status Técnico:* " + tplCartaConf_getStatusSelecionado() + "\n\n" +
        "Link para acesso:\n" + tplCartaConf_urlPdfGerado;

      window.open("https://wa.me/text=" + encodeURIComponent(msg), "_blank");

      if (!el) return;

      const p = tplCartaConf_perfilAtual || tplCartaConf_getPerfilAtual();

      if (p.usaQO) tags.push("QO");
      if (p.usaQD) tags.push("QD");

      if (p.usaEnsaiosTermicos) tags.push("Ensaios térmicos");
      if (p.usaEnsaiosGerais) tags.push("Ensaios funcionais");
      if (p.usaInspecaoNR13) tags.push("NR-13");

      el.innerHTML =
        "<strong>Perfil técnico:</strong> " + tplCartaConf_esc(p.nome || "-") +
        " | Família: " + tplCartaConf_esc(p.familia || "-") +

        " | Modelo: " + tplCartaConf_esc(tplCartaConf_valorCampo("tplCartaConf_modelo") || "-") +
        " | Série: " + tplCartaConf_esc(tplCartaConf_valorCampo("tplCartaConf_serie") || "-") +
        " | TAG: " + tplCartaConf_esc(tplCartaConf_valorCampo("tplCartaConf_patrimonio") || "-") +
        "<div class='mt-2'>" + tags.map(function(t) { return '<span class="profile-badge">' + tplCartaConf_esc(t) + '</span>'; }).join("") + "</div>" +
        (normas.length ? "<div class='mt-2 small text-muted'><strong>Referências do perfil:</strong> " + tplCartaConf_esc(normas.slice(0, 5).join(" - ")) + (normas.length > 5 ? " - ..." : "") + "</div>" : "");
    }

    function tplCartaConf_atualizarResumoFinalDocumento() {
      const resumoEl = document.getElementById("tplCartaConf_resumoFinalDocumento");
      if (!resumoEl) return;

      const p = tplCartaConf_perfilAtual || tplCartaConf_getPerfilAtual();
      const status = tplCartaConf_getStatusSelecionado();

      resumoEl.innerText =
        "Cliente: " + (tplCartaConf_valorCampo("tplCartaConf_cliente") || "-") +
        " | Equipamento: " + (p.nome || "-") +
        " | Receitas: " + tplCartaConf_receitas.length +
        " | Ensaios: " + tplCartaConf_coletarEnsaiosPayload().length +
        " | Status: " + status +
        (tplCartaConf_urlPdfGerado ? " | PDF pronto." : " | PDF pendente.");
    }

    function tplCartaConf_atualizarCardsStatus() {
      const valor = tplCartaConf_getStatusSelecionado();
      tplCartaConf_toggleClasse("tplCartaConf_cardStatusAprovado", valor === "Aprovado");
      tplCartaConf_toggleClasse("tplCartaConf_cardStatusRessalvas", valor === "Aprovado com Ressalvas");
      tplCartaConf_toggleClasse("tplCartaConf_cardStatusReprovado", valor === "Reprovado");
      tplCartaConf_atualizarResumoFinalDocumento();
    }

    function tplCartaConf_getStatusSelecionado() {
      const radio = document.querySelector('input[name="tplCartaConf_statusFinal"]:checked');
      return radio ? radio.value : "Aprovado";
    }

    function tplCartaConf_buscarCNPJ() {
      try {
        const btn = document.getElementById("tplCartaConf_btnBuscarCnpj");
        const input = document.getElementById("tplCartaConf_cnpj");
        const alerta = document.getElementById("tplCartaConf_alertaCnpj");

        alerta.classList.add("hidden");
        alerta.textContent = "";

        const cnpjLimpo = (input.value || "").replace(/\D/g, "");
        if (cnpjLimpo.length !== 14) {
          alerta.innerText = "Por favor, informe os 14 números do CNPJ.";
          alerta.classList.remove("hidden");
          return;
        }

        if (!tplCartaConf_temGoogleScriptRun()) {
          alerta.innerText = "Ambiente sem acesso ao Apps Script.";
          alerta.classList.remove("hidden");
          return;
        }

        btn.disabled = true;
        btn.innerText = "Buscando...";

        SGO_iniciarCarregamento_();
        google.script.run
          .withSuccessHandler(function(res) {
            SGO_finalizarCarregamento_();
            btn.disabled = false;
            btn.innerText = "Buscar";

            if (res && res.ok) {
              tplCartaConf_preencherDadosCliente(res);
              return;
            }

            alerta.innerText = (res && res.mensagem) || "Não foi possível localizar este CNPJ.";
            alerta.classList.remove("hidden");
          })
          .withFailureHandler(function(err) {
            SGO_finalizarCarregamento_();
            btn.disabled = false;
            btn.innerText = "Buscar";
            console.error(err);
            alerta.innerText = "Falha ao consultar CNPJ no servidor.";
            alerta.classList.remove("hidden");
          })
          .tplCartaConfBuscarCnpj(SGO_getSessionId(), cnpjLimpo);
      } catch (e) {
        tplCartaConf_mostrarAlertaSistema("Erro ao buscar CNPJ: " + tplCartaConf_msgErro(e));
      }
    }

    function tplCartaConf_preencherDadosCliente(dados) {
      tplCartaConf_setValorCampo("tplCartaConf_cliente", tplCartaConf_formatarTextoPtBr(dados.razaoSocial || dados.nome || ""));
      tplCartaConf_setValorCampo("tplCartaConf_logradouro", tplCartaConf_formatarLogradouroPtBr(dados.logradouro || ""));
      tplCartaConf_setValorCampo("tplCartaConf_numero", dados.numero || "");
      tplCartaConf_setValorCampo("tplCartaConf_bairro", tplCartaConf_formatarTextoPtBr(dados.bairro || ""));
      tplCartaConf_setValorCampo("tplCartaConf_cidade", tplCartaConf_formatarTextoPtBr(dados.cidade || ""));
      tplCartaConf_setValorCampo("tplCartaConf_uf", String(dados.uf || "").toUpperCase());
    }

    function tplCartaConf_irParaEtapa(n) {
      try {
        tplCartaConf_esconderAlertaSistema();
        if (!tplCartaConf_validarEtapaAntesDeAvancar(n)) return;

        const alvo = document.getElementById("tplCartaConf_step" + n);
        if (!alvo) throw new Error("Etapa step" + n + " não encontrada.");

        document.querySelectorAll(".step").forEach(function(s) { s.classList.remove("active"); });
        alvo.classList.add("active");
      } catch (e) {
        tplCartaConf_mostrarAlertaSistema("Erro ao navegar: " + tplCartaConf_msgErro(e));
      }
    }

    function tplCartaConf_validarEtapaAntesDeAvancar(destino) {
      const ativa = document.querySelector(".step.active");
      const atualId = ativa ? ativa.id : "";

      if (atualId === "tplCartaConf_step1" && destino > 1) {
        const cnpj = (tplCartaConf_valorCampo("tplCartaConf_cnpj") || "").replace(/\D/g, "");
        if (cnpj.length !== 14) return tplCartaConf_alertFalse("Informe um CNPJ válido antes de avançar.");
        if (!tplCartaConf_valorCampo("tplCartaConf_cliente")) return tplCartaConf_alertFalse("Informe a razão social do cliente.");
      }

      if (atualId === "tplCartaConf_step2" && destino > 2) {
        if (!tplCartaConf_valorCampo("tplCartaConf_tipoEquipamentoCodigo")) return tplCartaConf_alertFalse("Selecione o tipo de equipamento.");
        if (!tplCartaConf_valorCampo("tplCartaConf_marca")) return tplCartaConf_alertFalse("Informe a marca.");
        if (!tplCartaConf_valorCampo("tplCartaConf_modelo")) return tplCartaConf_alertFalse("Informe o modelo.");
        if (!tplCartaConf_valorCampo("tplCartaConf_serie")) return tplCartaConf_alertFalse("Informe o número de série.");
      }

      if (atualId === "tplCartaConf_step3" && destino > 3) {
        const p = tplCartaConf_perfilAtual || tplCartaConf_getPerfilAtual();
        const algum =
          (p.usaQI && tplCartaConf_isChecked("tplCartaConf_qi")) ||
          (p.usaQO && tplCartaConf_isChecked("tplCartaConf_qo")) ||
          (p.usaQD && tplCartaConf_isChecked("tplCartaConf_qd")) ||
          (p.usaInspecaoNR13 && tplCartaConf_isChecked("tplCartaConf_inspecao"));

        if (!algum) return tplCartaConf_alertFalse("Selecione ao menos uma etapa aplicável.");
      }

      return true;
    }

    function tplCartaConf_alertFalse(msg) {
      alert(msg);
      return false;
    }

    function tplCartaConf_aplicarMascaraCnpj() {
      const input = document.getElementById("tplCartaConf_cnpj");
      if (!input) return;

      input.addEventListener("input", function(e) {
        let value = (e.target.value || "").replace(/\D/g, "");
        if (value.length > 14) value = value.slice(0, 14);

        let formatted = value;
        if (value.length > 2) formatted = value.replace(/^(\d{2})(\d)/, "$1.$2");
        if (value.length > 5) formatted = formatted.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
        if (value.length > 8) formatted = formatted.replace(/\.(\d{3})(\d)/, ".$1/$2");
        if (value.length > 12) formatted = formatted.replace(/(\d{4})(\d)/, "$1-$2");

        e.target.value = formatted;
      });
    }

    function tplCartaConf_formatarTextoPtBr(texto) {
      const t = String(texto || "").trim().replace(/\s+/g, " ");
      if (!t) return "";
      return t.toLowerCase().split(" ").map(function(p, i) {
        const siglas = ["CME","UTI","UPA","SUS","CPF","CNPJ","OS","SGO+","NR","NR-13","ABNT","NBR","ISO","RDC","ANVISA","ETO","GO","SP","RJ","MG","DF"];
        const upper = p.toUpperCase();
        if (siglas.indexOf(upper) >= 0) return upper;
        const minus = ["de","da","das","do","dos","e","em","na","no","para","por","com"];
        if (i > 0 && minus.indexOf(p) >= 0) return p;
        const especiais = {
          "goiania":"Goiânia","goias":"Goiás","sao":"São","peroxido":"Peróxido","hidrogenio":"Hidrogênio",
          "ultrassonica":"Ultrassônica","centrifuga":"Centrífuga","termica":"Térmica","tecnica":"Técnica",
          "tecnico":"Técnico","prions":"Príons","quimico":"Químico","biologico":"Biológico",
          "instalacao":"Instalação","operacao":"Operação","desempenho":"Desempenho","traqueia":"Traqueia"
        };
        if (especiais[p]) return especiais[p];
        return p.charAt(0).toUpperCase() + p.slice(1);
      }).join(" ");
    }

    function tplCartaConf_formatarLogradouroPtBr(texto) {
      return tplCartaConf_formatarTextoPtBr(texto).replace(/^Av\b/i, "Av.").replace(/^Rua\b/i, "Rua");
    }

    function tplCartaConf_formatarModeloTecnico(texto) {
      const t = String(texto || "").trim();
      if (!t) return "";
      if (/^[A-Za-z0-9\-./ ]+$/.test(t)) return t.toUpperCase();
      return tplCartaConf_formatarTextoPtBr(t);
    }

      const vistos = {};
      return (lista || []).filter(function(item) {
        const chave = String(item || "").trim().toUpperCase();
        if (!chave || vistos[chave]) return false;
        vistos[chave] = true;
        return true;
      });
    }

    function tplCartaConf_esc(text) {

    }

      html += '<div style="text-align:center;margin-bottom:6px;">';
      html += '<div style="font-size:1.22em;font-weight:900;">METROLABS</div>';
      html += '<div style="font-size:0.95em;font-weight:900;">CARTA DE CONFORMIDADE</div>';
      html += thick();
      html += '<div style="font-size:0.98em;font-weight:900;">' + tplCartaConf_esc(stateType) + '</div>';
      html += thick();
      html += '</div>';

      html += renderStatusBox(resultText);
      html += divider();

      html += row("CLIENTE:", fitValue(thermal.cliente, 34));
      html += row("CNPJ:", fitValue(thermal.cnpj, 20));
      html += row("EQUIP.:", fitValue(thermal.equipamento, 28));
      html += row("MARCA/MOD:", fitValue(thermal.marcaModelo, 30));
      html += row("SÉRIE:", fitValue(thermal.serie, 18));
      html += row("TAG:", fitValue(thermal.patrimonio, 18));
      html += row("CAPAC.:", fitValue(thermal.capacidade, 12));
      html += divider();

      html += row("Q.I.:", fitValue(thermal.statusQI, 18));
      html += row("Q.O.:", fitValue(thermal.statusQO, 18));
      html += row("Q.D.:", fitValue(thermal.statusQD, 18));
      html += divider();

      html += row("OS:", fitValue(thermal.osNumero, 22));
      html += row("CÓDIGO:", fitValue(thermal.codigoValidacao, 22));
      html += row("EMISSÃO:", formatDate(data.endTimestamp) + " " + formatTime(data.endTimestamp));
      html += divider();

      html += renderNormas(thermal.normas);
      html += tplCartaConf_renderReceitas(thermal.tplCartaConf_receitas);
      html += renderInsumos(thermal.insumos);

      html += '<div style="text-align:center;font-weight:900;">CONCLUSÃO AUTOMÁTICA</div>';
      html += '<div style="text-align:justify;font-size:0.86em;line-height:1.12;">'
        + tplCartaConf_esc(data.conclusion || thermal.textoValidade || "DOCUMENTO RESUMIDO VINCULADO AO PDF OFICIAL.")
        + '</div>';
      html += divider();

      if (qrSrc) {
        html += '<div style="text-align:center;">';
        html += '<div style="font-size:0.86em;font-weight:900;">VALIDAÇÃO EXTERNA</div>';
        html += '<img data-qrcode-ticket="1" src="' + qrSrc + '" style="width:115px;height:115px;margin-top:4px;margin-left:auto;margin-right:auto;display:block;">';
        html += '<div style="font-size:0.76em;margin-top:4px;word-break:break-word;">' + tplCartaConf_esc(validationText(thermal)) + '</div>';
        html += '</div>';
        html += divider();
      }

      html += '<div style="text-align:center;margin-top:12px;line-height:1.12;">';
      html += '__________________________<br>';
      html += '<span style="font-weight:900;">ASSINATURA RESPONSÁVEL</span><br>';
      html += '<div style="margin-top:8px;font-size:0.8em;">DOCUMENTO GERADO VIA METROLABS</div>';
      html += '<div style="font-size:0.8em;">* FIM DE IMPRESSÃO *</div>';
      html += '</div>';

      body.innerHTML = html;
      lastPrintedSnapshot = data;
    }

    function waitForFrameImages(frameDoc) {
      return new Promise(function(resolve) {
        const imgs = Array.prototype.slice.call(frameDoc.images || []);
        if (!imgs.length) {
          setTimeout(resolve, 500);
          return;
        }

        let pendentes = imgs.length;
        let resolvido = false;

        function concluir() {
          if (resolvido) return;
          resolvido = true;
          setTimeout(resolve, 600);
        }

        imgs.forEach(function(img) {
          if (img.complete && img.naturalWidth > 0) {
            pendentes--;
            if (pendentes <= 0) concluir();
          } else {
            img.onload = function() {
              pendentes--;
              if (pendentes <= 0) concluir();
            };
            img.onerror = function() {
              pendentes--;
              if (pendentes <= 0) concluir();
            };
          }
        });

        setTimeout(concluir, 3500);
      });
    }

    async function executePhysicalPrint() {
      const ticket = el("tplCartaConf_printer-ticket");
      if (!ticket) return;

      const html = ticket.innerHTML;
      const frame = document.createElement("iframe");
      frame.style.position = "fixed";
      frame.style.right = "-9999px";
      frame.style.bottom = "-9999px";
      document.body.appendChild(frame);

      const doc = frame.contentWindow.document;
      doc.open();
      doc.write(
        '<html><head><title>Ticket</title><style>'
        + '@page{margin:0;size:58mm auto;}'
        + 'body{margin:0;padding:0;width:46mm;margin-left:5mm;font-family:"Courier New",monospace;font-size:9.2px;font-weight:bold;text-transform:uppercase;line-height:1.16;color:#000;}'
        + 'div{max-width:100%;word-break:break-word;}'
        + 'img{max-width:100%;display:block;margin:0 auto;}'
        + '</style></head><body>' + html + '</body></html>'
      );
      doc.close();

      try {
        await waitForFrameImages(doc);
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } finally {
        setTimeout(function() {
          if (frame.parentNode) frame.parentNode.removeChild(frame);
        }, 1200);
      }
    }

    return {
      clear: function() {
        currentState = ST.IDLE;
        renderTicket(currentState, null);
      },
      showPreview: function() {
        currentState = ST.PREVIEW;
        renderTicket(currentState, buildSnapshotFromForm());
      },
      printOfficial: function(snapshot) {
        currentState = ST.OFFICIAL;
        renderTicket(currentState, snapshot || buildSnapshotFromForm());
        executePhysicalPrint();
      },
      printCurrent: function() {
        currentState = ST.OFFICIAL;
        renderTicket(currentState, buildSnapshotFromForm());
        executePhysicalPrint();
      },
      reprint: function() {
        if (lastPrintedSnapshot) {
          currentState = ST.REPRINT;
          renderTicket(currentState, lastPrintedSnapshot);
          executePhysicalPrint();
          return;
        }
        currentState = ST.REPRINT;
        renderTicket(currentState, buildSnapshotFromForm());
        executePhysicalPrint();
      }
    };
  })();

  window.tplCartaConf_PrinterModule = PrinterModule;
  window.tplCartaConf_imprimir = function(snapshot) { PrinterModule.printOfficial(snapshot); };
})();

    const container = document.getElementById('tplCartaConfContainer');

    container.innerHTML = TPL_CARTACONF_HTML_;
    tplCartaConf_inicializarPagina();
  }
</script>

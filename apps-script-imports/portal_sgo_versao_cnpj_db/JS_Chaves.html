<script>
  // ==========================================================
  // CHAVES E SENHAS (2026-10-16; redesenho CADASTROS E ADMINISTRAÇÃO 17/10)
  // Servidor: SGO_Chaves.js (Chaves_api*(sessionId, payload)); a lista de donos
  // (SGO_DONOS) fica só no servidor. O valor gravado nunca volta para a tela:
  // no máximo o final mascarado das chaves de API; senhas, nem isso.
  // Um cartão por integração, com a situação (Configurada / Falta configurar /
  // Com erro no teste), o "Testar" ao lado e a ajuda recolhida.
  // Ganchos na casca (JS_Core): ChavesTela_iniciar_ no login, ChavesTela_parar_ no
  // logout, abrir('chaves') -> ChavesTela_render_.
  // ==========================================================
  var CHV = { dono: false, alarme: false, dados: null, abertos: {}, resultados: {} };

  // Integrações: o que é obrigatório para estar "Configurada" e qual teste usar.
  var CHV_INTEGRACOES = {
    "Inteligência artificial": { icone: "fa-wand-magic-sparkles", teste: "gemini", obrig: [["GEMINI_API_KEY"]], resumo: "Interpretações técnicas, PGT e POP, relatórios com análise e leitura de documentos." },
    "Auvo": { icone: "fa-arrows-rotate", teste: "auvo", obrig: [["AUVO_API_KEY", "AUVO_API_TOKEN"]], resumo: "Sincronização de clientes, equipamentos e ordens de serviço com o Auvo." },
    "E-mail": { icone: "fa-envelope", teste: "email", obrig: [["SMTP_SENHA"]], resumo: "Envio dos avisos e documentos por e-mail (sistema@metrolabs.com.br)." },
    "WhatsApp oficial (Meta)": { icone: "fa-comment-dots", teste: "whatsapp", provedor: "meta", obrig: [["META_WA_TOKEN", "META_WA_PHONE_ID"]], resumo: "Avisos por WhatsApp pelo número oficial, com modelos aprovados pela Meta." },
    "Z-API": { icone: "fa-comments", teste: "whatsapp", provedor: "zapi", obrig: [["ZAPI_INSTANCIA", "ZAPI_TOKEN", "ZAPI_CLIENT_TOKEN"]], resumo: "WhatsApp da empresa pela Z-API: avisos do SGO+ e do COMMAND com texto pronto (sem modelo a aprovar) e mensagens recebidas no COMMAND." },
    "Rastreador da frota": { icone: "fa-location-crosshairs", teste: "rastreador", obrig: [["RASTREADOR_TOKEN"]], resumo: "Posição e KM dos veículos pela API da iTracker (hoje somente leitura). O bloqueio da partida depende de a iTracker liberar o acesso com comandos." },
    "Automação predial (Tuya)": { icone: "fa-door-open", teste: "tuya", obrig: [["TUYA_ACCESS_ID", "TUYA_ACCESS_SECRET"]], resumo: "Portões e porta da Diretoria pela nuvem do Smart Life (Tuya). Os comandos reais só saem com a integração ligada e o dispositivo homologado pela Diretoria em Segurança e automação predial." },
    "Relatórios técnicos": { icone: "fa-file-shield", obrig: [["SIMULADOR_ADMIN_SENHA"]], resumo: "Senha do Simulador dos relatórios de qualificação. O modo personalizado não tem senha aqui: cada responsável técnico designado em Configurações cria a própria senha em Qualificação e inspeção > Modo personalizado." },
    "COMMAND": { icone: "fa-tower-broadcast", obrig: [["PONTE_COMMAND_SEGREDO"]], resumo: "Segredo da ponte entre o SGO+ e o COMMAND." }
  };
  var CHV_TESTES = {
    gemini: "Faz uma pergunta mínima à IA com a chave gravada.",
    auvo: "Entra na API do Auvo com a chave e o token gravados.",
    email: "Envia um e-mail de teste para o e-mail do seu usuário.",
    whatsapp: "Envia uma mensagem de teste para o celular digitado, pelo provedor em uso. Pela Meta sai o modelo sgo_aviso_geral (precisa estar aprovado); pela Z-API, um texto pronto (só para celular).",
    rastreador: "Consulta a lista de veículos na iTracker (GET /devices) e mostra quantos encontrou, com número, nome e situação. Não envia comando e não mostra a chave.",
    tuya: "Pede um token à Tuya com o Access ID e o Access Secret gravados e lista os dispositivos da conta do Smart Life ligada ao projeto. Não envia comando, não abre nada e não mostra as chaves."
  };

  function ChavesTela_esc_(v) { return CadUI_esc_(v); }
  function ChavesTela_ehDono_() { return !!(CHV.dono || CHV.alarme); }

  function ChavesTela_chamar_(fn, payload, ok, erro) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) { erro((res && res.message) || "O servidor não confirmou. Atualize a página e tente de novo."); return; }
        try { ok(res); } catch (e) { console.error("Chaves " + fn + ":", e); erro("A resposta chegou, mas a tela não conseguiu mostrar. Atualize a página (F5)."); }
      })
      .withFailureHandler(function (err) {
        console.error("Chaves " + fn + " falhou:", err);
        erro("Não foi possível falar com o servidor. Verifique a conexão e tente de novo; nada foi alterado.");
      })[fn](SGO_getSessionId(), payload || {});
  }

  // ---------- ciclo de vida ----------
  function ChavesTela_mostrarMenu_() { var b = document.getElementById("menu-btn-chaves"); if (b) b.style.display = (CHV.dono || CHV.alarme) ? "" : "none"; }
  function ChavesTela_iniciar_() {
    CHV.dono = false; CHV.alarme = false; CHV.dados = null;
    ChavesTela_mostrarMenu_();
    if (!SESSION) return;
    google.script.run
      .withSuccessHandler(function (res) { CHV.dono = !!(res && res.ok && res.dono); CHV.alarme = !!(res && res.ok && res.alarme); ChavesTela_mostrarMenu_(); })
      .withFailureHandler(function () { CHV.dono = false; CHV.alarme = false; ChavesTela_mostrarMenu_(); })
      .Chaves_apiEhDono(SGO_getSessionId(), {});
  }
  function ChavesTela_parar_() { CHV.dono = false; CHV.alarme = false; CHV.dados = null; CHV.resultados = {}; ChavesTela_mostrarMenu_(); }

  // ---------- tela ----------
  function ChavesTela_render_() {
    var div = document.getElementById("conteudo");
    if (!div) return;
    if (CadUI_movel_()) { try { MOBILE_NAV = { modulo: "mobile_home", tela: "lista" }; atualizarTituloMobile_("Chaves e senhas"); } catch (e) {} }
    div.innerHTML =
      '<div class="module-shell cadx" id="chvTela">' +
        '<div class="module-header"><div class="module-header-left"><h2 class="content-title">Chaves e senhas</h2>' +
          '<p class="content-subtitle">Chaves das integrações e senhas administrativas, agrupadas por integração. Configurações restritas conforme as permissões do seu usuário.</p></div><div class="module-header-right"></div></div>' +
        CadUI_ajuda_(
          "<ul><li><b>O valor gravado nunca aparece de novo.</b> Das chaves de API aparecem só os 4 últimos caracteres; das senhas, nada. Para trocar, grave outro valor por cima.</li>" +
          "<li><b>Configurada</b> = os campos obrigatórios da integração estão gravados. <b>Com erro no teste</b> = o último teste não funcionou e nenhuma chave da integração mudou depois dele. <b>Falta configurar</b> = algum campo obrigatório está vazio.</li>" +
          "<li><b>Testar</b> usa os valores gravados (não o que está digitado no campo). Grave primeiro, depois teste.</li>" +
          "<li><b>Apagar</b> desliga o que depende daquela chave até gravar outra. Cada gravação, teste e exclusão fica no log do sistema (quem, quando e qual chave; nunca o valor).</li>" +
          "<li>WhatsApp: o SGO+ usa um provedor por vez (Meta ou Z-API). Em <i>Automático</i>, usa a Meta se o token da Meta estiver gravado; senão a Z-API, se as 3 chaves dela estiverem gravadas.</li></ul>") +
        '<div class="cadx-resumo bc-resumo" id="chvResumo">' + [1, 2, 3].map(function () { return '<div class="cadx-num bc-resumo-item"><div class="sgo-esq sgo-esq-linha" style="width:40%;height:20px"></div><div class="sgo-esq sgo-esq-linha" style="width:70%"></div></div>'; }).join("") + "</div>" +
        '<div id="chvCorpo">' + CadUI_esqueleto_(6) + "</div>" +
      "</div>";
    ChavesTela_chamar_("Chaves_apiListar", {}, function (res) { CHV.dados = res; ChavesTela_desenhar_(); }, function (m) {
      var c = document.getElementById("chvCorpo");
      if (c) c.innerHTML = '<div class="cadx-vazio bc-vazio" role="alert"><strong>A lista de chaves não carregou.</strong>' + ChavesTela_esc_(m) + '<div style="margin-top:10px"><button type="button" class="cadx-btn cadx-btn-grande" onclick="ChavesTela_render_()">Tentar de novo</button></div></div>';
      var r = document.getElementById("chvResumo"); if (r) r.innerHTML = "";
    });
  }

  function ChavesTela_itensDo_(grupo) { return ((CHV.dados && CHV.dados.itens) || []).filter(function (it) { return it.grupo === grupo; }); }
  function ChavesTela_item_(k) { return ((CHV.dados && CHV.dados.itens) || []).filter(function (it) { return it.chave === k; })[0]; }
  function ChavesTela_configurado_(k) { var it = ChavesTela_item_(k); return !!(it && it.configurado); }

  /** Provedor do WhatsApp em uso: o escolhido; em Automático, Meta se o token dela existir, senão Z-API completa. */
  function ChavesTela_provedorWhats_() {
    var p = ChavesTela_item_("WHATSAPP_PROVEDOR");
    var v = p && p.configurado ? String(p.mascara || "").toLowerCase() : "";
    if (v === "meta" || v === "zapi") return v;
    if (ChavesTela_configurado_("META_WA_TOKEN")) return "meta";
    if (["ZAPI_INSTANCIA", "ZAPI_TOKEN", "ZAPI_CLIENT_TOKEN"].every(ChavesTela_configurado_)) return "zapi";
    return "";
  }

  /** Situação de uma integração: { codigo: ok|falta|erro, texto, tom, detalhe } */
  function ChavesTela_situacao_(grupo) {
    var info = CHV_INTEGRACOES[grupo] || {};
    var itens = ChavesTela_itensDo_(grupo);
    var obrig = info.obrig || [];
    var completo = !obrig.length ? itens.some(function (i) { return i.configurado; }) : obrig.some(function (alternativa) { return alternativa.every(ChavesTela_configurado_); });
    if (!completo) {
      var faltam = [];
      (obrig[0] || []).forEach(function (k) { if (!ChavesTela_configurado_(k)) { var it = ChavesTela_item_(k); faltam.push(it ? it.nome : k); } });
      return { codigo: "falta", texto: "Falta configurar", tom: "tom-alerta", detalhe: faltam.length ? "Falta: " + faltam.join("; ") + (obrig.length > 1 ? " (ou a alternativa indicada na ajuda)" : "") + "." : "" };
    }
    var t = info.teste && CHV.dados && CHV.dados.testes ? CHV.dados.testes[info.teste] : null;
    var emUso = !info.provedor || ChavesTela_provedorWhats_() === info.provedor;
    if (t && emUso) {
      var ultimaTroca = itens.map(function (i) { return i.alteradoIso || ""; }).sort().pop() || "";
      var valeAinda = !ultimaTroca || String(t.em || "") >= ultimaTroca;
      if (valeAinda && !t.funcionou) return { codigo: "erro", texto: "Com erro no teste", tom: "tom-perigo", detalhe: "Teste de " + (t.emBr || "") + ": " + (t.texto || "não funcionou.") };
      if (valeAinda && t.funcionou) return { codigo: "ok", texto: "Configurada", tom: "tom-ok", detalhe: "Testada em " + (t.emBr || "") + " e funcionou." };
    }
    var nota = info.provedor && !emUso ? "Configurada, mas o WhatsApp está usando " + (ChavesTela_provedorWhats_() === "meta" ? "a Meta" : ChavesTela_provedorWhats_() === "zapi" ? "a Z-API" : "outro provedor") + "." : (info.teste ? "Ainda não testada depois da última alteração." : "");
    return { codigo: "ok", texto: "Configurada", tom: "tom-ok", detalhe: nota };
  }

  function ChavesTela_desenhar_() {
    var c = document.getElementById("chvCorpo");
    if (!c || !CHV.dados) return;
    var grupos = (CHV.dados.grupos || []).filter(function (g) { return ChavesTela_itensDo_(g).length; });
    var sit = {};
    grupos.forEach(function (g) { sit[g] = ChavesTela_situacao_(g); });
    var conta = function (cod) { return grupos.filter(function (g) { return sit[g].codigo === cod; }).length; };
    var res = document.getElementById("chvResumo");
    if (res) res.innerHTML = [["ok", "Configuradas", "tom-ok"], ["falta", "Falta configurar", "tom-alerta"], ["erro", "Com erro no teste", "tom-perigo"]].map(function (x) {
      var n = conta(x[0]);
      return '<button type="button" class="cadx-num bc-resumo-item ' + x[2] + (n === 0 ? " is-zero" : "") + '" onclick="ChavesTela_irPara_(\'' + x[0] + '\')"><span class="cadx-num-valor bc-resumo-num">' + n + '</span><span class="cadx-num-rotulo bc-resumo-rot">' + x[1] + "</span></button>";
    }).join("");
    c.innerHTML = (CHV.dados.podeConfigurarAlarme ? '<section class="chvx-grupo" id="chvAlarme"></section><section class="chvx-grupo" id="chvPredial"></section>' : "") + grupos.map(function (g) { return ChavesTela_htmlGrupo_(g, sit[g]); }).join("");
    if (CHV.dados.podeConfigurarAlarme) { ChavesAlarme_chamar_("configuracao", {}); ChavesPredial_carregar_(); }
    if (res && !grupos.length) res.innerHTML = "";
    c.querySelectorAll("[data-chv-grupo]").forEach(function (det) {
      det.addEventListener("toggle", function () { CHV.abertos[det.getAttribute("data-chv-grupo")] = det.open; });
    });
  }

  function ChavesTela_irPara_(cod) {
    var grupos = (CHV.dados.grupos || []).filter(function (g) { return ChavesTela_itensDo_(g).length && ChavesTela_situacao_(g).codigo === cod; });
    if (!grupos.length) return;
    grupos.forEach(function (g) { CHV.abertos[g] = true; });
    ChavesTela_desenhar_();
    var el = document.querySelector('[data-chv-grupo="' + grupos[0].replace(/"/g, "") + '"]');
    if (el) try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}
  }

  function ChavesTela_idGrupo_(g) { return String(g).replace(/[^A-Za-z0-9]/g, ""); }

  function ChavesTela_htmlGrupo_(g, s) {
    var info = CHV_INTEGRACOES[g] || {};
    var gid = ChavesTela_idGrupo_(g);
    var aberto = CHV.abertos[g] !== undefined ? CHV.abertos[g] : s.codigo === "erro";
    var teste = info.teste;
    return '<details class="chvx-grupo" data-chv-grupo="' + ChavesTela_esc_(g) + '"' + (aberto ? " open" : "") + ">" +
      '<summary class="chvx-grupo-cab" style="list-style:none;cursor:pointer">' +
        '<div class="chvx-grupo-nome"><h3><i class="fas ' + (info.icone || "fa-key") + '" aria-hidden="true" style="color:var(--bc-text-3);width:20px"></i> ' + ChavesTela_esc_(g) + "</h3>" +
          '<div class="cadx-sub">' + ChavesTela_esc_(info.resumo || "") + "</div>" + (s.detalhe ? '<div class="cadx-sub" style="margin-top:3px">' + ChavesTela_esc_(s.detalhe) + "</div>" : "") + "</div>" +
        '<div class="chvx-grupo-acoes"><span class="cadx-selo bc-selo ' + s.tom + '">' + ChavesTela_esc_(s.texto) + "</span>" +
          (teste && teste !== "whatsapp" ? '<button type="button" class="cadx-btn cadx-btn-grande" id="chvTestar_' + gid + '" onclick="event.preventDefault();ChavesTela_testar_(\'' + teste + "','" + gid + '\')">' + (teste === "rastreador" || teste === "tuya" ? "Testar conexão" : "Testar") + "</button>" : "") +
          '<span class="cadx-sub">' + (aberto ? "" : "Configurar") + "</span></div>" +
      "</summary>" +
      '<div class="chvx-grupo-corpo">' +
        (teste ? '<div class="chvx-teste"><div class="cadx-sub">' + ChavesTela_esc_(CHV_TESTES[teste]) + "</div>" +
          (teste === "whatsapp" ? '<div class="chvx-linha" style="margin-top:6px"><input type="tel" id="chvTel_' + gid + '" placeholder="Celular com DDD para o teste, ex.: (62) 98241-7106" aria-label="Celular para o teste" inputmode="tel"><button type="button" class="cadx-btn cadx-btn-grande" id="chvTestar_' + gid + '" onclick="ChavesTela_testar_(\'whatsapp\',\'' + gid + '\')">Testar</button></div>' : "") +
          '<div class="chvx-res" id="chvRes_' + gid + '">' + (CHV.resultados[gid] || "") + "</div></div>" : "") +
        ChavesTela_itensDo_(g).map(ChavesTela_htmlItem_).join("") +
        (g === "WhatsApp oficial (Meta)" ? ChavesTela_htmlModelos_() : "") +
        (g === "Z-API" ? ChavesTela_htmlZapi_() : "") +
      "</div></details>";
  }

  function ChavesTela_htmlItem_(it) {
    var k = it.chave;
    var sit = it.configurado
      ? '<span class="cadx-selo bc-selo tom-ok">Gravado' + (it.alteradoEm ? " em " + ChavesTela_esc_(it.alteradoEm) : "") + "</span>" + (it.mascara && !it.opcoes ? '<span class="chvx-mascara">' + ChavesTela_esc_(it.mascara) + "</span>" : "")
      : '<span class="cadx-selo bc-selo">Vazio</span>';
    var controle;
    if (it.opcoes) {
      var atual = it.configurado ? String(it.mascara || "") : "";
      controle = '<select id="chvValor_' + k + '" aria-label="' + ChavesTela_esc_(it.nome) + '"><option value=""' + (atual ? "" : " selected") + ">" + ChavesTela_esc_(it.vazio || "Não definido") + "</option>" +
        it.opcoes.map(function (o) { return '<option value="' + ChavesTela_esc_(o[0]) + '"' + (atual === o[0] ? " selected" : "") + ">" + ChavesTela_esc_(o[1]) + "</option>"; }).join("") + "</select>" +
        '<button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" id="chvGravar_' + k + '" onclick="ChavesTela_gravarOpcao_(\'' + k + '\')">Gravar</button>';
    } else {
      var tipoCampo = it.tipo === "aberto" ? "text" : "password";
      var ph = it.exemplo ? "ex.: " + it.exemplo : (it.configurado ? "Cole um valor novo para trocar" : "Cole aqui o valor");
      controle = '<input type="' + tipoCampo + '" id="chvValor_' + k + '" autocomplete="new-password" spellcheck="false" placeholder="' + ChavesTela_esc_(ph) + '" aria-label="' + ChavesTela_esc_(it.nome) + '">' +
        '<button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" id="chvGravar_' + k + '" onclick="ChavesTela_gravar_(\'' + k + '\')">Gravar</button>' +
        (it.configurado ? '<button type="button" class="cadx-btn cadx-btn-grande cadx-btn-risco" id="chvApagar_' + k + '" onclick="ChavesTela_apagar_(\'' + k + '\')">Apagar</button>' : "");
    }
    return '<div class="chvx-item" id="chvItem_' + k + '"><div><div class="chvx-item-nome">' + ChavesTela_esc_(it.nome) + '</div><div class="chvx-item-sit">' + sit + "</div></div>" +
      '<div><div class="chvx-linha">' + controle + "</div>" +
        (it.ajuda ? '<details class="chvx-ajuda-item"><summary>Onde encontrar e para que serve</summary><p>' + ChavesTela_esc_(it.ajuda) + "</p></details>" : "") +
        '<div class="cadx-msg" id="chvMsg_' + k + '" role="status"></div></div></div>';
  }

  // ---------- Z-API (20/10/2026): passo a passo, conferir conexão, recebimento no COMMAND e teste para mim ----------
  // Servidor: SGO_Zapi.js (Chaves_apiZapiConferir, Chaves_apiZapiReceber, Chaves_apiZapiTesteParaMim). O endereço do
  // webhook leva o segredo do COMMAND: é montado e gravado na Z-API pelo servidor e nunca chega a esta tela.
  function ChavesTela_htmlZapi_() {
    var b = function (id, fn, rot) { return '<button type="button" class="cadx-btn cadx-btn-grande" id="' + id + '" onclick="ChavesTela_zapi_(\'' + fn + "','" + id + '\')">' + rot + "</button>"; };
    return '<div class="chvx-item"><div><div class="chvx-item-nome">Passo a passo da Z-API</div><div class="chvx-item-sit">Do painel da Z-API até a primeira mensagem, em ordem.</div></div><div>' +
      '<ol style="margin:4px 0 10px 18px;padding:0;line-height:1.55">' +
        "<li>No painel da Z-API (app.z-api.io), abra a instância da Metrolabs e copie a <b>identificação da instância</b> e o <b>token da instância</b>; no menu Segurança, copie o <b>token de segurança da conta</b>.</li>" +
        "<li>Cole cada um no campo dele, abaixo, e clique em Gravar.</li>" +
        "<li>No grupo <b>WhatsApp oficial (Meta)</b>, em <i>Provedor do WhatsApp em uso</i>, escolha <b>Z-API</b> e clique em Gravar. Vale para o SGO+ e para o COMMAND.</li>" +
        "<li>Clique em <b>Conferir conexão</b>. Desconectada: leia o QR Code no painel da Z-API com o celular da empresa e confira de novo.</li>" +
        "<li>Clique em <b>Configurar recebimento</b> (uma vez): as mensagens que chegam ao número passam a cair no COMMAND.</li>" +
        "<li>Clique em <b>Enviar mensagem de teste para mim</b> e confira no seu celular.</li></ol>" +
      '<div class="chvx-linha">' + b("chvZapiConferir", "Chaves_apiZapiConferir", "Conferir conexão") + b("chvZapiReceber", "Chaves_apiZapiReceber", "Configurar recebimento") +
        b("chvZapiTeste", "Chaves_apiZapiTesteParaMim", "Enviar mensagem de teste para mim") + "</div>" +
      '<details class="chvx-ajuda-item"><summary>Proteção do número</summary><p>A Z-API usa o WhatsApp de um celular: muitas mensagens seguidas podem fazer o WhatsApp bloquear o número. Por isso o SGO+ e o COMMAND mandam por uma fila só, com intervalo sorteado entre as mensagens e limite por hora, por dia e por pessoa (campos abaixo; vazio = padrão). Só recebe quem tem celular válido no cadastro, e as regras de cada aviso continuam valendo (dia útil, horário de trabalho, um resumo por dia).</p></details>' +
      '<div class="chvx-res" id="chvZapiRes" role="status">' + (CHV.resultados.zapi || "") + "</div></div></div>";
  }
  function ChavesTela_zapi_(fn, id) {
    var res = document.getElementById("chvZapiRes"), btn = document.getElementById(id), rotulo = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = "Aguarde…"; }
    if (res) res.innerHTML = '<div class="cadx-sub">Falando com a Z-API…</div>';
    CHV.abertos["Z-API"] = true;
    ChavesTela_chamar_(fn, {}, function (r) {
      CHV.resultados.zapi = '<div class="cadx-faixa bc-faixa ' + (r.funcionou ? "tom-ok" : "tom-perigo") + '">' + ChavesTela_esc_(r.texto) + "</div>" + (r.fila ? '<div class="cadx-sub" style="margin-top:6px">' + ChavesTela_esc_(r.fila) + "</div>" : "");
      ChavesTela_chamar_("Chaves_apiListar", {}, function (l) { CHV.dados = l; ChavesTela_desenhar_(); }, function () { var el = document.getElementById("chvZapiRes"); if (el) el.innerHTML = CHV.resultados.zapi; if (btn) { btn.disabled = false; btn.textContent = rotulo; } });
    }, function (m) {
      if (btn) { btn.disabled = false; btn.textContent = rotulo; }
      CHV.resultados.zapi = '<div class="cadx-faixa bc-faixa tom-perigo">' + ChavesTela_esc_(m) + "</div>";
      if (res) res.innerHTML = CHV.resultados.zapi;
    });
  }

  // ---------- modelos do WhatsApp oficial (Meta) ----------
  function ChavesTela_htmlModelos_() {
    return '<div class="chvx-item"><div><div class="chvx-item-nome">Modelos de mensagem (Meta)</div><div class="chvx-item-sit">Pela Meta, o SGO+ só envia por modelo aprovado.</div></div><div>' +
      '<div class="chvx-linha"><button type="button" class="cadx-btn cadx-btn-grande" id="chvModAtualizar" onclick="ChavesTela_modelosSituacao_()">Ver a situação dos modelos</button>' +
      '<button type="button" class="cadx-btn cadx-btn-grande" id="chvModCadastrar" onclick="ChavesTela_modelosCadastrar_()">Cadastrar os modelos na Meta</button></div>' +
      '<details class="chvx-ajuda-item"><summary>Como funciona</summary><p>"Cadastrar os modelos na Meta" envia para análise os 7 modelos do SGO+ (texto fixo do sistema, pt_BR, categoria Utilidade); os que já existem não são alterados. Usa o token e a identificação da conta comercial gravados acima. A aprovação sai em minutos ou em até 24 horas.</p></details>' +
      '<div class="chvx-res" id="chvModRes"></div></div></div>';
  }
  function ChavesTela_classeModelo_(it) { if (it.falta) return "tom-alerta"; if (it.status === "APPROVED") return "tom-ok"; if (it.status === "PENDING" || it.status === "IN_APPEAL") return "tom-info"; return "tom-perigo"; }
  function ChavesTela_listaModelos_(itens, rot) {
    return itens && itens.length ? '<ul class="cadx-arvore" style="margin-top:8px">' + itens.map(function (it) {
      var x = rot ? (rot[it.resultado] || [it.resultado, ""]) : [it.situacao, ChavesTela_classeModelo_(it)];
      return '<li><div class="cadx-no"><div class="cadx-no-texto"><span class="cadx-mono">' + ChavesTela_esc_(it.nome) + '</span><div class="cadx-sub">' + ChavesTela_esc_(rot ? it.texto : (it.uso || "") + (it.motivo ? ". " + it.motivo : "")) + '</div></div><span class="cadx-selo bc-selo ' + x[1] + '">' + ChavesTela_esc_(x[0]) + "</span></div></li>";
    }).join("") + "</ul>" : "";
  }
  function ChavesTela_modelosCadastrar_() {
    CadUI_confirmar_({
      titulo: "Cadastrar os modelos na Meta", botao: "Enviar para análise",
      texto: "<p>Enviar para análise da Meta os modelos do SGO+ que ainda não estão cadastrados? Os que já existem não são alterados.</p>",
      aoConfirmar: function (v, fechar) {
        fechar();
        var res = document.getElementById("chvModRes"), btn = document.getElementById("chvModCadastrar");
        if (btn) btn.disabled = true;
        if (res) res.innerHTML = '<div class="cadx-sub">Cadastrando na Meta…</div>';
        ChavesTela_chamar_("Chaves_apiModelosCadastrar", {}, function (r) {
          if (btn) btn.disabled = false;
          var rot = { cadastrado: ["Enviado", "tom-info"], ja_existe: ["Já cadastrado", "tom-ok"], erro: ["Erro", "tom-perigo"], nao_tentado: ["Não tentado", "tom-alerta"] };
          if (res) res.innerHTML = '<div class="cadx-faixa bc-faixa ' + (r.funcionou ? "tom-ok" : "tom-perigo") + '">' + ChavesTela_esc_(r.texto) + "</div>" + ChavesTela_listaModelos_(r.itens, rot);
        }, function (m) { if (btn) btn.disabled = false; if (res) res.innerHTML = '<div class="cadx-faixa bc-faixa tom-perigo">' + ChavesTela_esc_(m) + "</div>"; });
      }
    });
  }
  function ChavesTela_modelosSituacao_() {
    var res = document.getElementById("chvModRes"), btn = document.getElementById("chvModAtualizar");
    if (btn) btn.disabled = true;
    if (res) res.innerHTML = '<div class="cadx-sub">Consultando a Meta…</div>';
    ChavesTela_chamar_("Chaves_apiModelosSituacao", {}, function (r) {
      if (btn) btn.disabled = false;
      if (res) res.innerHTML = '<div class="cadx-faixa bc-faixa ' + (r.funcionou && !r.faltam ? "tom-ok" : "tom-alerta") + '">' + ChavesTela_esc_(r.texto) + "</div>" + ChavesTela_listaModelos_(r.itens, null);
    }, function (m) { if (btn) btn.disabled = false; if (res) res.innerHTML = '<div class="cadx-faixa bc-faixa tom-perigo">' + ChavesTela_esc_(m) + "</div>"; });
  }

  // ---------- gravar, apagar, testar ----------
  function ChavesTela_msg_(k, texto, tipo) { var el = document.getElementById("chvMsg_" + k); if (el) { el.textContent = texto || ""; el.className = "cadx-msg" + (tipo === "erro" ? " is-erro" : tipo === "ok" ? " is-ok" : ""); } }
  function ChavesTela_travar_(k, sim) { ["chvGravar_", "chvApagar_"].forEach(function (p) { var b = document.getElementById(p + k); if (b) b.disabled = !!sim; }); }
  function ChavesTela_depoisDeGravar_(res, k, texto) {
    CHV.dados = res;
    var it = ChavesTela_item_(k);
    if (it) CHV.abertos[it.grupo] = true;
    ChavesTela_desenhar_();
    ChavesTela_msg_(k, texto, "ok");
    CadUI_aviso_(texto, "ok");
  }

  function ChavesTela_gravar_(k) {
    var campo = document.getElementById("chvValor_" + k);
    var valor = campo ? String(campo.value || "").trim() : "";
    if (!valor) { ChavesTela_msg_(k, "Cole o valor no campo antes de clicar em Gravar.", "erro"); if (campo) campo.focus(); return; }
    ChavesTela_travar_(k, true);
    ChavesTela_msg_(k, "Gravando…", "");
    ChavesTela_chamar_("Chaves_apiGravar", { chave: k, valor: valor }, function (res) {
      if (campo) campo.value = "";
      ChavesTela_depoisDeGravar_(res, k, res.mensagem || "Gravado.");
    }, function (m) { ChavesTela_travar_(k, false); ChavesTela_msg_(k, m, "erro"); });
  }

  /** Opções (Ligado/Desligado, provedor): o vazio apaga a chave (volta ao padrão). */
  function ChavesTela_gravarOpcao_(k) {
    var sel = document.getElementById("chvValor_" + k);
    var valor = sel ? sel.value : "";
    var it = ChavesTela_item_(k) || {};
    if (!valor) {
      if (!it.configurado) { ChavesTela_msg_(k, "Já está em " + (it.vazio || "padrão") + ".", "ok"); return; }
      ChavesTela_travar_(k, true);
      ChavesTela_chamar_("Chaves_apiApagar", { chave: k }, function (res) { ChavesTela_depoisDeGravar_(res, k, it.nome + ": " + (it.vazio || "padrão") + "."); }, function (m) { ChavesTela_travar_(k, false); ChavesTela_msg_(k, m, "erro"); });
      return;
    }
    ChavesTela_travar_(k, true);
    ChavesTela_chamar_("Chaves_apiGravar", { chave: k, valor: valor }, function (res) { ChavesTela_depoisDeGravar_(res, k, res.mensagem || "Gravado."); }, function (m) { ChavesTela_travar_(k, false); ChavesTela_msg_(k, m, "erro"); });
  }

  function ChavesTela_apagar_(k) {
    var it = ChavesTela_item_(k) || { nome: k };
    CadUI_confirmar_({
      titulo: "Apagar a chave", risco: true, botao: "Apagar",
      texto: "<p>Apagar <b>" + ChavesTela_esc_(it.nome) + "</b>?</p><p>O que depende desta chave para de funcionar até você gravar outra. O valor apagado não pode ser recuperado por aqui.</p>",
      aoConfirmar: function (v, fechar, reabilitar) {
        ChavesTela_chamar_("Chaves_apiApagar", { chave: k }, function (res) { fechar(); ChavesTela_depoisDeGravar_(res, k, res.mensagem || "Apagado."); }, reabilitar);
      }
    });
  }

  function ChavesTela_testar_(tipo, gid) {
    var res = document.getElementById("chvRes_" + gid), btn = document.getElementById("chvTestar_" + gid);
    var payload = { tipo: tipo };
    if (tipo === "whatsapp") {
      var tel = document.getElementById("chvTel_" + gid);
      payload.telefone = tel ? String(tel.value || "").trim() : "";
      if (!payload.telefone) { if (res) res.innerHTML = '<div class="cadx-faixa bc-faixa tom-alerta">Digite o celular com DDD que vai receber o teste.</div>'; if (tel) tel.focus(); return; }
    }
    var grupo = Object.keys(CHV_INTEGRACOES).filter(function (g) { return ChavesTela_idGrupo_(g) === gid; })[0];
    if (grupo) CHV.abertos[grupo] = true;
    if (btn) { btn.disabled = true; btn.textContent = "Testando…"; }
    if (res) res.innerHTML = '<div class="cadx-sub">Testando…</div>';
    else { var det = document.querySelector('[data-chv-grupo="' + (grupo || "") + '"]'); if (det) det.open = true; }
    ChavesTela_chamar_("Chaves_apiTestar", payload, function (r) {
      var lista = (tipo === "rastreador" || tipo === "tuya") && r.dispositivos && r.dispositivos.length ? '<ul class="cadx-arvore" style="margin-top:8px">' + r.dispositivos.map(function (d) {
        return '<li><div class="cadx-no"><span class="cadx-mono">ID ' + ChavesTela_esc_(d.id) + "</span><span>" + ChavesTela_esc_(d.nome || "sem nome") + '</span><span class="cadx-sub">' + ChavesTela_esc_(CadUI_maiusculaInicial_(d.situacao || "")) + "</span></div></li>";
      }).join("") + "</ul>" : "";
      CHV.resultados[gid] = '<div class="cadx-faixa bc-faixa ' + (r.funcionou ? "tom-ok" : "tom-perigo") + '">' + ChavesTela_esc_(r.texto) + "</div>" + lista;
      // a situação do grupo usa o teste gravado no servidor: recarrega a lista (sem valores)
      ChavesTela_chamar_("Chaves_apiListar", {}, function (l) { CHV.dados = l; ChavesTela_desenhar_(); }, function () { var el = document.getElementById("chvRes_" + gid); if (el) el.innerHTML = CHV.resultados[gid]; if (btn) btn.disabled = false; });
    }, function (m) {
      if (btn) { btn.disabled = false; btn.textContent = tipo === "rastreador" || tipo === "tuya" ? "Testar conexão" : "Testar"; }
      CHV.resultados[gid] = '<div class="cadx-faixa bc-faixa tom-perigo">' + ChavesTela_esc_(m) + "</div>";
      if (res) res.innerHTML = CHV.resultados[gid];
    });
  }
  var CHV_ALARME = { ocupado: false, painel: null };
  function ChavesAlarme_chamar_(acao, dados) {
    if (CHV_ALARME.ocupado) return;
    var el = document.getElementById('chvAlarme'); if (!el) return;
    CHV_ALARME.ocupado = true;
    el.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    function fim() { CHV_ALARME.ocupado = false; el.querySelectorAll('button').forEach(function (b) { b.disabled = false; }); }
    function erro(m) { fim(); var msg = document.getElementById('chvAlarmeMsg'); if (!msg) { el.innerHTML = '<h3>Alarme Intelbras</h3><p id="chvAlarmeMsg" role="alert"></p><button type="button" class="cadx-btn" onclick="ChavesAlarme_chamar_(\'configuracao\',{})">Tentar novamente</button>'; msg = document.getElementById('chvAlarmeMsg'); } msg.textContent = m; }
    google.script.run.withSuccessHandler(function (r) { fim(); if (!r || !r.ok) { erro(r && r.message || 'Não foi possível concluir.'); return; } ChavesAlarme_desenhar_(r); })
      .withFailureHandler(function () { erro('Sem resposta do servidor. Consulte a configuração antes de tentar novamente.'); })
      .Alarme_api(SGO_getSessionId(), acao, dados || {});
  }
  function ChavesAlarme_desenhar_(r) {
    var el = document.getElementById('chvAlarme'); if (!el || !r.podeConfigurar) return;
    CHV_ALARME.painel = r;
    var esc = ChavesTela_esc_, estado = r.estado;
    el.innerHTML = '<div class="chvx-grupo-cab"><div><h3><i class="fas fa-shield-halved" aria-hidden="true"></i> Alarme Intelbras</h3><p class="cadx-sub">ANM 24 Net · conexão pela nuvem Intelbras com MAC e senha remota</p></div><span class="cadx-selo '+(r.ligado?'tom-ok':'tom-alerta')+'">'+(r.ligado?'Comandos habilitados':'Comandos desligados')+'</span></div>'+
      '<div class="chvx-grupo-corpo"><p id="chvAlarmeMsg" role="status">'+esc(r.mensagem || (r.configurado?'Credenciais gravadas no cofre.':'Cadastre a central para começar.'))+(estado?' '+esc(estado.disparado?'Central em disparo.':estado.armado?'Central armada.':'Central desarmada.'):'')+'</p>'+
      '<div class="chvx-item"><div><div class="chvx-item-nome">Central e credenciais</div><p class="cadx-sub">MAC e senha nunca retornam à tela. Deixe esses campos vazios para manter o valor gravado. Salvar desliga os comandos.</p></div><form id="chvAlarmeForm" onsubmit="event.preventDefault();ChavesAlarme_salvar_()"><div class="chvx-linha">'+
      '<label>Nome<input id="chvAlarmeNome" maxlength="80" value="'+esc(r.nome||'Alarme')+'"></label>'+
      '<label>MAC da central<input id="chvAlarmeMac" autocomplete="off" spellcheck="false" placeholder="'+(r.configurado?'MAC gravado — vazio mantém':'AA:BB:CC:DD:EE:FF')+'"></label>'+
      '<label>Senha remota<input id="chvAlarmeSenha" type="password" autocomplete="new-password" inputmode="numeric" maxlength="6" placeholder="'+(r.configurado?'Senha gravada — vazio mantém':'4 a 6 dígitos')+'"></label>'+
      '<label>Porta da nuvem<select id="chvAlarmePorta"><option value="9016"'+(r.porta===9016?' selected':'')+'>9016</option><option value="9015"'+(r.porta===9015?' selected':'')+'>9015</option></select></label></div>'+
      '<div class="chvx-linha" style="margin-top:12px"><button type="submit" class="cadx-btn cadx-btn-primario">Salvar configuração</button>'+
      (r.configurado?'<button type="button" class="cadx-btn" onclick="ChavesAlarme_chamar_(\'estado\',{})">Testar leitura</button><button type="button" class="cadx-btn" onclick="ChavesAlarme_habilitar_()">'+(r.ligado?'Desligar comandos':'Habilitar arme e desarme')+'</button>':'')+'</div></form></div>'+
      '<details class="chvx-ajuda-item"><summary>Como funciona a integração</summary><p>Utiliza o protocolo da central pela nuvem Intelbras, baseado na integração independente homeassistant-intelbras-amt. O token push é usado para notificações do aplicativo; não substitui a senha remota de controle. Testar leitura consulta o estado sem armar nem desarmar. Os comandos cotidianos ficam em Segurança e automação predial.</p></details></div>';
  }
  function ChavesAlarme_salvar_() {
    if (CHV_ALARME.ocupado) return;
    var v = function (id) { return document.getElementById(id).value; };
    var dados = { nome: v('chvAlarmeNome'), mac: v('chvAlarmeMac'), senha: v('chvAlarmeSenha'), porta: Number(v('chvAlarmePorta')) };
    ChavesAlarme_chamar_('salvar', dados);
    document.getElementById('chvAlarmeSenha').value = '';
    document.getElementById('chvAlarmeMac').value = '';
  }
  function ChavesAlarme_habilitar_() {
    var ligado = CHV_ALARME.painel && CHV_ALARME.painel.ligado;
    if (!window.confirm(ligado?'Desligar os comandos do alarme no SGO+?':'Habilitar arme e desarme para a equipe interna? Uma leitura válida da central será exigida.')) return;
    ChavesAlarme_chamar_(ligado?'desligar':'habilitar', {});
  }

  function ChavesPredial_carregar_() {
    var el = document.getElementById('chvPredial'); if (!el) return;
    AutPred_chamar_('painel', {}, function (r) {
      if (!r.podeAdministrar) { el.innerHTML = ''; return; }
      var lista = [];
      (r.unidades || []).forEach(function (u) { (u.dispositivos || []).forEach(function (d) { if (d.podeAutoAbrir) lista.push(d); }); });
      if (!lista.length) { el.innerHTML = ''; return; }
      var esc = ChavesTela_esc_;
      el.innerHTML = '<div class="chvx-grupo-cab"><div><h3>Segurança predial</h3><p class="cadx-sub">Abertura automática das portas autorizadas</p></div></div><div class="chvx-grupo-corpo">'+lista.map(function (d) {
        return '<div class="chvx-item"><div><div class="chvx-item-nome">'+esc(d.nome)+'</div><p class="cadx-sub">Quando ligada, a porta abre sozinha ao tocar a campainha, sem confirmação. A permissão para destravar continua sendo verificada.</p></div><div><button type="button" class="cadx-btn" data-chv-auto="'+esc(d.id)+'" data-ligado="'+(d.autoAbrir?'1':'0')+'" onclick="ChavesPredial_auto_(this)">'+(d.autoAbrir?'Desligar abertura automática':'Ligar abertura automática')+'</button><p class="cadx-sub">'+(d.autoAbrir?'Ligada':'Desligada')+(d.autoAbrirPor?' · alterada por '+esc(d.autoAbrirPor):'')+(d.autoAbrirEm?' em '+esc(d.autoAbrirEm):'')+'</p></div></div>';
      }).join('')+'<p id="chvPredialMsg" role="status"></p></div>';
    }, function (m) { el.textContent = m; });
  }
  function ChavesPredial_auto_(botao) {
    var ligar = botao.getAttribute('data-ligado') !== '1', id = botao.getAttribute('data-chv-auto');
    if (ligar && !window.confirm('Ligar a abertura automática desta porta? Sempre que tocarem a campainha, o SGO+ abrirá a porta sozinho.')) return;
    botao.disabled = true;
    AutPred_chamar_('autoAbrir', { id: id, ligado: ligar }, function () { ChavesPredial_carregar_(); }, function (m) { botao.disabled = false; var msg = document.getElementById('chvPredialMsg'); if (msg) msg.textContent = m; });
  }

</script>

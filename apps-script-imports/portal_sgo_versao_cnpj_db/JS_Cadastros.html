    });
  }
  function Unidades_reativar_(u) {
    CadTela_acaoRisco_({
      titulo: "Reativar a unidade", botao: "Reativar unidade", risco: false, fn: "unidadesReativar", id: u.ID,
      texto: "<p>Reativar <b>" + CadUI_esc_(u.NOME_UNIDADE) + "</b>? " + (u.CLIENTE_STATUS && u.CLIENTE_STATUS !== "ATIVO" ? "O cliente desta unidade está inativo: reative o cliente antes (Clientes › Mais › Reativar)." : "Ela volta às listas de atendimento.") + "</p>",
      aoConcluir: function () { CadTela_recarregar_("unidades", u.ID); }
    });
  }
  function Unidades_excluir_(u) {
    var ligados = (u.QTD_EQUIPAMENTOS || 0) + (u.QTD_DOCUMENTOS || 0);
    CadTela_acaoRisco_({
      titulo: "Excluir a unidade", botao: "Excluir definitivamente", fn: "unidadesExcluir", id: u.ID,
      texto: "<p>Excluir <b>" + CadUI_esc_(u.NOME_UNIDADE) + "</b>? A exclusão não pode ser desfeita.</p>" +
        (ligados ? '<div class="cadx-faixa bc-faixa tom-alerta">Esta unidade tem ' + CadUI_num_(u.QTD_EQUIPAMENTOS) + " equipamento(s) e " + CadUI_num_(u.QTD_DOCUMENTOS) + " documento(s) ligados: o sistema não vai excluir. Use Inativar, ou transfira em Vínculos.</div>" : "<p>Para tirar de uso sem perder o histórico, use Inativar.</p>"),
      aoConcluir: function () { CadUI_painelFechar_(); CadTela_recarregar_("unidades"); }
    });
  }

  /** Nova unidade já com o cliente escolhido (vindo de Clientes). */
  function Unidades_novaPara_(clienteId, clienteNome) {
    if (CADUI.telas.unidades && document.getElementById("cadxTela_unidades")) { Unidades_formulario_(null, { id: clienteId, nome: clienteNome }); return; }
    CADUI.irPara = { chave: "unidades", novo: function () { Unidades_formulario_(null, { id: clienteId, nome: clienteNome }); } };
    abrir("unidades");
  }

  var UNIDADES_UFS = ["AC", "AL", "AM", "AP", "BA", "CE", "DF", "ES", "GO", "MA", "MG", "MS", "MT", "PA", "PB", "PE", "PI", "PR", "RJ", "RN", "RO", "RR", "RS", "SC", "SE", "SP", "TO"];

  function Unidades_formulario_(id, clientePre) {
    if (CadUI_ehCliente_()) return;
    var u = id ? CadTela_item_("unidades", id) : null;
    var novo = !u;
    u = u || {};
    var gestao = CadUI_gestao_();
    var campoCliente = novo
      ? CadUI_campo_({ id: "uni_cliente_id", paraId: "uni_cliente_id_busca", rotulo: "Cliente", obrigatorio: true, inteiro: true, html: SGO_htmlBuscaClienteLike_("uni_cliente_id", "Digite o nome ou o CNPJ do cliente e escolha na lista"), dica: "Só aparecem clientes ativos." })
      : CadUI_campo_({ id: "uni_cliente_fixo", rotulo: "Cliente", inteiro: true, html: '<div class="cadx-travado">' + CadUI_esc_(u.CLIENTE_NOME || "Sem cliente") + "</div>",
          dica: gestao ? 'Para levar a unidade a outro cliente use <button type="button" class="cadx-btn cadx-btn-link" onclick="CadUI_painelSujo_(false);CadTela_abrirVinculos_(\'UNIDADE\',\'' + CadUI_esc_(id) + '\')">Vínculos › Transferir</button>: equipamentos e documentos acompanham, com prévia e auditoria.' : "Trocar o cliente é feito pela gestão, na tela Vínculos." });
    var cfg = {
      chave: "unidades", id: id || "", titulo: novo ? "Nova unidade" : "Editar unidade",
      sub: novo ? "Local atendido de um cliente: matriz, filial ou anexo." : CadUI_esc_(u.NOME_UNIDADE),
      corpo: function () {
        return CadUI_secao_("Cliente", [campoCliente]) +
          CadUI_secao_("Identificação", [
            CadUI_campo_({ id: "uni_cnpj_unidade", rotulo: "CNPJ da unidade", inteiro: true, dica: "Na unidade principal pode ser o mesmo CNPJ do cliente.",
              html: '<div class="cadx-linha-campo"><input id="uni_cnpj_unidade" type="text" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" value="' + CadUI_esc_(u.CNPJ_UNIDADE ? CadUI_cnpj_(u.CNPJ_UNIDADE) : "") + '"><button type="button" class="cadx-btn cadx-btn-grande" id="uni_receita">Preencher pela Receita</button></div>' }),
            CadUI_campo_({ id: "uni_nome_unidade", rotulo: "Nome da unidade", obrigatorio: true, inteiro: true, valor: u.NOME_UNIDADE, placeholder: "Ex.: Hospital Modelo - Anexo Norte" })
          ]) +
          CadUI_secao_("Endereço", [
            CadUI_campo_({ id: "uni_endereco", rotulo: "Endereço", inteiro: true, valor: u.ENDERECO, placeholder: "Rua, número, bairro, complemento" }),
            CadUI_campo_({ id: "uni_cidade", rotulo: "Cidade", valor: u.CIDADE }),
            CadUI_campo_({ id: "uni_uf", rotulo: "UF", tipo: "select", valor: u.UF, opcoes: [["", "Escolha a UF"]].concat(UNIDADES_UFS.map(function (x) { return [x, x]; })) })
          ]) +
          CadUI_secao_("Contato", [
            CadUI_campo_({ id: "uni_responsavel", rotulo: "Responsável no local", valor: u.RESPONSAVEL }),
            CadUI_campo_({ id: "uni_telefone", rotulo: "Telefone", tipo: "tel", valor: CadUI_tel_(u.TELEFONE), placeholder: "(19) 3333-0000", attrs: ' inputmode="tel"' })
          ]) +
          '<p class="cadx-dica">Campos com <span class="cadx-obr">*</span> são obrigatórios.</p>';
      },
      rodape: '<button type="button" class="cadx-btn cadx-btn-grande" onclick="' + (novo ? "CadUI_painelFechar_()" : "Unidades_voltarDetalhe_('" + CadUI_esc_(id) + "')") + '">Cancelar</button>' + CadUI_botaoSalvar_(novo ? "Cadastrar unidade" : "Salvar alterações"),
      depois: function (p) {
        CadUI_ligarFormulario_(p);
        if (novo) {
          CadUI_chamar_("unidadesListarClientesAtivos", [], function (res) {
            SGO_montarBuscaClienteLike_("uni_cliente_id", (res.items || []).map(function (c) { return Object.assign({}, c, { CNPJ: CadUI_cnpj_(c.CNPJ) }); }), function () { CadUI_erroCampo_("uni_cliente_id", ""); });
            if (clientePre && clientePre.id) SGO_prefillBuscaClienteLike_("uni_cliente_id", clientePre.id, clientePre.nome || "");
          }, function (msg) { CadUI_erroCampo_("uni_cliente_id", "A lista de clientes não carregou: " + CadUI_esc_(msg)); });
        }
        var cnpj = p.querySelector("#uni_cnpj_unidade");
        cnpj.addEventListener("input", function () { cnpj.value = Clientes_mascaraCnpj_(cnpj.value); Unidades_conferirCnpj_(id); });
        p.querySelector("#uni_receita").onclick = function () { CadUI_preencherReceita_("uni_cnpj_unidade", { fantasia: "uni_nome_unidade", endereco: "uni_endereco", cidade: "uni_cidade", uf: "uni_uf", telefone: "uni_telefone" }, "uni_receita"); };
        p.querySelector("#cadxSalvar").onclick = function () { Unidades_salvar_(id); };
      }
    };
    CadUI_painelAbrir_(cfg);
  }
  function Unidades_voltarDetalhe_(id) { CadUI_painelSujo_(false); var u = CadTela_item_("unidades", id); if (u) Unidades_detalhe_(u); else CadUI_painelFechar_(); }

  function Unidades_conferirCnpj_(id) {
    var d = CadUI_digitos_(getValue_("uni_cnpj_unidade"));
    if (d.length !== 14) { CadUI_erroCampo_("uni_cnpj_unidade", ""); return true; }
    if (!CadUI_cnpjValido_(d)) { CadUI_erroCampo_("uni_cnpj_unidade", "CNPJ inválido: confira os números."); return false; }
    var st = CADUI.telas.unidades;
    var outra = st && st.itens.filter(function (x) { return CadUI_digitos_(x.CNPJ_UNIDADE) === d && String(x.ID) !== String(id || ""); })[0];
    if (outra) {
      CadUI_erroCampo_("uni_cnpj_unidade", "Já existe unidade com este CNPJ: " + CadUI_esc_(outra.NOME_UNIDADE) + " (cliente " + CadUI_esc_(outra.CLIENTE_NOME || "sem cliente") + '). <button type="button" class="cadx-btn cadx-btn-link" onclick="CadUI_painelSujo_(false);CadTela_abrirItem_(\'unidades\',\'' + CadUI_esc_(outra.ID) + '\')">Abrir a unidade existente</button>');
      return false;
    }
    CadUI_erroCampo_("uni_cnpj_unidade", "");
    return true;
  }

  function Unidades_salvar_(id) {
    var novo = !id;
    var p = {
      NOME_UNIDADE: getValue_("uni_nome_unidade"), CNPJ_UNIDADE: CadUI_digitos_(getValue_("uni_cnpj_unidade")), ENDERECO: getValue_("uni_endereco"),
      CIDADE: getValue_("uni_cidade"), UF: getValue_("uni_uf"), RESPONSAVEL: getValue_("uni_responsavel"), TELEFONE: CadUI_digitos_(getValue_("uni_telefone"))
    };
    if (novo) p.CLIENTE_ID = getValue_("uni_cliente_id");
    else { var atual = CadTela_item_("unidades", id); if (atual) p.CLIENTE_ID = atual.CLIENTE_ID; }
    var erros = {};
    if (novo && !p.CLIENTE_ID) erros.uni_cliente_id = "Escolha o cliente na lista (digite parte do nome ou do CNPJ e clique na sugestão).";
    if (!p.NOME_UNIDADE) erros.uni_nome_unidade = "Informe o nome da unidade.";
    if (p.CNPJ_UNIDADE && (p.CNPJ_UNIDADE.length !== 14 || !CadUI_cnpjValido_(p.CNPJ_UNIDADE))) erros.uni_cnpj_unidade = "CNPJ inválido: confira os 14 números.";
    if (p.TELEFONE && (p.TELEFONE.length < 10 || p.TELEFONE.length > 11)) erros.uni_telefone = "Telefone com DDD: 10 ou 11 números.";
    if (!CadUI_mostrarErros_(erros, ["uni_cliente_id", "uni_nome_unidade", "uni_cnpj_unidade", "uni_telefone"])) return;
    if (p.CNPJ_UNIDADE && !Unidades_conferirCnpj_(id)) return;
    CadUI_salvando_(true);
    CadUI_chamar_(novo ? "unidadesCriar" : "unidadesAtualizar", novo ? [p] : [id, p], function (res) {
      CadUI_painelSujo_(false);
      var novoId = id || (res.item && res.item.ID) || "";
      CadUI_aviso_("Unidade " + p.NOME_UNIDADE.toUpperCase() + (novo ? " cadastrada." : " atualizada."), "ok");
      CadTela_carregar_("unidades", function () {
        var it = novoId && CadTela_item_("unidades", novoId);
        if (!it && novo) it = (CADUI.telas.unidades.itens || []).filter(function (x) { return x.CLIENTE_ID === p.CLIENTE_ID && String(x.NOME_UNIDADE).toUpperCase() === p.NOME_UNIDADE.toUpperCase(); })[0];
        if (it) Unidades_detalhe_(it); else CadUI_painelFechar_();
      });
    }, function (msg) {
      CadUI_salvando_(false);
      if (/cnpj/i.test(msg)) CadUI_erroCampo_("uni_cnpj_unidade", CadUI_esc_(msg));
      else if (/cliente/i.test(msg)) CadUI_erroCampo_(novo ? "uni_cliente_id" : "uni_cliente_fixo", CadUI_esc_(msg));
      else if (/nome/i.test(msg)) CadUI_erroCampo_("uni_nome_unidade", CadUI_esc_(msg));
      else if (/UF/.test(msg)) CadUI_erroCampo_("uni_uf", CadUI_esc_(msg));
      CadUI_aviso_(msg, "erro");
    }, novo ? "Aguarde, cadastrando a unidade…" : "Aguarde, salvando as alterações…");
  }

  // Compatibilidade com chamadas antigas (busca rápida, celular, Vínculos).
  function unidadesPesquisar_() { CadTela_buscarDoCampo_("unidades"); }
  function unidadesEditar_(id) { if (CADUI.telas.unidades && CadTela_item_("unidades", id)) Unidades_formulario_(id); else { CADUI.irPara = { chave: "unidades", novo: function () { Unidades_formulario_(id); } }; abrir("unidades"); } }
  function unidadesNovo_() { Unidades_formulario_(null); }
  function carregarClientesAtivosParaUnidades_() { /* 17/10: a lista de clientes carrega dentro do formulário (Unidades_formulario_) */ }
  function buscarCnpjCliente_() { CadUI_preencherReceita_("cli_cnpj", { razao: "cli_razao_social", fantasia: "cli_nome_fantasia", endereco: "cli_endereco", telefone: "cli_telefone" }, "cli_receita"); }
  function buscarCnpjUnidade_() { CadUI_preencherReceita_("uni_cnpj_unidade", { fantasia: "uni_nome_unidade", endereco: "uni_endereco", cidade: "uni_cidade", uf: "uni_uf", telefone: "uni_telefone" }, "uni_receita"); }
</script>

<script>
  // Carregador leve do modulo: o conteudo pesado (CSS + HTML + JS do
  // formulario) fica guardado como string JS comum em SGO_LavRel_ConteudoModulo.js
  // (nao num arquivo .html -- o HtmlService distorce/trunca conteudo
  // grande lido de arquivos .html) e NAO eh incluido no bundle inicial
  // da pagina -- so eh buscado do servidor na primeira vez que o
  // usuario abre este modulo. Mesmo padrao ja usado em Cadeia de
  // Frio/Estufa/Declaracao/RelCal/PlanCME.
  let tplLavRel_carregado_ = false;

  function renderTplLavRel_() {
    const container = document.getElementById('tplLavRelContainer');
    if (!container) return;

    if (tplLavRel_carregado_) {
      if (typeof tplLavRel_renderReal_ === 'function') tplLavRel_renderReal_(); tplLavRel_ligarRevisao_();
      return;
    }

    container.innerHTML = '<p style="padding:20px;color:var(--bc-text-3);">Carregando módulo Lavadora (Relatório de Auditoria)...</p>';

    google.script.run
      .withSuccessHandler(function(conteudoBruto) {
        try {
          const styleMatch = conteudoBruto.match(/<style>([\s\S]*?)<\/style>/);
          const scriptMatch = conteudoBruto.match(/<script>([\s\S]*?)<\/script>/);

          if (styleMatch) {
            const styleEl = document.createElement('style');
            styleEl.textContent = styleMatch[1];
            document.head.appendChild(styleEl);
          }

          if (scriptMatch) {
            window.eval(scriptMatch[1]);
          }

          tplLavRel_carregado_ = true;

          if (typeof tplLavRel_renderReal_ === 'function') {
            tplLavRel_renderReal_();
            tplLavRel_ligarRevisao_();
          } else {
            console.error('renderTplLavRel_: tplLavRel_renderReal_ nao foi definida apos o eval.');
            container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Falha ao inicializar o modulo (funcao de renderizacao nao encontrada). Veja o Console (F12) para detalhes.</p>';
          }
        } catch (e) {
          console.error('renderTplLavRel_: erro ao montar o modulo:', e);
          container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Erro ao montar o modulo: ' + (e && e.message ? e.message : e) + '</p>';
        }
      })
      .withFailureHandler(function(err) {
        console.error('renderTplLavRel_: falha ao buscar o modulo:', err);
        container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Falha ao carregar o modulo: ' + ((err && err.message) ? err.message : err) + '</p>';
      })
      .LavRel_obterConteudoModulo();
  }

  // 21/10/2026: "Abrir para corrigir" e "Usar como base" nos relatórios de ensaio e planilhas de dados (JS_DocRevisao.html).
  function tplLavRel_ligarRevisao_() {
    if (typeof SGO_DocRev === 'undefined' || !SGO_DocRev.ligarEnsaio) return;
    SGO_DocRev.ligarEnsaio({
      modulo: 'LAVADORA', modulos: ['LAVADORA', 'LAVADORA_DADOS'], raiz: 'tplLavRelContainer', campoNumero: 'tplLavRel_certNumero',
      acao: 'Aprovar e emitir', payloadFn: 'tplLavRel_construirPayload',
      validarFns: ['tplLavRel_confirmarEGerarCertificado', 'tplLavRel_enviarParaAprovacao', 'tplLavRel_chamarConverter'],
      despacho: 'LavRel_apiDispatch', fnsEmissao: ['apiMontarCertificadoFinal', 'apiEnviarParaAprovacao', 'apiConverter'],
      fotoFn: 'tplLavRel_lerArquivoComoBase64_', camposGrandes: { tplLavRel_uiDados: 'textoColado' },
      limpar: function () { tplLavRel_renderReal_(); tplLavRel_ligarRevisao_(); }
    });
  }
</script>

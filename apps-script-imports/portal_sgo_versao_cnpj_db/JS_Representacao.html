<script>
  // =====================================================================
  // MÓDULO REPRESENTAÇÃO (29/10/2026). Pedido do dono: área para a representada (Brasmedical) acionar a Metrolabs e
  // acompanhar os chamados, "um módulo do SGO". Abre por abrir('representacao').
  // Servidor: Representacao_api(sessionId, acao, dados) em SGO_Representacao.js. O servidor decide a visão pela sessão:
  //  - perfil REPRESENTADA: Painel (índices, Kanban e Gantt), Novo pedido (busca por CNPJ/CPF completo e série exata,
  //    cadastro com "Ciente", relato e anexos), Chamados (etapas, marcos, linha do tempo, conversa, complemento,
  //    cancelamento), Equipamentos, Canal geral e Equipe (administrador da representada);
  //  - equipe da Metrolabs: Painel (SLA, fila, carga, Kanban e Gantt), Pedidos (aceitar, pedir complemento, recusar),
  //    Conversas (com nota interna), Representadas, Catálogo de modelos, Usuários e Registro de ações.
  // 29/10/2026 (crítica do dono: "quero página igual à do SGO+"): a tela usa os componentes do SGO+ (cabeçalho do módulo,
  // abas e cartões da Assistência, índices, Kanban e Gantt da agenda única; JS_PainelAtendimento.html). Nenhum estilo próprio.
  // A tela só esconde botões; quem confere papel, escopo e campos obrigatórios é o servidor. Não se redesenha sozinha:
  // recarrega depois de cada ação ou no botão "Atualizar" (nunca apaga o que está sendo digitado).
  // =====================================================================
  var RP = { ini: null, externo: false, aba: "", pedido: null, cliente: null, unidadeId: "", equip: null, painel: null, painelAba: "kanban", dias: 90, janela: 30, agrupar: "", repPainel: "" };
  function Rp_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function Rp_$_(id) { return document.getElementById(id); }
  function Rp_chamar_(acao, dados, ok, erro, carregando) {
    if (carregando && typeof SGO_iniciarCarregamento_ === "function") SGO_iniciarCarregamento_(carregando);
    var fim = function () { if (carregando && typeof SGO_finalizarCarregamento_ === "function") SGO_finalizarCarregamento_(); };
    google.script.run.withSuccessHandler(function (r) {
      fim();
      if (r && r.ok) { try { ok(r); } catch (e) { (erro || function (m) { alert(m); })("A tela não conseguiu mostrar a resposta (" + ((e && e.message) || e) + "). Atualize a página (F5); nada foi perdido no servidor.", {}); } }
      else (erro || function (m) { alert(m); })((r && r.message) || "Não foi possível concluir. Tente de novo.", r || {});
    }).withFailureHandler(function (e) { fim(); (erro || function (m) { alert(m); })("Não foi possível falar com o servidor (" + ((e && e.message) || e) + "). Verifique a conexão e tente de novo; nada foi alterado.", {}); })
      .Representacao_api(SESSION, acao, dados || {});
  }
  function Rp_msg_(id, texto, tipo) { var el = typeof id === "string" ? Rp_$_(id) : id; if (el) el.innerHTML = texto ? '<div class="at-faixa ' + (tipo || "erro") + '">' + Rp_esc_(texto) + "</div>" : ""; }
  function Rp_erroCampos_(r) {
    document.querySelectorAll(".at-campo .rp-erro").forEach(function (e) { e.remove(); });
    (r && r.faltam || []).forEach(function (f) { var el = Rp_$_("rp_" + f.campo); if (el && el.parentNode) { var d = document.createElement("div"); d.className = "at-ajuda-campo rp-erro"; d.style.color = "var(--danger)"; d.textContent = f.texto; el.parentNode.appendChild(d); } });
  }
  function Rp_campo_(rotulo, html, dica) { return '<div class="at-campo"><label>' + Rp_esc_(rotulo) + "</label>" + html + (dica ? '<div class="at-ajuda-campo">' + Rp_esc_(dica) + "</div>" : "") + "</div>"; }
  function Rp_input_(id, ph, tipo, extra) { return '<input id="rp_' + id + '" type="' + (tipo || "text") + '"' + (ph ? ' placeholder="' + Rp_esc_(ph) + '"' : "") + (extra || "") + ">"; }
  function Rp_select_(id, pares, vazio) { return '<select id="rp_' + id + '">' + (vazio ? '<option value="">' + Rp_esc_(vazio) + "</option>" : "") + pares.map(function (p) { return '<option value="' + Rp_esc_(p[0]) + '">' + Rp_esc_(p[1]) + "</option>"; }).join("") + "</select>"; }
  function Rp_val_(id) { var el = Rp_$_("rp_" + id); return el ? (el.type === "checkbox" ? el.checked : String(el.value || "").trim()) : ""; }
  function Rp_selo_(n, nome) { var cor = n === 3 || n === 12 ? "cinza" : n === 2 || n === 9 || n === 5 || n === 6 ? "laranja" : n >= 10 ? "verde" : "azul"; return '<span class="at-selo ' + cor + '">' + Rp_esc_(nome) + "</span>"; }
  function Rp_btn_(id, texto, pri, extra) { return '<button type="button" class="' + (pri ? "btn-primary" : "btn-secondary") + ' at-btn44" id="' + id + '"' + (extra || "") + ">" + texto + "</button>"; }
  function Rp_btnPerigo_(id, texto) { return Rp_btn_(id, texto, false, ' style="color:var(--danger);border-color:var(--danger)"'); }
  function Rp_cab_(titulo, sub, botoes) {
    return '<div class="module-header"><div class="module-header-left"><h2 class="content-title">' + Rp_esc_(titulo) + '</h2><p class="content-subtitle" id="rpSub">' + Rp_esc_(sub) + "</p></div>" +
      '<div class="module-header-right" style="display:flex;gap:8px;flex-wrap:wrap">' + (botoes || "") + "</div></div>";
  }
  function Rp_pedirTexto_(titulo, explicacao, rotulo, minimo, ok, botao) {
    if (typeof At_pedirTexto_ === "function") return At_pedirTexto_(titulo, explicacao, rotulo, minimo, ok, botao);
    var t = prompt(explicacao); if (t !== null) ok(String(t).trim(), { remove: function () {} });
  }

  function Representacao_render_() {
    var div = Rp_$_("conteudo"); if (!div) return;
    var externo = SGO_ehRepresentada_();
    div.innerHTML = '<div class="module-shell">' + Rp_cab_("Representação", "Carregando…", '<button type="button" class="btn-secondary" id="rpAtualizar"><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Atualizar</button>') +
      '<div id="rpAbas" class="at-tabs"></div><div id="rpMsg"></div><div id="rpCorpo"></div></div>';
    Rp_$_("rpAtualizar").onclick = function () { if (RP.ini) Rp_irAba_(RP.aba || (RP.externo ? "painel" : "painel")); };
    Rp_chamar_(externo ? "inicio" : "iniciar", {}, function (r) {
      RP.ini = r; RP.externo = externo;
      Rp_$_("rpSub").textContent = externo ? (r.representada.nome + " · " + r.eu.nome + " (" + r.eu.papelNome + "). Acione a Metrolabs e acompanhe os atendimentos aos seus clientes.") :
        "Pedidos e conversas das representadas, cadastro da representada e do catálogo de modelos. Os chamados aceitos seguem na Assistência técnica, com a marca da representada.";
      if (typeof ehMobileModo_ === "function" && ehMobileModo_() && typeof atualizarTituloMobile_ === "function") atualizarTituloMobile_("Representação");
      Rp_montarAbas_();
    }, function (m) { Rp_$_("rpSub").textContent = ""; Rp_msg_("rpMsg", m); });
  }
  function Rp_montarAbas_() {
    var abas = RP.externo ? [["painel", "Painel"]].concat(RP.ini.eu.perm.abrir ? [["novo", "Novo pedido"]] : []).concat([["chamados", "Chamados"], ["equipamentos", "Equipamentos"], ["geral", "Canal geral"]]).concat(RP.ini.eu.perm.equipe ? [["equipe", "Equipe"]] : []).concat([["ajuda", "Como usar"]])
      : [["painel", "Painel"], ["pedidos", "Pedidos"], ["conversas", "Conversas"], ["representadas", "Representadas"], ["modelos", "Catálogo de modelos"], ["usuarios", "Usuários"], ["acessos", "Registro de ações"], ["ajuda", "Como usar"]];
    Rp_$_("rpAbas").innerHTML = abas.map(function (a) { return '<button type="button" class="at-tab" data-a="' + a[0] + '">' + Rp_esc_(a[1]) + "</button>"; }).join("");
    Rp_$_("rpAbas").querySelectorAll(".at-tab").forEach(function (b) { b.onclick = function () { Rp_irAba_(b.getAttribute("data-a")); }; });
    Rp_irAba_(abas[0][0]);
  }
  function Rp_irAba_(a) {
    RP.aba = a; Rp_msg_("rpMsg", "");
    document.querySelectorAll("#rpAbas .at-tab").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-a") === a); });
    var c = Rp_$_("rpCorpo"); c.innerHTML = '<div class="at-vazio">Carregando…</div>';
    var mapa = { painel: RP.externo ? Rp_painel_ : RpI_painel_, inicio: Rp_painel_, novo: Rp_novo_, chamados: Rp_chamados_, equipamentos: Rp_equipamentos_, geral: function (el) { el.innerHTML = '<div class="at-caixa" id="rpConvGeral"></div>'; Rp_conversa_(Rp_$_("rpConvGeral"), "GERAL", "", "Canal geral com a Metrolabs"); }, equipe: Rp_equipe_, ajuda: Rp_ajuda_,
      pedidos: RpI_pedidos_, conversas: RpI_conversas_, representadas: RpI_representadas_, modelos: RpI_modelos_, usuarios: RpI_usuarios_, acessos: RpI_acessos_ };
    (mapa[a] || mapa.painel)(c);
  }

  // ---------------- painel (representada e Metrolabs) ----------------
  /** Barra de filtros do painel (mesmo componente da agenda única: atv-barra). */
  function Rp_barraPainel_(interno) {
    var opt = function (v, t, atual) { return '<option value="' + v + '"' + (String(v) === String(atual) ? " selected" : "") + ">" + Rp_esc_(t) + "</option>"; };
    return '<div class="atv-barra">' +
      (interno ? '<div><label for="rpPnRep">Representada</label><select id="rpPnRep">' + opt("", "Todas", RP.repPainel) + RP.ini.representadas.map(function (r) { return opt(r.id, r.nome, RP.repPainel); }).join("") + "</select></div>" : "") +
      '<div><label for="rpPnDias">Período dos índices</label><select id="rpPnDias">' + [30, 90, 180, 365].map(function (d) { return opt(d, "Últimos " + d + " dias", RP.dias); }).join("") + "</select></div>" +
      '<div id="rpPnJanelaCampo"' + (RP.painelAba === "gantt" ? "" : ' style="display:none"') + '><label for="rpPnJanela">Gantt: janela</label><select id="rpPnJanela">' + [[14, "Últimas 2 semanas"], [30, "Últimos 30 dias"], [90, "Últimos 90 dias"], [180, "Últimos 180 dias"]].map(function (d) { return opt(d[0], d[1], RP.janela); }).join("") + "</select></div>" +
      '<div id="rpPnAgruparCampo"' + (RP.painelAba === "gantt" ? "" : ' style="display:none"') + '><label for="rpPnAgrupar">Gantt por</label><select id="rpPnAgrupar">' + opt("", "Chamado", RP.agrupar) + opt("cliente", "Cliente", RP.agrupar) +
        (interno ? opt("tecnico", "Técnico", RP.agrupar) + opt("representada", "Representada", RP.agrupar) : "") + "</select></div>" +
      "</div>";
  }
  function Rp_painelCarregar_(c, interno) {
    var d = { dias: RP.dias }; if (interno) d.representadaId = RP.repPainel;
    Rp_chamar_("painel", d, function (r) {
      PnA_prepararGantt_(r.ganttJs);
      RP.painel = r.painel;
      Rp_painelDesenhar_(c, interno);
    }, function (m) { c.innerHTML = ""; Rp_msg_("rpMsg", m); });
  }
  function Rp_painel_(c) { Rp_painelCarregar_(c, false); }
  function RpI_painel_(c) { Rp_painelCarregar_(c, true); }
  function Rp_painelDesenhar_(c, interno) {
    var p = RP.painel, k = p.indices, md = k.minDia;
    var cards = interno ? [
      { v: PnA_num_(k.fila.length), l: "Pedidos na fila (aguardando o aceite)", sub: k.fila.filter(function (f) { return f.prazo.estado === "VENCIDO"; }).length + " com o prazo de aceite vencido", alerta: k.fila.some(function (f) { return f.prazo.estado === "VENCIDO"; }), title: "Pedidos enviados ou com complemento respondido que ainda não foram aceitos nem recusados." },
      { v: PnA_pct_(k.aceite.pct), l: "Aceite no prazo (" + k.dias + " dias)", sub: k.aceite.total ? k.aceite.noPrazo + " de " + k.aceite.total + " · média " + PnA_tempo_(k.aceite.mediaMin, md) : "Nenhum aceite no período", title: "Pedidos aceitos no período cujo aceite levou até o prazo da representada (padrão 4 h úteis), descontado o tempo de espera do complemento." },
      { v: PnA_pct_(k.primeiroContato.pct), l: "Primeiro contato no prazo", sub: k.primeiroContato.total ? k.primeiroContato.noPrazo + " de " + k.primeiroContato.total + " · média " + PnA_tempo_(k.primeiroContato.mediaMin, md) : (k.primeiroContato.semRegistro ? k.primeiroContato.semRegistro + " aceito(s) sem registro ainda" : "Nenhum no período"), title: "Do aceite ao primeiro registro da Metrolabs no chamado (triagem assumida ou iniciada, ou mensagem à representada), padrão 8 h úteis." },
      { v: PnA_num_(k.vencidos), l: "Prazo vencido agora", sub: PnA_num_(k.emRisco) + " em risco", alerta: k.vencidos > 0 },
      { v: PnA_num_(k.abertos), l: "Pedidos e chamados abertos", sub: k.aguardandoMetrolabs + " com a Metrolabs · " + k.aguardandoRepresentada + " com a representada · " + k.aguardandoCliente + " com o cliente" },
      { v: PnA_tempo_(k.visita.mediaMin, md), l: "Tempo médio até a visita", sub: k.visita.total ? k.visita.total + " visita(s) no período, do envio à chegada do técnico" : "Nenhuma visita no período" },
      { v: PnA_tempo_(k.conclusao.mediaMin, md), l: "Tempo médio até a conclusão", sub: k.conclusao.total ? k.conclusao.total + " concluído(s) no período, do envio à conclusão" : "Nenhum concluído no período" },
      { v: PnA_pct_(k.reincidencia.pct), l: "Reincidência (" + k.dias + " dias)", sub: k.reincidencia.reincidentes + " de " + k.reincidencia.chamados + " chamados: mesmo equipamento em até 90 dias", alerta: k.reincidencia.reincidentes > 0 }
    ] : [
      { v: PnA_num_(k.abertos), l: "Pedidos e chamados abertos", sub: k.enviadosPeriodo + " enviados nos últimos " + k.dias + " dias" },
      { v: PnA_num_(k.aguardandoMetrolabs), l: "Aguardando a Metrolabs", sub: PnA_num_(k.vencidos) + " com prazo vencido · " + PnA_num_(k.emRisco) + " em risco", alerta: k.vencidos > 0 },
      { v: PnA_num_(k.aguardandoRepresentada), l: "Aguardando a sua empresa", sub: k.aguardandoRepresentada ? "Complemento pedido: responda para o prazo voltar a contar" : "Nada pendente com vocês", alerta: k.aguardandoRepresentada > 0 },
      { v: PnA_num_(k.aguardandoCliente), l: "Aguardando o cliente final", sub: "Aprovação de orçamento ou retorno do cliente" },
      { v: PnA_pct_(k.aceite.pct), l: "Aceitos no prazo (" + k.dias + " dias)", sub: k.aceite.total ? k.aceite.noPrazo + " de " + k.aceite.total + " aceitos" : "Nenhum aceite no período", title: "Pedidos aceitos no período em até o prazo combinado (padrão 4 h úteis), descontado o tempo em que o pedido esperou o complemento da sua empresa." },
      { v: PnA_tempo_(k.aceite.mediaMin, md), l: "Tempo médio até o aceite", sub: "Do envio do pedido ao aceite" },
      { v: PnA_tempo_(k.visita.mediaMin, md), l: "Tempo médio até a visita", sub: k.visita.total ? "Do envio à chegada do técnico (" + k.visita.total + ")" : "Nenhuma visita no período" },
      { v: PnA_tempo_(k.conclusao.mediaMin, md), l: "Tempo médio até a conclusão", sub: k.conclusao.total ? "Do envio à conclusão (" + k.conclusao.total + ")" : "Nenhum concluído no período" }
    ];
    var pend = !interno && p.pendencias.length ? '<div class="at-faixa aviso"><b>Pendências da sua empresa (' + p.pendencias.length + ').</b> A Metrolabs pediu complemento; enquanto vocês não respondem, o prazo de aceite fica pausado.' +
      p.pendencias.map(function (x) { return '<div class="at-card clicavel" style="margin-top:8px" data-pna-tipo="' + Rp_esc_(x.tipo) + '" data-pna-id="' + Rp_esc_(x.id) + '" tabindex="0"><p class="at-card-tit">' + Rp_esc_(x.numero + " · " + x.clienteNome) + '</p><p class="at-txt">' + Rp_esc_(x.pergunta) + '</p><p class="at-meta">Pedido em ' + Rp_esc_(x.desde) + " · esperando há " + Rp_esc_(PnA_tempo_(x.esperaMin, md)) + '</p><div class="at-acoes"><button type="button" class="btn-primary at-btn44">Responder agora</button></div></div>'; }).join("") + "</div>" : "";
    c.innerHTML = Rp_barraPainel_(interno) + '<p class="atv-sub" style="margin:-6px 0 10px">Índices de ' + Rp_esc_(k.de) + " a " + Rp_esc_(k.ate) + ". Tempos em horas úteis do expediente da Metrolabs. Toque num índice e segure (ou passe o mouse) para ver como é contado.</p>" +
      pend + PnA_indHtml_(cards) + PnA_abasHtml_("rpPnAbas", [["kanban", "Kanban"], ["gantt", "Gantt"], ["indicadores", "Indicadores"]], RP.painelAba) + '<div id="rpPnCorpo"></div>';
    var recarregar = function () { Rp_painelCarregar_(c, interno); };
    Rp_$_("rpPnDias").onchange = function () { RP.dias = Number(Rp_$_("rpPnDias").value); recarregar(); };
    if (Rp_$_("rpPnRep")) Rp_$_("rpPnRep").onchange = function () { RP.repPainel = Rp_$_("rpPnRep").value; recarregar(); };
    Rp_$_("rpPnJanela").onchange = function () { RP.janela = Number(Rp_$_("rpPnJanela").value); Rp_painelCorpo_(interno); };
    Rp_$_("rpPnAgrupar").onchange = function () { RP.agrupar = Rp_$_("rpPnAgrupar").value; Rp_painelCorpo_(interno); };
    PnA_ligarAbas_("rpPnAbas", function (a) { RP.painelAba = a; Rp_$_("rpPnJanelaCampo").style.display = Rp_$_("rpPnAgruparCampo").style.display = a === "gantt" ? "" : "none"; Rp_painelCorpo_(interno); });
    PnA_ligar_(c.querySelector(".at-faixa.aviso"), function (t, id) { Rp_ficha_(t, id); });
    Rp_painelCorpo_(interno);
  }
  function Rp_abrirDoPainel_(interno, tipo, id) {
    if (!interno) return Rp_ficha_(tipo, id);
    if (tipo === "SOLICITACAO") return RpI_abrirPedidoPorId_(id);
    if (typeof Assistencia_irPara_ === "function") Assistencia_irPara_({ mod: "assistencia", id: id });
  }
  function Rp_cartaoHtml_(x, interno) {
    var prazo = x.prazo && x.prazo.estado !== "SEM_PRAZO" ? '<span class="at-selo ' + PNA_SELO_PRAZO[x.prazo.estado] + '" title="' + Rp_esc_(x.prazo.texto || "") + '">' + Rp_esc_(PNA_NOME_PRAZO[x.prazo.estado]) + "</span>" : "";
    var dela = x.comQuem === "REPRESENTADA" ? '<span class="at-selo laranja">' + (interno ? "Com a representada" : "Depende de você") + "</span>" : x.comQuem === "CLIENTE" ? '<span class="at-selo cinza">Com o cliente final</span>' : "";
    return '<div class="atv-kcard-tit">' + Rp_esc_(x.numero) + (x.pedidoNumero && x.tipo === "CHAMADO" ? ' <span class="atv-sub">(' + Rp_esc_(x.pedidoNumero) + ")</span>" : "") + "</div>" +
      '<div class="atv-sub">' + Rp_esc_([interno ? x.representadaNome : "", x.clienteNome, x.cidade].filter(Boolean).join(" · ")) + "</div>" +
      '<div class="atv-sub">' + Rp_esc_(x.equipamento) + "</div>" +
      '<div class="atv-kcard-rod"><span class="atv-sub">' + Rp_esc_((x.prioridadePrevista ? "" : x.prioridade + " · ") + "enviado " + String(x.enviado).slice(0, 10)) + "</span>" + prazo + "</div>" +
      (dela || x.reincidente || (x.tecnico && x.etapa >= 7) ? '<div class="atv-kcard-rod" style="justify-content:flex-start">' + dela + (x.reincidente ? '<span class="at-selo roxo">Reincidente</span>' : "") + (x.tecnico && x.etapa >= 7 ? '<span class="atv-sub">Técnico: ' + Rp_esc_(x.tecnico) + "</span>" : "") + "</div>" : "") +
      (!interno && x.podeResponder && RP.ini.eu.perm.abrir ? '<div class="pna-kcard-acao"><button type="button" class="btn-primary" data-pna-acao="responder" data-pna-tipo="' + Rp_esc_(x.tipo) + '" data-pna-id="' + Rp_esc_(x.id) + '">Responder o complemento</button></div>' : "");
  }
  function Rp_painelCorpo_(interno) {
    var corpo = Rp_$_("rpPnCorpo"); if (!corpo || !RP.painel) return;
    var p = RP.painel, k = p.indices, md = k.minDia, abrirX = function (t, id) { Rp_abrirDoPainel_(interno, t, id); };
    if (RP.painelAba === "kanban") {
      corpo.innerHTML = PnA_kanbanHtml_(p.kanban, { cartao: function (x) { return Rp_cartaoHtml_(x, interno); }, cor: function (x) { return PNA_COR_PRAZO[x.prazo.estado] || "var(--muted)"; },
        vazio: interno ? "Nenhum pedido ou chamado de representada." : "Nenhum pedido ainda." + (RP.ini.eu.perm.abrir ? " Use Novo pedido para acionar a Metrolabs." : ""),
        legenda: interno ? "Um cartão por pedido ou chamado, na etapa que a representada vê. A cor da borda é o prazo (aceite para o pedido; atendimento para o chamado). Toque para abrir: o pedido abre aqui; o chamado abre na Assistência técnica, onde a etapa muda pelas regras do atendimento. Colunas fechadas mostram os últimos 30 dias." :
          "Um cartão por pedido ou chamado, na etapa em que está. A cor da borda é o prazo. A etapa muda pelo atendimento da Metrolabs; você age nos cartões marcados \"Depende de você\". Toque para abrir a ficha. Colunas fechadas mostram os últimos 30 dias." });
      PnA_ligar_(corpo, abrirX, function (acao, t, id) { if (acao === "responder") Rp_ficha_(t, id); });
      return;
    }
    if (RP.painelAba === "gantt") {
      var ag = RP.agrupar, grupo = !ag ? null : function (x) {
        if (ag === "cliente") return { chave: x.clienteNome, rotulo: x.clienteNome };
        if (ag === "tecnico") return { chave: x.tecnico || "~", rotulo: x.tecnico || "Sem técnico definido" };

  /** Lê os arquivos; foto reduzida no navegador (lado maior 1600 px, JPEG) para caber em 2 MB. */
  function Rp_lerArquivos_(input, cb, reduzir) {
    var fs = Array.prototype.slice.call((input && input.files) || []), saida = [], falta = fs.length;
    if (!falta) return cb([]);
    fs.forEach(function (f, i) {
      var fim = function (o) { saida[i] = o; if (--falta === 0) cb(saida.filter(Boolean)); };
      var rd = new FileReader();
      rd.onload = function () {
        var url = String(rd.result || "");
        if (!reduzir || !/^image\//.test(f.type)) return fim({ nome: f.name, tipo: f.type, base64: url.split(",")[1] });
        var img = new Image();
        img.onload = function () {
          var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          var q = 0.85, d = cv.toDataURL("image/jpeg", q);
          while (d.length * 0.75 > 2 * 1024 * 1024 && q > 0.4) { q -= 0.1; d = cv.toDataURL("image/jpeg", q); }
          fim({ nome: f.name.replace(/\.\w+$/, "") + ".jpg", tipo: "image/jpeg", base64: d.split(",")[1] });
        };
        img.onerror = function () { fim({ nome: f.name, tipo: f.type, base64: url.split(",")[1] }); };
        img.src = url;
      };
      rd.onerror = function () { fim(null); };
      rd.readAsDataURL(f);
    });
  }

        (s.situacao === "NOVA" ? Rp_btn_("rpComp", "Pedir complemento") : "") + Rp_btnPerigo_("rpRecusar", "Recusar com motivo") + "</div>" : "") + '</div><div class="at-caixa" id="rpConv"></div>';
    Rp_$_("rpVoltar").onclick = function () { RpI_pedidos_(c); };
    Rp_$_("rpVoltarPainel").onclick = function () { Rp_irAba_("painel"); };
    var feito = function (r) { Rp_msg_("rpMsg", r.message || "Feito.", "ok"); RpI_pedidos_(c); };
    var b;
    if ((b = Rp_$_("rpAceitar"))) b.onclick = function () {
      var d = { solicitacaoId: s.id, prioridade: Rp_val_("prio"), tipoCodigo: Rp_val_("tipoServ") };
      Rp_chamar_("aceitar", d, function (r) {
        if (r.duplicado) { if (confirm(r.message + "\n\nAceitar mesmo assim?")) { d.confirmarDuplicado = true; Rp_chamar_("aceitar", d, feito, function (m) { Rp_msg_("rpPedMsg", m); }); } return; }
        feito(r);
      }, function (m) { Rp_msg_("rpPedMsg", m); }, "Aceitando…");
    };
    if ((b = Rp_$_("rpComp"))) b.onclick = function () { Rp_pedirTexto_("Pedir complemento: " + s.numero, "A representada recebe por e-mail e o prazo de aceite fica pausado até ela responder.", "O que falta", 10, function (p, ov) { Rp_chamar_("complemento", { solicitacaoId: s.id, pergunta: p }, function (r) { ov.remove(); feito(r); }, function (m) { Rp_msg_("atTxtMsg", m); }); }, "Pedir complemento"); };
    if ((b = Rp_$_("rpRecusar"))) b.onclick = function () { Rp_pedirTexto_("Recusar o pedido " + s.numero, "A representada vê o motivo e recebe por e-mail.", "Motivo da recusa", 10, function (p, ov) { Rp_chamar_("recusar", { solicitacaoId: s.id, motivo: p }, function (r) { ov.remove(); feito(r); }, function (m) { Rp_msg_("atTxtMsg", m); }); }, "Recusar"); };
    Rp_conversa_(Rp_$_("rpConv"), "SOLICITACAO", s.id, "Conversa do pedido com a representada");
  }
  function RpI_conversas_(c) {
    Rp_chamar_("conversas", { representadaId: RP.repConv || "" }, function (r) {
      c.innerHTML = '<div class="at-filtros"><div><label for="rp_repConv">Representada</label>' + RpI_selRep_("repConv", true) + "</div></div>" +
        (r.conversas.length ? '<div class="at-lista">' + r.conversas.map(function (g, i) { return '<div class="at-card clicavel" tabindex="0" data-i="' + i + '"><p class="at-card-tit">' + Rp_esc_(g.representadaNome + " · " + g.numero) + '</p><p class="at-meta">' + g.total + " mensagem(ns)" + (g.ultima ? " · última em " + Rp_esc_(g.ultima.em) : "") + "</p>" + (g.ultima ? '<p class="at-txt">' + Rp_esc_(g.ultima.autor + ": " + g.ultima.texto.slice(0, 160)) + "</p>" : "") + "</div>"; }).join("") + "</div>"
          : '<div class="at-vazio">Nenhuma conversa. Escolha a representada para abrir o canal geral.</div>');
      Rp_$_("rp_repConv").value = RP.repConv || "";
      Rp_$_("rp_repConv").onchange = function () { RP.repConv = Rp_val_("repConv"); RpI_conversas_(c); };
      c.querySelectorAll("[data-i]").forEach(function (x) { x.onclick = function () { var g = r.conversas[Number(x.getAttribute("data-i"))]; c.innerHTML = '<div class="at-acoes" style="margin:0 0 10px">' + Rp_btn_("rpVoltar", "Voltar às conversas") + '</div><div class="at-caixa" id="rpConv"></div>'; Rp_$_("rpVoltar").onclick = function () { RpI_conversas_(c); }; Rp_conversa_(Rp_$_("rpConv"), g.refTipo, g.refId, g.representadaNome + " · " + g.numero); }; });
    }, function (m) { c.innerHTML = ""; Rp_msg_("rpMsg", m); });
  }
  function RpI_representadas_(c) {
    var l = RP.ini.representadas;
    c.innerHTML = (RP.ini.podeAdministrar ? '<div class="at-acoes" style="margin:0 0 10px">' + Rp_btn_("rpNovaRep", '<i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Nova representada', true) + "</div>" : '<div class="at-faixa">Consulta. O cadastro é do Administrador, da Diretoria, dos gestores e dos responsáveis pela representação.</div>') +
      (l.length ? '<div class="at-lista">' + l.map(function (r, i) { return '<div class="at-card' + (RP.ini.podeAdministrar ? " clicavel" : "") + (r.situacao === "ATIVA" ? "" : " fim") + '" data-i="' + i + '"><p class="at-card-tit">' + Rp_esc_(r.nome) + " " + Rp_selo_(r.situacao === "ATIVA" ? 10 : 12, r.situacao === "ATIVA" ? "Ativa" : "Inativa") + '</p><p class="at-meta">Aceite em ' + PnA_num_(r.prazos.aceiteMin / 60, 1) + " h úteis · contrato " + Rp_esc_(r.contrato || "não informado") + "</p></div>"; }).join("") + "</div>" : '<div class="at-vazio">Nenhuma representada cadastrada.</div>') +
      '<div id="rpRepForm"></div>';
    var abrirForm = function (r) {
      r = r || { prazos: RP.ini.prazosPadrao, situacao: "ATIVA" };
      var p = r.prazos;
      Rp_$_("rpRepForm").innerHTML = '<div class="at-caixa" style="margin-top:12px"><h3>' + (r.id ? "Editar " + Rp_esc_(r.nome) : "Nova representada") + '</h3><div class="at-grade3">' + Rp_campo_("Nome *", Rp_input_("nome")) + Rp_campo_("CNPJ", Rp_input_("cnpj")) +
        Rp_campo_("Situação", Rp_select_("situacao", [["ATIVA", "Ativa"], ["INATIVA", "Inativa (os usuários dela não abrem o módulo)"]])) + Rp_campo_("Contrato", Rp_input_("contrato")) + Rp_campo_("Vigência de", Rp_input_("vigenciaInicio", "", "date")) + Rp_campo_("Vigência até", Rp_input_("vigenciaFim", "", "date")) +
        Rp_campo_("Contato na representada", Rp_input_("contatoNome")) + Rp_campo_("E-mail do contato", Rp_input_("contatoEmail", "", "email")) +
        Rp_campo_("Prazo de aceite (minutos úteis)", Rp_input_("aceiteMin", "", "number"), "Padrão 240 = 4 horas úteis.") + Rp_campo_("Alerta ao responsável (fração do prazo)", Rp_input_("alertaFracao", "", "number", ' step="0.05"'), "Padrão 0,75.") +
        Rp_campo_("Chamado sem registro (dias úteis)", Rp_input_("semRegistroDiasUteis", "", "number"), "Padrão 3.") + "</div>" +
        '<label class="at-check"><input type="checkbox" id="rp_consultaReceita"> Consulta de CNPJ na base pública da Receita ao cadastrar cliente</label><label class="at-check"><input type="checkbox" id="rp_cancelarAntesVisita"> A representada pode cancelar antes da visita (com motivo)</label>' +
        Rp_campo_("Observação", '<textarea id="rp_obs"></textarea>') + '<div id="rpRepMsg"></div><div class="at-acoes">' + Rp_btn_("rpRepSalvar", "Salvar", true) + "</div></div>";
      ["nome", "cnpj", "situacao", "contrato", "vigenciaInicio", "vigenciaFim", "contatoNome", "contatoEmail", "obs"].forEach(function (k) { if (Rp_$_("rp_" + k)) Rp_$_("rp_" + k).value = r[k] || (k === "situacao" ? "ATIVA" : ""); });
      ["aceiteMin", "alertaFracao", "semRegistroDiasUteis"].forEach(function (k) { Rp_$_("rp_" + k).value = p[k]; });
      Rp_$_("rp_consultaReceita").checked = !!p.consultaReceita; Rp_$_("rp_cancelarAntesVisita").checked = !!p.cancelarAntesVisita;
      Rp_$_("rpRepSalvar").onclick = function () {
        var d = { id: r.id || "", prazos: Object.assign({}, p, { aceiteMin: Number(Rp_val_("aceiteMin")), alertaFracao: Number(String(Rp_val_("alertaFracao")).replace(",", ".")), semRegistroDiasUteis: Number(Rp_val_("semRegistroDiasUteis")), consultaReceita: Rp_val_("consultaReceita"), cancelarAntesVisita: Rp_val_("cancelarAntesVisita") }) };
        ["nome", "cnpj", "situacao", "contrato", "vigenciaInicio", "vigenciaFim", "contatoNome", "contatoEmail", "obs"].forEach(function (k) { d[k] = Rp_val_(k); });
        Rp_chamar_("salvarRepresentada", d, function (x) { RP.ini.representadas = x.representadas; Rp_msg_("rpMsg", x.message, "ok"); RpI_representadas_(c); }, function (m, x) { Rp_msg_("rpRepMsg", m); Rp_erroCampos_(x); }, "Salvando…");
      };
      Rp_$_("rpRepForm").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    var b = Rp_$_("rpNovaRep"); if (b) b.onclick = function () { abrirForm(null); };
    if (RP.ini.podeAdministrar) c.querySelectorAll("[data-i]").forEach(function (x) { x.onclick = function () { abrirForm(l[Number(x.getAttribute("data-i"))]); }; });
  }
  function RpI_modelos_(c) {
    c.innerHTML = '<div class="at-filtros"><div><label for="rp_repMod">Representada</label>' + RpI_selRep_("repMod") + '</div></div><div id="rpModLista"></div>';
    var carregar = function () {
      var rid = Rp_val_("repMod"); RP.repMod = rid;
      if (!rid) { Rp_$_("rpModLista").innerHTML = '<div class="at-vazio">Escolha a representada.</div>'; return; }
      Rp_chamar_("modelos", { representadaId: rid }, function (r) {
        Rp_$_("rpModLista").innerHTML = (r.modelos.length ? '<table class="at-tabela"><thead><tr><th>Código</th><th>Modelo</th><th>Tipo</th><th>Família</th><th class="n">Garantia</th><th>Padrão da série</th><th>Situação</th></tr></thead><tbody>' + r.modelos.map(function (m) {
          return '<tr><td data-r="Código"><b>' + Rp_esc_(m.codigo) + '</b></td><td data-r="Modelo">' + Rp_esc_(m.nome) + '</td><td data-r="Tipo">' + Rp_esc_(m.tipo) + '</td><td data-r="Família">' + Rp_esc_(m.familia || "—") + '</td><td class="n" data-r="Garantia">' + m.garantiaMeses + ' meses</td><td data-r="Padrão da série">' + Rp_esc_(m.padraoSerie || "—") + '</td><td data-r="Situação">' + (m.ativo ? Rp_selo_(10, "Ativo") : Rp_selo_(12, "Inativo")) + "</td></tr>";
        }).join("") + "</tbody></table>" : '<div class="at-vazio">Catálogo vazio.</div>') +
          (RP.ini.podeAdministrar ? '<div class="at-caixa" style="margin-top:12px"><h3>Incluir ou alterar modelo (mesmo código altera)</h3><div class="at-grade3">' + Rp_campo_("Código *", Rp_input_("mcod")) + Rp_campo_("Nome *", Rp_input_("mnome")) + Rp_campo_("Tipo de equipamento *", Rp_input_("mtipo", "Ex.: Autoclave")) +
            Rp_campo_("Família", Rp_input_("mfam")) + Rp_campo_("Garantia (meses) *", Rp_input_("mgar", "", "number")) + Rp_campo_("Padrão da série (opcional)", Rp_input_("mpad", "Ex.: BM[0-9]{6}"), "Deixe em branco se não souber.") +
            Rp_campo_("Situação", Rp_select_("mativo", [["SIM", "Ativo"], ["NAO", "Inativo"]])) + '</div><div id="rpModMsg"></div><div class="at-acoes">' + Rp_btn_("rpModSalvar", "Salvar modelo", true) + "</div></div>" : "");
        var b = Rp_$_("rpModSalvar");
        if (b) b.onclick = function () { Rp_chamar_("salvarModelo", { representadaId: rid, codigo: Rp_val_("mcod"), nome: Rp_val_("mnome"), tipo: Rp_val_("mtipo"), familia: Rp_val_("mfam"), garantiaMeses: Number(Rp_val_("mgar")), padraoSerie: Rp_val_("mpad"), ativo: Rp_val_("mativo") }, function (x) { Rp_msg_("rpMsg", x.message, "ok"); carregar(); }, function (m) { Rp_msg_("rpModMsg", m); }, "Salvando…"); };
      }, function (m) { Rp_msg_("rpMsg", m); });
    };
    Rp_$_("rp_repMod").value = RP.repMod || (RP.ini.representadas[0] || {}).id || "";
    Rp_$_("rp_repMod").onchange = carregar; carregar();
  }
  function RpI_usuarios_(c) {
    Rp_chamar_("usuarios", {}, function (r) {
      c.innerHTML = '<div class="at-faixa aviso">' + Rp_esc_(r.message) + '</div><div class="at-acoes" style="margin:0 0 10px"><button type="button" class="btn-secondary at-btn44" onclick="abrir(\'usuarios\')">Abrir Administração &gt; Usuários</button></div>' +
        (r.usuarios.length ? '<table class="at-tabela"><thead><tr><th>Nome</th><th>Login</th><th>E-mail</th><th>Representada</th><th>Papel</th><th>Situação</th></tr></thead><tbody>' + r.usuarios.map(function (u) {
          return '<tr><td data-r="Nome"><b>' + Rp_esc_(u.nome) + '</b></td><td data-r="Login">' + Rp_esc_(u.login) + '</td><td data-r="E-mail">' + Rp_esc_(u.email) + '</td><td data-r="Representada">' + Rp_esc_(u.representada) + '</td><td data-r="Papel">' + Rp_esc_(u.papel) + '</td><td data-r="Situação">' + Rp_selo_(u.situacao === "ATIVO" ? 10 : 12, u.situacao === "ATIVO" ? "Ativo" : "Inativo") + "</td></tr>";
        }).join("") + "</tbody></table>" : '<div class="at-vazio">Nenhuma conta de representada.</div>');
    }, function (m) { c.innerHTML = ""; Rp_msg_("rpMsg", m); });
  }
  function RpI_acessos_(c) {
    Rp_chamar_("acessos", {}, function (r) {
      c.innerHTML = '<div class="at-caixa"><h3>Ações das representadas no módulo</h3>' + (r.acessos.length ? '<table class="at-tabela"><thead><tr><th>Quando</th><th>Representada</th><th>Quem</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>' + r.acessos.map(function (a) {
        return '<tr><td data-r="Quando">' + Rp_esc_(a.em) + '</td><td data-r="Representada">' + Rp_esc_(a.representada) + '</td><td data-r="Quem">' + Rp_esc_(a.quem) + '</td><td data-r="Ação">' + Rp_esc_(a.acao) + '</td><td data-r="Detalhe">' + Rp_esc_(a.detalhe) + "</td></tr>";
      }).join("") + "</tbody></table>" : '<p class="at-meta">Nada registrado.</p>') + "</div>";
    }, function (m) { c.innerHTML = ""; Rp_msg_("rpMsg", m); });
  }
</script>

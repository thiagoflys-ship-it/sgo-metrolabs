<!--
  "Preencher modelo" das Lavadoras (lavadora ultrassônica e termodesinfectora) — tela nativa do SGO+.
  Fase 2 (16/10): um formulário só, com os mesmos campos para os dois tipos de equipamento;
  sem cabeçalho repetido, relógio, exemplos fictícios ou jargão. Geração pelo próprio SGO+
  (SGO_TemplateLavadora.js). CSS escopado sob #tplLavadoraContainer.
-->
<style>
  #tplLavadoraContainer, #tplLavadoraContainer * { box-sizing: border-box; }
  #tplLavadoraContainer .wrap { max-width: 100%; margin: 0; padding: 0; }
  #tplLavadoraContainer .hidden { display: none !important; }
  #tplLavadoraContainer .grid-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  #tplLavadoraContainer .grid-layout > * { min-width: 0; }
  #tplLavadoraContainer .panel { border-radius: var(--radius, 8px); padding: 18px; border: 1px solid var(--border); background: var(--bc-surface, #FFFFFF); min-width: 0; overflow-wrap: break-word; }
  #tplLavadoraContainer .panel h2 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
  #tplLavadoraContainer .panel-subtitle { margin: 0 0 16px; font-size: 13px; line-height: 1.5; color: var(--bc-text-3); }
  #tplLavadoraContainer .section-divider { margin: 22px 0 12px; padding: 0 0 6px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--bc-text-2); }
  #tplLavadoraContainer .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  #tplLavadoraContainer .form-group { flex: 1; min-width: 205px; }
  #tplLavadoraContainer .form-group.w-100 { flex: 1 1 100%; }
  #tplLavadoraContainer .form-group label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; }
  #tplLavadoraContainer .field-help { display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: var(--bc-text-3); }
  #tplLavadoraContainer .form-control { width: 100%; min-height: 42px; padding: 10px 11px; border-radius: var(--radius-sm, 6px); font-size: 13px; }
  #tplLavadoraContainer textarea.form-control { min-height: 96px; resize: vertical; }
  #tplLavadoraContainer .btn-container { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  #tplLavadoraContainer .btn { padding: 11px 16px; border-radius: var(--radius-sm, 6px); font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; min-height: 42px; }
  #tplLavadoraContainer .btn:disabled { opacity: 0.62; cursor: not-allowed; }
  #tplLavadoraContainer .alert-box { margin-top: 12px; border-radius: var(--radius-sm, 6px); padding: 12px 14px; font-size: 13px; line-height: 1.55; border: 1px solid transparent; display: none; overflow-wrap: anywhere; }
  #tplLavadoraContainer .alert-box.show { display: block; }
  #tplLavadoraContainer .alert-box.success { background: var(--bc-action-bg); color: var(--bc-text-2); border-color: var(--bc-action-line); }
  #tplLavadoraContainer .alert-box.warning { background: var(--bc-warn-bg); color: var(--bc-warn); border-color: var(--bc-warn-line); }
  #tplLavadoraContainer .alert-box.error { background: var(--bc-danger-bg); color: var(--bc-danger); border-color: var(--bc-danger-line); }
  #tplLavadoraContainer .alert-box.info { background: var(--bc-info-bg); color: var(--bc-text-2); border-color: var(--bc-info-line); }
  #tplLavadoraContainer .result-links { display: none; margin-top: 14px; }
  #tplLavadoraContainer .result-links.show { display: grid; gap: 10px; }
  #tplLavadoraContainer .btn-download { display: block; padding: 12px; text-align: center; border-radius: var(--radius-sm, 6px); text-decoration: none; font-weight: 700; font-size: 13.5px; border: 1px solid var(--border); }
  #tplLavadoraContainer .modelo-situacao { font-size: 12.5px; line-height: 1.5; color: var(--bc-text-3); margin-top: 12px; }
  #tplLavadoraContainer .spinner { width: 16px; height: 16px; border: 2px solid var(--bc-line); border-top-color: transparent; border-radius: 50%; display: inline-block; animation: tplLavadoraSpin .8s linear infinite; vertical-align: -3px; margin-left: 8px; }
  @keyframes tplLavadoraSpin { to { transform: rotate(360deg); } }
  @media (max-width: 1100px) { #tplLavadoraContainer .grid-layout { grid-template-columns: 1fr; } }
  @media (max-width: 768px) {
    #tplLavadoraContainer .panel { padding: 14px; }
    #tplLavadoraContainer .form-group { min-width: 100%; }
    #tplLavadoraContainer .btn { width: 100%; }
    #tplLavadoraContainer .btn-container { flex-direction: column; }
  }
</style>

<script>
  // Prefixo tplLavadora_ / tplLav em todo helper e ID, para não colidir com outros módulos.

  const TPL_LAVADORA_HTML_ = `
    <div class="wrap">
      <main class="grid-layout">
        <section class="panel">
          <h2>Relatório no modelo oficial</h2>
          <p class="panel-subtitle">Escolha o tipo de equipamento e preencha os dados para gerar o relatório. O documento e o PDF ficam guardados na pasta do cliente.</p>

          <form id="tplFormLavadora" onsubmit="event.preventDefault(); tplLavadora_gerar();" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_tipo">Tipo de equipamento</label>
                <select id="tplLav_tipo" class="form-control" onchange="tplLavadora_aoTrocarTipo()">
                  <option value="TERMODESINFECTORA">Termodesinfectora</option>
                  <option value="LAVADORA">Lavadora ultrassônica</option>
                </select>
              </div>
              <div class="form-group"></div>
            </div>

            <div class="section-divider">1. Identificação do relatório</div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_numeroRelatorio">Número do relatório</label>
                <input id="tplLav_numeroRelatorio" class="form-control" type="text" placeholder="Ex.: TD-2026-001">
                <span class="field-help">Aparece no relatório e no nome do arquivo.</span>
              </div>
              <div class="form-group">
                <label for="tplLav_dataCiclo">Data do ciclo</label>
                <input id="tplLav_dataCiclo" class="form-control" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" oninput="tplLavadora_mascaraData(this)">
                <span class="field-help">Data em que o ciclo foi executado.</span>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_tipoEnsaio">Tipo de ensaio</label>
                <select id="tplLav_tipoEnsaio" class="form-control">
                  <option value="">Escolha o tipo de ensaio</option>
                  <option>Qualificação de instalação (QI)</option>
                  <option>Qualificação de operação (QO)</option>
                  <option>Qualificação de desempenho (QD)</option>
                  <option>Requalificação</option>
                  <option>Monitoramento de rotina</option>
                </select>
              </div>
              <div class="form-group">
                <label for="tplLav_perfil">Perfil da carga (opcional)</label>
                <input id="tplLav_perfil" class="form-control" type="text" placeholder="Ex.: instrumental delicado / canulados">
              </div>
            </div>

            <div class="section-divider">2. Cliente e local de instalação</div>
            <div class="form-row">
              <div class="form-group" style="flex:2;">
                <label for="tplLav_cliente">Cliente</label>
                <input id="tplLav_cliente" class="form-control" type="text" placeholder="Razão social do cliente">
              </div>
              <div class="form-group">
                <label for="tplLav_cnpj">CNPJ (opcional)</label>
                <input id="tplLav_cnpj" class="form-control" type="text" inputmode="numeric" placeholder="00.000.000/0000-00" oninput="tplLavadora_mascaraCnpj(this)">
                <span class="field-help">Usado para guardar o documento na pasta do cliente.</span>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group w-100">
                <label for="tplLav_setorLocal">Setor / local</label>
                <input id="tplLav_setorLocal" class="form-control" type="text" placeholder="Ex.: CME — Central de Material">
              </div>
            </div>

            <div class="section-divider">3. Equipamento e resultado</div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_equipamento">Equipamento (opcional)</label>
                <input id="tplLav_equipamento" class="form-control" type="text" placeholder="Ex.: Termodesinfectora 01">
              </div>
              <div class="form-group">
                <label for="tplLav_tag">TAG</label>
                <input id="tplLav_tag" class="form-control" type="text" placeholder="Ex.: TDS-01">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="tplLav_marca">Marca</label><input id="tplLav_marca" class="form-control" type="text" placeholder="Como consta na placa"></div>
              <div class="form-group"><label for="tplLav_modelo">Modelo</label><input id="tplLav_modelo" class="form-control" type="text" placeholder="Como consta na placa"></div>
              <div class="form-group"><label for="tplLav_ns">Número de série</label><input id="tplLav_ns" class="form-control" type="text" placeholder="Como consta na placa"></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_resultado">Resultado</label>
                <select id="tplLav_resultado" class="form-control">
                  <option value="">Escolha o resultado</option>
                  <option value="APROVADO">Aprovado</option>
                  <option value="REPROVADO">Reprovado</option>
                </select>
              </div>
              <div class="form-group"></div>
            </div>
            <div class="form-row">
              <div class="form-group w-100">
                <label for="tplLav_observacoes">Observações (opcional)</label>
                <textarea id="tplLav_observacoes" class="form-control" placeholder="Observações complementares do relatório"></textarea>
              </div>
            </div>

            <div class="btn-container">
              <button id="tplBtnGerarLav" class="btn btn-primary" type="submit"><span id="tplBtnGerarLavLabel">Gerar relatório da termodesinfectora</span><span id="tplBtnGerarLavSpinner" class="spinner hidden"></span></button>
              <button class="btn btn-secondary" type="button" onclick="tplLavadora_limpar()">Limpar campos</button>
            </div>
          </form>
        </section>

        <aside class="panel">
          <h2>Resultado</h2>
          <div id="tplLavStatusBox" class="alert-box info show">Preencha os campos e clique em gerar.</div>
          <div id="tplLavResultLinks" class="result-links">
            <a id="tplLavDocLink" class="btn-download" href="#" target="_blank" rel="noopener noreferrer">Abrir documento</a>
            <a id="tplLavPdfLink" class="btn-download" href="#" target="_blank" rel="noopener noreferrer">Abrir PDF</a>
            <a id="tplLavFolderLink" class="btn-download" href="#" target="_blank" rel="noopener noreferrer">Abrir pasta do cliente</a>
          </div>
          <p id="tplLavModeloSituacao" class="modelo-situacao">Conferindo o modelo do relatório…</p>
        </aside>
      </main>
    </div>
  `;

  function tplLavadora_el(id) { return document.getElementById(id); }

  function tplLavadora_mascaraData(input) {
    const d = String(input.value || '').replace(/\D/g, '').slice(0, 8);
    let s = d;
    if (d.length > 4) s = d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
    else if (d.length > 2) s = d.slice(0, 2) + '/' + d.slice(2);
    input.value = s;
  }

  function tplLavadora_mascaraCnpj(input) {
    const d = String(input.value || '').replace(/\D/g, '').slice(0, 14);
    let s = d;
    if (d.length > 12) s = d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})$/, '$1.$2.$3/$4-$5');
    else if (d.length > 8) s = d.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})$/, '$1.$2.$3/$4');
    else if (d.length > 5) s = d.replace(/^(\d{2})(\d{3})(\d{0,3})$/, '$1.$2.$3');
    else if (d.length > 2) s = d.replace(/^(\d{2})(\d{0,3})$/, '$1.$2');
    input.value = s;
  }

  function tplLavadora_dataValida(s) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s || ''));
    if (!m) return false;
    const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    return d.getFullYear() === Number(m[3]) && d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[1]);
  }

  function tplLavadora_tipo() { return tplLavadora_el('tplLav_tipo').value; }

  function tplLavadora_rotuloBotao() {
    return tplLavadora_tipo() === 'LAVADORA' ? 'Gerar relatório da lavadora ultrassônica' : 'Gerar relatório da termodesinfectora';
  }

  function tplLavadora_setStatus(message, type) {
    const box = tplLavadora_el('tplLavStatusBox');
    if (!box) return;
    box.className = 'alert-box show ' + (type || 'info');
    box.textContent = message;
  }

  function tplLavadora_ocultarLinks() { tplLavadora_el('tplLavResultLinks').classList.remove('show'); }

  function tplLavadora_mostrarLinks(res) {
    tplLavadora_el('tplLavDocLink').href = res.docUrl || '#';
    tplLavadora_el('tplLavPdfLink').href = res.pdfUrl || '#';
    tplLavadora_el('tplLavFolderLink').href = res.folderUrl || '#';
    tplLavadora_el('tplLavDocLink').style.display = res.docUrl ? '' : 'none';
    tplLavadora_el('tplLavFolderLink').style.display = res.folderUrl ? '' : 'none';
    tplLavadora_el('tplLavResultLinks').classList.add('show');
  }

  function tplLavadora_setLoading(loading) {
    tplLavadora_el('tplBtnGerarLav').disabled = loading;
    tplLavadora_el('tplBtnGerarLavLabel').textContent = loading ? 'Gerando…' : tplLavadora_rotuloBotao();
    tplLavadora_el('tplBtnGerarLavSpinner').classList.toggle('hidden', !loading);
  }

  function tplLavadora_aoTrocarTipo() {
    const lav = tplLavadora_tipo() === 'LAVADORA';
    tplLavadora_el('tplBtnGerarLavLabel').textContent = tplLavadora_rotuloBotao();
    tplLavadora_el('tplLav_numeroRelatorio').placeholder = lav ? 'Ex.: LU-2026-001' : 'Ex.: TD-2026-001';
    tplLavadora_el('tplLav_equipamento').placeholder = lav ? 'Ex.: Lavadora ultrassônica 01' : 'Ex.: Termodesinfectora 01';
    tplLavadora_el('tplLav_tag').placeholder = lav ? 'Ex.: LAV-01' : 'Ex.: TDS-01';
    tplLavadora_ocultarLinks();
    tplLavadora_setStatus('Equipamento selecionado: ' + (lav ? 'lavadora ultrassônica' : 'termodesinfectora') + '.', 'info');
    tplLavadora_carregarSituacaoModelo();
  }

  function tplLavadora_getPayload() {
    const v = function (id) { return tplLavadora_el(id).value.trim(); };
    return {
      tipo: tplLavadora_tipo(),
      numeroRelatorio: v('tplLav_numeroRelatorio'), dataCiclo: v('tplLav_dataCiclo'),
      cliente: v('tplLav_cliente'), cnpj: v('tplLav_cnpj'), setorLocal: v('tplLav_setorLocal'),
      equipamento: v('tplLav_equipamento'), tag: v('tplLav_tag'), marca: v('tplLav_marca'), modelo: v('tplLav_modelo'), ns: v('tplLav_ns'),
      tipoEnsaio: v('tplLav_tipoEnsaio'), perfil: v('tplLav_perfil'), resultado: v('tplLav_resultado'), observacoes: v('tplLav_observacoes')
    };
  }

  function tplLavadora_validar(p) {
    const obrig = [
      ['numeroRelatorio', 'Número do relatório', 'tplLav_numeroRelatorio'], ['dataCiclo', 'Data do ciclo', 'tplLav_dataCiclo'],
      ['tipoEnsaio', 'Tipo de ensaio', 'tplLav_tipoEnsaio'], ['cliente', 'Cliente', 'tplLav_cliente'],
      ['setorLocal', 'Setor / local', 'tplLav_setorLocal'], ['tag', 'TAG', 'tplLav_tag'], ['marca', 'Marca', 'tplLav_marca'],
      ['modelo', 'Modelo', 'tplLav_modelo'], ['ns', 'Número de série', 'tplLav_ns'], ['resultado', 'Resultado', 'tplLav_resultado']
    ];
    const faltam = obrig.filter(function (o) { return !p[o[0]]; });
    if (faltam.length) {
      try { tplLavadora_el(faltam[0][2]).focus(); } catch (e) {}
      return 'Preencha: ' + faltam.map(function (o) { return o[1]; }).join(', ') + '.';
    }
    if (!tplLavadora_dataValida(p.dataCiclo)) {
      try { tplLavadora_el('tplLav_dataCiclo').focus(); } catch (e) {}
      return 'Data do ciclo inválida: use dia/mês/ano, por exemplo 20/03/2026.';
    }
    return '';
  }

  function tplLavadora_gerar() {
    const payload = tplLavadora_getPayload();
    const erro = tplLavadora_validar(payload);
    tplLavadora_ocultarLinks();
    if (erro) { tplLavadora_setStatus(erro, 'error'); return; }
    tplLavadora_setLoading(true);
    tplLavadora_setStatus('Gerando o documento e o PDF…', 'info');
    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        tplLavadora_setLoading(false);
        if (!res || !res.ok) {
          tplLavadora_setStatus((res && res.erro) ? res.erro : 'Não foi possível gerar o relatório. Confira os campos e tente de novo; se repetir, avise o administrador.', 'error');
          return;
        }
        tplLavadora_mostrarLinks(res);
        const nome = String(res.nomeArquivo || '').replace(/_/g, ' ');
        if (res.aviso) tplLavadora_setStatus('Relatório gerado: ' + nome + '. ' + res.aviso, 'warning');
        else tplLavadora_setStatus('Relatório gerado no modelo oficial: ' + nome + '.', 'success');
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        tplLavadora_setLoading(false);
        tplLavadora_setStatus('Não foi possível gerar o relatório: ' + String(err && err.message ? err.message : err).replace(/[.\s]+$/, '') + '. Os campos continuam preenchidos; tente de novo e, se repetir, avise o administrador.', 'error');
      })
      .tplLavadoraGerarRelatorio(SGO_getSessionId(), payload);
  }

  function tplLavadora_limpar() {
    const tipo = tplLavadora_tipo();
    tplLavadora_el('tplFormLavadora').reset();
    tplLavadora_el('tplLav_tipo').value = tipo;
    tplLavadora_ocultarLinks();
    tplLavadora_setStatus('Campos limpos. Preencha os dados e clique em gerar.', 'info');
  }

  function tplLavadora_carregarSituacaoModelo() {
    google.script.run
      .withSuccessHandler(function (res) {
        const p = tplLavadora_el('tplLavModeloSituacao');
        if (p) p.textContent = (res && res.texto) ? res.texto : '';
      })
      .withFailureHandler(function () {
        const p = tplLavadora_el('tplLavModeloSituacao');
        if (p) p.textContent = '';
      })
      .tplLavadoraObterConfig(SGO_getSessionId(), tplLavadora_tipo());
  }

  function renderTplLavadora_() {
    const container = document.getElementById('tplLavadoraContainer');
    if (!container) return;
    try {
      container.innerHTML = TPL_LAVADORA_HTML_;
      tplLavadora_aoTrocarTipo();
      tplLavadora_setStatus('Preencha os campos e clique em gerar.', 'info');
    } catch (e) {
      console.error('renderTplLavadora_ falhou:', e);
      container.innerHTML = '<div style="padding:24px;color:var(--bc-danger);background:var(--bc-danger-bg);border:1px solid var(--bc-danger-line);border-radius:6px;">' +
        'Não foi possível abrir esta tela. Recarregue a página (F5); se persistir, avise o administrador.</div>';
    }
  }
</script>

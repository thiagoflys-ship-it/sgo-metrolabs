<!--
  Aba "Relatório oficial" das Lavadoras (antes "Preencher modelo") — tela nativa do SGO+.
  21/10/2026: modelo NOVO (padrão) = relatório de qualificação consolidado a partir dos relatórios de ensaio emitidos,
  com cliente/unidade/equipamento do cadastro e aprovação do responsável técnico (código no fim deste arquivo,
  JS_QualifVinculo.html e SGO_LavRel_ModeloOficialNovo.js). O formulário ANTERIOR, logo abaixo, foi preservado e só
  aparece se o Administrador reativar o modelo anterior.
  Formulário anterior:
  Fase 2 (16/10): um formulário só, com os mesmos campos para os dois tipos de equipamento;
  sem cabeçalho repetido, relógio, exemplos fictícios ou jargão. Geração pelo próprio SGO+
  (SGO_TemplateLavadora.js). CSS escopado sob #tplLavadoraContainer.
-->
<style>
  #tplLavadoraContainer, #tplLavadoraContainer * { box-sizing: border-box; }
  #tplLavadoraContainer .wrap { max-width: 100%; margin: 0; padding: 0; }
  #tplLavadoraContainer .hidden { display: none !important; }
  #tplLavadoraContainer .grid-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  #tplLavadoraContainer .grid-layout > * { min-width: 0; }
  #tplLavadoraContainer .panel { border-radius: var(--radius, 8px); padding: 18px; border: 1px solid var(--border); background: var(--bc-surface, #FFFFFF); min-width: 0; overflow-wrap: break-word; }
  #tplLavadoraContainer .panel h2 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
  #tplLavadoraContainer .panel-subtitle { margin: 0 0 16px; font-size: 13px; line-height: 1.5; color: var(--bc-text-3); }
  #tplLavadoraContainer .section-divider { margin: 22px 0 12px; padding: 0 0 6px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--bc-text-2); }
  #tplLavadoraContainer .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  #tplLavadoraContainer .form-group { flex: 1; min-width: 205px; }
  #tplLavadoraContainer .form-group.w-100 { flex: 1 1 100%; }
  #tplLavadoraContainer .form-group label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; }
  #tplLavadoraContainer .field-help { display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: var(--bc-text-3); }
  #tplLavadoraContainer .form-control { width: 100%; min-height: 42px; padding: 10px 11px; border-radius: var(--radius-sm, 6px); font-size: 13px; }
  #tplLavadoraContainer textarea.form-control { min-height: 96px; resize: vertical; }
  #tplLavadoraContainer .btn-container { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  #tplLavadoraContainer .btn { padding: 11px 16px; border-radius: var(--radius-sm, 6px); font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; min-height: 42px; }
  #tplLavadoraContainer .btn:disabled { opacity: 0.62; cursor: not-allowed; }
  #tplLavadoraContainer .alert-box { margin-top: 12px; border-radius: var(--radius-sm, 6px); padding: 12px 14px; font-size: 13px; line-height: 1.55; border: 1px solid transparent; display: none; overflow-wrap: anywhere; }
  #tplLavadoraContainer .alert-box.show { display: block; }
  #tplLavadoraContainer .alert-box.success { background: var(--bc-action-bg); color: var(--bc-text-2); border-color: var(--bc-action-line); }
  #tplLavadoraContainer .alert-box.warning { background: var(--bc-warn-bg); color: var(--bc-warn); border-color: var(--bc-warn-line); }
  #tplLavadoraContainer .alert-box.error { background: var(--bc-danger-bg); color: var(--bc-danger); border-color: var(--bc-danger-line); }
  #tplLavadoraContainer .alert-box.info { background: var(--bc-info-bg); color: var(--bc-text-2); border-color: var(--bc-info-line); }
  #tplLavadoraContainer .result-links { display: none; margin-top: 14px; }
  #tplLavadoraContainer .result-links.show { display: grid; gap: 10px; }
  #tplLavadoraContainer .btn-download { display: block; padding: 12px; text-align: center; border-radius: var(--radius-sm, 6px); text-decoration: none; font-weight: 700; font-size: 13.5px; border: 1px solid var(--border); }
  #tplLavadoraContainer .modelo-situacao { font-size: 12.5px; line-height: 1.5; color: var(--bc-text-3); margin-top: 12px; }
  #tplLavadoraContainer .spinner { width: 16px; height: 16px; border: 2px solid var(--bc-line); border-top-color: transparent; border-radius: 50%; display: inline-block; animation: tplLavadoraSpin .8s linear infinite; vertical-align: -3px; margin-left: 8px; }
  @keyframes tplLavadoraSpin { to { transform: rotate(360deg); } }
  @media (max-width: 1100px) { #tplLavadoraContainer .grid-layout { grid-template-columns: 1fr; } }
  @media (max-width: 768px) {
    #tplLavadoraContainer .panel { padding: 14px; }
    #tplLavadoraContainer .form-group { min-width: 100%; }
    #tplLavadoraContainer .btn { width: 100%; }
    #tplLavadoraContainer .btn-container { flex-direction: column; }
  }
</style>

<script>
  // Prefixo tplLavadora_ / tplLav em todo helper e ID, para não colidir com outros módulos.

  const TPL_LAVADORA_HTML_ = `
    <div class="wrap">
      <main class="grid-layout">
        <section class="panel">
          <h2>Relatório no modelo oficial</h2>
          <p class="panel-subtitle">Escolha o tipo de equipamento e preencha os dados para gerar o relatório. O documento e o PDF ficam guardados na pasta do cliente.</p>

          <form id="tplFormLavadora" onsubmit="event.preventDefault(); tplLavadora_gerar();" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_tipo">Tipo de equipamento</label>
                <select id="tplLav_tipo" class="form-control" onchange="tplLavadora_aoTrocarTipo()">
                  <option value="TERMODESINFECTORA">Termodesinfectora</option>
                  <option value="LAVADORA">Lavadora ultrassônica</option>
                </select>
              </div>
              <div class="form-group"></div>
            </div>

            <div class="section-divider">1. Identificação do relatório</div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_numeroRelatorio">Número do relatório</label>
                <input id="tplLav_numeroRelatorio" class="form-control" type="text" placeholder="Ex.: TD-2026-001">
                <span class="field-help">Aparece no relatório e no nome do arquivo.</span>
              </div>
              <div class="form-group">
                <label for="tplLav_dataCiclo">Data do ciclo</label>
                <input id="tplLav_dataCiclo" class="form-control" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" oninput="tplLavadora_mascaraData(this)">
                <span class="field-help">Data em que o ciclo foi executado.</span>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_tipoEnsaio">Tipo de ensaio</label>
                <select id="tplLav_tipoEnsaio" class="form-control">
                  <option value="">Escolha o tipo de ensaio</option>
                  <option>Qualificação de instalação (QI)</option>
                  <option>Qualificação de operação (QO)</option>
                  <option>Qualificação de desempenho (QD)</option>
                  <option>Requalificação</option>
                  <option>Monitoramento de rotina</option>
                </select>
              </div>
              <div class="form-group">
                <label for="tplLav_perfil">Perfil da carga (opcional)</label>
                <input id="tplLav_perfil" class="form-control" type="text" placeholder="Ex.: instrumental delicado / canulados">
              </div>
            </div>

            <div class="section-divider">2. Cliente e local de instalação</div>
            <div class="form-row">
              <div class="form-group" style="flex:2;">
                <label for="tplLav_cliente">Cliente</label>
                <input id="tplLav_cliente" class="form-control" type="text" placeholder="Razão social do cliente">
              </div>
              <div class="form-group">
                <label for="tplLav_cnpj">CNPJ (opcional)</label>
                <input id="tplLav_cnpj" class="form-control" type="text" inputmode="numeric" placeholder="00.000.000/0000-00" oninput="tplLavadora_mascaraCnpj(this)">
                <span class="field-help">Usado para guardar o documento na pasta do cliente.</span>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group w-100">
                <label for="tplLav_setorLocal">Setor / local</label>
                <input id="tplLav_setorLocal" class="form-control" type="text" placeholder="Ex.: CME — Central de Material">
              </div>
            </div>

            <div class="section-divider">3. Equipamento e resultado</div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_equipamento">Equipamento (opcional)</label>
                <input id="tplLav_equipamento" class="form-control" type="text" placeholder="Ex.: Termodesinfectora 01">
              </div>
              <div class="form-group">
                <label for="tplLav_tag">TAG</label>
                <input id="tplLav_tag" class="form-control" type="text" placeholder="Ex.: TDS-01">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="tplLav_marca">Marca</label><input id="tplLav_marca" class="form-control" type="text" placeholder="Como consta na placa"></div>
              <div class="form-group"><label for="tplLav_modelo">Modelo</label><input id="tplLav_modelo" class="form-control" type="text" placeholder="Como consta na placa"></div>
              <div class="form-group"><label for="tplLav_ns">Número de série</label><input id="tplLav_ns" class="form-control" type="text" placeholder="Como consta na placa"></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="tplLav_resultado">Resultado</label>
                <select id="tplLav_resultado" class="form-control">
                  <option value="">Escolha o resultado</option>
                  <option value="APROVADO">Aprovado</option>
                  <option value="REPROVADO">Reprovado</option>
                </select>
              </div>
              <div class="form-group"></div>
            </div>
            <div class="form-row">
              <div class="form-group w-100">
                <label for="tplLav_observacoes">Observações (opcional)</label>
                <textarea id="tplLav_observacoes" class="form-control" placeholder="Observações complementares do relatório"></textarea>
              </div>
            </div>

            <div class="btn-container">
              <button id="tplBtnGerarLav" class="btn btn-primary" type="submit"><span id="tplBtnGerarLavLabel">Gerar relatório da termodesinfectora</span><span id="tplBtnGerarLavSpinner" class="spinner hidden"></span></button>
              <button class="btn btn-secondary" type="button" onclick="tplLavadora_limpar()">Limpar campos</button>
            </div>
          </form>
        </section>

        <aside class="panel">
          <h2>Resultado</h2>
          <div id="tplLavStatusBox" class="alert-box info show">Preencha os campos e clique em gerar.</div>
          <div id="tplLavResultLinks" class="result-links">
            <a id="tplLavDocLink" class="btn-download" href="#" target="_blank" rel="noopener noreferrer">Abrir documento</a>
            <a id="tplLavPdfLink" class="btn-download" href="#" target="_blank" rel="noopener noreferrer">Abrir PDF</a>
            <a id="tplLavFolderLink" class="btn-download" href="#" target="_blank" rel="noopener noreferrer">Abrir pasta do cliente</a>
          </div>
          <p id="tplLavModeloSituacao" class="modelo-situacao">Conferindo o modelo do relatório…</p>
        </aside>
      </main>
    </div>
  `;

  function tplLavadora_el(id) { return document.getElementById(id); }

  function tplLavadora_mascaraData(input) {
    const d = String(input.value || '').replace(/\D/g, '').slice(0, 8);
    let s = d;
    if (d.length > 4) s = d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
    else if (d.length > 2) s = d.slice(0, 2) + '/' + d.slice(2);
    input.value = s;
  }

  function tplLavadora_mascaraCnpj(input) {
    const d = String(input.value || '').replace(/\D/g, '').slice(0, 14);
    let s = d;
    if (d.length > 12) s = d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})$/, '$1.$2.$3/$4-$5');
    else if (d.length > 8) s = d.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})$/, '$1.$2.$3/$4');
    else if (d.length > 5) s = d.replace(/^(\d{2})(\d{3})(\d{0,3})$/, '$1.$2.$3');
    else if (d.length > 2) s = d.replace(/^(\d{2})(\d{0,3})$/, '$1.$2');
    input.value = s;
  }

  function tplLavadora_dataValida(s) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s || ''));
    if (!m) return false;
    const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    return d.getFullYear() === Number(m[3]) && d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[1]);
  }

  function tplLavadora_tipo() { return tplLavadora_el('tplLav_tipo').value; }

  function tplLavadora_rotuloBotao() {
    return tplLavadora_tipo() === 'LAVADORA' ? 'Gerar relatório da lavadora ultrassônica' : 'Gerar relatório da termodesinfectora';
  }

  function tplLavadora_setStatus(message, type) {
    const box = tplLavadora_el('tplLavStatusBox');
    if (!box) return;
    box.className = 'alert-box show ' + (type || 'info');
    box.textContent = message;
  }

  function tplLavadora_ocultarLinks() { tplLavadora_el('tplLavResultLinks').classList.remove('show'); }

  function tplLavadora_mostrarLinks(res) {
    tplLavadora_el('tplLavDocLink').href = res.docUrl || '#';
    tplLavadora_el('tplLavPdfLink').href = res.pdfUrl || '#';
    tplLavadora_el('tplLavFolderLink').href = res.folderUrl || '#';
    tplLavadora_el('tplLavDocLink').style.display = res.docUrl ? '' : 'none';
    tplLavadora_el('tplLavFolderLink').style.display = res.folderUrl ? '' : 'none';
    tplLavadora_el('tplLavResultLinks').classList.add('show');
  }

  function tplLavadora_setLoading(loading) {
    tplLavadora_el('tplBtnGerarLav').disabled = loading;
    tplLavadora_el('tplBtnGerarLavLabel').textContent = loading ? 'Gerando…' : tplLavadora_rotuloBotao();
    tplLavadora_el('tplBtnGerarLavSpinner').classList.toggle('hidden', !loading);
  }

  function tplLavadora_aoTrocarTipo() {
    const lav = tplLavadora_tipo() === 'LAVADORA';
    tplLavadora_el('tplBtnGerarLavLabel').textContent = tplLavadora_rotuloBotao();
    tplLavadora_el('tplLav_numeroRelatorio').placeholder = lav ? 'Ex.: LU-2026-001' : 'Ex.: TD-2026-001';
    tplLavadora_el('tplLav_equipamento').placeholder = lav ? 'Ex.: Lavadora ultrassônica 01' : 'Ex.: Termodesinfectora 01';
    tplLavadora_el('tplLav_tag').placeholder = lav ? 'Ex.: LAV-01' : 'Ex.: TDS-01';
    tplLavadora_ocultarLinks();
    tplLavadora_setStatus('Equipamento selecionado: ' + (lav ? 'lavadora ultrassônica' : 'termodesinfectora') + '.', 'info');
    tplLavadora_carregarSituacaoModelo();
  }

  function tplLavadora_getPayload() {
    const v = function (id) { return tplLavadora_el(id).value.trim(); };
    return {
      tipo: tplLavadora_tipo(),
      numeroRelatorio: v('tplLav_numeroRelatorio'), dataCiclo: v('tplLav_dataCiclo'),
      cliente: v('tplLav_cliente'), cnpj: v('tplLav_cnpj'), setorLocal: v('tplLav_setorLocal'),
      equipamento: v('tplLav_equipamento'), tag: v('tplLav_tag'), marca: v('tplLav_marca'), modelo: v('tplLav_modelo'), ns: v('tplLav_ns'),
      tipoEnsaio: v('tplLav_tipoEnsaio'), perfil: v('tplLav_perfil'), resultado: v('tplLav_resultado'), observacoes: v('tplLav_observacoes')
    };
  }

  function tplLavadora_validar(p) {
    const obrig = [
      ['numeroRelatorio', 'Número do relatório', 'tplLav_numeroRelatorio'], ['dataCiclo', 'Data do ciclo', 'tplLav_dataCiclo'],
      ['tipoEnsaio', 'Tipo de ensaio', 'tplLav_tipoEnsaio'], ['cliente', 'Cliente', 'tplLav_cliente'],
      ['setorLocal', 'Setor / local', 'tplLav_setorLocal'], ['tag', 'TAG', 'tplLav_tag'], ['marca', 'Marca', 'tplLav_marca'],
      ['modelo', 'Modelo', 'tplLav_modelo'], ['ns', 'Número de série', 'tplLav_ns'], ['resultado', 'Resultado', 'tplLav_resultado']
    ];
    const faltam = obrig.filter(function (o) { return !p[o[0]]; });
    if (faltam.length) {
      try { tplLavadora_el(faltam[0][2]).focus(); } catch (e) {}
      return 'Preencha: ' + faltam.map(function (o) { return o[1]; }).join(', ') + '.';
    }
    if (!tplLavadora_dataValida(p.dataCiclo)) {
      try { tplLavadora_el('tplLav_dataCiclo').focus(); } catch (e) {}
      return 'Data do ciclo inválida: use dia/mês/ano, por exemplo 20/03/2026.';
    }
    return '';
  }

  function tplLavadora_gerar() {
    const payload = tplLavadora_getPayload();
    const erro = tplLavadora_validar(payload);
    tplLavadora_ocultarLinks();
    if (erro) { tplLavadora_setStatus(erro, 'error'); return; }
    tplLavadora_setLoading(true);
    tplLavadora_setStatus('Gerando o documento e o PDF…', 'info');
    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        tplLavadora_setLoading(false);
        if (!res || !res.ok) {
          tplLavadora_setStatus((res && res.erro) ? res.erro : 'Não foi possível gerar o relatório. Confira os campos e tente de novo; se repetir, avise o administrador.', 'error');
          return;
        }
        tplLavadora_mostrarLinks(res);
        const nome = String(res.nomeArquivo || '').replace(/_/g, ' ');
        if (res.aviso) tplLavadora_setStatus('Relatório gerado: ' + nome + '. ' + res.aviso, 'warning');
        else tplLavadora_setStatus('Relatório gerado no modelo oficial: ' + nome + '.', 'success');
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        tplLavadora_setLoading(false);
        tplLavadora_setStatus('Não foi possível gerar o relatório: ' + String(err && err.message ? err.message : err).replace(/[.\s]+$/, '') + '. Os campos continuam preenchidos; tente de novo e, se repetir, avise o administrador.', 'error');
      })
      .tplLavadoraGerarRelatorio(SGO_getSessionId(), payload);
  }

  function tplLavadora_limpar() {
    const tipo = tplLavadora_tipo();
    tplLavadora_el('tplFormLavadora').reset();
    tplLavadora_el('tplLav_tipo').value = tipo;
    tplLavadora_ocultarLinks();
    tplLavadora_setStatus('Campos limpos. Preencha os dados e clique em gerar.', 'info');
  }

  function tplLavadora_carregarSituacaoModelo() {
    google.script.run
      .withSuccessHandler(function (res) {
        const p = tplLavadora_el('tplLavModeloSituacao');
        if (p) p.textContent = (res && res.texto) ? res.texto : '';
      })
      .withFailureHandler(function () {
        const p = tplLavadora_el('tplLavModeloSituacao');
        if (p) p.textContent = '';
      })
      .tplLavadoraObterConfig(SGO_getSessionId(), tplLavadora_tipo());
  }

  function tplLavadora_renderAnterior_() {
    const container = document.getElementById('tplLavadoraContainer');
    if (!container) return;
    try {
      container.innerHTML = TPL_LAVADORA_HTML_;
      tplLavadora_aoTrocarTipo();
      tplLavadora_setStatus('Preencha os campos e clique em gerar.', 'info');
    } catch (e) {
      console.error('tplLavadora_renderAnterior_ falhou:', e);
      container.innerHTML = '<div style="padding:24px;color:var(--bc-danger);background:var(--bc-danger-bg);border:1px solid var(--bc-danger-line);border-radius:6px;">' +
        'Não foi possível abrir esta tela. Recarregue a página (F5); se persistir, avise o administrador.</div>';
    }
  }

  /* ==================================================================
   * RELATÓRIO NO MODELO OFICIAL — MODELO NOVO (21/10/2026, Lavadoras)
   * Cliente → unidade → equipamento do cadastro; relatórios de ensaio emitidos do equipamento;
   * etapas, lista da instalação e indicadores; rascunho com o resultado calculado; aprovação do
   * responsável técnico; emissão em HTML e PDF na pasta do equipamento (dentro da pasta do cliente).
   * Servidor: SGO_LavRel_ModeloOficialNovo.js (LavOficial_apiDispatch). O formulário antigo
   * (acima) só aparece se o Administrador escolher "Modelo anterior". Molde: JS_TemplateAutoclave.html.
   * ================================================================== */
  var TPLLAVOF = null;

  /** Roteador do relatório oficial da lavadora (mesmo formato do SGO_QVinc.chamarOficial). */
  function tplLavOf_chamarServidor_(fn, payload, ok, erro) {
    google.script.run
      .withSuccessHandler(function (r) { if (r && r.ok) ok(r); else erro((r && r.erro) || 'O servidor não confirmou a operação. Tente de novo.'); })
      .withFailureHandler(function (e) { erro('Não foi possível falar com o servidor (' + String(e && e.message ? e.message : e).replace(/[.\s]+$/, '') + '). Confira a conexão e tente de novo.'); })
      .LavOficial_apiDispatch({ sessionId: SGO_getSessionId(), fn: fn, payload: payload || {} });
  }

  function tplLavOf_esc(s) { return SGO_QVinc.esc(s); }
  function tplLavOf_el(id) { return document.getElementById(id); }

  function tplLavOf_chamar(fn, payload, ok, erro, espera) {
    if (espera) SGO_iniciarCarregamento_(espera);
    tplLavOf_chamarServidor_(fn, payload, function (r) { if (espera) SGO_finalizarCarregamento_(); ok(r); }, function (e) { if (espera) SGO_finalizarCarregamento_(); (erro || tplLavOf_msgErro)(e); });
  }

  function tplLavOf_msg(id, tipo, texto) {
    var b = tplLavOf_el(id);
    if (!b) return;

        '<section class="panel" style="margin-bottom:14px"><h2>Qualificação</h2>' +

          '<div class="form-group"><label for="tplLavOfPeriodo">Requalificação a cada (meses)</label><input id="tplLavOfPeriodo" class="form-control" type="number" inputmode="numeric" min="' + sit.periodicidadeMin + '" max="' + sit.periodicidadeMax + '" onchange="tplLavOf_lerForm()"><span class="field-help">Padrão ' + sit.periodicidadePadrao + ' meses, contados a partir do último ensaio.</span></div></div>' +
          '<div class="form-row"><div class="form-group w-100"><label for="tplLavOfAcomp">Acompanhado por (contratante)</label><input id="tplLavOfAcomp" class="form-control" type="text" maxlength="120" placeholder="Nome e função de quem acompanhou os ensaios" onchange="tplLavOf_lerForm()"></div></div>' +

      '<p class="modelo-situacao" style="margin-top:12px">Modelo novo do relatório oficial. Os documentos ficam na pasta do equipamento, dentro da pasta do cliente, e aparecem na ficha do equipamento, no Arquivo de documentos e no QR code.</p>' +

  function tplLavOf_render(container, sit) {
    TPLLAVOF = { sit: sit, ident: null, eq: null, form: tplLavOf_formInicial(sit), numero: '', rascunho: null, textos: null };
    container.innerHTML = tplLavOf_html(sit);
    if (sit.podeAlterarModelo) tplLavOf_el('tplLavOfModelo').value = sit.modelo;
    TPLLAVOF.vinc = SGO_QVinc.montar(tplLavOf_el('tplLavOfVinculo'), {
      prefixo: 'tplLavOfV', titulo: 'Cliente e equipamento',
      subtitulo: 'O relatório começa pelo cadastro: escolha o cliente, a unidade e a lavadora (termodesinfectora ou ultrassônica). A identificação vem do cadastro, sem digitar de novo, e o relatório só pode ser feito para equipamento do próprio cliente.', chamar: tplLavOf_chamarServidor_, textoTipoIncompativel: 'O tipo cadastrado não é de lavadora: confira se escolheu o equipamento certo.',
      aoMudar: function (ident) { TPLLAVOF.ident = ident; TPLLAVOF.rascunho = null; tplLavOf_carregarEquipamento(); }
    });
    tplLavOf_preencherForm();
    tplLavOf_listarAprovacoes();
  }

  function tplLavOf_payloadBase() {
    var i = TPLLAVOF.ident || {};
    var f = TPLLAVOF.form;
    return { clienteId: i.clienteId, unidadeId: i.unidadeId, equipamentoId: i.equipamentoId, etapas: f.etapas, motivo: f.motivo, periodicidadeMeses: f.periodicidadeMeses,
      responsavelCliente: f.responsavelCliente, dataQi: f.dataQi, qi: f.qi, indicadores: f.indicadores, observacoes: f.observacoes, ciclos: f.ciclos,
      numero: TPLLAVOF.numero || '', motivoRevisao: (tplLavOf_el('tplLavOfMotivoRev') || {}).value || '' };
  }

  function tplLavOf_carregarEquipamento(depois) {
    var box = tplLavOf_el('tplLavOfEquip'), emit = tplLavOf_el('tplLavOfEmitidosBox');
    if (!TPLLAVOF.ident) { box.classList.add('hidden'); emit.classList.add('hidden'); return; }
    var i = TPLLAVOF.ident;
    tplLavOf_chamar('apiEquipamento', { clienteId: i.clienteId, unidadeId: i.unidadeId, equipamentoId: i.equipamentoId }, function (r) {
      TPLLAVOF.eq = r;
      box.classList.remove('hidden'); emit.classList.remove('hidden');
      var s = r.situacao || {};
      tplLavOf_el('tplLavOfSituacao').innerHTML = '<div class="qualif-situacao ' + tplLavOf_esc(s.situacao) + '">' + tplLavOf_esc(s.rotulo || '') + '</div>';
      tplLavOf_desenharCiclos(); tplLavOf_desenharEmitidos();
      if (depois) depois();
    }, function (e) { box.classList.add('hidden'); tplLavOf_msgErro(e); }, 'Carregando o equipamento…');
  }

  function tplLavOf_desenharCiclos() {
    var r = TPLLAVOF.eq, sel = TPLLAVOF.form.ciclos;
    var vig = (r.ciclos || []).filter(function (c) { return c.status === 'EMITIDO'; });
    var subst = (r.ciclos || []).filter(function (c) { return c.status !== 'EMITIDO'; });
    var h = vig.length ? '<div style="display:grid;gap:8px">' + vig.map(function (c) {
      return '<label style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:13px;line-height:1.5"><input type="checkbox" data-ciclo="' + tplLavOf_esc(c.id) + '"' + (sel.indexOf(c.id) >= 0 ? ' checked' : '') + ' onchange="tplLavOf_marcarCiclo(this)" style="margin-top:3px">' +
        '<span><b>' + tplLavOf_esc(c.numero) + '</b> · revisão ' + tplLavOf_esc(c.revisao) + ' · ' + tplLavOf_esc(c.tipoEnsaio) + (c.programa ? ' · ' + tplLavOf_esc(c.programa) : '') +
        '<br><span style="color:var(--bc-text-3)">' + (c.data ? 'Ensaio em ' + tplLavOf_esc(c.data) + ' · ' : '') + 'emitido em ' + tplLavOf_esc(c.emitidoEm) + ' por ' + tplLavOf_esc(c.aprovadoPor || '—') + ' · ' +
        (c.resultado === 'APROVADO' ? '<span class="ok-txt" style="color:var(--bc-ok,#1d6b3f);font-weight:700">aprovado</span>' : '<span style="color:var(--bc-danger);font-weight:700">' + tplLavOf_esc(String(c.resultado || '').toLowerCase()) + '</span>') + '</span></span></label>';
    }).join('') + '</div>' : '<div class="alert-box show info">Nenhum relatório de ensaio emitido para esta lavadora. Emita o relatório de cada ciclo na aba "Gerar relatório" (com o mesmo cliente e equipamento) e volte aqui. Para um relatório só da qualificação de instalação, desmarque operação e desempenho.</div>';
    if (subst.length) h += '<p class="field-help" style="margin-top:8px">' + subst.length + ' revisão(ões) anterior(es) substituída(s) não aparece(m) para escolha: vale a revisão vigente.</p>';
    tplLavOf_el('tplLavOfCiclos').innerHTML = h;
    var sv = r.semVinculo || [];
    tplLavOf_el('tplLavOfSemVinculoBox').classList.toggle('hidden', !sv.length);
    tplLavOf_el('tplLavOfSemVinculo').innerHTML = sv.map(function (c) {
      return '<div style="border:1px dashed var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.5"><b>' + tplLavOf_esc(c.numero) + '</b> · revisão ' + tplLavOf_esc(c.revisao) + ' · TAG no relatório: ' + tplLavOf_esc(c.tag || '—') + ' · emitido em ' + tplLavOf_esc(c.emitidoEm || '—') +
        (c.mesmaTag ? '' : '<br><label style="font-weight:500"><input type="checkbox" id="tplLavOfTag_' + tplLavOf_esc(c.id) + '"> É o mesmo equipamento (a TAG do relatório é diferente da TAG do cadastro)</label>') +
        '<div class="btn-container" style="margin-top:6px"><button type="button" class="btn btn-secondary" onclick="tplLavOf_vincular(\'' + tplLavOf_esc(c.id) + '\')">Vincular a este equipamento</button></div></div>';
    }).join('');
  }

  function tplLavOf_marcarCiclo(cb) {
    var id = cb.getAttribute('data-ciclo'), l = TPLLAVOF.form.ciclos, k = l.indexOf(id);
    if (cb.checked && k < 0) l.push(id);
    if (!cb.checked && k >= 0) l.splice(k, 1);
    TPLLAVOF.rascunho = null;
  }

  function tplLavOf_vincular(id) {
    var i = TPLLAVOF.ident, cb = tplLavOf_el('tplLavOfTag_' + id);
    tplLavOf_chamar('apiVincular', { emissaoId: id, clienteId: i.clienteId, unidadeId: i.unidadeId, equipamentoId: i.equipamentoId, confirmarTagDiferente: !!(cb && cb.checked) }, function (r) {
      tplLavOf_msg('tplLavOfMsgGeral', 'success', r.mensagem);
      tplLavOf_carregarEquipamento();
    }, null, 'Vinculando…');
  }

  function tplLavOf_preencherForm() {
    var f = TPLLAVOF.form;
    tplLavOf_el('tplLavOfQI').checked = !!f.etapas.QI; tplLavOf_el('tplLavOfQO').checked = !!f.etapas.QO; tplLavOf_el('tplLavOfQD').checked = !!f.etapas.QD;
    tplLavOf_el('tplLavOfMotivo').value = f.motivo || ''; tplLavOf_el('tplLavOfPeriodo').value = f.periodicidadeMeses || '';
    tplLavOf_el('tplLavOfAcomp').value = f.responsavelCliente || ''; tplLavOf_el('tplLavOfObs').value = f.observacoes || ''; tplLavOf_el('tplLavOfDataQi').value = f.dataQi || '';
    tplLavOf_mostrarQi(); tplLavOf_desenharIndicadores();
  }

  function tplLavOf_lerForm() {
    var f = TPLLAVOF.form;
    f.etapas = { QI: tplLavOf_el('tplLavOfQI').checked, QO: tplLavOf_el('tplLavOfQO').checked, QD: tplLavOf_el('tplLavOfQD').checked };
    f.motivo = tplLavOf_el('tplLavOfMotivo').value; f.periodicidadeMeses = parseInt(tplLavOf_el('tplLavOfPeriodo').value, 10) || '';
    f.responsavelCliente = tplLavOf_el('tplLavOfAcomp').value.trim(); f.observacoes = tplLavOf_el('tplLavOfObs').value.trim(); f.dataQi = tplLavOf_el('tplLavOfDataQi').value.trim();
    Array.prototype.forEach.call(document.querySelectorAll('[data-qi-sit]'), function (s) { f.qi[s.getAttribute('data-qi-sit')] = f.qi[s.getAttribute('data-qi-sit')] || {}; f.qi[s.getAttribute('data-qi-sit')].situacao = s.value; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-qi-obs]'), function (s) { f.qi[s.getAttribute('data-qi-obs')] = f.qi[s.getAttribute('data-qi-obs')] || {}; f.qi[s.getAttribute('data-qi-obs')].observacao = s.value.trim(); });
    f.indicadores = Array.prototype.map.call(document.querySelectorAll('[data-ind]'), function (row) {
      return { tipo: row.querySelector('.ind-tipo').value, ciclo: row.querySelector('.ind-ciclo').value.trim(), resultado: row.querySelector('.ind-res').value, observacao: row.querySelector('.ind-obs').value.trim() };
    });
    TPLLAVOF.rascunho = null;
  }

  function tplLavOf_mostrarQi() {
    var on = tplLavOf_el('tplLavOfQI').checked, f = TPLLAVOF.form;
    tplLavOf_el('tplLavOfQiBox').classList.toggle('hidden', !on);
    if (!on) return;
    tplLavOf_el('tplLavOfQiItens').innerHTML = (TPLLAVOF.sit.qiItens || []).map(function (it) {
      var r = f.qi[it.id] || {};
      return '<div style="border-bottom:1px solid var(--border);padding:8px 0"><div style="font-size:13px;line-height:1.5;margin-bottom:6px">' + tplLavOf_esc(it.texto) + (it.tipo ? ' <span class="field-help" style="display:inline">(só ' + (it.tipo === 'TERMO' ? 'termodesinfectora' : 'lavadora ultrassônica') + ')</span>' : '') + '</div>' +
        '<div class="form-row" style="margin-bottom:0"><div class="form-group" style="min-width:170px;flex:0 0 190px"><select class="form-control" data-qi-sit="' + it.id + '" onchange="tplLavOf_lerForm()"><option value="">Escolha</option><option value="C"' + (r.situacao === 'C' ? ' selected' : '') + '>Conforme</option><option value="NC"' + (r.situacao === 'NC' ? ' selected' : '') + '>Não conforme</option><option value="NA"' + (r.situacao === 'NA' ? ' selected' : '') + '>Não aplicável</option></select></div>' +
        '<div class="form-group"><input class="form-control" type="text" maxlength="400" placeholder="Observação (obrigatória se não conforme)" data-qi-obs="' + it.id + '" value="' + tplLavOf_esc(r.observacao || '') + '" onchange="tplLavOf_lerForm()"></div></div></div>';
    }).join('');
  }

  function tplLavOf_qiTodos() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-qi-sit]'), function (s) { if (!s.value) s.value = 'C'; });
    tplLavOf_lerForm();
  }

  function tplLavOf_desenharIndicadores() {
    var f = TPLLAVOF.form, tipos = TPLLAVOF.sit.indicadores || [];
    tplLavOf_el('tplLavOfIndicadores').innerHTML = f.indicadores.length ? f.indicadores.map(function (x, k) {
      return '<div data-ind="' + k + '" class="form-row" style="border-bottom:1px solid var(--border);padding-bottom:8px">' +
        '<div class="form-group"><label>Ensaio</label><select class="form-control ind-tipo" onchange="tplLavOf_lerForm()"><option value="">Escolha</option>' + tipos.map(function (t) { return '<option' + (t === x.tipo ? ' selected' : '') + '>' + tplLavOf_esc(t) + '</option>'; }).join('') + '</select></div>' +
        '<div class="form-group"><label>Ciclo</label><input class="form-control ind-ciclo" type="text" maxlength="60" placeholder="Ex.: ciclo 2, relatório LAV-0002" value="' + tplLavOf_esc(x.ciclo) + '" onchange="tplLavOf_lerForm()"></div>' +
        '<div class="form-group"><label>Resultado</label><select class="form-control ind-res" onchange="tplLavOf_lerForm()"><option value="">Escolha</option><option value="CONFORME"' + (x.resultado === 'CONFORME' ? ' selected' : '') + '>Conforme</option><option value="NAO_CONFORME"' + (x.resultado === 'NAO_CONFORME' ? ' selected' : '') + '>Não conforme</option></select></div>' +
        '<div class="form-group"><label>Observação</label><input class="form-control ind-obs" type="text" maxlength="300" value="' + tplLavOf_esc(x.observacao) + '" onchange="tplLavOf_lerForm()"></div>' +
        '<div class="form-group" style="flex:0 0 auto;min-width:0;display:flex;align-items:flex-end"><button type="button" class="btn btn-secondary" onclick="tplLavOf_removerIndicador(' + k + ')">Remover</button></div></div>';
    }).join('') : '<p class="panel-subtitle" style="margin:0">Nenhum ensaio complementar registrado.</p>';
  }
  function tplLavOf_addIndicador() { tplLavOf_lerForm(); TPLLAVOF.form.indicadores.push({ tipo: '', ciclo: '', resultado: '', observacao: '' }); tplLavOf_desenharIndicadores(); }
  function tplLavOf_removerIndicador(k) { tplLavOf_lerForm(); TPLLAVOF.form.indicadores.splice(k, 1); tplLavOf_desenharIndicadores(); TPLLAVOF.rascunho = null; }

  function tplLavOf_rascunho() {
    if (!TPLLAVOF.ident) { tplLavOf_msg('tplLavOfMsgRascunho', 'error', 'Escolha o cliente, a unidade e o equipamento no início da tela.'); return; }
    tplLavOf_lerForm();
    var p = tplLavOf_payloadBase();
    p.redigirComIA = tplLavOf_el('tplLavOfIA').checked;
    tplLavOf_msg('tplLavOfMsgRascunho', '', '');
    tplLavOf_chamar('apiGerarRascunho', p, function (r) {
      TPLLAVOF.rascunho = r;
      var box = tplLavOf_el('tplLavOfRascunho');
      if (r.bloqueado) {
        box.innerHTML = '<div class="alert-box show error"><b>O relatório não pode seguir.</b> Resolva os itens abaixo e gere o rascunho de novo:</div><ul style="font-size:13px;line-height:1.55;padding-left:18px">' +
          r.travas.map(function (t) { return '<li><b>' + tplLavOf_esc(t.texto) + '</b> ' + tplLavOf_esc(t.comoCorrigir) + '</li>'; }).join('') + '</ul>';
        return;
      }
      var res = r.resumo;
      box.innerHTML = '<div class="qualif-situacao ' + (res.statusConsolidado === 'APROVADO' ? 'QUALIFICADO' : 'REPROVADO') + '">Resultado calculado: ' + (res.statusConsolidado === 'APROVADO' ? 'APROVADO' : 'REPROVADO') + (res.validadeAte ? ' · requalificação até ' + tplLavOf_esc(res.validadeAte) : '') + '</div>' +
        (res.naoConformidades.length ? '<ul style="font-size:13px;line-height:1.55;padding-left:18px">' + res.naoConformidades.map(function (n) { return '<li>' + tplLavOf_esc(n.origem + ': ' + n.texto) + '</li>'; }).join('') + '</ul>' : '') +
        (r.avisoIA ? '<div class="alert-box show warning">' + tplLavOf_esc(r.avisoIA) + '</div>' : '') +
        '<div class="form-row"><div class="form-group w-100"><label for="tplLavOfConclusao">Conclusão' + (r.origemTexto === 'IA' ? ' (redigida pelo assistente e conferida)' : ' (texto padrão)') + '</label><textarea id="tplLavOfConclusao" class="form-control" rows="7">' + tplLavOf_esc(r.textos.conclusao) + '</textarea></div></div>' +
        '<div class="form-row"><div class="form-group w-100"><label for="tplLavOfSimples">Em termos práticos (linguagem simples)</label><textarea id="tplLavOfSimples" class="form-control" rows="3">' + tplLavOf_esc(r.textos.conclusaoSimples) + '</textarea><span class="field-help">O resultado não muda pelo texto: um texto que contradiga o resultado calculado é recusado no envio.</span></div></div>' +
        '<div class="btn-container"><button type="button" class="btn btn-secondary" onclick="tplLavOf_previa()">Prévia do documento</button><button type="button" class="btn btn-primary" onclick="tplLavOf_enviar()">Enviar para aprovação</button></div>';
    }, function (e) { tplLavOf_msg('tplLavOfMsgRascunho', 'error', e); }, 'Calculando o resultado…');
  }

  function tplLavOf_textos() { return { conclusao: (tplLavOf_el('tplLavOfConclusao') || {}).value || '', conclusaoSimples: (tplLavOf_el('tplLavOfSimples') || {}).value || '' }; }

  function tplLavOf_abrirHtml(html) {
    var w = window.open('', '_blank');
    if (!w) { alert('O navegador bloqueou a nova aba. Permita janelas deste site e tente de novo.'); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }

  function tplLavOf_previa() {
    var p = tplLavOf_payloadBase(); p.textos = tplLavOf_textos();
    tplLavOf_chamar('apiPrevia', p, function (r) { tplLavOf_abrirHtml(r.html); }, function (e) { tplLavOf_msg('tplLavOfMsgRascunho', 'error', e); }, 'Montando a prévia…');
  }

  function tplLavOf_enviar() {
    if (!TPLLAVOF.rascunho || TPLLAVOF.rascunho.bloqueado) { tplLavOf_msg('tplLavOfMsgRascunho', 'error', 'Gere o rascunho antes de enviar (algo mudou desde o último rascunho).'); return; }
    var p = tplLavOf_payloadBase(); p.textos = tplLavOf_textos(); p.assinaturaContexto = TPLLAVOF.rascunho.assinaturaContexto;
    tplLavOf_chamar('apiEnviarParaAprovacao', p, function (r) {
      tplLavOf_msg('tplLavOfMsgRascunho', 'success', r.mensagem);
      TPLLAVOF.numero = ''; TPLLAVOF.rascunho = null;
      tplLavOf_el('tplLavOfRevisaoBox').classList.add('hidden');
      tplLavOf_listarAprovacoes(); tplLavOf_carregarEquipamento();
    }, function (e) { tplLavOf_msg('tplLavOfMsgRascunho', 'error', e); }, 'Enviando para aprovação…');
  }

  function tplLavOf_listarAprovacoes() {
    tplLavOf_chamar('apiListarAprovacoes', {}, function (r) {
      var box = tplLavOf_el('tplLavOfAprovacoes');
      if (!box) return;
      if (!r.itens.length) { box.innerHTML = '<p class="panel-subtitle" style="margin:0">' + (r.podeAprovar ? 'Nenhum relatório de qualificação aguardando a sua aprovação.' : 'Nenhum envio seu aguardando aprovação ou devolvido.') + '</p>'; return; }
      box.innerHTML = r.itens.map(function (i) {
        var dev = i.status === 'DEVOLVIDO';
        return '<div style="border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.55"><b>' + tplLavOf_esc(i.numero) + '</b> · ' + tplLavOf_esc(i.cliente) + ' · TAG ' + tplLavOf_esc(i.tag || '—') + ' · resultado calculado ' + tplLavOf_esc(String(i.resultado || '').toLowerCase()) +
          '<br><span style="color:var(--bc-text-3)">Enviado por ' + tplLavOf_esc(i.enviadoPor) + ' em ' + tplLavOf_esc(i.enviadoEm) + '</span>' +
          (dev ? '<div class="alert-box show warning" style="margin-top:6px">Devolvido: ' + tplLavOf_esc(i.motivoDevolucao) + '</div><div class="btn-container" style="margin-top:6px"><button type="button" class="btn btn-secondary" onclick="tplLavOf_abrirRegistro(\'' + tplLavOf_esc(i.id) + '\')">Abrir para corrigir</button></div>'
            : (r.podeAprovar ? '<div class="btn-container" style="margin-top:6px"><button type="button" class="btn btn-secondary" onclick="tplLavOf_preverAprov(\'' + tplLavOf_esc(i.id) + '\')">Prévia</button>' +
              '<label style="display:flex;gap:6px;align-items:center;font-size:12.5px"><input type="checkbox" id="tplLavOfConf_' + tplLavOf_esc(i.id) + '"> Conferi os dados, os critérios e a conclusão e aprovo a emissão</label>' +
              '<button type="button" class="btn btn-primary" onclick="tplLavOf_aprovar(\'' + tplLavOf_esc(i.id) + '\')">Aprovar e emitir</button></div>' +
              '<div class="form-row" style="margin-top:6px"><div class="form-group"><input class="form-control" type="text" id="tplLavOfDev_' + tplLavOf_esc(i.id) + '" maxlength="300" placeholder="Motivo da devolução (ao menos 10 caracteres)"></div><div class="form-group" style="flex:0 0 auto;min-width:0"><button type="button" class="btn btn-secondary" onclick="tplLavOf_devolver(\'' + tplLavOf_esc(i.id) + '\')">Devolver ao técnico</button></div></div>'
              : '<p class="field-help">Aguardando a conferência do responsável técnico.</p>')) + '</div>';
      }).join('');
    }, function (e) { tplLavOf_msg('tplLavOfMsgAprov', 'error', e); });
  }

  function tplLavOf_preverAprov(id) { tplLavOf_chamar('apiPreverAprovacao', { id: id }, function (r) { tplLavOf_abrirHtml(r.html); }, function (e) { tplLavOf_msg('tplLavOfMsgAprov', 'error', e); }, 'Montando a prévia…'); }

  function tplLavOf_aprovar(id) {
    var cb = tplLavOf_el('tplLavOfConf_' + id);
    if (!cb || !cb.checked) { tplLavOf_msg('tplLavOfMsgAprov', 'error', 'Marque "Conferi os dados, os critérios e a conclusão e aprovo a emissão" antes de aprovar.'); return; }
    tplLavOf_chamar('apiAprovarEmitir', { id: id, confirmacaoRevisao: true }, function (r) {
      tplLavOf_msg('tplLavOfMsgAprov', r.avisoArquivo ? 'warning' : 'success', r.mensagem + (r.avisoArquivo ? ' ' + r.avisoArquivo : ''));
      tplLavOf_listarAprovacoes();
      if (TPLLAVOF.ident) tplLavOf_carregarEquipamento();
      if (r.pdfId && typeof SGO_EnviarDoc !== 'undefined' && SGO_EnviarDoc && confirm('Relatório emitido. Deseja enviar ao cliente agora (e-mail ou WhatsApp)?')) {
        SGO_EnviarDoc.abrir({ arquivoId: r.pdfId, htmlId: r.htmlId, dica: { clienteId: r.clienteId, numero: r.numero, titulo: 'Relatório de qualificação ' + r.numero } });
      }
    }, function (e) { tplLavOf_msg('tplLavOfMsgAprov', 'error', e); }, 'Emitindo o relatório…');
  }

  function tplLavOf_devolver(id) {
    var m = (tplLavOf_el('tplLavOfDev_' + id) || {}).value || '';
    tplLavOf_chamar('apiDevolver', { id: id, motivo: m }, function (r) { tplLavOf_msg('tplLavOfMsgAprov', 'success', r.mensagem); tplLavOf_listarAprovacoes(); }, function (e) { tplLavOf_msg('tplLavOfMsgAprov', 'error', e); }, 'Devolvendo…');
  }

  /** Envio devolvido (corrigir) ou relatório emitido (nova revisão): recarrega o formulário. */
  function tplLavOf_abrirRegistro(id) {
    tplLavOf_chamar('apiAbrir', { id: id }, function (r) {
      var d = r.dados || {};
      TPLLAVOF.form = Object.assign(tplLavOf_formInicial(TPLLAVOF.sit), { etapas: d.etapas || {}, motivo: d.motivo || '', periodicidadeMeses: d.periodicidadeMeses || TPLLAVOF.sit.periodicidadePadrao,
        responsavelCliente: d.responsavelCliente || '', dataQi: d.dataQi || '', qi: Object.assign(tplLavOf_formInicial(TPLLAVOF.sit).qi, d.qi || {}), indicadores: d.indicadores || [], observacoes: d.observacoes || '', ciclos: d.ciclos || [] });
      TPLLAVOF.numero = r.modo === 'REVISAR' ? (d.numero || '') : (d.numero || '');
      TPLLAVOF.rascunho = null;
      tplLavOf_preencherForm();
      var rev = tplLavOf_el('tplLavOfRevisaoBox');
      rev.classList.toggle('hidden', !TPLLAVOF.numero);
      if (TPLLAVOF.numero) tplLavOf_el('tplLavOfRevisaoTxt').textContent = 'Nova revisão do relatório ' + TPLLAVOF.numero + '. A revisão emitida antes continua guardada e passa a constar como substituída.';
      tplLavOf_msg('tplLavOfMsgGeral', 'info', r.mensagem);
      TPLLAVOF.vinc.definir({ clienteId: d.clienteId, unidadeId: d.unidadeId, equipamentoId: d.equipamentoId, cliente: '' });
      try { tplLavOf_el('tplLavOfVinculo').scrollIntoView({ behavior: 'smooth' }); } catch (e) {}
    }, null, 'Carregando…');
  }

  function tplLavOf_desenharEmitidos() {
    var l = (TPLLAVOF.eq && TPLLAVOF.eq.oficiais) || [];
    var box = tplLavOf_el('tplLavOfEmitidos');
    var emit = l.filter(function (r) { return r.status === 'EMITIDO' || r.status === 'SUBSTITUIDO'; });
    box.innerHTML = emit.length ? emit.map(function (r) {
      var vig = r.status === 'EMITIDO';
      return '<div style="border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.55;' + (vig ? '' : 'opacity:.75') + '"><b>' + tplLavOf_esc(r.numero) + '</b> · revisão ' + tplLavOf_esc(r.revisao) + ' · ' + tplLavOf_esc(String(r.resultado || '').toLowerCase()) +
        (r.validadeAte && vig ? ' · requalificação até ' + tplLavOf_esc(r.validadeAte) : '') + '<br><span style="color:var(--bc-text-3)">' + (vig ? 'Vigente' : 'Substituída por revisão posterior') + ' · aprovado por ' + tplLavOf_esc(r.aprovadoPor || '—') + ' em ' + tplLavOf_esc(String(r.aprovadoEm || '').slice(0, 16)) + '</span>' +
        '<div class="btn-container" style="margin-top:6px">' + (r.pdfUrl ? '<a class="btn btn-secondary" href="' + tplLavOf_esc(r.pdfUrl) + '" target="_blank" rel="noopener">Abrir PDF</a>' : '') + (r.htmlUrl ? '<a class="btn btn-secondary" href="' + tplLavOf_esc(r.htmlUrl) + '" target="_blank" rel="noopener">Abrir para imprimir</a>' : '') +
        (vig && r.pdfId ? '<button type="button" class="btn btn-secondary" onclick="tplLavOf_enviarCliente(\'' + tplLavOf_esc(r.pdfId) + '\',\'' + tplLavOf_esc(r.htmlId) + '\',\'' + tplLavOf_esc(r.numero) + '\')">Enviar ao cliente</button>' : '') +
        (vig ? '<button type="button" class="btn btn-secondary" onclick="tplLavOf_abrirRegistro(\'' + tplLavOf_esc(r.id) + '\')">Nova revisão</button>' : '') + '</div></div>';
    }).join('') : '<p class="panel-subtitle" style="margin:0">Nenhum relatório de qualificação emitido para este equipamento.</p>';
  }

  function tplLavOf_enviarCliente(pdfId, htmlId, numero) {
    if (typeof SGO_EnviarDoc === 'undefined' || !SGO_EnviarDoc) { alert('O envio ao cliente não está disponível nesta tela. Use o Arquivo de documentos.'); return; }
    SGO_EnviarDoc.abrir({ arquivoId: pdfId, htmlId: htmlId, dica: { clienteId: (TPLLAVOF.ident || {}).clienteId, numero: numero, titulo: 'Relatório de qualificação ' + numero } });
  }

  function tplLavOf_definirModelo() {
    var m = tplLavOf_el('tplLavOfModelo').value;
    if (m === 'ANTERIOR' && !confirm('Reativar o modelo anterior? A aba volta a mostrar o formulário antigo (campos digitados e resultado escolhido pelo técnico) até o Administrador escolher o modelo novo de novo.')) return;
    tplLavOf_chamar('apiDefinirModelo', { modelo: m }, function (r) { alert(r.mensagem); renderTplLavadora_(); }, null, 'Aplicando…');
  }

  function renderTplLavadora_() {
    const container = document.getElementById('tplLavadoraContainer');
    if (!container) return;
    container.innerHTML = '<div class="panel">Carregando o relatório oficial…</div>';
    tplLavOf_chamarServidor_('apiSituacao', {}, function (sit) {
      try {
        if (sit.modelo === 'ANTERIOR') {
          tplLavadora_renderAnterior_();
          var aviso = '<div class="alert-box show warning" style="margin-bottom:12px">Modelo anterior reativado pelo Administrador. O documento sai com os campos digitados abaixo, sem o resultado calculado dos ensaios.' +
            (sit.podeAlterarModelo ? ' <button type="button" class="btn btn-secondary" style="margin-left:8px" onclick="tplLavOf_voltarNovo()">Voltar ao modelo novo</button>' : '') + '</div>';
          container.insertAdjacentHTML('afterbegin', aviso);
          return;
        }
        tplLavOf_render(container, sit);
      } catch (e) {
        console.error('renderTplLavadora_ falhou:', e);
        container.innerHTML = '<div style="padding:24px;color:var(--bc-danger);background:var(--bc-danger-bg);border:1px solid var(--bc-danger-line);border-radius:6px;">Não foi possível abrir esta tela. Recarregue a página (F5); se persistir, avise o administrador.</div>';
      }
    }, function (e) {
      container.innerHTML = '<div class="alert-box show error">' + tplLavOf_esc(e) + ' <button type="button" class="btn btn-secondary" onclick="renderTplLavadora_()">Tentar de novo</button></div>';
    });
  }

  function tplLavOf_voltarNovo() {
    tplLavOf_chamarServidor_('apiDefinirModelo', { modelo: 'NOVO' }, function () { renderTplLavadora_(); }, function (e) { alert(e); });
  }
</script>

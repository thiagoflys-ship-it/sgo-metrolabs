<script>
  let tplAuvo_carregado_ = false;

  function renderTplAuvo_() {
    const container = document.getElementById('tplAuvoContainer');
    if (!container) return;

    if (tplAuvo_carregado_) {
      if (typeof tplAuvo_renderReal_ === 'function') tplAuvo_renderReal_();
      tplAuvo_montarAcervo_();
      return;
    }

    container.innerHTML = '<p style="padding:20px;color:var(--bc-text-3);">Carregando integração Auvo...</p>';

    google.script.run
      .withSuccessHandler(function(conteudoBruto) {
        try {
          const styleMatch = conteudoBruto.match(/<style>([\s\S]*?)<\/style>/);
          const scriptMatch = conteudoBruto.match(/<script>([\s\S]*?)<\/script>/);

          if (styleMatch) {
            const styleEl = document.createElement('style');
            styleEl.textContent = styleMatch[1];
            document.head.appendChild(styleEl);
          }

          if (scriptMatch) {
            window.eval(scriptMatch[1]);
          }

          tplAuvo_carregado_ = true;

          if (typeof tplAuvo_renderReal_ === 'function') {
            tplAuvo_renderReal_();
            tplAuvo_montarAcervo_();
          } else {
            container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Falha ao inicializar o módulo (função de renderização não encontrada).</p>';
          }
        } catch (e) {
          console.error('tplAuvo: erro ao montar o módulo:', e);
          container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Erro ao montar o módulo: ' + (e && e.message ? e.message : e) + '</p>';
        }
      })
      .withFailureHandler(function(err) {
        console.error('tplAuvo: falha ao buscar o módulo:', err);
        container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Falha ao carregar o módulo: ' + ((err && err.message) ? err.message : err) + '</p>';
      })
      .Auvo_obterConteudoModulo();
  }

  // 21/10/2026: "Acervo do Auvo" (etapa 0 da Assistência técnica, SGO_AuvoAcervo.js). Só Administrador e
  // Diretoria; o servidor confere de novo e devolve vazio para os outros perfis.
  let acvAuvo_carregado_ = false;
  function tplAuvo_montarAcervo_() {
    try {
      const perfil = (typeof USER_CONTEXT !== 'undefined' && USER_CONTEXT && USER_CONTEXT.perfil) ? String(USER_CONTEXT.perfil).toUpperCase() : '';
      if (['ADMIN', 'DIRETORIA'].indexOf(perfil) === -1) return;
      if (acvAuvo_carregado_) { if (typeof AuvoAcervo_montarNaTela_ === 'function') AuvoAcervo_montarNaTela_(); return; }
      google.script.run
        .withSuccessHandler(function (bruto) {
          if (!bruto) return;
          try {
            const estilo = bruto.match(/<style>([\s\S]*?)<\/style>/);
            const codigo = bruto.match(/<script>([\s\S]*?)<\/script>/);
            if (estilo) { const el = document.createElement('style'); el.textContent = estilo[1]; document.head.appendChild(el); }
            if (codigo) window.eval(codigo[1]);
            acvAuvo_carregado_ = true;
            if (typeof AuvoAcervo_montarNaTela_ === 'function') AuvoAcervo_montarNaTela_();
          } catch (e) { console.error('Acervo do Auvo: erro ao montar:', e); }
        })
        .withFailureHandler(function (err) { console.error('Acervo do Auvo: falha ao carregar:', err); })
        .AuvoAcervo_obterConteudo(typeof SGO_getSessionId === 'function' ? SGO_getSessionId() : '');
    } catch (e) { console.error('Acervo do Auvo:', e); }
  }
</script>

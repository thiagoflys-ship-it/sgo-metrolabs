<script>
  // Carregador leve do módulo Planejamento CME: o conteúdo pesado (CSS + HTML
  // + JS do formulário) fica guardado como string JS comum em
  // SGO_PlanCME_ConteudoModulo.js (não num arquivo .html — o HtmlService
  // distorce/trunca conteúdo grande lido de arquivos .html) e NÃO é incluído
  // no bundle inicial da página — só é buscado do servidor na primeira vez
  // que o usuário abre este módulo. Mesmo padrão de JS_CadeiaFrioRelatorio.html.
  let tplPlanCME_carregado_ = false;

  function renderTplPlanCME_() {
    const container = document.getElementById('tplPlanCMEContainer');
    if (!container) return;

    if (tplPlanCME_carregado_) {
      if (typeof tplPlanCME_renderReal_ === 'function') tplPlanCME_renderReal_();
      return;
    }

    container.innerHTML = '<p style="padding:20px;color:#94a3b8;">Carregando módulo Planejamento CME...</p>';

    google.script.run
      .withSuccessHandler(function(conteudoBruto) {
        try {
          console.log('tplPlanCME: conteúdo recebido, tamanho =', (conteudoBruto || '').length);

          const styleMatch = conteudoBruto.match(/<style>([\s\S]*?)<\/style>/);
          const scriptMatch = conteudoBruto.match(/<script>([\s\S]*?)<\/script>/);

          if (!styleMatch) console.warn('tplPlanCME: <style> não encontrado no conteúdo recebido.');
          if (!scriptMatch) console.warn('tplPlanCME: <script> não encontrado no conteúdo recebido.');

          if (styleMatch) {
            const styleEl = document.createElement('style');
            styleEl.textContent = styleMatch[1];
            document.head.appendChild(styleEl);
          }

          if (scriptMatch) {
            // window.eval (eval indireto) roda no escopo global de forma
            // confiável, registrando as funções tplPlanCME_* de verdade
            // (incluindo tplPlanCME_renderReal_).
            window.eval(scriptMatch[1]);
          }

          tplPlanCME_carregado_ = true;

          if (typeof tplPlanCME_renderReal_ === 'function') {
            tplPlanCME_renderReal_();
          } else {
            console.error('tplPlanCME: tplPlanCME_renderReal_ não foi definida após o eval.');
            container.innerHTML = '<p style="padding:20px;color:#f87171;">Falha ao inicializar o módulo (função de renderização não encontrada). Veja o Console (F12) para detalhes.</p>';
          }
        } catch (e) {
          console.error('tplPlanCME: erro ao montar o módulo:', e);
          container.innerHTML = '<p style="padding:20px;color:#f87171;">Erro ao montar o módulo: ' + (e && e.message ? e.message : e) + '</p>';
        }
      })
      .withFailureHandler(function(err) {
        console.error('tplPlanCME: falha ao buscar o módulo:', err);
        container.innerHTML = '<p style="padding:20px;color:#f87171;">Falha ao carregar o módulo Planejamento CME: ' + ((err && err.message) ? err.message : err) + '</p>';
      })
      .PlanCME_obterConteudoModulo();
  }
</script>

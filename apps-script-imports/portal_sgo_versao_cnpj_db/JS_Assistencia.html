<style>
  /* ASSISTÊNCIA TÉCNICA NATIVA (21/10/2026) — servidor: SGO_Assistencia_*.js (uma porta: Assistencia_api). Celular sem rolagem lateral. */
  .at-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }

  .at-tab.active { background: var(--text-strong, #1f2a24); color: var(--card, #fff); border-color: transparent; }

  .at-faixa.aviso { border-left-color: var(--warning); } .at-faixa.erro { border-left-color: var(--danger); background: var(--danger-bg); } .at-faixa.ok { border-left-color: var(--success); }
  .at-lista { display: flex; flex-direction: column; gap: 10px; }
  .at-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
  .at-card.p1 { border-left-color: var(--danger); } .at-card.p2 { border-left-color: var(--warning); } .at-card.fim { border-left-color: var(--muted); opacity: .85; }
  .at-card.clicavel { cursor: pointer; } .at-card.clicavel:hover { border-color: var(--info, #1f5fa8); }
  .at-card-tit { font-weight: 700; font-size: 14px; margin: 0 0 4px; color: var(--text-strong, var(--text)); }
  .at-meta { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .at-txt { font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
  .at-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .at-selo.vermelho { color: var(--danger); background: var(--danger-bg); } .at-selo.laranja { color: var(--warning); background: var(--warning-bg); }
  .at-selo.verde { color: var(--success); background: var(--success-bg); } .at-selo.azul { color: var(--info, #1f5fa8); } .at-selo.cinza { color: var(--muted); }
  .at-filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 6px 0 12px; }
  .at-filtros label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .at-filtros select, .at-filtros input { min-height: 40px; max-width: 100%; }
  .at-caixa { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }

  .at-grade4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 12px; }
  .at-campo { margin-bottom: 10px; min-width: 0; }

  .at-campo textarea { min-height: 64px; resize: vertical; }
  .at-ajuda-campo { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .at-det { display: grid; grid-template-columns: 170px 1fr; gap: 5px 10px; font-size: 12.5px; margin: 0 0 12px; }
  .at-det dt { color: var(--muted); font-weight: 700; } .at-det dd { margin: 0; overflow-wrap: anywhere; }
  .at-hist { border-left: 2px solid var(--border); margin-left: 6px; padding-left: 12px; }
  .at-hist div { margin-bottom: 9px; font-size: 12.5px; } .at-hist .q { color: var(--muted); font-size: 11.5px; }
  .at-vazio { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; }
  .at-sec { margin: 14px 0 6px; font-size: 13px; font-weight: 800; color: var(--text-strong, var(--text)); }
  .at-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .at-tabela th, .at-tabela td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; vertical-align: top; }
  .at-tabela td.n, .at-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .at-check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; margin: 4px 0; }
  .at-check input { min-height: 0; width: auto; margin-top: 3px; }
  .at-radios { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .at-radios label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; background: var(--card); }
  .at-radios input { width: auto; min-height: 0; }
  .at-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .at-kpi { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--info, #1f5fa8); border-radius: 8px; padding: 10px 12px; }
  .at-kpi .v { display: block; font-size: 20px; font-weight: 800; color: var(--text-strong, var(--text)); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .at-kpi .r { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .at-kpi.ok { border-top-color: var(--success); } .at-kpi.aviso { border-top-color: var(--warning); } .at-kpi.critico { border-top-color: var(--danger); }
  .at-faltas { margin: 6px 0 10px; padding-left: 18px; font-size: 12.5px; color: var(--danger); }
  .at-pergunta { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; background: var(--bg); }
  .at-pergunta .tp { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .at-pergunta .tp .obr { color: var(--danger); margin-left: 4px; }
  .at-fotos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .at-fotos a, .at-fotos span { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; background: var(--card); }
  .at-assinatura { border: 1px dashed var(--border); border-radius: 8px; background: #fff; width: 100%; max-width: 520px; height: 170px; touch-action: none; display: block; }
  .at-agenda { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  .at-agenda th, .at-agenda td { border: 1px solid var(--border); padding: 5px; vertical-align: top; }
  .at-agenda th { background: var(--bg); font-size: 11.5px; }
  .at-agenda .tec { width: 150px; font-weight: 700; }
  .at-item { border-radius: 6px; padding: 4px 6px; margin-bottom: 4px; font-size: 11.5px; border-left: 3px solid var(--info, #1f5fa8); background: var(--card); cursor: pointer; overflow-wrap: anywhere; }
  .at-item.auvo { border-left-color: var(--muted); cursor: default; } .at-item.aus { border-left-color: var(--warning); cursor: default; } .at-item.fim { opacity: .7; }
  .at-etapas { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
  .at-etapas span { flex: 1 1 80px; text-align: center; font-size: 11px; padding: 4px; border-radius: 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .at-etapas span.feita { background: var(--success-bg); color: var(--success); border-color: var(--success); font-weight: 700; }
  .at-wrap-tabela { overflow-x: auto; max-width: 100%; }
  @media (max-width: 900px) {
    .at-grade2, .at-grade3 { grid-template-columns: 1fr; }
    .at-grade4, .at-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .at-det { grid-template-columns: 1fr; } .at-det dt { margin-top: 6px; }
    .at-filtros > div { flex: 1 1 140px; }
    .at-tabela thead { display: none; }
    .at-tabela, .at-tabela tbody, .at-tabela tr, .at-tabela td { display: block; width: 100%; box-sizing: border-box; }
    .at-tabela tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 6px 8px; background: var(--card); }
    .at-tabela td { border: 0; padding: 3px 0; text-align: left !important; }
    .at-tabela td[data-r]::before { content: attr(data-r) ": "; color: var(--muted); font-weight: 700; }
    .at-agenda .tec { width: 90px; }
  }
</style>

<script>
  // ==========================================================
  // ASSISTÊNCIA TÉCNICA NATIVA DO SGO+ (21/10/2026)
  // Telas (abrir(mod)): assistencia (Chamados), assistencia_abrir, assistencia_os (O.S.), assistencia_agenda,
  // assistencia_solicitacoes, assistencia_casos, assistencia_indicadores, assistencia_regras, assistencia_transicao e,
  // para o cliente, assistencia_portal (Meus chamados). Uma chamada no servidor: Assistencia_api(sessionId, acao, dados).
  // O servidor confere o perfil e o técnico responsável em toda chamada. A tela não se redesenha sozinha: recarrega
  // depois de cada ação ou em "Atualizar" (nunca apaga o que está sendo digitado).
  // ==========================================================
  var AT = { ini: null, mod: "", filtro: { grupo: "ABERTOS", busca: "", prioridade: "" }, osFiltro: "ABERTAS", agenda: { inicio: "", dias: 1 }, comp: "" };
  var AT_MODS = { assistencia: "Chamados", assistencia_abrir: "Abrir chamado", assistencia_os: "Ordens de serviço", assistencia_agenda: "Agenda dos técnicos", assistencia_solicitacoes: "Solicitações dos clientes",
    assistencia_casos: "Reclamações", assistencia_indicadores: "Indicadores da assistência", assistencia_regras: "Regras da assistência", assistencia_transicao: "Transição do Auvo", assistencia_portal: "Meus chamados" };
  var AT_COR_SIT = { ABERTO: "azul", EM_TRIAGEM: "azul", RESOLVIDO_REMOTO: "verde", AGUARDANDO_ORCAMENTO: "laranja", AGUARDANDO_PECA: "laranja", PLANEJADO: "laranja", AGENDADO: "azul", EM_DESLOCAMENTO: "azul",
    NO_LOCAL: "azul", EM_EXECUCAO: "azul", PAUSADO: "laranja", AGUARDANDO_CLIENTE: "laranja", DOC_PENDENTE: "vermelho", ENCERRADO: "cinza", CANCELADO: "cinza",
    AGENDADA: "azul", PAUSADA: "laranja", ENCERRADA: "cinza", CANCELADA: "cinza" };
  var AT_COR_SLA = { ESTOURADO: "vermelho", EM_RISCO: "laranja", EM_DIA: "verde", CUMPRIDO: "verde", FORA_DO_PRAZO: "vermelho", PAUSADO: "cinza" };

  function At_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function At_$_(id) { return document.getElementById(id); }
  function At_chamar_(acao, dados, ok, erro, opcoes) {
    var o = opcoes || {};
    if (o.carregando) SGO_iniciarCarregamento_(o.carregando);
    var fim = function () { if (o.carregando) SGO_finalizarCarregamento_(); };
    var falhou = function (m) { fim(); if (erro) erro(m); else alert(m); };
    google.script.run.withSuccessHandler(function (r) {
      if (!r || (!r.ok && !r.duplicado && !r.conflito)) { falhou((r && r.message) || "Não foi possível concluir: o servidor não respondeu como esperado. Tente de novo."); return; }
      fim();
      try { if (ok) ok(r); } catch (e) { console.error("Assistência " + acao + ":", e); alert("Não foi possível mostrar o resultado na tela: " + (e && e.message ? e.message : e) + ". Atualize a página (F5) e tente de novo."); }
    }).withFailureHandler(function (e) { falhou("Não foi possível falar com o servidor (" + ((e && e.message) || e) + "). Verifique a conexão e tente de novo; nada foi alterado."); })
      .Assistencia_api(SGO_getSessionId(), acao, dados || {});
  }
  function At_msg_(onde, texto, tipo) { var el = typeof onde === "string" ? At_$_(onde) : onde; if (el) el.innerHTML = texto ? '<div class="at-faixa ' + (tipo || "erro") + '">' + At_esc_(texto) + "</div>" : ""; }
  function At_campo_(rotulo, html, ajuda) { return '<div class="at-campo"><label>' + At_esc_(rotulo) + "</label>" + html + (ajuda ? '<div class="at-ajuda-campo">' + At_esc_(ajuda) + "</div>" : "") + "</div>"; }
  function At_opcoes_(lista, atual, vazio) {
    return (vazio !== undefined ? '<option value="">' + At_esc_(vazio) + "</option>" : "") + lista.map(function (o) { var v = typeof o === "object" ? o.v : o, t = typeof o === "object" ? o.t : o; return '<option value="' + At_esc_(v) + '"' + (String(v) === String(atual === undefined || atual === null ? "" : atual) ? " selected" : "") + ">" + At_esc_(t) + "</option>"; }).join("");
  }
  function At_mapaOpcoes_(m) { return Object.keys(m || {}).map(function (k) { return { v: k, t: m[k] }; }); }
  function At_selo_(cor, txt) { return '<span class="at-selo ' + (cor || "cinza") + '">' + At_esc_(txt) + "</span>"; }
  function At_cabecalho_(titulo, sub, botoes) {
    return '<div class="module-header"><div class="module-header-left"><h2 class="content-title">' + At_esc_(titulo) + '</h2><p class="content-subtitle">' + At_esc_(sub) + "</p></div>" +
      '<div class="module-header-right" style="display:flex;gap:8px;flex-wrap:wrap">' + (botoes || "") + "</div></div>";
  }
  function At_modal_(titulo, corpo, rodape, largura) {
    var ov = document.createElement("div");
    ov.className = "atv-overlay";
    ov.innerHTML = '<div class="atv-modal" style="max-width:' + (largura || 600) + 'px"><div class="atv-modal-cab"><h3>' + At_esc_(titulo) + '</h3><button type="button" class="atv-fechar" aria-label="Fechar">&times;</button></div>' +
      '<div class="atv-modal-corpo">' + corpo + '</div>' + (rodape ? '<div class="atv-modal-rod">' + rodape + '</div>' : '') + '</div>';
    ov.querySelector(".atv-fechar").onclick = function () { ov.remove(); };
    document.body.appendChild(ov);
    return ov;
  }
  function At_gaveta_(titulo, corpo) {
    var antiga = At_$_("atGaveta"); if (antiga) antiga.remove();
    var g = document.createElement("div");
    g.id = "atGaveta"; g.className = "atv-overlay"; g.style.justifyContent = "flex-end"; g.style.padding = "0";
    g.innerHTML = '<div class="atv-drawer" role="dialog" aria-label="' + At_esc_(titulo) + '" style="max-width:760px;width:100%"><div class="atv-drawer-cab"><h3>' + At_esc_(titulo) + '</h3><button type="button" class="btn-secondary" data-at-fechar>Fechar</button></div><div class="atv-drawer-corpo" id="atGavetaCorpo">' + corpo + '</div></div>';
    g.querySelector("[data-at-fechar]").onclick = function () { g.remove(); };
    g.addEventListener("click", function (e) { if (e.target === g) g.remove(); });
    document.body.appendChild(g);
    return g;
  }
  function At_pedirTexto_(titulo, explicacao, rotulo, minimo, ok, botao) {
    var ov = At_modal_(titulo, '<p class="at-txt">' + At_esc_(explicacao) + "</p>" + At_campo_(rotulo, '<textarea id="atTxtPedido" maxlength="1000"></textarea>', minimo ? "Pelo menos " + minimo + " letras." : "") + '<div id="atTxtMsg"></div>',
      '<button type="button" class="btn-secondary" data-x>Voltar</button><button type="button" class="btn-primary" data-ok>' + At_esc_(botao || "Confirmar") + "</button>");
    ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
    ov.querySelector("[data-ok]").onclick = function () {
      var t = At_$_("atTxtPedido").value.trim();
      if (minimo && t.length < minimo) { At_msg_("atTxtMsg", "Escreva pelo menos " + minimo + " letras.", "aviso"); return; }
      ok(t, ov);
    };
  }
  /** Lê arquivos: fotos reduzidas no navegador (até 1600 px, JPEG ~300 KB); outros como estão. */
  function At_lerArquivos_(input, cb, soImagem) {
    var fs = Array.prototype.slice.call((input && input.files) || []);
    if (!fs.length) { cb([]); return; }
    var saida = [], falta = fs.length;
    fs.forEach(function (f, i) {
      var fim = function (obj) { saida[i] = obj; if (--falta === 0) cb(saida.filter(Boolean)); };
      if (f.size > 25 * 1048576) { alert('O arquivo "' + f.name + '" passa de 25 MB e não foi anexado. Reduza e tente de novo.'); fim(null); return; }
      var rd = new FileReader();
      rd.onload = function () {
        var dataUrl = String(rd.result || "");
        if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)) {
          var img = new Image();
          img.onload = function () {
            var esc = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
            cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            fim({ nome: f.name.replace(/\.[^.]+$/, "") + ".jpg", tipo: "image/jpeg", base64: cv.toDataURL("image/jpeg", 0.78).split(",")[1] });
          };
          img.onerror = function () { fim({ nome: f.name, tipo: f.type, base64: dataUrl.split(",")[1] }); };
          img.src = dataUrl;
        } else if (soImagem) { alert('O arquivo "' + f.name + '" não é uma foto (JPG ou PNG) e não foi anexado.'); fim(null); }
        else fim({ nome: f.name, tipo: f.type || "application/octet-stream", base64: dataUrl.split(",")[1] });
      };
      rd.onerror = function () { fim(null); };
      rd.readAsDataURL(f);
    });
  }
  function At_idLocal_() { return "tela-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }
  function At_abrirHtml_(html) {
    var w = window.open("", "_blank");
    if (!w) { alert("O navegador bloqueou a janela do documento. Libere as janelas do SGO+ e tente de novo."); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }
  function At_seloSla_(sla) { return sla && sla.estado && sla.estado !== "SEM_PRAZO" ? At_selo_(AT_COR_SLA[sla.estado] || "cinza", sla.texto) : ""; }

  // ---------------- casca: menu ----------------
  function Assistencia_iniciar_() {
    var p = USER_CONTEXT ? String(USER_CONTEXT.perfil || "").toUpperCase() : "";
    if (!p) { Assistencia_mostrarMenu_(null); return; }
    At_chamar_("acesso", {}, function (r) { Assistencia_mostrarMenu_(r); }, function () { Assistencia_mostrarMenu_(null); });
  }
  function Assistencia_parar_() { AT.ini = null; Assistencia_mostrarMenu_(null); }
  function Assistencia_mostrarMenu_(r) {
    var grupo = At_$_("menu-secao-assistencia");
    if (grupo) grupo.style.display = r ? "" : "none";
    document.querySelectorAll("#menu-grupo-itens-assistencia .menu-btn").forEach(function (b) {
      var m = b.getAttribute("data-mod"), ver = !!r && !r.cliente;
      if (m === "assistencia_portal") ver = !!(r && r.cliente);
      if (m === "assistencia_regras") ver = !!(r && !r.cliente);
      if (["assistencia_transicao", "assistencia_indicadores"].indexOf(m) >= 0) ver = !!(r && r.gestao);
      if (m === "assistencia_solicitacoes" || m === "assistencia_casos") ver = !!(r && !r.cliente && r.nivel !== "TECNICO");
      b.style.display = ver ? "" : "none";
    });
    if (typeof Menu_iniciar_ === "function") { try { Menu_iniciar_(); } catch (e) {} }
    if (r && window.SGO_MODULO_ATUAL === "mobile_home" && typeof renderMobileHome_ === "function") { try { renderMobileHome_(); } catch (e) {} }
  }
  function Assistencia_garantirInicio_(cb) {
    if (AT.ini) { cb(AT.ini); return; }
    At_chamar_("iniciar", {}, function (r) { AT.ini = r; cb(r); });
  }
  /** Ponto de entrada de abrir(mod). */
  function Assistencia_render_(mod, alvo) {
    var div = At_$_("conteudo");
    if (!div) return;
    AT.mod = mod;
    if (typeof ehMobileModo_ === "function" && ehMobileModo_()) atualizarTituloMobile_(AT_MODS[mod] || "Assistência técnica");
    div.innerHTML = '<div class="module-shell"><div class="at-vazio">Carregando a Assistência técnica…</div></div>';
    Assistencia_garantirInicio_(function (ini) {
      if (ini.cliente && mod !== "assistencia_portal") mod = "assistencia_portal";
      var mapa = { assistencia: At_renderChamados_, assistencia_abrir: At_renderAbrir_, assistencia_os: At_renderOs_, assistencia_agenda: At_renderAgenda_, assistencia_solicitacoes: At_renderSolicitacoes_,
        assistencia_casos: At_renderCasos_, assistencia_indicadores: At_renderIndicadores_, assistencia_regras: At_renderRegras_, assistencia_transicao: At_renderTransicao_, assistencia_portal: At_renderPortal_ };
      var fn = mapa[mod] || At_renderChamados_;
      fn(div, alvo || {});
      if (ini.avisos && ini.avisos.some(function (a) { return a.novo; })) At_chamar_("avisosLidos", {}, function () { ini.avisos.forEach(function (a) { a.novo = false; }); }, function () {});
    });
  }
  /** Atalho vindo do Início, da Caixa de decisões ou de um aviso: { tipo:'assistencia', mod, id }. */
  function Assistencia_irPara_(acao) {
    var mod = (acao && acao.mod) || "assistencia";
    abrir(mod);
    if (acao && acao.id) setTimeout(function () {
      if (mod === "assistencia_os") At_abrirOs_(acao.id);
      else if (mod === "assistencia" ) At_abrirChamado_(acao.id);
    }, 800);
  }
  /** "Abrir chamado" a partir de uma mensagem do e-mail integrado. m: { assunto, de, texto, id } */
  function Assistencia_abrirDeEmail_(m) {

      (c.proximaAcao ? '<div class="at-faixa">Próximo passo: ' + At_esc_(c.proximaAcao) + '</div>' : '') +
      dl([["Cliente", c.clienteNome + (c.unidadeNome ? " · " + c.unidadeNome : "")], ["Equipamento", c.equipamentoTexto + (c.equipNaoIdentificado ? " (não identificado no cadastro)" : "")], ["Problema relatado", c.sintoma],
        ["Solicitante", c.solicitante + (c.contato ? " · " + c.contato : "")], ["Aberto em", c.abertoEm + " por " + c.abertoPor + " (" + c.canalNome + ")"], ["Parada", c.paradaNome], ["Prazo", c.sla && c.sla.texto ? c.sla.texto + " · " + c.slaFonte : ""],

        ["Orientação remota", c.orientacaoRemota], ["Orçamento", c.orcamentoDescricao], ["Peça", c.pecaDescricao + (c.requisicaoNumero ? " · pedido de compra " + c.requisicaoNumero : "")], ["Reincidência", c.reincidente ? "Sim, do chamado " + c.reincidenciaDe : ""],
        ["Encerrado em", c.encerradoEm], ["Cancelado", c.canceladoMotivo]]);

    if (c.podeAgendar) h += At_formAgendar_(c, r);

    if (r.orcamentos && r.orcamentos.length) h += At_secaoOrcamentos_(r);
    if (r.os) h += '<div class="at-sec">Ordem de serviço</div><div class="at-card clicavel" id="atAbrirOs"><p class="at-card-tit">' + At_esc_(r.os.numero) + ' · ' + At_esc_(r.os.situacaoNome) + '</p><p class="at-meta">' + At_esc_(r.os.tipo.nome || "") + ' · ' + At_esc_(r.os.tecnicoNome) + ' · ' + At_esc_(r.os.agendadoPara) + '</p>' +
      (r.os.faltas && r.os.faltas.length ? '<p class="at-txt">Falta: ' + At_esc_(r.os.faltas.join("; ")) + '</p>' : '') + (r.os.relatorio ? '<p class="at-txt"><a href="' + At_esc_(r.os.relatorio.url) + '" target="_blank" rel="noopener">Relatório A4 v' + At_esc_(r.os.relatorio.versao) + '</a></p>' : '') + '</div>';
    if (r.historicoEquipamento && r.historicoEquipamento.length) h += '<div class="at-sec">Histórico do equipamento</div>' + At_listaHistorico_(r.historicoEquipamento);
    h += '<div class="at-sec">Histórico do chamado</div><div class="at-hist">' + (r.eventos || []).map(function (e) { return '<div><span class="q">' + At_esc_(e.em) + ' · ' + At_esc_(e.por || "sistema") + '</span><br>' + At_esc_(e.texto || ((e.de || "") + " → " + (e.para || ""))) + '</div>'; }).join("") + '</div>';
    h += '<div class="at-acoes"><button type="button" class="btn-secondary" id="atAnotar">Registrar contato ou observação</button><button type="button" class="btn-secondary" id="atReclamar">Registrar reclamação</button>' +
      (c.podeCancelar ? '<button type="button" class="btn-secondary" id="atCancelar" style="color:var(--danger)">Cancelar o chamado</button>' : '') + '</div>';
    var g = At_gaveta_("Chamado " + c.numero, h), corpo = g.querySelector("#atGavetaCorpo");
    var reabrir = function (m, t) { At_abrirChamado_(c.id, m, t); };
    if (c.podeTriar) At_ligarTriagem_(c, corpo, reabrir);
    if (c.podeAgendar) At_ligarAgendar_(c, corpo, reabrir, r);
    var b;
    if ((b = corpo.querySelector("#atRemOk"))) b.onclick = function () { At_chamar_("encerrarRemoto", { id: c.id, confirmadoPor: At_$_("atRemQuem").value, testeFuncional: At_$_("atRemTeste").value }, function (x) { reabrir(x.message); At_carregarChamados_(); }, function (m) { At_msg_("atRemMsg", m); }); };
    if ((b = corpo.querySelector("#atRetomar"))) b.onclick = function () { At_pedirTexto_("Liberar para agendar", "O chamado volta para \"Planejado\" e a gestão agenda o atendimento.", "O que aconteceu (peça chegou, orçamento aprovado...)", 5, function (t, ov) { At_chamar_("retomar", { id: c.id, texto: t }, function (x) { ov.remove(); reabrir(x.message); }, function (m) { At_msg_("atTxtMsg", m); }); }); };
    if ((b = corpo.querySelector("#atAbrirOs"))) b.onclick = function () { At_abrirOs_(r.os.id); };
    corpo.querySelector("#atAnotar").onclick = function () { At_pedirTexto_("Registrar no histórico", "Ligação do cliente, e-mail recebido ou observação. Fica no histórico do chamado.", "O que aconteceu", 5, function (t, ov) { At_chamar_("anotar", { id: c.id, texto: t }, function (x) { ov.remove(); reabrir(x.message); }, function (m) { At_msg_("atTxtMsg", m); }); }, "Registrar"); };
    corpo.querySelector("#atReclamar").onclick = function () { At_pedirTexto_("Registrar reclamação do cliente", "A reclamação vira um caso com dono e prazo (Assistência técnica > Reclamações).", "O que o cliente reclamou", 10, function (t, ov) { At_chamar_("salvarCaso", { chamadoId: c.id, clienteId: c.clienteId, tipo: "RECLAMACAO", descricao: t }, function (x) { ov.remove(); reabrir(x.message); }, function (m) { At_msg_("atTxtMsg", m); }); }, "Registrar"); };
    if ((b = corpo.querySelector("#atCancelar"))) b.onclick = function () { At_pedirTexto_("Cancelar o chamado " + c.numero, "O cancelamento fica no histórico e o cliente vê que foi cancelado. Se houver O.S. aberta, ela também é cancelada.", "Motivo", 10, function (t, ov) { At_chamar_("cancelar", { id: c.id, motivo: t }, function (x) { ov.remove(); reabrir(x.message); At_carregarChamados_(); }, function (m) { At_msg_("atTxtMsg", m); }); }, "Cancelar o chamado"); };
    if (r.orcamentos && r.orcamentos.length) At_ligarOrcamentos_(r, corpo, reabrir);
  }
  function At_listaHistorico_(l) {

  document.addEventListener("click", function (e) { var b = e.target && e.target.closest ? e.target.closest("[data-acervo]") : null; if (b) { e.stopPropagation(); At_fotosAcervo_(b.getAttribute("data-acervo")); } });

  function At_formTriagem_(c, r) {
    var ini = AT.ini, tk = c.triagem || {};
    return '<div class="at-caixa"><h3>Triagem</h3><p class="at-meta">Registre o que confirmou com o cliente e decida o caminho. Os itens marcados com * são obrigatórios para concluir.</p>' +

    c.querySelectorAll("[data-desf]").forEach(function (b) { b.onclick = function () { At_chamar_("confirmarCriterio", { chave: b.getAttribute("data-desf"), desfazer: true }, redesenhar); }; });
    c.querySelectorAll("[data-dest]").forEach(function (b) { b.onclick = function () { At_pedirTexto_("Destino da tarefa " + b.getAttribute("data-task"), b.textContent, "Observação", 5, function (tx, ov) { At_chamar_("destinoAuvo", { taskId: b.getAttribute("data-task"), destino: b.getAttribute("data-dest"), texto: tx }, function (x) { ov.remove(); redesenhar(x); }, function (m) { At_msg_("atTxtMsg", m); }); }); }; });
    At_$_("atTrIdx").onclick = function () { At_chamar_("indexarAcervo", {}, function (x) { alert((x.indice.motivo || ("Lote feito: " + x.indice.feitos + " tarefa(s); faltam " + x.indice.restantes + "."))); At_renderTransicao_(div); }, null, { carregando: "Ligando o histórico do Auvo aos equipamentos…" }); };
    At_$_("atTrRev").onclick = function () { At_chamar_("revisaoAcervo", {}, function (x) { At_modal_("Tarefas do Auvo sem equipamento do SGO+ (" + x.total + ")", x.itens.length ? x.itens.map(function (i) { return '<p class="at-meta">Tarefa ' + At_esc_(i.taskId) + ' · ' + At_esc_(i.data) + ' · ' + At_esc_(i.tipo) + (i.equipAuvo ? ' · equipamento ' + At_esc_(i.equipAuvo) + ' do Auvo sem vínculo' : ' · sem equipamento no Auvo') + '</p>'; }).join("") + '<p class="at-txt">Para ligar, vincule o equipamento em Integração Auvo (sincronização reversa) e rode o lote de novo. Nada se perde: a tarefa continua no acervo.</p>' : '<p class="at-txt">Nenhuma.</p>', "", 700); }); };
    var dsl = At_$_("atTrDesl"); if (dsl) dsl.onclick = function () { At_pedirTexto_("Marcar Auvo desligado", "Só o registro da decisão: nada é desligado sozinho.", "Decisão (ex.: data combinada para cancelar o contrato)", 10, function (tx, ov) { At_chamar_("auvoDesligado", { texto: tx }, function (x) { ov.remove(); redesenhar(x); }, function (m) { At_msg_("atTxtMsg", m); }); }); };
  }

  // =========================================================
  // PORTAL DO CLIENTE (Meus chamados)
  // =========================================================
  function At_renderPortal_(div) {
    div.innerHTML = '<div class="module-shell">' + At_cabecalho_("Meus chamados", "Peça atendimento técnico para os seus equipamentos e acompanhe cada pedido até o relatório.", '<button type="button" class="btn-primary" id="atPoNovo">Pedir atendimento</button>') + '<div id="atPoCorpo"><div class="at-vazio">Carregando…</div></div></div>';
    At_chamar_("portal", {}, function (r) {
      var c = At_$_("atPoCorpo"); if (!c) return;
      AT.portal = r;
      var h = (r.pedidos.length ? '<div class="at-sec">Pedidos em análise</div><div class="at-lista">' + r.pedidos.map(function (p) { return '<div class="at-card"><p class="at-card-tit">' + At_esc_(p.numero) + ' · ' + At_esc_(p.equipamentoTexto) + '</p><p class="at-meta">Enviado em ' + At_esc_(p.em) + '. A equipe técnica confere e abre o chamado.</p><p class="at-txt">' + At_esc_(p.descricao) + '</p></div>'; }).join("") + '</div>' : '') +
        '<div class="at-sec">Chamados</div>' + (r.chamados.length ? '<div class="at-lista">' + r.chamados.map(function (ch) {
          return '<div class="at-card' + (ch.cancelado ? " fim" : "") + '"><p class="at-card-tit">' + At_esc_(ch.numero) + ' · ' + At_esc_(ch.equipamentoTexto) + '</p><p class="at-meta">Aberto em ' + At_esc_(ch.abertoEm) + (ch.unidadeNome ? ' · ' + At_esc_(ch.unidadeNome) : '') + '</p>' +
            (ch.cancelado ? '<p class="at-txt">Cancelado.</p>' : '<div class="at-etapas">' + ch.etapas.map(function (e, i) { return '<span class="' + (i + 1 <= ch.etapa ? "feita" : "") + '">' + At_esc_(e) + '</span>'; }).join("") + '</div>') +
            '<p class="at-txt">' + At_esc_(ch.sintoma) + '</p>' + (ch.agendadoPara ? '<p class="at-meta">Visita agendada para ' + At_esc_(ch.agendadoPara) + '.</p>' : '') + (ch.relatorioUrl ? '<a href="' + At_esc_(ch.relatorioUrl) + '" target="_blank" rel="noopener">Baixar o relatório do atendimento (' + At_esc_(ch.osNumero) + ')</a>' : '') + '</div>';
        }).join("") + '</div>' : '<div class="at-vazio">Nenhum chamado ainda.</div>') +
        '<div class="at-sec">Relatórios emitidos</div>' + (r.relatorios.length ? '<div class="at-lista">' + r.relatorios.map(function (x) { return '<div class="at-card fim"><p class="at-txt"><a href="' + At_esc_(x.url) + '" target="_blank" rel="noopener">' + At_esc_(x.numero) + ' · ' + At_esc_(x.tipo) + ' · ' + At_esc_(x.equipamentoTexto) + ' · ' + At_esc_(x.encerradaEm) + '</a></p></div>'; }).join("") + '</div>' : '<p class="at-meta">Nenhum relatório emitido ainda.</p>');
      c.innerHTML = h;
    }, function (m) { At_msg_("atPoCorpo", m); });
    At_$_("atPoNovo").onclick = function () {
      var eqs = (AT.portal && AT.portal.equipamentos) || [];
      var ov = At_modal_("Pedir atendimento técnico", At_campo_("Equipamento", '<select id="atPoEq">' + At_opcoes_(eqs.map(function (e) { return { v: e.id, t: e.texto + (e.unidade ? " · " + e.unidade : "") }; }), "", "Escolha o equipamento") + '</select>') +
        At_campo_("O que está acontecendo", '<textarea id="atPoDesc" maxlength="3000" placeholder="Ex.: a autoclave não completa o ciclo e apita no final"></textarea>') + '<div class="at-grade2">' + At_campo_("Equipamento parado?", '<select id="atPoPar">' + At_opcoes_([{ v: "NAO", t: "Não" }, { v: "PARCIAL", t: "Parcialmente" }, { v: "TOTAL", t: "Sim, totalmente" }], "NAO") + '</select>') +
        At_campo_("Seu nome", '<input id="atPoSol" maxlength="120">') + '</div>' + At_campo_("Telefone ou e-mail para falarmos com você", '<input id="atPoCont" maxlength="200">') + '<div id="atPoMsg"></div>',
        '<button type="button" class="btn-secondary" data-x>Voltar</button><button type="button" class="btn-primary" data-ok>Enviar o pedido</button>');
      ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
      ov.querySelector("[data-ok]").onclick = function () { At_chamar_("solicitar", { equipamentoId: At_$_("atPoEq").value, descricao: At_$_("atPoDesc").value, parada: At_$_("atPoPar").value, solicitante: At_$_("atPoSol").value, contato: At_$_("atPoCont").value, origem: "PORTAL" }, function (x) { ov.remove(); alert(x.message); At_renderPortal_(div); }, function (m) { At_msg_("atPoMsg", m); }); };
    };
  }
</script>

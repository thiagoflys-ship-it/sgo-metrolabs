  .at-item.auvo { border-left-color: var(--muted); cursor: default; } .at-item.aus { border-left-color: var(--warning); cursor: default; } .at-item.fim { opacity: .7; }

  .at-etapas span.feita { background: var(--success-bg); color: var(--success); border-color: var(--success); font-weight: 700; }
  .at-wrap-tabela { overflow-x: auto; max-width: 100%; }
  /* 27/10/2026: triagem com fila livre e exclusão de chamado de teste (botões de 44 px, como no Auvo) */
  .at-btn44 { min-height: 44px; }

  .at-tri.zero { border-left-color: var(--success); } .at-tri.fila { border-left-color: var(--danger); }
  .at-tri b.n { font-size: 18px; font-variant-numeric: tabular-nums; }

<script>
  // ==========================================================
  // ASSISTÊNCIA TÉCNICA NATIVA DO SGO+ (21/10/2026)
  // Telas (abrir(mod)): assistencia (Chamados), assistencia_abrir, assistencia_os (O.S.), assistencia_agenda,
  // assistencia_solicitacoes, assistencia_casos, assistencia_indicadores, assistencia_regras, assistencia_transicao e,
  // para o cliente, assistencia_portal (Meus chamados). Uma chamada no servidor: Assistencia_api(sessionId, acao, dados).
  // O servidor confere o perfil e o técnico responsável em toda chamada. A tela não se redesenha sozinha: recarrega
  // depois de cada ação ou em "Atualizar" (nunca apaga o que está sendo digitado).
  // ==========================================================
  var AT = { ini: null, mod: "", filtro: { grupo: "ABERTOS", busca: "", prioridade: "" }, osFiltro: "ABERTAS", agenda: { inicio: "", dias: 1 }, comp: "" };
  var AT_MODS = { assistencia: "Chamados", assistencia_abrir: "Abrir chamado", assistencia_os: "Ordens de serviço", assistencia_agenda: "Agenda dos técnicos", assistencia_solicitacoes: "Solicitações dos clientes",
    assistencia_casos: "Reclamações", assistencia_indicadores: "Indicadores da assistência", assistencia_regras: "Regras da assistência", assistencia_transicao: "Transição do Auvo", assistencia_portal: "Meus chamados" };
  var AT_COR_SIT = { ABERTO: "azul", EM_TRIAGEM: "azul", RESOLVIDO_REMOTO: "verde", AGUARDANDO_ORCAMENTO: "laranja", AGUARDANDO_PECA: "laranja", PLANEJADO: "laranja", AGENDADO: "azul", EM_DESLOCAMENTO: "azul",
    NO_LOCAL: "azul", EM_EXECUCAO: "azul", PAUSADO: "laranja", AGUARDANDO_CLIENTE: "laranja", DOC_PENDENTE: "vermelho", ENCERRADO: "cinza", CANCELADO: "cinza",
    AGENDADA: "azul", PAUSADA: "laranja", ENCERRADA: "cinza", CANCELADA: "cinza" };
  var AT_COR_SLA = { ESTOURADO: "vermelho", EM_RISCO: "laranja", EM_DIA: "verde", CUMPRIDO: "verde", FORA_DO_PRAZO: "vermelho", PAUSADO: "cinza" };

  function At_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function At_$_(id) { return document.getElementById(id); }
  function At_chamar_(acao, dados, ok, erro, opcoes) {
    var o = opcoes || {};
    if (o.carregando) SGO_iniciarCarregamento_(o.carregando);
    var fim = function () { if (o.carregando) SGO_finalizarCarregamento_(); };
    var falhou = function (m) { fim(); if (erro) erro(m); else alert(m); };
    google.script.run.withSuccessHandler(function (r) {
      if (!r || (!r.ok && !r.duplicado && !r.conflito)) { falhou((r && r.message) || "Não foi possível concluir: o servidor não respondeu como esperado. Tente de novo."); return; }
      fim();
      try { if (ok) ok(r); } catch (e) { console.error("Assistência " + acao + ":", e); alert("Não foi possível mostrar o resultado na tela: " + (e && e.message ? e.message : e) + ". Atualize a página (F5) e tente de novo."); }
    }).withFailureHandler(function (e) { falhou("Não foi possível falar com o servidor (" + ((e && e.message) || e) + "). Verifique a conexão e tente de novo; nada foi alterado."); })
      .Assistencia_api(SGO_getSessionId(), acao, dados || {});
  }
  function At_msg_(onde, texto, tipo) { var el = typeof onde === "string" ? At_$_(onde) : onde; if (el) el.innerHTML = texto ? '<div class="at-faixa ' + (tipo || "erro") + '">' + At_esc_(texto) + "</div>" : ""; }
  function At_campo_(rotulo, html, ajuda) { return '<div class="at-campo"><label>' + At_esc_(rotulo) + "</label>" + html + (ajuda ? '<div class="at-ajuda-campo">' + At_esc_(ajuda) + "</div>" : "") + "</div>"; }
  function At_opcoes_(lista, atual, vazio) {
    return (vazio !== undefined ? '<option value="">' + At_esc_(vazio) + "</option>" : "") + lista.map(function (o) { var v = typeof o === "object" ? o.v : o, t = typeof o === "object" ? o.t : o; return '<option value="' + At_esc_(v) + '"' + (String(v) === String(atual === undefined || atual === null ? "" : atual) ? " selected" : "") + ">" + At_esc_(t) + "</option>"; }).join("");
  }
  function At_mapaOpcoes_(m) { return Object.keys(m || {}).map(function (k) { return { v: k, t: m[k] }; }); }
  function At_selo_(cor, txt) { return '<span class="at-selo ' + (cor || "cinza") + '">' + At_esc_(txt) + "</span>"; }
  function At_cabecalho_(titulo, sub, botoes) {
    return '<div class="module-header"><div class="module-header-left"><h2 class="content-title">' + At_esc_(titulo) + '</h2><p class="content-subtitle">' + At_esc_(sub) + "</p></div>" +
      '<div class="module-header-right" style="display:flex;gap:8px;flex-wrap:wrap">' + (botoes || "") + "</div></div>" + At_faixaDesligada_();
  }
  /** 22/10/2026: o interruptor "Assistência ligada" vale em todas as telas internas: explica o que está travado, por quê e o caminho para religar. */
  function At_faixaDesligada_() {
    var ini = AT.ini;
    if (!ini || ini.cliente || ini.ligada) return "";
    return '<div class="at-faixa aviso"><b>A Assistência do SGO+ está desligada pela gestão.</b> O que continua: ver chamados, O.S., agenda, indicadores e regras. O que fica travado: abrir chamado, triagem, agenda, registro de campo, orçamento e o aplicativo do técnico (nada é apagado; o atendimento novo segue pelo Auvo). ' +
      'Para religar: ' + (ini.podeRegras ? '<a href="#" onclick="abrir(\'assistencia_regras\');return false">Assistência técnica &gt; Regras da assistência &gt; Ligar</a> (com o motivo).' : 'peça ao Administrador, à Diretoria ou a um gestor para abrir Assistência técnica &gt; Regras da assistência e tocar em "Ligar".') + '</div>';
  }
  function At_modal_(titulo, corpo, rodape, largura) {
    var ov = document.createElement("div");
    ov.className = "atv-overlay";
    ov.innerHTML = '<div class="atv-modal" style="max-width:' + (largura || 600) + 'px"><div class="atv-modal-cab"><h3>' + At_esc_(titulo) + '</h3><button type="button" class="atv-fechar" aria-label="Fechar">&times;</button></div>' +
      '<div class="atv-modal-corpo">' + corpo + '</div>' + (rodape ? '<div class="atv-modal-rod">' + rodape + '</div>' : '') + '</div>';
    ov.querySelector(".atv-fechar").onclick = function () { ov.remove(); };
    document.body.appendChild(ov);
    return ov;
  }
  function At_gaveta_(titulo, corpo) {
    var antiga = At_$_("atGaveta"); if (antiga) antiga.remove();
    var g = document.createElement("div");
    g.id = "atGaveta"; g.className = "atv-overlay"; g.style.justifyContent = "flex-end"; g.style.padding = "0";
    g.innerHTML = '<div class="atv-drawer" role="dialog" aria-label="' + At_esc_(titulo) + '" style="max-width:760px;width:100%"><div class="atv-drawer-cab"><h3>' + At_esc_(titulo) + '</h3><button type="button" class="btn-secondary" data-at-fechar>Fechar</button></div><div class="atv-drawer-corpo" id="atGavetaCorpo">' + corpo + '</div></div>';
    g.querySelector("[data-at-fechar]").onclick = function () { g.remove(); };
    g.addEventListener("click", function (e) { if (e.target === g) g.remove(); });
    document.body.appendChild(g);
    return g;
  }
  function At_pedirTexto_(titulo, explicacao, rotulo, minimo, ok, botao) {
    var ov = At_modal_(titulo, '<p class="at-txt">' + At_esc_(explicacao) + "</p>" + At_campo_(rotulo, '<textarea id="atTxtPedido" maxlength="1000"></textarea>', minimo ? "Pelo menos " + minimo + " letras." : "") + '<div id="atTxtMsg"></div>',
      '<button type="button" class="btn-secondary" data-x>Voltar</button><button type="button" class="btn-primary" data-ok>' + At_esc_(botao || "Confirmar") + "</button>");
    ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
    ov.querySelector("[data-ok]").onclick = function () {
      var t = At_$_("atTxtPedido").value.trim();
      if (minimo && t.length < minimo) { At_msg_("atTxtMsg", "Escreva pelo menos " + minimo + " letras.", "aviso"); return; }
      ok(t, ov);
    };
  }
  /** Lê arquivos: fotos reduzidas no navegador (até 1600 px, JPEG ~300 KB); outros como estão. */
  function At_lerArquivos_(input, cb, soImagem) {
    var fs = Array.prototype.slice.call((input && input.files) || []);
    if (!fs.length) { cb([]); return; }
    var saida = [], falta = fs.length;
    fs.forEach(function (f, i) {
      var fim = function (obj) { saida[i] = obj; if (--falta === 0) cb(saida.filter(Boolean)); };
      if (f.size > 25 * 1048576) { alert('O arquivo "' + f.name + '" passa de 25 MB e não foi anexado. Reduza e tente de novo.'); fim(null); return; }
      var rd = new FileReader();
      rd.onload = function () {
        var dataUrl = String(rd.result || "");
        if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)) {
          var img = new Image();
          img.onload = function () {
            var esc = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
            cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            fim({ nome: f.name.replace(/\.[^.]+$/, "") + ".jpg", tipo: "image/jpeg", base64: cv.toDataURL("image/jpeg", 0.78).split(",")[1] });
          };
          img.onerror = function () { fim({ nome: f.name, tipo: f.type, base64: dataUrl.split(",")[1] }); };
          img.src = dataUrl;
        } else if (soImagem) { alert('O arquivo "' + f.name + '" não é uma foto (JPG ou PNG) e não foi anexado.'); fim(null); }
        else fim({ nome: f.name, tipo: f.type || "application/octet-stream", base64: dataUrl.split(",")[1] });
      };
      rd.onerror = function () { fim(null); };
      rd.readAsDataURL(f);
    });
  }
  function At_idLocal_() { return "tela-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }
  function At_abrirHtml_(html) {
    var w = window.open("", "_blank");
    if (!w) { alert("O navegador bloqueou a janela do documento. Libere as janelas do SGO+ e tente de novo."); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }
  function At_seloSla_(sla) { return sla && sla.estado && sla.estado !== "SEM_PRAZO" ? At_selo_(AT_COR_SLA[sla.estado] || "cinza", sla.texto) : ""; }

  // ---------------- casca: menu ----------------
  function Assistencia_iniciar_() {
    var p = USER_CONTEXT ? String(USER_CONTEXT.perfil || "").toUpperCase() : "";
    if (!p) { Assistencia_mostrarMenu_(null); return; }
    At_chamar_("acesso", {}, function (r) {
      Assistencia_mostrarMenu_(r);
      // 27/10/2026: contador de triagem no menu "Chamados", atualizado a cada 5 minutos só com a aba visível (só o número; nenhuma tela é redesenhada)
      At_badgeTriagem_(r && r.triagem);
      if (AT.timerBadge) clearInterval(AT.timerBadge);
      if (r && !r.cliente) AT.timerBadge = setInterval(At_atualizarBadge_, 5 * 60 * 1000);
    }, function () { Assistencia_mostrarMenu_(null); });
  }
  function Assistencia_parar_() { AT.ini = null; if (AT.timerBadge) { clearInterval(AT.timerBadge); AT.timerBadge = null; } At_badgeTriagem_(null); Assistencia_mostrarMenu_(null); }
  /** Badge do menu: quantos chamados a pessoa pode assumir agora (vermelho quando há fila livre). */
  function At_badgeTriagem_(t) {
    AT.triagem = t || null;
    var b = At_$_("menuBadgeAssistencia");
    if (b) {
      var n = t ? (t.paraMim || 0) : 0;
      b.textContent = n ? String(n) : "";
      b.title = n ? n + (n === 1 ? " chamado pendente de triagem" : " chamados pendentes de triagem") + (t.filaLivre ? " (" + t.filaLivre + " na fila livre)" : "") : "";
      b.classList.toggle("is-visible", !!n);
      b.style.background = t && t.filaLivre ? "var(--danger)" : "";
    }
    var f = At_$_("atTriFaixa");
    if (f) f.innerHTML = At_faixaTriagem_(t);
  }

              (x.relatorioUrl ? '<div class="atv-sub"><a href="' + At_esc_(x.relatorioUrl) + '" target="_blank" rel="noopener" data-pna-acao="rel">Relatório ' + At_esc_(x.osNumero) + '</a></div>' : ''); } });
          PnA_ligar_(el, irPara);
        };
        PnA_ligarAbas_("atPoAbas", desenhar);
        desenhar(AT.portalAba || "kanban");
      }
      c.querySelectorAll("[data-po-orc]").forEach(function (b) { b.onclick = function () { At_responderOrcamento_((r.orcamentos || []).filter(function (o) { return o.id === b.getAttribute("data-po-orc"); })[0], b.getAttribute("data-dec"), function () { At_renderPortal_(div); }); }; });
    }, function (m) { At_msg_("atPoCorpo", m); });
    At_$_("atPoNovo").onclick = function () {
      var eqs = (AT.portal && AT.portal.equipamentos) || [];
      var ov = At_modal_("Pedir atendimento técnico", At_campo_("Equipamento", '<select id="atPoEq">' + At_opcoes_(eqs.map(function (e) { return { v: e.id, t: e.texto + (e.unidade ? " · " + e.unidade : "") }; }), "", "Escolha o equipamento") + '</select>') +
        At_campo_("O que está acontecendo", '<textarea id="atPoDesc" maxlength="3000" placeholder="Ex.: a autoclave não completa o ciclo e apita no final"></textarea>') + '<div class="at-grade2">' + At_campo_("Equipamento parado?", '<select id="atPoPar">' + At_opcoes_([{ v: "NAO", t: "Não" }, { v: "PARCIAL", t: "Parcialmente" }, { v: "TOTAL", t: "Sim, totalmente" }], "NAO") + '</select>') +
        At_campo_("Seu nome", '<input id="atPoSol" maxlength="120">') + '</div>' + At_campo_("Telefone ou e-mail para falarmos com você", '<input id="atPoCont" maxlength="200">') + '<div id="atPoMsg"></div>',
        '<button type="button" class="btn-secondary" data-x>Voltar</button><button type="button" class="btn-primary" data-ok>Enviar o pedido</button>');
      ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
      ov.querySelector("[data-ok]").onclick = function () { At_chamar_("solicitar", { equipamentoId: At_$_("atPoEq").value, descricao: At_$_("atPoDesc").value, parada: At_$_("atPoPar").value, solicitante: At_$_("atPoSol").value, contato: At_$_("atPoCont").value, origem: "PORTAL" }, function (x) { ov.remove(); alert(x.message); At_renderPortal_(div); }, function (m) { At_msg_("atPoMsg", m); }); };
    };
  }
</script>

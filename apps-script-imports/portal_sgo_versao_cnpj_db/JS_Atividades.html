<script>

  var ATV_SITUACOES_KANBAN = ["A fazer", "Em andamento", "Aguardando", "Concluída"];

    return d.getFullYear() + "-" + Atividades_p2_(d.getMonth() + 1) + "-" + Atividades_p2_(d.getDate()) + "T" + Atividades_p2_(d.getHours()) + ":" + Atividades_p2_(d.getMinutes());
  }
  function Atividades_diaIso_(d) { return Atividades_iso_(d).slice(0, 10); }
  function Atividades_agoraIso_() { return Atividades_iso_(new Date()); }
  function Atividades_br_(s) {
    var d = Atividades_parse_(s);

    return Atividades_p2_(d.getDate()) + "/" + Atividades_p2_(d.getMonth() + 1) + "/" + d.getFullYear() + " " + Atividades_p2_(d.getHours()) + ":" + Atividades_p2_(d.getMinutes());
  }

  function Atividades_num_(n, casas) { return Number(n).toLocaleString("pt-BR", { minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0 }); }

    var h = Math.floor(min / 60), r = min % 60;
    if (h < 24) return "há " + h + " h" + (r ? " " + r + " min" : "");

  function Atividades_vencida_(a) { return Atividades_aberta_(a) && a.PREVISAO_ATUAL && a.PREVISAO_ATUAL < Atividades_agoraIso_(); }

    google.script.run
      .withSuccessHandler(function (res) {

      .withFailureHandler(function (err) {
        console.error("Atividades " + fn + " falhou:", err);
        falhou("Não foi possível falar com o servidor (" + ((err && err.message) || err) + "). Verifique a conexão e tente de novo; nada foi alterado.");
      })[fn](SGO_getSessionId(), payload || {});
  }

  function Atividades_garantirOpcoes_(cb) {
    if (ATV.opcoes) { cb(ATV.opcoes); return; }
    Atividades_chamar_("Atividades_apiOpcoes", {}, function (res) { ATV.opcoes = res; ATV.eu = res.eu; cb(res); });
  }

  /** Módulos do menu (chave = data-mod usada por abrir(mod)). */
  function Atividades_modulosDoMenu_() {
    var lista = [], vistos = {};
    document.querySelectorAll("#menu .menu-btn[data-mod]").forEach(function (b) {
      var k = b.getAttribute("data-mod");
      if (!k || vistos[k] || k === "dashboard" || k === "minhas_atividades" || k === "atividades_equipe" || k === "avisos" || k === "admin" || k === "chaves") return;
      vistos[k] = 1;
      var c = b.cloneNode(true);
      c.querySelectorAll(".menu-badge, .menu-btn-icon").forEach(function (x) { x.remove(); });
      lista.push({ chave: k, nome: c.textContent.replace(/\s+/g, " ").trim() });
    });
    return lista;
  }
  function Atividades_nomeModulo_(chave) {
    var m = Atividades_modulosDoMenu_().filter(function (x) { return x.chave === chave; })[0];
    return m ? m.nome : chave;
  }

  // ---------- ciclo de vida (login/logout/verificação periódica) ----------
  function Atividades_iniciar_() {
    if (!SESSION || Atividades_ehCliente_()) { Atividades_aplicarMenu_(); return; }
    ATV.opcoes = null;
    Atividades_aplicarMenu_();
    Atividades_verificar_();
    if (!ATV.timerGlobal) ATV.timerGlobal = setInterval(function () { if (document.visibilityState === "visible") Atividades_verificar_(); }, ATV_PERIODICO_MS);
    if (!ATV.ouvinteVisivel) {
      ATV.ouvinteVisivel = true;
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || !SESSION) return;
        Atividades_verificar_();
        Atividades_atualizarTela_(true);
      });
    }
  }

  function Atividades_parar_() {
    if (ATV.timerGlobal) clearInterval(ATV.timerGlobal);
    if (ATV.timerTela) clearInterval(ATV.timerTela);
    ATV.timerGlobal = null; ATV.timerTela = null; ATV.opcoes = null; ATV.eu = null; ATV.justAbertas = {};
    var ov = document.getElementById("atvJustOverlay"); if (ov) ov.remove();
    Atividades_fecharDrawer_();
    document.querySelectorAll(".atv-overlay").forEach(function (o) { o.remove(); });
  }

  function Atividades_aplicarMenu_() {
    var cli = Atividades_ehCliente_();
    var bMinhas = document.getElementById("menu-btn-atv-minhas");
    var bEquipe = document.getElementById("menu-btn-atv-equipe");
    if (bMinhas) bMinhas.style.display = cli ? "none" : "";
    // 19/10/2026: a visão da equipe é de todos os perfis internos (só a gestão e os envolvidos alteram).
    if (bEquipe) bEquipe.style.display = cli ? "none" : "";
  }

  function Atividades_verificar_() {
    if (!SESSION || Atividades_ehCliente_() || ATV.verificando) return;
    ATV.verificando = true;
    Atividades_chamar_("Atividades_apiVerificar", {}, function (res) {
      ATV.verificando = false;
      var badge = document.getElementById("menuBadgeAtividades");
      if (badge) {
        var n = (res.pendentes || []).length;
        badge.textContent = n ? String(n) : (res.abertas ? String(res.abertas) : "");
        badge.title = n ? Atividades_pl_(n, "atividade vencida", "atividades vencidas") : (res.abertas ? Atividades_pl_(res.abertas, "atividade aberta", "atividades abertas") : "");
        badge.classList.toggle("is-visible", !!(n || res.abertas));
        badge.style.background = n ? "var(--danger)" : "";
      }
      if (res.motivosAtraso && res.motivosAtraso.length) ATV.motivos = res.motivosAtraso;
      if (res.pendentes && res.pendentes.length) Atividades_mostrarJustificativas_(res.pendentes);
      else Atividades_fecharJustificativas_();
      if (res.avisos && res.avisos.length) Atividades_mostrarAvisos_(res.avisos);
    }, function (msg) { ATV.verificando = false; console.error("Atividades verificar:", msg); }, { silencioso: true });
  }

  function Atividades_mostrarAvisos_(avisos) {
    var cont = auvoToastContainer_();
    avisos.forEach(function (v) {
      var t = document.createElement("div");
      t.className = "auvo-toast";
      t.style.borderLeft = "4px solid " + (v.TIPO === "JUSTIFICATIVA" ? "var(--warning)" : "var(--info)");
      t.innerHTML = '<span class="auvo-toast-icone"><i class="fas ' + (v.TIPO === "JUSTIFICATIVA" ? "fa-clock-rotate-left" : "fa-list-check") + '" aria-hidden="true"></i></span>' +
        '<div class="auvo-toast-corpo"><div class="auvo-toast-titulo">' + Atividades_esc_(v.TITULO) + '</div><div class="auvo-toast-detalhe">' + Atividades_esc_(v.TEXTO) + "</div></div>";
      t.onclick = function () { t.remove(); if (v.ATIVIDADE_ID) Atividades_abrirDetalhe_(v.ATIVIDADE_ID); };
      cont.appendChild(t);
      setTimeout(function () { t.classList.add("auvo-toast-saindo"); setTimeout(function () { t.remove(); }, 400); }, 15000);
    });
    Atividades_chamar_("Atividades_apiMarcarAvisosLidos", { ids: avisos.map(function (v) { return v.ID; }) }, function () {}, function () {}, { silencioso: true });
    if (ATV.tela === "equipe") Atividades_carregarEquipe_();
  }

  // ---------- janela de justificativa de atraso (não fecha sem justificar) ----------
  function Atividades_mostrarJustificativas_(pendentes) {
    var ov = document.getElementById("atvJustOverlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "atvJustOverlay";
      ov.className = "atv-overlay bloqueante";
      ov.setAttribute("role", "dialog");
      ov.setAttribute("aria-modal", "true");
      ov.innerHTML = '<div class="atv-modal" style="max-width:620px">' +
        '<div class="atv-modal-cab"><div><h3>Atividade com prazo vencido</h3>' +
        '<div class="atv-sub" style="font-size:12.5px;margin-top:6px">O prazo destas atividades já passou e elas não foram concluídas. Para continuar usando o sistema, informe para cada uma o que causou o atraso, explique a demora (mínimo 15 letras) e escolha uma nova previsão de entrega. A justificativa fica no histórico da atividade e quem lançou a atividade é avisado. Se a atividade já foi feita, justifique e depois marque como concluída em Minhas atividades.</div></div></div>' +
        '<div class="atv-modal-corpo" id="atvJustCorpo"></div></div>';
      document.body.appendChild(ov);
      ATV.justAbertas = {};
    }
    var corpo = document.getElementById("atvJustCorpo");
    var ids = {};
    pendentes.forEach(function (a) {
      ids[a.ID] = 1;
      if (ATV.justAbertas[a.ID]) return; // já na tela: não apaga o que a pessoa está digitando
      ATV.justAbertas[a.ID] = 1;
      var minimo = new Date(Date.now() + 5 * 60000);
      var sugestao = new Date(); sugestao.setDate(sugestao.getDate() + 1); sugestao.setHours(18, 0, 0, 0);
      var card = document.createElement("div");
      card.className = "atv-just-card";
      card.id = "atvJust_" + a.ID;
      card.innerHTML = '<div class="t">' + Atividades_esc_(a.TITULO) + "</div>" +
        '<div class="atv-sub">Previsão vencida em ' + Atividades_br_(a.PREVISAO_ATUAL) + (a.PRAZO !== a.PREVISAO_ATUAL ? " (prazo original " + Atividades_br_(a.PRAZO) + ")" : "") +
        (a.CRIADO_POR_NOME ? " · lançada por " + Atividades_esc_(a.CRIADO_POR_NOME) : "") + (a.QTD_JUSTIFICATIVAS ? " · já justificada " + a.QTD_JUSTIFICATIVAS + " vez(es)" : "") + "</div>" +
        '<div class="atv-campo" style="margin-top:10px"><label for="atvJustCat_' + a.ID + '">O que causou o atraso</label>' +
        '<select id="atvJustCat_' + a.ID + '"><option value="">Escolha o motivo</option>' + (ATV.motivos || []).map(function (m) { return '<option>' + Atividades_esc_(m) + "</option>"; }).join("") + "</select></div>" +
        '<div class="atv-campo"><label for="atvJustMot_' + a.ID + '">Explique a demora</label>' +
        '<textarea id="atvJustMot_' + a.ID + '" maxlength="2000" placeholder="O que atrasou a atividade e o que falta para concluir"></textarea>' +
        '<div class="atv-contador curto" id="atvJustCont_' + a.ID + '">0 de 15 letras no mínimo</div></div>' +
        '<div class="atv-campo"><label for="atvJustPrev_' + a.ID + '">Nova previsão de entrega</label>' +
        '<input type="datetime-local" id="atvJustPrev_' + a.ID + '" min="' + Atividades_iso_(minimo) + '" value="' + Atividades_iso_(sugestao) + '"></div>' +
        '<div id="atvJustMsg_' + a.ID + '"></div>' +
        '<div style="text-align:right"><button type="button" class="btn-primary" onclick="Atividades_enviarJustificativa_(\'' + a.ID + '\', this)">Registrar justificativa</button></div>';
      corpo.appendChild(card);
      var ta = card.querySelector("textarea");
      ta.addEventListener("input", function () {
        var n = ta.value.replace(/\s+/g, " ").trim().length;
        var c = document.getElementById("atvJustCont_" + a.ID);
        c.textContent = n >= 15 ? n + " letras" : n + " de 15 letras no mínimo";
        c.classList.toggle("curto", n < 15);
      });
    });
    Object.keys(ATV.justAbertas).forEach(function (id) {
      if (!ids[id]) { var c = document.getElementById("atvJust_" + id); if (c) c.remove(); delete ATV.justAbertas[id]; }
    });
    var primeiro = corpo.querySelector("textarea");
    if (primeiro && !ov.contains(document.activeElement)) primeiro.focus();
  }

  function Atividades_fecharJustificativas_() {
    var ov = document.getElementById("atvJustOverlay");
    if (ov) ov.remove();
    ATV.justAbertas = {};
  }

  function Atividades_enviarJustificativa_(id, btn) {
    var motivo = (document.getElementById("atvJustMot_" + id) || {}).value || "";
    var prev = (document.getElementById("atvJustPrev_" + id) || {}).value || "";
    var cat = (document.getElementById("atvJustCat_" + id) || {}).value || "";
    var msg = document.getElementById("atvJustMsg_" + id);
    var mostrar = function (t) { msg.innerHTML = '<div class="atv-msg erro">' + Atividades_esc_(t) + "</div>"; };
    if (!cat && (ATV.motivos || []).length) { mostrar("Não foi possível registrar: escolha em \"O que causou o atraso\" o motivo (se nenhum servir, escolha \"Outro motivo\") e clique em Registrar de novo."); return; }
    if (motivo.replace(/\s+/g, " ").trim().length < 15) { mostrar("Não foi possível registrar: o motivo precisa ter pelo menos 15 letras. Explique o que atrasou e clique em Registrar de novo."); return; }
    if (!prev) { mostrar("Não foi possível registrar: informe a nova previsão (data e hora) e clique em Registrar de novo."); return; }
    if (prev <= Atividades_agoraIso_()) { mostrar("Não foi possível registrar: a nova previsão já passou. Escolha uma data e hora depois de agora."); return; }
    btn.disabled = true; btn.textContent = "Registrando...";
    Atividades_chamar_("Atividades_apiJustificar", { id: id, motivo: motivo, novaPrevisao: prev, categoria: cat }, function () {
      var c = document.getElementById("atvJust_" + id); if (c) c.remove();
      delete ATV.justAbertas[id];
      if (!Object.keys(ATV.justAbertas).length) { Atividades_fecharJustificativas_(); Atividades_atualizarTela_(true); Atividades_verificar_(); }
    }, function (m) { btn.disabled = false; btn.textContent = "Registrar justificativa"; mostrar(m); });
  }

  // ---------- modal genérico ----------
  function Atividades_modal_(titulo, corpoHtml, rodapeHtml, opcoes) {
    var o = opcoes || {};
    var ov = document.createElement("div");
    ov.className = "atv-overlay";
    if (o.id) ov.id = o.id;
    ov.innerHTML = '<div class="atv-modal" style="max-width:' + (o.largura || 640) + 'px">' +
      '<div class="atv-modal-cab"><h3>' + titulo + '</h3><button type="button" class="atv-fechar" aria-label="Fechar">&times;</button></div>' +
      '<div class="atv-modal-corpo">' + corpoHtml + "</div>" +
      (rodapeHtml ? '<div class="atv-modal-rod">' + rodapeHtml + "</div>" : "") + "</div>";
    ov.querySelector(".atv-fechar").onclick = function () { ov.remove(); };
    document.body.appendChild(ov);
    return ov;
  }

  /** Pede um texto (motivo/observação) antes de mudar a situação. */
  function Atividades_pedirTexto_(titulo, explicacao, minimo, aoConfirmar) {
    var ov = Atividades_modal_(Atividades_esc_(titulo),
      '<p style="margin-top:0">' + Atividades_esc_(explicacao) + '</p><div class="atv-campo"><textarea id="atvPedirTexto" maxlength="2000"></textarea></div><div id="atvPedirMsg"></div>',
      '<button type="button" class="btn-secondary" data-x="cancelar">Cancelar</button><button type="button" class="btn-primary" data-x="ok">Confirmar</button>', { largura: 480 });
    var ta = ov.querySelector("#atvPedirTexto"); ta.focus();
    ov.querySelector('[data-x="cancelar"]').onclick = function () { ov.remove(); };
    ov.querySelector('[data-x="ok"]').onclick = function () {
      var t = ta.value.trim();
      if (t.length < minimo) { ov.querySelector("#atvPedirMsg").innerHTML = '<div class="atv-msg erro">Não foi possível confirmar: escreva pelo menos ' + minimo + " letras e clique em Confirmar de novo.</div>"; return; }
      ov.remove(); aoConfirmar(t);
    };
  }

  // ---------- ações ----------
  function Atividades_mudarSituacao_(id, situacao, depois) {
    var enviar = function (extra) {
      Atividades_chamar_("Atividades_apiMudarSituacao", Object.assign({ id: id, situacao: situacao }, extra || {}), function () {
        Atividades_aposAlterar_(); if (depois) depois(true);
      }, function (m) { alert(m); Atividades_aposAlterar_(); if (depois) depois(false); }, { carregando: "Gravando situação..." });
    };
    if (situacao === "Aguardando") Atividades_pedirTexto_("Colocar em Aguardando", "O que você está aguardando? (por exemplo: peça, retorno do cliente, aprovação). Mínimo 5 letras.", 5, function (t) { enviar({ motivo: t }); });
    else if (situacao === "Cancelada") Atividades_pedirTexto_("Cancelar atividade", "Por que a atividade está sendo cancelada? Mínimo 5 letras.", 5, function (t) { enviar({ motivo: t }); });
    else if (situacao === "Concluída") Atividades_pedirTexto_("Concluir atividade", "Observação da conclusão (opcional).", 0, function (t) { enviar({ observacao: t }); });
    else enviar();
  }

  function Atividades_fazendoAgora_(id, ligar) {
    Atividades_chamar_("Atividades_apiFazendoAgora", { id: id, ligar: ligar !== false }, function () { Atividades_aposAlterar_(); }, null, { carregando: "Gravando..." });
  }

    var det = document.getElementById("atvDetalheOverlay");
    if (det && det.dataset.id) Atividades_abrirDetalhe_(det.dataset.id);
    Atividades_atualizarTela_(true);
    if (ATV.drawerModulo) Atividades_carregarDrawer_();
  }

  // ---------- detalhe ----------
  function Atividades_abrirDetalhe_(id) {
    Atividades_chamar_("Atividades_apiDetalhe", { id: id }, function (res) {
      var a = res.item, eu = res.eu;
      var antigo = document.getElementById("atvDetalheOverlay");
      var comentarioRascunho = antigo && antigo.querySelector("#atvComentario") ? antigo.querySelector("#atvComentario").value : "";
      if (antigo) antigo.remove();
      var souResp = a.RESPONSAVEL_ID === eu.id, dono = eu.gestor || a.CRIADO_POR_ID === eu.id;
      var aberta = Atividades_aberta_(a), podeAlt = Atividades_podeAlterar_(a);
      var linha = function (r, v) { return v ? "<dt>" + r + "</dt><dd>" + v + "</dd>" : ""; };
      var hist = (res.historico || []).map(function (h) {

          (h.TIPO === "JUSTIFICATIVA" ? "<div>Previsão: " + Atividades_br_(h.PREVISAO_ANTERIOR) + " para " + Atividades_br_(h.PREVISAO_NOVA) + "</div>" : "") +

      var corpo =
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">' + Atividades_sitHtml_(a.SITUACAO) + " " + Atividades_seloHtml_(a) +
          (a.AGORA_DESDE ? '<span class="atv-selo emdia"><i class="fas fa-person-digging" aria-hidden="true"></i> Fazendo agora ' + Atividades_duracao_(a.AGORA_DESDE) + "</span>" : "") + Atividades_selosOrigemHtml_(a) + "</div>" +

        '<dl class="atv-det-grade">' +
          linha("Responsável", Atividades_esc_(a.RESPONSAVEL_NOME)) + linha("Lançada por", Atividades_esc_(a.CRIADO_POR_NOME)) +
          linha("Prioridade", '<span class="atv-pri-' + Atividades_esc_(a.PRIORIDADE) + '">' + Atividades_esc_(a.PRIORIDADE) + "</span>") +

          linha("Iniciada em", Atividades_br_(a.INICIADA_EM)) + linha("Concluída em", Atividades_br_(a.CONCLUIDA_EM)) +
          linha("Aguardando", a.SITUACAO === "Aguardando" ? Atividades_esc_(a.MOTIVO_AGUARDANDO) : "") +
          linha("Observação final", Atividades_esc_(a.OBS_CONCLUSAO)) +
          linha("Por quê", Atividades_esc_(a.POR_QUE)) + linha("Onde", Atividades_esc_(a.ONDE)) +
          linha("Como", a.COMO ? '<span style="white-space:pre-wrap">' + Atividades_esc_(a.COMO) + "</span>" : "") + linha("Quanto", Atividades_esc_(a.QUANTO)) +
          linha("Lançada no", a.SISTEMA_ORIGEM === "COMMAND" ? "METROLABS COMMAND" : "") +
          linha("Plano de ação", res.plano ? Atividades_esc_(res.plano.CODIGO + " · " + res.plano.FASE_NOME + (res.plano.CICLO > 1 ? " · ciclo " + res.plano.CICLO : "")) + '<div class="atv-sub">O ciclo PDCA (verificar a eficácia e padronizar) é acompanhado no Programa de conduta, aba Qualidade e planos.</div>' : "") +
        "</dl>" +
        (aberta && (souResp || eu.gestor) ? '<div class="atv-campo" style="display:flex;gap:8px;align-items:flex-end"><div style="flex:1"><label for="atvPerc">Andamento (%)</label><input type="number" id="atvPerc" min="0" max="100" step="5" placeholder="0 a 100" value="' + Atividades_esc_(a.PERCENTUAL) + '"></div><button type="button" class="btn-secondary atv-mini" style="height:36px!important" onclick="Atividades_salvarPercentual_(\'' + a.ID + '\')">Gravar andamento</button></div>' : "") +
        '<div class="atv-acoes" style="margin-bottom:14px">' + acoes.join("") + "</div>" +
        (podeAlt ? '<div class="atv-campo"><label for="atvComentario">Comentário</label><textarea id="atvComentario" maxlength="4000" placeholder="Registre um andamento, dúvida ou combinado"></textarea></div>' +
        '<div style="text-align:right;margin-bottom:14px"><button type="button" class="btn-secondary atv-mini" onclick="Atividades_comentar_(\'' + a.ID + '\', this)">Comentar</button></div>' : "") +
        '<h4 style="margin:0 0 8px;font-size:13px">Histórico</h4><div class="atv-hist">' + hist + "</div>";
      var ov = Atividades_modal_(Atividades_esc_(a.TITULO), corpo, "", { id: "atvDetalheOverlay", largura: 700 });
      ov.dataset.id = a.ID;
      var bEd = ov.querySelector('[data-x="editar"]');
      if (bEd) bEd.onclick = function () { Atividades_abrirFormulario_({ editar: a }); };
      if (comentarioRascunho && ov.querySelector("#atvComentario")) ov.querySelector("#atvComentario").value = comentarioRascunho;
    }, null, { carregando: "Abrindo atividade..." });
  }

  function Atividades_salvarPercentual_(id) {
    var v = (document.getElementById("atvPerc") || {}).value;
    Atividades_chamar_("Atividades_apiPercentual", { id: id, percentual: v }, function () { Atividades_aposAlterar_(); }, null, { carregando: "Gravando andamento..." });
  }

  function Atividades_comentar_(id, btn) {
    var ta = document.getElementById("atvComentario");
    var texto = ta ? ta.value.trim() : "";
    if (texto.length < 2) { alert("Não foi possível comentar: o texto está vazio. Escreva o comentário e clique em Comentar de novo."); return; }
    btn.disabled = true;
    Atividades_chamar_("Atividades_apiComentar", { id: id, texto: texto }, function () { if (ta) ta.value = ""; Atividades_abrirDetalhe_(id); },
      function (m) { btn.disabled = false; alert(m); }, { carregando: "Registrando comentário..." });
  }

  // ---------- formulário: nova atividade ----------
  /** pre.editar = atividade já lançada: abre o mesmo formulário preenchido, em modo de edição. */
  function Atividades_abrirFormulario_(pre) {
    var p = pre || {};
    var ed = p.editar || null;
    Atividades_garantirOpcoes_(function (op) {
      var eu = op.eu;
      var respSel = ed ? ed.RESPONSAVEL_ID : (p.responsavelId || eu.id);
      var lista = op.usuarios.slice();
      if (ed && respSel && !lista.some(function (u) { return u.id === respSel; })) lista.unshift({ id: respSel, nome: ed.RESPONSAVEL_NOME + " (inativo)" });
      var pessoas = lista.map(function (u) { return '<option value="' + Atividades_esc_(u.id) + '"' + (u.id === respSel ? " selected" : "") + ">" + Atividades_esc_(u.nome) + (u.id === eu.id ? " (eu)" : "") + "</option>"; }).join("");
      var modSel = ed ? ed.MODULO : p.modulo;
      var modsMenu = Atividades_modulosDoMenu_();
      if (modSel && !modsMenu.some(function (m) { return m.chave === modSel; })) modsMenu.push({ chave: modSel, nome: (ed && ed.MODULO_NOME) || modSel });
      var mods = '<option value="">Nenhum</option>' + modsMenu.map(function (m) { return '<option value="' + Atividades_esc_(m.chave) + '"' + (m.chave === modSel ? " selected" : "") + ">" + Atividades_esc_(m.nome) + "</option>"; }).join("");
      var prazoPadrao = new Date(); prazoPadrao.setDate(prazoPadrao.getDate() + 1); prazoPadrao.setHours(18, 0, 0, 0);
      var priSel = ed ? ed.PRIORIDADE : "Normal";
      var vencida = ed && Atividades_vencida_(ed);
      var avisoEd = "";
      if (ed && eu.gestor && vencida) avisoEd = '<div class="atv-msg" style="border:1px solid var(--warning);background:var(--warning-bg);color:var(--text)">Esta atividade está com prazo vencido. Se você mudar o prazo para uma data futura, ela é replanejada: deixa de exigir justificativa de atraso do responsável e o replanejamento fica no histórico (não conta como justificativa).</div>';
      else if (ed && !eu.gestor && vencida) avisoEd = '<div class="atv-msg" style="border:1px solid var(--warning);background:var(--warning-bg);color:var(--text)">Esta atividade está com prazo vencido: o prazo só pode ser mudado depois de registrar a justificativa de atraso. Os demais campos podem ser alterados.</div>';
      var corpo =
        '<div id="atvFormMsg"></div>' + avisoEd +
        '<div class="atv-campo"><label for="atvF_titulo">Título *</label><input id="atvF_titulo" type="text" maxlength="200" placeholder="O que precisa ser feito"></div>' +
        '<div class="atv-campo"><label for="atvF_desc">Descrição</label><textarea id="atvF_desc" maxlength="4000" placeholder="Detalhes, critérios de pronto, contatos"></textarea></div>' +
        '<div class="atv-grade2">' +
          '<div class="atv-campo"><label for="atvF_resp">Responsável *</label><select id="atvF_resp"' + (eu.gestor ? "" : " disabled title=\"Somente Gestor, Admin e Diretoria " + (ed ? "trocam o responsável" : "lançam atividade para outra pessoa") + ".\"") + ">" + pessoas + "</select>" +
            (eu.gestor ? (ed ? '<div class="atv-sub">Ao trocar, o novo responsável é avisado e a troca fica no histórico.</div>' : "") : '<div class="atv-sub">' + (ed ? "Só a gestão troca o responsável." : "Você lança atividades só para você. Para outra pessoa, peça a um gestor.") + "</div>") + "</div>" +
          '<div class="atv-campo"><label for="atvF_pri">Prioridade</label><select id="atvF_pri">' + op.prioridades.map(function (x) { return "<option" + (x === priSel ? " selected" : "") + ">" + Atividades_esc_(x) + "</option>"; }).join("") + "</select></div>" +
          '<div class="atv-campo"><label for="atvF_ini">Início previsto</label><input id="atvF_ini" type="datetime-local"></div>' +
          '<div class="atv-campo"><label for="atvF_prazo">Prazo *</label><input id="atvF_prazo" type="datetime-local" value="' + Atividades_esc_(ed ? ed.PRAZO : Atividades_iso_(prazoPadrao)) + '"></div>' +
          '<div class="atv-campo"><label for="atvF_mod">Módulo ligado</label><select id="atvF_mod">' + mods + "</select></div>" +
        "</div>" +
        '<div class="atv-grade2">' +
          '<div class="atv-campo"><label for="atvF_cli_busca">Cliente</label>' + SGO_htmlBuscaClienteLike_("atvF_cli", "Nome ou CNPJ do cliente (opcional)") + "</div>" +
          '<div class="atv-campo"><label for="atvF_uni">Unidade</label><select id="atvF_uni"><option value="">Escolha o cliente ao lado</option></select></div>' +
        "</div>" +
        '<details class="atv-5w2h"' + (ed && (ed.POR_QUE || ed.ONDE || ed.COMO || ed.QUANTO) ? " open" : "") + '><summary>Planejamento 5W2H (opcional)</summary>' +
          '<div class="atv-sub" style="margin:6px 0 10px">O quê é o título, quando é o prazo e quem é o responsável. Complete o que ajudar quem vai executar.</div>' +
          '<div class="atv-campo"><label for="atvF_porque">Por quê (objetivo)</label><textarea id="atvF_porque" maxlength="1000" placeholder="Para que serve esta atividade"></textarea></div>' +
          '<div class="atv-grade2">' +
            '<div class="atv-campo"><label for="atvF_onde">Onde</label><input id="atvF_onde" type="text" maxlength="300" placeholder="Local, setor ou sistema"></div>' +
            '<div class="atv-campo"><label for="atvF_quanto">Quanto (custo ou recurso)</label><input id="atvF_quanto" type="text" maxlength="300" placeholder="Ex.: sem custo, 2 horas, R$ 150,00"></div>' +
          "</div>" +
          '<div class="atv-campo"><label for="atvF_como">Como (passos)</label><textarea id="atvF_como" maxlength="2000" placeholder="Como a atividade deve ser feita"></textarea></div>' +
        "</details>" +
        '<label class="atv-check"><input type="checkbox" id="atvF_restrita"' + (ed && ed.RESTRITA === "SIM" ? " checked" : "") + (ed && ed.MODULO === "conduta" ? " disabled" : "") + '> Restrita: só o responsável, quem lançou e a gestão veem' + (ed && ed.MODULO === "conduta" ? " (atividades do Programa de conduta são sempre restritas)" : "") + "</label>" +
        (ed ? '<div class="atv-sub">A situação muda pelos botões do detalhe ou arrastando no Kanban. Toda alteração fica registrada no histórico.</div>' : '<div class="atv-sub">Sem marcar "Restrita", a equipe toda vê a atividade em Atividades da equipe; só o responsável, quem lançou e a gestão alteram.</div>');
      var ov = Atividades_modal_(ed ? "Editar atividade" : "Nova atividade", corpo,
        '<button type="button" class="btn-secondary" data-x="cancelar">Cancelar</button><button type="button" class="btn-primary" data-x="ok">' + (ed ? "Salvar alterações" : "Salvar atividade") + "</button>", { id: "atvFormOverlay", largura: 680 });
      if (ed) {
        ov.dataset.editId = ed.ID;
        ov.querySelector("#atvF_titulo").value = ed.TITULO || "";
        ov.querySelector("#atvF_desc").value = ed.DESCRICAO || "";
        ov.querySelector("#atvF_ini").value = ed.INICIO_PREVISTO || "";
        ov.querySelector("#atvF_porque").value = ed.POR_QUE || "";
        ov.querySelector("#atvF_onde").value = ed.ONDE || "";
        ov.querySelector("#atvF_como").value = ed.COMO || "";
        ov.querySelector("#atvF_quanto").value = ed.QUANTO || "";
      }
      ov.querySelector('[data-x="cancelar"]').onclick = function () { ov.remove(); };
      ov.querySelector('[data-x="ok"]').onclick = function () { Atividades_enviarFormulario_(ov); };
      SGO_montarBuscaClienteLike_("atvF_cli", op.clientes, function (idCli) { Atividades_carregarUnidades_(idCli); });
      if (ed && ed.CLIENTE_ID) {
        SGO_prefillBuscaClienteLike_("atvF_cli", ed.CLIENTE_ID, ed.CLIENTE_NOME);
        Atividades_carregarUnidades_(ed.CLIENTE_ID, ed.UNIDADE_ID, ed.UNIDADE_NOME);
      }
      ov.querySelector("#atvF_titulo").focus();
    });
  }

  /** Abre a edição a partir da lista: busca a versão atual no servidor antes de preencher. */
  function Atividades_editarPorId_(id) {
    Atividades_chamar_("Atividades_apiDetalhe", { id: id }, function (res) { Atividades_abrirFormulario_({ editar: res.item }); }, null, { carregando: "Abrindo atividade..." });
  }

  function Atividades_carregarUnidades_(clienteId, selecionarId, selecionarNome) {
    var sel = document.getElementById("atvF_uni");
    if (!sel) return;
    if (!clienteId) { sel.innerHTML = '<option value="">Escolha o cliente ao lado</option>'; return; }
    sel.innerHTML = selecionarId ? '<option value="' + Atividades_esc_(selecionarId) + '" selected>' + Atividades_esc_(selecionarNome || "Carregando...") + "</option>" : '<option value="">Carregando...</option>';
    Atividades_chamar_("Atividades_apiUnidades", { clienteId: clienteId }, function (res) {
      var s = document.getElementById("atvF_uni"); if (!s) return;
      var unis = res.unidades.slice();
      if (selecionarId && !unis.some(function (u) { return u.ID === selecionarId; })) unis.unshift({ ID: selecionarId, NOME: (selecionarNome || selecionarId) + " (inativa)" });
      s.innerHTML = '<option value="">' + (unis.length ? "Nenhuma (opcional)" : "Cliente sem unidade ativa") + "</option>" +
        unis.map(function (u) { return '<option value="' + Atividades_esc_(u.ID) + '"' + (u.ID === selecionarId ? " selected" : "") + ">" + Atividades_esc_(u.NOME) + "</option>"; }).join("");
    }, function () { var s = document.getElementById("atvF_uni"); if (s && !selecionarId) s.innerHTML = '<option value="">Não foi possível carregar as unidades</option>'; });
  }

  function Atividades_enviarFormulario_(ov) {
    var v = function (id) { var el = ov.querySelector("#" + id); return el ? String(el.value || "").trim() : ""; };
    var msg = ov.querySelector("#atvFormMsg");
    var editId = ov.dataset.editId || "";
    var verbo = "salvar a atividade", botaoNome = editId ? "Salvar alterações" : "Salvar atividade";
    var erro = function (t, campo) { msg.innerHTML = '<div class="atv-msg erro">' + Atividades_esc_(t) + "</div>"; var el = campo && ov.querySelector("#" + campo); if (el) el.focus(); ov.querySelector(".atv-modal-corpo").scrollTop = 0; };
    var d = {
      titulo: v("atvF_titulo"), descricao: v("atvF_desc"), responsavelId: v("atvF_resp"), prioridade: v("atvF_pri"),
      inicioPrevisto: v("atvF_ini"), prazo: v("atvF_prazo"), modulo: v("atvF_mod"), clienteId: v("atvF_cli"), unidadeId: v("atvF_uni"),
      porQue: v("atvF_porque"), onde: v("atvF_onde"), como: v("atvF_como"), quanto: v("atvF_quanto")
    };
    var chkR = ov.querySelector("#atvF_restrita");
    if (chkR && !chkR.disabled) d.restrita = !!chkR.checked;
    d.moduloNome = d.modulo ? Atividades_nomeModulo_(d.modulo) : "";
    if (d.titulo.length < 3) return erro("Não foi possível " + verbo + ": o título está vazio ou curto demais. Escreva no campo Título o que precisa ser feito e clique em " + botaoNome + " de novo.", "atvF_titulo");
    if (!d.prazo) return erro("Não foi possível " + verbo + ": o prazo não foi informado. Preencha o campo Prazo com data e hora e clique em " + botaoNome + " de novo.", "atvF_prazo");
    if (d.inicioPrevisto && d.inicioPrevisto > d.prazo) return erro("Não foi possível " + verbo + ": o início previsto está depois do prazo. Ajuste uma das datas e clique em " + botaoNome + " de novo.", "atvF_ini");
    if (v("atvF_cli_busca") && !d.clienteId) return erro("Não foi possível " + verbo + ": o cliente digitado não foi escolhido na lista. Clique no nome do cliente na lista que aparece, ou apague o campo.", "atvF_cli_busca");
    var botao = ov.querySelector('[data-x="ok"]'); botao.disabled = true;
    if (editId) {
      d.id = editId;
      Atividades_chamar_("Atividades_apiEditar", d, function (res) {
        ov.remove();
        frotaToastEnvio_(true, "Atividade alterada", res.message || "");
        Atividades_aposAlterar_();
        Atividades_verificar_();
      }, function (m) { botao.disabled = false; erro(m); }, { carregando: "Salvando alterações..." });
      return;
    }
    Atividades_chamar_("Atividades_apiCriar", d, function (res) {
      ov.remove();
      frotaToastEnvio_(true, "Atividade salva", res.message || "");
      Atividades_aposAlterar_();
    }, function (m) { botao.disabled = false; erro(m); }, { carregando: "Salvando atividade..." });
  }

  // ---------- componentes: lista, kanban, agenda ----------
  function Atividades_listaHtml_(itens, opcoes) {
    var o = opcoes || {};
    if (!itens.length) return '<div class="atv-vazio">' + (o.vazio || "Nenhuma atividade encontrada com estes filtros.") + "</div>";
    var linhas = itens.map(function (a) {
      var aberta = Atividades_aberta_(a), alt = Atividades_podeAlterar_(a);
      var b = [];
      if (aberta && o.minhas) b.push(a.AGORA_DESDE ? '<button type="button" class="btn-secondary" title="Parar de marcar como em execução" onclick="Atividades_fazendoAgora_(\'' + a.ID + '\', false)">Parar fazendo agora</button>' : '<button type="button" class="btn-secondary" title="Marcar como a atividade que estou executando" onclick="Atividades_fazendoAgora_(\'' + a.ID + '\')">Fazendo agora</button>');
      if (alt && aberta && a.SITUACAO !== "Em andamento") b.push('<button type="button" class="btn-secondary" title="Muda a situação para Em andamento" onclick="Atividades_mudarSituacao_(\'' + a.ID + '\', \'Em andamento\')">Iniciar</button>');
      if (alt && aberta && a.SITUACAO !== "Aguardando") b.push('<button type="button" class="btn-secondary" onclick="Atividades_mudarSituacao_(\'' + a.ID + '\', \'Aguardando\')">Aguardando</button>');
      if (alt && aberta) b.push('<button type="button" class="btn-primary" onclick="Atividades_mudarSituacao_(\'' + a.ID + '\', \'Concluída\')">Concluir</button>');
      if (Atividades_podeEditar_(a)) b.push('<button type="button" class="btn-secondary" title="Editar a atividade" onclick="Atividades_editarPorId_(\'' + a.ID + '\')">Editar</button>');
      return "<tr>" +
        '<td><button type="button" class="atv-titulo-link" onclick="Atividades_abrirDetalhe_(\'' + a.ID + '\')">' + Atividades_esc_(a.TITULO) + "</button>" +
          (a.AGORA_DESDE ? ' <span class="atv-selo emdia" title="Em execução">Agora</span>' : "") + Atividades_selosOrigemHtml_(a) +
          '<div class="atv-sub">' + [o.mostrarResp ? Atividades_esc_(a.RESPONSAVEL_NOME) : "", Atividades_esc_(a.MODULO_NOME), Atividades_esc_(a.CLIENTE_NOME)].filter(Boolean).join(" · ") + "</div></td>" +
        '<td><span class="atv-pri-' + Atividades_esc_(a.PRIORIDADE) + '">' + Atividades_esc_(a.PRIORIDADE) + "</span></td>" +
        "<td>" + Atividades_prazoTexto_(a) + "</td>" +
        "<td>" + Atividades_seloHtml_(a) + "</td>" +
        "<td>" + Atividades_sitHtml_(a.SITUACAO) + (a.PERCENTUAL !== "" ? '<div class="atv-sub">' + Atividades_num_(a.PERCENTUAL) + "%</div>" : "") + "</td>" +
        '<td><div class="atv-acoes">' + b.join("") + "</div></td></tr>";
    }).join("");
    if (typeof ehMobileModo_ === "function" && ehMobileModo_()) return Atividades_cartoesHtml_(itens, o);
    return '<div class="list-card"><div class="table-wrap"><table class="table"><thead><tr><th>Atividade</th><th>Prioridade</th><th>Prazo / previsão</th><th>Situação do prazo</th><th>Situação</th><th>Ações</th></tr></thead><tbody>' + linhas + "</tbody></table></div></div>";
  }

  /** Celular: um cartão por atividade (a tabela de 6 colunas não cabe em 360 px). */
  function Atividades_cartoesHtml_(itens, o) {
    return '<div class="atv-cartoes">' + itens.map(function (a) {
      var aberta = Atividades_aberta_(a), venc = Atividades_vencida_(a), b = [], alt = Atividades_podeAlterar_(a);
      if (alt && aberta && a.SITUACAO !== "Em andamento") b.push('<button type="button" class="btn-secondary" title="Muda a situação para Em andamento" onclick="Atividades_mudarSituacao_(\'' + a.ID + '\', \'Em andamento\')">Iniciar</button>');
      if (alt && aberta) b.push('<button type="button" class="btn-primary" onclick="Atividades_mudarSituacao_(\'' + a.ID + '\', \'Concluída\')">Concluir</button>');
      b.push('<button type="button" class="btn-secondary" onclick="Atividades_abrirDetalhe_(\'' + a.ID + '\')">Detalhes</button>');
      return '<div class="atv-cartao' + (venc ? " vencida" : "") + '" style="border-left-color:' + (ATV_CORES[a.SITUACAO] || "var(--muted)") + '">' +
        '<button type="button" class="atv-titulo-link" onclick="Atividades_abrirDetalhe_(\'' + a.ID + '\')">' + Atividades_esc_(a.TITULO) + "</button>" +
        '<div class="atv-sub">' + [o.mostrarResp ? Atividades_esc_(a.RESPONSAVEL_NOME) : "", Atividades_esc_(a.MODULO_NOME), Atividades_esc_(a.CLIENTE_NOME)].filter(Boolean).join(" · ") + "</div>" +
        '<div class="atv-cartao-linha">' + Atividades_sitHtml_(a.SITUACAO) + " " + Atividades_seloHtml_(a) + (a.AGORA_DESDE ? ' <span class="atv-selo emdia">Fazendo agora</span>' : "") + Atividades_selosOrigemHtml_(a) + "</div>" +
        '<div class="atv-cartao-linha"><span>Prazo: ' + Atividades_prazoTexto_(a) + '</span><span class="atv-pri-' + Atividades_esc_(a.PRIORIDADE) + '">· ' + Atividades_esc_(a.PRIORIDADE) + "</span>" + (a.PERCENTUAL !== "" ? "<span>· " + Atividades_num_(a.PERCENTUAL) + "%</span>" : "") + "</div>" +
        '<div class="atv-acoes">' + b.join("") + "</div></div>";
    }).join("") + "</div>";
  }

  function Atividades_kanbanHtml_(itens, ctx, opcoes) {
    var o = opcoes || {};
    var cols = ATV_SITUACOES_KANBAN.map(function (s) {
      var doCol = itens.filter(function (a) { return a.SITUACAO === s; });
      if (s === "Concluída") doCol = doCol.sort(function (a, b) { return a.CONCLUIDA_EM < b.CONCLUIDA_EM ? 1 : -1; }).slice(0, 30);
      var cards = doCol.map(function (a) {
        var venc = Atividades_vencida_(a), alt = Atividades_podeAlterar_(a);
        return '<div class="atv-kcard' + (venc ? " vencida" : "") + (alt ? "" : " so-ver") + '" draggable="' + (alt ? "true" : "false") + '" data-id="' + Atividades_esc_(a.ID) + '" style="border-left-color:' + ATV_CORES[a.SITUACAO] + '"' + (alt ? "" : ' title="Você acompanha esta atividade; quem altera é o responsável, quem lançou e a gestão"') + ">" +
          '<div class="atv-kcard-tit">' + Atividades_esc_(a.TITULO) + Atividades_selosOrigemHtml_(a) + "</div>" +
          '<div class="atv-sub">' + [o.mostrarResp ? Atividades_esc_(a.RESPONSAVEL_NOME) : "", o.semModulo ? "" : Atividades_esc_(a.MODULO_NOME), Atividades_esc_(a.CLIENTE_NOME)].filter(Boolean).join(" · ") + "</div>" +
          (a.PERCENTUAL !== "" && a.PERCENTUAL !== undefined ? '<div class="atv-barra-prog"><div style="width:' + Number(a.PERCENTUAL) + '%"></div></div>' : "") +

  /** Liga arrastar/soltar e clique nos cartões de um Kanban já desenhado. */

    var rotulo, grade;
    if (ATV.agendaModo === "semana") {
      var ini = segunda(ref), fimS = new Date(ini); fimS.setDate(fimS.getDate() + 6);
      rotulo = "Semana de " + Atividades_br_(Atividades_iso_(ini)).slice(0, 5) + " a " + Atividades_br_(Atividades_iso_(fimS)).slice(0, 10);

      rotulo = meses[ref.getMonth()] + " de " + ref.getFullYear();

      for (var j = 0; j < 42; j++) {
        var d2 = new Date(ini2); d2.setDate(ini2.getDate() + j);

          '<div class="atv-dia-corpo">' + ev2.slice(0, 4).map(evHtml).join("") + (ev2.length > 4 ? '<div class="atv-sub">mais ' + (ev2.length - 4) + "</div>" : "") + "</div></div>");

  // ---------- Gantt (SVG próprio) ----------
  function Atividades_ganttHtml_(itens, largura) {
    var f = ATV.equipeFiltros;
    var ini = Atividades_parse_(f.de + "T00:00"), fim = Atividades_parse_(f.ate + "T23:59");
    if (!ini || !fim || fim <= ini) return '<div class="atv-msg erro">Não foi possível montar o Gantt: o período está inválido. Ajuste as datas "Período de" e "até".</div>';
    if (!itens.length) return '<div class="atv-vazio">Nenhuma atividade no período e filtros escolhidos.</div>';
    var dias = Math.round((fim - ini) / 86400000) + 1;
    var rotuloW = 230, W = Math.max(largura - 2, rotuloW + dias * 22), area = W - rotuloW - 10;
    var pxDia = area / dias, linhaH = 26, cabH = 40;
    var x = function (iso) { var d = Atividades_parse_(iso); if (!d) return rotuloW; var v = rotuloW + ((d - ini) / 86400000) * pxDia; return Math.max(rotuloW, Math.min(rotuloW + area, v)); };
    var ordenados = itens.slice().sort(function (a, b) { return Atividades_inicioBarra_(a) < Atividades_inicioBarra_(b) ? -1 : 1; });
    var linhas = []; // {rotulo, sub, itens:[], grupo}
    if (f.agrupar === "atividade") {
      ordenados.forEach(function (a) { linhas.push({ rotulo: a.TITULO, sub: a.RESPONSAVEL_NOME, itens: [a] }); });
    } else {
      var grupos = {}, ordem = [];
      ordenados.forEach(function (a) { var k = a.RESPONSAVEL_ID; if (!grupos[k]) { grupos[k] = { nome: a.RESPONSAVEL_NOME, faixas: [] }; ordem.push(k); } var g = grupos[k];
        var i0 = Atividades_inicioBarra_(a), placed = false;
        for (var i = 0; i < g.faixas.length && !placed; i++) { if (g.faixas[i].fim < i0) { g.faixas[i].itens.push(a); g.faixas[i].fim = Atividades_fimBarra_(a); placed = true; } }
        if (!placed) g.faixas.push({ fim: Atividades_fimBarra_(a), itens: [a] });
      });
      ordem.sort(function (p, q) { return grupos[p].nome.localeCompare(grupos[q].nome); }).forEach(function (k) {
        grupos[k].faixas.forEach(function (fx, i) { linhas.push({ rotulo: i === 0 ? grupos[k].nome : "", sub: i === 0 ? Atividades_pl_(grupos[k].faixas.reduce(function (s, z) { return s + z.itens.length; }, 0), "atividade", "atividades") : "", itens: fx.itens, grupo: i === 0 }); });
      });
    }
    var H = cabH + linhas.length * linhaH + 10;
    var s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" role="img" aria-label="Gráfico de Gantt das atividades" style="display:block">');
    s.push('<defs><pattern id="atvListra" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#c2953f" opacity=".85"/></pattern></defs>');
    // grade de dias e cabeçalho
    var passoRot = pxDia >= 26 ? 1 : pxDia >= 12 ? 2 : pxDia >= 6 ? 7 : 14;
    for (var i = 0; i < dias; i++) {
      var d = new Date(ini); d.setDate(ini.getDate() + i);
      var xx = rotuloW + i * pxDia;
      var fimSemana = d.getDay() === 0 || d.getDay() === 6;
      if (fimSemana) s.push('<rect x="' + xx.toFixed(1) + '" y="' + cabH + '" width="' + pxDia.toFixed(1) + '" height="' + (H - cabH) + '" fill="rgba(127,127,127,.07)"/>');
      if (d.getDate() === 1 || i === 0) s.push('<text x="' + (xx + 2).toFixed(1) + '" y="14" font-size="11" font-weight="700" fill="var(--text)">' + ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][d.getMonth()] + "/" + d.getFullYear() + "</text>");
      if (i % passoRot === 0) {
        s.push('<line x1="' + xx.toFixed(1) + '" y1="' + (cabH - 6) + '" x2="' + xx.toFixed(1) + '" y2="' + H + '" stroke="rgba(127,127,127,.18)"/>');
        s.push('<text x="' + (xx + 2).toFixed(1) + '" y="' + (cabH - 10) + '" font-size="10" fill="var(--muted)">' + Atividades_p2_(d.getDate()) + "</text>");
      }
    }
    // linhas
    linhas.forEach(function (ln, idx) {
      var y = cabH + idx * linhaH;
      if (ln.grupo && idx > 0) s.push('<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="rgba(127,127,127,.35)"/>');
      if (ln.rotulo) {
        var rot = String(ln.rotulo); if (rot.length > 30) rot = rot.slice(0, 29) + "…";
        s.push('<text x="8" y="' + (y + 12) + '" font-size="12" font-weight="700" fill="var(--text)">' + Atividades_esc_(rot) + "</text>");
        if (ln.sub) s.push('<text x="8" y="' + (y + 23) + '" font-size="10" fill="var(--muted)">' + Atividades_esc_(ln.sub) + "</text>");
      }
      ln.itens.forEach(function (a) {
        var x0 = x(Atividades_inicioBarra_(a)), xp = x(a.PRAZO), xprev = x(a.PREVISAO_ATUAL), xf = x(Atividades_fimBarra_(a));
        var venc = Atividades_vencida_(a), cor = ATV_CORES[a.SITUACAO] || "#888";
        var by = y + 5, bh = linhaH - 10;
        var tip = a.TITULO + " — " + a.RESPONSAVEL_NOME + "\nSituação: " + a.SITUACAO + (venc ? " (vencida)" : "") + "\nInício: " + Atividades_br_(Atividades_inicioBarra_(a)) + "\nPrazo: " + Atividades_br_(a.PRAZO) +
          (a.PREVISAO_ATUAL !== a.PRAZO ? "\nPrevisão atual: " + Atividades_br_(a.PREVISAO_ATUAL) : "") + (a.CONCLUIDA_EM ? "\nConcluída em: " + Atividades_br_(a.CONCLUIDA_EM) : "") + (a.PERCENTUAL !== "" ? "\nAndamento: " + a.PERCENTUAL + "%" : "") + (a.SISTEMA_ORIGEM === "COMMAND" ? "\nLançada no COMMAND" : "");
        s.push('<g data-atv="' + Atividades_esc_(a.ID) + '" style="cursor:pointer"><title>' + Atividades_esc_(tip) + "</title>");
        var wBase = Math.max(8, xp - x0);
        s.push('<rect x="' + x0.toFixed(1) + '" y="' + by + '" width="' + wBase.toFixed(1) + '" height="' + bh + '" rx="3" fill="' + cor + '"' + (venc ? ' stroke="#e05252" stroke-width="2"' : "") + "/>");
        if (a.PERCENTUAL !== "" && Number(a.PERCENTUAL) > 0 && Atividades_aberta_(a)) s.push('<rect x="' + x0.toFixed(1) + '" y="' + (by + bh - 4) + '" width="' + (wBase * Number(a.PERCENTUAL) / 100).toFixed(1) + '" height="4" fill="rgba(255,255,255,.75)"/>');
        if (xprev > xp + 0.5) s.push('<rect x="' + xp.toFixed(1) + '" y="' + by + '" width="' + (xprev - xp).toFixed(1) + '" height="' + bh + '" fill="url(#atvListra)" stroke="#c2953f" stroke-width="1"/>');
        if (venc && xf > Math.max(xp, xprev) + 0.5) s.push('<rect x="' + Math.max(xp, xprev).toFixed(1) + '" y="' + by + '" width="' + (xf - Math.max(xp, xprev)).toFixed(1) + '" height="' + bh + '" fill="rgba(224,82,82,.55)"/>');
        if (a.SITUACAO === "Concluída" && a.CONCLUIDA_EM > a.PRAZO && xf > xp + 0.5) s.push('<rect x="' + xp.toFixed(1) + '" y="' + by + '" width="' + (xf - xp).toFixed(1) + '" height="' + bh + '" fill="rgba(224,82,82,.35)"/>');
        if (a.AGORA_DESDE && Atividades_aberta_(a)) s.push('<circle cx="' + (x0 + 6).toFixed(1) + '" cy="' + (by + bh / 2) + '" r="3.5" fill="#fff"/>');
        var larg = Math.max(wBase, xf - x0);
        if (f.agrupar !== "atividade" || larg > 60) {
          var maxC = Math.floor((larg - 14) / 6.2);
          var t = String(a.TITULO); if (maxC > 3 && t.length > maxC) t = t.slice(0, maxC - 1) + "…";
          if (maxC > 3) s.push('<text x="' + (x0 + (a.AGORA_DESDE ? 13 : 5)).toFixed(1) + '" y="' + (by + bh / 2 + 4) + '" font-size="10.5" fill="#fff" font-weight="700" pointer-events="none">' + Atividades_esc_(t) + "</text>");
        }
        s.push("</g>");
      });
    });
    var agora = new Date();
    if (agora >= ini && agora <= fim) {
      var xh = x(Atividades_agoraIso_());
      s.push('<line x1="' + xh.toFixed(1) + '" y1="' + (cabH - 4) + '" x2="' + xh.toFixed(1) + '" y2="' + H + '" stroke="#1E4F7A" stroke-width="2"/>');
      s.push('<text x="' + (xh + 3).toFixed(1) + '" y="' + (cabH - 22) + '" font-size="10" font-weight="700" fill="#1E4F7A">hoje ' + Atividades_p2_(agora.getDate()) + "/" + Atividades_p2_(agora.getMonth() + 1) + '</text>');
    }
    s.push("</svg>");
    var leg = ATV_SITUACOES_KANBAN.map(function (k) { return '<span><i style="background:' + ATV_CORES[k] + '"></i>' + k + "</span>"; }).join("") +
      '<span><i style="border:1px solid #c2953f;background-image:repeating-linear-gradient(45deg,#c2953f 0 3px,transparent 3px 6px)"></i>Previsão adiada por justificativa</span>' +
      '<span><i style="background:rgba(224,82,82,.55);outline:2px solid #e05252"></i>Atrasada (vencida até hoje)</span>' +
      '<span><i style="background:#1E4F7A;width:3px"></i>Hoje</span><span><i style="background:#fff;border-radius:50%"></i>Fazendo agora</span>';
    return '<div class="atv-legenda">' + leg + '</div><div class="atv-gantt-wrap">' + s.join("") + "</div>";
  }

  // ---------- atualização automática (30 s, só com a aba visível e sem edição em andamento) ----------
  function Atividades_ligarTimerTela_() {
    if (ATV.timerTela) return;
    ATV.timerTela = setInterval(function () { Atividades_atualizarTela_(false); }, ATV_TELA_MS);
  }

  function Atividades_emEdicao_() {
    if (document.querySelector(".atv-overlay") || document.getElementById("atvJustOverlay")) return true;
    if (ATV.arrastando) return true;
    var foco = document.activeElement;
    return !!(foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName) && foco.closest("#conteudo, .atv-drawer"));
  }

  function Atividades_atualizarTela_(forcar) {
    if (!SESSION) return;
    if (!forcar && (document.visibilityState !== "visible" || Atividades_emEdicao_())) return;
    if (ATV.tela === "minhas" && document.getElementById("atvMinhasCorpo")) Atividades_carregarMinhas_();
    else if (ATV.tela === "equipe" && document.getElementById("atvEqCorpo")) Atividades_carregarEquipe_();
    if (ATV.drawerModulo && !forcar) Atividades_carregarDrawer_();
  }

  // ---------- Kanban do módulo (painel lateral injetado pela casca) ----------
  function Atividades_aoAbrirModulo_(mod) {
    ATV.modAtual = mod;
    if (mod !== "minhas_atividades" && mod !== "atividades_equipe") ATV.tela = "";
    Atividades_fecharDrawer_();
    if (!SESSION || Atividades_ehCliente_()) return;
    if (!mod || mod === "dashboard" || mod === "mobile_home" || mod === "minhas_atividades" || mod === "atividades_equipe" || mod === "avisos" || mod === "admin" || mod === "chaves") return;
    var cab = document.querySelector("#conteudo .module-header");
    if (!cab || cab.querySelector(".atv-btn-modulo")) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn-secondary atv-btn-modulo";
    b.title = "Atividades ligadas a este módulo, em Kanban";
    b.innerHTML = '<i class="fas fa-list-check" aria-hidden="true"></i>&nbsp;Atividades do módulo';
    b.onclick = function () { Atividades_abrirDrawer_(mod); };
    var direita = cab.querySelector(".module-header-right");
    if (direita) direita.appendChild(b);
    else { cab.style.display = "flex"; cab.style.alignItems = "center"; cab.style.gap = "12px"; cab.appendChild(b); }
  }

  function Atividades_abrirDrawer_(mod) {
    Atividades_fecharDrawer_();
    ATV.drawerModulo = mod;
    var nome = Atividades_nomeModulo_(mod);
    var dr = document.createElement("div");
    dr.className = "atv-drawer"; dr.id = "atvDrawer";
    dr.setAttribute("role", "dialog"); dr.setAttribute("aria-label", "Atividades do módulo " + nome);
    dr.innerHTML = '<div class="atv-drawer-cab"><h3>Atividades do módulo: ' + Atividades_esc_(nome) + "</h3>" +
      '<div style="display:flex;gap:8px"><button type="button" class="btn-primary atv-mini" id="atvDrawerNova"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Nova atividade neste módulo</button>' +
      '<button type="button" class="atv-fechar" aria-label="Fechar" onclick="Atividades_fecharDrawer_()">&times;</button></div></div>' +
      '<div class="atv-drawer-corpo" id="atvDrawerCorpo"><div class="atv-vazio">Carregando...</div></div>';
    document.body.appendChild(dr);
    dr.querySelector("#atvDrawerNova").onclick = function () { Atividades_abrirFormulario_({ modulo: mod }); };
    Atividades_carregarDrawer_();
    Atividades_ligarTimerTela_();
  }

  function Atividades_carregarDrawer_() {
    var mod = ATV.drawerModulo;
    if (!mod) return;
    Atividades_chamar_("Atividades_apiListarModulo", { modulo: mod }, function (res) {
      var corpo = document.getElementById("atvDrawerCorpo");
      if (!corpo || ATV.drawerModulo !== mod) return;
      ATV.drawerItens = res.itens || [];
      corpo.innerHTML = '<div class="atv-legenda">' + (res.gestor ? "Todas as atividades ligadas a este módulo. Arraste o cartão para mudar a situação; clique para abrir o detalhe." : "Atividades da equipe ligadas a este módulo. Você arrasta as suas e as que lançou; as demais (borda tracejada) você acompanha. Clique para abrir o detalhe.") + "</div>" +
        Atividades_kanbanHtml_(ATV.drawerItens, "modulo", { mostrarResp: true, semModulo: true });
      Atividades_ligarKanban_(corpo, ATV.drawerItens);
    }, function (m) { var corpo = document.getElementById("atvDrawerCorpo"); if (corpo) corpo.innerHTML = '<div class="atv-msg erro">' + Atividades_esc_(m) + "</div>"; }, { silencioso: true });
  }

  function Atividades_fecharDrawer_() {
    var dr = document.getElementById("atvDrawer");
    if (dr) dr.remove();
    ATV.drawerModulo = ""; ATV.drawerItens = [];
  }
</script>

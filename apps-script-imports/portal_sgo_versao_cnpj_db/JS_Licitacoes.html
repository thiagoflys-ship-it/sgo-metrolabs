<!--
  SGO+ LICITAÇÕES — telas da etapa 1 (01/11/2026): Hoje em Licitações, Oportunidades (lista, filtros, ficha básica) e
  Portais e configurações (33 portais, teste de conexão real, registro das chamadas, parametrização, regras do radar).
  Visual dos protótipos de docs/prototipos_licitacoes (classes reais do SGO+: module-*, cm-*, gd-*, atv-*; prefixo lic- só
  no que é novo). Servidor: SGO_Licitacoes.js (Licitacoes_api) e SGO_Licitacoes_Config.js. Só Diretoria e Administrador
  (o servidor confere em toda chamada). Sem atualização automática: nada redesenha formulário aberto.
  Etapa 2 (02/11/2026): na ficha, abas "Arquivos" (edital e anexos com SHA-256, abrir e baixar, situação da extração do
  texto) e "Análise" (nota 0–100, critérios, fatos com a fonte, inferências, pendências, versão, "Refazer análise" com
  motivo); nota no cartão da lista e ordenação por nota. Servidor: SGO_Licitacoes_Analise.js.
  Etapa 3 (02/11/2026): "Agenda e prazos" (lista por dia com fonte, natureza, fuso, feriados e pendentes de confirmação),
  "Central de alertas" (estados 1 a 10, ciência, escalonamento, canal alternativo, retorno da Meta), aba "Prazos" na ficha
  (versões de cada prazo, confirmar data, data da ata) e "Regras dos alertas" em Portais e configurações. Servidor:
  SGO_Licitacoes_Agenda.js e SGO_Licitacoes_Alertas.js. Sem atualização automática: nada redesenha formulário aberto.
  Etapa 4 (02/11/2026): "Kanban" (licitações por etapa, do Radar ao Contrato; mover só nas transições que existem, sempre com
  motivo e histórico; no celular, uma etapa por aba), "Gantt" (prazos de LIC_EVENTOS no tempo, natureza visível, hoje marcado,
  zoom semana/mês; no celular, linha do tempo vertical) e "Painel" (Dashboard: números reais com a fonte, cada um abre a
  lista filtrada). Kanban e Gantt no molde dos do Comercial (cmk-*, cmg-*); barras de indicador das Atividades (atv-barra-ind).
  Servidor: SGO_Licitacoes_Painel.js.
  Filtro do ramo (03/11/2026): abas "Aguardando a análise" e "Descartadas pela IA" (segundo filtro pela IA, "Trazer de volta" com
  motivo), selo "Sem análise (prazo curto)", tipo de serviço no cartão, na ficha, no filtro da lista e no Painel, o termo que fez
  entrar no cartão e o motivo padronizado do descarte ("Fora do ramo" cria sugestão). Tela "Revisar o filtro do ramo" em
  JS_Licitacoes_Ramo.html. Servidor: SGO_Licitacoes_Ramo.js.
-->

<style>
.vinc-workspace{padding:18px;font-family:var(--bc-sans)}.module-grid.vinc-cadastros-grid{grid-template-columns:minmax(340px,.9fr) minmax(380px,1.1fr)}.vinc-cadastros-grid .form-grid>div:first-child{grid-column:1/-1}.vinc-cadastros-grid #cli_cnpj,.vinc-cadastros-grid #uni_cnpj_unidade{min-width:0!important}.vinc-cadastros-grid .list-card{align-self:start}@media(max-width:960px){.module-grid.vinc-cadastros-grid{grid-template-columns:minmax(0,1fr)}}
.vinc-help{padding:12px;border:1px solid var(--bc-line-2);border-radius:8px;margin:10px 0;white-space:normal;line-height:1.5}.vinc-help small{display:block}.vinc-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.vinc-overlay{position:fixed;inset:0;z-index:99990;background:rgba(28,31,29,.42);padding:2vh 3vw;overflow:auto}.vinc-dialog{max-width:1150px;margin:auto;background:#FFFFFF;color:var(--bc-text);border:1px solid var(--bc-line-2);border-radius:12px;padding:20px}.vinc-dialog select,.vinc-dialog input,.vinc-dialog textarea{width:100%;padding:10px;background:var(--bc-surface-2);color:var(--bc-text);border:1px solid var(--bc-line-2);border-radius:6px}.vinc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.vinc-dialog td,.vinc-dialog th{padding:8px;text-align:left;border-bottom:1px solid var(--bc-line-2);overflow-wrap:anywhere}.vinc-dialog table{width:100%;border-collapse:collapse}.vinc-dialog button{cursor:pointer;padding:9px 13px}.vinc-dialog button:disabled{opacity:.5;cursor:wait}.vinc-bad{border-left:5px solid var(--bc-danger)}.vinc-good{border-left:5px solid var(--bc-brand)}.vinc-warn{border-left:5px solid #C98A00}.vinc-scroll{max-height:330px;overflow:auto}
</style>
<script>
var VINC_UI={epoch:0,token:'',data:null,busy:false,searchSeq:0};
function vincCodigo_(c){c=String(c||"").replace(/_/g," ").toLowerCase();return c?c.charAt(0).toUpperCase()+c.slice(1):"Sem diagnóstico";}
function vincEsc_(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function vincCall_(method,args){return new Promise(function(resolve,reject){var api=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);api[method].apply(api,[SGO_getSessionId()].concat(args||[]));});}
function vincStatus_(message){var e=document.getElementById('vincStatus');if(e)e.textContent=message;}
function vincClose_(){if(VINC_UI.busy)return;VINC_UI.epoch++;VINC_UI.token='';var e=document.getElementById('vincOverlay');if(e)e.remove();vincRestaurarMenu_();}
// Ao fechar o painel, o menu volta a marcar a página que está por baixo (antes ficava "Vínculos" aceso).
function vincRestaurarMenu_(){try{var mod=window.SGO_MODULO_ATUAL||'';document.querySelectorAll('#menu .menu-btn.active').forEach(function(b){b.classList.remove('active');});if(!mod)return;var b=document.querySelector('#menu .menu-btn[data-mod="'+mod+'"]');if(b)b.classList.add('active');}catch(_){}}
function vincOpen_(){
 if(document.getElementById('vincOverlay'))return;
 var e=document.createElement('div');e.id='vincOverlay';e.className='vinc-overlay';e.innerHTML='<section class="vinc-dialog" role="dialog" aria-modal="true" aria-labelledby="vincTitle"><div class="vinc-actions"><h2 id="vincTitle">Clientes, unidades e vínculos</h2><button type="button" onclick="vincHelp_()">Como usar</button><button type="button" onclick="vincClose_()">Fechar</button><button type="button" onclick="vincLoad_()">Atualizar</button></div><p>Cliente → Unidade → Equipamento. O mesmo CNPJ pode identificar o cliente e sua unidade principal.</p><p>Regular: pronto para uso. Sem unidade: precisa de local. Vínculo pendente/inconsistente: corrigir antes de emitir. Duplicidade: conferir os registros. Inativo: preservado no histórico.</p><div id="vincStatus" role="status">Carregando…</div><div id="vincBody"></div></section>';document.body.appendChild(e);vincLoad_();
}
function vincLoad_(){
 if(VINC_UI.busy)return;VINC_UI.token='';var epoch=++VINC_UI.epoch;vincStatus_('Aguarde, carregando cadastros e diagnósticos…');var previous=document.getElementById('vincBody');if(previous)previous.innerHTML='';
 vincCall_('vinculosPainel').then(function(res){if(epoch!==VINC_UI.epoch)return;VINC_UI.data=res;var b=document.getElementById('vincBody');if(!b)return;
 b.innerHTML='<div class="vinc-grid"><label>Tipo<select id="vincTipo" onchange="vincSources_()"><option value="CLIENTE">Cliente</option><option value="UNIDADE">Unidade</option><option value="EQUIPAMENTO">Equipamento</option></select></label><label>Pesquisar nome, CNPJ ou local<input id="vincFiltro" oninput="vincSources_()"></label></div><label>Cadastro de origem<select id="vincOrigem" onchange="vincSelected_()"></select></label><div id="vincDetails"></div>'+(res.gestor?'<div class="vinc-grid"><label>Ação do gestor<select id="vincAcao" onchange="vincTargets_()"></select></label><label>Destino<select id="vincDestino" onchange="vincInvalidate_()"></select></label></div><label>Motivo da alteração<textarea id="vincMotivo" maxlength="1000" oninput="vincInvalidate_()" placeholder="Explique a correção necessária"></textarea></label><div class="vinc-actions"><button id="vincPreviewButton" type="button" onclick="vincPreview_()">Conferir impacto</button></div><div id="vincPreview"></div>':'<p>Transferências, consolidação e exclusão estão disponíveis somente para gestores.</p>');if(VINC_UI.focus)document.getElementById('vincTipo').value=VINC_UI.focus.type;vincSources_();VINC_UI.focus=null;vincStatus_('Selecione o cadastro para ver os vínculos.');
 }).catch(function(err){if(epoch===VINC_UI.epoch)vincStatus_(err.message||String(err));});
}
function vincInvalidate_(){VINC_UI.token='';VINC_UI.epoch++;var e=document.getElementById('vincPreview');if(e)e.innerHTML='';}
function vincVal_(id){var e=document.getElementById(id);return e?e.value:'';}
function vincSources_(){
 vincInvalidate_();var type=vincVal_('vincTipo'),q=vincVal_('vincFiltro').toLowerCase(),select=document.getElementById('vincOrigem'),old=VINC_UI.focus?VINC_UI.focus.id:select.value;
 select.innerHTML=(VINC_UI.data[type]||[]).filter(function(r){return r.label.toLowerCase().includes(q)||r.ID===q;}).map(function(r){return '<option value="'+vincEsc_(r.ID)+'">'+vincEsc_(r.label)+' ['+vincEsc_(vincCodigo_(r.diagnostic.code))+']</option>';}).join('');if(Array.from(select.options).some(function(o){return o.value===old;}))select.value=old;vincSelected_();
}
function vincSelected_(){
 vincInvalidate_();var type=vincVal_('vincTipo'),id=vincVal_('vincOrigem'),r=(VINC_UI.data[type]||[]).find(function(r){return r.ID===id;}),e=document.getElementById('vincDetails');if(!r){e.textContent='Nenhum cadastro encontrado.';return;}
 var parent=type==='UNIDADE'?VINC_UI.data.CLIENTE.find(function(c){return c.ID===r.CLIENTE_ID;}):type==='EQUIPAMENTO'?VINC_UI.data.UNIDADE.find(function(u){return u.ID===r.UNIDADE_ID;}):null;
 var children=type==='CLIENTE'?VINC_UI.data.UNIDADE.filter(function(u){return u.CLIENTE_ID===id;}):type==='UNIDADE'?VINC_UI.data.EQUIPAMENTO.filter(function(eq){return eq.UNIDADE_ID===id;}):[];
 e.innerHTML='<div class="vinc-help '+(r.diagnostic.code==='REGULAR'?'vinc-good':'vinc-warn')+'"><strong>'+vincEsc_(vincCodigo_(r.diagnostic.code))+'</strong><p>'+vincEsc_(r.diagnostic.message)+'</p><p>Vinculado a: '+vincEsc_(parent?parent.label:type==='CLIENTE'?'Cliente principal':'Nenhum vínculo')+'</p><div class="vinc-actions"><button type="button" onclick="vincEdit_()">Abrir / editar cadastro</button>'+(type==='CLIENTE'&&r.STATUS==='ATIVO'?'<button type="button" onclick="vincPrincipal_()">Criar ou localizar unidade principal</button>':'')+'</div><strong>Registros vinculados: '+children.length+'</strong><div class="vinc-scroll">'+children.map(function(c){return '<p>'+vincEsc_(c.label)+' — '+vincEsc_(vincCodigo_(c.diagnostic.code))+'</p>';}).join('')+'</div></div>';
 var ref=document.createElement('div');ref.className='vinc-help';ref.textContent='Conferindo histórico e referências…';e.appendChild(ref);
 vincCall_('vinculosDetalhes',[type,id]).then(function(res){if(!ref.isConnected)return;ref.innerHTML='<strong>Referências nos módulos</strong>'+res.references.map(function(r){return '<p>'+vincEsc_(r.table)+': '+r.count+'</p>';}).join('')+(!res.references.length?'<p>Nenhuma referência registrada nos módulos consultados.</p>':'')+'<strong>Últimas alterações do gestor</strong><div class="vinc-scroll">'+res.history.map(function(h){return '<p>'+vincEsc_(h.date)+' — '+vincEsc_(h.user)+' — '+vincEsc_(h.action)+'<br>'+vincEsc_(h.reason)+'<br>'+vincEsc_(h.table)+'.'+vincEsc_(h.field)+': '+vincEsc_(h.before)+' → '+vincEsc_(h.after)+'</p>';}).join('')+'</div>';}).catch(function(err){if(ref.isConnected)ref.textContent=err.message||String(err);});
 var a=document.getElementById('vincAcao');if(a){a.innerHTML=(type==='CLIENTE'?['CONSOLIDAR','INATIVAR','REATIVAR','EXCLUIR']:['TRANSFERIR','DESVINCULAR','CONSOLIDAR','INATIVAR','REATIVAR','EXCLUIR']).map(function(v){return '<option value="'+v+'">'+({CONSOLIDAR:'Consolidar (reunir no destino; a origem fica inativa)',INATIVAR:'Inativar',REATIVAR:'Reativar',EXCLUIR:'Excluir',TRANSFERIR:'Transferir',DESVINCULAR:'Desvincular'}[v]||v)+'</option>';}).join('');a.innerHTML='<option value="">Escolha a ação</option>'+a.innerHTML;a.value='';vincTargets_();}
}
function vincTargets_(){
 vincInvalidate_();var type=vincVal_('vincTipo'),action=vincVal_('vincAcao'),dest=document.getElementById('vincDestino');if(!dest)return;
 var needed=action==='TRANSFERIR'||action==='CONSOLIDAR';dest.disabled=!needed;var targetType=action==='TRANSFERIR'?(type==='UNIDADE'?'CLIENTE':'UNIDADE'):type;
 dest.innerHTML='<option value="">'+(needed?'Selecione o destino':'Não se aplica')+'</option>'+(needed?(VINC_UI.data[targetType]||[]).filter(function(r){return r.STATUS==='ATIVO'&&r.ID!==vincVal_('vincOrigem');}).map(function(r){return '<option value="'+vincEsc_(r.ID)+'">'+vincEsc_(r.label)+'</option>';}).join(''):'');
}
function vincBusy_(busy){VINC_UI.busy=busy;var root=document.getElementById('vincOverlay');if(root)root.querySelectorAll('button,input,select,textarea').forEach(function(e){e.disabled=busy;});if(!busy){var d=document.getElementById('vincDestino');if(d)d.disabled=!['TRANSFERIR','CONSOLIDAR'].includes(vincVal_('vincAcao'));}}
function vincPreview_(){
 if(VINC_UI.busy)return;if(!vincVal_('vincAcao')){vincStatus_('Escolha a ação do gestor antes de conferir o impacto.');return;}vincInvalidate_();var epoch=VINC_UI.epoch;vincBusy_(true);vincStatus_('Aguarde, conferindo dependências e impacto…');
 var p={tipo:vincVal_('vincTipo'),acao:vincVal_('vincAcao'),origem:vincVal_('vincOrigem'),destino:vincVal_('vincDestino'),motivo:vincVal_('vincMotivo')};
 vincCall_('vinculosPrevia',[p]).then(function(res){if(epoch!==VINC_UI.epoch)return;VINC_UI.token=res.token;var e=document.getElementById('vincPreview');
 e.innerHTML='<h3>Conferência da alteração</h3><p>Origem: '+vincEsc_(res.source)+'</p><p>Destino: '+vincEsc_(res.target||'Sem destino')+'</p>'+res.blocks.map(function(b){return '<p class="vinc-help vinc-bad">'+vincEsc_(b)+'</p>';}).join('')+res.warnings.map(function(w){return '<p class="vinc-help vinc-warn">'+vincEsc_(w)+'</p>';}).join('')+'<p>Histórico preservado: '+vincEsc_(Object.keys(res.historical).map(function(k){return k+': '+res.historical[k];}).join('; ')||'nenhuma referência encontrada')+'</p><div class="vinc-scroll"><table><thead><tr><th>Área</th><th>Campo</th><th>Antes</th><th>Depois</th></tr></thead><tbody>'+res.changes.map(function(c){return '<tr><td>'+vincEsc_(c.table)+'</td><td>'+vincEsc_(c.field)+'</td><td>'+vincEsc_(c.before)+'</td><td>'+vincEsc_(c.after)+'</td></tr>';}).join('')+'</tbody></table></div>'+(res.token?'<button type="button" onclick="vincConfirm_()">Confirmar esta alteração</button>':'');vincStatus_(res.blocks.length?'Resolva os impedimentos antes de continuar.':'Confira origem, destino e impacto antes de confirmar.');
 }).catch(function(err){vincStatus_(err.message||String(err));}).finally(function(){vincBusy_(false);});
}
function vincConfirm_(){
 if(VINC_UI.busy||!VINC_UI.token)return;if(!confirm('Aplicar exatamente a alteração conferida?'))return;vincBusy_(true);vincStatus_('Aguarde, aplicando alteração e registrando auditoria…');
 vincCall_('vinculosConfirmar',[VINC_UI.token]).then(function(res){alert(res.message);VINC_UI.token='';vincBusy_(false);window.dispatchEvent(new Event('sgo-vinculos-alterados'));vincLoad_();}).catch(function(err){vincStatus_(err.message||String(err));vincBusy_(false);});
}
function vincEdit_(){var type=vincVal_('vincTipo'),id=vincVal_('vincOrigem');vincClose_();var mobile=typeof ehMobileModo_==='function'&&ehMobileModo_();if(type==='CLIENTE'){if(mobile)renderMobileFormClientes_(id);else{abrir('clientes');clientesEditar_(id);}}else if(type==='UNIDADE'){if(mobile)renderMobileFormUnidades_(id);else{abrir('unidades');unidadesEditar_(id);}}else{if(mobile)renderMobileFormEquipamentos_(id);else{abrir('equipamentos');equipamentosEditar_(id);}}}
function vincPrincipal_(){if(VINC_UI.busy)return;var id=vincVal_('vincOrigem');if(!confirm('Criar a unidade principal somente se ainda não existir?'))return;vincBusy_(true);vincStatus_('Aguarde, criando ou localizando a unidade principal…');vincCall_('vinculosCriarPrincipal',[id]).then(function(r){alert(r.message);vincBusy_(false);vincLoad_();}).catch(function(err){vincStatus_(err.message||String(err));vincBusy_(false);});}
window.addEventListener('sgo-vinculos-alterados',function(){var root=document.getElementById('conteudo');if(!root)return;var b=document.createElement('div');b.className='vinc-help vinc-warn';b.textContent='Os vínculos foram atualizados. Reabra o módulo pelo menu antes de continuar ou salvar um formulário que já estava aberto.';root.prepend(b);});
</script>
<style>
.vinc-workspace{min-width:0}.vinc-workspace .vinc-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.vinc-workspace h3{margin:0;font-size:19px}.vinc-subtitle{color:var(--muted,var(--bc-text-3));font-size:13px;line-height:1.6;margin:6px 0 16px}.vinc-searchbar{display:flex;gap:8px}.vinc-searchbar input{flex:1;min-width:0;padding:11px;border:1px solid var(--border,var(--bc-line-2));border-radius:8px;background:var(--input-bg,#FFFFFF);color:var(--text,var(--bc-text))}.vinc-feedback{padding:13px 0;min-height:44px;font-size:13px;line-height:1.5}.vinc-results{display:grid;gap:12px;max-height:68vh;overflow:auto;padding:2px}.vinc-result{border:1px solid var(--border,var(--bc-line-2));border-radius:12px;padding:16px;background:var(--card,#FFFFFF);overflow-wrap:anywhere}.vinc-result header{display:flex;justify-content:space-between;gap:12px;align-items:center}.vinc-result h4{margin:10px 0;line-height:1.5;font-size:14px}.vinc-badge{display:inline-block;border-radius:30px;padding:4px 9px;font-size:11px;background:var(--bc-surface-2);color:var(--bc-action)}.vinc-badge.off{background:var(--bc-surface-2);color:var(--bc-warn)}.vinc-kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,var(--bc-text-3))}.vinc-result p,.vinc-result summary{font-size:13px;line-height:1.6}.vinc-result details{border-top:1px solid var(--border,var(--bc-line-2));padding-top:10px}.vinc-result summary{cursor:pointer}.vinc-result .vinc-child{padding:8px 0;border-bottom:1px solid var(--border,var(--bc-line-2))}.vinc-result button,.vinc-workspace button{white-space:normal}.vinc-empty{padding:22px;text-align:center;border:1px dashed var(--border,var(--bc-line-2));border-radius:10px;color:var(--muted,var(--bc-text-3));line-height:1.7}.vinc-spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--bc-line-2);border-top-color:var(--bc-info);border-radius:50%;animation:vinc-spin .8s linear infinite;margin-right:8px;vertical-align:middle}@keyframes vinc-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.vinc-spinner{animation:none}}.vinc-manual details{border:1px solid var(--bc-line-2);border-radius:9px;margin:10px 0;padding:14px}.vinc-manual summary{font-weight:600;cursor:pointer}.vinc-manual p,.vinc-manual li{line-height:1.7}.vinc-manual nav{display:flex;gap:10px;flex-wrap:wrap}.vinc-mobile-summary{cursor:pointer;font-weight:600;padding:12px 0}.vinc-guidebar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px;padding:12px 16px;border:1px solid var(--border,var(--bc-line-2));border-radius:10px}.vinc-guidebar p{margin:0;font-size:13px}.vinc-dialog .vinc-actions h2{flex:1}@media(max-width:760px){.vinc-results{max-height:none}.vinc-searchbar{flex-wrap:wrap}.vinc-searchbar input{flex-basis:65%}.vinc-overlay{padding:10px}.vinc-dialog{padding:15px}.vinc-result{padding:12px}}
</style>
<script>
var VINC_SEARCH={seq:0,timer:null};
function vincSearchMarkup_(){return '<section class="vinc-workspace" aria-label="Consulta de cadastros e vínculos"><div class="vinc-toolbar"><h3>Cadastros e vínculos</h3><button class="btn-secondary" type="button" onclick="vincHelp_()">Como usar</button></div><p class="vinc-subtitle">Confira o que já existe enquanto preenche o formulário. A consulta não altera os dados digitados.</p><div class="vinc-searchbar"><input id="vincSearch" aria-label="Buscar cadastro por nome ou CNPJ" placeholder="Buscar nome ou CNPJ no portal" autocomplete="off"><button class="btn-primary" type="button" onclick="vincSearchNow_()">Buscar</button></div><div id="vincFeedback" class="vinc-feedback" role="status" aria-live="polite">Digite pelo menos 3 caracteres para consultar.</div><div id="vincResults" class="vinc-results"><div class="vinc-empty">Cliente → Unidade → Equipamento<br>O cliente e sua unidade principal podem ter o mesmo CNPJ.</div></div><div class="vinc-actions"><button class="btn-secondary" type="button" onclick="vincOpen_()">Abrir painel de vínculos</button></div></section>';}
function vincResultButton_(type,id,label,edit){return '<button class="btn-secondary" type="button" data-vinc-type="'+vincEsc_(type)+'" data-vinc-id="'+vincEsc_(id)+'" data-vinc-action="'+(edit?'edit':'view')+'">'+vincEsc_(label)+'</button>';}
function vincBadge_(status){return '<span class="vinc-badge '+(status==='ATIVO'?'':'off')+'">'+vincEsc_(status==='ATIVO'?'Ativo':status||'Situação não informada')+'</span>';}
function vincCards_(res){
 var grouped=new Set();var html=res.clientes.map(function(c){(c.unidades||[]).forEach(function(u){grouped.add(u.ID);});return '<article class="vinc-result"><header><span class="vinc-kind">Cliente existente</span>'+vincBadge_(c.STATUS)+'</header><h4>'+vincEsc_(c.label)+'</h4><div class="vinc-actions">'+vincResultButton_('CLIENTE',c.ID,'Ver vínculos',false)+vincResultButton_('CLIENTE',c.ID,'Abrir cadastro',true)+'</div><details><summary>Unidades vinculadas ('+(c.unidades||[]).length+')</summary>'+((c.unidades||[]).map(function(u){return '<div class="vinc-child"><p>'+vincEsc_(u.label)+'</p>'+vincBadge_(u.STATUS)+' '+vincResultButton_('UNIDADE',u.ID,'Ver unidade',false)+'</div>';}).join('')||'<p>Sem unidade cadastrada. Use o painel para criar ou localizar a unidade principal.</p>')+'</details></article>';}).join('');
 html+=res.unidades.filter(function(u){return !grouped.has(u.ID);}).map(function(u){return '<article class="vinc-result"><header><span class="vinc-kind">Unidade existente</span>'+vincBadge_(u.STATUS)+'</header><h4>'+vincEsc_(u.label)+'</h4><p><strong>Cliente responsável</strong><br>'+vincEsc_(u.CLIENTE_ID?u.cliente:'Sem vínculo — peça ao gestor para corrigir')+'</p><div class="vinc-actions">'+vincResultButton_('UNIDADE',u.ID,'Ver vínculos',false)+vincResultButton_('UNIDADE',u.ID,'Abrir cadastro',true)+'</div></article>';}).join('');
 return html||'<div class="vinc-empty"><strong>Nenhum cadastro encontrado.</strong><br>Confira o nome ou CNPJ. Você pode continuar preenchendo; ao salvar, o sistema verificará novamente as duplicidades.</div>';
}
function vincSearchNow_(){clearTimeout(VINC_SEARCH.timer);vincSearchRun_(vincVal_('vincSearch'));}
function vincSearchQueue_(value){clearTimeout(VINC_SEARCH.timer);VINC_SEARCH.seq++;var field=document.getElementById('vincSearch');if(!field)return;field.value=value;var feedback=document.getElementById('vincFeedback');if(feedback)feedback.textContent=value.trim().length>=3?'Aguarde, preparando consulta…':'Digite pelo menos 3 caracteres para consultar.';var results=document.getElementById('vincResults');if(results)results.innerHTML='';VINC_SEARCH.timer=setTimeout(function(){vincSearchRun_(value);},450);}
function vincSearchRun_(value){
 var field=document.getElementById('vincSearch'),feedback=document.getElementById('vincFeedback'),results=document.getElementById('vincResults');if(!field||!feedback||!results)return;
 var seq=++VINC_SEARCH.seq;value=String(value||'').trim();field.value=value;
 if(value.length<3){feedback.textContent='Digite pelo menos 3 caracteres para consultar.';results.innerHTML='';results.removeAttribute('aria-busy');return;}
 feedback.innerHTML='<span class="vinc-spinner" aria-hidden="true"></span>Aguarde, consultando cadastros e vínculos…';results.innerHTML='';results.setAttribute('aria-busy','true');
 vincCall_('vinculosConsultar',[value]).then(function(res){if(seq!==VINC_SEARCH.seq||!results.isConnected)return;if(!res||!res.success)throw Error('Não foi possível consultar os cadastros.');results.innerHTML=vincCards_(res);feedback.textContent=res.clientes.length+' cliente(s) e '+res.unidades.length+' unidade(s) encontrados. Confira os dados antes de cadastrar.';var summary=document.getElementById('vincMobileSummary');if(summary)summary.textContent='Cadastros e vínculos · '+(res.clientes.length+res.unidades.length)+' resultado(s)';}).catch(function(err){if(seq!==VINC_SEARCH.seq||!results.isConnected)return;feedback.textContent='Consulta não concluída: '+(err.message||'falha de comunicação');results.innerHTML='<div class="vinc-empty">Os dados do formulário foram preservados.<br><button class="btn-secondary" type="button" onclick="vincSearchNow_()">Tentar novamente</button></div>';}).finally(function(){if(seq===VINC_SEARCH.seq&&results.isConnected)results.removeAttribute('aria-busy');});
}
function vincSearchLegacy_(type){var input=document.getElementById(type==='CLIENTE'?'clientesPesquisa':'unidadesPesquisa');if(!document.getElementById('vincSearch'))return false;clearTimeout(VINC_SEARCH.timer);var field=document.getElementById('vincSearch');field.value=input?input.value:'';vincSearchNow_();return true;}
function vincOpenRecord_(type,id){VINC_UI.focus={type:type,id:id};if(document.getElementById('vincOverlay'))vincLoad_();else vincOpen_();}
function vincOpenEdit_(type,id){if(!confirm('Abrir o cadastro existente? Alterações ainda não salvas no formulário atual serão descartadas.'))return;var mobile=typeof ehMobileModo_==='function'&&ehMobileModo_();if(type==='CLIENTE'){if(mobile)renderMobileFormClientes_(id);else{abrir('clientes');clientesEditar_(id);}}else{if(mobile)renderMobileFormUnidades_(id);else{abrir('unidades');unidadesEditar_(id);}}}
function vincHelp_(){
 if(document.getElementById('vincManual'))return;var e=document.createElement('div');e.id='vincManual';e.className='vinc-overlay';e.style.zIndex='100000';e.innerHTML='<section class="vinc-dialog vinc-manual" role="dialog" aria-modal="true" aria-labelledby="vincManualTitle"><div class="vinc-actions"><h2 id="vincManualTitle">Como usar Clientes e Unidades</h2><button type="button" onclick="vincHelpClose_()">Fechar guia</button></div><p>Comece consultando o CNPJ. Reutilizar o cadastro correto mantém equipamentos e documentos organizados.</p>'+[
 ['1. Cadastrar cliente e unidade principal','Digite o CNPJ completo, incluindo zeros iniciais. O painel ao lado consulta os cadastros do portal. O botão Buscar junto ao CNPJ preenche dados da Receita; são consultas diferentes.','Se não houver cadastro, complete os campos e mantenha marcada a criação da unidade principal. Ao salvar, cliente e unidade ficam vinculados. Desmarque somente quando o cliente servir como agrupador de outras unidades.'],
 ['2. Cadastrar outras unidades','Em Unidades, selecione o cliente responsável e informe nome, CNPJ e endereço do local. A unidade principal pode ter o mesmo CNPJ do cliente.','Se aparecer uma unidade existente, confira o cliente responsável. Abra o cadastro ou peça ao gestor a correção do vínculo; não tente cadastrar o mesmo estabelecimento novamente.'],
 ['3. Consultar e editar','Use a busca por nome ou CNPJ no painel Cadastros e vínculos. No computador ela fica ao lado do formulário; no celular, abaixo dele. A busca também acompanha o nome e o CNPJ digitados.','Abra Unidades vinculadas no cartão do cliente para conferir seus locais. Ver vínculos abre o painel sem apagar o formulário. Abrir cadastro pede confirmação antes de substituir a tela. Edite dados cadastrais e clique em Salvar; transferências são feitas no painel do gestor.'],
 ['4. Corrigir vínculos — gestor','Abra o painel, escolha o cadastro de origem e a ação. Transferir vincula uma unidade a outro cliente ou um equipamento a outra unidade; também permite vincular novamente um cadastro pendente. Desvincular deixa o cadastro pendente e bloqueia novos atendimentos até a correção.','Selecione o destino, explique o motivo e clique em Conferir impacto. Leia os impedimentos, o histórico preservado e cada alteração. Confirme somente após conferir os dados. Se a prévia expirar ou os cadastros mudarem, atualize e confira novamente.'],
 ['5. Consolidar, inativar ou excluir','Consolidar reúne cadastros que representam a mesma identificação; a origem fica inativa para preservar documentos e histórico. Filiais diferentes não devem ser consolidadas. Inativar mantém o histórico e impede novos usos dependentes do cadastro.','Excluir remove somente cadastro sem dependências. Se houver vínculos, o sistema indica o impedimento. Consulte o histórico das alterações no painel. Reativar também verifica possíveis duplicidades.'],
 ['6. Entender avisos e continuar nos módulos','Regular: vínculo pronto para uso. Sem unidade: crie ou vincule um local. Vínculo pendente ou inconsistente: solicite correção. Duplicidade: confira as identificações. Inativo: disponível no histórico.','Após uma mudança, reabra o módulo e selecione cliente, unidade e equipamento novamente. Documentos antigos continuam associados ao atendimento original. Durante Aguarde, espere a conclusão. Se ocorrer erro, leia a mensagem antes de repetir; uma consulta sem resultados não garante que o cadastro poderá ser salvo.']
 ].map(function(t,i){return '<details'+(i===0?' open':'')+'><summary>'+t[0]+'</summary><p>'+t[1]+'</p><p>'+t[2]+'</p></details>';}).join('')+'</section>';document.body.appendChild(e);e.querySelector('button').focus();
}
function vincHelpClose_(){var e=document.getElementById('vincManual');if(e)e.remove();}
(function(){
 var fields=['cli_cnpj','uni_cnpj_unidade','mob_cli_cnpj','mob_uni_cnpj','cli_razao_social','uni_nome_unidade','mob_cli_razao','mob_uni_nome'];
 function consult(event){var input=event.target;if(input.id==='vincSearch'||fields.includes(input.id))vincSearchQueue_(input.value);}
 document.addEventListener('input',consult);document.addEventListener('change',consult);
 document.addEventListener('keydown',function(e){if(e.target.id==='vincSearch'&&e.key==='Enter'){e.preventDefault();vincSearchNow_();}if(e.key==='Escape'&&document.getElementById('vincManual'))vincHelpClose_();});
 document.addEventListener('click',function(e){var b=e.target.closest('[data-vinc-action]');if(!b)return;if(b.dataset.vincAction==='edit')vincOpenEdit_(b.dataset.vincType,b.dataset.vincId);else vincOpenRecord_(b.dataset.vincType,b.dataset.vincId);});
 function attach(){var root=document.getElementById('conteudo');if(!root)return;if(typeof USER_CONTEXT!=='undefined'&&USER_CONTEXT&&String(USER_CONTEXT.perfil).toUpperCase()==='CLIENTE')return;var has=root.querySelector('#cli_cnpj,#uni_cnpj_unidade,#mob_cli_cnpj,#mob_uni_cnpj,#clientesTabelaBody,#unidadesTabelaBody,#mobileListaClientes,#mobileListaUnidades');if(!has||root.querySelector('#vincEntry'))return;
  // A lista de cadastros (com Editar, Inativar, Reativar e Excluir) continua visível; a consulta de
  // vínculos entra como apoio, recolhida, abaixo da lista (antes ela escondia a tabela e a pesquisa).
  VINC_SEARCH.seq++;clearTimeout(VINC_SEARCH.timer);var bar=document.createElement('span');bar.id='vincEntry';bar.hidden=true;root.prepend(bar);
  var list=root.querySelector('.list-card');var box=document.createElement('details');box.id='vincMobile';box.className='vinc-help vinc-apoio';box.innerHTML='<summary id="vincMobileSummary" class="vinc-mobile-summary">Consultar cadastros e vínculos</summary>'+vincSearchMarkup_();if(list){list.appendChild(box);}else{root.appendChild(box);}
 }
 new MutationObserver(attach).observe(document.body,{childList:true,subtree:true});attach();
})();
</script>

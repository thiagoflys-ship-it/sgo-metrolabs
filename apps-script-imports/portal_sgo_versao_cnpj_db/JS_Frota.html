<script>
  let tplFrota_carregado_ = false;

  function renderTplFrota_() {
    const container = document.getElementById('tplFrotaContainer');
    if (!container) return;

    if (tplFrota_carregado_) {
      if (typeof tplFrota_renderReal_ === 'function') tplFrota_renderReal_();
      return;
    }

    container.innerHTML = '<p style="padding:20px;color:var(--bc-text-3);">Carregando módulo Frota...</p>';

    google.script.run
      .withSuccessHandler(function(conteudoBruto) {
        try {
          const styleMatch = conteudoBruto.match(/<style>([\s\S]*?)<\/style>/);
          const scriptMatch = conteudoBruto.match(/<script>([\s\S]*?)<\/script>/);

          if (styleMatch) {
            const styleEl = document.createElement('style');
            styleEl.textContent = styleMatch[1];
            document.head.appendChild(styleEl);
          }

          if (scriptMatch) {
            window.eval(scriptMatch[1]);
          }

          tplFrota_carregado_ = true;

          var desenhar = function () {
            if (typeof tplFrota_renderReal_ === 'function') {
              tplFrota_renderReal_();
            } else {
              container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Falha ao inicializar o módulo (função de renderização não encontrada).</p>';
            }
          };
          // 20/10/2026: rastreamento (mapa, rotas, combustível, relatórios, Gantt, copiloto e comprovantes), em
          // SGO_Frota_RastreamentoTela.js, ligado depois do módulo. Se falhar, a Frota abre sem ele e o motivo fica no console.
          google.script.run
            .withSuccessHandler(function (tela) {
              try {
                if (tela && tela.css) { var st = document.createElement('style'); st.textContent = tela.css; document.head.appendChild(st); }
                if (tela && tela.js) window.eval(tela.js);
              } catch (eTela) { console.error('tplFrota: rastreamento não carregou:', eTela); }
              desenhar();
            })
            .withFailureHandler(function (eTela) { console.error('tplFrota: rastreamento não carregou:', eTela); desenhar(); })
            .Frota_obterTelaRastreamento();
        } catch (e) {
          console.error('tplFrota: erro ao montar o módulo:', e);
          container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Erro ao montar o módulo: ' + (e && e.message ? e.message : e) + '</p>';
        }
      })
      .withFailureHandler(function(err) {
        console.error('tplFrota: falha ao buscar o módulo:', err);
        container.innerHTML = '<p style="padding:20px;color:var(--bc-danger);">Falha ao carregar o módulo: ' + ((err && err.message) ? err.message : err) + '</p>';
      })
      .Frota_obterConteudoModulo();
  }
</script>

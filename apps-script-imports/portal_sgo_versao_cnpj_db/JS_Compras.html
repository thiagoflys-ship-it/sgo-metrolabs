<style>
  /* COMPRAS E PEÇAS NATIVO (21/10/2026) — servidor: SGO_Compras_*.js (uma porta: Compras_api). Celular sem rolagem lateral. */
  .cp-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .cp-tab { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; min-height: 38px; }
  .cp-tab.active { background: var(--text-strong, #1f2a24); color: var(--card, #fff); border-color: transparent; }
  .cp-tab span { font-weight: 600; opacity: .8; margin-left: 4px; }
  .cp-faixa { margin: 8px 0 12px; padding: 10px 14px; border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; background: var(--card); font-size: 13px; line-height: 1.5; }
  .cp-faixa.aviso { border-left-color: var(--warning); } .cp-faixa.erro { border-left-color: var(--danger); background: var(--danger-bg); } .cp-faixa.ok { border-left-color: var(--success); }
  .cp-lista { display: flex; flex-direction: column; gap: 10px; }
  .cp-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--info, #1f5fa8); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
  .cp-card.critica { border-left-color: var(--danger); } .cp-card.alta { border-left-color: var(--warning); } .cp-card.encerrada { border-left-color: var(--muted); opacity: .8; }
  .cp-card.clicavel { cursor: pointer; } .cp-card.clicavel:hover { border-color: var(--info, #1f5fa8); }
  .cp-card-tit { font-weight: 700; font-size: 14px; margin: 0 0 4px; color: var(--text-strong, var(--text)); }
  .cp-meta { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .cp-txt { font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
  .cp-txt b { color: var(--text-strong, var(--text)); }
  .cp-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cp-acoes button { min-height: 40px; }
  .cp-selo { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; border: 1px solid currentColor; margin: 0 4px 2px 0; white-space: nowrap; }
  .cp-selo.vermelho { color: var(--danger); background: var(--danger-bg); } .cp-selo.laranja { color: var(--warning); background: var(--warning-bg); }
  .cp-selo.verde { color: var(--success); background: var(--success-bg); } .cp-selo.azul { color: var(--info, #1f5fa8); } .cp-selo.cinza { color: var(--muted); }
  .cp-filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 6px 0 12px; }
  .cp-filtros label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .cp-filtros select, .cp-filtros input { min-height: 40px; max-width: 100%; }
  .cp-caixa { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .cp-caixa h3 { margin: 0 0 8px; font-size: 14px; }
  .cp-grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .cp-grade3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  .cp-grade4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 12px; }
  .cp-campo { margin-bottom: 10px; min-width: 0; }
  .cp-campo label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .cp-campo input, .cp-campo select, .cp-campo textarea { width: 100%; box-sizing: border-box; min-height: 40px; font: inherit; }
  .cp-campo textarea { min-height: 64px; resize: vertical; }
  .cp-ajuda-campo { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .cp-det { display: grid; grid-template-columns: 160px 1fr; gap: 5px 10px; font-size: 12.5px; margin: 0 0 12px; }
  .cp-det dt { color: var(--muted); font-weight: 700; } .cp-det dd { margin: 0; overflow-wrap: anywhere; }
  .cp-hist { border-left: 2px solid var(--border); margin-left: 6px; padding-left: 12px; }
  .cp-hist div { margin-bottom: 9px; font-size: 12.5px; } .cp-hist .q { color: var(--muted); font-size: 11.5px; }
  .cp-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
  .cp-item h4 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .cp-falta { font-size: 12px; color: var(--warning); margin: 4px 0 0; }
  .cp-falta.ok { color: var(--success); }
  .cp-vinculos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .cp-vinculos label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; background: var(--card); }
  .cp-vinculos input { width: auto; min-height: 0; }
  .cp-vazio { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; }
  .cp-sec { margin: 14px 0 6px; font-size: 13px; font-weight: 800; color: var(--text-strong, var(--text)); }
  .cp-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cp-tabela th, .cp-tabela td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; vertical-align: top; }
  .cp-tabela td.n, .cp-tabela th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cp-tabela tr.vencedora td { background: var(--success-bg); }
  .cp-check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; margin: 4px 0; }
  .cp-check input { min-height: 0; width: auto; margin-top: 3px; }
  .cp-fotos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .cp-fotos a, .cp-fotos span { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; background: var(--card); }
  .cp-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .cp-kpi { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--info, #1f5fa8); border-radius: 8px; padding: 10px 12px; }
  .cp-kpi .v { display: block; font-size: 20px; font-weight: 800; color: var(--text-strong, var(--text)); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .cp-kpi .r { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .cp-kpi.ok { border-top-color: var(--success); } .cp-kpi.aviso { border-top-color: var(--warning); } .cp-kpi.critico { border-top-color: var(--danger); }
  @media (max-width: 900px) {
    .cp-grade2, .cp-grade3 { grid-template-columns: 1fr; }
    .cp-grade4, .cp-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cp-det { grid-template-columns: 1fr; }
    .cp-det dt { margin-top: 6px; }
    .cp-tabela thead { display: none; }
    .cp-tabela, .cp-tabela tbody, .cp-tabela tr, .cp-tabela td { display: block; width: 100%; box-sizing: border-box; }
    .cp-tabela tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 6px 8px; background: var(--card); }
    .cp-tabela td { border: 0; padding: 3px 0; text-align: left !important; }
    .cp-tabela td[data-r]::before { content: attr(data-r) ": "; color: var(--muted); font-weight: 700; }
    .cp-filtros > div { flex: 1 1 140px; }
  }
</style>

<script>
  // ==========================================================
  // COMPRAS E PEÇAS NATIVO DO SGO+ (21/10/2026)
  // Telas (abrir(mod)): compras_pedir (Pedir peça ou material), compras_meus (Meus pedidos de compra), compras (Fila de compras),
  // compras_fornecedores, compras_financeiro (Conferência do Financeiro), compras_painel (Painel de compras), compras_regras.
  // Uma chamada só no servidor: Compras_api(sessionId, acao, dados). O servidor confere o perfil em toda chamada e
  // nunca manda valor para quem não pode ver. A tela não se redesenha sozinha: recarrega depois de cada ação ou em "Atualizar".
  // ==========================================================
  var CP = { ini: null, mod: "", filtro: { situacao: "ABERTAS", busca: "" }, fornBusca: "", fornArquivados: false, opcoes: null };
  var CP_MODS = { compras_pedir: "Pedir peça ou material", compras_meus: "Meus pedidos de compra", compras: "Fila de compras", compras_fornecedores: "Fornecedores",
    compras_financeiro: "Conferência do Financeiro", compras_painel: "Painel de compras", compras_regras: "Regras de compras" };
  var CP_COR_SIT = { SOLICITADA: "azul", EM_COTACAO: "azul", AGUARDANDO_APROVACAO: "laranja", APROVADA: "azul", PEDIDO_FEITO: "azul", RECEBIDA_DIVERGENCIA: "vermelho", DISPONIVEL: "verde", ENTREGUE: "cinza", CANCELADA: "cinza" };

  function Cp_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function Cp_$_(id) { return document.getElementById(id); }
  function Cp_chamar_(acao, dados, ok, erro, opcoes) {
    var o = opcoes || {};
    if (o.carregando) SGO_iniciarCarregamento_(o.carregando);
    var fim = function () { if (o.carregando) SGO_finalizarCarregamento_(); };
    var falhou = function (m) { fim(); if (erro) erro(m); else alert(m); };
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { falhou((r && r.message) || "Não foi possível concluir: o servidor não respondeu como esperado. Tente de novo."); return; }
      fim();
      try { if (ok) ok(r); } catch (e) { console.error("Compras " + acao + ":", e); alert("Não foi possível mostrar o resultado na tela: " + (e && e.message ? e.message : e) + ". Atualize a página (F5) e tente de novo."); }
    }).withFailureHandler(function (e) { falhou("Não foi possível falar com o servidor (" + ((e && e.message) || e) + "). Verifique a conexão e tente de novo; nada foi alterado."); })
      .Compras_api(SGO_getSessionId(), acao, dados || {});
  }
  function Cp_msg_(onde, texto, tipo) { var el = typeof onde === "string" ? Cp_$_(onde) : onde; if (el) el.innerHTML = texto ? '<div class="cp-faixa ' + (tipo || "erro") + '">' + Cp_esc_(texto) + "</div>" : ""; }
  function Cp_campo_(rotulo, html, ajuda) { return '<div class="cp-campo"><label>' + Cp_esc_(rotulo) + "</label>" + html + (ajuda ? '<div class="cp-ajuda-campo">' + Cp_esc_(ajuda) + "</div>" : "") + "</div>"; }
  function Cp_opcoes_(lista, atual, vazio) {
    return (vazio !== undefined ? '<option value="">' + Cp_esc_(vazio) + "</option>" : "") + lista.map(function (o) { var v = typeof o === "object" ? o.v : o, t = typeof o === "object" ? o.t : o; return '<option value="' + Cp_esc_(v) + '"' + (String(v) === String(atual || "") ? " selected" : "") + ">" + Cp_esc_(t) + "</option>"; }).join("");
  }
  function Cp_mapaOpcoes_(mapa) { return Object.keys(mapa || {}).map(function (k) { return { v: k, t: mapa[k] }; }); }
  function Cp_seloSit_(r) { return '<span class="cp-selo ' + (CP_COR_SIT[r.situacao] || "cinza") + '">' + Cp_esc_(r.situacaoNome) + "</span>"; }
  function Cp_selos_(r) {
    var s = [Cp_seloSit_(r)];
    if (r.urgencia === "CRITICA") s.push('<span class="cp-selo vermelho">Crítica</span>'); else if (r.urgencia === "ALTA") s.push('<span class="cp-selo laranja">Alta</span>');
    if (r.especIncompleta) s.push('<span class="cp-selo laranja">Especificação incompleta</span>');
    if (r.semPedido) s.push('<span class="cp-selo vermelho">Compra sem pedido</span>');
    if (r.finSituacao === "DIVERGENTE") s.push('<span class="cp-selo vermelho">Divergência do Financeiro</span>');
    return s.join("");
  }
  function Cp_cabecalho_(titulo, sub, botoes) {
    return '<div class="module-header"><div class="module-header-left"><h2 class="content-title">' + Cp_esc_(titulo) + '</h2><p class="content-subtitle">' + Cp_esc_(sub) + "</p></div>" +
      '<div class="module-header-right" style="display:flex;gap:8px;flex-wrap:wrap">' + (botoes || "") + "</div></div>";
  }
  function Cp_modal_(titulo, corpo, rodape, largura) {
    var ov = document.createElement("div");
    ov.className = "atv-overlay";
    ov.innerHTML = '<div class="atv-modal" style="max-width:' + (largura || 600) + 'px"><div class="atv-modal-cab"><h3>' + Cp_esc_(titulo) + '</h3><button type="button" class="atv-fechar" aria-label="Fechar">&times;</button></div>' +
      '<div class="atv-modal-corpo">' + corpo + '</div>' + (rodape ? '<div class="atv-modal-rod">' + rodape + '</div>' : '') + '</div>';
    ov.querySelector(".atv-fechar").onclick = function () { ov.remove(); };
    document.body.appendChild(ov);
    return ov;
  }
  function Cp_gaveta_(titulo, corpo) {
    var antiga = Cp_$_("cpGaveta"); if (antiga) antiga.remove();
    var g = document.createElement("div");
    g.id = "cpGaveta"; g.className = "atv-overlay"; g.style.justifyContent = "flex-end"; g.style.padding = "0";
    g.innerHTML = '<div class="atv-drawer" role="dialog" aria-label="' + Cp_esc_(titulo) + '"><div class="atv-drawer-cab"><h3>' + Cp_esc_(titulo) + '</h3><button type="button" class="btn-secondary" data-cp-fechar>Fechar</button></div><div class="atv-drawer-corpo" id="cpGavetaCorpo">' + corpo + '</div></div>';
    g.querySelector("[data-cp-fechar]").onclick = function () { g.remove(); };
    g.addEventListener("click", function (e) { if (e.target === g) g.remove(); });
    document.body.appendChild(g);
    return g;
  }
  /** Pede um texto (motivo, fundamentação) numa janela e chama ok(texto). */
  function Cp_pedirTexto_(titulo, explicacao, rotulo, minimo, ok, botao) {
    var ov = Cp_modal_(titulo, '<p class="cp-txt">' + Cp_esc_(explicacao) + "</p>" + Cp_campo_(rotulo, '<textarea id="cpTxtPedido" maxlength="1000"></textarea>', minimo ? "Pelo menos " + minimo + " letras." : "") + '<div id="cpTxtMsg"></div>',
      '<button type="button" class="btn-secondary" data-x>Voltar</button><button type="button" class="btn-primary" data-ok>' + Cp_esc_(botao || "Confirmar") + "</button>");
    ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
    ov.querySelector("[data-ok]").onclick = function () {
      var t = Cp_$_("cpTxtPedido").value.trim();
      if (minimo && t.length < minimo) { Cp_msg_("cpTxtMsg", "Escreva pelo menos " + minimo + " letras.", "aviso"); return; }
      ok(t, ov);
    };
  }
  /** Lê arquivos de um <input type=file>: imagens reduzidas (até 1600 px, JPEG) para caber no envio; demais como estão. */
  function Cp_lerArquivos_(input, cb, soImagem) {
    var fs = Array.prototype.slice.call((input && input.files) || []);
    if (!fs.length) { cb([]); return; }
    var saida = [], falta = fs.length;
    fs.forEach(function (f, i) {
      var fim = function (obj) { saida[i] = obj; if (--falta === 0) cb(saida.filter(Boolean)); };
      if (f.size > 25 * 1048576) { alert('O arquivo "' + f.name + '" passa de 25 MB e não foi anexado. Reduza o tamanho e tente de novo.'); fim(null); return; }
      var rd = new FileReader();
      rd.onload = function () {
        var dataUrl = String(rd.result || "");
        if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)) {
          var img = new Image();
          img.onload = function () {
            var esc = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
            cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            var j = cv.toDataURL("image/jpeg", 0.82);
            fim({ nome: f.name.replace(/\.[^.]+$/, "") + ".jpg", tipo: "image/jpeg", base64: j.split(",")[1] });
          };
          img.onerror = function () { fim({ nome: f.name, tipo: f.type, base64: dataUrl.split(",")[1] }); };
          img.src = dataUrl;
        } else if (soImagem) { alert('O arquivo "' + f.name + '" não é uma foto (PNG ou JPG) e não foi anexado.'); fim(null); }
        else fim({ nome: f.name, tipo: f.type || "application/octet-stream", base64: dataUrl.split(",")[1] });
      };
      rd.onerror = function () { fim(null); };
      rd.readAsDataURL(f);
    });
  }

  // ---------------- casca: menu ----------------
  function Compras_iniciar_() {
    var p = USER_CONTEXT ? String(USER_CONTEXT.perfil || "").toUpperCase() : "";
    if (!p || p === "CLIENTE") { Compras_mostrarMenu_(null); return; }
    Cp_chamar_("acesso", {}, function (r) { Compras_mostrarMenu_(r); }, function () { Compras_mostrarMenu_(null); });
  }
  function Compras_parar_() { CP.ini = null; CP.opcoes = null; Compras_mostrarMenu_(null); }
  function Compras_mostrarMenu_(r) {
    var grupo = Cp_$_("menu-secao-compras");
    if (grupo) grupo.style.display = r ? "" : "none";
    document.querySelectorAll("#menu-grupo-itens-compras .menu-btn").forEach(function (b) {
      var m = b.getAttribute("data-mod"), ver = !!r;
      if (m === "compras" || m === "compras_painel") ver = !!(r && r.veFila);
      if (m === "compras_fornecedores") ver = !!(r && r.veValores);
      if (m === "compras_financeiro") ver = !!(r && r.financeiro);
      if (m === "compras_regras") ver = !!(r && (r.podeRegras || r.comprador));
      b.style.display = ver ? "" : "none";
    });
    if (typeof Menu_iniciar_ === "function") { try { Menu_iniciar_(); } catch (e) {} }
    if (r && window.SGO_MODULO_ATUAL === "mobile_home" && typeof renderMobileHome_ === "function") { try { renderMobileHome_(); } catch (e) {} }
  }
  function Compras_garantirInicio_(cb) {
    if (CP.ini) { cb(CP.ini); return; }
    Cp_chamar_("iniciar", {}, function (r) { CP.ini = r; cb(r); });
  }

  /** Ponto de entrada de abrir(mod). */
  function Compras_render_(mod, alvo) {
    var div = Cp_$_("conteudo");
    if (!div) return;
    CP.mod = mod;
    if (typeof ehMobileModo_ === "function" && ehMobileModo_()) atualizarTituloMobile_(CP_MODS[mod] || "Compras");
    div.innerHTML = '<div class="module-shell"><div class="cp-vazio">Carregando Compras…</div></div>';
    Compras_garantirInicio_(function (ini) {
      if (ini.nivel === "NENHUM") { div.innerHTML = '<div class="module-shell">' + Cp_cabecalho_("Compras", "") + '<div class="cp-faixa aviso">Compras é da equipe interna da Metrolabs.</div></div>'; return; }
      var mapa = { compras_pedir: Compras_renderPedir_, compras_meus: Compras_renderMeus_, compras: Compras_renderFila_, compras_fornecedores: Compras_renderFornecedores_, compras_regras: Compras_renderRegras_ };
      if (typeof Compras_renderFinanceiro_ === "function") mapa.compras_financeiro = Compras_renderFinanceiro_;
      if (typeof Compras_renderPainel_ === "function") mapa.compras_painel = Compras_renderPainel_;
      var fn = mapa[mod];
      if ((mod === "compras" || mod === "compras_painel") && !ini.veFila) fn = null;
      if (mod === "compras_fornecedores" && !ini.veValores) fn = null;
      if (mod === "compras_financeiro" && !ini.financeiro) fn = null;
      if (!fn) {
        if (mapa[mod]) { div.innerHTML = '<div class="module-shell">' + Cp_cabecalho_(CP_MODS[mod] || "Compras", "") + '<div class="cp-faixa aviso">Esta tela de Compras é dos compradores, gestores, do Financeiro (conferência) e da Diretoria. Para pedir uma peça ou acompanhar os seus pedidos, use "Pedir peça ou material" e "Meus pedidos de compra" no menu Compras.</div></div>'; return; }
        fn = Compras_renderMeus_;
      }
      fn(div, alvo || {});
      if (ini.avisos && ini.avisos.some(function (a) { return a.novo; })) Cp_chamar_("avisosLidos", {}, function () { ini.avisos.forEach(function (a) { a.novo = false; }); }, function () {});
    });
  }

  /** Atalho vindo do Início, da Caixa de decisões ou de um aviso: { tipo:'compras', mod, id }. */
  function Compras_irPara_(acao) {
    var mod = (acao && acao.mod) || "compras_meus";
    abrir(mod);
    if (acao && acao.id) setTimeout(function () { Compras_abrirFicha_(acao.id); }, 700);
  }

  function Cp_avisosRecentes_() {
    var ini = CP.ini;
    if (!ini || !ini.avisos || !ini.avisos.length) return "";
    var novos = ini.avisos.filter(function (a) { return a.novo; });
    if (!novos.length) return "";
    return '<div class="cp-caixa"><h3>Avisos de Compras</h3>' + novos.map(function (a) { return '<p class="cp-txt"><b>' + Cp_esc_(a.titulo) + '</b> <span class="cp-meta">' + Cp_esc_(a.em) + '</span><br>' + Cp_esc_(a.texto) + '</p>'; }).join("") + '</div>';
  }

  // =========================================================
  // PEDIR PEÇA OU MATERIAL (novo ou completar a especificação)
  // =========================================================
  function Compras_renderPedir_(div, alvo) {
    div.innerHTML = '<div class="module-shell">' + Cp_cabecalho_("Pedir peça ou material", "Diga o que precisa, para que é e a que está ligado. O comprador confere, cota e avisa quando chegar. Você acompanha em Meus pedidos de compra, sem valores.",
      '<button type="button" class="btn-secondary" onclick="abrir(\'compras_meus\')"><i class="fas fa-list" aria-hidden="true"></i>&nbsp;Meus pedidos</button>') +
      (CP.ini && !CP.ini.temComprador ? '<div class="cp-faixa aviso">Ainda não há comprador escolhido em Regras de compras. O pedido vai para o gestor da área de Compras (ou para a Diretoria) até o Administrador escolher o comprador.</div>' : "") +
      '<div id="cpForm"></div></div>';
    Cp_formRequisicao_(Cp_$_("cpForm"), alvo && alvo.requisicao ? alvo.requisicao : null);
  }

  // =========================================================
  // FILA DE COMPRAS (comprador, gestores, Diretoria)
  // =========================================================
  function Compras_renderFila_(div) {
    var f = CP.filtro, ini = CP.ini;

      ["RECEBIDA_DIVERGENCIA", "Com divergência"], ["DISPONIVEL", "Disponíveis"], ["ENTREGUE", "Entregues"], ["CANCELADA", "Canceladas"], ["TODAS", "Todas"]];
    div.innerHTML = '<div class="module-shell">' + Cp_cabecalho_("Fila de compras", "Todos os pedidos de compra, do mais urgente ao mais antigo. Toque num pedido para conferir a especificação, cotar, aprovar, fazer o pedido, receber e entregar.",
      '<button type="button" class="btn-secondary" id="cpFilaAtualizar"><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Atualizar</button>' + (ini.comprador ? '<button type="button" class="btn-primary" onclick="abrir(\'compras_pedir\')"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Novo pedido</button>' : '')) +
      (!ini.temComprador ? '<div class="cp-faixa aviso">Nenhum comprador escolhido. Os pedidos vão para o gestor da área de Compras ou para a Diretoria. O Administrador escolhe o comprador e o substituto em Compras > Regras de compras.</div>' : '') +
      Cp_avisosRecentes_() + '<div class="cp-tabs" id="cpAbas"></div><div class="cp-filtros"><div>' + Cp_campo_("Buscar", '<input type="search" id="cpBusca" placeholder="Número, item, quem pediu, cliente" value="' + Cp_esc_(f.busca) + '">') + '</div></div><div id="cpFila"><div class="cp-vazio">Carregando…</div></div></div>';
    Cp_$_("cpFilaAtualizar").onclick = function () { Compras_renderFila_(div); };
    var t = null;
    Cp_$_("cpBusca").oninput = function () { clearTimeout(t); var v = this.value; t = setTimeout(function () { f.busca = v; carregar(); }, 400); };
    function carregar() {
      Cp_chamar_("fila", { situacao: f.situacao, busca: f.busca }, function (r) {
        var cont = r.contagem || {}, abertas = ["SOLICITADA", "EM_COTACAO", "AGUARDANDO_APROVACAO", "APROVADA", "PEDIDO_FEITO", "RECEBIDA_DIVERGENCIA", "DISPONIVEL"].reduce(function (s, k) { return s + (cont[k] || 0); }, 0);
        Cp_$_("cpAbas").innerHTML = abas.map(function (a) { var n = a[0] === "ABERTAS" ? abertas : a[0] === "TODAS" ? "" : (cont[a[0]] || 0); return '<button type="button" class="cp-tab' + (f.situacao === a[0] ? " active" : "") + '" data-sit="' + a[0] + '">' + a[1] + (n !== "" ? '<span>' + n + '</span>' : '') + '</button>'; }).join("");
        Cp_$_("cpAbas").querySelectorAll("[data-sit]").forEach(function (b) { b.onclick = function () { f.situacao = b.getAttribute("data-sit"); carregar(); }; });
        var el = Cp_$_("cpFila");
        if (!r.requisicoes.length) { el.innerHTML = '<div class="cp-vazio">Nenhum pedido nesta situação.</div>'; return; }
        el.innerHTML = '<div class="cp-lista">' + r.requisicoes.map(function (q) {
          var enc = q.situacao === "ENTREGUE" || q.situacao === "CANCELADA";
          return '<div class="cp-card clicavel' + (q.urgencia === "CRITICA" && !enc ? " critica" : q.urgencia === "ALTA" && !enc ? " alta" : enc ? " encerrada" : "") + '" data-req="' + Cp_esc_(q.id) + '"><p class="cp-card-tit">' + Cp_esc_(q.numero) + ' · ' + Cp_esc_(q.titulo) + '</p>' +
            '<p class="cp-meta">' + Cp_selos_(q) + (q.valorTxt ? ' <b>' + Cp_esc_(q.valorTxt) + '</b> ·' : '') + ' ' + Cp_esc_(q.solicitante.nome) + ' · ' + Cp_esc_(q.vinculo.texto) + ' · desde ' + Cp_esc_(q.criadoEm) + (q.previsaoEntrega ? ' · previsão ' + Cp_esc_(q.previsaoEntrega) : '') + '</p></div>';
        }).join("") + '</div>';
        el.querySelectorAll("[data-req]").forEach(function (c) { c.onclick = function () { Compras_abrirFicha_(c.getAttribute("data-req")); }; });
      }, function (m) { Cp_msg_("cpFila", m); });

  /** Ficha do pedido (gaveta). Cada etapa acrescenta a sua seção (cotações, aprovação, pedido, recebimento, Financeiro). */
  function Compras_abrirFicha_(id) {
    Cp_gaveta_("Pedido de compra", '<div class="cp-vazio">Carregando…</div>');
    Cp_chamar_("requisicao", { id: id }, function (r) { Cp_desenharFicha_(r.requisicao); }, function (m) { Cp_msg_("cpGavetaCorpo", m); });
  }
  function Cp_recarregarFicha_(id, msg, tipo) {
    Cp_chamar_("requisicao", { id: id }, function (r) { Cp_desenharFicha_(r.requisicao); if (msg) Cp_msg_("cpFichaMsg", msg, tipo || "ok"); }, function (m) { Cp_msg_("cpGavetaCorpo", m); });
  }
  function Cp_desenharFicha_(q) {
    var corpo = Cp_$_("cpGavetaCorpo");
    if (!corpo) { Cp_gaveta_("Pedido de compra", ""); corpo = Cp_$_("cpGavetaCorpo"); }
    var cab = document.querySelector("#cpGaveta .atv-drawer-cab h3"); if (cab) cab.textContent = q.numero + " · " + q.situacaoNome;
    var a = q.acoes || {};
    var h = '<div id="cpFichaMsg"></div><p class="cp-card-tit">' + Cp_esc_(q.titulo) + '</p><p class="cp-meta">' + Cp_selos_(q) + (q.valorTxt ? ' <b>' + Cp_esc_(q.valorTxt) + '</b>' : '') + '</p>' +
      '<dl class="cp-det"><dt>Quem pediu</dt><dd>' + Cp_esc_(q.solicitante.nome) + ' em ' + Cp_esc_(q.criadoEm) + '</dd><dt>Para que é</dt><dd>' + Cp_esc_(q.finalidade) + '</dd>' +
      '<dt>Vínculo</dt><dd>' + Cp_esc_(q.vinculo.texto) + '</dd><dt>Urgência</dt><dd>' + Cp_esc_(q.urgenciaNome) + (q.precisaAte ? ' · precisa até ' + Cp_esc_(q.precisaAte) : '') + '</dd>' +
      '<dt>Comprador</dt><dd>' + Cp_esc_(q.comprador.nome || "—") + '</dd>' + (q.previsaoEntrega ? '<dt>Previsão de entrega</dt><dd>' + Cp_esc_(q.previsaoEntrega) + '</dd>' : '') + '</dl>';
    if (q.especIncompleta) h += '<div class="cp-faixa aviso"><b>Especificação incompleta.</b> ' + Cp_esc_((q.falta || []).join("; ")) + ' O pedido não é cotado até completar.</div>';
    h += '<div class="cp-sec">Itens</div>' + q.itens.map(function (i) {
      var tec = [i.partNumber ? "nº da peça " + i.partNumber : "", i.marca, i.equipamentoTexto, i.tensao, i.corrente, i.pressao, i.rosca, i.dimensao, i.material, i.outras].filter(Boolean).join(" · ");
      return '<div class="cp-item"><p class="cp-txt"><b>' + i.ordem + '. ' + Cp_esc_(i.descricao) + '</b> — ' + Cp_esc_(i.quantidadeTxt + ' ' + i.unidade) + ' <span class="cp-meta">' + Cp_esc_(i.categoriaNome) + '</span></p>' +
        (tec ? '<p class="cp-meta">' + Cp_esc_(tec) + '</p>' : '') + (i.fotos.length ? '<div class="cp-fotos">' + i.fotos.map(function (f) { return '<a href="' + Cp_esc_(f.url) + '" target="_blank" rel="noopener">' + Cp_esc_(f.nome) + '</a>'; }).join("") + '</div>' : '') +
        (i.falta && i.falta.length ? '<p class="cp-falta">Falta: ' + Cp_esc_(i.falta.join(", ")) + '</p>' : '') + '</div>';
    }).join("");
    var botoes = [];
    if (a.iniciarCotacao) botoes.push('<button type="button" class="btn-primary" data-f="iniciar">Especificação conferida: iniciar cotação</button>');
    if (a.editar) botoes.push('<button type="button" class="btn-secondary" data-f="editar">Editar a especificação</button>');
    if (a.devolver) botoes.push('<button type="button" class="btn-secondary" data-f="devolver">Devolver a especificação</button>');
    if (a.cancelar) botoes.push('<button type="button" class="btn-secondary" data-f="cancelar">Cancelar o pedido</button>');
    if (botoes.length) h += '<div class="cp-acoes">' + botoes.join("") + '</div>';
    if (typeof Cp_secaoCotacoes_ === "function") h += Cp_secaoCotacoes_(q);
    if (typeof Cp_secaoPedido_ === "function") h += Cp_secaoPedido_(q);
    if (typeof Cp_secaoFinanceiro_ === "function") h += Cp_secaoFinanceiro_(q);
    h += '<div class="cp-sec">Histórico</div><div class="cp-hist">' + (q.historico || []).map(function (x) { return '<div><span class="q">' + Cp_esc_(x.em) + ' · ' + Cp_esc_(x.por) + (x.para ? ' · ' + Cp_esc_(x.para) : '') + '</span><br>' + Cp_esc_(x.texto) + '</div>'; }).join("") + '</div>';
    corpo.innerHTML = h;
    var b = function (sel, fn) { var el = corpo.querySelector('[data-f="' + sel + '"]'); if (el) el.onclick = fn; };
    b("iniciar", function () { Cp_chamar_("iniciarCotacao", { id: q.id }, function (r) { Cp_recarregarFicha_(q.id, r.message); }, function (m) { Cp_msg_("cpFichaMsg", m); }, { carregando: "Salvando…" }); });
    b("editar", function () { corpo.innerHTML = '<div id="cpFormG"></div>'; Cp_formRequisicao_(Cp_$_("cpFormG"), q); });
    b("devolver", function () { Cp_pedirTexto_("Devolver a especificação", "Quem pediu recebe o texto no sistema e no resumo de e-mail da manhã, e o pedido volta para \"Solicitada\" até completar.", "O que falta ou está ambíguo", 10, function (t, ov) { Cp_chamar_("devolverEspec", { id: q.id, texto: t }, function (r) { ov.remove(); Cp_recarregarFicha_(q.id, r.message); }, function (m) { Cp_msg_("cpTxtMsg", m); }); }, "Devolver"); });
    b("cancelar", function () { Cp_cancelar_(q, function (r) { Cp_recarregarFicha_(q.id, r.message); }); });
    if (typeof Cp_ligarCotacoes_ === "function") Cp_ligarCotacoes_(q, corpo);
    if (typeof Cp_ligarPedido_ === "function") Cp_ligarPedido_(q, corpo);
    if (typeof Cp_ligarFinanceiro_ === "function") Cp_ligarFinanceiro_(q, corpo);
  }

  // =========================================================
  // COTAÇÕES E APROVAÇÃO (seção da ficha; só para quem vê valores)
  // =========================================================
  function Cp_secaoCotacoes_(q) {
    if (!q.veValores || !q.cotacoes) return "";
    var a = q.acoes || {}, h = '<div class="cp-sec">Cotações</div>';
    if (["SOLICITADA"].indexOf(q.situacao) >= 0) return h + '<p class="cp-meta">Os orçamentos são lançados depois que a especificação é conferida ("iniciar cotação").</p>';
    var ativas = q.cotacoes.filter(function (c) { return c.situacao !== "RETIRADA"; });
    if (!ativas.length) h += '<p class="cp-meta">Nenhum orçamento lançado ainda.' + (q.faixa ? '' : ' Cada orçamento precisa do arquivo do fornecedor (PDF, foto ou e-mail salvo).') + '</p>';
    else h += '<table class="cp-tabela"><thead><tr><th>Fornecedor</th><th class="n">Total</th><th>Prazo</th><th>Validade</th><th>Situação</th><th></th></tr></thead><tbody>' + ativas.map(function (c) {
      var sit = c.situacao === "ESCOLHIDA" ? '<span class="cp-selo verde">Escolhida</span>' : (c.elegivel ? (c.maisBarata ? '<span class="cp-selo azul">Mais barata</span>' : '') : '<span class="cp-selo vermelho">' + Cp_esc_(c.motivoInelegivel) + '</span>');
      return '<tr' + (c.situacao === "ESCOLHIDA" ? ' class="vencedora"' : '') + '><td data-r="Fornecedor"><b>' + Cp_esc_(c.fornecedor) + '</b>' + (c.referencia ? '<br><span class="cp-meta">Orçamento ' + Cp_esc_(c.referencia) + '</span>' : '') + (c.compatNome ? '<br><span class="cp-meta">' + Cp_esc_(c.compatNome) + '</span>' : '') +
        (c.arquivo ? '<br><a href="' + Cp_esc_(c.arquivo.url) + '" target="_blank" rel="noopener">Arquivo do orçamento</a>' : '') + '</td><td class="n" data-r="Total"><b>' + Cp_esc_(c.totalTxt) + '</b><br><span class="cp-meta">frete ' + Cp_esc_(c.freteTxt) + ' · impostos ' + Cp_esc_(c.impostosTxt) + '</span></td>' +
        '<td data-r="Prazo">' + Cp_esc_(c.prazoDias) + ' dias</td><td data-r="Validade">' + Cp_esc_(c.validade) + '</td><td data-r="Situação">' + sit + '</td><td data-r="">' +
        (a.cotar ? '<button type="button" class="btn-secondary" data-cot-corrigir="' + Cp_esc_(c.id) + '">Corrigir</button> <button type="button" class="btn-secondary" data-cot-retirar="' + Cp_esc_(c.id) + '">Retirar</button>' + (c.elegivel ? ' <button type="button" class="btn-primary" data-cot-escolher="' + Cp_esc_(c.id) + '">Escolher este orçamento</button>' : '') : '') + '</td></tr>';
    }).join("") + '</tbody></table>';
    var ret = q.cotacoes.filter(function (c) { return c.situacao === "RETIRADA"; });
    if (ret.length) h += '<p class="cp-meta">Retirados: ' + Cp_esc_(ret.map(function (c) { return c.fornecedor + " (" + c.retiradaMotivo + ")"; }).join("; ")) + '</p>';
    if (a.cotar) h += '<div class="cp-acoes"><button type="button" class="btn-primary" data-f="cotar"><i class="fas fa-plus" aria-hidden="true"></i>&nbsp;Lançar orçamento</button></div>';
    if (q.escolhida) h += '<p class="cp-txt"><b>Escolhido:</b> ' + Cp_esc_(q.escolhida.fornecedor) + ' · ' + Cp_esc_(q.escolhida.totalTxt) + ' por ' + Cp_esc_(q.escolhida.por) + ' em ' + Cp_esc_(q.escolhida.em) + (q.escolhaJustificativa ? '. Não é o mais barato: ' + Cp_esc_(q.escolhaJustificativa) : '') + (q.cotacoesJustificativa ? '. Menos cotações que o mínimo: ' + Cp_esc_(q.cotacoesJustificativa) : '') + '</p>';
    h += '<div class="cp-sec">Aprovação</div>';
    if (q.aprovacao) {
      h += '<div class="cp-faixa aviso"><b>Aguardando aprovação</b> (' + Cp_esc_(q.aprovacao.nivelNome) + ') desde ' + Cp_esc_(q.aprovacao.pedidaEm) + '. Quem aprova: ' + Cp_esc_(q.aprovacao.quem.join(", ")) + '. ' + Cp_esc_(q.aprovacao.motivoRota) + '</div>';
      if (q.aprovacao.podeEu) h += '<div class="cp-acoes"><button type="button" class="btn-primary" data-f="aprovar">Aprovar</button><button type="button" class="btn-secondary" data-f="reprovar">Reprovar</button></div>';
      else h += '<p class="cp-meta">' + Cp_esc_(q.aprovacao.motivoNaoPode) + '</p>';
    } else if (q.aprovadaPor) h += '<p class="cp-txt">Aprovada por <b>' + Cp_esc_(q.aprovadaPor) + '</b> em ' + Cp_esc_(q.aprovadaEm) + (q.aprovadorNivelNome ? ' (' + Cp_esc_(q.aprovadorNivelNome) + ')' : '') + '. ' + Cp_esc_(q.aprovacaoTexto) + '</p>';
    else h += '<p class="cp-meta">Depois da escolha do orçamento. Faixas: ' + Cp_esc_((CP.ini.faixas || []).map(function (f) { return f.nome + " — " + f.aprovador + " (" + f.cotacoes + " cotação" + (f.cotacoes > 1 ? "ões" : "") + ")"; }).join("; ")) + '.</p>';
    if (q.aprovacoes && q.aprovacoes.length) h += '<div class="cp-hist">' + q.aprovacoes.map(function (x) { return '<div><span class="q">' + Cp_esc_(x.em) + ' · ' + Cp_esc_(x.por) + ' · ' + Cp_esc_(x.nivel) + '</span><br>' + (x.decisao === "APROVADA" ? "Aprovada" : "Reprovada") + ' (' + Cp_esc_(x.valorTxt) + ')' + (x.texto ? ': ' + Cp_esc_(x.texto) : '') + '</div>'; }).join("") + '</div>';
    return h;
  }

  function Cp_ligarCotacoes_(q, corpo) {
    var b = function (sel, fn) { var el = corpo.querySelector('[data-f="' + sel + '"]'); if (el) el.onclick = fn; };
    b("cotar", function () { Cp_formCotacao_(q, null); });
    corpo.querySelectorAll("[data-cot-corrigir]").forEach(function (x) { x.onclick = function () { Cp_formCotacao_(q, q.cotacoes.filter(function (c) { return c.id === x.getAttribute("data-cot-corrigir"); })[0]); }; });
    corpo.querySelectorAll("[data-cot-retirar]").forEach(function (x) { x.onclick = function () { Cp_pedirTexto_("Retirar o orçamento", "O orçamento sai da comparação e fica no histórico com o motivo.", "Motivo", 5, function (t, ov) { Cp_chamar_("retirarCotacao", { id: x.getAttribute("data-cot-retirar"), motivo: t }, function (r) { ov.remove(); Cp_recarregarFicha_(q.id, r.message); }, function (m) { Cp_msg_("cpTxtMsg", m); }); }, "Retirar"); }; });
    corpo.querySelectorAll("[data-cot-escolher]").forEach(function (x) { x.onclick = function () { Cp_escolher_(q, q.cotacoes.filter(function (c) { return c.id === x.getAttribute("data-cot-escolher"); })[0]); }; });
    b("aprovar", function () { Cp_pedirTexto_("Aprovar a compra " + q.numero, "O comprador recebe a atividade para fazer o pedido ao fornecedor. Observação opcional.", "Observação (opcional)", 0, function (t, ov) { Cp_chamar_("decidir", { requisicaoId: q.id, aprovar: true, texto: t }, function (r) { ov.remove(); Cp_recarregarFicha_(q.id, r.message); }, function (m) { Cp_msg_("cpTxtMsg", m); }); }, "Aprovar"); });
    b("reprovar", function () { Cp_pedirTexto_("Reprovar a compra " + q.numero, "A compra volta para cotação e o comprador recebe o motivo.", "Motivo", 10, function (t, ov) { Cp_chamar_("decidir", { requisicaoId: q.id, aprovar: false, texto: t }, function (r) { ov.remove(); Cp_recarregarFicha_(q.id, r.message); }, function (m) { Cp_msg_("cpTxtMsg", m); }); }, "Reprovar"); });
  }

  /** Lançar (c = null) ou corrigir um orçamento. */
  function Cp_formCotacao_(q, c) {
    var num = function (v) { var s = String(v || "").replace(/\s|R\$/g, ""); if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(",", "."); var n = Number(s); return isFinite(n) ? n : 0; };
    var moeda = function (n) { return "R$ " + (Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var ov = Cp_modal_(c ? "Corrigir o orçamento de " + c.fornecedor : "Lançar orçamento", '<div class="cp-vazio">Carregando os fornecedores…</div>', '<button type="button" class="btn-secondary" data-x>Voltar</button><button type="button" class="btn-primary" data-ok>Salvar o orçamento</button>', 720);
    ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
    Cp_chamar_("fornecedores", {}, function (rf) {
      var corpo = ov.querySelector(".atv-modal-corpo"), precoDe = function (itemId) { var p = c && c.precos.filter(function (x) { return x.itemId === itemId; })[0]; return p && p.precoUnitario !== null ? String(p.precoUnitario).replace(".", ",") : ""; };
      corpo.innerHTML = Cp_campo_("Fornecedor", '<select id="ctForn">' + Cp_opcoes_(rf.fornecedores.map(function (f) { return { v: f.id, t: f.nome + " · " + f.documento }; }), c ? c.fornecedorId : "", "Escolha o fornecedor") + '</select>', rf.fornecedores.length ? "Não está na lista? Cadastre em Compras > Fornecedores." : "Nenhum fornecedor ativo: cadastre em Compras > Fornecedores.") +
        '<div class="cp-sec">Preço unitário de cada item</div>' + q.itens.map(function (i) { return Cp_campo_(i.ordem + ". " + i.descricao + " (" + i.quantidadeTxt + " " + i.unidade + ")", '<input type="text" inputmode="decimal" data-pu="' + Cp_esc_(i.id) + '" data-q="' + i.quantidade + '" value="' + Cp_esc_(precoDe(i.id)) + '" placeholder="0,00">'); }).join("") +
        '<div class="cp-grade3">' + Cp_campo_("Frete (R$)", '<input type="text" inputmode="decimal" id="ctFrete" value="' + Cp_esc_(c ? String(c.frete).replace(".", ",") : "") + '">') + Cp_campo_("Impostos (R$)", '<input type="text" inputmode="decimal" id="ctImp" value="' + Cp_esc_(c ? String(c.impostos).replace(".", ",") : "") + '">', "Só os que não estão no preço.") +
        Cp_campo_("Total (calculado)", '<input type="text" id="ctTotal" disabled>') + '</div>' +
        '<div class="cp-grade3">' + Cp_campo_("Prazo de entrega (dias)", '<input type="number" min="0" id="ctPrazo" value="' + Cp_esc_(c ? c.prazoDias : "") + '">') + Cp_campo_("Orçamento válido até", '<input type="date" id="ctVal" value="' + Cp_esc_(c ? c.validadeIso : "") + '">') +
        Cp_campo_("Número do orçamento do fornecedor", '<input type="text" id="ctRef" maxlength="80" value="' + Cp_esc_(c ? c.referencia : "") + '">') + '</div>' +
        Cp_campo_("Condição de pagamento", '<input type="text" id="ctCond" maxlength="200" value="' + Cp_esc_(c ? c.condicao : "") + '" placeholder="Exemplo: boleto 28 dias, cartão em 3 vezes">') +
        (q.temTecnica ? Cp_campo_("A peça cotada é", '<select id="ctCompat">' + Cp_opcoes_(Cp_mapaOpcoes_(CP.ini.compatibilidade), c ? c.compatibilidade : "", "Escolha") + '</select>', "Orçamento \"a confirmar\" não pode ser escolhido.") : '') +

      Cp_$_("cpGavetaCorpo").innerHTML = h;
      var g = Cp_$_("cpGavetaCorpo");
      var bx = function (s, fn) { var el = g.querySelector('[data-x="' + s + '"]'); if (el) el.onclick = fn; };
      bx("editar", function () { Cp_formFornecedor_(f, depois); });
      bx("arquivar", function () { Cp_pedirTexto_("Arquivar " + f.nome, "O fornecedor sai da escolha nas cotações; o histórico de compras continua.", "Motivo", 10, function (t, ov) { Cp_chamar_("arquivarFornecedor", { id: f.id, motivo: t }, function (rr) { ov.remove(); Cp_abrirFornecedor_(f.id, depois); if (depois) depois(); }, function (m) { Cp_msg_("cpTxtMsg", m); }); }, "Arquivar"); });
      bx("reativar", function () { Cp_chamar_("arquivarFornecedor", { id: f.id, reativar: true }, function () { Cp_abrirFornecedor_(f.id, depois); if (depois) depois(); }, function (m) { Cp_msg_("cpFornMsg", m); }); });
    }, function (m) { Cp_msg_("cpGavetaCorpo", m); });
  }

  function Cp_formFornecedor_(f, depois) {
    var ini = CP.ini; f = f || { categorias: [] };
    Cp_gaveta_(f.id ? "Editar fornecedor" : "Novo fornecedor", '<div id="cpFF"></div>');
    var el = Cp_$_("cpFF");
    el.innerHTML = '<div class="cp-grade2">' + Cp_campo_("CNPJ (ou CPF de pessoa física)", '<input type="text" id="ffDoc" inputmode="numeric" value="' + Cp_esc_(f.documento) + '">', "Toque em Consultar CNPJ para preencher razão social e endereço.") +
      '<div class="cp-campo"><label>&nbsp;</label><button type="button" class="btn-secondary" id="ffConsultar"><i class="fas fa-magnifying-glass" aria-hidden="true"></i>&nbsp;Consultar CNPJ</button></div></div>' +
      '<div class="cp-grade2">' + Cp_campo_("Razão social", '<input type="text" id="ffRazao" maxlength="160" value="' + Cp_esc_(f.razao) + '">') + Cp_campo_("Nome fantasia", '<input type="text" id="ffFant" maxlength="160" value="' + Cp_esc_(f.fantasia) + '">') + '</div>' +
      Cp_campo_("Endereço", '<input type="text" id="ffEnd" maxlength="300" value="' + Cp_esc_(f.endereco) + '">') +
      '<div class="cp-grade3">' + Cp_campo_("Cidade", '<input type="text" id="ffCid" maxlength="80" value="' + Cp_esc_(f.cidadeNome) + '">') + Cp_campo_("UF", '<input type="text" id="ffUf" maxlength="2" value="' + Cp_esc_(f.uf) + '">') + Cp_campo_("Prazo médio de entrega (dias)", '<input type="text" inputmode="numeric" id="ffPrazo" value="' + Cp_esc_(f.prazoMedioDias) + '">') + '</div>' +
      '<div class="cp-grade3">' + Cp_campo_("Contato", '<input type="text" id="ffCont" maxlength="120" value="' + Cp_esc_(f.contato) + '">') + Cp_campo_("Telefone", '<input type="text" id="ffTel" maxlength="40" value="' + Cp_esc_(f.telefone) + '">') + Cp_campo_("WhatsApp", '<input type="text" id="ffWa" maxlength="40" value="' + Cp_esc_(f.whatsapp) + '">') + '</div>' +
      Cp_campo_("E-mail para pedidos", '<input type="email" id="ffEmail" maxlength="160" value="' + Cp_esc_(f.email) + '">', "Para onde vai o pedido de compra pelo Enviar documento.") +
      Cp_campo_("Categorias", ini.categoriasFornecedor.map(function (c) { return '<label class="cp-check"><input type="checkbox" data-cat value="' + Cp_esc_(c) + '"' + (f.categorias.indexOf(c) >= 0 ? " checked" : "") + '> ' + Cp_esc_(c) + '</label>'; }).join("")) +
      Cp_campo_("Condição de pagamento usual", '<input type="text" id="ffCond" maxlength="200" value="' + Cp_esc_(f.condicaoPagamento) + '">') +
      Cp_campo_("Observações", '<textarea id="ffObs" maxlength="1000">' + Cp_esc_(f.obs) + '</textarea>') +
      '<div id="ffMsg"></div><div class="cp-acoes"><button type="button" class="btn-primary" id="ffSalvar">Salvar fornecedor</button></div>';
    Cp_$_("ffConsultar").onclick = function () {
      Cp_chamar_("consultarCnpj", { documento: Cp_$_("ffDoc").value }, function (r) {
        var d = r.dados;
        Cp_$_("ffDoc").value = d.documento; Cp_$_("ffRazao").value = d.razao; if (d.fantasia) Cp_$_("ffFant").value = d.fantasia; Cp_$_("ffEnd").value = d.endereco; Cp_$_("ffCid").value = d.cidade; Cp_$_("ffUf").value = d.uf;
        if (d.telefone && !Cp_$_("ffTel").value) Cp_$_("ffTel").value = d.telefone; if (d.email && !Cp_$_("ffEmail").value) Cp_$_("ffEmail").value = d.email;
        Cp_msg_("ffMsg", r.message + (d.situacao && !/ATIVA/i.test(d.situacao) ? " Atenção: situação cadastral " + d.situacao + "." : ""), r.jaCadastrado ? "aviso" : "ok");
      }, function (m) { Cp_msg_("ffMsg", m); }, { carregando: "Consultando o CNPJ…" });
    };
    var salvar = function (confirmar) {
      var dados = { id: f.id || "", documento: Cp_$_("ffDoc").value, razao: Cp_$_("ffRazao").value, fantasia: Cp_$_("ffFant").value, endereco: Cp_$_("ffEnd").value, cidade: Cp_$_("ffCid").value, uf: Cp_$_("ffUf").value,
        prazoMedioDias: Cp_$_("ffPrazo").value, contato: Cp_$_("ffCont").value, telefone: Cp_$_("ffTel").value, whatsapp: Cp_$_("ffWa").value, email: Cp_$_("ffEmail").value, condicaoPagamento: Cp_$_("ffCond").value, obs: Cp_$_("ffObs").value,
        categorias: Array.prototype.map.call(document.querySelectorAll("#cpFF [data-cat]:checked"), function (x) { return x.value; }), confirmarParecido: !!confirmar };
      Cp_chamar_("salvarFornecedor", dados, function (r) {
        if (r.parecidos) { Cp_$_("ffMsg").innerHTML = '<div class="cp-faixa aviso">' + Cp_esc_(r.message) + '<div class="cp-acoes"><button type="button" class="btn-secondary" id="ffMesmo">Salvar mesmo assim</button></div></div>'; Cp_$_("ffMesmo").onclick = function () { salvar(true); }; return; }
        if (depois) depois();
        Cp_abrirFornecedor_(r.fornecedor.id, depois);
      }, function (m) { Cp_msg_("ffMsg", m); }, { carregando: "Salvando…" });
    };
    Cp_$_("ffSalvar").onclick = function () { salvar(false); };
  }

  function Cp_importarFornecedores_(depois) {
    var ov = Cp_modal_("Importar fornecedores da planilha", '<p class="cp-txt">Na planilha, selecione a linha de títulos e as linhas dos fornecedores, copie e cole aqui. Títulos reconhecidos: CNPJ, Razão social, Nome fantasia, Contato, Telefone, WhatsApp, E-mail, Categoria, Prazo, Cidade, UF, Endereço, Condição, Observações.</p>' +
      '<p class="cp-txt"><b>Nada já preenchido é trocado:</b> CNPJ que já existe só ganha os campos vazios; CNPJ novo vira fornecedor.</p>' + Cp_campo_("Linhas copiadas", '<textarea id="cpImpTxt" style="min-height:160px"></textarea>') + '<div id="cpImpRes"></div>',
      '<button type="button" class="btn-secondary" data-x>Fechar</button><button type="button" class="btn-secondary" data-previa>Ver a prévia</button><button type="button" class="btn-primary" data-aplicar disabled>Aplicar a importação</button>', 720);
    ov.querySelector("[data-x]").onclick = function () { ov.remove(); };
    var mostrar = function (r) {
      Cp_$_("cpImpRes").innerHTML = '<div class="cp-faixa ok">' + Cp_esc_(r.message) + '</div>' + (r.recusados.length ? '<p class="cp-meta">Recusadas: ' + Cp_esc_(r.recusados.map(function (x) { return "linha " + x.linha + " (" + x.motivo + ")"; }).join("; ")) + '</p>' : '') +
        (r.completados.length ? '<p class="cp-meta">Completados: ' + Cp_esc_(r.completados.map(function (x) { return x.nome + " (" + x.campos.length + " campos)"; }).join("; ")) + '</p>' : '');
    };
    ov.querySelector("[data-previa]").onclick = function () { Cp_chamar_("importarFornecedores", { texto: Cp_$_("cpImpTxt").value }, function (r) { mostrar(r); ov.querySelector("[data-aplicar]").disabled = !(r.novos.length || r.completados.length); }, function (m) { Cp_msg_("cpImpRes", m); }); };
    ov.querySelector("[data-aplicar]").onclick = function () { Cp_chamar_("importarFornecedores", { texto: Cp_$_("cpImpTxt").value, aplicar: true }, function (r) { mostrar(r); ov.querySelector("[data-aplicar]").disabled = true; if (depois) depois(); }, function (m) { Cp_msg_("cpImpRes", m); }, { carregando: "Importando…" }); };
  }

  // =========================================================
  // REGRAS DE COMPRAS (Administrador e Diretoria editam; compradores consultam)
  // =========================================================
  function Compras_renderRegras_(div) {
    div.innerHTML = '<div class="module-shell">' + Cp_cabecalho_("Regras de compras", "Quem compra, quem aprova até que valor, quantos orçamentos cada faixa pede e os dados da empresa no pedido de compra. Cada alteração vira uma versão nova, com o motivo.") + '<div id="cpRegras"><div class="cp-vazio">Carregando…</div></div></div>';
    Cp_chamar_("regras", {}, function (r) {
      var g = r.regras, ed = r.podeEditar, dis = ed ? "" : " disabled";
      var pessoas = function (campo) { return '<div style="max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px">' + r.equipe.map(function (u) { return '<label class="cp-check"><input type="checkbox" data-' + campo + ' value="' + Cp_esc_(u.id) + '"' + ((g[campo] || []).indexOf(u.id) >= 0 ? " checked" : "") + dis + '> ' + Cp_esc_(u.nome) + ' <span class="cp-meta">' + Cp_esc_(u.perfil + (u.area ? " · " + u.area : "")) + '</span></label>'; }).join("") + '</div>'; };
      var h = (ed ? '' : '<div class="cp-faixa">Só o Administrador e a Diretoria alteram as regras. Você está vendo as regras em vigor.</div>') +
        '<div class="cp-caixa"><h3>Compradores</h3><div class="cp-grade2">' + Cp_campo_("Comprador (recebe os pedidos)", pessoas("compradores"), "O primeiro ativo da lista recebe a atividade de cada pedido novo.") +
        Cp_campo_("Substituto (férias e ausências)", pessoas("substitutos"), "Também pode cotar, fazer o pedido e aprovar a faixa do comprador. Assume quando o comprador está inativo.") + '</div>' +
        Cp_campo_("Área de Compras", '<select id="rgArea"' + dis + '>' + Cp_opcoes_(r.areas.map(function (a) { return { v: a.codigo, t: a.nome }; }), g.areaCompras) + '</select>', "Define o gestor que cobra as compras paradas (hoje: " + (r.gestoresCompras.join(", ") || "nenhum gestor nesta área; vai para a Diretoria") + ").") + '</div>' +
        '<div class="cp-caixa"><h3>Aprovação por valor e cotações mínimas</h3><table class="cp-tabela"><thead><tr><th>Faixa</th><th>Valor total até</th><th>Quem aprova</th><th>Cotações mínimas</th></tr></thead><tbody>' + g.faixas.map(function (f, i) {
          var ult = i === g.faixas.length - 1;
          return '<tr><td data-r="Faixa">' + (i + 1) + '</td><td data-r="Até">' + (ult ? 'acima da faixa anterior' : '<input type="text" inputmode="decimal" data-fx-ate="' + i + '" value="' + Cp_esc_(f.ate) + '"' + dis + '>') + '</td>' +
            '<td data-r="Quem aprova"><select data-fx-apr="' + i + '"' + dis + '>' + Cp_opcoes_(Cp_mapaOpcoes_(r.niveis), f.aprovador) + '</select></td><td data-r="Cotações"><input type="number" min="1" max="5" data-fx-cot="' + i + '" value="' + Cp_esc_(f.cotacoes) + '"' + dis + '></td></tr>';
        }).join("") + '</tbody></table><p class="cp-meta">Quem pediu não aprova a própria compra. Acima da faixa do comprador, quem lançou ou escolheu a cotação também não aprova. Com menos cotações que o mínimo, o comprador escreve a justificativa e a compra aparece marcada para o Financeiro.</p></div>' +
        '<div class="cp-caixa"><h3>Prazos</h3><div class="cp-grade3">' + Cp_campo_("Cotar (dias úteis, urgência normal e alta)", '<input type="number" min="1" max="10" id="rgCotar" value="' + Cp_esc_(g.prazos.cotarDiasUteis) + '"' + dis + '>') +
        Cp_campo_("Cotar (dias úteis, urgência baixa)", '<input type="number" min="1" max="15" id="rgCotarBaixa" value="' + Cp_esc_(g.prazos.cotarBaixaDiasUteis) + '"' + dis + '>') + Cp_campo_("Crítica: horas para cotar", '<input type="number" min="1" max="8" id="rgCritica" value="' + Cp_esc_(g.prazos.criticaHoras) + '"' + dis + '>') + '</div>' +
        '<div class="cp-grade3">' + Cp_campo_("Aprovada sem pedido: avisar após (dias úteis)", '<input type="number" min="1" max="10" id="rgParado" value="' + Cp_esc_(g.prazos.paradoDiasUteis) + '"' + dis + '>') + Cp_campo_("Gestor de Compras cobra após (dias úteis)", '<input type="number" min="1" max="15" id="rgGestor" value="' + Cp_esc_(g.prazos.gestorAposDiasUteis) + '"' + dis + '>') +
        Cp_campo_("Resumo de e-mail a partir de", '<input type="time" id="rgHora" value="' + Cp_esc_(g.avisos.horaResumo) + '"' + dis + '>') + '</div></div>' +
        '<div class="cp-caixa"><h3>Pedido de compra (folha A4)</h3>' + Cp_campo_("Endereço de entrega", '<textarea id="rgEntrega" maxlength="400"' + dis + '>' + Cp_esc_(g.empresa.enderecoEntrega) + '</textarea>') + Cp_campo_("Endereço de faturamento", '<textarea id="rgFat" maxlength="400"' + dis + '>' + Cp_esc_(g.empresa.enderecoFaturamento) + '</textarea>') +
        Cp_campo_("Observação no pedido", '<textarea id="rgObs" maxlength="600"' + dis + '>' + Cp_esc_(g.empresa.observacaoPedido) + '</textarea>') + '</div>' +
        (ed ? Cp_campo_("O que mudou e por quê", '<textarea id="rgMotivo" maxlength="500"></textarea>', "Obrigatório (pelo menos 10 letras). Fica no histórico de versões.") + '<div id="rgMsg"></div><div class="cp-acoes"><button type="button" class="btn-primary" id="rgSalvar">Salvar as regras</button></div>' : '') +
        '<div class="cp-sec">Versões</div>' + (r.versoes.length ? r.versoes.map(function (v) { return '<p class="cp-meta">Versão ' + v.versao + ' · ' + Cp_esc_(v.em) + ' · ' + Cp_esc_(v.por) + ' · ' + Cp_esc_(v.motivo) + '</p>'; }).join("") : '<p class="cp-meta">Em uso o padrão aprovado pelo dono (21/10/2026).</p>');
      var el = Cp_$_("cpRegras"); el.innerHTML = h;
      if (!ed) return;
      Cp_$_("rgSalvar").onclick = function () {
        var marcados = function (c) { return Array.prototype.map.call(el.querySelectorAll("[data-" + c + "]:checked"), function (x) { return x.value; }); };
        var nova = { compradores: marcados("compradores"), substitutos: marcados("substitutos"), areaCompras: Cp_$_("rgArea").value,
          faixas: g.faixas.map(function (f, i) { var a = el.querySelector('[data-fx-ate="' + i + '"]'); return { ate: a ? a.value : null, aprovador: el.querySelector('[data-fx-apr="' + i + '"]').value, cotacoes: el.querySelector('[data-fx-cot="' + i + '"]').value }; }),
          prazos: { cotarDiasUteis: Number(Cp_$_("rgCotar").value), cotarBaixaDiasUteis: Number(Cp_$_("rgCotarBaixa").value), criticaHoras: Number(Cp_$_("rgCritica").value), paradoDiasUteis: Number(Cp_$_("rgParado").value), gestorAposDiasUteis: Number(Cp_$_("rgGestor").value), pedidoDiasUteis: g.prazos.pedidoDiasUteis, entregaDiasUteis: g.prazos.entregaDiasUteis },
          empresa: { enderecoEntrega: Cp_$_("rgEntrega").value, enderecoFaturamento: Cp_$_("rgFat").value, observacaoPedido: Cp_$_("rgObs").value }, avisos: { horaResumo: Cp_$_("rgHora").value || "08:00" } };
        Cp_chamar_("regras", { salvar: nova, motivo: Cp_$_("rgMotivo").value }, function (rr) { CP.ini = null; Compras_garantirInicio_(function () {}); Compras_renderRegras_(div); setTimeout(function () { alert(rr.message); }, 50); }, function (m) { Cp_msg_("rgMsg", m); }, { carregando: "Salvando…" });
      };
    }, function (m) { Cp_msg_("cpRegras", m); });
  }
</script>

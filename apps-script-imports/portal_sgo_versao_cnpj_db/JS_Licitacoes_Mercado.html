<!--
  SGO+ LICITAÇÕES — FORNECEDORES, CONCORRENTES E INTELIGÊNCIA DE MERCADO (03/11/2026): a tela "Inteligência de mercado" (concorrentes,
  órgãos, preço de referência, cadastro de fornecedores e registros manuais), a aba "Mercado" da ficha e o quadro do mercado na tela do
  pedido de parecer. Servidor: SGO_Licitacoes_Mercado.js (Licitacoes_api ação "mercado" com { op }). Usa os utilitários de
  JS_Licitacoes.html (Lic_esc_, Lic_chamar_, Lic_janela_, Lic_faixa_, Lic_tabelaHtml_, Lic_brlHtml_, Lic_toast_, Lic_carregando_,
  Lic_erroTela_, Lic_ligarRefazer_, Lic_irFicha_, Lic_num_, Lic_url_, Lic_corpo_). Todo texto passa por Lic_esc_. Só consulta: as únicas
  gravações são do cadastro e dos registros manuais, sempre por ação de quem está na tela. Sem atualização automática.
-->
<style>
  .lmk-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 0 0 10px; }
  .lmk-filtros label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
  .lmk-filtros input, .lmk-filtros select { min-height: 44px; box-sizing: border-box; max-width: 100%; }
  .lmk-filtros > div { flex: 1 1 180px; min-width: 0; }
  .lmk-campo { margin: 8px 0; }
  .lmk-campo label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .lmk-campo input, .lmk-campo select, .lmk-campo textarea { width: 100%; min-height: 44px; box-sizing: border-box; max-width: 100%; }
  .lmk-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
  .lmk-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; margin: 8px 0; font-size: 12.5px; }
  .lmk-dl div { min-width: 0; }
  .lmk-dl span { display: block; color: var(--muted); font-weight: 700; font-size: 11.5px; }
  .lmk-dl b { font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .lmk-lista { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
  .lmk-lista li { padding: 6px 0; border-top: 1px dashed var(--border); overflow-wrap: anywhere; }
  .lmk-det summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
  .lmk-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 900px) { .lmk-acoes .btn-primary, .lmk-acoes .btn-secondary { flex: 1 1 140px; } }
</style>
<script>
  var LICMK = { aba: "concorrentes", meses: 24, busca: "", servico: "", equipamento: "", tela: null, ficha: {} };
  var LICMK_ABAS = [["concorrentes", "Concorrentes"], ["orgaos", "Órgãos"], ["referencia", "Preço de referência"], ["cadastro", "Cadastro de fornecedores"], ["registros", "Registros manuais"]];

  function LicMk_chamar_(op, dados, ok, erro, o) { Lic_chamar_("mercado", Object.assign({ op: op }, dados || {}), ok, erro, Object.assign({ ignorarVelha: true }, o || {})); }
  function LicMk_selo_(cor, texto) { return '<span class="cm-selo ' + Lic_esc_(cor || "cinza") + '">' + Lic_esc_(texto) + "</span>"; }
  function LicMk_dl_(pares) { return '<div class="lmk-dl">' + pares.map(function (x) { return "<div><span>" + Lic_esc_(x[0]) + "</span><b>" + x[1] + "</b></div>"; }).join("") + "</div>"; }
  function LicMk_pct_(v) { return v === null || v === undefined || !isFinite(Number(v)) ? "—" : Lic_esc_(Lic_num_(v) + "%"); }
  function LicMk_rs_(v) { return v === null || v === undefined || !isFinite(Number(v)) ? "—" : Lic_brlHtml_(v); }
  function LicMk_valor_(id) { var e = Lic_$_(id); return e ? e.value : ""; }
  function LicMk_msg_(id, texto, tipo) { var e = Lic_$_(id); if (e) e.innerHTML = Lic_faixa_(texto, tipo || "erro"); }
  function LicMk_link_(url, texto) { var u = Lic_url_(url); return u ? '<a href="' + Lic_esc_(u) + '" target="_blank" rel="noopener noreferrer">' + Lic_esc_(texto || "abrir a fonte") + "</a>" : ""; }
  function LicMk_desconto_(d) { if (!d || !d.n) return "—"; return LicMk_pct_(d.media) + ' <span class="cm-meta">(n = ' + Lic_esc_(d.n) + (d.pequena ? ", amostra pequena" : "") + ")</span>"; }
  function LicMk_estatTxt_(s) {
    if (!s || s.semDados) return LicMk_selo_("cinza", "Sem dados");
    return '<span class="lmk-num">' + Lic_brlHtml_(s.mediana) + "</span>" + (s.pequena ? " " + LicMk_selo_("laranja", "amostra pequena") : "");
  }
  function LicMk_fontesHtml_(fontes) {
    if (!(fontes || []).length) return '<p class="cm-vazio">Sem fonte registrada.</p>';
    return '<ul class="lmk-lista">' + fontes.map(function (f) {
      return "<li>" + (f.valor !== undefined && f.valor !== null ? '<b class="lmk-num">' + Lic_brlHtml_(f.valor) + "</b> · " : "") + Lic_esc_(f.fornecedor || "") + " · " + Lic_esc_(f.orgao || "") + (f.uf ? "/" + Lic_esc_(f.uf) : "") + " · " + Lic_esc_(f.dataTxt || "sem data") +
        '<br><span class="cm-meta">' + Lic_esc_(f.origemNome || "") + (f.fonte ? ": " + Lic_esc_(f.fonte) : "") + (f.descricao ? " · item: " + Lic_esc_(f.descricao) : "") + "</span> " + LicMk_link_(f.link, "abrir no PNCP") + "</li>";
    }).join("") + "</ul>";
  }

  // ================= tela "Inteligência de mercado" =================
  function LicMk_renderTela_() {
    var c = Lic_corpo_(); if (!c) return;
    c.innerHTML = Lic_carregando_(3);
    LicMk_chamar_("tela", { meses: LICMK.meses }, function (r) { LICMK.tela = r; LicMk_desenharTela_(); }, function (m) { c.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(c, LicMk_renderTela_); });
  }
  function LicMk_coletaHtml_(t) {
    var k = t.coleta || {}, s = k.servidor, u = k.ultima, h = '<div class="cm-caixa"><h3>De onde vêm os dados</h3>';
    h += '<p class="cm-txt">Três fontes, cada número diz a sua: os <b>resultados publicados no PNCP</b> (vencedor e preço homologado de cada item, lidos pelo coletor do servidor nas licitações do ramo já encerradas), as <b>disputas da Metrolabs</b> registradas pela Diretoria e os <b>registros manuais</b> (ata lida pela Diretoria, com a fonte). O PNCP publica só o vencedor de cada item: quem participou e perdeu aparece só pelas disputas e pelos registros manuais.</p>';
    if (!k.coletor) h += Lic_faixa_(k.semColetorTxt || "Sem o coletor neste ambiente.", "aviso");
    else if (k.erroServidor) h += Lic_faixa_("Não foi possível ler a situação do coletor de resultados agora (" + k.erroServidor + "). Os dados já sincronizados continuam valendo; tente de novo em alguns minutos.", "aviso");
    else if (s) h += LicMk_dl_([["Contratações na fila", Lic_esc_(s.fila)], ["Lidas no PNCP", Lic_esc_(s.lidas)], ["Completas", Lic_esc_(s.completas)], ["Resultados no servidor", Lic_esc_(s.resultados)], ["Última leitura", Lic_esc_(s.ultimaLeituraEm ? Lic_dataHora_(s.ultimaLeituraEm) : "ainda nenhuma")], ["Com erro", Lic_esc_(s.comErro)]]);
    h += '<p class="cm-meta">' + (u ? "Última sincronia com o SGO+: " + Lic_esc_(u.emTxt) + " (" + Lic_esc_(u.por) + "), " + Lic_esc_(u.novos) + " resultado(s) novo(s)." : "Ainda não houve sincronia com o SGO+.") + "</p>";
    h += '<div class="lic-acoes-linha lmk-acoes"><button type="button" class="btn-secondary" data-lmk-sincronizar><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Sincronizar agora</button></div>';
    if (t.fora && (t.fora.alterados || t.fora.cancelados)) h += '<p class="cm-ajuda-campo">Fora das contas: ' + Lic_esc_(t.fora.cancelados) + " resultado(s) cancelado(s) na fonte ou anulado(s)" + (t.fora.alterados ? " e " + Lic_esc_(t.fora.alterados) + " registro(s) alterado(s) fora do SGO+ (avise o Administrador)" : "") + ".</p>";
    return h + "</div>";
  }
  function LicMk_desenharTela_() {
    var c = Lic_corpo_(), t = LICMK.tela; if (!c || !t) return;
    var k = t.contagens || {};
    var h = LicMk_coletaHtml_(t) + '<div class="cm-caixa">' + LicMk_dl_([["Período", Lic_esc_("últimos " + t.meses + " meses (desde " + t.desdeTxt + ")")], ["Registros", Lic_esc_(k.observacoes)], ["Com preço", Lic_esc_(k.comPreco)], ["Contratações", Lic_esc_(k.contratacoes)], ["Concorrentes", Lic_esc_(k.concorrentes)], ["Órgãos", Lic_esc_(k.orgaos)], ["No cadastro", Lic_esc_(k.cadastrados)]]) +
      '<p class="cm-ajuda-campo">Calculado pelo sistema (regras ' + Lic_esc_(t.regras) + "), sem IA. Grupo de menos de " + Lic_esc_(t.amostraMin) + " preços mostra \"amostra pequena\"; sem preço mostra \"sem dados\".</p></div>";
    h += '<div class="cm-tabs" role="tablist" aria-label="Partes da inteligência de mercado">' + LICMK_ABAS.map(function (a) { return '<button type="button" class="cm-tab' + (a[0] === LICMK.aba ? " active" : "") + '" role="tab" aria-selected="' + (a[0] === LICMK.aba) + '" data-lmk-aba="' + a[0] + '">' + Lic_esc_(a[1]) + "</button>"; }).join("") + "</div>";
    h += '<div class="lmk-filtros"><div><label for="lmkMeses">Período</label><select id="lmkMeses">' + [6, 12, 24, 36, 60].map(function (m) { return '<option value="' + m + '"' + (m === LICMK.meses ? " selected" : "") + ">Últimos " + m + " meses</option>"; }).join("") + "</select></div>" +
      '<div><label for="lmkBusca">Buscar</label><input id="lmkBusca" type="search" maxlength="120" value="' + Lic_esc_(LICMK.busca) + '" placeholder="Nome, CNPJ, órgão ou serviço"></div>' +
      (LICMK.aba === "referencia" ? '<div><label for="lmkServ">Tipo de serviço</label><select id="lmkServ"><option value="">Todos</option>' + (t.servicos || []).map(function (s) { return '<option value="' + Lic_esc_(s.codigo) + '"' + (s.codigo === LICMK.servico ? " selected" : "") + ">" + Lic_esc_(s.nome) + "</option>"; }).join("") + "</select></div>" +
        '<div><label for="lmkEquip">Equipamento</label><select id="lmkEquip"><option value="">Todos</option>' + (t.equipamentos || []).map(function (s) { return '<option value="' + Lic_esc_(s.codigo) + '"' + (s.codigo === LICMK.equipamento ? " selected" : "") + ">" + Lic_esc_(s.nome) + "</option>"; }).join("") + "</select></div>" : "") +
      '<div style="flex:0 0 auto"><button type="button" class="btn-primary" data-lmk-filtrar>Filtrar</button></div></div><div id="lmkConteudo">' + Lic_carregando_(2) + "</div>";
    c.innerHTML = h;
    var sc = c.querySelector("[data-lmk-sincronizar]"); if (sc) sc.onclick = function () { sc.disabled = true; LicMk_chamar_("sincronizar", {}, function (r) { Lic_toast_(r.texto); LicMk_renderTela_(); }, function (m) { sc.disabled = false; Lic_toast_(m, "erro"); }); };
    c.querySelectorAll("[data-lmk-aba]").forEach(function (b) { b.onclick = function () { LICMK.aba = b.getAttribute("data-lmk-aba"); LicMk_desenharTela_(); }; });
    var filtrar = function () { LICMK.meses = Number(LicMk_valor_("lmkMeses")) || 24; LICMK.busca = LicMk_valor_("lmkBusca"); if (Lic_$_("lmkServ")) LICMK.servico = LicMk_valor_("lmkServ"); if (Lic_$_("lmkEquip")) LICMK.equipamento = LicMk_valor_("lmkEquip"); LicMk_carregarAba_(); };
    c.querySelector("[data-lmk-filtrar]").onclick = filtrar;
    var bu = Lic_$_("lmkBusca"); if (bu) bu.onkeydown = function (e) { if (e.key === "Enter") filtrar(); };
    LicMk_carregarAba_();
  }
  function LicMk_alvo_() { return Lic_$_("lmkConteudo"); }
  function LicMk_carregarAba_() {
    var el = LicMk_alvo_(); if (!el) return;
    el.innerHTML = Lic_carregando_(2);
    var f = { meses: LICMK.meses, busca: LICMK.busca }, erro = function (m) { el.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(el, LicMk_carregarAba_); };
    if (LICMK.aba === "orgaos") LicMk_chamar_("orgaos", f, LicMk_desenharOrgaos_, erro);
    else if (LICMK.aba === "referencia") LicMk_chamar_("referencia", Object.assign(f, { servico: LICMK.servico, equipamento: LICMK.equipamento }), LicMk_desenharReferencia_, erro);
    else if (LICMK.aba === "cadastro") LicMk_chamar_("fornecedores", { busca: LICMK.busca }, LicMk_desenharCadastro_, erro);
    else if (LICMK.aba === "registros") LicMk_chamar_("manuais", {}, LicMk_desenharRegistros_, erro);
    else LicMk_chamar_("concorrentes", f, LicMk_desenharConcorrentes_, erro);
  }
  /** Tela vazia: o quê, por quê e o que fazer. */
  function LicMk_vazio_(oque) {
    var t = LICMK.tela || {}, k = t.coleta || {};
    var porque = !k.coletor ? "neste ambiente não há o coletor do servidor (os resultados do PNCP só chegam no SGO+ do servidor próprio)" : k.servidor && !k.servidor.lidas ? "o coletor ainda não leu nenhum resultado no PNCP (ele lê as licitações do ramo 2 dias depois do fim das propostas, até 40 consultas a cada rodada)" : "nada no período e no filtro escolhidos";
    return '<div class="cm-caixa">' + Lic_faixa_(oque + ": " + porque + ".", "aviso") + '<p class="cm-txt">O que fazer: aumente o período ou limpe a busca; toque em "Sincronizar agora" para trazer o que o coletor já leu; na ficha de uma licitação encerrada, aba Mercado, peça "Buscar resultados no PNCP"; ou registre um resultado lido em ata (aba Registros manuais).</p></div>';
  }
  function LicMk_desenharConcorrentes_(r) {
    var el = LicMk_alvo_(); if (!el) return;
    if (!(r.lista || []).length) { el.innerHTML = LicMk_vazio_("Nenhum concorrente encontrado"); return; }
    el.innerHTML = '<div class="cm-caixa"><h3>Concorrentes (' + Lic_esc_(r.total) + ")</h3>" + (r.cortada ? '<p class="cm-meta">Mostrando os 100 primeiros: use a busca.</p>' : "") +
      Lic_tabelaHtml_(["Concorrente", "Participações conhecidas", "Vitórias", "Desconto médio sobre o estimado", "Onde mais ganha", "UFs", ""], r.lista.map(function (x) {
        return ["<b>" + Lic_esc_(x.nome) + "</b>" + (x.cnpj ? '<br><span class="cm-meta lic-mono">' + Lic_esc_(x.cnpjTxt) + "</span>" : " " + LicMk_selo_("laranja", "sem CNPJ")) + (x.porte ? " " + LicMk_selo_("cinza", x.porte) : ""),
          Lic_esc_(x.participacoes), Lic_esc_(x.vitorias + " (" + x.itensGanhos + " item(ns))"), LicMk_desconto_(x.desconto), Lic_esc_((x.orgaos || []).slice(0, 2).map(function (o) { return o.nome + " (" + o.n + ")"; }).join("; ") || "—"),
          Lic_esc_((x.ufs || []).slice(0, 4).map(function (u) { return u.nome + " " + u.n; }).join(", ") || "—"), '<button type="button" class="btn-secondary" data-lmk-conc="' + Lic_esc_(x.chave) + '">Abrir</button>'];
      })) + '<p class="cm-ajuda-campo">Participações conhecidas = licitações em que o concorrente aparece em qualquer fonte. O PNCP publica só o vencedor: participação sem vitória vem das disputas da Metrolabs e dos registros manuais.</p></div>';
    el.querySelectorAll("[data-lmk-conc]").forEach(function (b) { b.onclick = function () { LicMk_abrirConcorrente_(b.getAttribute("data-lmk-conc")); }; });
  }
  function LicMk_voltarHtml_() { return '<div class="lic-acoes-linha" style="margin-bottom:10px"><button type="button" class="btn-secondary" data-lmk-voltar><i class="fas fa-arrow-left" aria-hidden="true"></i>&nbsp;Voltar à lista</button></div>'; }
  function LicMk_ligarVoltar_(el) { var v = el.querySelector("[data-lmk-voltar]"); if (v) v.onclick = LicMk_carregarAba_; }
  function LicMk_abrirConcorrente_(chave) {
    var el = LicMk_alvo_(); if (!el) return;
    el.innerHTML = Lic_carregando_(2);
    LicMk_chamar_("concorrente", { chave: chave, meses: LICMK.meses }, function (r) {
      var x = r.concorrente, h = LicMk_voltarHtml_() + '<div class="cm-caixa"><h3>' + Lic_esc_(x.nome) + "</h3>" + LicMk_dl_([["CNPJ", x.cnpj ? '<span class="lic-mono">' + Lic_esc_(x.cnpjTxt) + "</span>" : "sem CNPJ (nome digitado na disputa)"], ["Participações conhecidas", Lic_esc_(x.participacoes)], ["Vitórias", Lic_esc_(x.vitorias)], ["Itens ganhos", Lic_esc_(x.itensGanhos)],
        ["Valor ganho (total homologado)", LicMk_rs_(x.valorGanho)], ["Desconto médio sobre o estimado", LicMk_desconto_(x.desconto)], ["Primeiro e último registro", Lic_esc_((x.primeira || "—") + " a " + (x.ultima || "—"))], ["De onde vem", Lic_esc_((x.origens || []).map(function (o) { return o.nome + " (" + o.n + ")"; }).join("; "))]]);
      if (!x.cnpj) h += Lic_faixa_("Este nome foi digitado na disputa sem CNPJ: as vitórias e participações dele não se juntam ao cadastro. Em Cadastro de fornecedores › Concorrentes das disputas sem CNPJ, use \"Ligar ao CNPJ\".", "aviso");
      h += "</div>";
      h += '<div class="cm-caixa"><h3>Faixa de preço por tipo de serviço</h3>' + ((x.faixas || []).length ? Lic_tabelaHtml_(["Serviço", "n", "Menor", "Mediana", "Maior"], x.faixas.map(function (f) { return [Lic_esc_(f.nome) + (f.pequena ? " " + LicMk_selo_("laranja", "amostra pequena") : ""), Lic_esc_(f.n), LicMk_rs_(f.min), LicMk_rs_(f.mediana), LicMk_rs_(f.max)]; })) : '<p class="cm-vazio">Sem preço registrado deste concorrente no período (as participações sem vitória não têm preço homologado).</p>') + "</div>";
      h += '<div class="cm-caixa"><h3>Órgãos e UFs</h3>' + Lic_tabelaHtml_(["Órgão", "Vezes"], (x.orgaos || []).map(function (o) { return [Lic_esc_(o.nome), Lic_esc_(o.n)]; })) + '<p class="cm-meta">UFs: ' + Lic_esc_((x.ufs || []).map(function (u) { return u.nome + " (" + u.n + ")"; }).join(", ") || "—") + "</p></div>";
      h += '<div class="cm-caixa"><h3>Registros (' + Lic_esc_((r.registros || []).length) + ")</h3>" + Lic_tabelaHtml_(["Data", "Papel", "Órgão", "Item", "Valor unitário", "Desconto", "Fonte"], (r.registros || []).map(function (g) {
        return [Lic_esc_(g.dataTxt || "—"), Lic_esc_(g.papelNome), Lic_esc_(g.orgao + (g.uf ? "/" + g.uf : "")), Lic_esc_(g.descricao || g.grupoNome), LicMk_rs_(g.valor), LicMk_pct_(g.desconto), Lic_esc_(g.origemNome) + " " + LicMk_link_(g.link, "abrir")];
      })) + "</div>";
      el.innerHTML = h; LicMk_ligarVoltar_(el);
    }, function (m) { el.innerHTML = LicMk_voltarHtml_() + Lic_erroTela_(m); LicMk_ligarVoltar_(el); Lic_ligarRefazer_(el, function () { LicMk_abrirConcorrente_(chave); }); });
  }
  function LicMk_vencedoresHtml_(lista, comPreco) {
    if (!(lista || []).length) return '<p class="cm-vazio">Sem vencedor registrado.</p>';
    var cabs = ["Quem ganhou", "Vitórias", "Itens"].concat(comPreco ? ["Valor total", "Desconto médio"] : []);
    return Lic_tabelaHtml_(cabs, lista.map(function (v) {
      var l = ["<b>" + Lic_esc_(v.nome) + "</b>" + (v.proprio ? " " + LicMk_selo_("verde", "nós") : v.cnpj ? '<br><span class="cm-meta lic-mono">' + Lic_esc_(v.cnpjTxt) + "</span>" : ""), Lic_esc_(v.vitorias), Lic_esc_(v.itens)];
      return comPreco ? l.concat([LicMk_rs_(v.valor), LicMk_desconto_(v.desconto)]) : l;
    }));
  }
  function LicMk_desenharOrgaos_(r) {
    var el = LicMk_alvo_(); if (!el) return;
    if (!(r.lista || []).length) { el.innerHTML = LicMk_vazio_("Nenhum órgão com resultado"); return; }
    el.innerHTML = '<div class="cm-caixa"><h3>Órgãos (' + Lic_esc_(r.total) + ")</h3>" + (r.cortada ? '<p class="cm-meta">Mostrando os 100 primeiros: use a busca.</p>' : "") +
      Lic_tabelaHtml_(["Órgão", "Contratações com resultado", "Quem mais ganha", "Desconto médio", ""], r.lista.map(function (o) {
        return ["<b>" + Lic_esc_(o.nome) + "</b>" + (o.uf ? " · " + Lic_esc_(o.uf) : "") + (o.cnpj ? '<br><span class="cm-meta lic-mono">' + Lic_esc_(o.cnpjTxt) + "</span>" : ""), Lic_esc_(o.contratacoes + " (" + o.itens + " item(ns))"),
          Lic_esc_(o.vencedores.map(function (v) { return v.nome + " (" + v.vitorias + ")"; }).join("; ")) + (o.totalVencedores > 3 ? '<span class="cm-meta"> e mais ' + Lic_esc_(o.totalVencedores - 3) + "</span>" : ""), LicMk_desconto_(o.desconto),
          '<button type="button" class="btn-secondary" data-lmk-org="' + Lic_esc_(o.chave) + '">Abrir</button>'];
      })) + "</div>";
    el.querySelectorAll("[data-lmk-org]").forEach(function (b) { b.onclick = function () { LicMk_abrirOrgao_(b.getAttribute("data-lmk-org")); }; });
  }
  function LicMk_abrirOrgao_(chave) {
    var el = LicMk_alvo_(); if (!el) return;
    el.innerHTML = Lic_carregando_(2);

      LicMk_campoTexto_("lmkRQtd", "Quantidade", "", 'inputmode="decimal"') + '<div class="lmk-campo"><label for="lmkRData">Data do resultado (obrigatória)</label><input id="lmkRData" type="date"></div></div>' +

      '<div class="lmk-campo"><label for="lmkRMot">Motivo (obrigatório)</label><textarea id="lmkRMot" rows="2" maxlength="1000" placeholder="Ex.: o PNCP não publicou os participantes deste pregão"></textarea></div><div id="lmkMsg" aria-live="assertive"></div>',
      '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lic-confirmar>Registrar</button>', origem);
    ov.querySelector("[data-lic-confirmar]").onclick = function () {
      var bt = this, mot = LicMk_valor_("lmkRMot");
      if (mot.trim().length < 10) { LicMk_msg_("lmkMsg", "Escreva o motivo com pelo menos 10 letras. Nada foi gravado."); return; }
      bt.disabled = true;
      LicMk_chamar_("resultadoManual", { papel: LicMk_valor_("lmkRPapel"), oportunidadeId: LicMk_valor_("lmkROp"), orgaoNome: LicMk_valor_("lmkROrg"), uf: LicMk_valor_("lmkRUf"), cnpj: LicMk_valor_("lmkRCnpj"), nome: LicMk_valor_("lmkRNome"),
        item: LicMk_valor_("lmkRItem"), unidade: LicMk_valor_("lmkRUn"), descricao: LicMk_valor_("lmkRDesc"), valor: LicMk_valor_("lmkRValor"), estimado: LicMk_valor_("lmkREst"), quantidade: LicMk_valor_("lmkRQtd"), data: LicMk_valor_("lmkRData"),
        fonte: LicMk_valor_("lmkRFonte"), link: LicMk_valor_("lmkRLink"), motivo: mot }, function (x) { ov.fechar(); Lic_toast_(x.texto); LicMk_carregarAba_(); }, function (m) { bt.disabled = false; LicMk_msg_("lmkMsg", m); });
    };
  }
  function LicMk_janelaAnular_(id, origem) {
    var ov = Lic_janela_("Anular o registro manual", '<p class="cm-txt">O registro sai das contas e continua guardado, com o motivo.</p><div class="lmk-campo"><label for="lmkAMot">Motivo (obrigatório)</label><textarea id="lmkAMot" rows="2" maxlength="1000" placeholder="Ex.: valor digitado errado; registrado de novo"></textarea></div><div id="lmkMsg" aria-live="assertive"></div>',
      '<button type="button" class="btn-secondary" data-lic-cancelar>Voltar</button><button type="button" class="btn-primary" data-lic-confirmar>Anular</button>', origem);
    ov.querySelector("[data-lic-confirmar]").onclick = function () {
      var bt = this, mot = LicMk_valor_("lmkAMot");
      if (mot.trim().length < 10) { LicMk_msg_("lmkMsg", "Escreva o motivo com pelo menos 10 letras. Nada foi alterado."); return; }
      bt.disabled = true;
      LicMk_chamar_("resultadoAnular", { id: id, motivo: mot }, function (x) { ov.fechar(); Lic_toast_(x.texto); LicMk_carregarAba_(); }, function (m) { bt.disabled = false; LicMk_msg_("lmkMsg", m); });
    };
  }

  // ================= aba "Mercado" da ficha e o quadro do pedido de parecer =================
  function LicMk_htmlAba_(d) { return '<div id="licMercado">' + Lic_carregando_(2) + "</div>"; }
  function LicMk_ligarAba_(c, d, id) {
    LicMk_chamar_("ficha", { id: id }, function (r) { LICMK.ficha[id] = r; LicMk_desenharFicha_(id); },
      function (m) { var el = Lic_$_("licMercado"); if (el) { el.innerHTML = Lic_erroTela_(m); Lic_ligarRefazer_(el, function () { LicMk_ligarAba_(c, d, id); }); } });
  }
  function LicMk_precosHtml_(m) {
    if (m.nivelPreco === "NENHUM") return '<div class="cm-caixa"><h3>Preço praticado no mercado</h3><p class="cm-txt">O preço não faz parte do parecer da sua área: os valores ficam com a Diretoria, a área Financeira e a área de Licitações.</p></div>';
    var h = '<div class="cm-caixa"><h3>Preço praticado no mercado</h3>' + (m.temSimulacao ? '<p class="cm-ajuda-campo">Cada item da simulação versão ' + Lic_esc_(m.simVersao) + " comparado com o preço unitário de quem venceu itens do mesmo serviço e equipamento (por unidade), nos últimos " + Lic_esc_(m.meses) + " meses.</p>"
      : Lic_faixa_("Sem simulação de preço salva: aparece o preço de mercado dos tipos de serviço do objeto. Para comparar item a item, salve a simulação na aba Preço.", "aviso"));
    if (!(m.precos || []).length) return h + '<p class="cm-vazio">O objeto não indica um tipo de serviço que o sistema reconheça (calibração, manutenção, qualificação, NR-13, segurança elétrica): não há grupo para comparar.</p></div>';
    h += Lic_tabelaHtml_(["Item", "Grupo de mercado", "n", "1º quartil", "Mediana", "3º quartil", "Período"].concat(m.temSimulacao ? ["Nossa proposta", "Onde fica"] : []), m.precos.map(function (p) {
      var g = p.referencia, s = g ? g.estat : null;
      var l = [Lic_esc_((p.numero ? p.numero + " · " : "") + (p.descricao || p.servicoTabela || "")), Lic_esc_(p.grupoNome) + (s && s.pequena ? " " + LicMk_selo_("laranja", "amostra pequena") : "") + (!g ? " " + LicMk_selo_("cinza", "sem dados") : ""),
        Lic_esc_(s ? s.n : 0), LicMk_rs_(s && s.q1), LicMk_rs_(s && s.mediana), LicMk_rs_(s && s.q3), Lic_esc_(g ? (g.periodo.deTxt || "—") + " a " + (g.periodo.ateTxt || "—") : "—")];
      if (m.temSimulacao) l = l.concat([LicMk_rs_(p.precoProposta), p.proposta ? LicMk_selo_(p.proposta.posicao === "DENTRO" ? "verde" : "laranja", p.proposta.posicao === "ABAIXO" ? "abaixo do mercado" : p.proposta.posicao === "ACIMA" ? "acima do mercado" : "dentro da faixa") + '<br><span class="cm-meta">' + Lic_esc_(p.proposta.texto) + "</span>" : Lic_esc_(p.aviso || "—")]);
      return l;
    }));
    var comFonte = m.precos.filter(function (p) { return p.referencia && (p.referencia.fontes || []).length; });
    if (comFonte.length) h += comFonte.map(function (p) { return '<details class="lmk-det"><summary>Fontes de "' + Lic_esc_(p.grupoNome) + '"</summary>' + LicMk_fontesHtml_(p.referencia.fontes) + "</details>"; }).join("");
    return h + '<p class="cm-ajuda-campo">A comparação é informação para a Diretoria decidir: o sistema não muda preço nenhum. Amostra pequena (menos de ' + Lic_esc_(m.amostraMin) + " preços) é indício, não referência.</p></div>";
  }
  /** O mercado de uma oportunidade (ficha e parecer). m.nivelPreco NENHUM = sem valor nenhum. */
  function LicMk_htmlMercado_(m) {
    if (!m) return "";
    if (m.erro) return '<div class="cm-caixa"><h3>Mercado</h3>' + Lic_faixa_(m.erro, "aviso") + "</div>";
    var comPreco = m.nivelPreco !== "NENHUM", h = "", tp = m.tipos || {}, temTipo = (tp.servicos || []).length > 0;
    h += '<div class="cm-caixa"><h3>Quem costuma ganhar neste órgão</h3>' + (m.orgao ? '<p class="cm-meta">' + Lic_esc_(m.orgao.nome + ": " + m.orgao.contratacoes + " contratação(ões) com resultado nos últimos " + m.meses + " meses (a última em " + (m.orgao.ultimaTxt || "—") + ")") + (comPreco && m.orgao.desconto && m.orgao.desconto.n ? " · desconto médio sobre o estimado " + LicMk_desconto_(m.orgao.desconto) : "") + "</p>" + LicMk_vencedoresHtml_(m.orgao.vencedores, comPreco)
      : '<p class="cm-vazio">Nenhum resultado deste órgão nos últimos ' + Lic_esc_(m.meses) + " meses (nem no PNCP lido pelo coletor, nem nas disputas da Metrolabs, nem nos registros manuais).</p>") + "</div>";
    h += '<div class="cm-caixa"><h3>Quem costuma ganhar neste tipo de objeto</h3>' + (temTipo ? '<p class="cm-meta">Reconhecido no objeto e nos itens: ' + Lic_esc_(tp.servicos.join(", ")) + ((tp.equipamentos || []).length ? " · equipamentos: " + Lic_esc_(tp.equipamentos.join(", ")) : "") + "</p>" : "") +
      (m.tipo ? '<p class="cm-meta">' + Lic_esc_(m.tipo.contratacoes + " contratação(ões), " + m.tipo.itens + " item(ns) com resultado; " + m.tipo.mesmaUf + " na UF " + (m.tipo.uf || "—")) + "</p>" + LicMk_vencedoresHtml_(m.tipo.vencedores, comPreco)
        : '<p class="cm-vazio">' + (temTipo ? "Nenhum resultado deste tipo de objeto nos últimos " + Lic_esc_(m.meses) + " meses." : "O objeto não indica um tipo de serviço que o sistema reconheça (calibração, manutenção, qualificação, NR-13, segurança elétrica).") + "</p>") + "</div>";
    if ((m.estaLicitacao || []).length) h += '<div class="cm-caixa"><h3>Resultado desta licitação</h3>' + Lic_tabelaHtml_(["Item", "Quem ganhou"].concat(comPreco ? ["Valor unitário"] : []).concat(["Data", "Fonte"]), m.estaLicitacao.map(function (x) {
      return [Lic_esc_(x.item + (x.descricao ? " · " + x.descricao : "")), Lic_esc_(x.fornecedor)].concat(comPreco ? [LicMk_rs_(x.valor)] : []).concat([Lic_esc_(x.dataTxt || "—"), Lic_esc_(x.origemNome) + " " + LicMk_link_(x.link, "abrir")]);
    })) + "</div>";
    return h + LicMk_precosHtml_(m);
  }
  function LicMk_desenharFicha_(id) {
    var el = Lic_$_("licMercado"), m = LICMK.ficha[id]; if (!el || !m) return;
    var k = m.coleta || {}, s = k.situacao, h = "";
    h += '<div class="cm-caixa"><h3>Resultados desta licitação no PNCP</h3>';
    if (!k.coletor) h += Lic_faixa_("Neste ambiente não há o coletor do servidor: os resultados do PNCP só chegam no SGO+ do servidor próprio. As disputas e os registros manuais continuam valendo.", "aviso");
    else if (!k.podePedir) h += '<p class="cm-txt">Esta licitação não veio do PNCP: não há resultado publicado lá para ler. Registre o resultado lido na ata em Inteligência de mercado › Registros manuais.</p>';
    else {
      h += s && s.naFila ? LicMk_dl_([["Situação", Lic_esc_(s.completo ? "lida por inteiro (" + (s.fimMotivo || "") + ")" : s.emAndamento ? "leitura em andamento" : "na fila")], ["Última leitura", Lic_esc_(s.verificadoEm ? Lic_dataHora_(s.verificadoEm) : "ainda não lida")], ["Próxima conferência", Lic_esc_(s.completo ? "—" : Lic_dataHora_(s.proximoEm))],
        ["Itens com resultado", Lic_esc_(s.itensComResultado + " de " + s.itensTotal)], ["Pedido por", Lic_esc_(s.pedidoPor || "rotina do coletor")]]) + (s.ultimoErro ? Lic_faixa_("Última tentativa falhou: " + s.ultimoErro + ". O coletor tenta de novo no dia seguinte.", "aviso") : "")
        : '<p class="cm-txt">' + (m.op.encerrou ? "O coletor ainda não leu esta licitação (ele lê as do ramo 2 dias depois do fim das propostas)." : "As propostas ainda não encerraram (" + Lic_esc_(m.op.encerramentoTxt) + "): o resultado só sai depois da sessão.") + "</p>";
      h += '<div class="lic-acoes-linha lmk-acoes"><button type="button" class="btn-secondary" data-lmk-pedir>Buscar resultados no PNCP agora</button></div><p class="cm-ajuda-campo">Passa esta licitação na frente da fila do coletor (sai na próxima rodada, em até 2 horas). Só lê o que o órgão publicou; nada é criado em outro módulo.</p>';
    }
    h += "</div>" + LicMk_htmlMercado_(m);
    el.innerHTML = h;
    var pd = el.querySelector("[data-lmk-pedir]"); if (pd) pd.onclick = function () { pd.disabled = true; LicMk_chamar_("pedirResultados", { id: id }, function (r) { Lic_toast_(r.texto); LicMk_ligarAba_(null, null, id); }, function (mm) { pd.disabled = false; Lic_toast_(mm, "erro"); }); };
  }
  /** Quadro da tela do pedido de parecer (JS_Licitacoes_Pareceres.html): o mercado com o preço conforme a área. */
  function LicMk_htmlParecer_(m) { if (!m) return ""; return '<div class="cm-caixa"><h3>Mercado (concorrentes e preços praticados)</h3><p class="cm-ajuda-campo">Calculado pelo sistema a partir dos resultados publicados no PNCP, das disputas da Metrolabs e dos registros da Diretoria. Informação para o parecer; não decide nada.</p></div>' + LicMk_htmlMercado_(m); }
</script>

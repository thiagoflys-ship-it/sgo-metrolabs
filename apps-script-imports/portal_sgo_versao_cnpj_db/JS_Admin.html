<script>
  // ==========================================
  // MÓDULO: ADMINISTRAÇÃO E CONFIGURAÇÕES
  // ==========================================
  function renderAdminModulo_() {
    const div = document.getElementById("conteudo");
    if (!div) return;

    div.innerHTML = `
      <div class="module-shell">
        <div class="module-header">
          <div class="module-header-left">
            <h2 class="content-title">Painel Admin</h2>
            <p class="content-subtitle">Configurações operacionais e Gestão de Usuários.</p>
          </div>
        </div>

        <div class="dashboard-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 10px;">

          <div class="card-kpi">
            <div class="card-kpi-title">Tempo de ociosidade (Segundos)</div>
            <div style="display:flex; gap:5px; align-items:center; margin-top:8px;">
              <input type="number" id="inputIdleLimit" value="${IDLE_LIMIT}" style="width:75px; padding:4px; font-size:14px; text-align:center;" min="30">
              <button class="btn-primary" type="button" style="padding:5px 10px; font-size:12px;" onclick="salvarTempoOciosidadePainel_()">Salvar</button>
            </div>
          </div>

          <div class="card-kpi">
            <div class="card-kpi-title">Som de ociosidade</div>
            <div class="card-kpi-value" id="adminSomStatus">${SOM_OCIOSIDADE_ATIVO ? "ON" : "OFF"}</div>
          </div>

          <div class="card-kpi">
            <div class="card-kpi-title">Controle de som</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
              <button class="btn-primary" type="button" style="padding:6px 10px; font-size:12px;" onclick="ativarSomOciosidadePainel_()">Ativar</button>
              <button class="btn-secondary" type="button" style="padding:6px 10px; font-size:12px;" onclick="desativarSomOciosidadePainel_()">Desativar</button>
              <button class="btn-info" type="button" style="padding:6px 10px; font-size:12px;" onclick="testarSomOciosidade_()">Testar</button>
            </div>
          </div>

          <div class="card-kpi">
            <div class="card-kpi-title">Mensagem motivacional atual</div>
            <div id="adminMensagemAtual" style="font-weight:700; color:var(--metro-blue); font-size:12px; line-height:1.4; margin-bottom:8px;"></div>
            <button class="btn-secondary" type="button" style="padding:6px 10px; font-size:12px;" onclick="sortearNovaMensagemMotivacional_()">Trocar mensagem</button>
          </div>
        </div>

        <div id="adminAlertasPadroesCard" class="form-card" style="margin-bottom:20px; display:none;">
          <div class="module-header" style="margin-bottom:12px;">
            <div class="module-header-left">
              <h3 class="section-card-title" style="margin:0;">Alertas globais de calibração</h3>
              <p class="content-subtitle">Configuração exclusiva do perfil ADMIN para os lembretes de padrões.</p>
            </div>
            <span id="ap_status" class="badge badge-ativo">ATIVO</span>
          </div>
          <div class="form-grid">
            <div><label for="ap_ativo">Funcionamento</label><select id="ap_ativo"><option value="true">Ativo</option><option value="false">Desativado</option></select></div>
            <div><label>Perfis que recebem</label><div style="display:flex;gap:16px;padding:9px 0;"><label><input id="ap_gestor" type="checkbox"> GESTOR</label><label><input id="ap_metrologia" type="checkbox"> METROLOGIA</label></div></div>
            <div><label for="ap_inicio">Horário inicial</label><input id="ap_inicio" type="time"></div>
            <div><label for="ap_fim">Horário final</label><input id="ap_fim" type="time"></div>
            <div><label for="ap_intervalo_balao">Intervalo do balão (minutos)</label><input id="ap_intervalo_balao" type="number" min="15" max="720"></div>
            <div><label for="ap_duracao">Tempo visível (segundos)</label><input id="ap_duracao" type="number" min="5" max="120"></div>
            <div><label for="ap_critico">Aviso vermelho central</label><select id="ap_critico"><option value="true">Ativo</option><option value="false">Desativado</option></select></div>
            <div><label for="ap_intervalo_critico">Intervalo do aviso central (minutos)</label><input id="ap_intervalo_critico" type="number" min="30" max="1440"></div>
            <div><label for="ap_antecedencia">Alertar antes do vencimento (dias)</label><input id="ap_antecedencia" type="number" min="1" max="365"></div>
            <div class="full"><label for="ap_mensagem">Mensagem do alerta crítico</label><input id="ap_mensagem" maxlength="240"></div>
          </div>
          <div class="form-actions">
            <button id="ap_btn_salvar" class="btn-primary" type="button" onclick="adminSalvarAlertasPadroes_()">Salvar configurações</button>
            <button id="ap_btn_testar" class="btn-secondary" type="button" onclick="adminTestarAlertasPadroes_()">Testar alerta agora</button>
          </div>
          <div id="ap_feedback" class="helper-text">Carregando configurações...</div>
        </div>

        <div style="margin-bottom:20px;">
          <button class="btn-danger" type="button" style="padding:6px 12px; font-size:12px;" onclick="limparCacheNavegador_()">Limpar Sessão Travada (Logout Forçado)</button>
        </div>

        <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

        <div class="module-header">
          <div class="module-header-left">
            <h3 style="margin:0; font-size:18px; color:var(--text);">Gestão de Usuários</h3>
          </div>
          <div class="module-header-right" style="display: flex; gap: 15px; align-items: center;">
            <div style="display: flex; gap: 5px;">
              <input id="usuariosPesquisa" class="toolbar-search" type="text" placeholder="Nome ou Login..." onkeydown="if(event.key === 'Enter') usuariosPesquisar_()">
              <button class="btn-secondary" type="button" onclick="usuariosPesquisar_()">Pesquisar</button>
            </div>
            <button class="btn-primary" type="button" onclick="usuariosNovo_()">+ Novo usuário</button>
          </div>
        </div>

        <div class="module-grid">
          <div class="form-card">
            <h3 class="section-card-title" id="usuariosFormTitulo">Novo usuário</h3>
            <div class="form-grid">
              <div class="full">
                <label for="usr_usuario">Login (Nome de usuário)</label>
                <input id="usr_usuario" type="text" placeholder="Ex: joao.silva">
              </div>
              <div class="full">
                <label for="usr_nome">Nome Completo</label>
                <input id="usr_nome" type="text" placeholder="Nome completo do colaborador">
              </div>
              <div class="full">
                <label for="usr_email">E-mail</label>
                <input id="usr_email" type="email" placeholder="nome@metrolabs.com.br">
              </div>
              <div class="full">
                <label for="usr_senha">Senha</label>
                <input id="usr_senha" type="password" placeholder="Digite a senha (ou deixe vazio p/ manter a atual)">
              </div>
              <div>
                <label for="usr_perfil">Perfil de Acesso</label>
                <select id="usr_perfil" onchange="aoMudarPerfilUsuario_()"></select>
              </div>
              <div id="usr_cliente_container" style="display:none;">
                <label for="usr_cliente_id">Vincular Cliente</label>
                <select id="usr_cliente_id"><option value="">Selecione...</option></select>
              </div>
              <div>
                <label for="usr_status">Status</label>
                <input id="usr_status" type="text" value="ATIVO" disabled>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="button" onclick="usuariosSalvar_()">Salvar</button>
              <button class="btn-secondary" type="button" onclick="usuariosNovo_()">Limpar</button>
            </div>
            <div class="helper-text" id="usuariosHelper">Preencha os dados e atribua o perfil correto.</div>
          </div>

          <div class="list-card">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Login</th>
                    <th>Nome Completo</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="usuariosTabelaBody">
                  <tr><td colspan="6" class="empty-state">Utilize a barra de pesquisa para buscar usuários.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;

    usuariosLimparFormulario_();
    preencherComboPerfis_();
    carregarClientesParaUsuarios_();
    preencherEstadoPainelAdmin_();
    adminCarregarAlertasPadroes_();
  }

  function limparCacheNavegador_() {
    if (!confirm("Isso forçará a limpeza da sessão no navegador e recarregará a página. Continuar?")) return;

    try {
      if (typeof STORAGE_KEYS !== "undefined" && STORAGE_KEYS.SESSION) {
        sessionStorage.removeItem(STORAGE_KEYS.SESSION);
        sessionStorage.removeItem(STORAGE_KEYS.SESSION_ID);
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        localStorage.removeItem(STORAGE_KEYS.SESSION_ID);
      } else {
        sessionStorage.removeItem("SGO_SESSION");
        sessionStorage.removeItem("SGO_SESSION_ID");
        localStorage.removeItem("SGO_SESSION");
        localStorage.removeItem("SGO_SESSION_ID");
      }
    } catch (e) {
      console.error("Falha ao limpar sessão:", e);
    }

    SESSION = null;
    USER_CONTEXT = null;
    location.reload();
  }

  function preencherEstadoPainelAdmin_() {
    const elSom = document.getElementById("adminSomStatus");
    const elMsg = document.getElementById("adminMensagemAtual");
    const elIdle = document.getElementById("inputIdleLimit");

    if (elSom) elSom.innerText = SOM_OCIOSIDADE_ATIVO ? "ON" : "OFF";
    if (elIdle) elIdle.value = IDLE_LIMIT;

    if (elMsg) {
      const elMsgGlobal = document.getElementById("mensagemMotivacional");
      elMsg.innerText = elMsgGlobal ? (elMsgGlobal.innerText || "") : "";
    }
  }

  // ==========================================
  // MÓDULO: USUÁRIOS
  // ==========================================
  function preencherComboPerfis_() {
    const select = document.getElementById("usr_perfil");
    if (!select) return;

    const profiles =
      PUBLIC_CONFIG && Array.isArray(PUBLIC_CONFIG.profiles) && PUBLIC_CONFIG.profiles.length > 0
        ? PUBLIC_CONFIG.profiles
        : ["ADMIN", "GESTOR", "TECNICO", "METROLOGIA", "COMERCIAL", "FINANCEIRO", "CLIENTE"];

    const options = ['<option value="">Selecione o perfil</option>'];
    profiles.forEach(function (p) {
      options.push('<option value="' + escapeHtml_(p) + '">' + escapeHtml_(p) + "</option>");
    });
    select.innerHTML = options.join("");
  }

  function carregarClientesParaUsuarios_() {
    if (!SESSION) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return;

        const select = document.getElementById("usr_cliente_id");
        if (!select) return;

        const options = ['<option value="">Selecione o cliente</option>'];
        (res.items || []).forEach(function (item) {
          const nome = item.NOME || item.NOME_FANTASIA || item.RAZAO_SOCIAL || "";
          options.push('<option value="' + escapeHtml_(item.ID) + '">' + escapeHtml_(nome) + "</option>");
        });
        select.innerHTML = options.join("");
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao carregar clientes para usuários:", err);
      })
      .usuariosListarClientesAtivos(SESSION);
  }

  function aoMudarPerfilUsuario_() {
    const perfil = getValue_("usr_perfil");
    const container = document.getElementById("usr_cliente_container");
    if (!container) return;

    if (perfil === "CLIENTE") {
      container.style.display = "block";
    } else {
      container.style.display = "none";
      setSelectValueSafe_("usr_cliente_id", "");
    }
  }

  function usuariosPesquisar_() {
    const el = document.getElementById("usuariosPesquisa");
    USUARIOS_STATE.filtro = el ? String(el.value || "").trim() : "";
    if (!SESSION) return;

    const tbody = document.getElementById("usuariosTabelaBody");
    if (!tbody) return;

    if (!USUARIOS_STATE.filtro) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Utilize a barra de pesquisa para buscar usuários.</td></tr>';
      return;
    }

    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Buscando na base...</td></tr>';

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Falha ao buscar usuários.</td></tr>';
          return;
        }
        renderTabelaUsuarios_(Array.isArray(res.items) ? res.items : []);
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao pesquisar usuários:", err);
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Erro de comunicação ao buscar usuários.</td></tr>';
      })
      .usuariosPesquisar(SESSION, USUARIOS_STATE.filtro);
  }

  function renderTabelaUsuarios_(itemsOverride) {
    const tbody = document.getElementById("usuariosTabelaBody");
    if (!tbody) return;

    const items = Array.isArray(itemsOverride) ? itemsOverride : USUARIOS_STATE.items;

    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum usuário encontrado para esta busca.</td></tr>';
      return;
    }

    tbody.innerHTML = items.map(function (item) {
      const id = escapeHtml_(item.ID);
      const status = String(item.STATUS || "").toUpperCase();

      return `
        <tr>
          <td style="font-weight:700;">${escapeHtml_(item.USUARIO)}</td>
          <td>${escapeHtml_(item.NOME)}</td>
          <td>${escapeHtml_(item.EMAIL)}</td>
          <td>${escapeHtml_(item.PERFIL)}</td>
          <td>${obterBadgeStatusHtml_(status)}</td>
          <td>
            <div class="table-actions">
              <button class="btn-info" type="button" onclick="usuariosEditar_('${id}')">Editar</button>
              ${
                status === "ATIVO"
                  ? `<button class="btn-warning" type="button" onclick="usuariosInativar_('${id}')">Inativar</button>`
                  : `<button class="btn-success" type="button" onclick="usuariosReativar_('${id}')">Reativar</button>`
              }
              <button class="btn-danger" type="button" onclick="usuariosExcluir_('${id}')">Excluir</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  function usuariosNovo_() {
    USUARIOS_STATE.editingId = "";
    usuariosLimparFormulario_();

    const titulo = document.getElementById("usuariosFormTitulo");
    const helper = document.getElementById("usuariosHelper");

    if (titulo) titulo.innerText = "Novo usuário";
    if (helper) helper.innerText = "Preencha os dados e atribua o perfil correto.";
  }

  function usuariosLimparFormulario_() {
    setValue_("usr_usuario", "");
    setValue_("usr_nome", "");
    setValue_("usr_email", "");
    setValue_("usr_senha", "");
    setSelectValueSafe_("usr_perfil", "");
    setSelectValueSafe_("usr_cliente_id", "");
    setValue_("usr_status", "ATIVO");
    aoMudarPerfilUsuario_();
  }

  function usuariosLerFormulario_() {
    return {
      USUARIO: getValue_("usr_usuario"),
      NOME: getValue_("usr_nome"),
      EMAIL: getValue_("usr_email"),
      SENHA: getValue_("usr_senha"),
      PERFIL: getValue_("usr_perfil"),
      CLIENTE_ID: getValue_("usr_cliente_id")
    };
  }

  function usuariosSalvar_() {
    if (!SESSION) return;

    const payload = usuariosLerFormulario_();

    if (!payload.USUARIO) return alert("O Login é obrigatório.");
    if (!payload.NOME) return alert("O Nome Completo é obrigatório.");
    if (!payload.EMAIL || payload.EMAIL.indexOf("@") === -1) return alert("Informe um e-mail válido — é a identidade do usuário no Portal.");
    if (!payload.PERFIL) return alert("Selecione o perfil de acesso.");
    if (payload.PERFIL === "CLIENTE" && !payload.CLIENTE_ID) return alert("Para perfil CLIENTE, é obrigatório vincular a empresa.");

    if (USUARIOS_STATE.editingId) {
      SGO_iniciarCarregamento_();
      google.script.run
        .withSuccessHandler(function (res) {
          SGO_finalizarCarregamento_();
          if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao atualizar.");
          alert(res.message || "Atualizado com sucesso.");
          usuariosNovo_();
          if (USUARIOS_STATE.filtro) usuariosPesquisar_();
        })
        .withFailureHandler(function (err) {
          SGO_finalizarCarregamento_();
          console.error("Falha ao atualizar usuário:", err);
          alert("Erro de comunicação ao atualizar usuário.");
        })
        .usuariosAtualizar(SESSION, USUARIOS_STATE.editingId, payload);
      return;
    }

    if (!payload.SENHA) return alert("A senha é obrigatória para um NOVO usuário.");

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao criar.");
        alert(res.message || "Criado com sucesso.");
        usuariosNovo_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao criar usuário:", err);
        alert("Erro de comunicação ao criar usuário.");
      })
      .usuariosCriar(SESSION, payload);
  }

  function usuariosEditar_(id) {
    if (!SESSION) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success || !res.item) return alert((res && res.message) ? res.message : "Erro ao buscar usuário.");

        const item = res.item;
        USUARIOS_STATE.editingId = String(item.ID || "");

        setValue_("usr_usuario", item.USUARIO || "");
        setValue_("usr_nome", item.NOME || "");
        setValue_("usr_email", item.EMAIL || "");
        setValue_("usr_senha", "");
        setSelectValueSafe_("usr_perfil", item.PERFIL || "");
        setSelectValueSafe_("usr_cliente_id", item.CLIENTE_ID || "");
        setValue_("usr_status", item.STATUS || "ATIVO");

        aoMudarPerfilUsuario_();

        const titulo = document.getElementById("usuariosFormTitulo");
        const helper = document.getElementById("usuariosHelper");

        if (titulo) titulo.innerText = "Editar usuário";
        if (helper) helper.innerText = "Deixe a senha em branco caso não queira alterá-la.";

        focusIfExists_("usr_usuario");
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao buscar usuário:", err);
        alert("Erro de comunicação ao buscar usuário.");
      })
      .usuariosObter(SESSION, id);
  }

  function usuariosInativar_(id) {
    if (!SESSION || !confirm("Bloquear o acesso deste usuário?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao inativar.");
        if (USUARIOS_STATE.filtro) usuariosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao inativar usuário:", err);
        alert("Erro de comunicação ao inativar usuário.");
      })
      .usuariosInativar(SESSION, id);
  }

  function usuariosReativar_(id) {
    if (!SESSION || !confirm("Liberar o acesso deste usuário?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao reativar.");
        if (USUARIOS_STATE.filtro) usuariosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao reativar usuário:", err);
        alert("Erro de comunicação ao reativar usuário.");
      })
      .usuariosReativar(SESSION, id);
  }

  function usuariosExcluir_(id) {
    if (!SESSION || !confirm("Excluir definitivamente este usuário do banco de dados?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao excluir.");
        if (USUARIOS_STATE.editingId === id) usuariosNovo_();
        if (USUARIOS_STATE.filtro) usuariosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao excluir usuário:", err);
        alert("Erro de comunicação ao excluir usuário.");
      })
      .usuariosExcluir(SESSION, id);
  }

  // ==========================================
  // LÓGICA DE SUPORTE: DOCUMENTOS
  // (A renderização está no Index.html)
  // ==========================================
  function documentosPesquisar_() {
    const el = document.getElementById("documentosPesquisa");
    DOCUMENTOS_STATE.filtro = el ? String(el.value || "").trim() : "";
    if (!SESSION) return;

    const tbody = document.getElementById("documentosTabelaBody");
    if (!tbody) return;

    if (!DOCUMENTOS_STATE.filtro) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Utilize a barra de pesquisa para buscar documentos.</td></tr>';
      return;
    }

    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Buscando na base...</td></tr>';

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) {
          tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Falha ao buscar documentos.</td></tr>';
          return;
        }
        renderTabelaDocumentos_(Array.isArray(res.items) ? res.items : []);
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao pesquisar documentos:", err);
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Erro de comunicação ao buscar documentos.</td></tr>';
      })
      .documentosPesquisar(SESSION, DOCUMENTOS_STATE.filtro);
  }

  function renderTabelaDocumentos_(itemsOverride) {
    const tbody = document.getElementById("documentosTabelaBody");
    if (!tbody) return;

    const items = Array.isArray(itemsOverride) ? itemsOverride : DOCUMENTOS_STATE.items;
    const isCliente = USER_CONTEXT && USER_CONTEXT.perfil === "CLIENTE";
    const styleAcoes = isCliente ? "display:none;" : "";

    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Nenhum documento encontrado para a busca.</td></tr>';
      return;
    }

    tbody.innerHTML = items.map(function (item) {
      const id = escapeHtml_(item.ID);
      const status = String(item.STATUS || "").toUpperCase();

      const linkHtml = item.LINK_ARQUIVO
        ? `<a href="${escapeHtml_(item.LINK_ARQUIVO)}" target="_blank" style="color:var(--metro-blue);font-weight:700;text-decoration:none;">Acessar</a>`
        : "--";

      const vencimentoHtml = typeof formatarDataFront_ === "function"
        ? formatarDataFront_(item.DATA_VENCIMENTO)
        : item.DATA_VENCIMENTO;

      const acoesHtml = isCliente ? "" : `
        <td style="${styleAcoes}">
          <div class="table-actions">
            <button class="btn-info" type="button" onclick="documentosEditar_('${id}')">Editar</button>
            ${
              status === "ATIVO" || status === "PENDENTE"
                ? `<button class="btn-warning" type="button" onclick="documentosInativar_('${id}')">Inativar</button>`
                : `<button class="btn-success" type="button" onclick="documentosReativar_('${id}')">Reativar</button>`
            }
            <button class="btn-danger" type="button" onclick="documentosExcluir_('${id}')">Excluir</button>
          </div>
        </td>
      `;

      return `
        <tr>
          <td>${escapeHtml_(item.CLIENTE_NOME)}</td>
          <td>${escapeHtml_(item.UNIDADE_NOME)}</td>
          <td>${escapeHtml_(item.EQUIPAMENTO_NOME || "Geral da Unidade")}</td>
          <td>${escapeHtml_(item.TIPO_DOCUMENTO)}</td>
          <td>${escapeHtml_(item.NOME_ARQUIVO)}</td>
          <td><strong>${vencimentoHtml}</strong></td>
          <td>${linkHtml}</td>
          <td>${obterBadgeStatusHtml_(status)}</td>
          ${acoesHtml}
        </tr>
      `;
    }).join("");
  }

  function documentosLimparFormulario_() {
    SGO_limparBuscaClienteLike_("doc_cliente_id");
    setSelectValueSafe_("doc_unidade_id", "");
    setSelectValueSafe_("doc_equipamento_id", "");
    setValue_("doc_tipo_documento", "");
    setValue_("doc_nome_arquivo", "");
    setValue_("doc_arquivo", "");
    setValue_("doc_arquivo_base64", "");
    setValue_("doc_arquivo_mime", "");
    setValue_("doc_arquivo_nome", "");
    setValue_("doc_data_vencimento", "");
    setValue_("doc_status", "ATIVO");

    const elInput = document.getElementById("doc_arquivo");
    if (elInput) elInput.value = "";

    const preview = document.getElementById("doc_arquivo_preview");
    if (preview) preview.innerText = "";

    const selectUnidade = document.getElementById("doc_unidade_id");
    if (selectUnidade) selectUnidade.innerHTML = '<option value="">Selecione um cliente primeiro</option>';

    const selectEquip = document.getElementById("doc_equipamento_id");
    if (selectEquip) selectEquip.innerHTML = '<option value="">Selecione uma unidade primeiro</option>';
  }

  function documentosNovo_() {
    DOCUMENTOS_STATE.editingId = "";
    documentosLimparFormulario_();

    const titulo = document.getElementById("documentosFormTitulo");
    if (titulo) titulo.innerText = "Novo documento";
  }

  function processarArquivoDocumento_() {
    const el = document.getElementById("doc_arquivo");
    const file = el && el.files ? el.files[0] : null;
    const preview = document.getElementById("doc_arquivo_preview");

    if (!file) {
      setValue_("doc_arquivo_base64", "");
      setValue_("doc_arquivo_mime", "");
      setValue_("doc_arquivo_nome", "");
      if (preview) preview.innerText = "";
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("O arquivo selecionado é muito grande. O limite máximo é de 5MB.");
      if (el) el.value = "";
      return;
    }

    if (preview) preview.innerText = "Lendo arquivo: " + file.name + "...";

    const reader = new FileReader();
    reader.onload = function (e) {
      setValue_("doc_arquivo_base64", e.target.result);
      setValue_("doc_arquivo_mime", file.type);
      setValue_("doc_arquivo_nome", file.name);
      if (preview) preview.innerText = "Arquivo pronto para envio: " + file.name;
    };
    reader.onerror = function () {
      alert("Erro ao tentar ler o arquivo.");
      if (el) el.value = "";
      if (preview) preview.innerText = "";
    };
    reader.readAsDataURL(file);
  }

  function carregarClientesParaDocumentos_() {
    if (!SESSION) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return;
        DOCUMENTOS_STATE.clientes = Array.isArray(res.items) ? res.items : [];
        preencherComboClientesDocumentos_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao carregar clientes para documentos:", err);
      })
      .equipamentosListarClientesAtivos(SESSION);
  }

  function preencherComboClientesDocumentos_() {
    SGO_montarBuscaClienteLike_("doc_cliente_id", DOCUMENTOS_STATE.clientes || [], aoMudarClienteDocumentos_);
  }

  function aoMudarClienteDocumentos_() {
    const clienteId = getValue_("doc_cliente_id");
    if (!clienteId) {
      DOCUMENTOS_STATE.unidades = [];
      DOCUMENTOS_STATE.equipamentos = [];
      preencherComboUnidadesDocumentos_();
      preencherComboEquipamentosDocumentos_();
      return;
    }
    carregarUnidadesParaDocumentos_(clienteId);
  }

  function carregarUnidadesParaDocumentos_(clienteId, unidadeSelecionadaId, equipamentoSelecionadoId) {
    if (!SESSION || !clienteId) return;

    const selectUnidade = document.getElementById("doc_unidade_id");
    if (selectUnidade) selectUnidade.innerHTML = '<option value="">Carregando unidades...</option>';

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return;
        DOCUMENTOS_STATE.unidades = Array.isArray(res.items) ? res.items : [];
        preencherComboUnidadesDocumentos_();

        if (unidadeSelecionadaId) {
          setSelectValueSafe_("doc_unidade_id", unidadeSelecionadaId);
          carregarEquipamentosParaDocumentos_(unidadeSelecionadaId, equipamentoSelecionadoId);
        } else {
          DOCUMENTOS_STATE.equipamentos = [];
          preencherComboEquipamentosDocumentos_();
        }
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao carregar unidades para documentos:", err);
      })
      .equipamentosListarUnidadesAtivasPorCliente(SESSION, clienteId);
  }

  function preencherComboUnidadesDocumentos_() {
    const select = document.getElementById("doc_unidade_id");
    if (!select) return;

    if (!DOCUMENTOS_STATE.unidades || DOCUMENTOS_STATE.unidades.length === 0) {
      select.innerHTML = '<option value="">Nenhuma unidade ativa encontrada</option>';
      return;
    }

    const options = ['<option value="">Selecione a unidade</option>'];
    (DOCUMENTOS_STATE.unidades || []).forEach(function (item) {
      options.push('<option value="' + escapeHtml_(item.ID) + '">' + escapeHtml_(item.NOME_UNIDADE) + "</option>");
    });
    select.innerHTML = options.join("");
  }

  function aoMudarUnidadeDocumentos_() {
    const unidadeId = getValue_("doc_unidade_id");
    if (!unidadeId) {
      DOCUMENTOS_STATE.equipamentos = [];
      preencherComboEquipamentosDocumentos_();
      return;
    }
    carregarEquipamentosParaDocumentos_(unidadeId);
  }

  function carregarEquipamentosParaDocumentos_(unidadeId, equipamentoSelecionadoId) {
    if (!SESSION || !unidadeId) return;

    const selectEquip = document.getElementById("doc_equipamento_id");
    if (selectEquip) selectEquip.innerHTML = '<option value="">Carregando equipamentos...</option>';

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return;
        DOCUMENTOS_STATE.equipamentos = Array.isArray(res.items) ? res.items : [];
        preencherComboEquipamentosDocumentos_();
        if (equipamentoSelecionadoId) setSelectValueSafe_("doc_equipamento_id", equipamentoSelecionadoId);
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao carregar equipamentos para documentos:", err);
      })
      .documentosListarEquipamentosAtivosPorUnidade(SESSION, unidadeId);
  }

  function preencherComboEquipamentosDocumentos_() {
    const select = document.getElementById("doc_equipamento_id");
    if (!select) return;

    if (!DOCUMENTOS_STATE.equipamentos || DOCUMENTOS_STATE.equipamentos.length === 0) {
      select.innerHTML = '<option value="">Nenhum equipamento ativo (opcional)</option>';
      return;
    }

    const options = ['<option value="">Geral da Unidade (Opcional)</option>'];
    (DOCUMENTOS_STATE.equipamentos || []).forEach(function (item) {
      options.push('<option value="' + escapeHtml_(item.ID) + '">' + escapeHtml_(item.NOME_EQUIPAMENTO) + "</option>");
    });
    select.innerHTML = options.join("");
  }

  function documentosLerFormulario_() {
    return {
      CLIENTE_ID: getValue_("doc_cliente_id"),
      UNIDADE_ID: getValue_("doc_unidade_id"),
      EQUIPAMENTO_ID: getValue_("doc_equipamento_id"),
      TIPO_DOCUMENTO: getValue_("doc_tipo_documento"),
      NOME_ARQUIVO: getValue_("doc_nome_arquivo"),
      ARQUIVO_BASE64: getValue_("doc_arquivo_base64"),
      ARQUIVO_MIME: getValue_("doc_arquivo_mime"),
      ARQUIVO_NOME: getValue_("doc_arquivo_nome"),
      DATA_VENCIMENTO: getValue_("doc_data_vencimento")
    };
  }

  function documentosSalvar_() {
    if (!SESSION) return;

    const payload = documentosLerFormulario_();

    if (!payload.CLIENTE_ID) return alert("Selecione o cliente.");
    if (!payload.UNIDADE_ID) return alert("Selecione a unidade.");
    if (!payload.TIPO_DOCUMENTO) return alert("Informe a categoria do documento.");
    if (!payload.NOME_ARQUIVO) return alert("Informe a referência do arquivo.");
    if (!DOCUMENTOS_STATE.editingId && !payload.ARQUIVO_BASE64) return alert("Selecione um arquivo para o upload.");

    const btn = document.querySelector("#documentosFormTitulo")?.parentElement?.querySelector(".btn-primary");
    if (btn) {
      btn.disabled = true;
      btn.innerText = "Salvando/Enviando...";
    }

    if (DOCUMENTOS_STATE.editingId) {
      SGO_iniciarCarregamento_();
      google.script.run
        .withSuccessHandler(function (res) {
          SGO_finalizarCarregamento_();
          if (btn) {
            btn.disabled = false;
            btn.innerText = "Salvar";
          }
          if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao atualizar.");
          alert(res.message || "Atualizado com sucesso.");
          documentosNovo_();
          if (DOCUMENTOS_STATE.filtro) documentosPesquisar_();
        })
        .withFailureHandler(function (err) {
          SGO_finalizarCarregamento_();
          console.error("Falha ao atualizar documento:", err);
          if (btn) {
            btn.disabled = false;
            btn.innerText = "Salvar";
          }
          alert("Erro de conexão ao salvar.");
        })
        .documentosAtualizar(SESSION, DOCUMENTOS_STATE.editingId, payload);
      return;
    }

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (btn) {
          btn.disabled = false;
          btn.innerText = "Salvar";
        }
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao criar.");
        alert(res.message || "Criado com sucesso.");
        documentosNovo_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao criar documento:", err);
        if (btn) {
          btn.disabled = false;
          btn.innerText = "Salvar";
        }
        alert("Erro de conexão ao enviar documento.");
      })
      .documentosCriar(SESSION, payload);
  }

  function documentosEditar_(id) {
    if (!SESSION) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success || !res.item) return alert("Documento não encontrado.");

        const item = res.item;
        DOCUMENTOS_STATE.editingId = String(item.ID || "");

        SGO_prefillBuscaClienteLike_("doc_cliente_id", item.CLIENTE_ID || "", item.CLIENTE_NOME || "");
        carregarUnidadesParaDocumentos_(item.CLIENTE_ID, item.UNIDADE_ID, item.EQUIPAMENTO_ID);

        setValue_("doc_tipo_documento", item.TIPO_DOCUMENTO || "");
        setValue_("doc_nome_arquivo", item.NOME_ARQUIVO || "");

        let dt = item.DATA_VENCIMENTO || "";
        if (typeof dt === "string" && dt.includes("T")) dt = dt.split("T")[0];
        setValue_("doc_data_vencimento", dt);

        setValue_("doc_arquivo", "");
        setValue_("doc_arquivo_base64", "");
        setValue_("doc_arquivo_mime", "");
        setValue_("doc_arquivo_nome", "");
        setValue_("doc_status", item.STATUS || "ATIVO");

        const preview = document.getElementById("doc_arquivo_preview");
        if (preview) {
          if (item.LINK_ARQUIVO) {
            preview.innerHTML = `Arquivo atual: <a href="${escapeHtml_(item.LINK_ARQUIVO)}" target="_blank">Visualizar no Drive</a> <br><span style="color:var(--muted); font-weight:normal;">(Selecione um novo arquivo apenas se quiser substituir o atual)</span>`;
          } else {
            preview.innerText = "";
          }
        }

        const titulo = document.getElementById("documentosFormTitulo");
        if (titulo) titulo.innerText = "Editar documento";
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao buscar documento:", err);
        alert("Erro de comunicação ao buscar documento.");
      })
      .documentosObter(SESSION, id);
  }

  function documentosInativar_(id) {
    if (!SESSION || !confirm("Inativar este documento?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao inativar.");
        if (DOCUMENTOS_STATE.filtro) documentosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao inativar documento:", err);
        alert("Erro de comunicação ao inativar documento.");
      })
      .documentosInativar(SESSION, id);
  }

  function documentosReativar_(id) {
    if (!SESSION || !confirm("Reativar este documento?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao reativar.");
        if (DOCUMENTOS_STATE.filtro) documentosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao reativar documento:", err);
        alert("Erro de comunicação ao reativar documento.");
      })
      .documentosReativar(SESSION, id);
  }

  function documentosExcluir_(id) {
    if (!SESSION || !confirm("Excluir definitivamente este documento?")) return;

    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success) return alert((res && res.message) ? res.message : "Erro ao excluir.");
        if (DOCUMENTOS_STATE.editingId === id) documentosNovo_();
        if (DOCUMENTOS_STATE.filtro) documentosPesquisar_();
      })
      .withFailureHandler(function (err) {
        SGO_finalizarCarregamento_();
        console.error("Falha ao excluir documento:", err);
        alert("Erro de comunicação ao excluir documento.");
      })
      .documentosExcluir(SESSION, id);
  }

  function adminCarregarAlertasPadroes_() {
    const perfil = USER_CONTEXT && String(USER_CONTEXT.perfil || "").toUpperCase();
    const card = document.getElementById("adminAlertasPadroesCard");
    if (!card || perfil !== "ADMIN") return;
    card.style.display = "";
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) return adminFeedbackAlertasPadroes_((res && res.message) || "Falha ao carregar.", true);
        adminPreencherAlertasPadroes_(res.config || {});
        adminFeedbackAlertasPadroes_("Configurações carregadas.", false);
      })
      .withFailureHandler(function (err) { adminFeedbackAlertasPadroes_("Erro ao carregar: " + ((err && err.message) || err), true); })
      .alertasPadroesObterConfigAdmin(SESSION);
  }

  function adminPreencherAlertasPadroes_(c) {
    setSelectValueSafe_("ap_ativo", String(c.ativo !== false));
    document.getElementById("ap_gestor").checked = (c.perfis || []).indexOf("GESTOR") !== -1;
    document.getElementById("ap_metrologia").checked = (c.perfis || []).indexOf("METROLOGIA") !== -1;
    setValue_("ap_inicio", c.horaInicio || "08:00");
    setValue_("ap_fim", c.horaFim || "17:30");
    setValue_("ap_intervalo_balao", c.intervaloBalaoMin || 120);
    setValue_("ap_duracao", c.duracaoBalaoSeg || 20);
    setSelectValueSafe_("ap_critico", String(c.alertaCriticoAtivo !== false));
    setValue_("ap_intervalo_critico", c.intervaloCriticoMin || 240);
    setValue_("ap_antecedencia", c.antecedenciaDias || 30);
    setValue_("ap_mensagem", c.mensagem || "");
    const status = document.getElementById("ap_status");
    if (status) { status.textContent = c.ativo !== false ? "ATIVO" : "DESATIVADO"; status.className = "badge " + (c.ativo !== false ? "badge-ativo" : "badge-inativo"); }
  }

  function adminPayloadAlertasPadroes_() {
    const perfis = [];
    if (document.getElementById("ap_gestor").checked) perfis.push("GESTOR");
    if (document.getElementById("ap_metrologia").checked) perfis.push("METROLOGIA");
    return {
      ativo: getValue_("ap_ativo") === "true", perfis: perfis,
      horaInicio: getValue_("ap_inicio"), horaFim: getValue_("ap_fim"),
      intervaloBalaoMin: getValue_("ap_intervalo_balao"), duracaoBalaoSeg: getValue_("ap_duracao"),
      alertaCriticoAtivo: getValue_("ap_critico") === "true",
      intervaloCriticoMin: getValue_("ap_intervalo_critico"),
      antecedenciaDias: getValue_("ap_antecedencia"), mensagem: getValue_("ap_mensagem")
    };
  }

  function adminSalvarAlertasPadroes_() {
    const btn = document.getElementById("ap_btn_salvar");
    if (btn && btn.disabled) return;
    if (btn) { btn.disabled = true; btn.textContent = "Salvando..."; }
    adminFeedbackAlertasPadroes_("Aguarde, salvando configurações...", false);
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = "Salvar configurações"; }
        if (!res || !res.success) return adminFeedbackAlertasPadroes_((res && res.message) || "Falha ao salvar.", true);
        adminPreencherAlertasPadroes_(res.config || {});
        adminFeedbackAlertasPadroes_(res.message || "Configurações salvas.", false);
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = "Salvar configurações"; }
        adminFeedbackAlertasPadroes_("Erro ao salvar: " + ((err && err.message) || err), true);
      })
      .alertasPadroesSalvarConfigAdmin(SESSION, adminPayloadAlertasPadroes_());
  }

  function adminTestarAlertasPadroes_() {
    const btn = document.getElementById("ap_btn_testar");
    if (btn && btn.disabled) return;
    if (btn) { btn.disabled = true; btn.textContent = "Preparando..."; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = "Testar alerta agora"; }
        if (!res || !res.success) return adminFeedbackAlertasPadroes_((res && res.message) || "Falha no teste.", true);
        if (!res.exibir) return adminFeedbackAlertasPadroes_("Não existem pendências de padrões para demonstrar.", false);
        exibirAlertaCriticoPadroes_(res);
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = "Testar alerta agora"; }
        adminFeedbackAlertasPadroes_("Erro no teste: " + ((err && err.message) || err), true);
      })
      .alertasPadroesObterEstado(SESSION, true);
  }

  function adminFeedbackAlertasPadroes_(texto, erro) {
    const el = document.getElementById("ap_feedback");
    if (!el) return;
    el.textContent = texto || "";
    el.style.color = erro ? "var(--danger,#dc2626)" : "var(--muted,#64748b)";
  }
</script>

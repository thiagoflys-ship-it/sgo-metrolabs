<script>
  // =====================================================================
  // ADMINISTRAÇÃO E ARQUIVO DE DOCUMENTOS (CADASTROS E ADMINISTRAÇÃO 17/10)
  // Padrão comum em JS_Cadastros.html (CadUI_/CadTela_).
  //  - Arquivo de documentos (abrir('documentos')) — antes montado em Index.html.
  //  - Usuários (abrir('usuarios')) — tela própria; antes ficava dentro de Configurações.
  //  - Configurações (abrir('admin')) — blocos com título, explicação e Salvar próprio.
  // Regras que não mudam (conferidas no servidor): só um Administrador mexe em conta de
  // Administrador e o sistema nunca fica sem Administrador ativo (SGO_Usuarios.js);
  // usuário inativado perde a sessão em até 5 minutos (SGO_Auth.js › validarSessao);
  // edição nunca apaga campo ausente; cliente só vê a própria empresa; excluir é da gestão.
  // =====================================================================

  function SGO_rotuloPerfil_(p) {
    var k = String(p || "").toUpperCase();
    return ({ ADMIN: "Administrador", DIRETORIA: "Diretoria", GESTOR: "Gestor", TECNICO: "Técnico", METROLOGIA: "Metrologia", COMERCIAL: "Comercial", FINANCEIRO: "Financeiro", CLIENTE: "Cliente" })[k] || p;
  }
  // Celular (WhatsApp): mostra "(11) 98765-4321"; grava só dígitos com 55 na frente.
  function usuariosMascaraCelular_(v) {
    var d = String(v === null || v === undefined ? "" : v).replace(/\D/g, "");
    if (d.length > 11 && d.indexOf("55") === 0) d = d.slice(2);
    d = d.slice(0, 11);
    if (!d) return "";
    if (d.length <= 2) return "(" + d;
    var ddd = d.slice(0, 2), resto = d.slice(2);
    var corte = resto.length > 8 ? 5 : 4;
    if (resto.length <= corte) return "(" + ddd + ") " + resto;
    return "(" + ddd + ") " + resto.slice(0, corte) + "-" + resto.slice(corte);
  }
  /** "" = sem celular; null = inválido; senão "55" + DDD + número. */
  function usuariosCelularDigitos_(v) {
    var d = String(v || "").replace(/\D/g, "").replace(/^0+/, "");
    if (!d) return "";
    if (d.length === 10 || d.length === 11) d = "55" + d;
    return /^55\d{10,11}$/.test(d) ? d : null;
  }

  // =====================================================================
  // ARQUIVO DE DOCUMENTOS
  // =====================================================================
  var DOC_CATEGORIAS = [["1. Relatórios de Manutenção", "Relatórios de manutenção"], ["2. Certificados de Calibração", "Certificados de calibração"], ["3. Relatórios de Qualificação", "Relatórios de qualificação"], ["4. Ordens de Serviço", "Ordens de serviço"], ["5. Contratos", "Contratos"], ["Outros Documentos", "Outros documentos"]];

  function Documentos_nome_(d) { return (d && d.NOME_ARQUIVO) || "Documento sem nome"; }

  function renderDocumentosModulo_() {
    var gestao = CadUI_gestao_(), cliente = CadUI_ehCliente_();
    CadTela_montar_({
      chave: "documentos", titulo: "Arquivo de documentos", nomeItens: ["documento", "documentos"],
      subtitulo: cliente ? "Relatórios, certificados, ordens de serviço e contratos da sua empresa, organizados pelas categorias da NBR 15943." : "Relatórios, certificados, ordens de serviço e contratos de cada cliente, organizados pelas categorias da NBR 15943.",
      idBusca: "documentosPesquisa", buscaPlaceholder: "Buscar por documento, cliente, unidade, TAG ou categoria",
      ajuda: cliente
        ? "<p>Aqui ficam os documentos da sua empresa. Clique em <i>Abrir arquivo</i> para ver ou baixar. <b>Vencendo</b> = vence em até 30 dias; <b>Vencido</b> = venceu ou vence hoje.</p>"
        : "<p>Cada documento fica ligado a um cliente e a uma unidade e, quando for o caso, a um equipamento. O arquivo é guardado na pasta Cliente › Unidade › TAG › categoria.</p>" +
          "<ul><li><b>Vencendo</b> = vence em até 30 dias; <b>Vencido</b> = venceu ou vence hoje (mesma regra da central de pendências do Início).</li>" +
          "<li><b>Sem arquivo</b> = registro feito sem o arquivo. Abra, clique em Editar e anexe o arquivo para concluir.</li>" +
          "<li>Para renovar um documento, cadastre o novo (mesmo equipamento e mesma categoria) com o vencimento novo.</li>" +
          "<li>Trocar o cliente, a unidade ou o equipamento de um documento já ligado é da gestão. Quando a unidade ou o equipamento muda de cliente em <b>Vínculos</b>, os documentos acompanham automaticamente.</li>" +
          "<li>Excluir tira o registro da lista (só a gestão); o arquivo guardado não é apagado.</li></ul>",
      resumo: [
        { id: "todos", rotulo: "Total" },
        { id: "ativos", rotulo: "Ativos", tom: "tom-ok", filtro: function (d) { return d.STATUS !== "INATIVO"; } },
        { id: "inativos", rotulo: "Inativos", filtro: function (d) { return d.STATUS === "INATIVO"; } },
        { id: "vencidos", rotulo: "Vencidos", tom: "tom-perigo", filtro: function (d) { return d.STATUS !== "INATIVO" && d.VENCIMENTO_SITUACAO === "vencido"; } },
        { id: "vencendo", rotulo: "Vencendo em 30 dias", tom: "tom-alerta", filtro: function (d) { return d.STATUS !== "INATIVO" && d.VENCIMENTO_SITUACAO === "vencendo"; } },
        { id: "semarq", rotulo: "Sem arquivo", tom: "tom-alerta", filtro: function (d) { return (d.PENDENCIAS || []).indexOf("sem_arquivo") >= 0; } }
      ],
      filtros: [
        { id: "categoria", rotulo: "Todas as categorias", opcoes: function (its) { return CadTela_opcoesDe_(its, "TIPO_DOCUMENTO", "TIPO_DOCUMENTO").map(function (o) { return [o[0], Documentos_categoria_(o[1])]; }); }, aplicar: function (d, v) { return String(d.TIPO_DOCUMENTO || "") === v; } },
        { id: "cliente", rotulo: "Todos os clientes", opcoes: function (its) { return cliente ? [] : CadTela_opcoesDe_(its, "CLIENTE_ID", "CLIENTE_NOME"); }, aplicar: function (d, v) { return String(d.CLIENTE_ID) === v; } }
      ],
      ordenar: [
        { id: "recentes", rotulo: "Mais recentes primeiro", fn: null },
        { id: "venc", rotulo: "Vencimento mais próximo", fn: function (a, b) { var x = a.VENCIMENTO_DIAS, y = b.VENCIMENTO_DIAS; return (x === null || x === undefined) - (y === null || y === undefined) || (x || 0) - (y || 0); } },
        { id: "nome", rotulo: "Ordenar por nome", fn: function (a, b) { return Documentos_nome_(a).localeCompare(Documentos_nome_(b), "pt-BR"); } }
      ],
      texto: function (d) { return [d.NOME_ARQUIVO, d.TIPO_DOCUMENTO, Documentos_categoria_(d.TIPO_DOCUMENTO), d.CLIENTE_NOME, d.UNIDADE_NOME, d.EQUIPAMENTO_NOME, d.CLIENTE_CNPJ].join(" "); },
      acao: cliente ? null : { texto: "Novo documento", fn: function () { Documentos_formulario_(null); } },
      vazioTitulo: "Nenhum documento no arquivo ainda.", vazio: cliente ? "Os documentos da sua empresa aparecem aqui assim que forem enviados pela Metrolabs." : "Clique em Novo documento para enviar o primeiro.",
      colunas: [
        { titulo: "Documento", html: function (d) { return '<div class="cadx-tit">' + CadUI_esc_(Documentos_nome_(d)) + '</div><div class="cadx-sub">' + CadUI_esc_(Documentos_categoria_(d.TIPO_DOCUMENTO) || "Sem categoria") + "</div>" + CadUI_chips_({ PENDENCIAS: (d.PENDENCIAS || []).filter(function (p) { return p === "sem_arquivo"; }) }); } },
        { titulo: "Cliente / unidade", html: function (d) { return "<div>" + CadUI_esc_(d.CLIENTE_NOME || "Sem cliente") + '</div><div class="cadx-sub">' + CadUI_esc_(d.UNIDADE_NOME || "Sem unidade") + "</div>"; } },
        { titulo: "Equipamento", html: function (d) { return d.EQUIPAMENTO_NOME ? CadUI_esc_(d.EQUIPAMENTO_NOME) : '<span class="cadx-sub">Geral da unidade</span>'; } },
        { titulo: "Vencimento", html: function (d) { return CadUI_vencimento_(d.VENCIMENTO_SITUACAO, d.VENCIMENTO_DIAS, d.VENCIMENTO_ISO); } },
        { titulo: "Situação", html: function (d) { return CadUI_selo_(d.STATUS); } },
        { titulo: "", classe: "cadx-col-acoes", html: function (d) { return CadTela_botoesLinha_("documentos", d); } }
      ],
      cartao: function (d) {
        return '<div class="cadx-cartao-topo"><div><div class="cadx-tit">' + CadUI_esc_(Documentos_nome_(d)) + '</div><div class="cadx-sub">' + CadUI_esc_([Documentos_categoria_(d.TIPO_DOCUMENTO), d.CLIENTE_NOME].filter(Boolean).join(" · ")) + "</div></div>" + CadUI_selo_(d.STATUS) + "</div>" +
          '<div class="cadx-cartao-linhas"><span>' + CadUI_esc_(d.EQUIPAMENTO_NOME || d.UNIDADE_NOME || "") + "</span></div><div>" + CadUI_vencimento_(d.VENCIMENTO_SITUACAO, d.VENCIMENTO_DIAS, d.VENCIMENTO_ISO) + "</div>" + CadUI_chips_({ PENDENCIAS: (d.PENDENCIAS || []).filter(function (p) { return p === "sem_arquivo"; }) });
      },
      botaoPrincipal: cliente ? function (d) { return d.LINK_ARQUIVO ? { texto: "Abrir arquivo", acao: "arquivo" } : null; } : null,
      acoesExtras: { arquivo: function (d) { Documentos_abrirArquivo_(d); } },
      editar: cliente ? null : function (d) { Documentos_formulario_(d.ID); },
      mais: cliente ? null : function (d) { return Documentos_menu_(d, gestao); },
      abrir: function (d) { Documentos_detalhe_(d); },
      carregar: function (ok, erro) {
        CadUI_chamar_("cadastrosPainel", ["documentos"], function (res) { ok(res.items || []); setTimeout(function () { CadTela_cumprirIrPara_("documentos"); }, 0); }, erro);
      }
    });
  }

  function Documentos_abrirArquivo_(d) {
    if (!d.LINK_ARQUIVO) { CadUI_aviso_("Este documento ainda não tem arquivo. Clique em Editar e anexe o arquivo.", "alerta"); return; }
    window.open(d.LINK_ARQUIVO, "_blank", "noopener");
  }

  function Documentos_menu_(d, gestao) {
    var ativo = d.STATUS !== "INATIVO";
    return [
      { texto: "Ver detalhes", icone: "fa-circle-info", acao: function () { CadTela_abrirItem_("documentos", d.ID); } },
      { texto: d.LINK_ARQUIVO ? "Abrir arquivo" : "Abrir arquivo (sem arquivo)", icone: "fa-up-right-from-square", desabilitado: !d.LINK_ARQUIVO, nota: d.LINK_ARQUIVO ? "" : "Sem arquivo: clique em Editar e anexe.", acao: function () { Documentos_abrirArquivo_(d); } },
      "-",
      ativo
        ? { texto: "Inativar documento", icone: "fa-ban", risco: true, acao: function () { Documentos_inativar_(d); } }
        : { texto: "Reativar documento", icone: "fa-rotate-left", acao: function () { Documentos_reativar_(d); } },
      { texto: "Excluir documento", icone: "fa-trash-can", risco: true, desabilitado: !gestao, nota: gestao ? "" : "Excluir é feito pela gestão (Gestor, Diretoria ou Administrador).", acao: function () { Documentos_excluir_(d); } }
    ];
  }

  function Documentos_detalhe_(d) {
    var gestao = CadUI_gestao_(), cliente = CadUI_ehCliente_();
    var semArq = (d.PENDENCIAS || []).indexOf("sem_arquivo") >= 0;
    CadUI_painelAbrir_({
      chave: "documentos", id: d.ID, titulo: Documentos_nome_(d), sub: CadUI_esc_(Documentos_categoria_(d.TIPO_DOCUMENTO) || "Sem categoria"),
      seloHtml: CadUI_selo_(d.STATUS),
      corpo: function () {
        return (semArq ? '<div class="cadx-faixa bc-faixa tom-alerta"><b>Sem arquivo.</b> ' + (cliente ? "O arquivo ainda não foi enviado pela Metrolabs." : "Clique em Editar e anexe o arquivo para concluir o documento.") + "</div>" : "") +
          (d.VENCIMENTO_SITUACAO === "vencido" && d.STATUS !== "INATIVO" ? '<div class="cadx-faixa bc-faixa tom-perigo"><b>Documento vencido.</b> ' + (cliente ? "A Metrolabs já foi avisada pela central de pendências." : "Cadastre a versão renovada (mesmo equipamento e categoria); ela substitui esta nos alertas.") + "</div>" : "") +
          '<section class="cadx-sec"><h4 class="cadx-sec-tit">Documento</h4>' + CadUI_dados_([["Nome ou referência", d.NOME_ARQUIVO], ["Categoria", Documentos_categoria_(d.TIPO_DOCUMENTO)], ["Vencimento", CadUI_vencimento_(d.VENCIMENTO_SITUACAO, d.VENCIMENTO_DIAS, d.VENCIMENTO_ISO), true], ["Cadastrado em", CadUI_dataHora_(d.CRIADO_EM)],
            ["Arquivo", d.LINK_ARQUIVO ? '<a class="cadx-btn" href="' + CadUI_esc_(d.LINK_ARQUIVO) + '" target="_blank" rel="noopener">Abrir arquivo</a>' : '<span class="cadx-chip tom-alerta">Sem arquivo</span>', true]]) + "</section>" +
          '<section class="cadx-sec"><h4 class="cadx-sec-tit">Ligado a</h4>' + CadUI_dados_([["Cliente", d.CLIENTE_NOME], ["Unidade", d.UNIDADE_NOME], ["Equipamento", d.EQUIPAMENTO_NOME || "Geral da unidade"]]) +
            (cliente ? "" : '<div class="cadx-acoes" style="margin-top:8px;justify-content:flex-start;flex-wrap:wrap">' +
              (d.CLIENTE_ID ? '<button type="button" class="cadx-btn" onclick="CadTela_irPara_(\'clientes\',\'' + CadUI_esc_(d.CLIENTE_ID) + '\')">Abrir cliente</button>' : "") +
              (d.UNIDADE_ID ? '<button type="button" class="cadx-btn" onclick="CadTela_irPara_(\'unidades\',\'' + CadUI_esc_(d.UNIDADE_ID) + '\')">Abrir unidade</button>' : "") +
              (d.EQUIPAMENTO_ID ? '<button type="button" class="cadx-btn" onclick="CadTela_irPara_(\'equipamentos\',\'' + CadUI_esc_(d.EQUIPAMENTO_ID) + '\')">Abrir equipamento</button>' : "") + "</div>") + "</section>";
      },
      depois: function (p) {
        var mais = p.querySelector("#cadxPainelMais");
        if (mais) mais.onclick = function () { CadUI_menu_(mais, Documentos_menu_(d, gestao).filter(function (x) { return x === "-" || x.texto !== "Ver detalhes"; })); };
      },
      rodape: cliente ? (d.LINK_ARQUIVO ? '<a class="cadx-btn cadx-btn-grande cadx-btn-primario" href="' + CadUI_esc_(d.LINK_ARQUIVO) + '" target="_blank" rel="noopener">Abrir arquivo</a>' : "") :
        '<div class="cadx-rodape-esq"><button type="button" class="cadx-btn cadx-btn-grande" id="cadxPainelMais">Mais ações <i class="fas fa-chevron-up" aria-hidden="true" style="font-size:10px"></i></button></div>' +
        '<button type="button" class="cadx-btn cadx-btn-grande cadx-btn-primario" onclick="Documentos_formulario_(\'' + CadUI_esc_(d.ID) + '\')">' + (semArq ? "Editar e anexar arquivo" : "Editar") + "</button>"
    });
  }

  function Documentos_inativar_(d) {
    CadTela_acaoRisco_({ titulo: "Inativar o documento", botao: "Inativar documento", fn: "documentosInativar", id: d.ID,
      texto: "<p>Inativar <b>" + CadUI_esc_(Documentos_nome_(d)) + "</b>?</p><p>Ele sai dos alertas de vencimento e da lista do cliente. O arquivo continua guardado; para voltar, use Reativar.</p>",
      aoConcluir: function () { CadTela_recarregar_("documentos", d.ID); } });
  }
  function Documentos_reativar_(d) {
    CadTela_acaoRisco_({ titulo: "Reativar o documento", botao: "Reativar documento", risco: false, fn: "documentosReativar", id: d.ID,
      texto: "<p>Reativar <b>" + CadUI_esc_(Documentos_nome_(d)) + "</b>? Ele volta à lista do cliente e aos alertas de vencimento.</p>",
      aoConcluir: function () { CadTela_recarregar_("documentos", d.ID); } });
  }
  function Documentos_excluir_(d) {
    CadTela_acaoRisco_({ titulo: "Excluir o documento", botao: "Excluir da lista", fn: "documentosExcluir", id: d.ID,
      texto: "<p>Excluir <b>" + CadUI_esc_(Documentos_nome_(d)) + "</b> da lista? A exclusão não pode ser desfeita por aqui.</p><p>O arquivo guardado não é apagado (fica registrado no log). Para só tirar de uso, prefira Inativar.</p>",
      aoConcluir: function () { CadUI_painelFechar_(); CadTela_recarregar_("documentos"); } });
  }

  /** Novo documento já ligado a um equipamento (vindo de Equipamentos). */
  function Documentos_novoPara_(e) {
    var pre = { clienteId: e.CLIENTE_ID, clienteNome: e.CLIENTE_NOME, unidadeId: e.UNIDADE_ID, equipamentoId: e.ID };
    if (CADUI.telas.documentos && document.getElementById("cadxTela_documentos")) { Documentos_formulario_(null, pre); return; }
    CADUI.irPara = { chave: "documentos", novo: function () { Documentos_formulario_(null, pre); } };
    abrir("documentos");
  }

  var DOC_ARQ = { base64: "", mime: "", nome: "" };

  function Documentos_formulario_(id, pre) {
    if (CadUI_ehCliente_()) return;
    var d = id ? CadTela_item_("documentos", id) : null;
    var novo = !d;
    d = d || {};
    pre = pre || {};
    DOC_ARQ = { base64: "", mime: "", nome: "" };
    var gestao = CadUI_gestao_();
    // não gestão: o vínculo já preenchido fica travado (o servidor recusa a troca); campo vazio continua livre
    var travaCli = !novo && !gestao && !!d.CLIENTE_ID, travaUni = !novo && !gestao && !!d.UNIDADE_ID, travaEq = !novo && !gestao && !!d.EQUIPAMENTO_ID;
    var tipoAtual = String(d.TIPO_DOCUMENTO || "");
    var cats = DOC_CATEGORIAS.slice();
    var achou = cats.filter(function (c) { return c[0].toUpperCase() === tipoAtual.toUpperCase(); })[0];
    if (tipoAtual && !achou) cats.push([tipoAtual, Documentos_categoria_(tipoAtual) + " (categoria antiga)"]);
    var valorCat = achou ? achou[0] : tipoAtual;
    var cfg = {
      chave: "documentos", id: id || "", titulo: novo ? "Novo documento" : "Editar documento",
      sub: novo ? "Escolha onde o documento fica, a categoria e o arquivo." : CadUI_esc_(Documentos_nome_(d)),
      corpo: function () {
        return CadUI_secao_("Vínculo", [
          travaCli ? CadUI_campo_({ id: "doc_cliente_fixo", rotulo: "Cliente", inteiro: true, html: '<div class="cadx-travado">' + CadUI_esc_(d.CLIENTE_NOME) + "</div>" })
                   : CadUI_campo_({ id: "doc_cliente_id", paraId: "doc_cliente_id_busca", rotulo: "Cliente", obrigatorio: true, inteiro: true, html: SGO_htmlBuscaClienteLike_("doc_cliente_id", "Digite o nome ou o CNPJ do cliente e escolha na lista") }),
          travaUni ? CadUI_campo_({ id: "doc_unidade_fixo", rotulo: "Unidade", inteiro: true, html: '<div class="cadx-travado">' + CadUI_esc_(d.UNIDADE_NOME) + "</div>" })
                   : CadUI_campo_({ id: "doc_unidade_id", rotulo: "Unidade", obrigatorio: true, inteiro: true, tipo: "select", opcoes: [["", "Escolha o cliente primeiro"]] }),
          travaEq ? CadUI_campo_({ id: "doc_equip_fixo", rotulo: "Equipamento", inteiro: true, html: '<div class="cadx-travado">' + CadUI_esc_(d.EQUIPAMENTO_NOME) + "</div>" })
                  : CadUI_campo_({ id: "doc_equipamento_id", rotulo: "Equipamento (opcional)", inteiro: true, tipo: "select", opcoes: [["", "Escolha a unidade primeiro"]], dica: "Deixe em branco para documento geral da unidade (ex.: contrato)." })
        ].concat(travaCli || travaUni || travaEq ? ['<p class="cadx-dica is-inteiro" style="grid-column:1/-1">Trocar o cliente, a unidade ou o equipamento de um documento já ligado é feito pela gestão (Gestor, Diretoria ou Administrador). Os outros campos você edita normalmente.</p>'] : [])) +
        CadUI_secao_("Documento", [
          CadUI_campo_({ id: "doc_tipo_documento", rotulo: "Categoria (NBR 15943)", obrigatorio: true, inteiro: true, tipo: "select", valor: valorCat, opcoes: [["", "Escolha a categoria"]].concat(cats) }),
          CadUI_campo_({ id: "doc_nome_arquivo", rotulo: "Nome ou referência", obrigatorio: true, inteiro: true, valor: d.NOME_ARQUIVO, placeholder: "Ex.: Relatório de qualificação AUT-01 2026" }),
          CadUI_campo_({ id: "doc_data_vencimento", rotulo: "Data de vencimento", tipo: "date", valor: d.VENCIMENTO_ISO || "", dica: "Opcional. Com data, o documento entra nos alertas: vencendo em até 30 dias e vencido." })
        ]) +
        CadUI_secao_("Arquivo", [
          CadUI_campo_({ id: "doc_arquivo", rotulo: novo ? "Arquivo do documento" : "Substituir o arquivo", inteiro: true,
            html: '<input id="doc_arquivo" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" data-rotulo="Escolher arquivo"><div class="cadx-dica" id="doc_arquivo_preview">' +
              (d.LINK_ARQUIVO ? 'Arquivo atual: <a href="' + CadUI_esc_(d.LINK_ARQUIVO) + '" target="_blank" rel="noopener">abrir</a>. Escolha outro só se quiser substituir.' : (novo ? "PDF, imagem, Word ou Excel, até 5 MB. Sem arquivo, o documento fica como Sem arquivo até ser anexado." : "Este documento ainda não tem arquivo: anexe para concluir.")) + "</div>" })
        ]) +
        '<p class="cadx-dica">Campos com <span class="cadx-obr">*</span> são obrigatórios.</p>';
      },
      rodape: '<button type="button" class="cadx-btn cadx-btn-grande" onclick="' + (novo ? "CadUI_painelFechar_()" : "Documentos_voltarDetalhe_('" + CadUI_esc_(id) + "')") + '">Cancelar</button>' + CadUI_botaoSalvar_(novo ? "Salvar documento" : "Salvar alterações"),
      depois: function (p) {
        CadUI_ligarFormulario_(p);
        var cliIni = novo ? (pre.clienteId || "") : d.CLIENTE_ID, uniIni = novo ? (pre.unidadeId || "") : d.UNIDADE_ID, eqIni = novo ? (pre.equipamentoId || "") : d.EQUIPAMENTO_ID;
        var carregarEquip = function (uid, escolher) {
          var sel = document.getElementById("doc_equipamento_id");
          if (!sel) return;
          if (!uid) { sel.innerHTML = '<option value="">Escolha a unidade primeiro</option>'; return; }
          sel.innerHTML = '<option value="">Carregando os equipamentos…</option>';
          CadUI_chamar_("documentosListarEquipamentosAtivosPorUnidade", [uid], function (res) {
            var its = res.items || [];
            sel.dataset.carregado = "1";
            sel.innerHTML = '<option value="">Geral da unidade (sem equipamento)</option>' + its.map(function (x) { return '<option value="' + CadUI_esc_(x.ID) + '">' + CadUI_esc_(x.NOME_EQUIPAMENTO) + "</option>"; }).join("");

  function Documentos_lerArquivo_() {
    var el = document.getElementById("doc_arquivo");
    var f = el && el.files ? el.files[0] : null;
    var prev = document.getElementById("doc_arquivo_preview");
    DOC_ARQ = { base64: "", mime: "", nome: "" };
    CadUI_erroCampo_("doc_arquivo", "");
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { el.value = ""; CadUI_erroCampo_("doc_arquivo", "O arquivo tem " + (f.size / 1048576).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " MB; o limite é 5 MB. Reduza (ex.: PDF compactado) e escolha de novo."); return; }
    if (prev) prev.textContent = "Lendo " + f.name + "…";
    var r = new FileReader();
    r.onload = function (e) { DOC_ARQ = { base64: e.target.result, mime: f.type, nome: f.name }; if (prev) prev.textContent = "Pronto para enviar: " + f.name + " (" + (f.size / 1024).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + " KB)."; };
    r.onerror = function () { el.value = ""; CadUI_erroCampo_("doc_arquivo", "Não foi possível ler o arquivo. Escolha de novo."); };
    r.readAsDataURL(f);
  }

  function Documentos_salvar_(id) {
    var novo = !id;
    var d = id ? CadTela_item_("documentos", id) || {} : {};
    var p = { TIPO_DOCUMENTO: getValue_("doc_tipo_documento"), NOME_ARQUIVO: getValue_("doc_nome_arquivo"), DATA_VENCIMENTO: getValue_("doc_data_vencimento") };
    // Lista ainda carregando: vale o vínculo atual (nunca apaga o que já estava gravado).
    var pronto = function (idSel) { var el = document.getElementById(idSel); return el && el.dataset.carregado === "1"; };
    p.CLIENTE_ID = document.getElementById("doc_cliente_id") ? getValue_("doc_cliente_id") : d.CLIENTE_ID;
    p.UNIDADE_ID = pronto("doc_unidade_id") ? getValue_("doc_unidade_id") : d.UNIDADE_ID;
    p.EQUIPAMENTO_ID = pronto("doc_equipamento_id") ? getValue_("doc_equipamento_id") : d.EQUIPAMENTO_ID;
    if (!novo && document.getElementById("doc_unidade_id") && !pronto("doc_unidade_id") && p.CLIENTE_ID !== d.CLIENTE_ID) { CadUI_aviso_("Aguarde carregar as unidades do cliente escolhido e salve de novo.", "alerta"); return; }
    if (novo && (!pronto("doc_unidade_id") || (p.UNIDADE_ID && !pronto("doc_equipamento_id")))) { if (p.CLIENTE_ID) { CadUI_aviso_("Aguarde carregar as unidades e os equipamentos e salve de novo.", "alerta"); return; } }
    if (DOC_ARQ.base64) { p.ARQUIVO_BASE64 = DOC_ARQ.base64; p.ARQUIVO_MIME = DOC_ARQ.mime; p.ARQUIVO_NOME = DOC_ARQ.nome; }
    var erros = {};
    if (!p.CLIENTE_ID) erros.doc_cliente_id = "Escolha o cliente na lista.";
    if (!p.UNIDADE_ID) erros.doc_unidade_id = "Escolha a unidade.";
    if (!p.TIPO_DOCUMENTO) erros.doc_tipo_documento = "Escolha a categoria.";
    if (!p.NOME_ARQUIVO) erros.doc_nome_arquivo = "Informe o nome ou a referência do documento.";
    var el = document.getElementById("doc_arquivo");
    if (el && el.files && el.files[0] && !DOC_ARQ.base64) erros.doc_arquivo = "Aguarde terminar a leitura do arquivo e clique em Salvar de novo.";
    if (!CadUI_mostrarErros_(erros, ["doc_cliente_id", "doc_unidade_id", "doc_tipo_documento", "doc_nome_arquivo", "doc_arquivo"])) return;
    CadUI_salvando_(true);
    CadUI_chamar_(novo ? "documentosCriar" : "documentosAtualizar", novo ? [p] : [id, p], function (res) {
      CadUI_painelSujo_(false);
      CadUI_aviso_(res.message || "Documento salvo.", "ok");
      CadTela_carregar_("documentos", function () {
        var it = id ? CadTela_item_("documentos", id) : (CADUI.telas.documentos.itens || []).filter(function (x) { return String(x.NOME_ARQUIVO).toUpperCase() === p.NOME_ARQUIVO.toUpperCase() && x.UNIDADE_ID === p.UNIDADE_ID; })[0];
        if (it) Documentos_detalhe_(it); else CadUI_painelFechar_();
      });
    }, function (msg) { CadUI_salvando_(false); CadUI_aviso_(msg, "erro"); }, DOC_ARQ.base64 ? "Aguarde, enviando o arquivo…" : "Aguarde, salvando…");
  }

  function Config_salvarOciosidade_() {
    var campo = document.getElementById("inputIdleLimit");
    var min = Number(String(campo ? campo.value : "").replace(",", "."));
    if (!isFinite(min) || min < 0.5) { CadUI_erroCampo_("inputIdleLimit", "Informe pelo menos meio minuto (0,5)."); return; }
    CadUI_erroCampo_("inputIdleLimit", "");
    var seg = Math.round(min * 60);
    IDLE_LIMIT = seg;
    try { setLocalStorageItem_(STORAGE_KEYS.IDLE_LIMIT, String(seg)); } catch (e) {}
    try { resetarOciosidade_(); iniciarMonitorOciosidade_(); } catch (e) {}
    var som = document.getElementById("cfgSom");
    if (som) {
      SOM_OCIOSIDADE_ATIVO = som.checked;
      try { salvarPreferenciaSomOciosidade_(som.checked); } catch (e) {}
      if (!som.checked) { try { pararSomOciosidade_(); } catch (e) {} }
    }
    Config_msg_("cfgOciosidadeMsg", "Salvo: aviso depois de " + CadUI_num_(min) + (min === 1 ? " minuto" : " minutos") + ", som " + (SOM_OCIOSIDADE_ATIVO ? "ligado" : "desligado") + ".", "ok");
  }

  function limparCacheNavegador_() {
    CadUI_confirmar_({
      titulo: "Sair e recarregar", botao: "Sair e recarregar",
      texto: "<p>Sai do SGO+ neste navegador e recarrega a página. Os dados salvos não são afetados; você entra de novo com o seu login.</p>",
      aoConfirmar: function () {
        try {
          if (typeof STORAGE_KEYS !== "undefined" && STORAGE_KEYS.SESSION) {
            sessionStorage.removeItem(STORAGE_KEYS.SESSION); sessionStorage.removeItem(STORAGE_KEYS.SESSION_ID);
            localStorage.removeItem(STORAGE_KEYS.SESSION); localStorage.removeItem(STORAGE_KEYS.SESSION_ID);
          } else { ["SGO_SESSION", "SGO_SESSION_ID"].forEach(function (k) { sessionStorage.removeItem(k); localStorage.removeItem(k); }); }
        } catch (e) { console.error("Falha ao limpar sessão:", e); }
        SESSION = null; USER_CONTEXT = null;
        location.reload();
      }
    });
  }

  function adminCarregarAlertasPadroes_() {
    if (CadUI_perfil_() !== "ADMIN" || !document.getElementById("adminAlertasPadroesCard")) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) return adminFeedbackAlertasPadroes_((res && res.message) || "Não foi possível carregar as configurações.", true);
        adminPreencherAlertasPadroes_(res.config || {});
        adminFeedbackAlertasPadroes_("", false);
      })
      .withFailureHandler(function (err) { console.error("Alertas de padrões:", err); adminFeedbackAlertasPadroes_("Não foi possível carregar as configurações. Verifique a conexão e atualize a página.", true); })
      .alertasPadroesObterConfigAdmin(SESSION);
  }
  function adminPreencherAlertasPadroes_(c) {
    var marca = function (id, v) { var el = document.getElementById(id); if (el) el.checked = !!v; };
    marca("ap_ativo_chave", c.ativo !== false);
    marca("ap_gestor", (c.perfis || []).indexOf("GESTOR") !== -1);
    marca("ap_metrologia", (c.perfis || []).indexOf("METROLOGIA") !== -1);
    marca("ap_critico_chave", c.alertaCriticoAtivo !== false);
    setValue_("ap_inicio", c.horaInicio || "08:00"); setValue_("ap_fim", c.horaFim || "17:30");
    setValue_("ap_intervalo_balao", c.intervaloBalaoMin || 120); setValue_("ap_duracao", c.duracaoBalaoSeg || 20);
    setValue_("ap_intervalo_critico", c.intervaloCriticoMin || 240); setValue_("ap_antecedencia", c.antecedenciaDias || 30);
    setValue_("ap_mensagem", c.mensagem || "");
    var st = document.getElementById("ap_status");
    if (st) { st.textContent = c.ativo !== false ? "Ligados" : "Desligados"; st.className = "cadx-selo bc-selo " + (c.ativo !== false ? "tom-ok" : ""); }
  }
  function adminPayloadAlertasPadroes_() {
    var perfis = [];
    if (document.getElementById("ap_gestor").checked) perfis.push("GESTOR");
    if (document.getElementById("ap_metrologia").checked) perfis.push("METROLOGIA");
    return {
      ativo: document.getElementById("ap_ativo_chave").checked, perfis: perfis,
      horaInicio: getValue_("ap_inicio"), horaFim: getValue_("ap_fim"),
      intervaloBalaoMin: getValue_("ap_intervalo_balao"), duracaoBalaoSeg: getValue_("ap_duracao"),

    };

  function adminSalvarAlertasPadroes_() {
    var btn = document.getElementById("ap_btn_salvar");
    if (btn && btn.disabled) return;
    if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }
    adminFeedbackAlertasPadroes_("Salvando…", false);
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = "Salvar"; }
        if (!res || !res.success) return adminFeedbackAlertasPadroes_((res && res.message) || "Não foi possível salvar.", true);
        adminPreencherAlertasPadroes_(res.config || {});
        adminFeedbackAlertasPadroes_(res.message || "Configurações salvas.", false, true);
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = "Salvar"; }
        console.error("Salvar alertas de padrões:", err);
        adminFeedbackAlertasPadroes_("Não foi possível salvar. Verifique a conexão e tente de novo; nada foi alterado.", true);
      })
      .alertasPadroesSalvarConfigAdmin(SESSION, adminPayloadAlertasPadroes_());
  }
  function adminTestarAlertasPadroes_() {
    var btn = document.getElementById("ap_btn_testar");
    if (btn && btn.disabled) return;
    if (btn) { btn.disabled = true; btn.textContent = "Preparando…"; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = "Testar agora"; }
        if (!res || !res.success) return adminFeedbackAlertasPadroes_((res && res.message) || "Não foi possível testar o alerta.", true);
        if (!res.exibir) return adminFeedbackAlertasPadroes_("Nenhum padrão vencido ou vencendo agora: não há o que mostrar no teste.", false);
        if (typeof exibirAlertaCriticoPadroes_ === "function") exibirAlertaCriticoPadroes_(res);
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = "Testar agora"; }
        console.error("Teste de alertas de padrões:", err);
        adminFeedbackAlertasPadroes_("Não foi possível testar. Verifique a conexão e tente de novo.", true);
      })
      .alertasPadroesObterEstado(SESSION, true);
  }
  function adminFeedbackAlertasPadroes_(texto, erro, ok) { Config_msg_("ap_feedback", texto, erro ? "erro" : ok ? "ok" : ""); }
</script>

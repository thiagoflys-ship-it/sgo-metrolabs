<script>
  let tplRelCal_carregado_ = false;

  function renderTplRelCal_() {
    const container = document.getElementById('tplRelCalContainer');
    if (!container) return;

    if (tplRelCal_carregado_) {
      if (typeof tplRelCal_renderReal_ === 'function') tplRelCal_renderReal_();
      return;
    }

    container.innerHTML = '<p style="padding:20px;color:#94a3b8;">Carregando módulo Relatório de Calibração...</p>';

    google.script.run
      .withSuccessHandler(function(conteudoBruto) {
        try {
          const styleMatch = conteudoBruto.match(/<style>([\s\S]*?)<\/style>/);
          const scriptMatch = conteudoBruto.match(/<script>([\s\S]*?)<\/script>/);

          if (styleMatch) {
            const styleEl = document.createElement('style');
            styleEl.textContent = styleMatch[1];
            document.head.appendChild(styleEl);
          }

          if (scriptMatch) {
            window.eval(scriptMatch[1]);
          }

          tplRelCal_carregado_ = true;

          if (typeof tplRelCal_renderReal_ === 'function') {
            tplRelCal_renderReal_();
          } else {
            container.innerHTML = '<p style="padding:20px;color:#f87171;">Falha ao inicializar o módulo (função de renderização não encontrada).</p>';
          }
        } catch (e) {
          console.error('tplRelCal: erro ao montar o módulo:', e);
          container.innerHTML = '<p style="padding:20px;color:#f87171;">Erro ao montar o módulo: ' + (e && e.message ? e.message : e) + '</p>';
        }
      })
      .withFailureHandler(function(err) {
        console.error('tplRelCal: falha ao buscar o módulo:', err);
        container.innerHTML = '<p style="padding:20px;color:#f87171;">Falha ao carregar o módulo: ' + ((err && err.message) ? err.message : err) + '</p>';
      })
      .RelCal_obterConteudoModulo();
  }
</script>

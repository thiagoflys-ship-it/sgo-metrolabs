<!--
  SGO+ LICITAÇÕES — CONTRATOS CONQUISTADOS (02/11/2026): a tela "Contratos" (menu Licitações) e a aba "Contrato" da ficha.
  O contrato nasce do resultado homologado da disputa (ou é registrado manualmente, com o motivo), tem versões (correção, termo aditivo,
  apostilamento, encerramento), o arquivo assinado restrito com SHA-256, os prazos na agenda de Licitações com os alertas da Diretoria,
  a previsão de faturamento (só leitura) e a integração com os módulos do SGO+ (cliente do cadastro único, Comercial, Minhas atividades,
  planejamento da execução), sempre por ação explícita e com confirmação. Servidor: SGO_Licitacoes_Contratos.js (Licitacoes_api ação
  "contratos" com { op }). Usa os utilitários de JS_Licitacoes.html (Lic_esc_, Lic_chamar_, Lic_janela_, Lic_faixa_, Lic_tabelaHtml_,
  Lic_brl_, Lic_toast_, Lic_carregando_, Lic_erroTela_, Lic_ligarRefazer_, Lic_irFicha_) e a janela segura do A4 de JS_Licitacoes_Proposta.html.
  Todo texto passa por Lic_esc_. Sem atualização automática: só redesenha depois de uma ação de quem está na tela.
-->
<style>
  .lct-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
  .lct-grade label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .lct-grade input, .lct-grade select, .lct-grade textarea { width: 100%; min-height: 44px; box-sizing: border-box; max-width: 100%; }
  .lct-grade .lct-largo { grid-column: 1 / -1; }
  .lct-grade fieldset { grid-column: 1 / -1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 0; min-width: 0; }
  .lct-grade legend { font-weight: 700; font-size: 12.5px; padding: 0 4px; }
  .lct-linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; align-items: end; padding: 6px 0; border-top: 1px dashed var(--border); }
  .lct-linha input { width: 100%; min-height: 44px; box-sizing: border-box; }
  .lct-linha button { min-height: 44px; }
  .lct-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; margin: 8px 0; font-size: 12.5px; }
  .lct-dl div { min-width: 0; }
  .lct-dl span { display: block; color: var(--muted); font-weight: 700; font-size: 11.5px; }
  .lct-dl b { font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .lct-duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .lct-aceite { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; cursor: pointer; }
  .lct-aceite input { width: 20px; height: 20px; }
  .lct-lista { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
  .lct-lista li { padding: 5px 0; border-top: 1px dashed var(--border); overflow-wrap: anywhere; }
  .lct-det summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
  @media (max-width: 900px) { .lct-acoes .btn-primary, .lct-acoes .btn-secondary { flex: 1 1 140px; } }
</style>
<script>
  var LICCT = { aba: {}, lista: null, filtro: { busca: "", situacao: "" }, form: {} };

  function LicCt_curto_(h) { return '<span class="lic-hash" title="' + Lic_esc_(h) + '">' + Lic_esc_(String(h || "").slice(0, 12)) + (h ? "…" : "—") + "</span>"; }

  function LicCt_qtd_(v) { var n = Number(v) || 0; return n.toLocaleString("pt-BR", { maximumFractionDigits: 4 }); }

  }

      '<div><label for="lctSit">Situação</label><select id="lctSit">' + LICCT_SIT_FILTRO.map(function (x) { return '<option value="' + x[0] + '"' + (LICCT.filtro.situacao === x[0] ? " selected" : "") + ">" + Lic_esc_(x[1]) + "</option>"; }).join("") + "</select></div>" +
      '<div class="lic-acoes-linha lct-acoes" style="align-self:end"><button type="button" class="btn-secondary" data-lct-filtrar>Filtrar</button></div></div></div>';
    h += '<div class="cm-caixa"><h3>Contratos (' + Lic_esc_((r.contratos || []).length) + " de " + Lic_esc_(r.total || 0) + ")</h3>" + ((r.contratos || []).length ? Lic_tabelaHtml_(["Contrato", "Órgão", "Vigência", "Situação", "Valor", "Vínculos", ""], r.contratos.map(function (x) {

        Lic_esc_(LicCt_dia_(x.inicio) + " a " + LicCt_dia_(x.fim)), LicCt_selo_(x.situacao.cor, x.situacao.nome) + (x.integra ? "" : " " + LicCt_selo_("vermelho", "alterado fora do SGO+")), Lic_esc_(Lic_brl_(x.valor)),
        Lic_esc_((x.cliente ? "Cliente: " + x.cliente : "sem cliente") + (x.comercial ? " · Comercial " + x.comercial : "")), '<button type="button" class="btn-secondary" data-lct-ficha="' + Lic_esc_(x.opId) + '">Abrir o contrato</button>'];
    })) : '<p class="cm-vazio">Nenhum contrato ' + (r.total ? "com este filtro" : "registrado ainda") + '. O contrato nasce na ficha da licitação, aba Contrato, depois do resultado.</p>') + "</div>";
    h += '<div class="cm-caixa"><h3>Resultados prontos para virar contrato</h3><p class="cm-meta">Licitações em Resultado, sem contrato registrado.</p>' + ((r.prontos || []).length ? Lic_tabelaHtml_(["Licitação", "Órgão", "Itens ganhos", "Total", "Situação", ""], r.prontos.map(function (x) {
      return ['<span class="lic-mono">' + Lic_esc_(x.codigo) + "</span>", Lic_esc_(x.orgao) + " · " + Lic_esc_(x.uf), Lic_esc_(x.itens), Lic_esc_(Lic_brl_(x.total)), x.pronto ? LicCt_selo_("verde", "pronto") : LicCt_selo_("laranja", "falta algo") + '<br><span class="cm-meta">' + Lic_esc_(x.porque) + "</span>",
        '<button type="button" class="btn-secondary" data-lct-ficha="' + Lic_esc_(x.opId) + '">Registrar o contrato</button>'];
    })) : '<p class="cm-vazio">Nenhum resultado esperando contrato.</p>') + "</div>";
    return h;
  }
  function LicCt_ligarLista_(c) {
    c.querySelectorAll("[data-lct-ficha]").forEach(function (b) { b.onclick = function () { Lic_irFicha_(b.getAttribute("data-lct-ficha"), "contrato"); }; });
    var f = c.querySelector("[data-lct-filtrar]"); if (f) f.onclick = function () { LICCT.filtro = { busca: LicCt_valor_("lctBusca"), situacao: LicCt_valor_("lctSit") }; LicCt_renderLista_(); };
  }

  // ================= aba "Contrato" da ficha =================

  function LicCt_ligarAba_(c, d, id) {

  }
  function LicCt_desenhar_(id) {
    var el = Lic_$_("licContrato"), t = LICCT.aba[id]; if (!el || !t) return;
    el.innerHTML = LicCt_htmlAbaDados_(t);
    LicCt_ligarDados_(el, t, id);
  }
  function LicCt_htmlAbaDados_(t) { return Lic_faixa_(t.aviso || "", "aviso") + (t.contrato ? LicCt_htmlContrato_(t) : LicCt_htmlPrevia_(t)); }

    var gar = '<option value="">Sem garantia</option>' + Object.keys(t.garantias || {}).map(function (k) { return '<option value="' + k + '"' + (d.garantiaTipo === k ? " selected" : "") + ">" + Lic_esc_(t.garantias[k]) + "</option>"; }).join("");
    var tipos = Object.keys(t.tipos || {}).map(function (k) { return '<option value="' + k + '"' + ((d.tipo || "CONTRATO") === k ? " selected" : "") + ">" + Lic_esc_(t.tipos[k]) + "</option>"; }).join("");
    LICCT.form[pre] = { itens: (d.itens || []).map(function (i) { return Object.assign({}, i); }), entregas: (d.entregas || []).map(function (e) { return Object.assign({}, e); }), obrigacoes: (d.obrigacoes || []).map(function (e) { return Object.assign({}, e); }), itensEditaveis: !!o.itensEditaveis };

      '<fieldset><legend>Reajuste (se o edital disser)</legend><div class="lct-grade"><div><label for="' + pre + 'RjI">Índice</label><input id="' + pre + 'RjI" maxlength="80" value="' + Lic_esc_(d.reajusteIndice || "") + '" placeholder="Ex.: IPCA"></div>' +

      '<fieldset><legend>Renovação</legend><div class="lct-grade"><div><label class="lct-aceite"><input type="checkbox" id="' + pre + 'RnP"' + (d.renovacaoPrevista ? " checked" : "") + '> <span>Renovação prevista</span></label></div>' +
      '<div><label for="' + pre + 'RnD">Decidir até (vazio: 60 dias antes do fim)</label><input id="' + pre + 'RnD" type="date" value="' + Lic_esc_(d.renovacaoDecidirAte || "") + '"></div></div></fieldset>' +
      '<fieldset><legend>Entregas (prazo e valor para a previsão de faturamento)</legend><div id="' + pre + 'Ent"></div><div class="lic-acoes-linha"><button type="button" class="btn-secondary" data-lct-add="entregas" data-lct-pre="' + pre + '">Adicionar entrega</button></div></fieldset>' +
      '<fieldset><legend>Obrigações</legend><div id="' + pre + 'Obr"></div><div class="lic-acoes-linha"><button type="button" class="btn-secondary" data-lct-add="obrigacoes" data-lct-pre="' + pre + '">Adicionar obrigação</button></div></fieldset>' +

  }
  function LicCt_linhasHtml_(pre, lista) {
    var f = LICCT.form[pre]; if (!f) return "";
    if (lista === "itens") return f.itens.length ? f.itens.map(function (i, n) {
      if (!f.itensEditaveis) return '<div class="lct-linha"><div><b>Item ' + Lic_esc_(i.item) + "</b> · " + Lic_esc_(i.codigo || "") + " " + Lic_esc_(i.nome || i.descricao || "") + '</div><div><label for="' + pre + "iQ" + n + '">Quantidade</label><input id="' + pre + "iQ" + n + '" inputmode="decimal" value="' + Lic_esc_(LicCt_num_(i.quantidade)) + '"></div><div><span class="cm-meta">Valor unitário homologado</span><br><b>' + Lic_esc_(Lic_brl_(i.valorUnit)) + "</b></div></div>";
      return '<div class="lct-linha"><div><label for="' + pre + "iN" + n + '">Item</label><input id="' + pre + "iN" + n + '" maxlength="20" value="' + Lic_esc_(i.item || "") + '"></div><div><label for="' + pre + "iC" + n + '">Código</label><input id="' + pre + "iC" + n + '" maxlength="20" value="' + Lic_esc_(i.codigo || "") + '" placeholder="CAL-001"></div>' +

    }).join("") : '<p class="cm-vazio">Nenhum item. Toque em "Adicionar item".</p>';

    return arr.length ? arr.map(function (e, n) {

  }

      campo("COMPLEMENTO", "Complemento", "") + campo("BAIRRO", "Bairro", "") + campo("CIDADE", "Cidade", s.CIDADE) + campo("UF", "UF", s.UF) + campo("CONTATO", "Contato (gestor ou fiscal do contrato)", "") + campo("EMAIL", "E-mail", "") + campo("TELEFONE", "Telefone", "") +
      '<div class="lct-largo"><label class="lct-aceite"><input type="checkbox" id="lctClCiente"> <span>' + Lic_esc_(cl.ciente) + "</span></label></div></div>" + '<div id="lctClMsg" aria-live="assertive"></div>';
    var ov = Lic_janela_("Cadastrar o órgão como cliente", corpo, '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lct-ok>Cadastrar e vincular</button>', origem);
    ov.querySelector("[data-lct-ok]").onclick = function () {
      var bt = this, c = {};
      ["RAZAO_SOCIAL", "NOME_FANTASIA", "CEP", "LOGRADOURO", "NUMERO", "COMPLEMENTO", "BAIRRO", "CIDADE", "UF", "CONTATO", "EMAIL", "TELEFONE"].forEach(function (k) { c[k] = LicCt_valor_("lctCl" + k); });
      c.CIENTE = LicCt_marcado_("lctClCiente");
      bt.disabled = true;
      LicCt_chamar_("clienteCriar", { id: id, cliente: c }, function (r) {
        if (!r.criado) { bt.disabled = false; Lic_$_("lctClMsg").innerHTML = Lic_faixa_(Lic_esc_(r.texto) + ((r.faltam || []).length ? "<ul class=\"lct-lista\">" + r.faltam.map(function (f) { return "<li>" + Lic_esc_(f.texto) + "</li>"; }).join("") + "</ul>" : ""), "erro", true); return; }
        ov.fechar(); Lic_toast_(r.texto); LicCt_ligarAba_(null, null, id);
      }, function (m) { bt.disabled = false; Lic_$_("lctClMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };
  }
  function LicCt_janelaExecucao_(id, t, area, origem) {
    var ex = t.integracao.execucao, g = (ex.grupos || []).filter(function (x) { return x.area === area; })[0] || {};
    var corpo = '<p class="cm-txt">Lança em Minhas atividades a atividade de planejamento de <b>' + Lic_esc_(g.nome) + "</b> (" + Lic_esc_(g.onde) + "), com os itens, as quantidades e as entregas, sem valores. Nenhuma O.S., chamado ou requisição é criado.</p>" +
      '<div class="lct-grade"><div><label for="lctExResp">Quem planeja</label><select id="lctExResp"><option value="">Escolha</option>' + (ex.usuarios || []).map(function (u) { return '<option value="' + Lic_esc_(u.id) + '">' + Lic_esc_(u.nome) + "</option>"; }).join("") + "</select></div>" +
      '<div><label for="lctExPrazo">Prazo (vazio: o início do contrato)</label><input id="lctExPrazo" type="date"></div><div class="lct-largo"><label for="lctExObs">Observação</label><textarea id="lctExObs" rows="2" maxlength="800"></textarea></div></div><div id="lctExMsg" aria-live="assertive"></div>';
    var ov = Lic_janela_("Planejar a execução", corpo, '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lct-ok>Criar o planejamento</button>', origem);
    ov.querySelector("[data-lct-ok]").onclick = function () {
      var bt = this; bt.disabled = true;
      LicCt_chamar_("execucao", { id: id, area: area, responsavelId: LicCt_valor_("lctExResp"), prazo: LicCt_valor_("lctExPrazo"), obs: LicCt_valor_("lctExObs"), confirmar: true }, function (r) { ov.fechar(); Lic_toast_(r.texto); LicCt_ligarAba_(null, null, id); },
        function (m) { bt.disabled = false; Lic_$_("lctExMsg").innerHTML = Lic_faixa_(m, "erro"); });
    };
  }
  function LicCt_janelaVersao_(id, origem) {
    var t = LICCT.aba[id], m = t.contrato;
    // contrato encerrado: só correção e, para o Administrador, a reabertura (com motivo e fonte); o servidor confere de novo
    var tipos = (m.situacao === "VIGENTE" ? ["CORRECAO", "ADITIVO", "APOSTILAMENTO", "ENCERRAMENTO"] : ["CORRECAO"].concat(t.eu && t.eu.perfil === "ADMIN" ? ["REABERTURA"] : [])).map(function (k) { return '<option value="' + k + '">' + Lic_esc_(t.versoesTipos[k]) + "</option>"; }).join("");
    var corpo = '<div class="lct-grade"><div><label for="lctVTipo">Tipo da versão</label><select id="lctVTipo">' + tipos + '</select></div><div><label for="lctVAd">Número do aditivo</label><input id="lctVAd" maxlength="40" placeholder="Ex.: 1º termo aditivo"></div>' +
      '<div><label for="lctVSit">Encerramento</label><select id="lctVSit"><option value="">—</option><option value="ENCERRADO">Encerrado (cumprido)</option><option value="RESCINDIDO">Rescindido</option></select></div>' +
      '<div class="lct-largo"><label for="lctVFonte">Fonte (aditivo, apostilamento, encerramento e reabertura)</label><input id="lctVFonte" maxlength="300" placeholder="Ex.: termo aditivo publicado no PNCP em 10/03/2027"></div></div>' +
      LicCt_formHtml_("lctV", m.dados, t, { itensEditaveis: true, manual: true }) +
      '<div class="lct-grade"><div class="lct-largo"><label for="lctVArq">Arquivo (termo aditivo ou contrato assinado, opcional)</label><input id="lctVArq" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/*"></div>' +
      '<div class="lct-largo"><label for="lctVMot">Motivo (obrigatório)</label><textarea id="lctVMot" rows="2" maxlength="1000"></textarea></div></div><p class="cm-ajuda-campo">Só o que mudou entra na versão nova; a anterior fica no histórico. Nada é apagado.</p><div id="lctVMsg" aria-live="assertive"></div>';
    var ov = Lic_janela_("Nova versão do contrato " + m.numeroContrato, corpo, '<button type="button" class="btn-secondary" data-lic-cancelar>Cancelar</button><button type="button" class="btn-primary" data-lct-ok>Gravar a versão</button>', origem);
    LicCt_ligarForm_(ov, "lctV");
    ov.querySelector("[data-lct-ok]").onclick = function () {
      var bt = this, msg = Lic_$_("lctVMsg"), tipo = LicCt_valor_("lctVTipo"), mot = LicCt_valor_("lctVMot");
      if (mot.trim().length < 10) { msg.innerHTML = Lic_faixa_("Escreva o motivo com pelo menos 10 letras. Nada foi gravado.", "erro"); return; }
      var campos = tipo === "ENCERRAMENTO" ? { situacao: LicCt_valor_("lctVSit") } : tipo === "REABERTURA" ? {} : LicCt_lerForm_("lctV");
      // apostilamento: só o reajuste (valores dos itens, índice e data-base); o resto é termo aditivo (o servidor confere)
      if (tipo === "APOSTILAMENTO") campos = { itens: campos.itens, reajusteIndice: campos.reajusteIndice, reajusteDataBase: campos.reajusteDataBase, reajusteFonte: campos.reajusteFonte, obs: campos.obs };
      LicCt_arquivo_("lctVArq", msg, function (arquivo) {
        bt.disabled = true;
        LicCt_chamar_("versao", { id: id, tipo: tipo, aditivoNumero: LicCt_valor_("lctVAd"), fonte: LicCt_valor_("lctVFonte"), motivo: mot, campos: campos, arquivo: arquivo }, function (r) { ov.fechar(); Lic_toast_(r.texto || "Versão gravada.", r.avisos && r.avisos.length ? "erro" : "ok"); LicCt_ligarAba_(null, null, id); },
          function (e) { bt.disabled = false; msg.innerHTML = Lic_faixa_(e, "erro"); }, { carregando: arquivo ? "Guardando o arquivo e calculando o SHA-256…" : "" });
      });
    };
  }
  /** Abrir (nova aba, aberta no toque) ou baixar o arquivo de uma versão. O servidor confere o SHA-256 antes de entregar. */
  function LicCt_abrirArquivo_(id, versaoId, baixar) {
    var janela = null;
    if (!baixar) { try { janela = window.open("", "_blank"); if (janela && janela.document) janela.document.title = "Abrindo o contrato…"; } catch (e) { janela = null; } }
    LicCt_chamar_("arquivo", { id: id, versaoId: versaoId || "", baixar: !!baixar }, function (r) {
      var bin = atob(r.base64 || ""), u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var seguro = !r.forcarBaixar;
      if (!seguro) { baixar = true; if (janela) { try { janela.close(); } catch (e) {} janela = null; } }
      var url = URL.createObjectURL(new Blob([u8], { type: seguro ? r.tipo : "application/octet-stream" }));
      if (janela && !baixar) janela.location.href = url;
      else { var a = document.createElement("a"); a.href = url; a.download = r.nome || "contrato"; document.body.appendChild(a); a.click(); try { a.remove(); } catch (e) {} }
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 120000);
      Lic_toast_((baixar ? "Baixado: " : "Aberto: ") + (r.nome || "contrato") + " (SHA-256 conferido no servidor).");
    }, function (m) { if (janela) { try { janela.close(); } catch (e) {} } Lic_toast_(m, "erro"); }, { carregando: "Buscando o arquivo no servidor…" });
  }
  function LicCt_relatorio_(id, bt) {
    var abrir = typeof LicPp_abrirJanela_ === "function" ? LicPp_abrirJanela_ : function () { return null; };
    var j = abrir("Gerando o relatório do contrato…");
    bt.disabled = true;
    LicCt_chamar_("relatorio", { id: id }, function (r) { bt.disabled = false; if (typeof LicPp_escreverJanela_ === "function") LicPp_escreverJanela_(j, r.html); Lic_toast_(r.texto || "Relatório gerado."); },
      function (m) { bt.disabled = false; if (typeof LicPp_fecharJanela_ === "function") LicPp_fecharJanela_(j); Lic_toast_(m, "erro"); }, { carregando: "Gerando e guardando o relatório…" });
  }
</script>

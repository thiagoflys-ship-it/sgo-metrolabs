<!--
  Fluxo integrado cliente → unidade → equipamento → qualificação (20/10/2026) — componentes de tela comuns.
   - SGO_QVinc.montar(el, opcoes): escolha do cliente, da unidade e do equipamento a partir do cadastro, com atalhos
     para cadastrar o que faltar (abre o cadastro em outra aba e a tela atual continua como está; ao voltar,
     "Atualizar listas"). Usado pelo Relatório oficial e pela aba "Gerar relatório" da Autoclave.
   - SGO_QVinc.htmlQualificacoes(res, opcoes): lista de qualificações do equipamento (ficha do equipamento e QR code).
   - SGO_QVinc.abrirDocumento(equipamentoId, ref, via): abre um documento da lista (com trilha de acesso no servidor).
  Servidor: SGO_QualifEquipamento.js e AutoOficial_apiDispatch (SGO_AutoRel_ModeloOficialNovo.js).
-->
<style>
  .qvinc { border: 1px solid var(--border); border-radius: var(--radius, 8px); padding: 14px; background: var(--bc-surface, #fff); margin-bottom: 14px; min-width: 0; }
  .qvinc h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  .qvinc .qvinc-sub { margin: 0 0 10px; font-size: 12.5px; color: var(--bc-text-3); line-height: 1.5; }
  .qvinc .qvinc-linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .qvinc .qvinc-campo { flex: 1 1 220px; min-width: 0; }
  .qvinc .qvinc-campo label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
  .qvinc input, .qvinc select { width: 100%; min-height: 42px; padding: 9px 10px; border-radius: var(--radius-sm, 6px); font-size: 14px; }
  .qvinc .qvinc-btn { min-height: 42px; padding: 9px 14px; border-radius: var(--radius-sm, 6px); font-weight: 700; font-size: 13px; cursor: pointer; }
  .qvinc .qvinc-atalhos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .qvinc .qvinc-atalhos button { font-size: 12.5px; padding: 7px 10px; min-height: 36px; }
  .qvinc .qvinc-msg { font-size: 12.5px; line-height: 1.5; padding: 9px 11px; border-radius: 6px; margin: 6px 0 8px; display: none; }
  .qvinc .qvinc-msg.mostrar { display: block; }
  .qvinc .qvinc-msg.aviso { background: var(--bc-warn-bg); color: var(--bc-warn); border: 1px solid var(--bc-warn-line); }
  .qvinc .qvinc-msg.info { background: var(--bc-info-bg); color: var(--bc-text-2); border: 1px solid var(--bc-info-line); }
  .qvinc .qvinc-msg.erro { background: var(--bc-danger-bg); color: var(--bc-danger); border: 1px solid var(--bc-danger-line); }
  .qvinc .qvinc-cartao { display: none; border-left: 3px solid var(--bc-action-line, #2a7); background: var(--bc-action-bg, #f2f8f4); padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.55; }
  .qvinc .qvinc-cartao.mostrar { display: block; }
  .qvinc .qvinc-cartao b { font-weight: 700; }
  /* 21/10/2026: falta no cadastro do equipamento (preencher ali mesmo, só o que está vazio). */
  .qvinc .qvinc-falta { margin-top: 10px; border: 1px solid var(--bc-warn-line); background: var(--bc-warn-bg); color: var(--bc-text-1, inherit); border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  .qvinc .qvinc-falta > b { color: var(--bc-warn); display: block; margin-bottom: 4px; }
  .qvinc .qvinc-falta .qvinc-linha { margin: 8px 0 6px; }
  .qvinc .qvinc-falta .qvinc-sug { display: block; font-size: 12px; color: var(--bc-text-3); margin-top: 3px; }
  /* 21/10/2026: campos "do cadastro" nas seções do ensaio: aparência de somente leitura e explicação ao clicar (nunca o círculo de bloqueio). */
  .qvinc-selo { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--bc-text-3); background: var(--bc-info-bg, #eef2f6); border: 1px solid var(--bc-info-line, #d5dde6); vertical-align: middle; }
  .qvinc-nota-cad { margin-top: 6px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.5; background: var(--bc-info-bg, #eef2f6); border: 1px solid var(--bc-info-line, #d5dde6); color: var(--bc-text-2, inherit); }
  .qvinc-nota-cad button, .qvinc-sem-equip button { margin-top: 6px; min-height: 36px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .qvinc-sem-equip { margin: 0 0 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; background: var(--bc-warn-bg, #fff7e6); border: 1px solid var(--bc-warn-line, #f0d9a8); color: var(--bc-text-1, inherit); }
  .qvinc-sem-equip b { display: block; margin-bottom: 2px; }
  .qualif-lista { list-style: none; margin: 0; padding: 0; }
  .qualif-lista li { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .qualif-lista li.substituido { opacity: .72; }
  .qualif-lista .qualif-txt { flex: 1 1 240px; min-width: 0; font-size: 13px; line-height: 1.5; }
  .qualif-lista .qualif-txt small { display: block; color: var(--bc-text-3); }
  .qualif-situacao { padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13.5px; font-weight: 700; }
  .qualif-situacao.QUALIFICADO { background: var(--bc-action-bg, #eef7f0); color: var(--bc-ok, #1d6b3f); border: 1px solid var(--bc-action-line, #9fd3b0); }
  .qualif-situacao.VENCENDO { background: var(--bc-warn-bg); color: var(--bc-warn); border: 1px solid var(--bc-warn-line); }
  .qualif-situacao.VENCIDO, .qualif-situacao.REPROVADO { background: var(--bc-danger-bg); color: var(--bc-danger); border: 1px solid var(--bc-danger-line); }
  .qualif-situacao.SEM_QUALIFICACAO { background: var(--bc-info-bg); color: var(--bc-text-2); border: 1px solid var(--bc-info-line); }
  @media (max-width: 768px) { .qvinc .qvinc-btn { width: 100%; } .qvinc .qvinc-campo { flex-basis: 100%; } }
</style>
<script>
  var SGO_QVinc = (function () {
    function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

    function chamarOficial(fn, payload, ok, erro) {
      google.script.run
        .withSuccessHandler(function (r) { if (r && r.ok) ok(r); else erro((r && r.erro) || "O servidor não confirmou a operação. Tente de novo."); })
        .withFailureHandler(function (e) { erro("Não foi possível falar com o servidor (" + String(e && e.message ? e.message : e).replace(/[.\s]+$/, "") + "). Confira a conexão e tente de novo."); })
        .AutoOficial_apiDispatch({ sessionId: SGO_getSessionId(), fn: fn, payload: payload || {} });
    }

    /** Abre o cadastro numa aba nova do SGO+ (a tela atual continua como está). */
    function abrirCadastro(tela) {
      var base = String(window.location.href || "").replace(/[?#].*$/, "");
      try { window.open(base + "?tela=" + encodeURIComponent(tela), "_blank"); } catch (e) { try { abrir(tela); } catch (e2) {} }
    }

    /**
     * opcoes: { prefixo, titulo, subtitulo, valor:{clienteId, unidadeId, equipamentoId, cliente}, aoMudar(ident|null), somenteLeitura }
     * Devolve { valor(), recarregar() }.
     */
    function montar(el, opcoes) {
      opcoes = opcoes || {};
      var px = opcoes.prefixo || "qv";
      // 21/10/2026: cada módulo pode usar o próprio roteador (ex.: Estufa, com o filtro do tipo de equipamento dele).
      var chamar = typeof opcoes.chamar === "function" ? opcoes.chamar : chamarOficial;
      var st = { clientes: [], unidades: [], equipamentos: [], v: Object.assign({ clienteId: "", unidadeId: "", equipamentoId: "", cliente: "" }, opcoes.valor || {}), ident: null };
      function $(s) { return el.querySelector("#" + px + s); }
      el.innerHTML = '<div class="qvinc">' +
        '<h3>' + esc(opcoes.titulo || "Cliente e equipamento") + '</h3>' +
        '<p class="qvinc-sub">' + esc(opcoes.subtitulo || "O ensaio começa pelo cadastro: escolha o cliente, a unidade e o equipamento. Os dados de identificação vêm do cadastro, sem digitar de novo.") + '</p>' +
        '<div class="qvinc-linha"><div class="qvinc-campo"><label for="' + px + 'Busca">Buscar cliente (nome ou CNPJ)</label><input id="' + px + 'Busca" type="text" autocomplete="off" placeholder="Digite ao menos 2 letras ou 3 números"></div>' +
        '<button type="button" class="btn-secondary qvinc-btn" id="' + px + 'BtnBuscar">Buscar cliente</button></div>' +
        '<div class="qvinc-linha"><div class="qvinc-campo"><label for="' + px + 'Cliente">Cliente</label><select id="' + px + 'Cliente"><option value="">Busque o cliente acima</option></select></div>' +
        '<div class="qvinc-campo"><label for="' + px + 'Unidade">Unidade</label><select id="' + px + 'Unidade"><option value="">Escolha o cliente primeiro</option></select></div>' +
        '<div class="qvinc-campo"><label for="' + px + 'Equip">Equipamento (TAG — tipo — nº de série)</label><select id="' + px + 'Equip"><option value="">Escolha a unidade primeiro</option></select></div></div>' +
        '<div class="qvinc-msg" id="' + px + 'Msg"></div>' +
        '<div class="qvinc-cartao" id="' + px + 'Cartao"></div>' +
        '<div class="qvinc-atalhos"><span style="font-size:12px;color:var(--bc-text-3);align-self:center">Falta no cadastro?</span>' +
        '<button type="button" class="btn-secondary" data-tela="clientes">Cadastrar cliente</button>' +
        '<button type="button" class="btn-secondary" data-tela="unidades">Cadastrar unidade</button>' +
        '<button type="button" class="btn-secondary" data-tela="equipamentos">Cadastrar equipamento</button>' +
        '<button type="button" class="btn-secondary" id="' + px + 'BtnAtualizar">Atualizar listas</button></div></div>';

      function msg(tipo, texto) { var m = $("Msg"); if (!m) return; m.className = "qvinc-msg" + (texto ? " mostrar " + tipo : ""); m.textContent = texto || ""; }
      function avisar() { if (typeof opcoes.aoMudar === "function") { try { opcoes.aoMudar(st.ident ? Object.assign({}, st.ident) : null); } catch (e) { console.error(e); } } if (!opcoes.somenteLeitura && typeof atualizarCamposCadastro === "function") atualizarCamposCadastro(); }
      function desenharSelect(sel, itens, vazio, rotulo, atual) {
        sel.innerHTML = '<option value="">' + esc(vazio) + '</option>' + itens.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === atual ? " selected" : "") + '>' + esc(rotulo(x)) + '</option>'; }).join("");
      }
      function cartao() {
        var c = $("Cartao"); if (!c) return;
        var i = st.ident;
        if (!i) { c.className = "qvinc-cartao"; c.innerHTML = ""; return; }
        c.className = "qvinc-cartao mostrar";
        var extras = [i.patrimonio ? "patrimônio " + i.patrimonio : "", i.capacidade ? "capacidade " + i.capacidade : "", i.numCamaras ? i.numCamaras + " câmara(s)/porta(s)" : "", i.anoFabricacao ? "fabricado em " + i.anoFabricacao : ""].filter(Boolean);
        c.innerHTML = "<b>" + esc(i.cliente) + "</b>" + (i.cnpj ? " — CNPJ " + esc(i.cnpj) : "") + "<br>" + esc(i.unidade) + (i.setor ? " · " + esc(i.setor) : "") +
          "<br>Equipamento: <b>" + esc(i.tag || "sem TAG") + "</b> · " + esc(i.tipo) + (i.numeroSerie ? " · nº de série " + esc(i.numeroSerie) : "") +
          (extras.length ? "<br>" + esc(extras.join(" · ")) : "") +
          (i.tipoCompativel === false ? '<br><span style="color:var(--bc-warn)">' + esc(opcoes.textoTipoIncompativel || "O tipo cadastrado não é de autoclave: confira se escolheu o equipamento certo.") + '</span>' : "") +
          htmlFalta(i);
        ligarFalta();
      }
      // 21/10/2026: campo que o documento usa e está vazio no cadastro: aviso com o preenchimento ali mesmo
      // (grava no cadastro do equipamento, só o que está vazio; trocar valor já gravado continua em Cadastros).
      var DICAS_FALTA = { TAG: "Código da etiqueta (ex.: AUT-01)", SERIE: "Como está na placa do equipamento", SETOR: "Setor onde está instalado (ex.: CME)" };
      function htmlFalta(i) {
        var faltam = i.faltam || [];
        if (!faltam.length) return "";
        var titulo = "Falta no cadastro do equipamento: " + faltam.map(function (f) { return f.rotulo; }).join(", ") + ".";
        if (opcoes.somenteLeitura) return '<div class="qvinc-falta" id="' + px + 'Falta"><b>' + esc(titulo) + "</b>O relatório usa esses dados. Peça à equipe técnica para completar em Cadastros › Equipamentos.</div>";
        return '<div class="qvinc-falta" id="' + px + 'Falta"><b>' + esc(titulo) + "</b>" +
          "O relatório usa esses dados. Preencha aqui e clique em \"Gravar no cadastro\": grava no cadastro do equipamento (só o que está vazio) e o ensaio continua daqui. Para trocar um valor já gravado, use Cadastros › Equipamentos › Editar." +
          '<div class="qvinc-linha">' + faltam.map(function (f) {
            return '<div class="qvinc-campo"><label for="' + px + "F_" + esc(f.campo) + '">' + esc(f.rotulo) + '</label><input id="' + px + "F_" + esc(f.campo) + '" data-campo-cadastro="' + esc(f.campo) + '" type="text" maxlength="120" autocomplete="off" placeholder="' + esc(DICAS_FALTA[f.campo] || "") + '"><span class="qvinc-sug" id="' + px + "S_" + esc(f.campo) + '"></span></div>';
          }).join("") + "</div>" +
          '<div class="qvinc-atalhos"><button type="button" class="btn-primary qvinc-btn" id="' + px + 'BtnGravarCad">Gravar no cadastro</button>' +
          '<button type="button" class="btn-secondary qvinc-btn" id="' + px + 'BtnSugestoes">Buscar nos ensaios anteriores</button></div>' +
          '<div class="qvinc-msg" id="' + px + 'MsgCad"></div></div>';
      }
      function msgCad(tipo, texto) { var m = $("MsgCad"); if (!m) return; m.className = "qvinc-msg" + (texto ? " mostrar " + tipo : ""); m.textContent = texto || ""; }
      function ligarFalta() {
        var bG = $("BtnGravarCad"), bS = $("BtnSugestoes");
        if (bG) bG.onclick = gravarCadastro;
        if (bS) bS.onclick = buscarSugestoes;
      }
      function gravarCadastro() {
        if (!st.ident) return;
        var campos = {}, n = 0;
        Array.prototype.forEach.call(el.querySelectorAll("[data-campo-cadastro]"), function (inp) { var v = String(inp.value || "").trim(); if (v) { campos[inp.getAttribute("data-campo-cadastro")] = v; n++; } });
        if (!n) { msgCad("aviso", "Preencha ao menos um dos campos acima (pela placa ou pela etiqueta do equipamento) e clique em \"Gravar no cadastro\"."); return; }
        var b = $("BtnGravarCad"); if (b) b.disabled = true;
        msgCad("info", "Gravando no cadastro do equipamento…");
        chamar("apiPreencherCadastro", { clienteId: st.v.clienteId, unidadeId: st.v.unidadeId, equipamentoId: st.v.equipamentoId, campos: campos, origem: "tela " + (opcoes.titulo || "do ensaio") }, function (r) {
          var compat = st.ident ? st.ident.tipoCompativel : undefined;
          st.ident = Object.assign({}, r.identificacao || st.ident, { tipoCompativel: compat });
          var sel = $("Equip");
          if (sel && sel.selectedIndex >= 0 && st.ident) { var op = sel.options[sel.selectedIndex]; if (op && op.value === st.v.equipamentoId) op.text = [st.ident.tag || "sem TAG", st.ident.tipo, st.ident.numeroSerie].filter(Boolean).join(" — "); }
          cartao(); avisar();
          msg(r.gravados ? "info" : "aviso", r.mensagem || "Cadastro atualizado.");
        }, function (e) { if (b) b.disabled = false; msgCad("erro", e); });
      }
      function buscarSugestoes() {
        if (!st.ident) return;
        msgCad("info", "Procurando nos ensaios anteriores deste equipamento…");
        chamar("apiSugestoesCadastro", { clienteId: st.v.clienteId, unidadeId: st.v.unidadeId, equipamentoId: st.v.equipamentoId }, function (r) {
          var sug = r.sugestoes || {}, achou = 0;
          Array.prototype.forEach.call(el.querySelectorAll("[data-campo-cadastro]"), function (inp) {
            var k = inp.getAttribute("data-campo-cadastro"), lista = sug[k] || [], info = $("S_" + k);
            if (!lista.length) { if (info) info.textContent = ""; return; }
            achou++;
            if (!String(inp.value || "").trim()) inp.value = lista[0].valor;
            if (info) info.textContent = "Encontrado em " + lista.map(function (x) { return x.valor + " (" + x.origem + ")"; }).slice(0, 3).join("; ") + (lista.length > 1 ? ". Confira qual é o certo." : ".");
          });
          msgCad(achou ? "info" : "aviso", achou ? "Valores dos ensaios anteriores colocados nos campos. Confira com a placa ou a etiqueta e clique em \"Gravar no cadastro\" (só grava o que está vazio no cadastro)." : "Nenhum ensaio anterior deste equipamento tem esses dados. Preencha pela placa ou pela etiqueta do equipamento.");
        }, function (e) { msgCad("erro", e); });
      }
      function buscar() {
        var t = ($("Busca").value || "").trim();
        if (t.replace(/\D/g, "").length < 3 && t.length < 2) { msg("aviso", "Digite ao menos 2 letras do nome ou 3 números do CNPJ do cliente."); return; }
        msg("info", "Buscando…");
        chamar("apiPesquisarClientes", { termo: t }, function (r) {
          st.clientes = r.items || [];
          desenharSelect($("Cliente"), st.clientes, st.clientes.length ? "Escolha o cliente" : "Nenhum cliente encontrado", function (c) { return c.nome + (c.cnpj ? " — " + c.cnpj : ""); }, st.v.clienteId);
          msg(st.clientes.length ? "info" : "aviso", st.clientes.length ? "Escolha o cliente na lista." : 'Nenhum cliente ativo encontrado com "' + t + '". Confira a grafia ou cadastre em "Cadastrar cliente" (abre em outra aba) e depois clique em "Atualizar listas".');
          if (st.clientes.length === 1 && !st.v.clienteId) { $("Cliente").value = st.clientes[0].id; escolherCliente(st.clientes[0].id); }
        }, function (e) { msg("erro", e); });
      }
      function escolherCliente(id) {
        var c = st.clientes.filter(function (x) { return x.id === id; })[0];
        st.v = { clienteId: id || "", unidadeId: "", equipamentoId: "", cliente: c ? c.razao : "" };
        st.ident = null; st.unidades = []; st.equipamentos = []; cartao(); avisar();
        desenharSelect($("Equip"), [], "Escolha a unidade primeiro", function () { return ""; }, "");
        if (!id) { desenharSelect($("Unidade"), [], "Escolha o cliente primeiro", function () { return ""; }, ""); return; }
        carregarUnidades();
      }
      function carregarUnidades(depois) {
        chamar("apiListarUnidades", { clienteId: st.v.clienteId }, function (r) {
          st.unidades = r.items || [];
          desenharSelect($("Unidade"), st.unidades, st.unidades.length ? "Escolha a unidade" : "Este cliente não tem unidade ativa", function (u) { return u.nome; }, st.v.unidadeId);
          if (!st.unidades.length) msg("aviso", 'Este cliente não tem unidade ativa. Cadastre em "Cadastrar unidade" (abre em outra aba) e depois clique em "Atualizar listas".');
          else msg("", "");
          if (st.unidades.length === 1 && !st.v.unidadeId) { $("Unidade").value = st.unidades[0].id; st.v.unidadeId = st.unidades[0].id; }
          if (st.v.unidadeId) carregarEquipamentos(depois); else if (depois) depois();
        }, function (e) { msg("erro", e); });
      }
      function carregarEquipamentos(depois) {
        chamar("apiListarEquipamentos", { clienteId: st.v.clienteId, unidadeId: st.v.unidadeId }, function (r) {
          st.equipamentos = r.items || [];
          desenharSelect($("Equip"), st.equipamentos, st.equipamentos.length ? "Escolha o equipamento" : "Nenhum equipamento ativo nesta unidade", function (q) { return [q.tag || "sem TAG", q.tipo, q.serie].filter(Boolean).join(" — ") + (q.compativel ? "" : " (outro tipo)"); }, st.v.equipamentoId);
          if (!st.equipamentos.length) msg("aviso", 'Nenhum equipamento ativo nesta unidade. Cadastre em "Cadastrar equipamento" (abre em outra aba) e depois clique em "Atualizar listas".');
          if (st.v.equipamentoId) identificar(); else if (depois) depois();
        }, function (e) { msg("erro", e); });
      }
      function identificar() {
        if (!st.v.equipamentoId) { st.ident = null; cartao(); avisar(); return; }
        chamar("apiIdentificacao", { clienteId: st.v.clienteId, unidadeId: st.v.unidadeId, equipamentoId: st.v.equipamentoId }, function (r) {
          st.ident = Object.assign({}, r.identificacao, { tipoCompativel: r.tipoCompativel });
          msg("", ""); cartao(); avisar();
        }, function (e) { st.ident = null; cartao(); msg("erro", e); avisar(); });
      }
      $("BtnBuscar").onclick = buscar;
      $("Busca").onkeydown = function (ev) { if (ev.key === "Enter") { ev.preventDefault(); buscar(); } };
      $("Cliente").onchange = function () { escolherCliente(this.value); };
      $("Unidade").onchange = function () { st.v.unidadeId = this.value; st.v.equipamentoId = ""; st.ident = null; cartao(); avisar(); if (this.value) carregarEquipamentos(); else desenharSelect($("Equip"), [], "Escolha a unidade primeiro", function () { return ""; }, ""); };
      $("Equip").onchange = function () { st.v.equipamentoId = this.value; identificar(); };
      $("BtnAtualizar").onclick = function () {
        if (st.v.clienteId) { msg("info", "Atualizando…"); carregarUnidades(function () { msg("info", "Listas atualizadas."); }); }
        else if (($("Busca").value || "").trim()) buscar();
        else msg("aviso", "Busque o cliente para atualizar as listas.");
      };
      Array.prototype.forEach.call(el.querySelectorAll("[data-tela]"), function (b) { b.onclick = function () { abrirCadastro(b.getAttribute("data-tela")); msg("info", 'O cadastro abriu em outra aba. Depois de salvar, volte para esta aba e clique em "Atualizar listas": o que já foi preenchido aqui continua.'); }; });
      if (opcoes.somenteLeitura) Array.prototype.forEach.call(el.querySelectorAll("input,select,button"), function (x) { x.disabled = true; });

      // ---------- Campos "do cadastro" nas outras seções da tela do ensaio (21/10/2026) ----------
      // Os campos de identificação (TAG, série, setor, cliente...) vêm do cadastro: ficam com aparência de somente leitura e,
      // ao clicar, explicam de onde vem o dado e levam ao que fazer (escolher o equipamento, preencher no cadastro ou abrir o
      // cadastro). Os demais campos da seção (dados do ensaio) continuam editáveis. Sem equipamento escolhido, a seção avisa no topo.
      var base = px.replace(/V$/, "");
      var NOMES = [
        ["Cliente", "cliente", ""], ["Cnpj", "cnpj", ""], ["Endereco", "endereco", ""],
        ["Tag", "tag", "TAG"], ["TagEquipamento", "tagEquipamento", "TAG"], ["NumSerie", "numSerie", "SERIE"], ["NumeroSerie", "numeroSerie", "SERIE"],
        ["Local", "local", "SETOR"], ["Localizacao", "localizacao", "SETOR"]
      ];
      var escopo = el.closest('[id$="Container"]') || document;
      function porId(id) { try { return escopo.querySelector("#" + id) || document.getElementById(id); } catch (e) { return document.getElementById(id); } }
      var camposCad = [];
      (opcoes.camposCadastro || []).forEach(function (c) { var x = porId(c.id); if (x) camposCad.push({ el: x, campo: c.campo || "", marca: !!c.marca }); });
      if (!opcoes.camposCadastro) {
        NOMES.forEach(function (n) {
          [base + "_ui" + n[0], base + "_" + n[1]].forEach(function (id) { var x = porId(id); if (x && !camposCad.some(function (c) { return c.el === x; })) camposCad.push({ el: x, campo: n[2], marca: false }); });
        });
        // Marca e modelo da Autoclave e da Lavadora: não saem nos documentos (ficam no cadastro, uso interno).
        ["Marca", "Modelo"].forEach(function (n) { var x = porId(base + "_ui" + n); if (x) camposCad.push({ el: x, campo: "", marca: true }); });
      }
      var avisosSecao = [];
      function irParaVinculo() { try { el.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) {} var b = $("Busca"); if (b && !b.disabled) setTimeout(function () { try { b.focus(); } catch (e2) {} }, 350); }
      function irParaFalta(campo) {
        var alvo = (campo && $("F_" + campo)) || $("Falta") || el;
        try { alvo.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {}
        if (alvo && alvo.focus) setTimeout(function () { try { alvo.focus(); } catch (e2) {} }, 350);
      }
      function faltaCampo(campo) { return !!(st.ident && campo && (st.ident.faltam || []).some(function (f) { return f.campo === campo; })); }
      function notaDe(c) {
        var n = c.el.parentNode && c.el.parentNode.querySelector('.qvinc-nota-cad[data-para="' + c.el.id + '"]');
        if (!n) { n = document.createElement("div"); n.className = "qvinc-nota-cad"; n.setAttribute("data-para", c.el.id); n.setAttribute("role", "status"); c.el.parentNode.insertBefore(n, c.el.nextSibling); }
        return n;
      }
      function explicar(c) {
        var n = notaDe(c), b = null;
        if (c.marca) {
          n.innerHTML = "Marca e modelo não saem nos documentos de qualificação. Ficam no cadastro do equipamento, para uso interno.";
        } else if (!st.ident) {
          n.innerHTML = 'Este dado vem do cadastro do equipamento escolhido em "Cliente e equipamento", no início da tela. Nenhum equipamento foi escolhido ainda.<br><button type="button" class="btn-secondary">Escolher o equipamento</button>';
          b = function () { irParaVinculo(); };
        } else if (faltaCampo(c.campo)) {
          n.innerHTML = 'Este dado vem do cadastro do equipamento e está vazio lá. Preencha no quadro "Cliente e equipamento": grava no cadastro do equipamento (só o que está vazio) e volta para cá.<br><button type="button" class="btn-primary">Preencher no cadastro</button>';
          b = function () { irParaFalta(c.campo); };
        } else if (c.campo) {
          n.innerHTML = 'Este dado vem do cadastro do equipamento escolhido em "Cliente e equipamento". Para corrigir um valor já gravado, edite o cadastro do equipamento (Cadastros › Equipamentos › Editar) e escolha o equipamento de novo aqui.<br><button type="button" class="btn-secondary">Abrir o cadastro de equipamentos</button>';
          b = function () { abrirCadastro("equipamentos"); msg("info", 'O cadastro abriu em outra aba. Depois de salvar, volte para esta aba e clique em "Atualizar listas".'); };
        } else {
          n.innerHTML = 'Este dado vem do cadastro do cliente e da unidade escolhidos em "Cliente e equipamento". Para corrigir, edite em Cadastros › Clientes ou Unidades e escolha de novo aqui.<br><button type="button" class="btn-secondary">Abrir o cadastro de clientes</button>';
          b = function () { abrirCadastro("clientes"); msg("info", 'O cadastro abriu em outra aba. Depois de salvar, volte para esta aba e clique em "Atualizar listas".'); };
        }
        var bt = n.querySelector("button"); if (bt && b) bt.onclick = b;
        n.style.display = "";
      }
      function marcarCampo(c) {
        var x = c.el;
        x.readOnly = true;
        x.setAttribute("aria-readonly", "true");
        x.classList.add("qvinc-do-cadastro");
        x.style.background = "var(--bc-surface-2, #f1f3f5)";
        x.style.cursor = "pointer";
        x.style.opacity = "";
        x.title = c.marca ? "Não sai nos documentos de qualificação." : "Vem do cadastro. Clique para ver de onde vem e o que fazer.";
        if (!c.marca) x.placeholder = !st.ident ? "Escolha o equipamento em Cliente e equipamento" : (faltaCampo(c.campo) ? "Falta no cadastro: clique para preencher" : "");
        if (!x.getAttribute("data-qvinc-cad")) {
          x.setAttribute("data-qvinc-cad", "1");
          x.addEventListener("click", function () { explicar(c); });
          x.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); explicar(c); } });
          var lab = escopo.querySelector('label[for="' + x.id + '"]') || document.querySelector('label[for="' + x.id + '"]');
          if (lab && !lab.querySelector(".qvinc-selo")) {
            var selo = document.createElement("span"); selo.className = "qvinc-selo";
            selo.innerHTML = '<i class="fas fa-lock" aria-hidden="true"></i>' + (/do cadastro/i.test(lab.textContent || "") ? "" : (c.marca ? " uso interno" : " do cadastro"));
            lab.appendChild(selo);
          }
        }
        var n = x.parentNode && x.parentNode.querySelector('.qvinc-nota-cad[data-para="' + x.id + '"]');
        if (n && n.style.display !== "none") explicar(c);
      }
      function montarAvisosSecao() {
        var grupos = [];
        camposCad.forEach(function (c) {
          if (c.marca) return;
          var sec = c.el.closest(".card, section, fieldset, .panel, .bt-painel") || c.el.parentNode;
          if (!sec || sec.contains(el)) return; // a própria seção do quadro "Cliente e equipamento" já explica
          if (grupos.some(function (g) { return g.sec === sec; })) return;
          var linha = c.el.closest(".form-row, .row, .grid") || c.el.closest(".form-group") || c.el;
          var aviso = document.createElement("div"); aviso.className = "qvinc-sem-equip"; aviso.setAttribute("role", "status");
          if (linha.parentNode) linha.parentNode.insertBefore(aviso, linha);
          grupos.push({ sec: sec, aviso: aviso });
        });
        avisosSecao = grupos;
      }
      function atualizarCamposCadastro() {
        (camposCad || []).forEach(marcarCampo);
        (avisosSecao || []).forEach(function (g) {
          var faltam = st.ident ? (st.ident.faltam || []) : [];
          var b = null;
          if (!st.ident) {
            g.aviso.innerHTML = '<b>Nenhum equipamento escolhido.</b>Os campos marcados "do cadastro" (TAG, número de série, setor, cliente) são preenchidos quando você escolhe o cliente, a unidade e o equipamento em "Cliente e equipamento", no início da tela. Os demais campos desta seção são do ensaio e podem ser preenchidos normalmente.<br><button type="button" class="btn-secondary">Escolher o equipamento</button>';
            b = irParaVinculo;
          } else if (faltam.length) {
            g.aviso.innerHTML = "<b>Falta no cadastro do equipamento: " + esc(faltam.map(function (f) { return f.rotulo; }).join(", ")) + ".</b>Preencha no quadro \"Cliente e equipamento\": grava no cadastro do equipamento (só o que está vazio) e os campos daqui são atualizados.<br><button type=\"button\" class=\"btn-primary\">Preencher no cadastro</button>";
            b = function () { irParaFalta(faltam[0].campo); };
          }
          g.aviso.style.display = b ? "" : "none";
          var bt = g.aviso.querySelector("button"); if (bt && b) bt.onclick = b;
        });
      }
      if (!opcoes.somenteLeitura) { montarAvisosSecao(); atualizarCamposCadastro(); }

      // Valor inicial (ensaio reaberto): carrega as listas do cliente salvo.
      if (st.v.clienteId) {
        st.clientes = [{ id: st.v.clienteId, nome: st.v.cliente || "Cliente salvo", razao: st.v.cliente || "" }];
        desenharSelect($("Cliente"), st.clientes, "Escolha o cliente", function (c) { return c.nome; }, st.v.clienteId);
        carregarUnidades();
      }
      return {
        valor: function () { return st.ident ? { clienteId: st.v.clienteId, unidadeId: st.v.unidadeId, equipamentoId: st.v.equipamentoId } : null; },
        identificacao: function () { return st.ident ? Object.assign({}, st.ident) : null; },
        recarregar: function () { if (st.v.clienteId) carregarUnidades(); },
        definir: function (v) { st.v = Object.assign({ clienteId: "", unidadeId: "", equipamentoId: "", cliente: "" }, v || {}); st.ident = null; if (st.v.clienteId) { st.clientes = [{ id: st.v.clienteId, nome: st.v.cliente || "Cliente salvo", razao: st.v.cliente || "" }]; desenharSelect($("Cliente"), st.clientes, "Escolha o cliente", function (c) { return c.nome; }, st.v.clienteId); carregarUnidades(); } }
      };
    }

    /** Lista de qualificações (ficha do equipamento e QR). res: resposta de qualifEquipamentoListar/qrcodeQualificacao. */
    function htmlQualificacoes(res, opcoes) {
      opcoes = opcoes || {};
      var s = res.situacao || { situacao: "SEM_QUALIFICACAO", rotulo: "Sem qualificação registrada" };
      var h = '<div class="qualif-situacao ' + esc(s.situacao) + '">' + esc(s.rotulo) + '</div>';
      var itens = res.itens || [];
      if (!itens.length) return h + '<p style="font-size:13px;color:var(--bc-text-3)">Nenhum relatório de qualificação emitido para este equipamento.' + (opcoes.cliente ? " Em caso de dúvida, fale com a Metrolabs." : " O relatório emitido no módulo de qualificação aparece aqui automaticamente.") + "</p>";
      h += '<ul class="qualif-lista">' + itens.map(function (i) {
        var detalhes = [i.numero ? "nº " + i.numero + (i.revisao !== "" ? " · revisão " + (String(i.revisao).length === 1 ? "0" + i.revisao : i.revisao) : "") : "", i.emitidoEm ? "emitido em " + i.emitidoEm : "", i.validadeAte && i.situacao === "VIGENTE" ? "válido até " + i.validadeAte : "", i.resultado ? (i.resultado === "APROVADO" ? "aprovado" : (i.resultado === "REPROVADO" ? "reprovado" : "")) : ""].filter(Boolean).join(" · ");
        return '<li class="' + (i.situacao === "SUBSTITUIDO" ? "substituido" : "") + '"><div class="qualif-txt"><b>' + esc(i.titulo) + "</b><small>" + esc(detalhes) + "</small><small>" + esc(i.situacaoRotulo) + "</small></div>" +
          (i.temArquivo && i.situacao !== "MINUTA" ? '<button type="button" class="btn-secondary" style="min-height:40px" onclick="SGO_QVinc.abrirDocumento(\'' + esc(res.equipamento.ID) + "','" + esc(i.ref) + "','" + (opcoes.via || "ficha") + '\')">Abrir</button>' : "") + "</li>";
      }).join("") + "</ul>";
      return h;
    }

    function abrirDocumento(equipamentoId, ref, via) {
      var janela = null;
      try { janela = window.open("", "_blank"); } catch (e) { janela = null; }
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.success && r.url) { if (janela) janela.location.href = r.url; else window.open(r.url, "_blank"); }
          else { if (janela) janela.close(); alert((r && r.message) || "Não foi possível abrir o documento. Tente de novo."); }
        })
        .withFailureHandler(function () { if (janela) janela.close(); alert("Não foi possível falar com o servidor. Confira a conexão e tente de novo."); })
        .qualifEquipamentoAbrir(SGO_getSessionId(), equipamentoId, ref, via || "ficha");
    }

    /* 21/10/2026: busca no cadastro para telas que continuam com digitação livre (Relatório de calibração, Declaração de
       execução e Relatório de qualificação QI/QO/QD). Escolhido o equipamento, preenche os campos da tela que estão vazios ou
       que receberam valor automático (da leitura do certificado ou de uma escolha anterior); o que a pessoa digitou não muda.
       O fabricante (marca) não é preenchido daqui. o: { prefixo, despacho, campos: { cliente, cnpj, endereco, tag, modelo, serie,
       localizacao, tipo }: ids dos campos da tela, titulo, subtitulo, aoEscolher(ident, preenchidos) }. */
    function preencherAuto(id, valor, forcar) {
      var x = document.getElementById(id);
      valor = String(valor == null ? "" : valor).trim();
      if (!x || !valor) return false;
      var atual = String(x.value || "").trim(), auto = x.getAttribute("data-auto") || "";
      if (atual && !(forcar && auto && atual === auto)) return false;
      x.value = valor;
      x.setAttribute("data-auto", valor);
      return true;
    }
    function montarBusca(antesDe, o) {
      o = o || {};
      if (!antesDe || !antesDe.parentNode || !o.despacho) return null;
      var px = o.prefixo || "qvb";
      var velho = document.getElementById(px + "Box");
      if (velho && velho.parentNode) velho.parentNode.removeChild(velho);
      var box = document.createElement("div");
      box.id = px + "Box";
      antesDe.parentNode.insertBefore(box, antesDe);
      var estado = { ident: null };
      function chamar(fn, payload, ok, erro) {
        google.script.run
          .withSuccessHandler(function (r) { if (r && r.ok) ok(r); else erro((r && r.erro) || "O servidor não confirmou a operação. Tente de novo."); })
          .withFailureHandler(function (e) { erro("Não foi possível falar com o servidor (" + String(e && e.message ? e.message : e).replace(/[.\s]+$/, "") + "). Confira a conexão e tente de novo."); })
          [o.despacho]({ sessionId: SGO_getSessionId(), fn: fn, payload: payload || {} });
      }
      montar(box, {
        prefixo: px, camposCadastro: [], chamar: chamar,
        titulo: o.titulo || "Buscar no cadastro (opcional)",
        subtitulo: o.subtitulo || "Escolha o cliente, a unidade e o equipamento para preencher cliente, CNPJ, endereço, TAG, modelo e localização a partir do cadastro. Só os campos vazios (ou preenchidos automaticamente) recebem o valor; o que você digitou continua. Sem escolher, a tela funciona como antes.",
        aoMudar: function (i) {
          estado.ident = i;
          if (!i) return;
          var c = o.campos || {}, n = 0;
          var pares = [["cliente", i.cliente], ["cnpj", i.cnpj], ["endereco", [i.endereco, i.cidadeUf].filter(Boolean).join(" — ")], ["tag", i.tag], ["modelo", i.modelo],
            ["serie", i.numeroSerie], ["localizacao", [i.unidade, i.setor].filter(Boolean).join(" — ")], ["tipo", i.tipo]];
          pares.forEach(function (p) { if (c[p[0]] && preencherAuto(c[p[0]], p[1], true)) n++; });
          if (typeof o.aoEscolher === "function") { try { o.aoEscolher(Object.assign({}, i), n); } catch (e) { console.error(e); } }
        }
      });
      return { ident: function () { return estado.ident ? Object.assign({}, estado.ident) : null; }, box: box };
    }
    /* Dados do cadastro que vão no envio (série e ligação ao cadastro), só enquanto a TAG da tela for a do equipamento escolhido. */
    function dadosDoCadastro(busca, tagTela) {
      var i = busca && busca.ident ? busca.ident() : null;
      if (!i) return {};
      var t = String(tagTela || "").trim().toUpperCase();
      if (i.tag && t !== String(i.tag).trim().toUpperCase()) return {};
      return { numeroSerie: i.numeroSerie || "", clienteId: i.clienteId || "", unidadeId: i.unidadeId || "", equipamentoId: i.equipamentoId || "" };
    }
    return { montar: montar, htmlQualificacoes: htmlQualificacoes, abrirDocumento: abrirDocumento, chamarOficial: chamarOficial, esc: esc, montarBusca: montarBusca, preencherAuto: preencherAuto, dadosDoCadastro: dadosDoCadastro };
  })();
</script>

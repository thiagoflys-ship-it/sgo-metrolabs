  // ---- dados da tela inicial (uma chamada, cache curto) ----
  function fsCarregarInicio_(forcar) {
    const sessao = SGO_getSessionId();
    if (!forcar && FS.inicio && FS.sessao === sessao && Date.now() - FS.inicioEm < FS_CACHE_MS) return Promise.resolve(FS.inicio);
    const pedido = ++FS.pedido;
    return mobileFrota_chamarApiSilencioso_("apiInicioFrota").then(function (res) {
      if (sessao !== SGO_getSessionId()) throw new Error("Sessão alterada. Abra a Frota de novo.");
      if (!res || res.ok !== true) throw new Error((res && res.message) || "O servidor não devolveu a situação da frota.");
      if (pedido === FS.pedido) { FS.inicio = res; FS.inicioEm = Date.now(); FS.sessao = sessao; }
      MOBILE_FROTA.gruposChecklist = res.gruposChecklist || [];
      MOBILE_FROTA.emAndamento = res.emAndamento || [];
      return res;
    });
  }
  function fsAssinatura_(d) { return d ? JSON.stringify([d.veiculos, d.emAndamento, (d.alertas || []).length, d.condutor]) : ""; }

  function fsAgendarAtualizacao_() {
    if (FS.timer) clearTimeout(FS.timer);
    FS.timer = setTimeout(function () {
      FS.timer = null;
      const raiz = fsRaiz_();
      if (!raiz || raiz.getAttribute("data-tela") !== "inicio") return;
      if (document.visibilityState && document.visibilityState !== "visible") { fsAgendarAtualizacao_(); return; }
      const antes = fsAssinatura_(FS.inicio);
      fsCarregarInicio_(true).then(function (d) {
        const r = fsRaiz_();
        if (r && r.getAttribute("data-tela") === "inicio" && fsAssinatura_(d) !== antes) fsDesenharInicio_();
      }).catch(function () {}).finally(fsAgendarAtualizacao_);
    }, 30000);
  }

  // ---- tela inicial ----
  function renderMobileFrotaOperacional_() {
    if (!fsNoComputador_()) {
      MOBILE_NAV = { modulo: "frota", tela: "lista" };
      atualizarTituloMobile_("Frota");
    }
    const host = fsHost_();
    if (!host) return;
    fsEstilo_();
    const fresco = FS.inicio && FS.sessao === SGO_getSessionId() && Date.now() - FS.inicioEm < FS_CACHE_MS;
    if (fresco) {
      fsDesenharInicio_();
      fsAgendarAtualizacao_();
      fsDepoisDoInicio_();
      return;
    }
    host.innerHTML = '<div class="fs' + (fsNoComputador_() ? ' fs-desk' : '') + '" id="fsRaiz" data-tela="carregando" aria-busy="true">' +
      '<div class="sgo-esq fs-esq"></div><div class="sgo-esq fs-esq"></div><div class="sgo-esq fs-esq"></div>' +
      '<span class="sgo-sr">Carregando a frota</span></div>';
    fsCarregarInicio_(true).then(function () { fsDesenharInicio_(); fsAgendarAtualizacao_(); fsDepoisDoInicio_(); }).catch(function (err) {
      const r = fsRaiz_();
      if (!r) return;
      r.setAttribute("data-tela", "erro"); r.removeAttribute("aria-busy");
      r.innerHTML = '<div class="fs-aviso erro" role="alert">Não foi possível carregar a frota agora. ' + fsEsc_((err && err.message) || "") +
        ' Verifique a conexão e toque em Tentar de novo; se continuar, avise o administrador.</div>' +
        '<button type="button" class="fs-btn prim" data-acao="recarregar">Tentar de novo</button>';
      r.addEventListener("click", fsClique_);
    });
  }

  // Atalho da tela inicial do celular: abre a Frota já na devolução.
  function fsIrDevolver_(movId) { FS.abrirDevolucao = String(movId || ""); abrir("frota"); }
  function fsDepoisDoInicio_() {
    const id = FS.abrirDevolucao; FS.abrirDevolucao = "";
    if (id && FS.inicio && (FS.inicio.emAndamento || []).some(function (m) { return m.id === id; })) fsAbrirDevolucao_(id);
  }

  function fsDesenharInicio_() {
    const host = fsHost_();
    const d = FS.inicio;
    if (!host || !d) return;
    const gestao = !!d.gestor;
    const minhas = (d.emAndamento || []).filter(function (m) { return m.minha; });
    const outras = (d.emAndamento || []).filter(function (m) { return !m.minha; });
    const livres = (d.veiculos || []).filter(function (v) { return v.situacao === "DISPONIVEL"; });
    const avisoRastreador = MOBILE_FROTA.avisoRastreador || "";
    MOBILE_FROTA.avisoRastreador = "";
    const semCondutor = !d.condutor && !gestao;
    const rascunho = FS.fluxo && !FS.fluxo.concluido ? FS.fluxo : null;

    const alertas = (d.alertas || []).map(function (a) {
      if (a.tipo === "MULTA_SEM_CONDUTOR") {
        const ambigua = /conferir/i.test(String(a.tipoLabel || ""));
        return '<div class="fs-aviso erro"><b>Multa a conferir:</b> ' + fsEsc_(a.veiculoPlaca) + " — " + (ambigua ? "mais de uma retirada no horário; confirme o condutor" : "condutor não identificado") +
          (a.vencimento ? " (infração em " + fsEsc_(a.vencimento) + ")" : "") + "</div>";
      }
      const critico = a.status === "VENCIDO";
      const generoOk = a.categoria === "DOCUMENTO" ? "vencido" : "vencida";
      return '<div class="fs-aviso' + (critico ? " erro" : "") + '"><b>' + (critico ? "Vencido" : "A vencer") + ":</b> " + fsEsc_(a.veiculoPlaca) + " — " + fsEsc_(a.tipoLabel) + (critico ? " " + generoOk : " vencendo em breve") + "</div>";
    });

    let h = "";
    if (avisoRastreador) h += '<div class="fs-aviso erro" id="mob_frota_avisoRastreador" role="alert"><b>' + fsEsc_(avisoRastreador) + "</b></div>";
    minhas.forEach(function (m) {
      h += '<button type="button" class="fs-devolver" data-acao="devolver" data-id="' + fsEsc_(m.id) + '">' + fsFotoVeicHtml_({ placa: m.veiculoPlaca, foto: m.foto }) +
        '<span class="fs-dv-txt"><b>Devolver ' + fsEsc_(m.veiculoPlaca) + "</b><span>" + fsEsc_(m.veiculoModelo || "") + "</span><span>Retirado " + fsEsc_(fsDiaHora_(m.dataSaida, m.horaSaida)) + " · KM " + fsEsc_(fsKm_(m.kmSaida)) + "</span></span>" +
        '<span class="fs-seta" aria-hidden="true" style="color:#fff">&rsaquo;</span></button>';
    });
    if (rascunho) {
      const enviadas = rascunho.fotos.concat(rascunho.painel).filter(function (f) { return f.estado === "enviada"; }).length;
      h += '<button type="button" class="fs-btn" data-acao="continuar">Continuar ' + (rascunho.tipo === "retirada" ? "a retirada do " : "a devolução do ") + fsEsc_(rascunho.placa) +
        (enviadas ? " (" + SGO_qtd_(enviadas, "foto enviada", "fotos enviadas") + ")" : "") + "</button>";
    }
    if (semCondutor) h += '<div class="fs-aviso">Seu login ainda não tem condutor vinculado, então a retirada não pode ser registrada em seu nome. Peça à gestão (Administrador, Gestor ou Diretoria) para vincular o seu usuário em Frota &gt; Condutores e abra a Frota de novo.</div>';
    if (alertas.length) {
      h += alertas.length > 2
        ? '<details><summary>Avisos da frota (' + alertas.length + ')</summary><div class="fs-det">' + alertas.join("") + "</div></details>"
        : alertas.join("");
    }
    h += '<div class="fs-titulo">' + (minhas.length ? "Retirar outro veículo" : "Retirar um veículo") + ' <span class="fs-sub">(' + SGO_qtd_(livres.length, "disponível", "disponíveis") + ")</span></div>";
    h += livres.length ? '<div class="fs-veics">' + livres.map(function (v) {
      return '<button type="button" class="fs-veic" data-acao="retirar" data-id="' + fsEsc_(v.id) + '"' + (semCondutor ? ' aria-disabled="true"' : "") + ">" + fsFotoVeicHtml_(v) +
        '<span class="fs-veic-txt"><span class="fs-placa">' + fsEsc_(v.placa) + '</span><span class="fs-modelo">' + fsEsc_([v.modelo, v.cor].filter(Boolean).join(" · ")) + '</span><span class="fs-km">KM ' + fsEsc_(fsKm_(v.km)) + "</span></span>" +
        '<span class="fs-seta" aria-hidden="true">&rsaquo;</span></button>';
    }).join("") + "</div>"
      : '<div class="fs-aviso info">Nenhum veículo disponível agora. Os veículos em uso aparecem abaixo; quando alguém devolver, ele volta para esta lista (a tela se atualiza sozinha).</div>';
    if (outras.length) {
      h += "<details" + (gestao ? " open" : "") + "><summary>Em uso por outras pessoas (" + outras.length + ")</summary><div class=\"fs-det\">" + outras.map(function (m) {
        return '<button type="button" class="fs-veic" data-acao="devolver" data-id="' + fsEsc_(m.id) + '">' + fsFotoVeicHtml_({ placa: m.veiculoPlaca, foto: m.foto }) +
          '<span class="fs-veic-txt"><span class="fs-placa">' + fsEsc_(m.veiculoPlaca) + '</span><span class="fs-modelo">Com ' + fsEsc_(m.condutorNome || "condutor não localizado") + '</span><span class="fs-km">Desde ' + fsEsc_(fsDiaHora_(m.dataSaida, m.horaSaida)) +
          (gestao ? " · Toque para devolver no lugar" : " · Só " + fsEsc_(m.condutorNome || "o condutor") + " ou a gestão devolvem") + "</span></span></button>";
      }).join("") + "</div></details>";
    }
    if (gestao && !fsNoComputador_()) {
      h += '<details><summary>Opções da gestão</summary><div class="fs-det">' +
        '<button type="button" class="fs-btn" data-acao="abastecer">Registrar abastecimento</button>' +
        '<button type="button" class="fs-btn" data-acao="ajustarKm">Ajustar KM do veículo</button>' +
        '<button type="button" class="fs-btn" data-acao="partida">Partida do veículo (rastreador)</button></div></details>';
    }
    const hora = new Date(FS.inicioEm || Date.now());
    h += '<div class="fs-rodape">Atualizado às ' + ("0" + hora.getHours()).slice(-2) + ":" + ("0" + hora.getMinutes()).slice(-2) + '<button type="button" class="fs-link" data-acao="recarregar">Atualizar agora</button></div>';
    host.innerHTML = '<div class="fs' + (fsNoComputador_() ? ' fs-desk' : '') + '" id="fsRaiz" data-tela="inicio">' + h + "</div>";
    fsRaiz_().addEventListener("click", fsClique_);
  }

  function fsClique_(ev) {
    const alvo = ev.target.closest("[data-acao]");
    if (!alvo || !fsRaiz_() || !fsRaiz_().contains(alvo)) return;
    const acao = alvo.getAttribute("data-acao"), id = alvo.getAttribute("data-id") || "";
    if (acao === "recarregar") { FS.inicioEm = 0; renderMobileFrotaOperacional_(); return; }
    if (acao === "retirar") { fsAbrirRetirada_(id); return; }
    if (acao === "devolver") { fsAbrirDevolucao_(id); return; }
    if (acao === "continuar") { if (FS.fluxo) fsDesenharFluxo_(); return; }
    if (acao === "abastecer") { renderMobileFrotaAbastecer_(); return; }
    if (acao === "ajustarKm") { renderMobileFrotaAjustarKm_(); return; }
    if (acao === "partida") { renderMobileFrotaPartida_(); return; }
    if (acao === "vistoria") { fsVistoria_(alvo.getAttribute("data-v")); return; }
    if (acao === "item") { fsAlternarItem_(alvo); return; }
    if (acao === "removerFoto") { ev.preventDefault(); ev.stopPropagation(); fsRemoverFoto_(id); return; }
    if (acao === "tentarFoto") { fsTentarDeNovo_(id); return; }
    if (acao === "confirmar") { fsConfirmar_(); return; }
    if (acao === "cancelar") { fsCancelar_(); return; }
  }

  // ---- fluxo (retirada / devolução) ----
  function fsNovoFluxo_(tipo, o) {
    return Object.assign({ tipo: tipo, fotos: [], painel: [], vistoria: "", problemas: {}, km: "", kmTocado: false, finalidade: "", observacoes: "",
      condutorId: "", data: "", hora: "", justificativa: "", miniatura: null, concluido: false }, o);
  }
  function fsAbrirRetirada_(veiculoId) {
    const d = FS.inicio || {};
    const v = (d.veiculos || []).filter(function (x) { return x.id === veiculoId; })[0];
    if (!v) { FS.inicioEm = 0; renderMobileFrotaOperacional_(); return; }
    if (!d.condutor && !d.gestor) { fsDesenharInicio_(); const r = fsRaiz_(); if (r) r.scrollIntoView({ block: "start" }); return; }
    if (v.situacao !== "DISPONIVEL") { alert("O veículo " + v.placa + " não está mais disponível. A lista foi atualizada."); FS.inicioEm = 0; renderMobileFrotaOperacional_(); return; }
    if (!(FS.fluxo && !FS.fluxo.concluido && FS.fluxo.tipo === "retirada" && FS.fluxo.veiculo.id === v.id)) {
      FS.fluxo = fsNovoFluxo_("retirada", { veiculo: v, placa: v.placa, km: fsKm_(v.km), condutorId: d.condutor ? d.condutor.id : "" });
    }
    fsDesenharFluxo_();
  }
  function fsAbrirDevolucao_(movId) {
    const d = FS.inicio || {};
    const m = (d.emAndamento || []).filter(function (x) { return x.id === movId; })[0];
    if (!m) { FS.inicioEm = 0; renderMobileFrotaOperacional_(); return; }
    if (!m.minha && !d.gestor) {
      // Operador nunca no limbo: diz com quem está e o que fazer, sem abrir um formulário que o servidor recusaria.
      const r = fsRaiz_();
      const caixa = document.createElement("div");
      caixa.className = "fs-aviso"; caixa.setAttribute("role", "alert");
      caixa.textContent = frotaTextoSoCondutorDevolve_(m.condutorNome);
      const ant = r && r.querySelector("#fsAvisoDono"); if (ant) ant.remove();
      caixa.id = "fsAvisoDono";
      if (r) { r.insertBefore(caixa, r.firstChild); caixa.scrollIntoView({ block: "start", behavior: "smooth" }); }
      return;
    }
    if (!(FS.fluxo && !FS.fluxo.concluido && FS.fluxo.tipo === "devolucao" && FS.fluxo.mov.id === m.id)) {
      FS.fluxo = fsNovoFluxo_("devolucao", { mov: m, placa: m.veiculoPlaca });
    }
    fsDesenharFluxo_();
  }

  function fsDesenharFluxo_() {
    const f = FS.fluxo, d = FS.inicio || {}, host = fsHost_();
    if (!f || !host) return;
    const ret = f.tipo === "retirada";
    const gestao = !!d.gestor;
    if (!fsNoComputador_()) {
      MOBILE_NAV = { modulo: "frota", tela: "form" };
      atualizarTituloMobile_((ret ? "Retirar " : "Devolver ") + f.placa);
    }
    const noLugar = !ret && !f.mov.minha;
    const semCondutorProprio = ret && gestao && !d.condutor;
    let h = "";
    // cabeçalho do veículo
    if (ret) {
      h += '<div class="fs-veic" style="cursor:default">' + fsFotoVeicHtml_(f.veiculo) + '<span class="fs-veic-txt"><span class="fs-placa">' + fsEsc_(f.placa) + '</span><span class="fs-modelo">' +
        fsEsc_([f.veiculo.modelo, f.veiculo.cor].filter(Boolean).join(" · ")) + '</span><span class="fs-km">Retirada em nome de ' + fsEsc_(d.condutor ? d.condutor.nome : "condutor a escolher (Opções da gestão)") + "</span></span></div>";
    } else {
      h += '<div class="fs-veic" style="cursor:default">' + fsFotoVeicHtml_({ placa: f.placa, foto: f.mov.foto }) + '<span class="fs-veic-txt"><span class="fs-placa">' + fsEsc_(f.placa) + '</span><span class="fs-modelo">' +
        fsEsc_(f.mov.veiculoModelo || "") + '</span><span class="fs-km">Retirado por ' + fsEsc_(f.mov.condutorNome) + " " + fsEsc_(fsDiaHora_(f.mov.dataSaida, f.mov.horaSaida)) + " · KM " + fsEsc_(fsKm_(f.mov.kmSaida)) + "</span></span></div>";
      if (noLugar) h += '<div class="fs-aviso">Você está registrando a devolução no lugar de ' + fsEsc_(f.mov.condutorNome) + ". Escreva a justificativa em Opções da gestão (mínimo de 15 caracteres); " + fsEsc_(f.mov.condutorNome) + " será avisado.</div>";
    }
    // 1. KM
    h += '<section class="fs-passo" id="fsPassoKm"><h3><span class="fs-num">1</span>' + (ret ? "KM do painel" : "KM de chegada") + "</h3>" +
      '<div class="fs-campo"><label for="fs_km">' + (ret ? "Confira o número no painel. Se for diferente, corrija." : "Número do odômetro agora") + "</label>" +
      '<input type="text" id="fs_km" class="fs-km-in" inputmode="numeric" autocomplete="off" value="' + fsEsc_(f.km) + '" placeholder="' + (ret ? "" : "Ex.: " + fsEsc_(fsKm_(Number(f.mov.kmSaida) + 35))) + '"></div>' +
      '<div class="fs-sub" id="fs_kmInfo"></div><div id="fs_painelBloco"></div></section>';
    // 2. Fotos (retirada) — na devolução, a foto do painel vem no passo 1 e fotos extras do veículo são opcionais
    if (ret) {
      h += '<section class="fs-passo" id="fsPassoFotos"><h3><span class="fs-num">2</span>Fotos do veículo</h3>' +
        '<div class="fs-sub">Pelo menos uma. A câmera abre direto; cada foto já vai sendo enviada.</div>' +
        '<div class="fs-fotos" id="fs_fotos"></div>' +
        '<label class="fs-btn foto" for="fs_inFoto">Tirar foto do veículo</label><input type="file" id="fs_inFoto" class="fs-oculto" data-sgo-nativo accept="image/*" capture="environment">' +
        '<label class="fs-link" for="fs_inGaleria">Escolher da galeria</label><input type="file" id="fs_inGaleria" class="fs-oculto" data-sgo-nativo accept="image/*" multiple></section>';
    }
    // 3. Vistoria
    const nProb = Object.keys(f.problemas).length;
    h += '<section class="fs-passo" id="fsPassoVist"><h3><span class="fs-num">' + (ret ? "3" : "2") + "</span>Vistoria</h3>" +
      '<div class="fs-sub">Olhe o veículo por fora e por dentro.</div>' +
      '<div class="fs-duas"><button type="button" class="fs-op ok" data-acao="vistoria" data-v="ok" aria-pressed="' + (f.vistoria === "ok") + '">Tudo OK</button>' +
      '<button type="button" class="fs-op prob" data-acao="vistoria" data-v="problema" aria-pressed="' + (f.vistoria === "problema") + '">Tem problema</button></div>' +
      '<div id="fs_itens"' + (f.vistoria === "problema" ? "" : " hidden") + ">" + (f.vistoria === "problema" ? fsItensHtml_(f) : "") + "</div>" +
      '<div class="fs-sub" id="fs_vistInfo">' + (f.vistoria === "ok" ? "Todos os itens serão gravados como OK." : (f.vistoria === "problema" ? (nProb ? SGO_qtd_(nProb, "item marcado", "itens marcados") + " com problema." : "Toque nos itens com problema e escreva o que encontrou.") : "")) + "</div></section>";
    // Complementos opcionais
    if (ret) {
      h += '<div class="fs-campo"><label for="fs_finalidade">Finalidade (opcional)</label><input type="text" id="fs_finalidade" value="' + fsEsc_(f.finalidade) + '" placeholder="Ex.: visita técnica ao cliente"></div>';
    } else {
      h += '<details id="fs_maisDev"' + (f.fotos.length || f.observacoes ? " open" : "") + '><summary>Mais fotos e observações (opcional)</summary><div class="fs-det">' +
        '<div class="fs-fotos" id="fs_fotos"></div>' +
        '<label class="fs-btn" for="fs_inFoto">Tirar foto do veículo</label><input type="file" id="fs_inFoto" class="fs-oculto" data-sgo-nativo accept="image/*" capture="environment">' +
        '<div class="fs-campo"><label for="fs_obs">Observações</label><textarea id="fs_obs">' + fsEsc_(f.observacoes) + "</textarea></div></div></details>";
    }
    // Opções da gestão (recolhido)
    if (gestao) {
      const abrir = noLugar || semCondutorProprio || !!(f.data || f.hora || f.justificativa) || (ret && d.condutor && f.condutorId && f.condutorId !== d.condutor.id);
      h += '<details id="fs_gestao"' + (abrir ? " open" : "") + '><summary>Opções da gestão</summary><div class="fs-det">' +
        (semCondutorProprio ? '<div class="fs-aviso">Seu login não tem condutor vinculado: escolha o condutor desta retirada e escreva a justificativa.</div>' : "") +
        (ret ? '<div class="fs-campo"><label for="fs_condutor">Condutor</label><select id="fs_condutor"><option value="">Escolha o condutor</option>' + (d.condutores || []).map(function (c) {
          return '<option value="' + fsEsc_(c.id) + '"' + (c.id === f.condutorId ? " selected" : "") + ">" + fsEsc_(c.nome) + (d.condutor && c.id === d.condutor.id ? " (eu)" : "") + "</option>";
        }).join("") + "</select></div>" : "") +
        '<div class="fs-duas"><div class="fs-campo"><label for="fs_data">Data (vazio = agora)</label><input type="text" id="fs_data" inputmode="numeric" placeholder="dd/mm/aaaa" value="' + fsEsc_(f.data) + '"></div>' +
        '<div class="fs-campo"><label for="fs_hora">Hora (vazio = agora)</label><input type="text" id="fs_hora" inputmode="numeric" placeholder="hh:mm" value="' + fsEsc_(f.hora) + '"></div></div>' +
        '<div class="fs-campo"><label for="fs_just">Justificativa</label><textarea id="fs_just" placeholder="Obrigatória (mínimo de 15 caracteres) para outro condutor, data/hora diferente de agora ou devolução no lugar do condutor">' + fsEsc_(f.justificativa) + "</textarea></div></div></details>";
    } else {
      h += '<div class="fs-sub">Registro com a hora atual do servidor (horário de Brasília) no momento em que você confirmar.</div>';
    }
    h += '<div id="fs_status" aria-live="polite"></div>';
    h += '<button type="button" class="fs-link" data-acao="cancelar">Cancelar e voltar</button>';
    h += '<div class="fs-barra"><div class="fs-barra-sub" id="fs_barraSub"></div><button type="button" class="fs-btn prim" id="fs_confirmar" data-acao="confirmar">' + (ret ? "Confirmar retirada" : "Confirmar devolução") + "</button></div>";

    host.innerHTML = '<div class="fs' + (fsNoComputador_() ? ' fs-desk' : '') + '" id="fsRaiz" data-tela="' + f.tipo + '">' + h + "</div>";
    const raiz = fsRaiz_();
    raiz.addEventListener("click", fsClique_);
    raiz.addEventListener("input", fsAoDigitar_);
    raiz.addEventListener("change", fsAoMudar_);
    fsAtualizarKmInfo_();
    fsDesenharFotos_();
    fsAtualizarBarra_();
    if (!fsNoComputador_()) window.scrollTo(0, 0); else host.scrollIntoView({ block: "start" });
  }

  function fsItensHtml_(f) {
    return (MOBILE_FROTA.gruposChecklist || []).map(function (g, gi) {
      const marcados = g.itens.filter(function (it) { return f.problemas[g.grupo + "|" + it]; }).length;
      return "<details" + (marcados || gi === 0 ? " open" : "") + "><summary>" + fsEsc_(g.grupo) + (marcados ? '<span class="fs-cont">' + marcados + " com problema</span>" : "") + '</summary><div class="fs-det">' +
        g.itens.map(function (it) {
          const k = g.grupo + "|" + it, p = f.problemas[k];
          return '<div class="fs-item' + (p ? " prob" : "") + '" data-k="' + fsEsc_(k) + '"><button type="button" class="fs-item-bt" data-acao="item" aria-pressed="' + (!!p) + '">' + fsEsc_(it) +
            '<span class="fs-marca">' + (p ? "Problema" : "OK") + "</span></button>" +
            '<input type="text" class="fs-obs" data-obs="' + fsEsc_(k) + '" placeholder="O que tem? Ex.: risco na porta" value="' + fsEsc_(p ? p.obs : "") + '"></div>';
        }).join("") + "</div></details>";
    }).join("");
  }

  function fsVistoria_(v) {
    const f = FS.fluxo; if (!f) return;
    f.vistoria = v;
    const raiz = fsRaiz_();
    raiz.querySelectorAll('[data-acao="vistoria"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === v)); });
    const itens = document.getElementById("fs_itens");
    if (itens) itens.hidden = v !== "problema";
    // Os 31 itens só são montados quando a pessoa toca em "Tem problema" (tela mais leve).
    if (v === "ok") { f.problemas = {}; if (itens) itens.innerHTML = ""; }
    if (v === "problema" && itens && !itens.firstChild) itens.innerHTML = fsItensHtml_(f);
    fsAtualizarVistInfo_();
    fsAtualizarBarra_();
    if (v === "problema" && itens) itens.scrollIntoView({ block: "start", behavior: "smooth" });
  }
  function fsAlternarItem_(bt) {
    const f = FS.fluxo; if (!f) return;
    const caixa = bt.closest(".fs-item"), k = caixa.getAttribute("data-k");
    if (f.problemas[k]) delete f.problemas[k]; else f.problemas[k] = { obs: (caixa.querySelector(".fs-obs") || {}).value || "" };
    const p = !!f.problemas[k];
    caixa.classList.toggle("prob", p);
    bt.setAttribute("aria-pressed", String(p));
    bt.querySelector(".fs-marca").textContent = p ? "Problema" : "OK";
    const det = caixa.closest("details"), sum = det && det.querySelector("summary");
    if (sum) {
      const n = det.querySelectorAll(".fs-item.prob").length, cont = sum.querySelector(".fs-cont");
      if (cont) cont.remove();
      if (n) sum.insertAdjacentHTML("beforeend", '<span class="fs-cont">' + n + " com problema</span>");
    }
    if (p) { const o = caixa.querySelector(".fs-obs"); if (o) setTimeout(function () { o.focus(); }, 30); }
    fsAtualizarVistInfo_();
    fsAtualizarBarra_();
  }
  function fsAtualizarVistInfo_() {
    const f = FS.fluxo, el = document.getElementById("fs_vistInfo"); if (!f || !el) return;
    const n = Object.keys(f.problemas).length;
    el.textContent = f.vistoria === "ok" ? "Todos os itens serão gravados como OK." : (f.vistoria === "problema" ? (n ? SGO_qtd_(n, "item marcado", "itens marcados") + " com problema. Escreva o que encontrou em cada um." : "Toque nos itens com problema e escreva o que encontrou.") : "");
  }

  function fsAoDigitar_(ev) {
    const f = FS.fluxo, t = ev.target; if (!f || !t) return;
    if (t.id === "fs_km") { f.km = t.value; f.kmTocado = true; fsAtualizarKmInfo_(); fsAtualizarBarra_(); }
    else if (t.id === "fs_finalidade") f.finalidade = t.value;
    else if (t.id === "fs_obs") f.observacoes = t.value;
    else if (t.id === "fs_data") f.data = t.value;
    else if (t.id === "fs_hora") f.hora = t.value;
    else if (t.id === "fs_just") f.justificativa = t.value;
    else if (t.classList.contains("fs-obs")) { const k = t.getAttribute("data-obs"); if (f.problemas[k]) f.problemas[k].obs = t.value; fsAtualizarBarra_(); }
  }
  function fsAoMudar_(ev) {
    const f = FS.fluxo, t = ev.target; if (!f || !t) return;
    if (t.id === "fs_condutor") { f.condutorId = t.value; return; }
    if (t.type === "file") {
      const arquivos = Array.prototype.slice.call(t.files || []).slice(0, 10);
      const destino = t.getAttribute("data-destino") === "painel" ? "painel" : "fotos";
      arquivos.forEach(function (arq) { fsAdicionarFoto_(arq, destino); });
      t.value = "";
    }
  }

  // Foto do painel: retirada = só quando o KM for diferente do registrado; devolução = sempre.
  function fsPrecisaPainel_() {
    const f = FS.fluxo; if (!f) return "";
    if (f.tipo === "devolucao") return "sempre";
    const km = frotaNumCliente_(f.km), atual = Number(f.veiculo.km);
    return isFinite(km) && km !== atual ? "divergente" : "";
  }
  function fsAtualizarKmInfo_() {
    const f = FS.fluxo, info = document.getElementById("fs_kmInfo"), bloco = document.getElementById("fs_painelBloco");
    if (!f || !info || !bloco) return;
    const km = frotaNumCliente_(f.km);
    let txt = "";
    if (f.tipo === "retirada") {
      const atual = Number(f.veiculo.km);
      if (!String(f.km).trim()) txt = "Digite o número do odômetro.";
      else if (!isFinite(km)) txt = "Use só números (ex.: 45.120).";
      else if (km === atual) txt = "Igual ao KM registrado (" + fsKm_(atual) + ").";
      else if (km < atual && !fsGestao_()) txt = "Menor que o KM registrado (" + fsKm_(atual) + "). O odômetro não volta: confira o painel. Se o registro estiver errado, peça à gestão o ajuste de KM.";
      else txt = "Diferente do KM registrado (" + fsKm_(atual) + "): diferença de " + fsKm_(km - atual) + " km. Tire a foto do painel; a gestão confere.";
    } else {
      const ks = Number(f.mov.kmSaida);
      if (!String(f.km).trim()) txt = "Na saída estava com " + fsKm_(ks) + " km.";
      else if (!isFinite(km)) txt = "Use só números (ex.: 45.120).";
      else if (km < ks) txt = "Menor que o KM de saída (" + fsKm_(ks) + "). Confira o número no painel.";
      else txt = "Rodou " + fsKm_(km - ks) + " km nesta retirada.";
    }
    info.textContent = txt;
    const precisa = fsPrecisaPainel_();
    const mostrar = !!precisa || f.painel.length;
    if (!mostrar) { bloco.innerHTML = ""; return; }
    if (!bloco.querySelector("#fs_inPainel")) {
      bloco.innerHTML = '<div class="fs-fotos" id="fs_fotosPainel"></div>' +
        '<label class="fs-btn foto" for="fs_inPainel" id="fs_lbPainel">Tirar foto do painel</label><input type="file" id="fs_inPainel" class="fs-oculto" data-sgo-nativo accept="image/*" capture="environment" data-destino="painel">';
      fsDesenharFotos_();
    }

  // ---- barra de confirmação ----

  function fsConcluido_(f, res, payload) {

    const km = frotaNumCliente_(f.km);

  // Espelha os 8 passos do desktop (SGO_CertCal_ConteudoModulo.js), mas
  // desenhado do zero pra celular: 1 passo por tela, poucos campos por
  // vez. Reaproveita o MESMO backend (CertCal_apiDispatch) e o MESMO
  // formato de payload (blocos/pontos/leituras) do desktop — só a
  // apresentação é nova. Cliente/Equipamento novos (1º atendimento) usam
  // as telas mobile que já existem (renderMobileFormClientes_/
  // renderMobileFormEquipamentos_) e voltam pro wizard sozinhas
  // (MOBILE_CERTCAL_RETORNO).
  // ==========================================
  function mobileCertCalChamarApi_(fn, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .CertCal_apiDispatch({ sessionId: SGO_getSessionId(), fn: fn, payload: payload || {} });
    });
  }

      })
      .withFailureHandler(function (err) { SGO_finalizarCarregamento_(); alert("Não foi possível carregar o cliente. Verifique a conexão e tente de novo."); console.error(err); })
      .clientesObter(SESSION, id);
  }

  function mobileCertCalNovoCliente_() {
    MOBILE_CERTCAL_RETORNO = "cliente";
    renderMobileFormClientes_(null);
  }

  // ---------- Passo 2: Equipamento ----------
  function renderMobileCertCalEquipamento_() {
    if (!MOBILE_CERTCAL.cliente) { renderMobileCertCalCliente_(); return; }
    MOBILE_NAV = { modulo: "certificado_calibracao", tela: "form" };
    atualizarTituloMobile_("Certificado — Equipamento");
    const div = document.getElementById("conteudo");
    if (!div) return;
    div.innerHTML =
      mobileCertCalPasso_(2, "equipamento de " + (MOBILE_CERTCAL.cliente.RAZAO_SOCIAL || MOBILE_CERTCAL.cliente.NOME_FANTASIA || "")) +
      '<input type="text" class="mobile-search" placeholder="Buscar por tipo, TAG, série..." oninput="mobileBuscarComDebounce_(mobileCertCalBuscarEquipamento_, this.value)">' +
      '<div class="mobile-list" id="mobileCertCalListaEquip">Carregando...</div>' +
      '<button type="button" class="mobile-fab" onclick="mobileCertCalNovoEquipamento_()">+ Novo equipamento</button>';
    mobileCertCalBuscarEquipamento_("");
  }

  function mobileCertCalBuscarEquipamento_(termo) {
    const lista = document.getElementById("mobileCertCalListaEquip");
    if (lista) lista.innerHTML = "Carregando...";
    const clienteId = MOBILE_CERTCAL.cliente && MOBILE_CERTCAL.cliente.ID;
    const q = String(termo || "").trim().toLowerCase();
    // Já filtrado por cliente no servidor (CertCal_apiListarEquipamentosCliente,
    // o mesmo usado pelo wizard do desktop) — busca em vez de listar tudo
    // da empresa e filtrar aqui (achado na validação, 2026-09-01).
    mobileCertCalChamarApi_("apiListarEquipamentosCliente", { clienteId: clienteId }).then(function (res) {
      const itens = (res.items || []).filter(function (it) {
        if (!q) return true;
        return [it.TIPO, it.FABRICANTE, it.MODELO, it.SERIE, it.TAG].some(function (v) {
          return String(v || "").toLowerCase().indexOf(q) !== -1;
        });
      });
      mobileRenderListaGenerica_("mobileCertCalListaEquip", { success: true, items: itens }, function (item) {
        return mobileCardHtml_(item.TIPO, [item.FABRICANTE, item.MODELO, item.TAG].filter(Boolean).join(" · "), null,
          "mobileCertCalSelecionarEquipamento_('" + item.ID + "')");
      });
    }).catch(function (err) { mobileErroLista_("mobileCertCalListaEquip", err); });
  }

  function mobileCertCalSelecionarEquipamento_(id) {
    SGO_iniciarCarregamento_();
    google.script.run
      .withSuccessHandler(function (res) {
        SGO_finalizarCarregamento_();
        if (!res || !res.success || !res.item) return alert("Equipamento não encontrado.");
        MOBILE_CERTCAL.equipamento = res.item;
        renderMobileCertCalDados_();
      })
      .withFailureHandler(function (err) { SGO_finalizarCarregamento_(); alert("Não foi possível carregar o equipamento. Verifique a conexão e tente de novo."); console.error(err); })
      .equipamentosObter(SESSION, id);
  }

  function mobileCertCalNovoEquipamento_() {
    MOBILE_CERTCAL_RETORNO = "equipamento";
    renderMobileFormEquipamentos_(null);
  }

  // ---------- Passo 3: Dados da calibração ----------
  function renderMobileCertCalDados_() {
    if (!MOBILE_CERTCAL.equipamento) { renderMobileCertCalEquipamento_(); return; }
    MOBILE_NAV = { modulo: "certificado_calibracao", tela: "form" };
    atualizarTituloMobile_("Certificado — Dados");
    const div = document.getElementById("conteudo");
    if (!div) return;
    const d = MOBILE_CERTCAL.dados || {};
    const hoje = mobileFrotaHoraAgora_().data;
    div.innerHTML =
      mobileCertCalPasso_(3, "dados da calibração") +
      mobileFieldHtml_("Técnico executor", '<select id="mob_cc_tecnico"><option value="">Carregando...</option></select>') +
      mobileFieldHtml_("Ou nome livre (se não cadastrado)", '<input type="text" id="mob_cc_tecnico_livre" value="' + escapeHtml_(d.tecnicoExecutorLivre || "") + '">') +
      mobileFieldHtml_("Data da calibração *", '<input type="text" id="mob_cc_data" value="' + escapeHtml_(d.dataCalibracao || hoje) + '" placeholder="dd/mm/aaaa">') +
      mobileCertCalProximaCampos_(d.proximaCalibracao || {}) +
      mobileFieldHtml_("Local", '<select id="mob_cc_local">' +
        '<option value="CLIENTE"' + (d.localCalibracao !== "LABORATORIO" ? " selected" : "") + '>No cliente</option>' +
        '<option value="LABORATORIO"' + (d.localCalibracao === "LABORATORIO" ? " selected" : "") + '>No laboratório</option>' +
        '</select>') +
      mobileFieldHtml_("Temperatura ambiente (°C)", '<input type="text" id="mob_cc_temp" inputmode="decimal" value="' + escapeHtml_(d.temperaturaAmbiente || "") + '">') +
      mobileFieldHtml_("Umidade relativa (%)", '<input type="text" id="mob_cc_umidade" inputmode="decimal" value="' + escapeHtml_(d.umidadeRelativa || "") + '">') +
      '<div class="mobile-form-actions">' +
        '<button type="button" class="mobile-btn-cancelar" onclick="renderMobileCertCalEquipamento_()">Voltar</button>' +
        '<button type="button" class="mobile-btn-salvar" onclick="mobileCertCalAvancarDados_()">Continuar</button>' +
      '</div>';

    mobileCertCalChamarApi_("apiListarTecnicos", {}).then(function (res) {
      const sel = document.getElementById("mob_cc_tecnico");
      if (!sel) return;
      const itens = res.items || [];
      sel.innerHTML = '<option value="">— nenhum —</option>' + itens.map(function (t) {
        return '<option value="' + escapeHtml_(t.ID) + '"' + (d.tecnicoId === t.ID ? " selected" : "") + '>' + escapeHtml_(t.NOME) + '</option>';
      }).join("");
    }).catch(function (err) {
      // Sem cadastro de técnicos (ou falha ao ler): o técnico usa o campo de nome livre logo abaixo.
      console.warn("Técnicos do certificado:", err && err.message ? err.message : err);
      const sel = document.getElementById("mob_cc_tecnico");
      if (sel) sel.innerHTML = "<option value=\"\">Lista de técnicos indisponível: use o nome livre abaixo</option>";
    });
  }

  function mobileCertCalProximaCampos_(p) {
    return mobileFieldHtml_("O cliente solicitou a inclusão da data de próxima calibração?", '<select id="mob_cc_proxima_opcao" onchange="mobileCertCalProximaAlternar_()"><option value="NAO"' + (!p.solicitada ? ' selected' : '') + '>Não — emissão sem data (seleção padrão).</option><option value="SIM"' + (p.solicitada ? ' selected' : '') + '>Sim — incluir data informada pelo cliente.</option></select>') +
      '<div id="mob_cc_proxima_campos"' + (!p.solicitada ? ' style="display:none"' : '') + '>' +
      ['data','solicitante','cargoSetor','referencia','observacao'].map(function(k,i) {
        const labels=['Data de próxima calibração definida pelo cliente (dd/mm/aaaa) *','Nome do solicitante *','Cargo ou setor responsável *','Referência da solicitação (OS, e-mail, contrato ou documento) *','Observação complementar'];
        return mobileFieldHtml_(labels[i], '<input id="mob_cc_proxima_' + k + '" value="' + escapeHtml_(p[k] || '') + '"' + (!p.solicitada ? ' disabled' : '') + '>');
      }).join('') + '</div>';
  }

  function mobileCertCalProximaAlternar_() {
    const sim=getValue_("mob_cc_proxima_opcao")==="SIM";
    document.getElementById("mob_cc_proxima_campos").style.display=sim?'':'none';
    ['data','solicitante','cargoSetor','referencia','observacao'].forEach(function(k) {
      const el=document.getElementById("mob_cc_proxima_"+k);el.disabled=!sim;el.required=sim&&k!=="observacao";if(!sim)el.value='';
    });
  }

  function mobileCertCalLerProxima_() {
    const sim=getValue_("mob_cc_proxima_opcao")==="SIM", p={solicitada:sim};
    ['data','solicitante','cargoSetor','referencia','observacao'].forEach(function(k){p[k]=sim?getValue_("mob_cc_proxima_"+k):'';});
    return p;
  }

  function mobileCertCalAvancarDados_() {
    const data = getValue_("mob_cc_data");
    const proxima = mobileCertCalLerProxima_();
    if (!data) return alert("Informe a data da calibração.");
    if (proxima.solicitada && (!proxima.data || !proxima.solicitante || !proxima.cargoSetor || !proxima.referencia)) return alert("Informe a data, o solicitante, o cargo/setor e a referência da solicitação do cliente.");
    MOBILE_CERTCAL.dados = {
      tecnicoId: getValue_("mob_cc_tecnico"),
      tecnicoExecutorLivre: getValue_("mob_cc_tecnico_livre"),
      dataCalibracao: data,
      proximaCalibracao: proxima,
      localCalibracao: getValue_("mob_cc_local"),
      temperaturaAmbiente: getValue_("mob_cc_temp"),
      umidadeRelativa: getValue_("mob_cc_umidade")
    };
    renderMobileCertCalEnsaios_();
  }

  // ---------- Passo 4: Ensaios (blocos) ----------
  function renderMobileCertCalEnsaios_() {
    if (!MOBILE_CERTCAL.dados) { renderMobileCertCalDados_(); return; }
    MOBILE_NAV = { modulo: "certificado_calibracao", tela: "form" };
    atualizarTituloMobile_("Certificado — Ensaios");
    const div = document.getElementById("conteudo");
    if (!div) return;
    div.innerHTML =
      mobileCertCalPasso_(4, "blocos de ensaio") +
      '<div class="mobile-list" id="mobileCertCalBlocosLista"></div>' +
      '<button type="button" class="btn" style="width:100%;margin-top:10px" onclick="mobileCertCalEditarBloco_(-1)">+ Adicionar bloco de ensaio</button>' +
      '<div class="mobile-form-actions" style="margin-top:16px">' +
        '<button type="button" class="mobile-btn-cancelar" onclick="renderMobileCertCalDados_()">Voltar</button>' +
        '<button type="button" class="mobile-btn-salvar" onclick="mobileCertCalAvancarEnsaios_()">Continuar</button>' +
      '</div>';
    mobileCertCalRenderBlocosLista_();
  }

  function mobileCertCalRenderBlocosLista_() {
    const el = document.getElementById("mobileCertCalBlocosLista");
    if (!el) return;
    if (!MOBILE_CERTCAL.blocos.length) { el.innerHTML = '<div class="mobile-card-subtitulo">Nenhum bloco adicionado ainda.</div>'; return; }
    el.innerHTML = MOBILE_CERTCAL.blocos.map(function (b, i) {
      return mobileCardHtml_(b.titulo || "(sem título)", (b.unidade || "") + " · " + SGO_qtd_(b.pontos.length, "ponto", "pontos"), null,
        "mobileCertCalEditarBloco_(" + i + ")");
    }).join("");
  }

  function mobileCertCalAvancarEnsaios_() {
    if (!MOBILE_CERTCAL.blocos.length) return alert("Adicione ao menos 1 bloco de ensaio.");
    delete MOBILE_CERTCAL.veredito;
    renderMobileCertCalGerar_();
  }

  function mobileCertCalEditarBloco_(idx) {
    MOBILE_CERTCAL_BLOCO_EDITANDO = idx;
    const base = idx >= 0 ? MOBILE_CERTCAL.blocos[idx] : { titulo: "", unidade: "", resolucao: "", padroesIds: [], pontos: [{ nominal: "", leituras: ["", "", ""] }] };
    MOBILE_CERTCAL_BLOCO_TEMP = JSON.parse(JSON.stringify(base));
    MOBILE_NAV = { modulo: "certificado_calibracao", tela: "form" };
    atualizarTituloMobile_(idx >= 0 ? "Editar bloco" : "Novo bloco");
    const div = document.getElementById("conteudo");
    if (!div) return;
    div.innerHTML =
      mobileFieldHtml_("Título do ensaio *", '<input type="text" id="mob_cc_bloco_titulo" value="' + escapeHtml_(MOBILE_CERTCAL_BLOCO_TEMP.titulo) + '" placeholder="Ex.: Temperatura">') +
      mobileFieldHtml_("Unidade *", '<input type="text" id="mob_cc_bloco_unidade" value="' + escapeHtml_(MOBILE_CERTCAL_BLOCO_TEMP.unidade) + '" placeholder="Ex.: °C">') +
      // 17/10: resolução do instrumento por bloco, igual ao computador. Em branco, o servidor deduz
      // das leituras (menor incremento) e o certificado informa que foi deduzida.
      mobileFieldHtml_("Resolução do instrumento (na unidade do bloco)", '<input type="text" inputmode="decimal" id="mob_cc_bloco_resolucao" value="' + escapeHtml_(MOBILE_CERTCAL_BLOCO_TEMP.resolucao || "") + '" placeholder="Ex.: 0,1">') +
      '<div class="mobile-card-subtitulo" style="margin:-4px 0 8px">Menor incremento que o instrumento indica. Em branco, o sistema usa o menor incremento das leituras e informa isso no certificado.</div>' +
      '<div class="mobile-frota-secao-titulo">Padrões utilizados</div>' +
      '<div id="mob_cc_bloco_padroes">Carregando...</div>' +
      '<div class="mobile-frota-secao-titulo">Pontos de medição</div>' +
      '<div id="mob_cc_bloco_pontos"></div>' +
      '<button type="button" class="btn" style="width:100%;margin-top:8px" onclick="mobileCertCalAdicionarPonto_()">+ Adicionar ponto</button>' +
      (idx >= 0 ? '<button type="button" class="btn" style="width:100%;margin-top:8px;color:var(--danger)" onclick="mobileCertCalRemoverBlocoAtual_()">Remover este bloco</button>' : '') +
      '<div class="mobile-form-actions">' +
        '<button type="button" class="mobile-btn-cancelar" onclick="renderMobileCertCalEnsaios_()">Cancelar</button>' +
        '<button type="button" class="mobile-btn-salvar" onclick="mobileCertCalSalvarBloco_()">Salvar bloco</button>' +
      '</div>';

    mobileCertCalRenderPontos_();
    mobileCertCalChamarApi_("apiListarPadroesAtivos", {}).then(function (res) {
      const el = document.getElementById("mob_cc_bloco_padroes");
      if (!el) return;
      const itens = res.items || [];
      if (!itens.length) { el.innerHTML = '<div class="mobile-card-subtitulo">Nenhum padrão ativo cadastrado.</div>'; return; }
      // Fase 2 (16/10): cada padrão mostra a validade e a situação. Vencido (na data da calibração)
      // ou com data inválida fica bloqueado aqui, com o motivo; antes o técnico só descobria ao gerar.
      const dataCal = String((MOBILE_CERTCAL.dados && MOBILE_CERTCAL.dados.dataCalibracao) || "");
      const isoDe = function (br) { const m = String(br || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + m[2] + m[1] : ""; };
      const hojeIso = (function () { const d = new Date(); return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); })();
      const refIso = isoDe(dataCal) || hojeIso;
      const cores = { OK: "#1F6B2A", VENCENDO: "#7A5200", VENCIDO: "#A3261B", SEM_VALIDADE: "#5F645F", VALIDADE_INVALIDA: "#A3261B" };
      const nomes = { OK: "Vigente", VENCENDO: "Vence em até 30 dias", VENCIDO: "Vencido", SEM_VALIDADE: "Sem validade informada", VALIDADE_INVALIDA: "Data inválida" };
      el.innerHTML = itens.map(function (p) {
        const valIso = isoDe(p.VALIDADE);
        const vencidoNaData = !!valIso && valIso < refIso;
        const invalida = p.statusValidade === "VALIDADE_INVALIDA";
        const bloqueado = vencidoNaData || invalida;
        const st = vencidoNaData ? "VENCIDO" : (p.statusValidade === "VENCIDO" ? "OK" : (p.statusValidade || "SEM_VALIDADE"));
        if (bloqueado) MOBILE_CERTCAL_BLOCO_TEMP.padroesIds = MOBILE_CERTCAL_BLOCO_TEMP.padroesIds.filter(function (x) { return x !== p.ID; });
        const marcado = !bloqueado && MOBILE_CERTCAL_BLOCO_TEMP.padroesIds.indexOf(p.ID) !== -1;
        const selo = '<span style="display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;color:' + cores[st] + ';border:1px solid ' + cores[st] + '55;background:' + cores[st] + '18">' + nomes[st] + '</span>';
        const motivo = bloqueado
          ? '<div class="mobile-card-subtitulo" style="color:#A3261B;margin:4px 0 0 28px">' + (invalida ? "A validade cadastrada é inválida." : "Vencido em " + escapeHtml_(p.VALIDADE) + (dataCal ? ", antes da data da calibração (" + escapeHtml_(dataCal) + ")." : ".")) + " Não pode ser usado: atualize a validade no computador, em Padrões de referência.</div>"
          : '<div class="mobile-card-subtitulo" style="margin:2px 0 0 28px">Validade: ' + escapeHtml_(p.VALIDADE || "não informada") + '</div>';
        return '<div class="mobile-frota-check-item"><div class="linha">' +
          '<input type="checkbox" id="mob_cc_padrao_' + p.ID + '"' + (marcado ? " checked" : "") + (bloqueado ? " disabled" : "") + ' onchange="mobileCertCalTogglePadrao_(\'' + p.ID + '\', this.checked)">' +
          '<label for="mob_cc_padrao_' + p.ID + '">' + escapeHtml_(p.TAG || p.DESCRICAO || p.ID) + selo + '</label>' +
          '</div>' + motivo + '</div>';
      }).join("");
    }).catch(function (err) { console.error(err); });
  }

  function mobileCertCalRenderPontos_() {
    const el = document.getElementById("mob_cc_bloco_pontos");
    if (!el) return;
    el.innerHTML = MOBILE_CERTCAL_BLOCO_TEMP.pontos.map(function (p, i) {
      return '<div class="mobile-ponto-card">' +
        '<div class="mobile-ponto-linha">' +
          '<input type="text" inputmode="decimal" placeholder="Nominal" value="' + escapeHtml_(p.nominal) + '" oninput="mobileCertCalAtualizarPonto_(' + i + ',this.value)">' +
          (MOBILE_CERTCAL_BLOCO_TEMP.pontos.length > 1 ? '<button type="button" class="mobile-ponto-remover" onclick="mobileCertCalRemoverPonto_(' + i + ')">Remover</button>' : '') +
        '</div>' +
        '<div class="mobile-ponto-leituras">' +
          p.leituras.map(function (l, li) {
            return '<input type="text" inputmode="decimal" placeholder="Leitura ' + (li + 1) + '" value="' + escapeHtml_(l) + '" oninput="mobileCertCalAtualizarLeitura_(' + i + ',' + li + ',this.value)">';
          }).join("") +
        '</div>' +
      '</div>';
    }).join("");
  }

  function mobileCertCalAdicionarPonto_() { MOBILE_CERTCAL_BLOCO_TEMP.pontos.push({ nominal: "", leituras: ["", "", ""] }); mobileCertCalRenderPontos_(); }
  function mobileCertCalRemoverPonto_(i) { MOBILE_CERTCAL_BLOCO_TEMP.pontos.splice(i, 1); mobileCertCalRenderPontos_(); }
  function mobileCertCalAtualizarPonto_(i, valor) { MOBILE_CERTCAL_BLOCO_TEMP.pontos[i].nominal = valor; }
  function mobileCertCalAtualizarLeitura_(i, li, valor) { MOBILE_CERTCAL_BLOCO_TEMP.pontos[i].leituras[li] = valor; }
  function mobileCertCalTogglePadrao_(id, marcado) {
    const idx = MOBILE_CERTCAL_BLOCO_TEMP.padroesIds.indexOf(id);
    if (marcado && idx === -1) MOBILE_CERTCAL_BLOCO_TEMP.padroesIds.push(id);
    if (!marcado && idx !== -1) MOBILE_CERTCAL_BLOCO_TEMP.padroesIds.splice(idx, 1);
  }

  function mobileCertCalSalvarBloco_() {
    const titulo = getValue_("mob_cc_bloco_titulo");
    const unidade = getValue_("mob_cc_bloco_unidade");
    if (!titulo) return alert("Informe o título do ensaio.");
    if (!unidade) return alert("Informe a unidade.");
    MOBILE_CERTCAL_BLOCO_TEMP.titulo = titulo;
    MOBILE_CERTCAL_BLOCO_TEMP.unidade = unidade;
    MOBILE_CERTCAL_BLOCO_TEMP.resolucao = getValue_("mob_cc_bloco_resolucao");
    if (MOBILE_CERTCAL_BLOCO_EDITANDO >= 0) MOBILE_CERTCAL.blocos[MOBILE_CERTCAL_BLOCO_EDITANDO] = MOBILE_CERTCAL_BLOCO_TEMP;
    else MOBILE_CERTCAL.blocos.push(MOBILE_CERTCAL_BLOCO_TEMP);
    renderMobileCertCalEnsaios_();
  }

  function mobileCertCalRemoverBlocoAtual_() {
    if (MOBILE_CERTCAL_BLOCO_EDITANDO >= 0) MOBILE_CERTCAL.blocos.splice(MOBILE_CERTCAL_BLOCO_EDITANDO, 1);
    renderMobileCertCalEnsaios_();
  }

  // PADRÕES DE REFERÊNCIA no celular (17/10): consulta da validade em campo, sem edição.
  // Cadastro, inventário e orçamento continuam no computador.
  let MOBILE_PADROES = [];
  function renderMobilePadroes_() {
    MOBILE_NAV = { modulo: "mobile_home", tela: "lista" };
    atualizarTituloMobile_("Padrões de referência");
    const div = document.getElementById("conteudo");
    if (!div) return;
    div.innerHTML =
      '<div class="mobile-card-subtitulo" style="padding:0 0 10px">Consulta da validade dos padrões ativos. Para cadastrar ou atualizar um padrão, use o computador.</div>' +
      '<input type="text" class="mobile-search" placeholder="Buscar por TAG ou descrição..." oninput="mobilePadroesFiltrar_(this.value)">' +
      '<div class="mobile-list" id="mobilePadroesLista">Carregando...</div>';
    mobileCertCalChamarApi_("apiListarPadroesAtivos", {}).then(function (res) {
      MOBILE_PADROES = (res && res.items) || [];
      mobilePadroesFiltrar_("");
    }).catch(function (err) { mobileErroLista_("mobilePadroesLista", err); });
  }
  function mobilePadroesFiltrar_(termo) {
    const el = document.getElementById("mobilePadroesLista");
    if (!el) return;
    const q = String(termo || "").trim().toLowerCase();
    const nomes = { OK: "Vigente", VENCENDO: "Vence em até 30 dias", VENCIDO: "Vencido", SEM_VALIDADE: "Sem validade informada", VALIDADE_INVALIDA: "Data inválida" };
    const itens = MOBILE_PADROES.filter(function (p) {
      return !q || [p.TAG, p.DESCRICAO, p.FABRICANTE, p.MODELO].some(function (v) { return String(v || "").toLowerCase().indexOf(q) !== -1; });
    });
    if (!itens.length) { el.innerHTML = '<div class="mobile-card-subtitulo">' + (MOBILE_PADROES.length ? "Nenhum padrão encontrado. Confira a busca." : "Nenhum padrão ativo cadastrado. O cadastro é feito no computador, em Padrões de referência.") + '</div>'; return; }
    el.innerHTML = itens.map(function (p) {
      const st = p.statusValidade || "SEM_VALIDADE";
      const classe = st === "OK" ? "" : (st === "VENCENDO" || st === "SEM_VALIDADE" ? " aviso" : " inativo");
      return '<div class="mobile-card" style="display:block;cursor:default">' +
        '<div class="mobile-card-titulo">' + escapeHtml_(p.TAG || p.DESCRICAO || "Padrão") + '</div>' +
        (p.DESCRICAO && p.TAG ? '<div class="mobile-card-subtitulo">' + escapeHtml_(p.DESCRICAO) + '</div>' : '') +
        '<div class="mobile-card-subtitulo">Validade: ' + escapeHtml_(p.VALIDADE || "não informada") + '</div>' +
        '<div class="mobile-card-status' + classe + '">' + escapeHtml_(nomes[st] || st) + '</div></div>';
    }).join("");
  }

  // 17/10: o passo da avaliação pelo cliente saiu do celular (virou nota no certificado, como no
  // computador) e as fotos entraram no passo da emissão. Nomes antigos mantidos como atalhos.
  function renderMobileCertCalVeredito_() { renderMobileCertCalGerar_(); }
  function mobileCertCalAvancarVeredito_() { delete MOBILE_CERTCAL.veredito; renderMobileCertCalGerar_(); }
  function renderMobileCertCalFotos_() { renderMobileCertCalGerar_(); }

  function mobileCertCalOnFotos_() {
    const input = document.getElementById("mob_cc_fotosInput");
    const arquivos = Array.prototype.slice.call((input && input.files) || []).slice(0, 8);
    const comprimir = typeof frotaComprimirImagem_ === "function" ? frotaComprimirImagem_ : mobileFrota_lerArquivoComoBase64_;
    Promise.all(arquivos.map(function (f) { return comprimir(f, 1280, 0.72); })).then(function (lidos) {
      lidos.filter(Boolean).forEach(function (f) { MOBILE_CERTCAL.fotos.push({ base64: f.base64, mimeType: f.mimeType, legenda: "" }); });
      mobileCertCalRenderFotos_();
      if (input) input.value = "";
    });
  }

  function mobileCertCalRemoverFoto_(idx) { MOBILE_CERTCAL.fotos.splice(idx, 1); mobileCertCalRenderFotos_(); }

  function mobileCertCalRenderFotos_() {
    const el = document.getElementById("mob_cc_fotosLista");
    if (!el) return;
    const resumo = document.getElementById("mob_cc_resumo_qtd");
    if (resumo) resumo.textContent = SGO_qtd_(MOBILE_CERTCAL.blocos.length, "bloco de ensaio", "blocos de ensaio") + ", " + SGO_qtd_(MOBILE_CERTCAL.fotos.length, "foto", "fotos");
    el.innerHTML = MOBILE_CERTCAL.fotos.map(function (f, i) {
      return '<div class="mobile-frota-foto-thumb"><img src="data:' + f.mimeType + ';base64,' + f.base64 + '">' +

  }

  function mobileCertCalGerar_() {
    const payload = {
      clienteId: MOBILE_CERTCAL.cliente.ID,
      equipamentoId: MOBILE_CERTCAL.equipamento.ID,
      tecnicoId: MOBILE_CERTCAL.dados.tecnicoId,
      tecnicoExecutorLivre: MOBILE_CERTCAL.dados.tecnicoExecutorLivre,
      dataCalibracao: MOBILE_CERTCAL.dados.dataCalibracao,
      proximaCalibracao: MOBILE_CERTCAL.dados.proximaCalibracao || {solicitada:false},
      localCalibracao: MOBILE_CERTCAL.dados.localCalibracao,
      temperaturaAmbiente: MOBILE_CERTCAL.dados.temperaturaAmbiente,
      umidadeRelativa: MOBILE_CERTCAL.dados.umidadeRelativa,
      blocos: MOBILE_CERTCAL.blocos.map(function (b) {
        return {
          titulo: b.titulo, unidade: b.unidade, resolucao: b.resolucao || "", padroesIds: b.padroesIds,
          pontos: b.pontos.map(function (p) {
            return {
              nominal: p.nominal,
              leituras: p.leituras.slice()
            };
          })
        };
      }),
      fotos: MOBILE_CERTCAL.fotos
    };

    const btn = document.getElementById("mob_cc_btn_gerar");
    if (btn) btn.disabled = true;
    const status = document.getElementById("mob_cc_gerar_status");
    if (status) status.innerHTML = '<div class="mobile-frota-alerta aviso">Calculando e montando o certificado...</div>';

    const janela = window.open("", "_blank");
    if (janela) janela.document.write('<p style="font-family:Arial,sans-serif;padding:40px;color:#374151;">Gerando certificado, aguarde...</p>');

    mobileCertCalChamarApi_("apiGerarCertificado", payload).then(function (res) {
      MOBILE_CERTCAL.certificadoEmitidoId = res.certificadoId;
      if (btn) btn.disabled = false;
      if (janela && !janela.closed) {
        janela.document.open();
        janela.document.write(res.html);
        janela.document.close();
      }
      if (status) status.innerHTML = '<div class="mobile-frota-alerta">Certificado nº ' + escapeHtml_(res.numeroCertificado) + ' emitido. <a href="' + escapeHtml_(res.linkPdf) + '" target="_blank">Abrir PDF salvo</a></div>' +
        ((res.avisos || []).length ? '<div class="mobile-frota-alerta aviso">Documento salvo. Pendências: ' + res.avisos.map(function(aviso) { return escapeHtml_(aviso); }).join(' · ') + '</div>' : '') +
        '<button type="button" class="mobile-btn-salvar" id="mob_cc_btn_relatorio" onclick="mobileCertCalGerarInterpretativo_()">Gerar relatório interpretativo</button><div id="mob_cc_relatorio_status"></div>';
    }).catch(function (err) {
      if (btn) btn.disabled = false;
      const msg = (err && err.message) ? err.message : String(err);
      if (janela && !janela.closed) janela.document.write('<p style="color:red">Não foi possível gerar o documento. ' + escapeHtml_(msg) + '</p>');
      if (status) status.innerHTML = '<div class="mobile-frota-alerta critico">Não foi possível gerar o documento. ' + escapeHtml_(msg) + '</div>';
    });
  }

  function mobileCertCalGerarInterpretativo_() {
    const certificadoId = MOBILE_CERTCAL.certificadoEmitidoId;
    if (!certificadoId) return alert("Emita o certificado antes de gerar o relatório interpretativo.");
    const btn = document.getElementById("mob_cc_btn_relatorio");
    const status = document.getElementById("mob_cc_relatorio_status");
    if (btn && btn.disabled) return;
    if (btn) btn.disabled = true;
    if (status) status.textContent = "Preparando relatório a partir do certificado emitido...";
    return mobileCertCalChamarApi_("apiGerarRelatorioInterpretativo", { certificadoId: certificadoId }).then(function(res) {
      if (status) status.innerHTML = '<a href="' + escapeHtml_(res.linkPdf) + '" target="_blank">Abrir PDF do relatório interpretativo</a>' +
        ((res.avisos || []).length ? '<div class="mobile-frota-alerta aviso">Documento salvo. Pendências: ' + res.avisos.map(function(aviso) { return escapeHtml_(aviso); }).join(' · ') + '</div>' : '');
    }).catch(function(err) {
      if (status) status.textContent = "Não foi possível gerar o relatório. " + ((err && err.message) || String(err));
    }).finally(function() { if (btn) btn.disabled = false; });
  }

  // Celular (17/10): as demais telas do menu, nos mesmos grupos e na mesma ordem do menu lateral
  // (lidas do próprio #menu, que já tem as regras de perfil aplicadas). Antes elas não tinham
  // caminho no celular, ou levavam a "disponível apenas na versão para computador".
  function SGO_movelOutrasTelasHtml_(jaNaGrade) {
    const naGrade = {};
    (jaNaGrade || []).forEach(function (m) { naGrade[m] = true; });
    const grupos = [];
    document.querySelectorAll("#menu .menu-grupo").forEach(function (g) {
      if (g.classList.contains("menu-grupo-vazio") || g.style.display === "none") return;
      const itens = [];
      g.querySelectorAll(".menu-btn").forEach(function (b) {
        if (b.style.display === "none") return;
        const mod = b.getAttribute("data-mod"), atalho = b.getAttribute("data-atalho");
        if ((!mod && !atalho) || mod === "dashboard" || (mod && naGrade[mod]) || atalho === "padroes") return;
        const c = b.cloneNode(true);
        c.querySelectorAll(".menu-badge").forEach(function (x) { x.remove(); });
        const ic = c.querySelector(".menu-btn-icon");
        const icone = ic ? ic.innerHTML : "";
        if (ic) ic.remove();
        const nome = c.textContent.replace(/\s+/g, " ").trim();
        const acao = mod ? "abrir('" + mod + "')" : "Menu_atalho_('" + atalho + "')";
        itens.push('<button type="button" class="movel-tela-item" onclick="' + acao + '">' +
          '<span class="movel-tela-icone">' + icone + '</span><span class="movel-tela-nome">' + escapeHtml_(nome) + '</span>' +
          '<i class="fas fa-chevron-right movel-tela-seta" aria-hidden="true"></i></button>');
      });
      if (!itens.length) return;
      const nomeEl = g.querySelector(".menu-grupo-nome");
      grupos.push('<details class="movel-telas-grupo"><summary><span>' + escapeHtml_(nomeEl ? nomeEl.textContent.trim() : "Principal") +
        '</span><span class="movel-telas-qtd">' + itens.length + '</span></summary><div class="movel-telas-itens">' + itens.join("") + '</div></details>');
    });
    if (!grupos.length) return "";
    return '<div class="mobile-home-titulo movel-telas-titulo">Outras telas</div><div class="movel-telas">' + grupos.join("") + '</div>';
  }

  // ==========================================
  let MOBILE_NAV = { modulo: null, tela: null };
  let MOBILE_BUSCA_TIMER = null;
  let MOBILE_DOC_ARQUIVO = { base64: "", mime: "", nome: "" };

  // Certificado de Calibração — wizard mobile próprio (2026-09-01, ver
  // plano "mobile de verdade"). MOBILE_CERTCAL_RETORNO sinaliza pros
  // formulários de Cliente/Equipamento (mobileClientesSalvar_/
  // mobileEquipamentosSalvar_) que, ao salvar um cadastro NOVO, devem
  // voltar pro wizard em vez de ir pra lista — usado quando o técnico
  // está num primeiro atendimento e precisa cadastrar na hora.
  let MOBILE_CERTCAL = { cliente: null, equipamento: null, blocos: [], fotos: [] };
  let MOBILE_CERTCAL_RETORNO = null;
  let MOBILE_CERTCAL_BLOCO_TEMP = null;
  let MOBILE_CERTCAL_BLOCO_EDITANDO = -1;

  function atualizarTituloMobile_(texto) {
    const el = document.getElementById("mobileTopbarTitulo");
    if (el) el.innerText = texto || "Menu";
  }

  function voltarMobile_() {
    // Limpa o "gancho de retorno" do wizard do Certificado de Calibração —
    // sem isto, cancelar um cadastro de cliente/equipamento aberto A PARTIR
    // do wizard deixava a flag presa, e o PRÓXIMO cadastro novo (sem

  function mobileBuscarComDebounce_(fn, valor) {
    clearTimeout(MOBILE_BUSCA_TIMER);
    MOBILE_BUSCA_TIMER = setTimeout(function () { fn(valor); }, 350);
  }

  // Situação legível nos cartões do celular ("Ativo", "Inativo", "Em uso"), sem caixa alta.
  function mobileRotuloStatus_(s) {
    const k = String(s || "").trim().toUpperCase();
    const mapa = { ATIVO: "Ativo", INATIVO: "Inativo", PENDENTE: "Pendente", BLOQUEADO: "Bloqueado", EM_USO: "Em uso", "EM USO": "Em uso" };
    if (mapa[k]) return mapa[k];
    const t = String(s || "").trim();
    return t === t.toUpperCase() ? t.charAt(0) + t.slice(1).toLowerCase() : t;
  }
  function mobileCnpj_(v) {
    const d = String(v || "").replace(/[^0-9]/g, "");
    return d.length === 14 ? d.replace(/^([0-9]{2})([0-9]{3})([0-9]{3})([0-9]{4})([0-9]{2})$/, "$1.$2.$3/$4-$5") : String(v || "");
  }

  function mobileCardHtml_(titulo, subtitulo, statusTexto, onclickJs) {
    const statusUpper = String(statusTexto || "").toUpperCase();
    const statusClasse = (statusUpper === "INATIVO" || statusUpper === "BLOQUEADO") ? " inativo" : ((statusUpper === "EM USO" || statusUpper === "EM_USO" || statusUpper === "PENDENTE") ? " aviso" : "");
    return '<button type="button" class="mobile-card" onclick="' + onclickJs + '">' +
      '<div class="mobile-card-titulo">' + escapeHtml_(titulo || "-") + '</div>' +
      (subtitulo ? '<div class="mobile-card-subtitulo">' + escapeHtml_(subtitulo) + '</div>' : '') +
      (statusTexto ? '<div class="mobile-card-status' + statusClasse + '">' + escapeHtml_(mobileRotuloStatus_(statusTexto)) + '</div>' : '') +
      '</button>';
  }

    return '<div class="mobile-field"><label>' + escapeHtml_(label) + '</label>' + innerHtml + '</div>';

  function mobileRenderListaGenerica_(containerId, res, construirCardFn) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (!res || !res.success) {
      container.innerHTML = '<div class="mobile-card-subtitulo">' + escapeHtml_((res && res.message) || "Não foi possível carregar. Tente de novo.") + '</div>';
      return;
    }

    const itens = Array.isArray(res.items) ? res.items : [];
    if (!itens.length) {
      const vazios = {
        mobileListaClientes: 'Nenhum cliente encontrado. Confira a busca ou toque em + Novo cliente.',
        mobileListaUnidades: 'Nenhuma unidade encontrada. Confira a busca ou toque em + Nova unidade.',
        mobileListaEquipamentos: 'Nenhum equipamento encontrado. Confira a busca ou toque em + Novo equipamento.',
        mobileListaDocumentos: 'Nenhum documento cadastrado. Toque em + Novo documento para enviar o primeiro.',
        mobileCertCalListaClientes: 'Nenhum cliente encontrado. Confira a busca ou toque em + Novo cliente.',
        mobileCertCalListaEquip: 'Nenhum equipamento deste cliente. Toque em + Novo equipamento para cadastrar.'
      };
      container.innerHTML = '<div class="mobile-card-subtitulo">' + escapeHtml_(vazios[containerId] || 'Nada encontrado. Confira a busca.') + '</div>';
      return;
    }

    container.innerHTML = itens.map(construirCardFn).join("");
  }

    console.error(err);

    // operador nunca no limbo: diz o que houve e oferece tentar de novo na mesma tela

  }

  // ==========================================
  // CONDUTA — tela mobile própria, enxuta (2026-09-02): registro rápido
  // de ocorrência/reconhecimento, sem homologação/contestação/fechamento
  // (isso é fluxo de gestor, fica só no desktop — mesma regra já
  // aplicada ao resto do sistema nesta sessão). Reaproveita o mesmo
  // backend do desktop (Conduta_apiDispatch).
  // ==========================================
  let MOBILE_CONDUTA_COLEGAS = null;
  let MOBILE_CONDUTA_CATALOGO = null;
  let MOBILE_CONDUTA_EVENTOS_POS = null;
  let MOBILE_CONDUTA_OCORRENCIAS = [];

  function mobileCondutaDataBR_(v) {
    const m = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[3] + "/" + m[2] + "/" + m[1]) : String(v || "");
  }

  // Defesa pelo celular: contestar (3 dias úteis) e recorrer (2 dias úteis).
  function mobileCondutaAbrirDefesa_(id, modo) {
    const oc = MOBILE_CONDUTA_OCORRENCIAS.filter(function (x) { return String(x.ID) === String(id); })[0];
    if (!oc) return alert("Não foi possível carregar a ocorrência. Volte e abra a tela de novo.");
    MOBILE_NAV = { modulo: "conduta", tela: "form" };
    atualizarTituloMobile_(modo === "CONTESTAR" ? "Contestar ocorrência" : "Recorrer");
    const div = document.getElementById("conteudo");
    if (!div) return;
    const prazo = modo === "CONTESTAR" ? oc.PRAZO_CONTESTACAO : oc.PRAZO_RECURSO;
    div.innerHTML =
      '<div class="mobile-form">' +
        '<div class="mobile-card" style="display:block">' +
          '<div><strong>' + escapeHtml_(oc.TIPO_CODIGO || "") + '</strong> · ' + escapeHtml_(mobileCondutaDataBR_(oc.DATA_FATO)) + '</div>' +

          (oc.FOTO_URL ? '<div class="mobile-card-subtitulo"><a href="' + escapeHtml_(oc.FOTO_URL) + '" target="_blank" rel="noopener">ver foto anexada</a></div>' : "") +
        '</div>' +
        mobileFieldHtml_(modo === "CONTESTAR" ? "Sua contestação *" : "Motivo do recurso *",
          '<textarea id="mob_cond_defesa" rows="5" placeholder="Explique o que aconteceu do seu ponto de vista."></textarea>') +
        '<div class="mobile-form-actions">' +
          '<button type="button" class="mobile-btn-cancelar" onclick="renderMobileConduta_()">Cancelar</button>' +
          '<button type="button" class="mobile-btn-salvar" onclick="mobileCondutaEnviarDefesa_(\'' + id + '\',\'' + modo + '\')">Enviar</button>' +
        '</div>' +

  function mobileCondutaEnviarDefesa_(id, modo) {
    const texto = getValue_("mob_cond_defesa");
    if (!String(texto || "").trim()) return alert("Escreva o motivo — o texto é obrigatório.");
    const fn = modo === "CONTESTAR" ? "apiContestarOcorrencia" : "apiRecorrerOcorrencia";
    mobileCondutaChamarApi_(fn, { id: id, texto: texto }, function (res) {
      if (!res || !res.success) return alert((res && res.message) || "Não foi possível enviar.");
      alert(modo === "CONTESTAR" ? "Contestação enviada — a gestão vai julgar." : "Recurso enviado — a gestão vai julgar.");
      renderMobileConduta_();
    });
  }

  // CORREÇÃO 2026-09-24: no celular não havia NENHUMA trava de duplo toque nem
  // aviso de "salvando". Em 3G o técnico tocava "Registrar", a tela não mudava
  // por alguns segundos, ele tocava de novo -- e gravava DUAS ocorrências
  // contra o mesmo colega, com o dobro do demérito no bônus da equipe. O
  // desktop já era protegido (CONDUTA_API_EM_VOO + overlay); o celular, que é
  // a tela que a equipe de campo realmente usa, não.
  let MOBILE_CONDUTA_EM_VOO = false;

  function mobileCondutaChamarApi_(fn, payload, onSucesso, onErro) {
    const altera = /Registrar|Remover|Fechar|Gerar|Processar|Homologar|Contestar|Julgar|Recorrer|Cadastrar|Upload|Decidir/.test(fn);
    if (altera) {
      if (MOBILE_CONDUTA_EM_VOO) return; // segundo toque: ignora em silêncio
      MOBILE_CONDUTA_EM_VOO = true;
      SGO_iniciarCarregamento_("Aguarde, salvando...");
    }
    function encerrar_() {
      if (!altera) return;
      MOBILE_CONDUTA_EM_VOO = false;
      SGO_finalizarCarregamento_();
    }
    google.script.run
      .withSuccessHandler(function (r) { encerrar_(); if (onSucesso) onSucesso(r); })
      .withFailureHandler(function (err) {
        encerrar_();
        if (onErro) { onErro(err); return; }
        console.error("Falha na chamada do Programa de Conduta:", err);
        alert("Não foi possível concluir a operação. Verifique a conexão e tente de novo.");
      })
      .Conduta_apiDispatch({ sessionId: SESSION, fn: fn, payload: payload || {} });
  }

      '</div>' +
      '<button type="button" class="mobile-btn-cancelar mobile-btn-linha" onclick="renderMobileCondutaFormMissao_()">Registrar missão</button>' +

      '<div class="mobile-list" id="mobileCondutaMissoes">Carregando...</div>';
    mobileCondutaCarregarMissoes_();

    mobileCondutaChamarApi_("apiObterFarolAtual", {}, function (res) {
      const el = document.getElementById("mobileCondutaFarol");
      if (!el) return;
      if (!res) { el.style.display = "none"; return; }
      const corVar = res.farol === "VERDE" ? "var(--success)" : (res.farol === "AMARELO" ? "var(--warning)" : "var(--danger)");

      el.innerHTML = '<div class="farol-mini-linha">' +
        '<div class="farol-gauge-mini">' + Conduta_montarGaugeSvg_(res.ico, res.farol) + '</div>' +
        '<div><strong>' + escapeHtml_(res.titulo) + '</strong><br>' + escapeHtml_(res.linha) + Conduta_extrasFarolHtml_(res, true) + '</div>' +

    }, function (err) {

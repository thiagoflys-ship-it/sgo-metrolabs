<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg:#111827;--card:#1f2937;--text:#eef3f8;--muted:#9aa8b8;--line:#3a4657;--brand:#7aa7c7;--ok:#8fd6a3;--warn:#e7bd73;--err:#f2b8b8;--field:#172033}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:18px}
    header{padding:10px 0 16px}
    h1{font-size:22px;margin:0 0 4px;color:var(--text);letter-spacing:0}
    h2{font-size:17px;margin:0 0 10px;color:var(--text);letter-spacing:0}
    p{margin:4px 0;color:var(--muted);line-height:1.45}
    .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0;box-shadow:0 10px 26px rgba(0,0,0,.18)}
    label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px;color:#d9e2ec}
    input,select,textarea,button{width:100%;font:inherit;border-radius:6px}
    input,select,textarea{border:1px solid var(--line);padding:10px;background:var(--field);color:var(--text);outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(122,167,199,.16)}
    textarea{min-height:86px;resize:vertical}
    button{border:1px solid rgba(122,167,199,.42);background:#273244;color:#eef3f8;padding:12px;font-weight:bold;margin-top:12px;cursor:pointer}
    button:hover{background:rgba(122,167,199,.14)}
    button.secondary{background:#273244;color:#d9e2ec;border-color:var(--line)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .status{padding:10px;border-radius:6px;margin:10px 0;font-size:13px;border:1px solid var(--line)}
    .ok{background:rgba(143,214,163,.12);color:var(--ok);border-color:rgba(143,214,163,.34)}
    .warn{background:rgba(231,189,115,.12);color:var(--warn);border-color:rgba(231,189,115,.34)}
    .err{background:rgba(242,184,184,.12);color:var(--err);border-color:rgba(242,184,184,.38)}
    .item{border-top:1px solid var(--line);padding:10px 0}
    .item:first-child{border-top:0}
    .pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;background:#273244;color:#d9e2ec;border:1px solid var(--line)}
    .money{font-weight:bold;color:var(--text)}
    @media(max-width:560px){.wrap{padding:14px}.grid{grid-template-columns:1fr}h1{font-size:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Prestação de contas Flash</h1>
      <p id="finPrestacaoPessoa">Carregando dados do cartão...</p>
    </header>

    <section id="finPrestacaoStatus"></section>

    <section class="card">
      <h2>Enviar prestação</h2>
      <div class="grid">
        <div><label>Data do gasto</label><input id="fpData" type="date"></div>
        <div><label>Valor</label><input id="fpValor" type="number" step="0.01" min="0"></div>
      </div>
      <label>Estabelecimento</label><input id="fpEstabelecimento" type="text" autocomplete="off">
      <label>Finalidade</label><textarea id="fpFinalidade" placeholder="Explique o motivo da despesa"></textarea>
      <div class="grid">
        <div><label>Existe O.S.?</label><select id="fpTemOs"><option value="SIM">Sim</option><option value="NAO">Não</option></select></div>
        <div><label>Número da OS</label><input id="fpOsNumero" type="text" autocomplete="off"></div>
      </div>
      <label>Justificativa quando não houver O.S.</label><textarea id="fpJustificativa"></textarea>
      <label>Comprovante / foto</label><input id="fpArquivo" type="file" accept="image/*,.pdf" capture="environment">
      <label>Observações</label><textarea id="fpObs"></textarea>
      <button id="fpEnviar" type="button" onclick="finPrestacaoEnviar_()">Enviar prestação</button>
    </section>

    <section class="card">
      <h2>Pendências</h2>
      <div id="fpPendencias"><p>Nenhuma pendência carregada.</p></div>
    </section>

    <section class="card">
      <h2>Histórico de prestações</h2>
      <div id="fpHistorico"><p>Nenhuma prestação carregada.</p></div>
    </section>
  </main>

  <script>
    var FIN_PRESTACAO_TOKEN = <?!= PRESTACAO_TOKEN_JSON ?>;

    function fpEl(id){ return document.getElementById(id); }
    function fpText(v){ return String(v == null ? '' : v); }
    function fpHtml(v){ return fpText(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function fpMoeda(v){ return Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
    function fpStatus(msg, cls){ fpEl('finPrestacaoStatus').innerHTML = '<div class="status '+(cls||'warn')+'">'+fpHtml(msg)+'</div>'; }

    function finPrestacaoCarregar_(){
      if(!FIN_PRESTACAO_TOKEN){ fpStatus('Token de prestação não informado.', 'err'); return; }
      google.script.run
        .withSuccessHandler(finPrestacaoRender_)
        .withFailureHandler(function(e){ fpStatus(e && e.message ? e.message : e, 'err'); })
        .finFlashObterPrestacaoPublicaPorTokenV1(FIN_PRESTACAO_TOKEN);
    }

    function finPrestacaoRender_(r){
      if(!r || !r.ok){ fpStatus((r && r.message) || 'Não foi possível carregar a prestação.', 'err'); return; }
      var c = r.colaborador || {};
      fpEl('finPrestacaoPessoa').textContent = (c.funcionarioNome || 'Colaborador') + ' - Cartão ' + (c.cartaoFinal || c.cartaoId || '');
      fpStatus('Ambiente pronto para envio de prestação com comprovante.', 'ok');
      finPrestacaoRenderLista_(r.prestações || [], 'fpHistorico', false);
      finPrestacaoRenderLista_(r.pendencias || [], 'fpPendencias', true);
    }

    function finPrestacaoRenderLista_(items, alvo, pendencia){
      if(!items.length){ fpEl(alvo).innerHTML = '<p>Nenhum registro encontrado.</p>'; return; }
      fpEl(alvo).innerHTML = items.map(function(x){
        if(pendencia){
          return '<div class="item"><span class="pill">'+fpHtml(x.status)+'</span><p>'+fpHtml(x.descricaoPendencia)+'</p><p class="money">'+fpMoeda(x.valorEnvolvido)+'</p>' +
            '<textarea id="esc_'+fpHtml(x.pendenciaId || x.id)+'" placeholder="Escreva o esclarecimento"></textarea>' +
            '<button class="secondary" type="button" onclick="finPrestacaoRegularizar_(\''+fpHtml(x.pendenciaId || x.id)+'\')">Enviar esclarecimento</button></div>';
        }
        return '<div class="item"><span class="pill">'+fpHtml(x.statusPrestacao)+'</span><p>'+fpHtml(x.dataGasto)+' - '+fpHtml(x.estabelecimento)+'</p><p class="money">'+fpMoeda(x.valor)+'</p><p>'+fpHtml(x.descricaoGasto)+'</p></div>';
      }).join('');
    }

    function finPrestacaoArquivo_(cb){
      var f = fpEl('fpArquivo').files[0];
      if(!f){ cb(null); return; }
      var reader = new FileReader();
      reader.onload = function(){ cb({nomeArquivo:f.name,mimeType:f.type,dataUrl:reader.result}); };
      reader.onerror = function(){ fpStatus('Não foi possível ler o comprovante.', 'err'); };
      reader.readAsDataURL(f);
    }

    function finPrestacaoEnviar_(){
      fpEl('fpEnviar').disabled = true;
      finPrestacaoArquivo_(function(arquivo){
        var payload = {
          token: FIN_PRESTACAO_TOKEN,
          dataGasto: fpEl('fpData').value,
          valor: fpEl('fpValor').value,
          estabelecimento: fpEl('fpEstabelecimento').value,
          finalidade: fpEl('fpFinalidade').value,
          temOs: fpEl('fpTemOs').value,
          osNumero: fpEl('fpOsNumero').value,
          justificativaSemOs: fpEl('fpJustificativa').value,
          observacoes: fpEl('fpObs').value,
          arquivo: arquivo
        };
        google.script.run
          .withSuccessHandler(function(r){
            fpEl('fpEnviar').disabled = false;
            if(!r || !r.ok){ fpStatus((r && r.message) || 'Prestação não enviada.', 'err'); return; }
            fpStatus('Prestação enviada com sucesso.', 'ok');
            fpEl('fpArquivo').value = '';
            finPrestacaoCarregar_();
          })
          .withFailureHandler(function(e){ fpEl('fpEnviar').disabled = false; fpStatus(e && e.message ? e.message : e, 'err'); })
          .finFlashEnviarPrestacaoPublicaV1(payload);
      });
    }

    function finPrestacaoRegularizar_(id){
      var texto = fpEl('esc_'+id) ? fpEl('esc_'+id).value : '';
      google.script.run
        .withSuccessHandler(function(r){
          if(!r || !r.ok){ fpStatus((r && r.message) || 'Esclarecimento não enviado.', 'err'); return; }
          fpStatus('Esclarecimento enviado.', 'ok');
          finPrestacaoCarregar_();
        })
        .withFailureHandler(function(e){ fpStatus(e && e.message ? e.message : e, 'err'); })
        .finFlashRegularizarPendenciaPublicaV1({token:FIN_PRESTACAO_TOKEN,pendenciaId:id,esclarecimentoTexto:texto});
    }

    finPrestacaoCarregar_();
  </script>
</body>
</html>

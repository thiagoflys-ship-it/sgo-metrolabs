<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Financeiro · SGO+ (protótipo, dados fictícios)</title>
  <!-- Mesmas fontes e ícones do Index.html do SGO+ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Estilos REAIS do SGO+ (copiados da cand34 por extrair-css.cjs) + a extensão do Financeiro v2 -->
  <link rel="stylesheet" href="css/sgo-ui-estilos.css">
  <link rel="stylesheet" href="css/sgo-comercial.css">
  <link rel="stylesheet" href="css/sgo-atividades-modal.css">
  <link rel="stylesheet" href="css/financeiro-v2.css">
  <style>
    /* só do protótipo: seletor "Ver como" na barra do topo */
    .fv-prot-papel { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .fv-prot-papel select { min-height: 32px; font-size: 12px; }
    .app-shell.modo-mobile .fv-prot-mob { display: flex; }
    .fv-prot-mob { display: none; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <header id="topo" class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo-block">
          <div class="topbar-brand">
            <div class="topbar-title">SGO<span class="topbar-title-plus">+</span></div>
            <div class="topbar-subtitle">Metrolabs · Painel Operacional</div>
          </div>
        </div>
      </div>
      <div class="topbar-center">
        <button type="button" class="busca-gatilho" title="Busca rápida (Ctrl K)">
          <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
          <span class="busca-gatilho-texto">Buscar TAG, cliente, certificado ou tela</span>
          <kbd class="busca-gatilho-tecla">Ctrl K</kbd>
        </button>
      </div>
      <div class="topbar-right">
        <div class="topbar-info-block"><div class="relogio-texto">19/11/2026, 10:42</div></div>
        <div class="user-action-block">
          <label class="fv-prot-papel" title="Só no protótipo: ver a tela como cada pessoa">Ver como
            <select id="fvPapel"><option value="WANESSA">Wanessa</option><option value="CHARLES">Charles</option><option value="DONO">Dono</option></select></label>
          <div id="userInfo" class="user-info"></div>
          <button type="button" class="btn-logout topo-ico"><i class="fas fa-circle-question" aria-hidden="true"></i> Dúvida</button>
          <button type="button" class="btn-logout">Sair</button>
        </div>
      </div>
    </header>

    <div class="main-layout">
      <aside id="menu" class="sidebar" aria-label="Menu principal"></aside>
      <main class="content-area">
        <section id="conteudo" class="content-panel"></section>
      </main>
    </div>

    <div class="mobile-topbar">
      <button type="button" class="mobile-topbar-btn mobile-topbar-voltar" aria-label="Voltar"><i class="fas fa-arrow-left" aria-hidden="true"></i><span>Voltar</span></button>
      <div id="mobileTopbarTitulo" class="mobile-topbar-titulo">Financeiro</div>
      <button type="button" class="mobile-topbar-btn mobile-topbar-busca" aria-label="Buscar"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></button>
      <button type="button" class="mobile-topbar-btn mobile-topbar-ajuda" aria-label="Como usar esta tela"><i class="fas fa-circle-question" aria-hidden="true"></i><span>Ajuda</span></button>
    </div>
  </div>
  <div id="fvMarca" class="fv-marca" aria-hidden="true"></div>

  <script src="js/fv-dados.js"></script>
  <script src="js/fv-base.js"></script>
  <script src="js/fv-graficos.js"></script>
  <script src="js/fv-painel.js"></script>
  <script src="js/fv-paginas.js"></script>
  <script src="js/fv-app.js"></script>
</body>
</html>

<style>
#tplCadeiaFrioRel_pops { margin: 16px 0; color: var(--bc-text); }
#tplCadeiaFrioRel_pops .cf-pop-capa { padding: 14px 0 16px; border-bottom: 1px solid var(--bc-line); }
#tplCadeiaFrioRel_pops .cf-pop-capa h2 { margin: 0 0 6px; font-size: clamp(21px,3vw,28px); color: var(--bc-text); }
#tplCadeiaFrioRel_pops .cf-pop-capa p, #tplCadeiaFrioRel_pops .cf-pop-card p { text-align: left !important; }
#tplCadeiaFrioRel_pops .cf-pop-capa p { margin: 0 0 8px; color: var(--bc-text-3); }
.cf-pop-resumo { font-size: 12px; font-weight: 700; color: var(--bc-text-3); }

.cf-pop-grupo { margin-top: 22px; }
.cf-pop-grupo h3 { font-size: 17px; margin: 0 0 10px; }
.cf-pop-grupo h3 span { margin-right: 6px; }
.cf-pop-grade { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
.cf-pop-card { display:flex; flex-direction:column; min-width: 0; padding: 15px; border:1px solid var(--bc-line); border-radius:10px; background:var(--bc-surface); }
.cf-pop-meta { display:flex; flex-wrap:wrap; justify-content:space-between; gap:5px 10px; font-size:11px; font-weight:700; color:var(--bc-text-3); }
.cf-pop-card h4 { margin: 10px 0 4px; font-size:16px; overflow-wrap:anywhere; }
.cf-pop-card p { margin: 0 0 12px; color:var(--bc-text-3); font-size:13px; }
.cf-pop-acoes { display:flex; flex-wrap:wrap; gap:7px; margin-top:auto; }
.cf-pop-acoes a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 9px; border:1px solid var(--bc-line); border-radius:7px; color:inherit; text-decoration:none; font-size:13px; font-weight:700; }
.cf-pop-acoes .cf-pop-consultar { background:#155e63; border-color:#155e63; color:#fff; }
.cf-pop-acoes a:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
@media (max-width: 950px) { .cf-pop-grade { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 600px) { .cf-pop-grade { grid-template-columns: 1fr; } }
</style>
<script>
  function tplCadeiaFrioRel_area_(area) {
    if (typeof tplCadeiaFrioRel_voltarDoManual_ === 'function') tplCadeiaFrioRel_voltarDoManual_();
    [
      ['relatorios', 'cfAreaRelatorios', 'tplCadeiaFrioRelRelatorios'],
      ['pops', 'cfAreaPops', 'tplCadeiaFrioRelEntrada'],
      ['formulario', 'cfAreaFormulario', 'tplCadeiaFrioRelContainer']
    ].forEach(function (item) {
      const botao = document.getElementById(item[1]);
      const ativo = item[0] === area;
      document.getElementById(item[2]).style.display = ativo ? '' : 'none';
      botao.classList.toggle('active', ativo);
      botao.setAttribute('aria-pressed', String(ativo));
    });
  }
  let tplCadeiaFrioRel_carregado_ = false;
  let tplCadeiaFrioRel_pendente_ = false;
  let tplCadeiaFrioRel_tentativa_ = 0;
  function tplCadeiaFrioRel_falhaCarga_(erro) {
    const container = document.getElementById('tplCadeiaFrioRelContainer');
    if (!container) return;
    container.replaceChildren();
    const aviso = document.createElement('p');
    aviso.style.cssText = 'padding:20px;color:var(--bc-danger);';
    aviso.textContent = 'Não foi possível abrir Cadeia de Frio: ' + (erro && erro.message ? erro.message : String(erro));
    const botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'btn btn-primary';
    botao.textContent = 'Tentar novamente';
    botao.addEventListener('click', renderTplCadeiaFrioRel_);
    container.append(aviso, botao);
  }
  function renderTplCadeiaFrioRel_() {
    const container = document.getElementById('tplCadeiaFrioRelContainer');
    if (!container) return;
    if (tplCadeiaFrioRel_carregado_) {
      try { tplCadeiaFrioRel_renderReal_(); tplCadeiaFrioRel_ligarRevisao_(); }
      catch (erro) { tplCadeiaFrioRel_falhaCarga_(erro); }
      return;
    }
    container.innerHTML = '<p style="padding:20px;color:var(--bc-text-3);">Carregando módulo Cadeia de Frio...</p>';
    if (tplCadeiaFrioRel_pendente_) return;
    tplCadeiaFrioRel_pendente_ = true;
    const tentativa = ++tplCadeiaFrioRel_tentativa_;
    const timer = setTimeout(function() {
      if (tentativa !== tplCadeiaFrioRel_tentativa_) return;
      tplCadeiaFrioRel_tentativa_++;
      tplCadeiaFrioRel_pendente_ = false;
      tplCadeiaFrioRel_falhaCarga_(new Error('O servidor demorou para responder. Tente novamente.'));
    }, 45000);
    function falha(erro) {
      if (tentativa !== tplCadeiaFrioRel_tentativa_) return;
      clearTimeout(timer);
      tplCadeiaFrioRel_pendente_ = false;
      tplCadeiaFrioRel_falhaCarga_(erro);
    }
    try {
      google.script.run.withSuccessHandler(function(conteudo) {
        if (tentativa !== tplCadeiaFrioRel_tentativa_) return;
        clearTimeout(timer);
        tplCadeiaFrioRel_pendente_ = false;
        try {
          if (typeof conteudo !== 'string') throw new Error('Conteúdo do módulo indisponível.');
          const estilo = conteudo.match(/<style>([\s\S]*?)<\/style>/);
          const script = conteudo.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Conteúdo do módulo incompleto.');
          if (estilo && !document.getElementById('tplCadeiaFrioRel_estilo')) {
            const el = document.createElement('style');
            el.id = 'tplCadeiaFrioRel_estilo';
            el.textContent = estilo[1];
            document.head.appendChild(el);
          }
          window.eval(script[1]);
          if (typeof tplCadeiaFrioRel_renderReal_ !== 'function') throw new Error('Inicialização do módulo indisponível.');
          tplCadeiaFrioRel_carregado_ = true;
          tplCadeiaFrioRel_renderReal_();
          tplCadeiaFrioRel_ligarRevisao_();
        } catch (erro) { falha(erro); }
      }).withFailureHandler(falha).CadeiaFrioRel_obterConteudoModulo();
    } catch (erro) { falha(erro); }
  }

  // 21/10/2026: "Abrir para corrigir" e "Usar como base" nos relatórios de ensaio e planilhas de dados (JS_DocRevisao.html).
  function tplCadeiaFrioRel_biblioteca_() {
    const modulo = document.getElementById('tplCadeiaFrioRelEntrada');
    if (modulo && !modulo.querySelector('#tplCadeiaFrioRel_pops')) {
      const guia = document.createElement('section');
      guia.id = 'tplCadeiaFrioRel_pops';
      guia.setAttribute('aria-labelledby', 'cf-pop-titulo');
      const grupos = [
        { nome: 'Refrigeração', icone: '❄', documentos: [
          ['001', 'refrigerador', 'Refrigerador comum', 'Qualificação térmica de refrigeradores.'],
          ['002', 'vacinas', 'Câmara de conservação de vacinas', 'Qualificação de câmaras para imunobiológicos.'],
          ['003', 'camara-fria', 'Câmara fria', 'Qualificação térmica de câmaras frias.']
        ] },
        { nome: 'Congelamento', icone: '◇', documentos: [
          ['004', 'freezer', 'Freezer', 'Equipamentos de −10, −20 ou −30 °C.'],
          ['005', 'ultrafreezer', 'Ultrafreezer', 'Equipamentos de −80 ou −85 °C.']
        ] },
        { nome: 'Transporte', icone: '▣', documentos: [
          ['006', 'caixa-termica', 'Caixa térmica de transporte', 'Ensaio de autonomia térmica.']
        ] }
      ];
      guia.innerHTML = `
        <header class="cf-pop-capa">

          <h2 id="cf-pop-titulo">Biblioteca de POPs</h2>
          <p>Procedimentos de execução organizados por equipamento.</p>
          <span class="cf-pop-resumo">6 procedimentos · Em revisão técnica</span>
        </header>
        ${grupos.map(function (grupo) {
          return `<section class="cf-pop-grupo">
            <h3><span aria-hidden="true">${grupo.icone}</span> ${grupo.nome}</h3>
            <ul class="cf-pop-grade">${grupo.documentos.map(function ([codigo, arquivo, titulo, descricao]) {
              const url = '/cadeia-fria/pop/' + arquivo + '.pdf';
              return `<li class="cf-pop-card">
                <div class="cf-pop-meta"><span>POP-EXE-CF-${codigo}</span><span>PDF · Rev. 00</span></div>
                <h4>${titulo}</h4>
                <p>${descricao}</p>
                <div class="cf-pop-acoes">
                  <a class="cf-pop-consultar" href="${url}" target="_blank" rel="noopener" aria-label="Consultar PDF de ${titulo}">Consultar PDF ↗</a>
                  <a href="${url}" download="${arquivo}.pdf" aria-label="Baixar PDF de ${titulo}">Baixar PDF ↓</a>
                </div>
              </li>`;
            }).join('')}</ul>
          </section>`;
        }).join('')}
      `;
      modulo.prepend(guia);
    }
  }

  function tplCadeiaFrioRel_ligarRevisao_() {
    const manual = document.getElementById('tplCadeiaFrioRel_viewManual');
    const botaoManual = document.querySelector('.tplCadeiaFrioRel-btn-manual');
    if (manual && !manual.querySelector('#cf-manual-roteiro')) {
      const guia = document.createElement('section');
      guia.className = 'panel';
      guia.id = 'cf-manual-roteiro';
      guia.innerHTML = "<h2>Guia rápido de Cadeia Fria</h2><h3>Onde começar</h3><p>Abra Biblioteca de POPs, escolha o equipamento e consulte o procedimento. Em Novo ensaio, selecione cliente, unidade e equipamento e confirme o perfil.</p><h3>Como registrar e conferir</h3><p>Importe o arquivo do registrador, confira sensores e período na prévia e informe os horários reais. Confira separadamente distribuição, abertura de porta, queda de energia e autonomia, conforme os estudos executados.</p><h3>Quando aparece Inconclusivo</h3><p>Se um evento começar com sensor fora da faixa, conserve as leituras e os horários. A retenção térmica pode ficar inconclusiva. Corrija um horário apenas se houver evidência de erro de registro. Confira a conferência dos dados para distinguir um estudo inconclusivo de um erro que impede a emissão.</p><h3>Emitir e localizar</h3><p>Use as seções 5 e 6 do formulário para gerar a planilha e o relatório. Envie para aprovação ou emita conforme sua permissão. Na entrada, Quadro de relatórios mostra os últimos relatórios em Kanban. Use Lista para incluir planilhas e busque por número, cliente ou TAG.</p><h3>Atividades do módulo</h3><p>Abra Atividades do módulo para acompanhar o Kanban de tarefas da Cadeia Fria. Use Nova atividade neste módulo para registrar a tarefa e definir responsável e prazo. Para ver os documentos emitidos, abra Quadro de relatórios.</p><h3>Tire sua dúvida</h3><p>Abra Tire sua dúvida com Cadeia Fria na tela. Pergunte, por exemplo, “Onde baixo o POP de ultrafreezer?”, “Por que a queda de energia ficou inconclusiva?” ou “Como encontro um relatório pelo TAG?”.</p>";
      const conteudo = manual.querySelector('.manual-wrap') || manual;
      conteudo.appendChild(guia);
    }
    if (botaoManual) botaoManual.onclick = function () {
      tplCadeiaFrioRel_area_('formulario');
      tplCadeiaFrioRel_abrirManual_();
      window.scrollTo(0, 0);
    };
    if (typeof SGO_DocRev === 'undefined' || !SGO_DocRev.ligarEnsaio) return;
    SGO_DocRev.ligarEnsaio({
      modulo: 'CADEIA_FRIO', modulos: ['CADEIA_FRIO', 'CADEIA_FRIO_DADOS'], raiz: 'tplCadeiaFrioRel_viewModulo', campoNumero: 'tplCadeiaFrioRel_certNumero',
      raizPainel: 'tplCadeiaFrioRelRelatorios', kanban: true, antesDeAplicar: function () { tplCadeiaFrioRel_area_('formulario'); },
      acao: 'Emitir relatório', payloadFn: 'tplCadeiaFrioRel_montarPayloadBase',
      validarFns: ['tplCadeiaFrioRel_confirmarEGerarCertificado', 'tplCadeiaFrioRel_enviarRelatorioAprovacao_', 'tplCadeiaFrioRel_gerarRelatorio'],
      chamarApiFn: 'tplCadeiaFrioRel_chamarApi', despacho: 'CadeiaFrioRel_apiDispatch', fnsEmissao: ['apiMontarCertificadoFinal', 'apiEnviarParaAprovacao', 'apiConverter'],
      fotoFn: 'tplCadeiaFrioRel_lerArquivoComoBase64_', camposGrandes: { tplCadeiaFrioRel_textoColado: 'textoColado' },
      limpar: function () { tplCadeiaFrioRel_renderReal_(); tplCadeiaFrioRel_ligarRevisao_(); }
    });
  }
</script>

function OmieAj_esc_(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function OmieAj_contexto_(el) {
  if (el.closest && el.closest('#omieOpsForm')) return 'ops-' + (typeof OMIE_OPS_UI !== 'undefined' ? OMIE_OPS_UI.acao : '');
  if (el.closest && el.closest('#omieProvForm')) return 'prov';
  if (el.closest && el.closest('#omieCadForm')) return 'cad'; // 16/11/2026: cadastro no Omie
  if (el.closest && el.closest('#omieNotaSecao')) return 'nota'; // 16/11/2026: nota recebida
  return '';

<style>
  /* GANHOS DOS VENDEDORES (12/11/2026): menu Ganhos dos vendedores. Servidor: SGO_Ganhos_Vendedores.js (GanhosVendedores_api).

  #gvTela .cadx-btn { min-height: 40px; height: auto; padding: 6px 14px; white-space: normal; text-align: center; line-height: 1.25; font-size: 13px; }
  #gvTela .cadx-btn:focus-visible, #gvTela .vg-aba:focus-visible { outline: 2px solid var(--bc-info, #1E4F7A); outline-offset: 2px; }
  #gvTela p, #gvTela .gv-just { text-align: justify; text-justify: inter-word; hyphens: auto; -webkit-hyphens: auto; }
  .gv-filtros { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 0 0 12px; }
  .gv-filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--bc-text-2, #4A4F4B); }
  .gv-filtros select, .gv-filtros input { min-height: 40px; min-width: 180px; }
  .gv-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .gv-card { padding: 11px 13px; border: 1px solid var(--bc-line, #E2E0D8); border-radius: 8px; background: var(--bc-surface, #fff); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .gv-card span { font-size: 11.5px; font-weight: 600; color: var(--bc-text-3, #5F645F); }

  .gv-card small { font-size: 11.5px; color: var(--bc-text-3, #5F645F); line-height: 1.4; }
  .gv-card.destaque { border-color: var(--bc-action-line, #B9D3B3); background: var(--bc-action-bg, #E8F2E5); }
  .gv-regua { display: flex; gap: 3px; margin: 6px 0 4px; }
  .gv-regua div { flex: 1; min-width: 0; padding: 6px 6px; border-radius: 5px; background: var(--bc-surface-2, #FAF9F6); border: 1px solid var(--bc-line, #E2E0D8); font-size: 11.5px; line-height: 1.35; }

  .gv-regua b { display: block; font-size: 14px; }
  .gv-grafico { position: relative; height: 260px; }
  .gv-barras { display: flex; align-items: flex-end; gap: 4px; height: 180px; padding-top: 8px; }
  .gv-barras div { flex: 1; background: var(--bc-info, #1E4F7A); opacity: .75; border-radius: 3px 3px 0 0; min-height: 1px; }
  .gv-sit { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
  .gv-sit.s-EM_ANDAMENTO { color: #4A4F4B; } .gv-sit.s-ABERTO, .gv-sit.s-CONTESTADO, .gv-sit.s-DEVOLVIDO { color: #8A3D00; }
  .gv-sit.s-CONFERIDO, .gv-sit.s-FECHADO { color: #1A4F8C; } .gv-sit.s-APROVADO, .gv-sit.s-PAGO { color: #1D6B3F; }
  .gv-sit.s-VALIDO { color: #1D6B3F; } .gv-sit.s-A_CLASSIFICAR { color: #8A3D00; } .gv-sit.s-ANULADO { color: #4A4F4B; }
  .gv-passos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 0 0 12px; }
  .gv-passo { border: 1px solid var(--bc-line, #E2E0D8); border-left: 4px solid #C9CDD2; border-radius: 6px; padding: 9px 11px; background: #fff; font-size: 12.5px; line-height: 1.45; min-width: 0; }
  .gv-passo.feito { border-left-color: #1D6B3F; } .gv-passo.atual { border-left-color: #A87406; background: #FFFBF2; }
  .gv-passo b { display: block; font-size: 13px; margin-bottom: 2px; }
  .gv-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; margin: 8px 0; }
  .gv-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--bc-text-2, #4A4F4B); min-width: 0; }
  .gv-form label.inteiro { grid-column: 1 / -1; }
  .gv-form input, .gv-form select, .gv-form textarea { min-height: 40px; font: inherit; font-size: 13.5px; width: 100%; box-sizing: border-box; }
  .gv-form textarea { min-height: 70px; resize: vertical; }
  .gv-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .gv-pode { list-style: none; padding: 0; margin: 0 0 10px; font-size: 13px; line-height: 1.5; }
  .gv-pode li { padding: 3px 0; }
  .gv-pode li.nao { color: var(--bc-text-3, #5F645F); }
  .gv-faixas-ed { width: 100%; border-collapse: collapse; font-size: 13px; }
  .gv-faixas-ed td, .gv-faixas-ed th { padding: 5px 6px; border-bottom: 1px solid var(--bc-line, #E2E0D8); text-align: left; }
  .gv-faixas-ed input { min-height: 38px; width: 100%; box-sizing: border-box; }
  .gv-props { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; margin: 6px 0; }
  .gv-prop { text-align: left !important; justify-content: flex-start !important; }
  .gv-ia-txt { font-size: 14px; line-height: 1.65; text-align: justify; margin: 8px 0 4px; }
  .gv-num { font-family: var(--bc-mono, monospace); white-space: nowrap; }
  .gv-pend { display: grid; gap: 6px; margin: 0 0 12px; }
  /* no celular o SGO+ esconde .cadx-tabela-caixa (lá usa cartões): estas tabelas curtas rolam dentro da caixa, sem rolar a página */
  .gv-tabela-caixa { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .gv-tabela-caixa .cadx-tabela td, .gv-tabela-caixa .cadx-tabela th { white-space: nowrap; }
  @media (max-width: 760px) { #gvTela .cadx-btn { min-height: 44px; } .gv-regua { flex-direction: column; } .gv-filtros select, .gv-filtros input { min-width: 0; width: 100%; } .gv-filtros label { flex: 1 1 100%; } }
</style>
<script>
  // ==========================================================

  var GV = { ini: null, aba: "painel", vend: "", comp: "", ocupado: false, painel: null, graf: null, grafCmp: null, rec: { prop: null, filtroComp: "", filtroSit: "", classificar: "" }, ct: { faixas: [] } };

  function GvT_hoje_() { var d = new Date(), p = function (n) { return ("0" + n).slice(-2); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function GvT_compBr_(c) { var m = /^(\d{4})-(\d{2})$/.exec(String(c || "")); return m ? m[2] + "/" + m[1] : String(c || ""); }

  function GvT_moeda_(n) { return "R$ " + GvT_numBr_(Math.round((Number(n) || 0) * 100) / 100, 2); }
  function GvT_num_(v) { var s = String(v || "").replace(/R\$|%|\s/g, ""); if (!s) return null; if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else if (/^-?\d+,\d+$/.test(s)) s = s.replace(",", "."); else if (!/^-?\d+(\.\d+)?$/.test(s)) return null; var n = Number(s); return isFinite(n) ? n : null; }
  function GvT_bt_(rot, acao, id, cls, extra) { return '<button type="button" class="cadx-btn' + (cls ? " " + cls : "") + '" data-gv="' + acao + '" data-id="' + GvT_esc_(id || "") + '"' + (extra || "") + ">" + GvT_esc_(rot) + "</button>"; }
  function GvT_vazio_(t, x) { return '<div class="vg-vazio"><b>' + GvT_esc_(t) + "</b>" + GvT_esc_(x || "") + "</div>"; }

    if (badge) { var n = ver ? (c.conferir || 0) + (c.fechar || 0) + (c.aprovar || 0) + (c.pagar || 0) + (c.classificar || 0) : 0; badge.textContent = n ? String(n) : ""; }
  }
  function Ganhos_iniciar_() {

    google.script.run.withSuccessHandler(function (r) { GV.ini = r && r.ok ? r : null; Ganhos_mostrarMenu_(); }).withFailureHandler(function () { GV.ini = null; Ganhos_mostrarMenu_(); })

      .withSuccessHandler(function (r) {

  function Ganhos_render_() {

    div.innerHTML = '<div class="module-shell cadx" id="gvTela"><div class="module-header"><div class="module-header-left"><h2 class="content-title">Ganhos dos vendedores</h2>' +
      '<p class="content-subtitle">Contrato de cada vendedor, comissão sobre o valor recebido no mês (faixa cheia), fechamento mensal, pagamento, painel e avaliação.</p></div><div class="module-header-right"></div></div>' +
      '<div id="gvFiltros"></div><div id="gvAgora"></div><div class="vg-abas" id="gvAbas" role="tablist" aria-label="Partes de Ganhos dos vendedores"></div><div id="gvMsg" aria-live="polite"></div><div id="gvCorpo"><p class="vg-sub">Carregando…</p></div></div>';

    tela.addEventListener("click", GvT_clique_);

    GvT_chamar_("iniciar", {}, function (r) {
      GV.ini = r; Ganhos_mostrarMenu_();

      if (!GV.comp) GV.comp = GvT_mesAnterior_(r.competenciaAtual);
      if (!GV.vend) GV.vend = r.souVendedor || !GvT_verTodos_() ? r.eu.id : ((r.vendedores || []).filter(function (v) { return v.temContrato; })[0] || (r.vendedores || [])[0] || { id: r.eu.id }).id;

  function GvT_mesAnterior_(c) { var m = /^(\d{4})-(\d{2})$/.exec(String(c || "")); if (!m) return ""; var t = Number(m[1]) * 12 + Number(m[2]) - 2; return Math.floor(t / 12) + "-" + ("0" + ((t % 12) + 1)).slice(-2); }

        (GV.ini.souVendedor && !(GV.ini.vendedores || []).some(function (v) { return v.id === GV.ini.eu.id; }) ? '<option value="' + GvT_esc_(GV.ini.eu.id) + '"' + (GV.ini.eu.id === GV.vend ? " selected" : "") + ">" + GvT_esc_(GV.ini.eu.nome) + "</option>" : "") + "</select></label>";

  // ---------- painel ----------

    var h = '<div class="gv-cards">', lista = [];

    lista.push(card("Faixa atingida", a.temContrato ? a.pctBr : "—", a.faixa ? "faixa " + a.faixa.numero + " de " + a.faixa.de + ": " + a.faixa.rotulo : "sem contrato neste mês"));

    lista.push(card("Falta para a próxima faixa", a.proxima ? a.proxima.faltaBr : "—", a.proxima ? "para " + a.proxima.pctBr + " (a partir de " + a.proxima.aPartirDeBr + ")" : (a.temContrato ? "já está na faixa mais alta" : "")));
    lista.push(card("Recebido em 12 meses", i.recebido12Br, i.periodo));

    lista.push(card("Prazo médio ganho → recebimento", i.prazoMedioDias === null ? "—" : i.prazoMedioDias + " dias", i.prazoBase ? "média de " + i.prazoBase + (i.prazoBase === 1 ? " proposta" : " propostas") : "sem base ainda"));

      '<p class="vg-texto">Cada vendedor tem o próprio contrato de ganhos: faixas de valor com um percentual cada, e o mês em que o contrato começa a valer. A comissão é calculada sobre o valor recebido do cliente no mês, pela data em que o dinheiro entrou na conta. Vale a regra da faixa cheia: a faixa atingida no mês vale sobre todo o recebido no mês.</p>' +
      '<p class="vg-texto">O Financeiro lança cada recebimento ligado à proposta aprovada pelo cliente; o vendedor é o responsável pela proposta no Comercial. Recebimento sem proposta, ou de proposta sem responsável, fica "a classificar" e não entra em comissão de ninguém até ser ligado à proposta certa.</p>' +
      '<p class="vg-texto">No começo do mês seguinte, o vendedor confere o mês (ou contesta, dizendo o que está errado). O Financeiro fecha, e os números ficam congelados: o sistema guarda a cópia do cálculo. A Diretoria aprova ou devolve com o motivo. Depois da aprovação, o Financeiro paga e registra o pagamento. Se os números mudarem antes do fechamento, o mês volta para o vendedor conferir de novo. Mês fechado só é reaberto pela Diretoria, com o motivo; mês pago não é reaberto nesta etapa.</p>' +
      '<p class="vg-texto">Proteções fixas: ninguém mantém o próprio contrato, lança recebimento da própria venda, fecha, aprova, paga ou reabre o próprio mês; quem fechou não aprova o mesmo fechamento; quem aprovou não registra o pagamento. Cada passo grava quem fez, quando e a observação, e nada é apagado.</p></div>';
  }

  // ---------- cliques e mudanças ----------
  function GvT_mudou_(ev) {
    var t = ev.target; if (!t) return;
    var m = t.getAttribute && t.getAttribute("data-gvmuda");
    if (m === "vend") { GV.vend = t.value; GV.rec.prop = null; GvT_irAba_(GV.aba); return; }
    if (m === "comp") { if (/^\d{4}-\d{2}$/.test(t.value)) { GV.comp = t.value; GvT_irAba_(GV.aba); } return; }
    if (t.id === "gvSemProp") { GV.rec.semProp = !!t.checked; GV.rec.prop = null; GV.rec.omieRef = ""; var b = t.closest(".vg-bloco"); if (b) b.innerHTML = '<h3>Lançar recebimento</h3><p class="vg-sub">O recebimento entra na comissão pelo mês da data em que o dinheiro entrou na conta.</p>' + GvT_formRec_(); return; }
    if (t.id === "gvSimValor" || /^gvFx(Ate|Pct)_/.test(t.id || "")) GvT_simular_();
  }
  function GvT_clique_(ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-gv]") : null; if (!b || b.disabled) return;
    var acao = b.getAttribute("data-gv"), id = b.getAttribute("data-id") || "";
    switch (acao) {
      case "aba": GvT_irAba_(id); break;
      case "atualizar": GvT_reiniciar_(function () { GvT_irAba_(GV.aba); }); break;
      case "irPend": {
        if (b.getAttribute("data-vend")) GV.vend = b.getAttribute("data-vend");
        if (b.getAttribute("data-comp")) GV.comp = b.getAttribute("data-comp");
        GvT_filtros_();
        if (id === "classificar") { GV.rec.filtroSit = "A_CLASSIFICAR"; GV.rec.filtroComp = ""; GvT_irAba_("recebimentos"); } else GvT_irAba_("fechamento");
        break;
      }
      case "verVend": GV.vend = id; GvT_filtros_(); GvT_irAba_("painel"); break;
      case "ia": GvT_avaliar_(); break;
      case "conferir": GvT_passo_("conferir", { observacao: GvT_v_("gvObs") }, "Conferência registrada. O Financeiro fecha o mês."); break;
      case "contestar": GvT_passo_("contestar", { motivo: GvT_v_("gvObs") }, "Contestação registrada. O Financeiro corrige os recebimentos ou responde."); break;
      case "fechar": GvT_perguntar_("Fechar o mês", "Ao fechar, os números deste mês ficam congelados e o mês vai para a aprovação da Diretoria. Confirma?", function () { GvT_passo_("fechar", { resposta: GvT_v_("gvResp") }, "Mês fechado. A Diretoria foi chamada para aprovar."); }); break;
      case "aprovar": GvT_passo_("aprovar", { observacao: GvT_v_("gvDir"), hash: (GV.painel && GV.painel.fechamento && GV.painel.fechamento.hash) || "" }, "Fechamento aprovado. O Financeiro registra o pagamento."); break;
      case "devolver": GvT_passo_("devolver", { motivo: GvT_v_("gvDir") }, "Fechamento devolvido ao Financeiro com o motivo."); break;
      case "pagar": GvT_lerArquivo_(GvT_$("gvPagArq"), function (arq) { GvT_passo_("pagar", { data: GvT_v_("gvPagData"), forma: GvT_v_("gvPagForma"), valor: GvT_v_("gvPagValor"), observacao: GvT_v_("gvPagObs"), comprovante: arq }, "Pagamento registrado."); }); break;
      case "reabrir": GvT_perguntar_("Reabrir o mês", "O mês volta para a conferência do vendedor e o cálculo congelado fica no histórico. Confirma?", function () { GvT_passo_("reabrir", { motivo: GvT_v_("gvReab") }, "Mês reaberto. O vendedor confere de novo."); }); break;
      case "buscarProp": GvT_buscarProp_("gvProps", "escolherProp"); break;
      case "escolherProp": { GV.rec.omieRef = ""; GV.rec.prop = (GV.rec.lista || []).filter(function (p) { return p.id === id; })[0] || null; var bl = b.closest(".vg-bloco"); if (bl) { var vals = { d: GvT_v_("gvRecData"), v: GvT_v_("gvRecValor"), doc: GvT_v_("gvRecDoc"), o: GvT_v_("gvRecObs") }; bl.innerHTML = '<h3>Lançar recebimento</h3>' + GvT_formRec_(); GvT_$("gvRecData").value = vals.d; GvT_$("gvRecValor").value = vals.v; GvT_$("gvRecDoc").value = vals.doc; GvT_$("gvRecObs").value = vals.o; } break; }
      case "lancar": GvT_lancar_(); break;
      case "omieVer": GvT_omieVer_(); break;
      case "omieUsar": { var pp = id.split(":"); GvT_omiePreencher_(pp[0], pp.slice(1).join(":")); break; }
      case "omieSemProp": GvT_omiePreencher_(id, ""); break;
      case "filtroClass": GV.rec.filtroSit = "A_CLASSIFICAR"; GV.rec.filtroComp = ""; GvT_recebimentos_(); break;
      case "filtrarRec": GV.rec.filtroComp = GvT_v_("gvRecComp"); GV.rec.filtroSit = GvT_v_("gvRecSit"); GV.rec.soVend = !!(GvT_$("gvRecSoVend") && GvT_$("gvRecSoVend").checked); GvT_recebimentos_(); break;
      case "abrirClass": { var a1 = GvT_$("gvRecAcao_" + id); if (a1) a1.innerHTML = '<div class="gv-form"><label class="inteiro" for="gvBuscaClass">Proposta deste recebimento<input id="gvBuscaClass" maxlength="120"></label><label class="inteiro" for="gvJustClass">Justificativa, só se passar do total da proposta<input id="gvJustClass" maxlength="600"></label></div><div class="gv-acoes">' + GvT_bt_("Buscar proposta", "buscarClass", id, "", ' data-livre="1"') + '</div><div id="gvPropsClass_' + GvT_esc_(id) + '" class="gv-props"></div>'; GV.rec.classificar = id; break; }
      case "buscarClass": { var dest = "gvPropsClass_" + id; var q = GvT_v_("gvBuscaClass"); var alvo = GvT_$(dest); if (alvo) alvo.id = "gvPropsTmp"; GvT_buscarPropCls_(q, id); break; }
      case "classificar": GvT_chamar_("classificarRecebimento", { id: GV.rec.classificar, propostaId: id, justificativaAcima: GvT_v_("gvJustClass") }, function (r) { GvT_reiniciar_(function () { GvT_recebimentos_(); setTimeout(function () { GvT_msg_("Recebimento classificado para " + r.recebimento.vendedorNome + ".", "ok"); }, 50); }); }); break;
      case "abrirAnular": { var a2 = GvT_$("gvRecAcao_" + id); if (a2) a2.innerHTML = '<div class="gv-form"><label class="inteiro" for="gvAnul_' + GvT_esc_(id) + '">Motivo da anulação<textarea id="gvAnul_' + GvT_esc_(id) + '" maxlength="1000"></textarea></label></div><div class="gv-acoes">' + GvT_bt_("Anular o recebimento", "anular", id, "cadx-btn-risco") + "</div>"; break; }
      case "anular": GvT_perguntar_("Anular o recebimento", "O lançamento continua na lista, marcado como anulado, e sai da apuração. Confirma?", function () { GvT_chamar_("anularRecebimento", { id: id, motivo: GvT_v_("gvAnul_" + id) }, function () { GvT_reiniciar_(function () { GvT_recebimentos_(); setTimeout(function () { GvT_msg_("Recebimento anulado.", "ok"); }, 50); }); }); }); break;
      case "modelo": { var mo = GV.ct.modelo || (GV.ini && GV.ini.modelo); if (!mo) break; GV.ct.faixas = mo.faixas.map(function (f) { return { ate: f.ate === null ? "" : GvT_numBr_(f.ate, 2), pct: String(f.pct).replace(".", ",") }; }); GvT_desenharFaixas_(); GvT_msg_("Faixas do modelo preenchidas. Escolha o vendedor e o mês de início, confira e toque em \"Gravar o contrato\". Nada foi gravado ainda.", "alerta"); break; }
      case "maisFaixa": GvT_lerFaixasTela_(); GV.ct.faixas.push({ ate: "", pct: "" }); GvT_desenharFaixas_(); break;
      case "menosFaixa": GvT_lerFaixasTela_(); GV.ct.faixas.splice(Number(id), 1); GvT_desenharFaixas_(); break;
      case "gravarContrato": {
        var faixas = GvT_lerFaixasTela_().map(function (f, i, l) { return { ate: i === l.length - 1 ? "" : f.ate, pct: f.pct }; });
        GvT_chamar_("salvarContrato", { vendedorId: GvT_v_("gvCtVend"), vigencia: GvT_v_("gvCtVig"), faixas: faixas, observacao: GvT_v_("gvCtObs"), motivo: GvT_v_("gvCtMot") }, function (r) {
          GV.ct.faixas = [];
          GvT_reiniciar_(function () { GvT_contratos_(); setTimeout(function () { GvT_msg_("Contrato gravado para " + r.contrato.vendedorNome + ", com início em " + r.contrato.vigenciaBr + "." + (r.conferenciasReabertas ? " Meses já conferidos voltaram para a conferência, porque o cálculo mudou." : ""), "ok"); }, 50); });
        });
        break;
      }
      case "cancelarContrato": GvT_perguntar_("Cancelar o contrato", "O contrato não é apagado: fica no histórico como cancelado. Confirma?", function () { GvT_chamar_("cancelarContrato", { id: id, motivo: GvT_v_("gvCanc_" + id) }, function () { GvT_reiniciar_(function () { GvT_contratos_(); setTimeout(function () { GvT_msg_("Contrato cancelado.", "ok"); }, 50); }); }); }); break;
    }
  }
  function GvT_buscarPropCls_(q, recId) {
    var alvo = GvT_$("gvPropsTmp"); if (alvo) { alvo.id = "gvPropsClass_" + recId; alvo.innerHTML = '<p class="vg-sub">Buscando…</p>'; }
    GvT_chamar_("propostas", { q: q }, function (r) {
      var a = GvT_$("gvPropsClass_" + recId); if (!a) return;
      a.innerHTML = r.propostas.length ? r.propostas.map(function (p) { return '<button type="button" class="cadx-btn gv-prop" data-gv="classificar" data-id="' + GvT_esc_(p.id) + '"><span><b>' + GvT_esc_(p.numero) + "</b> · " + GvT_esc_(p.cliente) + " · " + GvT_esc_(p.semVendedor ? "sem vendedor responsável" : "vendedor " + p.vendedor) + "</span></button>"; }).join("") : '<p class="vg-sub">Nenhuma proposta aprovada pelo cliente com este texto.</p>';
    }, function (m) { var a = GvT_$("gvPropsClass_" + recId); if (a) a.innerHTML = '<div class="vg-faixa is-erro">' + GvT_esc_(m) + "</div>"; }, { livre: true });
  }
</script>

<script>
  var OMIE_ABAS = [ ['resumo','Visão geral'], ['contas','Contas a pagar e receber'], ['cliente','Ficha do cliente'], ['pedidos','Pedidos aprovados'], ['lancamentos','Lançamentos e baixas'], ['cobrancas','Cobranças'], ['conciliacao','Conciliação bancária'], ['produtos','Faturamento de produtos'], ['servicos','Faturamento de serviços'], ['notas','Importação de notas'], ['fluxo','Fluxo de caixa'], ['resultado','Resultado do mês'], ['provisoes','Provisões'], ['comissoes','Comissões'], ['regras','Regras do Financeiro'], ['indicadores','Indicadores'], ['sigilo','Sigilo e acessos'] ];
  // 14/11/2026: faixa fixa enquanto a gravação no Omie estiver desligada (as consultas funcionam; a prévia mostra o que seria enviado).
  function OmieTela_faixaGravacao_() {
    if (!OMIE_INI) return '';
    // 16/11/2026 (Regras do Financeiro): operações acima da alçada esperando a aprovação de quem está vendo
    var aprov = OMIE_INI.aprovacoesPendentes > 0 ? '<div class="vg-faixa is-alerta" role="status" id="omieFaixaAprovacao"><b>' + OMIE_INI.aprovacoesPendentes + ' operação(ões) aguardando a sua aprovação.</b> <button type="button" class="cadx-btn" onclick="OmieTela_abrir_(\'regras\')">Ver aprovações</button></div>' : '';
    return aprov + OmieTela_faixaGravacaoBase_();
  }
  function OmieTela_faixaGravacaoBase_() {
    if (OMIE_INI.configurado === false) return '<div class="vg-faixa is-erro" role="alert"><b>Conexão com o Omie não configurada.</b> As consultas e operações dependem das chaves do Omie, gravadas pelo responsável pelo sistema.</div>';
    if (OMIE_INI.gravacao) return '';
    return '<div class="vg-faixa is-alerta" role="status" id="omieFaixaGravacao"><b>Consultas ligadas; gravação no Omie desligada.</b> Tudo o que é lido aqui vem do Omie na hora. Lançar, baixar, gerar boleto, faturar e importar nota ainda não enviam nada: a prévia mostra exatamente o que seria enviado, e o envio será ligado depois da primeira operação acompanhada.</div>';
  }
  function OmieTela_render_() {
    var div = document.getElementById('conteudo');
    if (!div) return;
    div.innerHTML = '<div class="module-shell cadx" id="omieTela"><div class="module-header"><div class="module-header-left"><h2 class="content-title">Painel financeiro</h2><p class="content-subtitle">Contas, bancos, faturamento e planejamento da empresa, lidos e gravados no Omie pelo SGO+.</p></div></div>' + OmieTela_faixaGravacao_() +
      '<nav class="omie-abas" aria-label="Rotinas do Financeiro">' + OMIE_ABAS.map(function (a) { return '<button type="button" class="cadx-btn" data-omie-aba="' + a[0] + '" onclick="OmieTela_abrir_(\'' + a[0] + '\')">' + a[1] + '</button>'; }).join('') + '</nav>' +
      // 16/11/2026 (design): no celular, as 15 rotinas em botões ocupavam a tela inteira; lá elas viram uma lista de escolha
      '<label class="omie-abas-movel" for="omieAbaMovel"><span>Rotina do Financeiro</span><select class="cadx-input" id="omieAbaMovel" onchange="OmieTela_abrir_(this.value)">' + OMIE_ABAS.map(function (a) { return '<option value="' + a[0] + '">' + a[1] + '</option>'; }).join('') + '</select></label><div id="omieCorpo"></div></div>';
    // 16/11/2026 (sigilo, seção 5): marca d'água com o nome e o login de quem está vendo (vem do servidor em Omie_apiIniciar)
    if (typeof FinMarca_aplicar_ === 'function') FinMarca_aplicar_(document.getElementById('omieTela'), OMIE_INI && OMIE_INI.marca);
    OmieTela_abrir_('resumo');
    OmieSig_vigiar_();
  }
  function OmieTela_abrir_(aba) {
    OMIE_TELA.pedido++;
    var alvo = document.getElementById('omieCorpo'); if (!alvo) return;
    if (!OmieTela_permitido_()) { alvo.innerHTML = '<p role="alert">O Financeiro é sigiloso: só a Diretoria e o Financeiro autorizado o acessam.</p>'; return; }
    document.querySelectorAll('[data-omie-aba]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-omie-aba') === aba ? 'true' : 'false'); });
    var movel = document.getElementById('omieAbaMovel'); if (movel && movel.value !== aba) movel.value = aba;
    if (aba === 'resumo') { OmieGest_resumo_(); return; }
    if (aba === 'contas') { OmieTela_contas_(); return; }
    if (aba === 'cliente' && typeof OmieCli_render_ === 'function') { OmieCli_render_(); return; } // 16/11/2026
    if (aba === 'pedidos' && typeof OmiePed_render_ === 'function') { OmiePed_render_(); return; } // 15/11/2026
    if (aba === 'lancamentos' || aba === 'cobrancas') { OmieOps_render_(aba); return; }
    if (aba === 'conciliacao') { OmieConc_render_(); return; }
    if (['produtos','servicos','notas'].indexOf(aba) >= 0) { OmieFat_render_(aba); return; }
    if (aba === 'fluxo') { OmieGest_fluxo_(); return; }
    if (aba === 'resultado') { OmieGest_resultado_(); return; } // 15/11/2026
    if (aba === 'provisoes') { OmieGest_provisoes_(); return; }
    if (aba === 'sigilo' && typeof OmieSig_render_ === 'function') { OmieSig_render_(); return; } // 16/11/2026
    if (aba === 'regras' && typeof OmieRegras_render_ === 'function') { OmieRegras_render_(); return; } // 16/11/2026: Regras do Financeiro
    if (aba === 'indicadores' && typeof FinIndTela_render_ === 'function') { FinIndTela_render_(); return; } // 16/11/2026: Onda 2, Indicadores e saúde
    if (aba === 'comissoes') {
      alvo.innerHTML = '<section><h3>Comissões de vendas</h3><div class="cadx-vazio bc-vazio"><strong>As comissões ficam em Ganhos dos vendedores</strong><p>A regra decidida pela gestão (comissão sobre o valor recebido, por faixa, com fechamento mensal conferido pelo vendedor, pelo Financeiro e pela Diretoria) está no módulo Ganhos dos vendedores.</p>' + (typeof Ganhos_render_ === 'function' ? '<p><button type="button" class="cadx-btn" onclick="abrir(\'ganhos_vendedores\')">Abrir Ganhos dos vendedores</button></p>' : '') + '</div></section>';
    }
  }
  var OMIE_GEST_PEDIDOS = {};
  // 16/11/2026: sigilo na tela. Ao sair, trocar de conta ou após 10 minutos sem uso no Painel financeiro, os dados somem da
  // página (as listas guardadas para a planilha também). Volta com "Mostrar de novo" (nova consulta, registrada).
  var OMIE_SIG = { ultimo: 0, timer: null, ocioMs: 10 * 60 * 1000 };
  function OmieSig_limpar_(motivo) {
    try { OMIE_CSV = {}; } catch (e) {}
    var t = document.getElementById('omieTela');
    if (!t) return;
    OMIE_TELA.pedido++;
    if (!motivo) { t.parentNode && (t.outerHTML = ''); return; }
    t.innerHTML = '<div class="module-header"><div class="module-header-left"><h2 class="content-title">Painel financeiro</h2></div></div><div class="cadx-vazio bc-vazio" role="status"><strong>Dados ocultados por sigilo.</strong><p>' + CadUI_esc_(motivo) + '</p><p><button type="button" class="cadx-btn" onclick="OmieTela_render_()">Mostrar de novo</button></p></div>';
  }
  function OmieSig_mexeu_() { OMIE_SIG.ultimo = Date.now(); }
  function OmieSig_vigiar_() {
    OMIE_SIG.ultimo = Date.now();
    if (!OMIE_SIG.ligado) {
      OMIE_SIG.ligado = true;
      ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(function (ev) { document.addEventListener(ev, OmieSig_mexeu_, { passive: true, capture: true }); });
    }
    if (OMIE_SIG.timer) clearInterval(OMIE_SIG.timer);
    OMIE_SIG.timer = setInterval(OmieSig_conferir_, 30000);
  }
  function OmieSig_conferir_() {
    var t = document.getElementById('omieTela');
    if (!t) { if (OMIE_SIG.timer) clearInterval(OMIE_SIG.timer); OMIE_SIG.timer = null; return; }
    if (!document.getElementById('omieCorpo')) return; // já ocultado
    if (Date.now() - OMIE_SIG.ultimo >= OMIE_SIG.ocioMs) OmieSig_limpar_('O Painel financeiro ficou 10 minutos sem uso e os dados foram retirados da tela.');
  }
  function OmieSig_render_() {
    var alvo = document.getElementById('omieCorpo'); if (!alvo) return;
    alvo.innerHTML = '<section><h3>Sigilo e acessos</h3><p class="content-subtitle">Quem pode ver o Financeiro e quem consultou.</p><p id="omieGestStatus" aria-live="polite"></p><div id="omieSigCorpo">' + CadUI_esqueleto_(3) + '</div></section>';
    OmieGest_chamar_('Omie_apiSigilo', null, OmieSig_pintar_);
  }
  function OmieSig_pintar_(r) {
    var c = document.getElementById('omieSigCorpo'); if (!c) return;
    var esc = CadUI_esc_, h = '<div class="vg-faixa is-alerta" role="note"><b>O Financeiro é sigiloso.</b> Só as contas abaixo o acessam, qualquer que seja o perfil ou as caixas em Administração > Acessos. Toda consulta e toda recusa ficam registradas (sem valores). Na tela, os dados somem ao sair e após 10 minutos sem uso.</div>';
    h += '<h4>Contas autorizadas' + (r.padrao ? ' (lista padrão)' : '') + '</h4>' + OmieGest_tabela_(['Nome', 'Usuário', 'Perfil', 'Situação'], r.autorizados.map(function (a) { return [a.nome, a.usuario, a.perfil, a.situacao]; }));
    if (r.dono && r.contas) {
      h += '<details class="omie-sig-editar"><summary>Alterar a lista (só o responsável pelo sistema)</summary><p>Marque quem pode ver o Financeiro. Você continua na lista. Contas de clientes e de representadas nunca entram.</p><div class="omie-sig-contas">' +
        r.contas.map(function (u) { var id = 'omieSig_' + esc(u.id); return '<label for="' + id + '"><input type="checkbox" id="' + id + '" data-omie-sig="' + esc(u.id) + '"' + (u.marcado ? ' checked' : '') + '> ' + esc(u.nome) + ' <span class="cadx-sub">(' + esc(u.usuario) + ' · ' + esc(u.perfil) + (u.area ? ' · ' + esc(u.area) : '') + ')</span></label>'; }).join('') +
        '</div><label for="omieSigMotivo">Motivo<input class="cadx-input" id="omieSigMotivo" maxlength="200" placeholder="Ex.: nova pessoa no Financeiro"></label><p><button type="button" class="cadx-btn" onclick="OmieSig_salvar_()">Gravar a lista</button></p></details>';
    }
    if (r.diretoria && r.registro) {
      h += '<h4>Registro de acessos (últimos 300)</h4><p>' + (r.negados30 ? '<b>' + r.negados30 + ' tentativa(s) recusada(s) nos últimos 30 dias.</b> ' : 'Nenhuma tentativa recusada nos últimos 30 dias. ') + 'A mesma consulta da mesma pessoa aparece uma vez a cada 10 minutos.</p>' +
        (r.registro.length ? OmieGest_tabela_(['Quando', 'Quem', 'O quê', 'Resultado', 'Detalhe'], r.registro.map(function (x) { return [x.em, x.nome + (x.usuario ? ' (' + x.usuario + ')' : ''), x.consulta, x.resultado === 'NEGADO' ? 'RECUSADO' : x.resultado === 'PERMITIDO' ? 'Consultou' : x.resultado === 'CSV' ? 'Baixou planilha' : x.resultado === 'LISTA_ALTERADA' ? 'Lista alterada' : x.resultado, x.detalhe]; })) : '<div class="cadx-vazio bc-vazio">Nenhum acesso registrado ainda.</div>');
    }
    c.innerHTML = h;
  }
  function OmieSig_salvar_() {
    var ids = Array.prototype.map.call(document.querySelectorAll('[data-omie-sig]:checked'), function (x) { return x.getAttribute('data-omie-sig'); });
    var motivo = (document.getElementById('omieSigMotivo') || {}).value || '';
    OmieGest_chamar_('Omie_apiSigiloSalvar', { ids: ids, motivo: motivo }, function (r) { if (r.tela && r.tela.ok) OmieSig_pintar_(r.tela); });
  }
  // 15/11/2026: fila das consultas que usam ListarMovimentos no Omie (resumo, agenda, vencidos): uma de cada vez.
  var OMIE_MOV = { ocupado: false, fila: [] };
  function OmieGest_movFila_(executar) { OMIE_MOV.fila.push(executar); OmieGest_movProximo_(); }
  function OmieGest_movProximo_() {
    if (OMIE_MOV.ocupado || !OMIE_MOV.fila.length) return;
    OMIE_MOV.ocupado = true;
    var f = OMIE_MOV.fila.shift(), feito = false;
    var liberar = function () { if (feito) return; feito = true; OMIE_MOV.ocupado = false; OmieGest_movProximo_(); };
    setTimeout(liberar, 300000); // segurança: resposta perdida não prende a fila (300 s = limite das chamadas do servidor)
    try { f(liberar); } catch (e) { liberar(); }
  }
  // 15/11/2026: fim (opcional) roda sempre ao terminar, com sucesso ou não; recebe true se a tela ainda é a mesma
  function OmieGest_chamar_(fn, payload, ok, fim) {
    var corpo = document.getElementById('omieCorpo'), pedido = OMIE_TELA.pedido, sessao = SGO_getSessionId();
    var serial = (OMIE_GEST_PEDIDOS[fn] || 0) + 1; OMIE_GEST_PEDIDOS[fn] = serial;
    var status = document.getElementById('omieGestStatus');
    function atual() { return pedido === OMIE_TELA.pedido && sessao === SGO_getSessionId() && serial === OMIE_GEST_PEDIDOS[fn] && corpo === document.getElementById('omieCorpo'); }
    if (status) status.textContent = 'Consultando…';
    var acabou = function () { if (fim) { try { fim(atual()); } catch (e) {} } };
    var runner = google.script.run.withSuccessHandler(function (r) {
      if (!atual()) { acabou(); return; }
      if (!r || !r.ok) { if (status) status.textContent = r && r.mensagem || 'Não foi possível concluir.'; acabou(); return; }
      if (status) status.textContent = r.mensagem || '';
      try { ok(r); } finally { acabou(); }
    }).withFailureHandler(function () { if (atual() && status) status.textContent = 'Não foi possível comunicar com o servidor. Tente novamente.'; acabou(); });
    runner[fn](SGO_getSessionId(), payload);
  }
  /* 16/11/2026 (design): prévia de confirmação com valores e datas em destaque. linhas = [[rótulo, texto], ...] vindas do servidor.
     Só apresentação: o texto é o mesmo, escapado; valores em R$ e datas ganham negrito, e as linhas de dinheiro e data, fundo. */
  function OmieUI_destacar_(texto) {
    return CadUI_esc_(texto == null ? '' : String(texto)).replace(/-?R\$\s?-?[\d.]+,\d{2}|\b\d{2}\/\d{2}\/\d{4}\b/g, function (m) { return '<strong class="omie-num">' + m + '</strong>'; });
  }
  function OmieUI_previa_(linhas, titulo) {
    var chave = /R\$\s?-?[\d.]+,\d{2}|\b\d{2}\/\d{2}\/\d{4}\b/; // linha com valor em reais ou data ganha fundo
    return '<h4 class="omie-previa-tit">' + CadUI_esc_(titulo || 'Confira antes de confirmar') + '</h4><dl class="omie-previa">' + (linhas || []).map(function (l) {
      var txt = l[1] == null ? '' : String(l[1]);
      return '<div class="omie-previa-linha' + (chave.test(txt) ? ' is-chave' : '') + (txt ? '' : ' is-vazia') + '"><dt>' + CadUI_esc_(l[0]) + '</dt><dd>' + (txt ? OmieUI_destacar_(txt) : '—') + '</dd></div>';
    }).join('') + '</dl>';
  }
  function OmieGest_moeda_(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function OmieGest_tabela_(colunas, linhas) {
    var esc = CadUI_esc_;
    if (!linhas.length) return '<div class="cadx-vazio bc-vazio">Nenhum registro encontrado para o período.</div>';
    return '<div class="omie-lista"><table><thead><tr>' + colunas.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + linhas.map(function (l) {
      return '<tr>' + l.map(function (v, i) { return '<td data-r="' + esc(colunas[i]) + '">' + esc(v) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  }
  function OmieGest_periodoHtml_() {
    return '<label>De <input class="cadx-input" type="date" id="omieGestInicio" required></label><label>Até <input class="cadx-input" type="date" id="omieGestFim" required></label>';
  }
  function OmieGest_datas_() {
    var hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    var d = {}; hoje.forEach(function (p) { d[p.type] = p.value; });
    document.getElementById('omieGestInicio').value = d.year + '-' + d.month + '-01';
    document.getElementById('omieGestFim').value = d.year + '-' + d.month + '-' + d.day;
    return d.year + '-' + d.month;
  }
  function OmieGest_resumo_() {
    document.getElementById('omieCorpo').innerHTML = '<section class="omie-posicao"><h3>Posição de hoje</h3><p>Pelo resumo do próprio Omie: o saldo somado das contas e o que entra e sai nos próximos 10 dias, com o saldo previsto ao fim de cada dia.</p><p id="omiePosStatus" role="status" aria-live="polite"></p><div id="omiePosCartoes" class="cadx-resumo bc-resumo"></div><div id="omiePosFluxo"></div></section>' +
      '<section class="omie-agenda"><h3>Visão geral do Financeiro</h3><p>Saldos em aberto dos títulos com vencimento no período escolhido. O resumo consulta todas as páginas; títulos cancelados ficam fora dos valores.</p><form class="omie-barra" onsubmit="event.preventDefault();OmieGest_atualizarResumo_()">' + OmieGest_periodoHtml_() + '<button class="cadx-btn" type="submit">Atualizar resumo</button></form><p id="omieGestStatus" role="status"></p><div class="cadx-resumo bc-resumo" id="omieGestResumo"></div><p id="omieGestAtualizado"></p><p>Para movimentações e saldos bancários, consulte Fluxo de caixa.</p></section>' +
      '<section class="omie-agenda"><h3>Agenda de vencimentos</h3><p>O que vence de hoje em diante, em ordem de data, com o valor que ainda está em aberto. Os vencidos ficam em Contas a pagar e receber, situação Vencidos.</p>' +
      '<form class="omie-barra" onsubmit="event.preventDefault();OmieGest_agenda_()"><label for="omieAgDias">Período<select class="cadx-input" id="omieAgDias"><option value="7">Próximos 7 dias</option><option value="15">Próximos 15 dias</option><option value="30">Próximos 30 dias</option></select></label>' +
      '<label for="omieAgNat">Mostrar<select class="cadx-input" id="omieAgNat"><option value="todos">A pagar e a receber</option><option value="P">Só a pagar</option><option value="R">Só a receber</option></select></label>' +
      '<button class="cadx-btn" type="submit">Ver agenda</button></form><p id="omieAgStatus" role="status" aria-live="polite"></p><div id="omieAgTotais" class="cadx-resumo bc-resumo"></div><div id="omieAgLista"></div></section>' +
      '<section class="omie-agenda"><h3>Vencidos a receber por cliente</h3><p>Quem está devendo, quantos títulos, o total e há quantos dias venceu o mais antigo. Para a cobrança; o detalhe de cada título fica em Contas a pagar e receber, situação Vencidos.</p>' +
      '<button class="cadx-btn" type="button" onclick="OmieGest_vencidos_()">Ver vencidos por cliente</button><p id="omieVcStatus" role="status" aria-live="polite"></p><div id="omieVcLista"></div></section>';
    OmieGest_datas_();
    OmieGest_posicao_();
    // 15/11/2026: resumo e agenda usam o mesmo método do Omie (ListarMovimentos), que recusa chamadas simultâneas: os dois
    // entram na fila (OmieGest_movFila_), um depois do outro. A posição usa outro método e vai junto.
    OmieGest_atualizarResumo_();
    OmieGest_agenda_();
  }
  function OmieGest_atualizarResumo_(depois) {
    document.getElementById('omieGestResumo').innerHTML = '';
    document.getElementById('omieGestAtualizado').textContent = '';
    var stR = document.getElementById('omieGestStatus'); if (stR && OMIE_MOV.ocupado) stR.textContent = 'Aguardando a consulta anterior ao Omie terminar…';
    OmieGest_movFila_(function (liberar) { if (!document.getElementById('omieGestResumo') || !document.getElementById('omieGestInicio')) { liberar(); return; } OmieGest_chamar_('Omie_apiResumo', { inicio: document.getElementById('omieGestInicio').value, fim: document.getElementById('omieGestFim').value }, function (r) {
      if (!r.completo || !r.totais) { document.getElementById('omieGestStatus').textContent = 'O resumo não foi concluído. Atualize a consulta.'; return; }
      var t = r.totais;
      document.getElementById('omieGestResumo').innerHTML = [['A pagar em aberto',t.pagar],['A receber em aberto',t.receber],['A pagar vencido',t.pagarVencido],['A receber vencido',t.receberVencido]].map(function (c) { return '<div class="cadx-num bc-resumo-item"><span class="bc-resumo-num">' + CadUI_esc_(OmieGest_moeda_(c[1])) + '</span><span>' + c[0] + '</span></div>'; }).join('');
      document.getElementById('omieGestAtualizado').textContent = t.titulos + ' títulos consultados. Atualizado em ' + new Date(r.atualizadoEm).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) + '.';
    }, function (vale) { liberar(); if (vale && depois) depois(); }); });
  }
  // 15/11/2026: agenda de vencimentos (Omie_apiAgenda). Chamada própria: não divide o aviso nem a ordem das respostas do resumo.
  var OMIE_AG_SERIAL = 0;
  function OmieGest_dataBr_(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return s; var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][d.getDay()] + ' ' + m[3] + '/' + m[2]; }
  function OmieGest_agenda_() {
    var lista = document.getElementById('omieAgLista'), st = document.getElementById('omieAgStatus'), tot = document.getElementById('omieAgTotais');
    if (!lista) return;
    var serial = ++OMIE_AG_SERIAL, pedido = OMIE_TELA.pedido, sessao = SGO_getSessionId();
    function atual() { return serial === OMIE_AG_SERIAL && pedido === OMIE_TELA.pedido && sessao === SGO_getSessionId() && lista === document.getElementById('omieAgLista'); }
    var dias = document.getElementById('omieAgDias').value, nat = document.getElementById('omieAgNat').value;
    st.textContent = OMIE_MOV.ocupado ? 'Aguardando a consulta anterior ao Omie terminar…' : 'Consultando a agenda no Omie…'; tot.innerHTML = ''; lista.innerHTML = CadUI_esqueleto_(3);
    OmieGest_movFila_(function (liberar) {
    if (!atual()) { liberar(); return; }
    st.textContent = 'Consultando a agenda no Omie…';
    google.script.run.withSuccessHandler(function (r) {
      liberar();
      if (!atual()) return;

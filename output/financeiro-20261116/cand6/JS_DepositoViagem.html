<style>

  .vg-borda-APROVADA { --vg-cor: #1f5fa8; } .vg-borda-CARGA_FEITA { --vg-cor: #1d6b3f; } .vg-borda-NEGADA { --vg-cor: #a61b1b; } .vg-borda-CANCELADA { --vg-cor: #52606d; }
  .vg-borda-PRESTACAO_PENDENTE { --vg-cor: #be185d; } .vg-borda-PRESTACAO_DEVOLVIDA { --vg-cor: #9d174d; } .vg-borda-PRESTACAO_ENVIADA { --vg-cor: #0e7490; } .vg-borda-ACERTO_PENDENTE { --vg-cor: #4d7c0f; }

  /* prestação de contas (E2) */

      '<label class="vg-campo"><span>Código no Caju</span><input type="text" id="vgCcCaju" value="' + VgT_esc_(c.codigoCaju) + '"><span class="vg-dica">Exatamente como está no portal do Caju.</span></label>' +

      '<label class="vg-campo"><span>Situação</span><select id="vgCcAtivo"><option value="SIM"' + (c.ativo ? " selected" : "") + '>Ativo</option><option value="NAO"' + (!c.ativo ? " selected" : "") + ">Inativo (sai da lista de escolha)</option></select></label>" +
      '<label class="vg-campo largo"><span>Motivo *</span><input type="text" id="vgCcMot" placeholder="Ex.: nome conferido com o Financeiro"><span class="vg-dica">5 letras ou mais. Fica no histórico com o seu nome.</span></label></div>' +
      '<div class="vg-acoes"><button type="button" class="cadx-btn cadx-btn-primario cadx-btn-grande" data-vg-acao="1" onclick="VgT_salvarCentro_(\'' + VgT_esc_(c.id) + '\')">Gravar</button><button type="button" class="cadx-btn cadx-btn-grande" onclick="document.getElementById(\'vgCentroForm\').innerHTML=\'\'">Fechar</button></div></div>';
    try { el.scrollIntoView({ block: "start", behavior: "smooth" }); VgT_$(id ? "vgCcNome" : "vgCcCod").focus({ preventScroll: true }); } catch (e) {}
  }
  function VgT_salvarCentro_(id) {
    var v = function (k) { var e = VgT_$(k); return e ? e.value : ""; };
    var g = VG.guiado;
    VgT_chamar_("salvarCentro", { id: id, codigo: v("vgCcCod"), nome: v("vgCcNome"), unidade: v("vgCcUn"), area: v("vgCcArea"), responsavelId: v("vgCcResp"), codigoCaju: v("vgCcCaju"), codigoOmie: v("vgCcOmie"), ativo: v("vgCcAtivo"), motivo: v("vgCcMot") },
      function (r) { VG.opcoes = null; if (g && id) { VgT_guiadoAtualizar_(r); return; } VgT_desenharCentros_(r); VgT_msg_(r.message, "ok"); });
  }
</script>

  function CjT_chaveDica_(el) {
    var id = String(el.id || ""), nome = String(el.name || "");

    var m = id.match(/^(cj[A-Za-z]+_)/);
    if (m && m[1] === "cjMot_") return id.indexOf("cjMot_") === 0 && el.closest(".vg-faixa") && el.closest(".vg-faixa").querySelector('[id^="cjRes_"]') ? "cjMot_resolver" : "";
    return m && CJ_DICAS[m[1]] ? m[1] : "";
  }
  function CjT_dicas_(raiz) {
    if (!raiz || !raiz.querySelectorAll) return;
    raiz.querySelectorAll("input, select, textarea").forEach(function (el) {
      if (el.getAttribute("data-cj-dica")) return;
      var k = CjT_chaveDica_(el); el.setAttribute("data-cj-dica", "1"); if (!k) return;
      var t = k === "cjMot_resolver" ? CJ_DICAS_MOTIVO.divResolverOk : CJ_DICAS[k];

        var grupo = el.closest(".vg-tipos") || el.closest("label") || el;

    var agendado = false, obs = new MutationObserver(function () { if (agendado) return; agendado = true; setTimeout(function () { agendado = false; CjT_dicas_(tela); }, 0); });

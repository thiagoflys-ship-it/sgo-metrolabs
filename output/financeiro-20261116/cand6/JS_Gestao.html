<script>
  // ==========================================================
  // CAIXA DE DECISÕES DA GESTÃO E DESEMPENHO DA GESTÃO (20/10/2026)
  // Telas: abrir('gestao_decisoes') -> Gestao_renderCaixa_; abrir('gestao_desempenho') -> Gestao_renderDesempenho_.
  // Ganchos na casca (JS_Core): Gestao_iniciar_ no login, Gestao_parar_ no logout.
  // Atualização: o balão do menu a cada 5 min (só com a aba visível). A tela não se redesenha sozinha
  // (formulário de providência nunca é apagado no meio da digitação): recarrega depois de cada ação ou em "Atualizar".
  // ==========================================================
  var GD = { aba: "minhas", dados: null, timer: null, regras: null, aval: null, avalComp: "", avalGestor: "", abaDes: "notas", gerados: null };
  var GD_ETAPA = { NA_HORA: "Novo", EMAIL: "No e-mail diário", WHATSAPP: "Parado: cobrado no WhatsApp", DIRETORIA: "Com a Diretoria", PAUSADO: "Providência registrada", ACOMPANHAMENTO: "Acompanhamento" };

  function Gestao_esc_(v) { return escapeHtml_(v === 0 ? "0" : (v === null || v === undefined ? "" : String(v))); }
  function Gestao_perfil_() { return USER_CONTEXT ? String(USER_CONTEXT.perfil || "").toUpperCase() : ""; }
  // 21/10/2026: a Caixa de decisões abre também para RH e Financeiro (itens das áreas deles). O Desempenho da gestão
  // (avaliação do gestor) continua com quem é avaliado e com a Diretoria (Gestao_ehGestaoDecisao_).
  function Gestao_ehGestao_() { var p = Gestao_perfil_(); return ["ADMIN", "GESTOR", "DIRETORIA", "RH", "FINANCEIRO"].indexOf(p) !== -1; }
  function Gestao_ehGestaoDecisao_() { var p = Gestao_perfil_(); return p === "ADMIN" || p === "GESTOR" || p === "DIRETORIA"; }
  function Gestao_ehDiretoriaTela_() { return Gestao_perfil_() === "DIRETORIA" || !!(USER_CONTEXT && USER_CONTEXT.dono); }

  function Gestao_chamar_(fn, payload, ok, erro, opcoes) {
    var o = opcoes || {};
    if (o.carregando) SGO_iniciarCarregamento_(o.carregando);
    var fim = function () { if (o.carregando) SGO_finalizarCarregamento_(); };
    var falhou = function (msg) { fim(); if (erro) erro(msg); else if (!o.silencioso) Gestao_avisoTela_(msg); };
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) { falhou((res && res.message) || "Não foi possível concluir: o servidor não respondeu como esperado. Tente de novo."); return; }
        fim();
        try { if (ok) ok(res); } catch (e) { console.error("Gestão " + fn + ":", e); if (!o.silencioso) Gestao_avisoTela_("Não foi possível mostrar o resultado na tela: " + (e && e.message ? e.message : e) + ". Atualize a página (F5) e tente de novo."); }
      })
      .withFailureHandler(function (err) { falhou("Não foi possível falar com o servidor (" + ((err && err.message) || err) + "). Verifique a conexão e tente de novo; nada foi alterado."); })[fn](SGO_getSessionId(), payload || {});
  }

  /** 11/11/2026: aviso de erro na própria tela (no lugar da janela alert do navegador), com botão de fechar. */
  function Gestao_avisoTela_(msg) {
    var casca = document.querySelector("#conteudo .module-shell") || document.getElementById("conteudo");
    if (!casca) { console.error(msg); return; }
    var d = document.createElement("div");
    d.className = "gd-msg erro"; d.setAttribute("role", "alert");
    d.innerHTML = Gestao_esc_(msg) + ' <button type="button" class="btn-secondary" style="margin-left:8px" onclick="this.parentNode.remove()">Fechar</button>';

  /** Itens de decisão da aba, com os filtros: [{ i, k }] (k = posição em GD.dados.itens, usada pelos botões do cartão). */
  function Gestao_cxFiltrados_() {
    var f = GD_CX_F, b = String(f.busca || "").toLowerCase().trim(), out = [];
    (GD.dados.itens || []).forEach(function (i, k) {
      if (i.classe && i.classe !== "DECISAO") return;
      if (f.area && i.area !== f.area) return;
      if (f.resp && (i.responsaveisNomes || []).indexOf(f.resp) < 0) return;
      if (f.tipo && i.tipo !== f.tipo) return;
      if (f.prazo === "vencido" && !i.prazoVencido) return;
      if (f.prazo === "escalado" && !i.escalado) return;
      if (f.prazo === "noprazo" && (i.prazoVencido || i.escalado)) return;
      if (f.prazo === "novo" && i.etapa !== "NA_HORA") return;
      if (f.prazo === "diretoria" && !i.daDiretoria) return;
      if (b && (String(i.titulo) + " " + String(i.detalhe || "") + " " + (i.responsaveisNomes || []).join(" ") + " " + String(i.envolvido || "")).toLowerCase().indexOf(b) < 0) return;
      out.push({ i: i, k: k });

    return out;
  }

    // filtro que não existe mais na aba (ex.: área sem item) volta a "Todos"
    var tem = function (campo, fn) { if (GD_CX_F[campo] && !(d.itens || []).some(fn)) GD_CX_F[campo] = ""; };
    tem("area", function (i) { return i.area === GD_CX_F.area; }); tem("tipo", function (i) { return i.tipo === GD_CX_F.tipo; }); tem("resp", function (i) { return (i.responsaveisNomes || []).indexOf(GD_CX_F.resp) >= 0; });
    Gestao_desenharFiltrosCaixa_();

      (cad ? Gestao_esc_(cad) + (cad === 1 ? ' O.S. está' : ' O.S. estão') + ' sem vínculo de técnico ou cliente' : '') + '. Não aparecem na lista de decisões abaixo.</div>' +

  function Gestao_desenharFiltrosCaixa_() {
    var d = GD.dados, el = document.getElementById("gdFiltros");

      }).join("") + '</div></div>' +
      ((GD_CX_F.area || GD_CX_F.resp || GD_CX_F.tipo || GD_CX_F.prazo || GD_CX_F.busca) ? '<div><span class="gd-rot">&nbsp;</span><button type="button" class="btn-secondary" onclick="Gestao_cxLimpar_()">Limpar filtros</button></div>' : '') +
      '<div id="gdFiltrosSt" class="gd-f-st"></div>';

  function Gestao_kpiCaixa_(l) {
    var kp = function (v, rot, cls, prazo) { return '<button type="button" class="gd-kpi ' + (cls || "") + (prazo && GD_CX_F.prazo === prazo ? " sel" : "") + '" onclick="Gestao_cxFiltro_(\'prazo\', \'' + (GD_CX_F.prazo === prazo ? "" : prazo) + '\')" title="Filtrar a lista"><span class="v">' + Gestao_esc_(v) + '</span><span class="r">' + Gestao_esc_(rot) + '</span></button>'; };

  function Gestao_desenharCorpoCaixa_() {

    c.innerHTML = html + (d.cortado ? '<p class="gd-meta">A caixa tem mais de 3.000 itens: mostrando os 3.000 primeiros. Use os filtros.</p>' : '') + '<p class="gd-meta">Atualizado em ' + Gestao_esc_(d.geradoEm) + '.</p>';

  function Gestao_cxChave_(i) {
    var a = GD_CX_F.agrupar;
    if (a === "area") return [i.area || "-", i.areaNome || "Sem área", ""];
    if (a === "resp") { var n = (i.responsaveisNomes || []).join(", ") || "ninguém"; return [n, n, ""]; }
    return [i.tipo + "|" + (i.area || "-"), i.tipoNome || i.tipo, i.areaNome || ""];
  }

  function Gestao_cxGrupos_(l) {
    var g = {}, ordem = [];
    l.forEach(function (x) {
      var ch = Gestao_cxChave_(x.i), k = GD_CX_F.agrupar + ":" + ch[0];
      if (!g[k]) { g[k] = { k: k, nome: ch[1], sub: ch[2], l: [], venc: 0, esc: 0, rep: 0, antigo: "" }; ordem.push(k); }
      var y = g[k]; y.l.push(x);
      if (x.i.prazoVencido) y.venc++; if (x.i.escalado) y.esc++; if (x.i.repetidos) y.rep++;
      if (x.i.entrouDia && (!y.antigo || x.i.entrouDia < y.antigo)) y.antigo = x.i.entrouDia;
    });
    var gs = ordem.map(function (k) { return g[k]; }).sort(function (a, b) { return b.esc - a.esc || b.venc - a.venc || b.l.length - a.l.length || String(a.nome).localeCompare(String(b.nome), "pt-BR"); });
    GD.gruposCx = gs;

      var com = GD_CX_F.agrupar === "resp" ? "" : (function () { var m = {}; y.l.forEach(function (x) { (x.i.responsaveisNomes || []).forEach(function (p) { m[p] = 1; }); }); var ks = Object.keys(m); return ks.length ? "com " + ks.slice(0, 3).join(", ") + (ks.length > 3 ? " e mais " + (ks.length - 3) : "") : ""; })();
      return '<details class="gd-grupo' + (y.esc ? " esc" : y.venc ? " venc" : "") + '"' + (aberto ? " open" : "") + ' ontoggle="Gestao_grupoToggle_(' + n + ', this.open)">' +
        '<summary><span class="gd-g-n">' + Gestao_esc_(y.l.length) + '</span><span class="gd-g-t"><b>' + Gestao_esc_(y.nome) + '</b><span class="gd-meta">' + Gestao_esc_([y.sub, com].filter(Boolean).join(" · ")) + '</span></span>' +
        '<span class="gd-g-chips">' + (y.venc ? '<span class="gd-chip critico">' + y.venc + ' vencido' + (y.venc === 1 ? "" : "s") + '</span>' : '') + (y.esc ? '<span class="gd-chip aviso">' + y.esc + ' escalado' + (y.esc === 1 ? "" : "s") + '</span>' : '') +
        (y.rep ? '<span class="gd-chip">' + y.rep + ' do mesmo fato</span>' : '') + (y.antigo ? '<span class="gd-chip neutro">desde ' + br(y.antigo) + '</span>' : '') + '</span></summary>' +
        '<div class="gd-g-corpo">' + (aberto ? Gestao_cxCartoes_(y.l, qtd, y.k) : '') + '</div></details>';
    }).join("") + '</div>';
  }

  /** Pedido de nova data: a data proposta vira a previsão de entrega da atividade (servidor: Atividades_apiDecidirPedido). */
  function Gestao_aceitarPedido_(k) {
    var i = GD.dados && GD.dados.itens[k], box = document.getElementById("gdForm" + k), bt = document.getElementById("gdAceita" + k);

      if (box) box.innerHTML = '<div class="gd-msg ok">' + Gestao_esc_(res.message) + '</div>';
      setTimeout(function () { Gestao_carregarCaixa_(); }, 900);
    }, function (m) { if (bt) bt.disabled = false; if (box) box.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>'; }, { carregando: "Aceitando a nova data" });
  }

  /** Pedido de nova data: recusar com um motivo curto (a pessoa lê e propõe outra data ou conclui). */
  function Gestao_formRecusa_(k) {
    var box = document.getElementById("gdForm" + k), i = GD.dados.itens[k];
    if (!box || !i) return;
    if (box.querySelector("#gdRecTxt" + k)) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="gd-form">' +
      '<label for="gdRecTxt' + k + '">Por que a data não serve? (curto; ' + Gestao_esc_(i.pedido.responsavel || "a pessoa") + ' vai ler)</label>' +

  function Gestao_recusarPedido_(k) {
    var i = GD.dados.itens[k], st = document.getElementById("gdSt" + k), bt = document.getElementById("gdRecOk" + k);

    if (bt) bt.disabled = true;
    Gestao_chamar_("Atividades_apiDecidirPedido", { id: i.pedido.atividadeId, decisao: "RECUSAR", motivo: texto }, function (res) {
      if (st) st.innerHTML = '<div class="gd-msg ok">' + Gestao_esc_(res.message) + '</div>';
      setTimeout(function () { Gestao_carregarCaixa_(); }, 900);
    }, function (m) { if (bt) bt.disabled = false; if (st) st.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>'; });
  }

  function Gestao_abrirItem_(k) {
    var i = GD.dados && GD.dados.itens[k];
    if (!i || !i.tela) return;
    if (typeof Inicio_executarAcao_ === "function") Inicio_executarAcao_(i.tela);
    else if (i.tela.mod) abrir(i.tela.mod);
  }

  function Gestao_hojeMais_(dias) { var d = new Date(); d.setDate(d.getDate() + dias); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  function Gestao_formProvidencia_(k, ciente) {
    var box = document.getElementById("gdForm" + k), i = GD.dados.itens[k];

    box.innerHTML = '<div class="gd-form">' +
      '<label for="gdTxt' + k + '">' + (ciente ? "Avaliação da justificativa" : "O que foi feito") + '</label>' +
      '<textarea id="gdTxt' + k + '" maxlength="900" placeholder="' + (ciente ? "Ex.: Justificativa procede; a peça chegou hoje." : "Ex.: Liguei para o condutor; ele devolve hoje às 17h.") + '"></textarea>' +
      (ciente ? '' : '<label for="gdAte' + k + '">Acompanhar até (até ' + max + ' dias)</label><input type="date" id="gdAte' + k + '" min="' + Gestao_hojeMais_(0) + '" max="' + Gestao_hojeMais_(max) + '" value="' + Gestao_hojeMais_(3) + '">') +
      '<div class="gd-acoes"><button type="button" class="btn-primary" id="gdOk' + k + '" onclick="Gestao_registrar_(' + k + ', ' + (ciente ? "true" : "false") + ')">' + (ciente ? "Confirmar ciente" : "Registrar") + '</button>' +

  function Gestao_registrar_(k, ciente) {

  // ---------------- Regras e responsáveis ----------------

      }).join("") : '<span class="gd-meta">Ninguém com perfil de gestão ativo.</span>') + (sel.length ? '' : '<span class="gd-meta">Sem responsável: fica com a Diretoria.</span>') + '</div></div>';

    var num = function (id, rot, v, min, max) { return '<div class="gd-linha"><label for="' + id + '">' + Gestao_esc_(rot) + '</label><input type="number" id="' + id + '" min="' + min + '" max="' + max + '" value="' + Gestao_esc_(v) + '"' + dis + '></div>'; };
    var hora = function (id, rot, v) { return '<div class="gd-linha"><label for="' + id + '">' + Gestao_esc_(rot) + '</label><input type="time" id="' + id + '" value="' + Gestao_esc_(v) + '"' + dis + '></div>'; };
    c.innerHTML = (r.podeConfigurar ? '' : '<div class="gd-faixa">Só o Administrador e a Diretoria mudam estas regras. Você vê como estão.</div>') +
      '<div class="gd-regras"><div class="gd-caixa"><h3>Gestor responsável por área</h3><p class="gd-meta">Quem recebe os itens de cada área. Área sem responsável fica com a Diretoria (' + Gestao_esc_(r.diretoria.join(", ") || "ninguém com perfil Diretoria") + '). Ninguém decide sobre si mesmo: o item da própria pessoa vai para outro responsável ou para a Diretoria.</p>' + areas + '</div>' +
      '<div><div class="gd-caixa"><h3>Área de cada módulo</h3><p class="gd-meta">Usada quando o item não é de uma pessoa (padrão, veículo, documento). Item de uma pessoa vai para a área dela (Administração > Usuários > Áreas).</p>' + mods + '</div>' +
      '<div class="gd-caixa" style="margin-top:14px"><h3>Escada de cobrança</h3><p class="gd-meta">Sempre só em dia útil e no horário de trabalho (' + Gestao_esc_(r.expediente.ini) + ' a ' + Gestao_esc_(r.expediente.fim) + ', em Atividades da equipe > Avisos e horários).</p>' +
        chk("gdEmail", "E-mail diário com o resumo", e.emailDiario) + hora("gdHoraEmail", "Hora do e-mail diário", e.horaEmail) +
        chk("gdWhats", "Resumo pelo WhatsApp (um por dia, vínculo liberado)", e.whatsapp) + num("gdWhatsDias", "WhatsApp depois de quantos dias úteis parado", e.whatsDiasUteis, 1, 20) +
        num("gdDirDias", "Diretoria depois de quantos dias úteis parado", e.diretoriaDiasUteis, 2, 30) +
        chk("gdSemanal", "Relatório semanal à Diretoria (primeiro dia útil da semana)", e.semanal) + hora("gdHoraSemanal", "Hora do semanal", e.horaSemanal) +
        chk("gdMensal", "Relatórios do mês à Diretoria (primeiro dia útil do mês)", e.mensal) + '</div>' +
      '<div class="gd-caixa" style="margin-top:14px"><h3>Diretoria informada (resumo diário)</h3><p class="gd-meta">Decisão do dono (11/11/2026): a Diretoria é informada, não cobrada. Ligado, o que escala ou cai na Diretoria não vira aviso item a item: vai num resumo por dia útil (e-mail com a lista e o relatório diário da empresa, WhatsApp curto e alerta na tela), e a atividade vencida da Diretoria vira lembrete, sem justificativa obrigatória. O que só a Diretoria decide e os atos irreversíveis continuam na hora.</p>' +
        chk("gdDirResumo", "Resumo diário da Diretoria (no lugar dos avisos item a item)", !r.cfg.diretoriaResumo || r.cfg.diretoriaResumo.ligado !== false) + hora("gdDirHora", "Hora do resumo da Diretoria (dia útil)", (r.cfg.diretoriaResumo && r.cfg.diretoriaResumo.hora) || "08:30") + '</div>' +
      '<div class="gd-caixa" style="margin-top:14px"><h3>Automações</h3>' +
        chk("gdAutoCnh", "CNH: avisar o condutor com 30, 15 e 7 dias", au.cnhCondutor) + chk("gdAutoMan", "Manutenção prevista vira atividade do gestor da Frota", au.manutencaoAgenda) +
        chk("gdAutoSem", "Atividade sem responsável ativo volta para quem lançou", au.atividadeSemResponsavel) + chk("gdAutoRel", "Gerar os relatórios do mês sozinho", au.relatoriosMensais) + '</div>' +
      Gestao_htmlSedna_(r.sedna, dis, chk, hora) + '</div></div>' +
      '<div class="gd-acoes">' + (r.podeConfigurar ? '<button type="button" class="btn-primary" id="gdSalvarRegras" onclick="Gestao_salvarRegras_()">Salvar regras</button>' : '') +

  // 26/10/2026: escalonamento das atividades atrasadas por prioridade e resumo do dia da gestão (SGO_Sedna.js)
  var GD_SEDNA_PRI = ["Urgente", "Alta", "Normal", "Baixa"];
  function Gestao_htmlSedna_(sd, dis, chk, hora) {
    if (!sd) return "";
    var linhas = GD_SEDNA_PRI.map(function (p) {
      var h = (sd.escalonamento.horas || {})[p] || [];
      return '<tr><th scope="row">' + Gestao_esc_(p) + '</th>' + [0, 1, 2].map(function (i) {
        return '<td><input type="number" step="0.25" min="0.25" max="720" data-gd-sed="' + p + '" data-gd-sed-i="' + i + '" value="' + Gestao_esc_(h[i]) + '" aria-label="' + Gestao_esc_(p + ", " + ["responsável", "gestor da área", "Diretoria"][i] + " (horas)") + '"' + dis + '></td>';
      }).join("") + '</tr>';
    }).join("");
    return '<div class="gd-caixa" style="margin-top:14px"><h3>Atividade atrasada: escalonamento por prioridade</h3>' +
      '<p class="gd-meta">Horas corridas depois da previsão vencer. Cada nível avisa uma vez por atividade e por previsão, só no horário de trabalho (o que passar à noite sai no começo do expediente). Canais em Administração > Matriz de avisos (S71, S72 e S73).</p>' +
      chk("gdSedEsc", "Escalonar as atividades atrasadas", sd.escalonamento.ligado) +
      '<div class="gd-tabela-rolagem"><table class="gd-sedna"><thead><tr><th scope="col">Prioridade</th><th scope="col">Responsável</th><th scope="col">Gestor da área</th><th scope="col">Diretoria</th></tr></thead><tbody>' + linhas + '</tbody></table></div>' +
      '<h3 style="margin-top:14px">Resumo do dia da gestão</h3><p class="gd-meta">No Início de cada pessoa da gestão, uma vez por dia: o que começar primeiro, atrasadas da equipe, as dela e a central de pendências.</p>' +
      chk("gdSedBrief", "Mostrar o resumo do dia no Início", sd.briefing.ligado) + hora("gdSedHora", "A partir de que hora", sd.briefing.hora) +
      chk("gdSedIA", "Texto reescrito pela IA (conferido com os dados; se não passar, vale o texto das regras)", sd.briefing.ia) + '</div>';
  }

  function Gestao_lerSedna_() {
    if (!document.getElementById("gdSedEsc")) return null;
    var horas = {};
    GD_SEDNA_PRI.forEach(function (p) { horas[p] = [0, 1, 2].map(function (i) { var e = document.querySelector('[data-gd-sed="' + p + '"][data-gd-sed-i="' + i + '"]'); return e ? Number(String(e.value).replace(",", ".")) : NaN; }); });
    var ck = function (id) { var e = document.getElementById(id); return !!(e && e.checked); };
    return { escalonamento: { ligado: ck("gdSedEsc"), horas: horas }, briefing: { ligado: ck("gdSedBrief"), hora: (document.getElementById("gdSedHora") || {}).value || "", ia: ck("gdSedIA") } };
  }

  function Gestao_salvarRegras_() {
    var gpa = {}, apm = {};
    document.querySelectorAll("[data-gd-area]").forEach(function (cb) { if (cb.checked) (gpa[cb.getAttribute("data-gd-area")] = gpa[cb.getAttribute("data-gd-area")] || []).push(cb.value); });
    document.querySelectorAll("[data-gd-mod]").forEach(function (s) { apm[s.getAttribute("data-gd-mod")] = s.value; });
    var v = function (id) { var e = document.getElementById(id); return e ? e.value : ""; }, ck = function (id) { var e = document.getElementById(id); return !!(e && e.checked); };
    var st = document.getElementById("gdRegrasSt"), bt = document.getElementById("gdSalvarRegras");
    if (bt) bt.disabled = true;
    Gestao_chamar_("Gestao_apiConfig", { salvar: { gestoresPorArea: gpa, areaPorModulo: apm,
      escada: { emailDiario: ck("gdEmail"), horaEmail: v("gdHoraEmail"), whatsapp: ck("gdWhats"), whatsDiasUteis: Number(v("gdWhatsDias")), diretoriaDiasUteis: Number(v("gdDirDias")), semanal: ck("gdSemanal"), horaSemanal: v("gdHoraSemanal"), mensal: ck("gdMensal") },
      automacoes: { cnhCondutor: ck("gdAutoCnh"), manutencaoAgenda: ck("gdAutoMan"), atividadeSemResponsavel: ck("gdAutoSem"), relatoriosMensais: ck("gdAutoRel") }, sedna: Gestao_lerSedna_(),
      diretoriaResumo: document.getElementById("gdDirResumo") ? { ligado: ck("gdDirResumo"), hora: v("gdDirHora") } : undefined } }, function (res) {
      GD.regras = res; Gestao_desenharRegras_();
      var s2 = document.getElementById("gdRegrasSt"); if (s2) s2.innerHTML = '<div class="gd-msg ok">' + Gestao_esc_(res.message) + '</div>';
    }, function (m) { if (bt) bt.disabled = false; if (st) st.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>'; });
  }

  // ---------------- Relatório diário da empresa (11/11/2026) ----------------
  // O servidor gera o HTML A4 (SGO_Gestao_RelatorioDiario.js) e confere a caixa «Ver o relatório diário da empresa» em toda chamada.

  function Gestao_renderRelatorioDia_() {

      '<div class="gd-acoes" style="flex-wrap:wrap"><button type="button" class="btn-primary" onclick="Gestao_relatorioDiaGerar_()"><i class="fas fa-rotate" aria-hidden="true"></i>&nbsp;Gerar agora</button>' +
      '<button type="button" class="btn-secondary" id="gdRelBaixar" disabled onclick="Gestao_relatorioDiaBaixar_()"><i class="fas fa-download" aria-hidden="true"></i>&nbsp;Baixar (HTML)</button>' +
      '<button type="button" class="btn-secondary" id="gdRelImprimir" disabled onclick="Gestao_relatorioDiaImprimir_()"><i class="fas fa-print" aria-hidden="true"></i>&nbsp;Imprimir ou salvar em PDF</button></div>' +
      '<div id="gdRelSt"></div><iframe id="gdRelQuadro" title="Relatório diário da empresa" style="width:100%;max-width:100%;min-height:70vh;border:1px solid var(--border);background:#fff;margin-top:10px"></iframe></div>';
    Gestao_relatorioDiaGerar_();

  function Gestao_relatorioDiaGerar_() {
    var st = document.getElementById("gdRelSt");
    if (st) st.innerHTML = '<div class="gd-msg">Gerando o relatório com os dados de agora...</div>';
    Gestao_chamar_("Gestao_apiRelatorioDiario", {}, function (res) {
      GD_REL.html = res.html || ""; GD_REL.nome = res.nome || "Relatorio diario da empresa";

        item("Planos de ação no prazo", v(i.pctPlanos, function (x) { return Gestao_n_(x, 1) + "% (" + i.planosOk + " de " + i.planos + ")"; }), comp.planos) +
      '</div><div class="gd-dois" style="margin-top:10px"><div>' + Gestao_gruposTipo_("Chegaram à Diretoria no mês", g.grupos.escalados) + '</div><div>' + Gestao_gruposTipo_("Prazos vencidos no mês", g.grupos.vencidos) + '</div></div>' +
      (g.foraDaNota ? '<p class="gd-meta">Fora da nota: ' + g.foraDaNota + ' O.S. do Auvo no saneamento (antigas ou sem vínculo).</p>' : '') + '</details>';
  }

  /** O que está aberto agora, agrupado por tipo e área. Saneamento e cadastro à parte; sigilo só conta. */
  function Gestao_htmlAbertos_(a) {
    GD.desItens = [];
    var classes = [["DECISAO", "Decisões abertas", "Contam no desempenho. Toque no grupo para ver os itens e o botão de resolver."],
      ["SANEAMENTO", "Saneamento: O.S. do Auvo abertas há mais de " + a.saneamento.corte + " dias", "Acúmulo antigo: fora da avaliação. Confira no Auvo e marque em lote no saneamento."],
      ["CADASTRO", "Cadastro: O.S. sem vínculo de técnico ou cliente", "Uma causa por técnico do Auvo sem cadastro: vincule em Integração Auvo. Fora da avaliação."]];
    var h = '';
    classes.forEach(function (cl) {
      var gs = a.grupos.filter(function (g) { return g.classe === cl[0]; });
      if (!gs.length) return;
      var tot = gs.reduce(function (s, g) { return s + g.qtd; }, 0);
      h += '<div class="gd-caixa' + (cl[0] !== "DECISAO" ? " gd-caixa-san" : "") + '" style="margin-bottom:14px"><h3>' + Gestao_esc_(cl[1]) + ' (' + tot + ')</h3><p class="gd-meta">' + Gestao_esc_(cl[2]) + '</p>' +
        (cl[0] !== "DECISAO" && Gestao_ehGestao_() ? '<div class="gd-acoes" style="margin:0 0 8px"><button type="button" class="btn-primary" onclick="Gestao_abrirSaneamento_()">Ver e sanear</button></div>' : '') +
        gs.map(function (g) {
          return '<details class="gd-grupo' + (g.escalados ? " esc" : g.vencidos ? " venc" : "") + '"><summary><span class="gd-g-n">' + g.qtd + '</span><span class="gd-g-t"><b>' + Gestao_esc_(g.nome) + '</b><span class="gd-meta">' + Gestao_esc_(g.areaNome) + '</span></span><span class="gd-g-chips">' +
            (g.vencidos ? '<span class="gd-chip critico">' + g.vencidos + ' vencido' + (g.vencidos === 1 ? '' : 's') + '</span>' : '') + (g.escalados ? '<span class="gd-chip aviso">' + g.escalados + ' escalado' + (g.escalados === 1 ? '' : 's') + '</span>' : '') +
            (g.repetidos ? '<span class="gd-chip">' + g.repetidos + ' do mesmo fato</span>' : '') + (g.origemMaisAntigaBr ? '<span class="gd-chip neutro">aberta no Auvo desde ' + Gestao_esc_(g.origemMaisAntigaBr) + '</span>' : g.maisAntigoBr ? '<span class="gd-chip neutro">na caixa desde ' + Gestao_esc_(g.maisAntigoBr) + '</span>' : '') + '</span></summary>' +
            '<div class="gd-g-corpo">' + (g.sigilo ? '<div class="gd-meta">Programa de conduta e Qualidade: só a contagem (sigilo). Quem pode ver resolve na Caixa de decisões.</div>' :
              '<div class="gd-tabela-rolar"><table class="gd-tabela gd-cartoes-cel"><thead><tr><th>Item</th><th>Com quem</th><th>Na caixa</th><th>Prazo</th><th></th></tr></thead><tbody>' + g.itens.map(function (i) {
                var k = GD.desItens.push(i) - 1;
                return '<tr><td data-r="Item">' + Gestao_esc_(i.titulo) + (i.repetido ? ' <span class="gd-chip">mesmo fato</span>' : '') + '</td><td data-r="Com quem">' + Gestao_esc_(i.com) + '</td><td data-r="Na caixa">desde ' + Gestao_esc_(i.entrou) + (i.dias !== null ? ' <span class="gd-meta">(' + i.dias + ' dias)</span>' : '') + '</td>' +
                  '<td data-r="Prazo">' + Gestao_esc_(i.prazo || "—") + (i.escalado ? ' <span class="gd-selo DIRETORIA">Escalado</span>' : i.vencido ? ' <span class="gd-selo vencido">Vencido</span>' : '') + '</td><td>' +
                  (i.tela ? '<button type="button" class="btn-secondary" onclick="Gestao_desAbrirItem_(' + k + ')">' + Gestao_esc_((i.tela && i.tela.rotulo) || "Resolver") + '</button>' : '') + '</td></tr>';
              }).join("") + '</tbody></table></div>' + (g.mais ? '<p class="gd-meta">e mais ' + g.mais + '. Use os filtros ou a Caixa de decisões para ver todos.</p>' : '')) + '</div></details>';
        }).join("") + '</div>';
    });
    return h || '<div class="gd-vazio">Nada aberto com estes filtros.</div>';
  }
  function Gestao_desAbrirItem_(k) {
    var i = (GD.desItens || [])[k];
    if (!i || !i.tela) return;
    if (i.tela.tipo === "link" && i.tela.url) { try { window.open(i.tela.url, "_blank", "noopener"); } catch (e) {} return; }
    if (typeof Inicio_executarAcao_ === "function") Inicio_executarAcao_(i.tela); else if (i.tela.mod) abrir(i.tela.mod);
  }

  function Gestao_htmlRegraNota_(a) {
    var r = a.regras;
    var h = '<div class="gd-caixa"><h3>Como a nota é calculada</h3><p class="gd-txt">Cada item vira uma nota de 0 a 100 e a nota do mês é a média dos itens que tiveram dado, cada um com o seu peso. Item sem dado no mês fica de fora e os pesos dos outros são ajustados. Faixa verde a partir de ' + r.farol.verde + ', amarela a partir de ' + r.farol.amarelo + ', vermelha abaixo. Vencimentos de clientes (acompanhamento) não entram. Dias sem acesso contam desde ' + Gestao_esc_(r.implantadoEm || "a ligação da caixa") + '.</p>' +
      '<div class="gd-tabela-rolar"><table class="gd-tabela"><thead><tr><th>Item</th><th class="n">Peso</th><th>Como é contado</th></tr></thead><tbody>' +
      r.componentes.map(function (k) { return '<tr><td>' + Gestao_esc_(k.nome) + '</td><td class="n">' + Gestao_esc_(r.pesos[k.chave]) + '</td><td>' + Gestao_esc_(r.textos[k.chave]) + '</td></tr>'; }).join("") + '</tbody></table></div>' +
      '<p class="gd-just">Fora da nota (11/11/2026): O.S. do Auvo que chegou à Caixa com mais de ' + Gestao_esc_(r.saneamentoDias || 30) + ' dias em aberto no Auvo (acúmulo antigo), O.S. sem vínculo de técnico ou cliente (cadastro) e O.S. saneadas. Elas ficam no saneamento da Caixa. A O.S. que entrou nova e envelheceu na Caixa continua contando: aí o atraso é da gestão.</p>' +
      '<p class="gd-meta">Falha grave recorrente (faixa vermelha dois meses seguidos, ou 3 vezes ou mais no mês em que o assunto subiu para a Diretoria) vira sugestão no Programa de conduta só para a Diretoria decidir. Nunca vira ocorrência sozinha.</p></div>';
    if (a.podeConfigurar) {
      h += '<div class="gd-caixa" style="margin-top:14px"><h3>Pesos e faixas (Diretoria)</h3>' + r.componentes.map(function (k) {
        return '<div class="gd-linha"><label for="gdPeso_' + k.chave + '">' + Gestao_esc_(k.nome) + '</label><input type="number" min="0" max="100" id="gdPeso_' + k.chave + '" value="' + Gestao_esc_(r.pesos[k.chave]) + '"></div>';
      }).join("") + '<div class="gd-linha"><label for="gdVerde">Verde a partir de</label><input type="number" min="1" max="100" id="gdVerde" value="' + r.farol.verde + '"></div>' +
        '<div class="gd-linha"><label for="gdAmarelo">Amarelo a partir de</label><input type="number" min="0" max="99" id="gdAmarelo" value="' + r.farol.amarelo + '"></div>' +
        '<div class="gd-linha"><label for="gdSanDias">O.S. do Auvo fica fora da nota quando chega à Caixa com mais de quantos dias em aberto (7 a 365)</label><input type="number" min="7" max="365" id="gdSanDias" value="' + Gestao_esc_(r.saneamentoDias || 30) + '"></div>' +
        '<div class="gd-linha"><label for="gdSug">Gerar sugestão no Programa de conduta para falha grave recorrente</label><input type="checkbox" id="gdSug"' + (r.sugestaoConduta === false ? '' : ' checked') + '></div>' +
        '<div class="gd-acoes"><button type="button" class="btn-primary" onclick="Gestao_salvarPesos_()">Salvar pesos</button></div><div id="gdPesosSt"></div></div>';
    }
    return h;
  }

  function Gestao_salvarPesos_() {
    var pesos = {};
    GD.aval.regras.componentes.forEach(function (k) { pesos[k.chave] = Number((document.getElementById("gdPeso_" + k.chave) || {}).value); });
    var st = document.getElementById("gdPesosSt");
    Gestao_chamar_("Gestao_apiConfigAvaliacao", { salvar: { pesos: pesos, farol: { verde: Number(document.getElementById("gdVerde").value), amarelo: Number(document.getElementById("gdAmarelo").value) }, sugestaoConduta: !!document.getElementById("gdSug").checked, saneamentoDias: Number((document.getElementById("gdSanDias") || {}).value || 30) } }, function (res) {
      if (st) st.innerHTML = '<div class="gd-msg ok">' + Gestao_esc_(res.message) + '</div>';
      setTimeout(function () { Gestao_carregarDesempenho_(); }, 800);
    }, function (m) { if (st) st.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>'; });
  }

  // 29/10/2026: relatórios da empresa (SGO_Gestao_RelatoriosEmpresa.js): quem recebe, ligar/desligar e envio de teste
  function Gestao_desenharRelatorios_() {
    var corpo = document.getElementById("gdDesCorpo");
    corpo.innerHTML = '<div id="gdEmpresa"><div class="gd-vazio">Carregando os relatórios da empresa...</div></div>' +
      '<div class="gd-caixa" style="margin-top:14px"><h3>Relatórios gerados pela rotina</h3><div id="gdRelLista"><div class="gd-vazio">Carregando a lista...</div></div></div>';
    Gestao_carregarRelEmpresa_();
    var c = document.getElementById("gdRelLista");
    Gestao_chamar_("Gestao_apiRelatoriosGerados", {}, function (res) {
      if (!res.itens.length) { c.innerHTML = '<div class="gd-vazio">Os relatórios automáticos aparecem aqui depois do primeiro dia útil da semana (semanal) e do mês (mensais).</div>'; return; }
      c.innerHTML = '<div class="gd-tabela-rolar"><table class="gd-tabela"><thead><tr><th>Relatório</th><th>Gerado em</th><th>Situação</th><th></th></tr></thead><tbody>' + res.itens.map(function (r) {
        return '<tr><td>' + Gestao_esc_(r.nome) + (r.motivo && r.situacao !== "Gerado" ? '<div class="gd-meta">' + Gestao_esc_(r.motivo) + '</div>' : '') + '</td><td>' + Gestao_esc_(r.dia) + '</td><td>' + Gestao_esc_(r.situacao) + '</td><td>' +
          (r.link && /^https?:\/\//i.test(r.link) ? '<a href="' + Gestao_esc_(r.link) + '" target="_blank" rel="noopener">Abrir o PDF</a>' : '') + '</td></tr>';
      }).join("") + '</tbody></table></div>';
    }, function (m) { c.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>'; });
  }

  function Gestao_carregarRelEmpresa_(payload, aviso) {
    var c = document.getElementById("gdEmpresa");
    if (!c) return;
    Gestao_chamar_("Gestao_apiRelatoriosEmpresa", payload || {}, function (res) {
      GD.relEmp = res;
      Gestao_desenharRelEmpresa_(res.message || aviso || "", "ok");
    }, function (m) {
      if (GD.relEmp && payload && payload.salvar) { Gestao_desenharRelEmpresa_(m, "erro"); return; }
      c.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>';
    }, payload && payload.salvar ? { carregando: "Salvando a lista" } : {});
  }

  function Gestao_desenharRelEmpresa_(msg, tipoMsg) {
    var r = GD.relEmp, c = document.getElementById("gdEmpresa");
    if (!r || !c) return;
    var dis = r.podeConfigurar ? "" : " disabled";
    var pessoa = function (p) {
      return '<label><input type="checkbox" class="gdEmpDest" value="' + Gestao_esc_(p.id) + '"' + (p.marcado ? " checked" : "") + dis + '> ' + Gestao_esc_(p.nome) +
        ' <span class="gd-meta">(' + Gestao_esc_(p.perfil) + (p.area ? ", " + Gestao_esc_(p.area) : "") + (p.diretoria ? ", Diretoria" : p.veNomes ? ", vê nomes da Conduta" : "") + ')</span></label>';
    };
    var hist = (r.historico || []).slice(0, 25);
    c.innerHTML = '<div class="gd-caixa"><h3>Relatórios da empresa</h3>' +
      '<p class="gd-txt">No primeiro dia útil da semana (a partir das ' + Gestao_esc_(r.hora) + ') e no primeiro dia útil do mês, o SGO+ gera sozinho os relatórios e manda um e-mail só para cada pessoa da lista. ' +
      'Semanal: gestão, Programa de conduta (equipe e missões), Frota, Comercial e SEDNA da semana anterior. Mensal: Saúde da empresa (primeira página), os mensais da gestão e o fechamento do Programa de conduta. ' +
      'O e-mail sai quando tudo fica pronto ou às ' + Gestao_esc_(r.horaLimite) + ', com o que ficou pronto e o motivo do resto.</p>' +
      '<p class="gd-meta">Próximo pacote semanal: ' + Gestao_esc_(r.proximoSemanal || "—") + '. Próximo mensal: ' + Gestao_esc_(r.proximoMensal || "—") + '. Relatório com nomes do Programa de conduta vai só para quem vê o envolvido (Diretoria e Gestor de Qualidade); a avaliação dos gestores, só para a Diretoria.</p>' +
      (msg ? '<div class="gd-msg ' + (tipoMsg === "erro" ? "erro" : "ok") + '">' + Gestao_esc_(msg) + '</div>' : '') +
      '<div class="gd-linha"><label for="gdEmpLigado">Enviar os relatórios da empresa em e-mail próprio (desligado: os links voltam ao e-mail diário da Diretoria)</label><input type="checkbox" id="gdEmpLigado"' + (r.ligado ? " checked" : "") + dis + '></div>' +
      '<label class="gd-meta" style="display:block;margin:8px 0 4px;font-weight:700">Quem recebe os relatórios da empresa' + (r.padrao ? " (padrão: Diretoria e gestor da Qualidade)" : "") + '</label>' +
      '<div class="gd-checks">' + (r.candidatos || []).map(pessoa).join("") + '</div>' +
      (r.atualizadoPor ? '<p class="gd-meta">Última alteração: ' + Gestao_esc_(r.atualizadoPor) + ' em ' + Gestao_esc_(r.atualizadoEm) + '.</p>' : '') +
      (r.podeConfigurar ? '<div class="gd-acoes"><button type="button" class="btn-primary" onclick="Gestao_salvarRelEmpresa_(false)">Salvar lista</button><button type="button" class="btn-secondary" onclick="Gestao_salvarRelEmpresa_(true)">Voltar ao padrão</button>' +
        '<button type="button" class="btn-secondary" onclick="Gestao_testeRelEmpresa_(\'semanal\')">Gerar e enviar agora (teste): semanal</button><button type="button" class="btn-secondary" onclick="Gestao_testeRelEmpresa_(\'mensal\')">Gerar e enviar agora (teste): mensal</button></div>' +
        '<p class="gd-meta">O teste gera o que ainda falta e manda o pacote só para você (pode levar alguns minutos). Não conta como envio do pacote de verdade.</p>'
        : '<p class="gd-meta">Só a Diretoria e o Administrador mudam a lista.</p>') +
      '<div id="gdEmpSt"></div>' +
      (hist.length ? '<div class="gd-tabela-rolar" style="margin-top:10px"><table class="gd-tabela"><thead><tr><th>Dia</th><th>Pacote</th><th>O quê</th><th>Situação</th><th></th></tr></thead><tbody>' + hist.map(function (h) {
        return '<tr><td>' + Gestao_esc_(h.dia) + '</td><td>' + Gestao_esc_(h.referencia) + '</td><td>' + Gestao_esc_(h.tipo) + ': ' + Gestao_esc_(h.nome) + (h.motivo && h.situacao !== "OK" ? '<div class="gd-meta">' + Gestao_esc_(h.motivo) + '</div>' : '') + '</td><td>' +
          Gestao_esc_(h.situacao === "OK" ? "Feito" : h.situacao === "SEM_DADO" ? "Sem dado" : h.situacao === "PULADO" ? "Não saiu" : "Falhou") + '</td><td>' +
          (h.link && /^https?:\/\//i.test(h.link) ? '<a href="' + Gestao_esc_(h.link) + '" target="_blank" rel="noopener">Abrir o PDF</a>' : '') + '</td></tr>';
      }).join("") + '</tbody></table></div>' : '<p class="gd-meta">Nenhum pacote gerado ainda.</p>') + '</div>';
  }

  function Gestao_salvarRelEmpresa_(padrao) {
    var ids = Array.prototype.slice.call(document.querySelectorAll(".gdEmpDest")).filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
    var ligado = !!(document.getElementById("gdEmpLigado") || {}).checked;
    Gestao_carregarRelEmpresa_({ salvar: { ligado: ligado, destinatarios: padrao ? [] : ids, padrao: !!padrao } });
  }

  function Gestao_testeRelEmpresa_(tipo) {
    var st = document.getElementById("gdEmpSt");
    if (st) st.innerHTML = '<div class="gd-msg ok">Gerando e enviando o pacote de teste. Pode levar alguns minutos; não feche a tela.</div>';
    Gestao_chamar_("Gestao_apiRelatoriosEmpresaTeste", { tipo: tipo }, function (res) {
      Gestao_carregarRelEmpresa_(null, res.message);
    }, function (m) { if (st) st.innerHTML = '<div class="gd-msg erro">' + Gestao_esc_(m) + '</div>'; }, { carregando: "Gerando o pacote de teste" });
  }

  function Gestao_gerarRelatorio_(tipo, gestorId) {
    var w = window.open("", "_blank");
    try { if (w) w.document.write("<p style='font-family:Arial,sans-serif;padding:40px;color:#374151;font-size:16px'>Montando o relatório, aguarde...</p>"); } catch (e) {}
    Gestao_chamar_("Gestao_apiRelatorio", { tipo: tipo, competencia: GD.avalComp, gestorId: gestorId || "" }, function (res) {
      if (w && !w.closed) { w.document.open(); w.document.write(res.html); w.document.close(); }
      else Gestao_avisoTela_("O navegador bloqueou a janela do relatório. Libere as janelas do SGO+ e toque de novo." + (res.link ? " O PDF também ficou guardado na pasta." : ""));
    }, function (m) {
      if (w && !w.closed) w.document.write("<p style='font-family:Arial,sans-serif;padding:40px;color:#7f1d1d;font-size:16px'>" + Gestao_esc_(m) + "</p>");
      else Gestao_avisoTela_(m);
    });
  }
</script>
